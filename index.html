/** o conteúdo da sessão só se escolhe com a disciplina definida (escolhida ou digitada) */
function travarConteudos(form){
  const campo = form && form.querySelector("#campoAssunto");
  if (!campo) return;
  const disc = disciplinaDoForm(form), travar = !disc;
  const aviso = form.querySelector("#avisoDisciplinaPrimeiro");
  if (campo.disabled !== travar || !travar) campo.innerHTML = opcoesDeConteudo(disc, lerAssuntosForm(form));
  campo.disabled = travar;
  if (aviso) aviso.hidden = !travar;
  if (travar){ const nome = form.querySelector("#novoConteudoNome"); if (nome){ nome.value = ""; nome.hidden = true; } }
}
/** lê a disciplina escolhida (ou digitada, se for nova) e a cadastra */
function lerDisciplina(form){
  const sel = form.querySelector("select.sel-disciplina");
  if (!sel) return (form.disciplina ? form.disciplina.value.trim() : "");
  if (sel.value === "__nova"){
    const inp = form.querySelector(".nova-disciplina");
    return registrarDisciplina(inp ? inp.value : "");
  }
  return sel.value;
}

/* O CAMPO NÃO É <label>. Era, e o <label> ocupa a linha inteira: clicar no
   branco ao lado de "Data da prova" abria o calendário. Agora só o controle
   responde ao clique; o nome continua ligado a ele (aria-labelledby) para quem
   usa leitor de tela. */
let seqCampo = 0;
function campo(rot, inner, largo, ajuda){
  const id = "rotCampo" + (++seqCampo);
  const ligado = inner.replace(/<(input|select|textarea)\b(?![^>]*type="(?:hidden|checkbox|radio)")/,
                               m => m + ' aria-labelledby="' + id + '"');
  return '<div class="campo'+(largo?" largo":"")+'"><span id="'+id+'">'+esc(rot)+'</span>'+ligado+
    (ajuda ? '<span class="ajuda-campo">'+esc(ajuda)+'</span>' : '') + '</div>';
}
/** Assuntos da sessão: vários, em etiquetas. A descrição continua sendo um campo só. */
/* O TEXTO DA ETIQUETA NÃO SE DIGITA. Já se digitou: o nome mudava só NESTA
   sessão, e era assim que nasciam "LAI", "LAI " e "Lei de acesso" como três
   fichas da mesma coisa. O ✎ resolve pelo outro lado — ele renomeia a FICHA,
   pelo mesmo caminho da aba Disciplinas, e o nome muda em todo o sistema.
   O gesto diz "renomear", não "digitar por cima": nada a adivinhar entre
   renomear, trocar de conteúdo e criar um novo.                             */
const tagAssunto = a => '<span class="tag" data-assunto="'+esc(a)+'">' +
  '<span class="txt">'+esc(a)+'</span>' +
  '<button type="button" class="ren" data-acao="renomear-no-form" ' +
    'aria-label="Renomear '+esc(a)+' em todo o sistema" ' +
    'title="Renomear em todo o sistema — nas sessões, na agenda e nas anotações">✎</button>' +
  '<button type="button" data-acao="remover-assunto" aria-label="Remover '+esc(a)+'">✕</button></span>';
/* ---------- tipo da sessão: estudo ou revisão ----------
   Revisão = a sessão cumpre uma revisão agendada. O conteúdo vem dela (por isso
   as etiquetas ficam travadas), não gera cronograma novo e as caixas de
   integração somem — nada disso faz sentido numa revisão.                     */
function campoTipoSessao(v, ed){
  const atual = TIPOS_SESSAO[v.tipo] ? v.tipo : "estudo";
  // sessão de estudo só vira revisão (ou estudo/revisão) no mesmo dia em que foi registrada
  const travado = ed && ed.tipo === "estudo" && ed.data !== D.hoje();
  // estudo/revisão não volta a ser só estudo: ela cumpre uma revisão e as horas já estão lá
  const semEstudo = ed && ed.tipo === "misto";
  const concluido = sessaoDeConcluido(v, ed);
  const opcao = (valor, rotulo, desligado) =>
    '<label class="opcao'+(desligado ? " fixa" : "")+'">' +
      '<input type="radio" name="tipo" value="'+valor+'" id="tipo'+valor[0].toUpperCase()+valor.slice(1)+'"' +
      (atual === valor ? " checked" : "") + (desligado ? " disabled" : "") + '>' +
      '<span>'+rotulo+'</span></label>';
  const avisos = [
    semEstudo ? "estudo/revisão só volta a ser revisão: ela cumpre uma revisão que já está marcada" : "",
    concluido ? "conteúdo concluído: para estudar de novo, reabra o conteúdo" : ""
  ].filter(Boolean);
  /* Os três tipos respondem "o que eu fiz nesta sessão" — e só isso. Se o
     CONTEÚDO está aberto ou fechado é outra pergunta, que a fase responde.
     Os rótulos dizem quando cada um cabe, porque com as fases o caminho comum
     mudou: conteúdo aberto se continua com Estudo, fechando a volta.        */
  return '<div class="campo largo"><span>Esta sessão é *</span><div class="opcoes">' +
    opcao("estudo",  "Estudo — conteúdo novo ou continuação",
                     (travado && atual !== "estudo") || semEstudo || concluido) +
    opcao("revisao", "Revisão — conteúdo que já fechei", travado && atual === "estudo") +
    /* Estudo/Revisão saiu de cena: com a fase do conteúdo respondendo "isto
       ainda está aberto?", ele virou rótulo sem função. Só aparece em sessão
       antiga que já esteja marcada assim, para ela não mudar de tipo sozinha. */
    (atual === "misto"
      ? opcao("misto", "Estudo/Revisão (rótulo antigo)", travado && atual === "estudo")
      : "") +
    (avisos.length ? '<span class="dica-fmt">'+esc(avisos.join(" · "))+'</span>' : '') +
    '</div><div id="painelRevisao">' + htmlPainelRevisao(v, ed) + '</div></div>';
}
/* ESTUDAR JUNTO (28/09). Outros itens da mesma disciplina, de hoje ou
   atrasados, que a sessão pode cumprir junto com o principal. Marcar a caixa
   só põe o conteúdo do item na sessão: quem cumpre é a regra de sempre
   (cumprirJuntas), que vale também para quem adiciona o conteúdo à mão.
   CARD DUPLICADO DO MESMO CONTEÚDO (pedido do Pedro, 30/09). Ficaram dois
   cards iguais — o de ontem que você não conseguiu marcar e o de hoje — e a
   lista escondia o outro, porque o conteúdo dele já estava na sessão. Agora
   ele aparece (marcado com a data, para você saber qual é) e, como o conteúdo
   sozinho não distingue um card do outro, quem manda aqui é a CAIXA: só o que
   você marca é cumprido junto. `mesmo` = é o conteúdo do principal. */
function itensParaJuntar(v, ed){
  const disc = v.disciplina || "";
  if (!disc) return [];
  const dia = v.data || D.hoje();
  const eRev = ehTipoRevisao(v.tipo);
  const principal = acharRevisao(v.revisaoId || (ed && ed.revisaoId) || "");
  const doPrincipal = new Set((((principal && contextoRevisao(principal)) || {}).assuntos || []).map(a => a.toLowerCase()));
  return db.revisoes
    .filter(r => r !== principal && r.data <= dia && !bloqueadaPelaProva(r) &&
                 ((!r.feita && !r.sessaoId) || (ed && r.sessaoId === ed.id)) &&
                 (!eRev || !ehRetomada(r)))                      // revisão junta com revisão
    .map(r => ({ rev: r, ctx: contextoRevisao(r) }))
    .filter(x => x.ctx && x.ctx.disciplina === disc && (x.ctx.assuntos || []).length)
    .map(x => Object.assign(x, { mesmo: x.ctx.assuntos.every(a => doPrincipal.has(a.toLowerCase())) }))
    .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
}
function campoEstudarJunto(v, ed){
  const itens = itensParaJuntar(v, ed);
  if (!itens.length) return "";
  const tem = new Set(assuntosDe(v).map(a => a.toLowerCase()));
  /* Quem já vem marcado: o que você marcou antes do redesenho (v.juntas), ou o
     que esta sessão já cumpre (editando). O card do MESMO conteúdo nunca vem
     marcado sozinho — o conteúdo já está na sessão por causa do principal. */
  const marcadas = new Set(v.juntas || (ed && ed.juntasIds) || []);
  return '<div class="campo largo"><span>Estudar junto (também na agenda de hoje)</span><div class="opcoes">' +
    itens.map(x => '<label class="opcao"><input type="checkbox" name="juntar" value="'+esc(x.rev.id)+'"' +
        (marcadas.has(x.rev.id) || (!x.mesmo && x.ctx.assuntos.every(a => tem.has(a.toLowerCase()))) ? " checked" : "") + '>' +
      '<span>' + esc(x.ctx.rotulo) +
        (x.mesmo ? ' · o mesmo conteúdo, card ' + (x.rev.data < D.hoje() ? 'atrasado de ' : 'de ') + D.br(x.rev.data)
                 : x.rev.data < D.hoje() ? ' · atrasado de ' + D.br(x.rev.data) : '') +
      '</span></label>').join("") +
    '</div></div>';
}
/** marcou ou desmarcou "Estudar junto": o conteúdo do item entra ou sai da sessão, sem redesenhar */
function alternarJuntar(caixa){
  const form = caixa.closest("form"), lista = document.getElementById("listaAssuntosForm");
  const rev = acharRevisao(caixa.value), ctx = rev ? contextoRevisao(rev) : null;
  if (!form || !lista || !ctx) return;
  const travado = !form.querySelector("#campoAssunto");       // revisão: o conteúdo vem do item
  const achar = nome => [...lista.querySelectorAll("[data-assunto]")]
    .find(t => t.dataset.assunto.toLowerCase() === nome.toLowerCase());
  if (caixa.checked){
    ctx.assuntos.forEach(nome => {
      if (achar(nome)) return;
      lista.insertAdjacentHTML("beforeend", travado
        ? '<span class="tag fixo" data-assunto="'+esc(nome)+'">'+esc(nome)+'</span>' : tagAssunto(nome));
      const op = [...form.querySelectorAll("#campoAssunto option")].find(o => o.value.toLowerCase() === nome.toLowerCase());
      if (op) op.remove();
    });
  } else {
    // sai o que só este item trazia: o conteúdo do principal e o das outras caixas marcadas ficam
    const fica = new Set();
    const alvo = form.querySelector("#revisaoAlvo");
    [alvo && alvo.value, ...[...form.querySelectorAll('input[name="juntar"]:checked')].map(i => i.value)]
      .forEach(id => { const r = id && acharRevisao(id), c = r && contextoRevisao(r);
                       if (c) c.assuntos.forEach(a => fica.add(a.toLowerCase())); });
    ctx.assuntos.forEach(nome => { const t = achar(nome); if (t && !fica.has(nome.toLowerCase())) t.remove(); });
  }
  if (!travado) conferirConcluidoNoForm(form);
}
/** as revisões que esta sessão pode cumprir */
function revisoesDisponiveis(v, ed){
  /* o item tocado na agenda entra mesmo sendo de outro dia: adiantar uma
     revisão é contato como qualquer outro (a escada anda a partir da sessão).
     Sem ele, o ✓ de um item futuro abria um formulário que não salvava. */
  const atual = ed && ed.revisaoId ? ed.revisaoId : (v && v.revisaoId) || "";
  return revisoesDetalhadas()
    .filter(x => !x.rev.feita || x.rev.id === atual)          // já cumprida por outra sessão sai da lista
    .filter(x => x.status !== "futura" || x.rev.id === atual)  // só hoje e atrasadas
    .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
}
/* LIGAR NA EDIÇÃO (pedido do Pedro, 29/09). Registrou a sessão e o card de
   hoje ficou em aberto (outro conteúdo, "sem cronograma"…)? Editando a sessão,
   dá para dizer que ela cumpriu o card. Só sessão de hoje e card de hoje: mexer
   no passado reescreveria a agenda que já andou. O conteúdo do card entra na
   sessão, por isso só cards da mesma disciplina. */
const ligaNaEdicao = (v, ed) => !!ed && !ed.revisaoId && !ui.ligarRevisao && !ehTipoRevisao(v.tipo);
function cardsDeHojeParaLigar(v, ed){
  const hoje = D.hoje(), disc = v.disciplina || ed.disciplina;
  if (ed.data !== hoje || (v.data || ed.data) !== hoje) return [];
  return revisoesDisponiveis(v, ed)
    .filter(x => x.rev.data === hoje && !x.rev.feita && !x.rev.sessaoId && !bloqueadaPelaProva(x.rev) &&
                 x.ctx.disciplina === disc);
}
function htmlPainelRevisao(v, ed){
  /* O vínculo não depende mais do tipo: qualquer sessão pode cumprir um item
     da agenda. O tipo é rótulo do que foi feito; o vínculo é outra coisa. */
  if (ligaNaEdicao(v, ed)){
    const lista = cardsDeHojeParaLigar(v, ed);
    if (!lista.length) return "";
    const rev = acharRevisao(v.revisaoId || ""), ctx = rev ? contextoRevisao(rev) : null;
    const tem = new Set(assuntosDe(v).map(a => a.toLowerCase()));
    const faltam = ctx ? ctx.assuntos.filter(a => !tem.has(a.toLowerCase())) : [];
    return '<div class="painel-rev">' +
      '<div class="campo"><span id="rotRevisaoAlvo">Esta sessão cumpre um card de hoje?</span>' +
        '<select name="revisaoAlvo" id="revisaoAlvo" aria-labelledby="rotRevisaoAlvo">' +
          '<option value="">Não — nenhum card</option>' +
          lista.map(x => '<option value="'+esc(x.rev.id)+'"'+(rev && x.rev.id === rev.id ? " selected" : "")+'>' +
            esc(x.ctx.rotulo) + " · " + esc(nomeRevisao(x.rev).toLowerCase()) + '</option>').join("") +
        '</select></div>' +
      (faltam.length ? '<p class="sub" style="margin:8px 0 0">O conteúdo do card entra na sessão: <b>' +
        esc(faltam.join(", ")) + '</b></p>' : '') +
      '</div>';
  }
  const temAlvo = !!(v.revisaoId || (ed && ed.revisaoId));
  if (!ehTipoRevisao(v.tipo) && !temAlvo) return "";
  const atual = (ed && ed.revisaoId) || v.revisaoId || "";
  const lista = revisoesDisponiveis(v, ed);
  const opcoes = '<option value=""'+(atual ? "" : " selected")+'>Escolha a revisão…</option>' +
    lista.map(x => {
      const atraso = x.status === "atrasada";
      return '<option value="'+esc(x.rev.id)+'"'+(x.rev.id === atual ? " selected" : "")+
             (atraso ? ' class="atrasada"' : '')+'>' +
             (atraso ? "⚠ atrasada de " + D.br(x.rev.data) + " · " : "") +
             esc(x.ctx.rotulo) + " · " + esc(x.ctx.disciplina) +
             (atraso ? "" : " · " + D.br(x.rev.data)) + '</option>';
    }).join("");
  const rev = atual ? acharRevisao(atual) : null;
  const ctx = rev ? contextoRevisao(rev) : null;
  return '<div class="painel-rev">' +
    '<div class="campo"><span id="rotRevisaoAlvo">Qual revisão esta sessão cumpre? *</span>' +
      '<select name="revisaoAlvo" id="revisaoAlvo" aria-labelledby="rotRevisaoAlvo">' + opcoes + '</select></div>' +
    (lista.length ? '' : '<p class="sub" style="margin:8px 0 0">Não há revisão de hoje nem atrasada para cumprir. ' +
      'Agende uma na aba <b>Agenda</b> — ou registre isto como estudo.</p>') +
    (ctx ? '<p class="sub" style="margin:8px 0 0">O conteúdo vem da revisão: <b>'+esc(ctx.rotulo)+'</b> · ' +
      esc(ctx.disciplina) + (rev.dataOriginal ? ' <span class="badge b-alerta">estava marcada para ' +
      D.br(rev.dataOriginal) + '</span>' : '') + '</p>' : '') +
    '</div>';
}

/* ---------- fase dos conteúdos e a opção de não agendar nada ----------
   Aqui havia também a caixa "Integrar com outro conteúdo". Ela saiu: existia
   para o caso de duas sessões do mesmo conteúdo abrirem duas filas, e isso a
   agenda passou a resolver sozinha (escada por conteúdo / voltaEmAberto).        */
function campoIntegracao(v){
  /* A fase não é mais desta sessão: ela é do CONTEÚDO, e vale para todas as
     sessões que falam dele. Aqui a tela só mostra como está cada um, com o
     atalho para fechar — quem fecha, fecha para todo mundo.                 */
  const fichas = assuntosDe(v).map(a => acharConteudo(v.disciplina, a)).filter(Boolean);
  const abertos = fichas.filter(c => c.fase !== "concluido");
  // sem conteúdo escolhido ainda, o campo nem aparece (antes: uma frase explicando que ia aparecer)
  const estado = !fichas.length ? ''
    : '<div class="linha" style="flex-wrap:wrap;gap:7px">' +
        fichas.map(c => '<span class="badge'+(c.fase === "concluido" ? " b-bom" : " b-misto")+'">' +
          esc(c.nome) + ' · ' + (c.fase === "concluido" ? "concluído" : "em andamento") + '</span>').join("") +
        (abertos.length
          ? '<span class="spacer"></span><button class="act" type="button" data-acao="concluir-conteudo" ' +
            'data-disc="'+esc(v.disciplina)+'" data-conts="'+esc(abertos.map(c => c.nome).join("|"))+'">' +
            '✓ marcar como concluído' + (abertos.length > 1 ? "s" : "") + '</button>'
          : '') +
      '</div>';
  return (estado ? '<div class="campo largo"><span>Fase dos conteúdos</span>' + estado + '</div>' : '') +
    '<div class="campo largo"><span>Revisões</span><div class="opcoes">' +
    '<label class="opcao"><input type="checkbox" name="semRevisao"'+(planoDe(v) === "sem" ? " checked" : "")+'>' +
      '<span>Sem cronograma — só registrar o estudo</span></label>' +
    '</div></div>';
}
const rotuloSessao = r => rotuloAssuntos(r) + " · " + D.br(r.data);
/* Revisões que ficaram para trás, num bloco só: é daqui que você remarca cada
   uma para hoje ou para a frente, guardando a data em que ela estava. */
function cardAtrasadas(det){
  const atrasadas = det.filter(x => x.status === "atrasada")
                       .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
  if (!atrasadas.length) return "";
  return '<div class="card" id="revisoes-atrasadas">' +
    '<h2>Atrasados <span class="dica">' + atrasadas.length +
      (atrasadas.length === 1 ? " para remarcar" : " para remarcar") + '</span></h2>' +
    
    atrasadas.map(x => '<div class="item atrasada'+(x.tarefa ? " tarefa" : "")+'">' +
      // a tarefa pode ser marcada daqui mesmo: o ✓ dela não abre nada
      (x.tarefa ? '<button class="check" role="checkbox" aria-checked="false" data-acao="tarefa-check" data-id="'+esc(x.rev.id)+'" ' +
                  'title="Marcar como feita" aria-label="'+esc("Marcar como feita: " + x.ctx.rotulo)+'">✓</button>' : '') +
      '<div class="corpo"><div class="titulo">'+esc(x.ctx.rotulo)+'</div>' +
      '<div class="meta">'+(x.tarefa ? '<span class="badge b-tarefa">tarefa</span>' : esc(x.ctx.disciplina))+
        ' · estava marcada para '+D.brFull(x.rev.data)+
        ' · ' + plural(D.dif(x.rev.data, D.hoje()), "dia", "dias") + ' de atraso</div></div>' +
      '<button class="btn mini" data-acao="'+(x.tarefa ? "remarcar-tarefa" : "remarcar-revisao")+'" data-id="'+esc(x.rev.id)+'">remarcar</button>' +
      '</div>').join("") + '</div>';
}


/** o que o formulário tem agora (para o painel saber a disciplina e o nome da sessão) */
function registroDoForm(f){
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  return { id: ed ? ed.id : "", disciplina: disciplinaDoForm(f), assuntos: lerAssuntosForm(f) };
}
/** lê a disciplina escolhida sem cadastrar nada (lerDisciplina cadastra) */
function disciplinaDoForm(f){
  const sel = f.querySelector("select.sel-disciplina");
  // na sessão de revisão a disciplina vem travada, num campo oculto
  if (!sel){ const oculto = f.querySelector('[name="disciplina"]'); return oculto ? oculto.value.trim() : ""; }
  if (sel.value === "__nova"){ const i = f.querySelector(".nova-disciplina"); return i ? i.value.trim() : ""; }
  return sel.value;
}

/** Caixas de marcar em linha — sem <label> dentro de <label> e sem herdar o estilo de input. */
function campoOpcoes(rot, itens){
  return '<div class="campo largo"><span>'+esc(rot)+'</span><div class="opcoes">' +
    itens.map(o => '<label class="opcao"><input type="checkbox" name="'+o.nome+'"'+(o.marcado?" checked":"")+'>' +
                   '<span>'+esc(o.texto)+'</span></label>').join("") + '</div></div>';
}
/** as opções do seletor de conteúdo: os da disciplina que ainda não estão na lista */
function opcoesDeConteudo(disc, lista){
  const jaNa = a => (lista || []).some(x => x.toLowerCase() === a.nome.toLowerCase());
  const opcoes = conteudosDaDisciplina(disc || "").filter(c => !jaNa(c))
    .map(c => '<option value="'+esc(c.nome)+'">'+esc(c.nome) +
              (c.fase === "concluido" ? " — concluído" : "") + '</option>').join("");
  return '<option value="">' +
      (opcoes ? "Escolha um conteúdo…"
              : disc ? "Nenhum conteúdo cadastrado em " + esc(disc)
                     : "Disciplina primeiro") + '</option>' +
    opcoes + '<option value="__novo">＋ Criar novo conteúdo</option>';
}
function camposAssuntos(lista, rotulo, dica, travado, disciplina, disciplinaPrimeiro){
  // sem frase-guia por padrão (tiradas a pedido do Pedro, 24/09); travado = o conteúdo vem da revisão
  const ajuda = dica || "";
  if (travado) return '<div class="campo largo"><span>'+esc(rotulo || "Conteúdos revisados")+'</span>' +
    '<div id="listaAssuntosForm" class="tags" style="margin-bottom:4px">' +
      (lista.length ? lista.map(a => '<span class="tag fixo" data-assunto="'+esc(a)+'">'+esc(a)+'</span>').join("")
                    : '<span class="tag fixo">escolha a revisão acima</span>') + '</div>' +
    '</div>';   // travados: vêm da revisão escolhida (a explicação está na Ajuda)
  /* Conteúdo não se digita mais: escolhe-se na lista da disciplina. O que
     diferencia duas sessões do mesmo conteúdo é a DESCRIÇÃO, não um nome
     ligeiramente diferente — era assim que nasciam "LAI", "LAI " e "Lei de
     acesso", três fichas para a mesma coisa.                                */
  const disc = disciplina || "";
  /* A DISCIPLINA VEM PRIMEIRO (pedido do Pedro, 28/09): sem ela, o conteúdo
     fica travado — conteúdo pertence a uma disciplina. Ver travarConteudos. */
  const trava = disc || !disciplinaPrimeiro ? "" : " disabled";
  return '<div class="campo largo"><span>'+esc(rotulo || "Conteúdos da sessão *")+'</span>' +
    '<div id="listaAssuntosForm" class="tags" style="margin-bottom:7px">' + lista.map(tagAssunto).join("") + '</div>' +
    /* sem botão "+ adicionar" (pedido do Pedro, 29/09): escolher na lista já põe
       o conteúdo na sessão; o novo entra com Enter ou ao sair do campo do nome */
    '<select id="campoAssunto"'+trava+'>' + opcoesDeConteudo(disc, lista) + '</select>' +
    (disciplinaPrimeiro ? '<span class="ajuda-campo" id="avisoDisciplinaPrimeiro"'+(disc ? " hidden" : "")+'>Escolha a disciplina primeiro.</span>' : '') +
    '<input id="novoConteudoNome" class="nova-disciplina" hidden placeholder="Nome do novo conteúdo" style="margin-top:6px">' +
    (ajuda ? '<span style="font-size:11.5px;color:var(--muted);margin-top:4px">'+esc(ajuda)+'</span>' : '') +
    '</div>';
}
/* A DIFICULDADE DE UM CONTEÚDO JÁ ESTUDADO. Ela já é guardada: é a da sessão
   mais recente dele (dificuldadeDaFicha — a mesma que a agenda usa). Escolhido um
   conteúdo assim numa sessão NOVA, o campo vem preenchido com ela; conteúdo que
   nunca foi estudado continua sem padrão, e a escolha é sua. Com vários
   conteúdos de dificuldades diferentes, vale a mais alta — errar para "mais
   difícil" só aproxima a próxima volta. */
const TEXTO_HERDADA = "Veio da última sessão deste conteúdo — troque se mudou.";
/** de onde veio: da última sessão ou, no conteúdo ainda sem sessão, da escolha na aba Disciplinas */
const textoHerdada = (disc, nomes) => (nomes || []).some(n => { const f = acharConteudo(disc || "", n); return f && sessoesDaFicha(f).length; })
  ? TEXTO_HERDADA : "Veio da dificuldade escolhida na aba Disciplinas — troque se mudou.";
function dificuldadeHerdada(disc, nomes){
  const niveis = (nomes || []).map(n => acharConteudo(disc || "", n))
    .filter(f => f && (sessoesDaFicha(f).length || f.dificuldade)).map(dificuldadeDaFicha);
  return niveis.length ? Math.max(...niveis) : null;
}
/* A DIFICULDADE VEM DA ABA DISCIPLINAS (pedido do Pedro, 29/09): escolhido um
   conteúdo na sessão — já na lista, antes mesmo do "+ adicionar" —, o campo
   passa a mostrar a dele (dificuldadeDaFicha, a mesma da aba Disciplinas),
   mesmo que já houvesse outra escolhida. Editando uma sessão, só preenche o
   campo vazio: a dificuldade de uma sessão já salva é dela. */
function puxarDificuldadeNoForm(form){
  const sel = form && form.id === "formRegistro" && form.querySelector('[name="dificuldade"]');
  if (!sel || (ui.editandoRegistro && sel.value)) return;
  const disc = disciplinaDoForm(form) || "", nomes = lerAssuntosForm(form);
  const d = dificuldadeHerdada(disc, nomes);
  if (!d) return;
  sel.value = String(d); sel.classList.remove("campo-errado");
  const dica = document.getElementById("dicaDificuldade"); if (dica) dica.textContent = textoHerdada(disc, nomes);
}
function adicionarAssuntoForm(){
  const inp = document.getElementById("campoAssunto"), lista = document.getElementById("listaAssuntosForm");
  if (!inp || !lista) return;
  const novoNome = document.getElementById("novoConteudoNome");
  const disc = disciplinaDoForm(inp.closest("form")) || "";
  if (!disc && inp.closest("#formRegistro")){                // a disciplina vem primeiro
    const sel = inp.closest("form").querySelector("select.sel-disciplina"); if (sel) sel.focus();
    return;
  }
  let v = inp.value.trim();
  if (v === "__novo"){                                   // criar ficha nova, ali mesmo
    const nome = novoNome ? novoNome.value.trim() : "";
    if (!nome){ if (novoNome){ novoNome.hidden = false; novoNome.focus(); } return; }
    // disciplina ainda não existe (está sendo criada agora): a ficha nasce no salvamento
    /* nasce já no cadastro (aba Disciplinas), com a dificuldade escolhida aqui —
       se ainda estiver em branco, ela entra no salvamento (enviarRegistro) */
    if (disc){
      const ficha = registrarConteudo(disc, nome);
      const selDif = inp.closest("form").querySelector('[name="dificuldade"]');
      if (ficha && !ficha.dificuldade && selDif && selDif.value) ficha.dificuldade = tresNiveis(selDif.value);
      persistir();
    }
    v = nome;
    if (novoNome){ novoNome.value = ""; novoNome.hidden = true; }
  }
  if (!v){ inp.focus(); return; }
  const jaTem = [...lista.querySelectorAll("[data-assunto]")].some(x => x.dataset.assunto.toLowerCase() === v.toLowerCase());
  if (!jaTem){
    lista.insertAdjacentHTML("beforeend", tagAssunto(v));
    const op = [...inp.options].find(o => o.value.toLowerCase() === v.toLowerCase());
    if (op) op.remove();                                  // sai da lista: já está na sessão
  }
  const form = inp.closest("form");
  puxarDificuldadeNoForm(form);
  inp.value = ""; inp.focus();
  conferirConcluidoNoForm(form);
}
/* O REMENDO NO LUGAR, depois de renomear a ficha com a sessão aberta. Tudo o
   que já está na tela e ainda fala o nome velho é acertado: as etiquetas (o
   `data-assunto` primeiro, que é o que vale ao salvar), o texto visível, os
   rótulos de acessibilidade e as opções do seletor de conteúdos. Nada de
   render() — o que está digitado e não foi salvo tem de sobreviver.        */
function trocarNomeNoForm(form, antigo, novo){
  const igual = v => (v || "").toLowerCase() === antigo.toLowerCase();
  form.querySelectorAll("[data-assunto]").forEach(tag => {
    if (!igual(tag.dataset.assunto)) return;
    tag.dataset.assunto = novo;
    const txt = tag.querySelector(".txt"); if (txt) txt.textContent = novo;
    const ren = tag.querySelector('[data-acao="renomear-no-form"]');
    if (ren) ren.setAttribute("aria-label", "Renomear " + novo + " em todo o sistema");
    const rem = tag.querySelector('[data-acao="remover-assunto"]');
    if (rem) rem.setAttribute("aria-label", "Remover " + novo);
  });
  form.querySelectorAll("select option").forEach(op => {
    if (igual(op.value)) op.value = novo;
    if (igual(op.textContent)) op.textContent = novo;
    else if (op.textContent.toLowerCase() === (antigo + " — concluído").toLowerCase())
      op.textContent = novo + " — concluído";
  });
}

/** lê as etiquetas + o que estiver digitado e ainda não foi adicionado */
function lerAssuntosForm(form){
  const out = [...form.querySelectorAll("#listaAssuntosForm [data-assunto]")].map(x => x.dataset.assunto);
  const inp = form.querySelector("#campoAssunto");
  let pendente = inp ? inp.value.trim() : "";
  if (pendente === "__novo"){                       // escolheu criar e esqueceu de adicionar
    const nome = form.querySelector("#novoConteudoNome");
    pendente = nome ? nome.value.trim() : "";
  }
  if (pendente && !out.some(a => a.toLowerCase() === pendente.toLowerCase())) out.push(pendente);
  return out;
}
function registrosFiltrados(){
  const hoje = D.hoje();
  let lista = db.registros.slice();
  if (ui.fDisciplina) lista = lista.filter(r => r.disciplina === ui.fDisciplina);
  // conteúdo: só vale se alguma sessão ainda fala dele (escolha velha não esvazia a lista sem explicação)
  if (ui.fAssunto && db.registros.some(r => temAssunto(r, ui.fAssunto)))
    lista = lista.filter(r => temAssunto(r, ui.fAssunto));
  if (ui.fTipo === "estudo")   lista = lista.filter(r => !ehRevisaoSessao(r));
  if (ui.fTipo === "revisao")  lista = lista.filter(r => r.tipo === "revisao");
  if (ui.fTipo === "misto")    lista = lista.filter(r => r.tipo === "misto");
  if (ui.fTipo === "revisoes") lista = lista.filter(r => ehRevisaoSessao(r));
  if (ui.fPeriodo === "7")  lista = lista.filter(r => D.dif(r.data, hoje) <= 7 && r.data <= hoje);
  if (ui.fPeriodo === "30") lista = lista.filter(r => D.dif(r.data, hoje) <= 30 && r.data <= hoje);
  if (ui.fPeriodo === "futuro") lista = lista.filter(r => r.data >= hoje);
  if (ui.fBusca){
    const q = ui.fBusca.toLowerCase();
    lista = lista.filter(r => (assuntosDe(r).join(" ")+" "+r.disciplina+" "+(r.anotacoes||"")).toLowerCase().includes(q));
  }
  const ordens = {
    "data-desc": (a,b) => b.data.localeCompare(a.data),
    "data-asc":  (a,b) => a.data.localeCompare(b.data),
    "dificuldade-desc": (a,b) => dificuldadeDe(b) - dificuldadeDe(a),
    "tempo-desc": (a,b) => (b.minutos||0) - (a.minutos||0)
  };
  return lista.sort(ordens[ui.fOrdem] || ordens["data-desc"]);
}

/* ---------- TELA: QUESTÕES ---------- */
function barraAcerto(taxa){
  if (taxa === null) return '<span class="meta">—</span>';
  const cor = taxa >= CONFIG.TAXA_ATENCAO ? "var(--bom)" : taxa >= CONFIG.TAXA_CRITICA ? "var(--alerta)" : "var(--critico)";
  return '<div class="acerto"><div class="acerto-barra"><i style="width:'+taxa+'%;background:'+cor+'"></i></div>' +
         '<b class="num">'+taxa+'%</b></div>';
}

/* Agrupamento das questões: um bloco por conteúdo. Havia aqui uma exceção para
   os grupos de revisão, que viravam um bloco só com o nome do grupo — saiu com
   a integração. */
/* `sel` é uma LISTA de disciplinas (vazia = todas) — o filtro de Questões deixa
   escolher várias, e o que se vê é a soma delas. */
function linhasPorConteudo(sel){
  const dentro = d => !sel || !sel.length || sel.indexOf(d) >= 0;
  return assuntos().filter(a => dentro(a.disciplina)).map(a => {
    const e = estatAssunto(a.disciplina, a.assunto);
    return { nome: a.assunto, sub: a.disciplina, questoes: e.questoes, acertos: e.acertos, taxa: e.taxa };
  });
}
function linhasPorDisciplina(sel){
  const dentro = d => !sel || !sel.length || sel.indexOf(d) >= 0;
  return disciplinas().filter(dentro).map(d => {
    const e = estatDisciplina(d);
    return { nome: d,
             sub: e.conteudos + (e.conteudos === 1 ? " conteúdo" : " conteúdos"),
             questoes: e.questoes, acertos: e.acertos, taxa: e.taxa };
  });
}

function telaQuestoes(){
  const todos = lancamentosDeQuestoes();
  if (!todos.length){
    /* sem sessão, o botão de lançar não existe — a mensagem não pode apontar
       para ele (dizia "pelo botão abaixo" com nada abaixo). O porquê de cada
       caminho está na Ajuda. */
    return '<div class="vazio" style="margin-bottom:12px"><strong>Nenhuma questão registrada ainda</strong>' +
      (db.registros.length ? '' : 'As questões entram pelas sessões.' +
        '<div style="margin-top:10px"><button class="act atalho" data-aba="registros">Ir para Sessões</button></div>') +
      '</div>' + (db.registros.length ? botaoLancarQuestoes() : '');
  }
  /* FILTRO POR DISCIPLINA, VÁRIAS AO MESMO TEMPO. Vale para a aba inteira —
     números, gráfico e as duas tabelas —, senão um bloco falaria de duas
     disciplinas e o vizinho de todas. Escolhendo mais de uma, o que se vê é a
     SOMA delas: as questões dos dois blocos entram na mesma conta, no mesmo
     gráfico e na mesma taxa. Nenhuma marcada = todas, que é o mesmo que "Todas"
     e evita o estado sem saída de zero escolhidas e tela vazia.
     A lista do filtro é sempre a completa, para escolher uma não apagar o
     caminho de volta para as outras. */
  const discsQ = [...new Set(todos.map(x => x.disciplina).filter(Boolean))]
    .sort((a,b) => a.localeCompare(b, "pt-BR"));
  const selQ = (Array.isArray(ui.qDiscs) ? ui.qDiscs : []).filter(d => discsQ.indexOf(d) >= 0);
  /* E o CONTEÚDO (25/09), o mesmo filtro das outras abas: uma caixa, que lista
     os conteúdos das disciplinas marcadas (ou de todas). Um lote de questões
     conta no conteúdo se a sessão dele fala daquele conteúdo. */
  const qdc = filtroDiscCont("q", { discsEscopo: selQ.length ? selQ : null,
    itens: todos.flatMap(x => (x.assuntos || []).map(a => ({ disciplina: x.disciplina, nome: a }))) });
  const fala = x => !qdc.cont || (x.assuntos || []).some(a => chaveAssunto(x.disciplina, a) === qdc.cont);
  const itens = (selQ.length ? todos.filter(x => selQ.indexOf(x.disciplina) >= 0) : todos).filter(fala);
  const geral = totalQuestoes(itens);
  const inicioSemana = D.soma(D.hoje(), -6);
  const semana = totalQuestoes(itens.filter(x => x.data >= inicioSemana && x.data <= D.hoje()));

  let h = '<div class="tiles" style="margin-bottom:14px">' +
    tile("Questões feitas", String(geral.questoes), geral.erros + " erros · " + plural(itens.length, "registro", "registros")) +
    tile("Taxa de acerto", geral.taxa === null ? "—" : geral.taxa + "%", geral.acertos + " acertos",
         "", tomTaxa(geral.taxa)) +
    tile("Na última semana", String(semana.questoes),
         semana.taxa === null ? "sem questões nos últimos 7 dias" : semana.taxa + "% de acerto") +
    tile("Dias com questões", String(new Set(itens.map(x => x.data)).size), "de estudo registrado") +
  '</div>';
  // o botão vem depois dos indicadores: primeiro o retrato, depois a ação
  if (db.registros.length) h += botaoLancarQuestoes();

  /* O filtro vem depois da ação e antes de tudo o que ele recorta — assim a
     linha de chips fica encostada no primeiro bloco que muda com ela. */
  /* O FILTRO, igual ao das outras abas (quadro com Disciplina e Conteúdo), com
     uma diferença combinada com o Pedro: a caixa de Disciplinas deixa marcar
     VÁRIAS ao mesmo tempo — ela abre uma lista de caixinhas de marcar. Só há o
     que filtrar com mais de uma disciplina ou mais de um conteúdo. */
  if (discsQ.length > 1 || qdc.n > 1 || qdc.cont){
    const rotDiscs = !selQ.length ? "Todas as disciplinas"
                   : selQ.length === 1 ? selQ[0]
                   : selQ.length + " disciplinas: " + selQ.join(", ");
    const caixaDiscs = discsQ.length > 1
      ? campo("Disciplinas",
          '<div class="multi-disc' + (ui.qDiscsAberto ? " aberto" : "") + '">' +
            '<button class="multi-caixa" type="button" data-acao="abrir-qdiscs" aria-haspopup="true" ' +
              'aria-expanded="' + (!!ui.qDiscsAberto) + '"><span>' + esc(rotDiscs) + '</span><span aria-hidden="true">▾</span></button>' +
            '<div class="multi-lista" role="group" aria-label="Disciplinas — marque uma ou várias">' +
              // aria-pressed, não aria-selected: cada linha é um interruptor que liga e desliga
              '<button class="multi-op" type="button" data-acao="filtrar-questoes" data-disc="" aria-pressed="' + (!selQ.length) + '">' +
                '<span class="caixinha" aria-hidden="true"></span>Todas as disciplinas</button>' +
              discsQ.map(d => '<button class="multi-op" type="button" data-acao="filtrar-questoes" data-disc="' + esc(d) + '" ' +
                'aria-pressed="' + (selQ.indexOf(d) >= 0) + '"><span class="caixinha" aria-hidden="true"></span>' + esc(d) + '</button>').join("") +
            '</div></div>', false)
      : '';
    h += '<div class="filtros"><div class="filtros-campos">' + caixaDiscs + qdc.html + '</div>' +
      (selQ.length || qdc.cont
        ? '<div class="filtros-acoes"><span class="marca-filtro">filtro ativo</span>' +
          (selQ.length > 1 ? '<span class="hl-tema">' + selQ.length + ' de ' + discsQ.length + ' disciplinas</span>' : '') +
          '<span class="spacer"></span>' +
          (selQ.length ? '<button class="act fixo" type="button" data-acao="filtrar-questoes" data-disc="">limpar ✕</button>' : '') +
          (qdc.cont ? '<button class="act atalho" type="button" data-acao="limpar-conteudo-questoes">✕ limpar conteúdo</button>' : '') +
          '</div>'
        : '') +
      '</div>';
  }

  /* O gráfico vem antes das tabelas: é o retrato do esforço recente, e é o que
     se quer ver ao abrir a aba. O desempenho por disciplina é consulta, e
     consulta fica no fim. */
  h += graficoQuestoes(itens);
  h += listaAvulsos(selQ, qdc.cont);
  h += listaQuestoesDasSessoes(selQ, qdc.cont);

  // ----- agrupamento por conteúdo ou por disciplina
  const porConteudo = ui.qVisao === "conteudo";
  /* ordem pela taxa de acerto: da pior para a melhor (padrão) ou o contrário,
     num botão discreto, só com o ícone, no canto do título */
  const melhorPrimeiro = ui.qOrdemTaxa === "desc";
  h += '<div class="card"><h2>Desempenho por ' + (porConteudo ? "conteúdo" : "disciplina") +
    '<span class="spacer"></span><button class="act ordem-taxa" type="button" data-acao="q-ordem-taxa" ' +
      'title="' + (melhorPrimeiro ? "Da melhor para a pior taxa de acerto — tocar inverte" : "Da pior para a melhor taxa de acerto — tocar inverte") + '" ' +
      'aria-label="Inverter a ordem pela taxa de acerto">' + (melhorPrimeiro ? "↓" : "↑") + '</button></h2>' +
    '<div class="linha" style="margin-bottom:12px"><span class="hl-tema">Agrupar por:</span>' +
      '<button class="aba" data-acao="q-visao" data-visao="disciplina" aria-selected="'+(!porConteudo)+'">Disciplina</button>' +
      '<button class="aba" data-acao="q-visao" data-visao="conteudo" aria-selected="'+porConteudo+'">Conteúdo</button>' +
    '</div>';

  // com um conteúdo escolhido: por conteúdo, só a linha dele; por disciplina, só a disciplina dele
  const linhas = (porConteudo ? linhasPorConteudo(selQ) : linhasPorDisciplina(selQ))
    .filter(l => !qdc.cont || (porConteudo ? chaveAssunto(l.sub, l.nome) === qdc.cont : l.nome === discDaChave(qdc.cont)));
  const comQuestoes = linhas.filter(l => l.questoes > 0)
    .sort((a,b) => ((a.taxa ?? 101) - (b.taxa ?? 101)) * (melhorPrimeiro ? -1 : 1));

  if (!comQuestoes.length){
    h += '<div class="vazio">Ainda não há questões registradas neste agrupamento.</div>';
  } else {
    h += '<div class="tab-rolagem"><table class="tab-cartao tab-desempenho"><thead><tr>' +
      '<th>'+(porConteudo ? "Conteúdo" : "Disciplina")+'</th><th class="num">Questões</th>' +
      '<th class="num">Acertos</th><th class="num">Erros</th><th>Taxa de acerto</th></tr></thead><tbody>' +
      comQuestoes.map(l => '<tr><td class="c-nome"><b style="font-weight:550">'+esc(l.nome)+'</b>' +
        '<div class="meta">'+esc(l.sub)+'</div></td>' +
        // no cartão (celular) o número perde o cabeçalho da coluna: o rótulo vai junto
        '<td class="num c-info" data-rot="questões">'+l.questoes+'</td>' +
        '<td class="num c-info" data-rot="acertos">'+l.acertos+'</td>' +
        '<td class="num c-info" data-rot="erros">'+(l.questoes - l.acertos)+'</td>' +
        '<td class="c-barra" style="min-width:170px">'+barraAcerto(l.taxa)+'</td></tr>').join("") +
      '</tbody></table></div>';
  }
  h += '</div>';

  return h;
}

/** barra com as pontas de CIMA arredondadas e a base reta, encostada no eixo */
function barraSVG(x, y, w, h, r, cor){
  const raio = Math.max(0, Math.min(r, w / 2, h));
  const d = "M" + x + " " + (y + h) + " V" + (y + raio) +
            " a" + raio + " " + raio + " 0 0 1 " + raio + " -" + raio +
            " h" + (w - 2*raio) +
            " a" + raio + " " + raio + " 0 0 1 " + raio + " " + raio +
            " V" + (y + h) + " Z";
  return '<path d="' + d + '" fill="' + cor + '"/>';
}

/* A TABELA DE LANÇAMENTOS SAIU, mas as BATERIAS AVULSAS ficaram aqui: elas são
   as únicas que se editam e se apagam, e a tabela era o único caminho para
   isso. Sem esta lista, uma bateria digitada errada ficaria errada para sempre.
   As questões que vieram de uma SESSÃO têm o card delas logo abaixo
   (listaQuestoesDasSessoes), e também se editam daqui. */
function listaAvulsos(sel, cont){
  const avulsos = (db.lancamentos || [])
    .filter(l => { const r = acharRegistro(l.registroId);
                   if (cont && !(r && temAssunto(r, cont))) return false;
                   if (!sel || !sel.length) return true;
                   return !!r && sel.indexOf(r.disciplina) >= 0; })
    .sort((a,b) => b.data.localeCompare(a.data));
  if (!avulsos.length) return "";
  return '<div class="card"><h2>Questões fora das sessões</h2>' +
    avulsos.map(l => {
      const reg = acharRegistro(l.registroId);
      const taxa = pct(l.acertos, l.questoes);
      return '<div class="item"><div class="corpo">' +
        '<div class="titulo">' + l.questoes + (l.questoes === 1 ? " questão" : " questões") +
        (l.acertos != null ? ' · ' + plural(l.acertos, "acerto", "acertos") : '') +
        (taxa === null ? '' : ' · ' + taxa + '%') + '</div>' +
        '<div class="meta">' + D.brFull(l.data) +
        (reg ? ' · ' + esc(reg.disciplina) + ' · ' + esc(rotuloAssuntos(reg))
             : ' · <span class="meta">a sessão ligada foi excluída</span>') + '</div></div>' +
        '<button class="act" data-acao="editar-lancamento" data-id="'+esc(l.id)+'">editar</button>' +
        '</div>';
    }).join("") + '</div>';
}

/* AS QUESTÕES DAS SESSÕES, editáveis daqui (pedido do Pedro, 24/09). Não há
   cópia: o número mora na própria sessão (reg.questoes / reg.acertos), então
   mudar aqui já é mudar lá — a aba Sessões mostra o valor novo sem sincronizar
   nada. Questão não mexe no cronograma (planoRelevante não a olha). */
const QSESSOES_VISIVEIS = 8;
function listaQuestoesDasSessoes(sel, cont){
  const sessoes = db.registros
    .filter(r => r.questoes > 0 && (!sel || !sel.length || sel.indexOf(r.disciplina) >= 0) && (!cont || temAssunto(r, cont)))
    .sort((a,b) => b.data.localeCompare(a.data) || (b.criadoEm || 0) - (a.criadoEm || 0));
  if (!sessoes.length) return "";
  const vis = ui.verTodasQSessoes ? sessoes : sessoes.slice(0, QSESSOES_VISIVEIS);
  return '<div class="card"><h2>Questões das sessões ' +
    '<span class="dica">' + sessoes.length + (sessoes.length === 1 ? " sessão" : " sessões") + ' com questões</span></h2>' +
    vis.map(r => {
      const taxa = pct(r.acertos || 0, r.questoes);
      return '<div class="item"><div class="corpo">' +
        '<div class="titulo">' + r.questoes + (r.questoes === 1 ? " questão" : " questões") +
        ' · ' + plural(r.acertos || 0, "acerto", "acertos") + (taxa === null ? '' : ' · ' + taxa + '%') + '</div>' +
        '<div class="meta">' + D.brFull(r.data) + ' · ' + esc(tipoDaSessao(r).curto) + ' · ' + esc(r.disciplina) +
        ' · ' + esc(rotuloAssuntos(r)) + '</div></div>' +
        '<button class="act" data-acao="editar-questoes-sessao" data-id="'+esc(r.id)+'">editar</button></div>';
    }).join("") +
    (sessoes.length > QSESSOES_VISIVEIS
      ? '<button class="act ver-mais" data-acao="toggle-qsessoes">' +
        (ui.verTodasQSessoes ? "− mostrar menos" : "+ ver todas as " + sessoes.length) + '</button>' : '') +
    '</div>';
}
function modalQuestoesDaSessao(reg){
  abrirModal("Questões da sessão",
    '<form id="formQuestoesSessao">' +
      '<p class="sub" style="margin-top:0">' + D.brFull(reg.data) + ' · ' + esc(reg.disciplina) + ' · <b>' +
        esc(rotuloAssuntos(reg)) + '</b></p>' +
      '<div class="campos">' +
        camposQuestoes(reg.questoes, reg.acertos) +
      '</div>' +
      '<div class="linha acoes-form"><button class="btn" type="submit">Salvar</button>' +
      '<button class="btn ghost" type="button" data-acao="fechar-modal">Cancelar</button>' +
      '<span class="erro-form" id="erroQuestoesSessao"></span></div></form>',
    () => $("#formQuestoesSessao").addEventListener("submit", ev => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(ev.target).entries());
      const q = Math.max(0, Math.round(Number(d.questoes) || 0)), a = Math.max(0, Math.round(Number(d.acertos) || 0));
      if (a > q){ $("#erroQuestoesSessao").textContent = "Acertos não podem passar do total de questões."; return; }
      reg.questoes = q; reg.acertos = a;           // é a própria sessão: a aba Sessões já vê o número novo
      persistir(); fecharModal(); render();
      toast("Questões atualizadas — a sessão já mostra os números novos.");
    }));
}

/* GRÁFICO DAS QUESTÕES, DIA A DIA.
   Forma: barra EMPILHADA — acertos embaixo, erros em cima, e a altura é o total
   resolvido no dia. A tentação era pôr "total" e "acertos" lado a lado, como em
   tantos painéis por aí; não dá: acerto é PARTE do total, e duas barras vizinhas
   pedem ao olho que compare coisas do mesmo nível. Empilhado, a altura responde
   "quantas fiz" e a divisão responde "quantas acertei", sem contar ninguém duas
   vezes.
   Cor: os dois primeiros slots categóricos do app (azul/laranja). Verde/vermelho
   seria o óbvio, e reprova em daltonismo — o par mede ΔE 4,1 em deuteranopia,
   abaixo até do piso. Azul/laranja mede 24,7. A legenda nomeia os dois, para a
   identidade nunca depender só da cor. */
function graficoQuestoes(itens){
  const dias = [7, 30, 90].indexOf(ui.qPeriodo) >= 0 ? ui.qPeriodo : 30;
  const ini = D.soma(D.hoje(), -(dias - 1));
  const naFaixa = itens.filter(x => x.data >= ini && x.data <= D.hoje());
  const porDia = new Map();
  naFaixa.forEach(x => {
    const a = porDia.get(x.data) || { questoes: 0, acertos: 0 };
    a.questoes += x.questoes || 0; a.acertos += x.acertos || 0;
    porDia.set(x.data, a);
  });
  const serie = [];
  for (let i = 0; i < dias; i++){
    const d = D.soma(ini, i);
    const a = porDia.get(d) || { questoes: 0, acertos: 0 };
    serie.push({ data: d, questoes: a.questoes, acertos: a.acertos, erros: a.questoes - a.acertos });
  }
  const totQ = serie.reduce((t,x) => t + x.questoes, 0);
  const totA = serie.reduce((t,x) => t + x.acertos, 0);
  const taxa = pct(totA, totQ);

  const filtros = '<div class="linha filtro-periodo" style="margin-bottom:10px">' +
    '<span class="hl-tema">Período:</span>' +
    [[7,"7 dias"],[30,"30 dias"],[90,"90 dias"]].map(([n,rot]) =>
      '<button class="aba" data-acao="q-periodo" data-dias="'+n+'" aria-selected="'+(dias===n)+'">'+rot+'</button>'
    ).join("") + '</div>';

  const cab = '<div class="card"><h2 class="titulo-quebra">Questões dia a dia ' +
    '<span class="dica">' + totQ + (totQ === 1 ? " questão" : " questões") +
    (taxa === null ? "" : " · " + taxa + "% de acerto") + ' nos últimos ' + dias + ' dias</span></h2>' + filtros;

  if (!totQ)
    return cab + '<div class="vazio">Nenhuma questão registrada neste período. ' +
      'Escolha uma janela maior, ou registre uma bateria pelo botão acima.</div></div>';

  /* O desenho. Barra fina, topo arredondado só na ponta de dados (a base fica
     reta, encostada no eixo) e 2px de respiro entre os dois pedaços da pilha. */
  /* No celular o desenho de 720 de largura era reduzido a ~290 e as letras
     sumiam (10 → 4px). Lá ele nasce com metade da largura: a letra fica do
     tamanho de verdade, e há menos rótulos de data para caberem. */
  const estreito = typeof matchMedia === "function" && matchMedia("(max-width:620px)").matches;
  const L = 34, R = 10, T = 12, B = 24, W = estreito ? 360 : 720, H = estreito ? 190 : 210;
  const alt = H - T - B, larg = W - L - R;
  const topo = Math.max(...serie.map(x => x.questoes));
  const passo = topo <= 5 ? 1 : Math.ceil(topo / 4 / 5) * 5;
  const teto = Math.max(passo, Math.ceil(topo / passo) * passo);
  const banda = larg / serie.length;
  const bw = Math.max(3, Math.min(20, banda * 0.62));
  const y = v => T + alt - (v / teto) * alt;

  let grade = "", eixoX = "", barras = "", alvos = "";
  for (let v = 0; v <= teto; v += passo){
    grade += '<line x1="'+L+'" y1="'+y(v)+'" x2="'+(W-R)+'" y2="'+y(v)+'" stroke="var(--grade)" stroke-width="1"/>' +
      '<text x="'+(L-6)+'" y="'+(y(v)+3.5)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+v+'</text>';
  }
  // rótulos de data só de vez em quando: um a cada N, para não colidirem
  const cada = Math.max(1, Math.ceil(serie.length / (estreito ? 5 : 10)));
  serie.forEach((x, i) => {
    const cx = L + banda * i + banda / 2;
    if (i % cada === 0 || i === serie.length - 1)
      eixoX += '<text x="'+cx+'" y="'+(H - B + 14)+'" text-anchor="middle" font-size="10" ' +
               'fill="var(--muted)">'+D.br(x.data)+'</text>';
    if (x.questoes){
      const yTopo = y(x.questoes), yCorte = y(x.acertos), base = T + alt;
      /* Acertos embaixo (da base ao corte), erros em cima (do corte menos 2px
         de respiro até o topo). Só a PONTA DE DADOS arredonda: o pedaço de
         baixo encosta reto no eixo, senão a barra parece flutuar. */
      if (x.acertos > 0)
        barras += barraSVG(cx - bw/2, yCorte, bw, base - yCorte, x.erros > 0 ? 0 : 4, "var(--s1)");
      if (x.erros > 0)
        barras += barraSVG(cx - bw/2, yTopo, bw,
                           Math.max(1, (x.acertos > 0 ? yCorte - 2 : base) - yTopo), 4, "var(--s2)");
    }
    // alvo de hover: a faixa inteira do dia, bem maior que a barra
    alvos += '<rect class="alvo-dia" x="'+(L + banda*i)+'" y="'+T+'" width="'+banda+'" height="'+alt+'" ' +
             'fill="transparent" data-dia="'+esc(x.data)+'" data-q="'+x.questoes+'" data-a="'+x.acertos+'"/>';
  });

  return cab +
    '<div class="grafico-q">' +
      '<svg viewBox="0 0 '+W+' '+H+'" role="img" width="100%" ' +
        'aria-label="Questões resolvidas por dia, com a parte acertada destacada">' +
        grade + barras + eixoX + alvos +
      '</svg>' +
      '<div class="dica-grafico" hidden></div>' +
    '</div>' +
    '<div class="linha legenda-q">' +
      '<span><i style="background:var(--s1)"></i>Acertos</span>' +
      '<span><i style="background:var(--s2)"></i>Erros</span>' +
      '<span class="hl-tema">a altura da barra é o total resolvido no dia</span>' +
    '</div></div>';
}

/* ---------- TELA: ROTINA DE REVISÕES ---------- */
function telaRevisoes(){
  const det = revisoesDetalhadas();
  const tudo = juntarTarefas(det, tarefasDetalhadas());   // agenda + tarefas: o que a tela mostra
  const atrasadas = tudo.filter(x => x.status === "atrasada");
  const feitas = tudo.filter(x => x.rev.feita);
  /* O "Na agenda" (tudo o que está marcado, até o fim) saiu do topo (revisão de UX R2,
     27/09, pedido do Pedro): ao lado de uma lista que mostra só as próximas, o número
     não batia com o que se via e a pessoa procurava o que faltava. */
  let h = '<div class="tiles" style="margin-bottom:16px">' +
    tile("Atrasados", String(atrasadas.length), atrasadas.length ? "⚠ prioridade máxima" : "✓ nada atrasado",
         "", atrasadas.length ? "critico" : "bom") +
    tile("Já concluídos", String(feitas.length), "de " + tudo.length + " no total", "", feitas.length ? "bom" : "") +
    '</div>';   // a contagem da prova saiu daqui: o cabeçalho já mostra, em todas as abas

  // o formulário de revisão abre numa tela sobreposta, não aqui dentro
  /* O nome continua "revisão" de propósito: este botão cria mesmo uma REVISÃO
     (avulsa, marcada `manual`), não uma volta — voltas quem marca é a agenda,
     sozinha, enquanto o conteúdo está aberto. */
  /* A tarefa tem botão próprio, ao lado: ela não pede disciplina nem conteúdo. */
  h += '<div class="linha-add">' +
       '<button class="btn-add" data-acao="nova-revisao"><span class="mais">+</span> Adicionar revisão</button>' +
       '<button class="btn-add" data-acao="nova-tarefa"><span class="mais">+</span> Adicionar tarefa</button></div>';
  if (!agendaAutomatica())
    h += '<p class="sub" style="margin:-6px 0 14px">Agendamento automático <b>desligado</b>: a agenda é a sua rotina. ' +
         'No <b>+ Adicionar revisão</b> dá para marcar várias datas de uma vez. Para religar, use a <b>engrenagem</b> no topo.</p>';
  else if (tiposAutomaticos().length === 1)
    h += '<p class="sub" style="margin:-6px 0 14px">O agendamento automático cria <b>' + fraseTiposAuto() + '</b>: ' +
         (db.automaticoTipos === "revisoes" ? 'os cards de continuar' : 'as revisões') +
         ' são os que você marca. Para mudar, use a <b>engrenagem</b> no topo.</p>';

  /* O que é para hoje vem logo depois, igual à aba Hoje: quem abre esta aba
     quer saber o que fazer agora. O card é FIXO — não obedece aos filtros de
     baixo (Situação, Organizar, Assunto): hoje é hoje em qualquer visão. */
  {
    /* Tudo o que tem a data de hoje: o que falta, o que está sendo cronometrado
       agora e o que já foi concluído hoje — inclusive revisão que estava marcada
       para outro dia e foi cumprida hoje. */
    const agora = D.hoje();
    const deHoje = tudo.filter(x => x.rev.data === agora ||
                                   (x.rev.feita && (x.rev.feitaEm || x.rev.data) === agora));
    const peso = x => emAndamento(x.rev) ? 0 : x.rev.feita ? 2 : 1;   // em andamento, pendente, feita
    deHoje.sort((a,b) => peso(a) - peso(b) || a.rev.data.localeCompare(b.rev.data) ||
                         ordemNoDia(a).localeCompare(ordemNoDia(b)));
    const nFeitasHoje = deHoje.filter(x => x.rev.feita).length;
    const nAbertas = deHoje.length - nFeitasHoje;
    h += '<div class="card card-hoje"><h2>Agenda de hoje ' +
         '<span class="dica">' + D.extenso(agora) +
         (deHoje.length ? ' · ' + nAbertas + ' em aberto · ' + plural(nFeitasHoje, "concluída", "concluídas") : '') +
         '</span></h2>';
    if (!deHoje.length){
      h += '<div class="vazio"><strong>Nada marcado para hoje</strong>' +
           (atrasadas.length
             ? 'Mas há ' + atrasadas.length + (atrasadas.length === 1 ? ' revisão atrasada' : ' revisões atrasadas') +
               ' — o card de atrasadas, mais abaixo, traz o que ficou para trás.'
             : 'O cronograma abaixo mostra o que vem pela frente.') + '</div>';
    } else {
      // a explicação do ✓ e do salto foi para a Ajuda; fica só o aviso de que há atraso mais abaixo
      if (atrasadas.length)
        h += '<p class="sub"><b>' + atrasadas.length + '</b> ' + (atrasadas.length === 1 ? "atrasado" : "atrasados") + ' mais abaixo.</p>';
      h += deHoje.map(x => itemRevisao(x, rotuloDeHoje(x, agora), { saltavel: true, remarcavel: true })).join("");
    }
    h += '</div>';
  }

  /* OS FILTROS, um abaixo do outro, num card só.
     Situação — as duas sub-abas. O corte é por DIA, não por "feita ou não":
       "A fazer" é hoje, o que atrasou e o que vem pela frente; "Concluídos" é o
       arquivo — só o que foi marcado em dias anteriores (ver fatiaAgenda).
     Organizar — três visões da mesma agenda. Por dia é o padrão porque é a pergunta
       que a pessoa traz ("o que faço agora?"); por assunto serve para olhar um
       conteúdo inteiro; o mês é a visão de longe.
     Disciplina e Conteúdo — nas três visões: primeiro a disciplina, depois o
       conteúdo dela (sem disciplina, o conteúdo lista todos, com a disciplina
       ao lado). O ✕ limpa os dois. O card "Agenda de hoje" não obedece. */
  const fase = ui.faseAgenda === "concluidos" ? "concluidos" : "abertos";
  const nPorFazer = tudo.filter(x => !jaPassou(x)).length;
  const visao = ["dia","assunto","mes"].indexOf(ui.visaoAgenda) >= 0 ? ui.visaoAgenda : "dia";
  // as opções saem da agenda inteira, não da sub-aba: trocar de "Situação" não apaga a escolha
  const discsAgenda = [...new Set(det.map(x => x.ctx.disciplina))].sort((a,b) => a.localeCompare(b, "pt-BR"));
  const adc = filtroDiscCont("a", { discs: discsAgenda,
    itens: det.flatMap(x => (x.ctx.assuntos || []).map(a => ({ disciplina: x.ctx.disciplina, nome: a }))) });
  const filtroDisc = adc.disc, filtroAssunto = adc.cont;
  const passaFiltro = x => (!filtroDisc || x.ctx.disciplina === filtroDisc) &&
    (!filtroAssunto || (x.ctx.assuntos || []).some(a => chaveAssunto(x.ctx.disciplina, a) === filtroAssunto));
  // a tarefa não tem disciplina: com filtro, ela sai (passaFiltro não a reconhece)
  const naFaseTudo = fatiaAgenda(tudo, fase).filter(passaFiltro);
  // "só as próximas" corta por conteúdo; a tarefa não tem, então passa inteira
  const naFase = fase === "abertos"
    ? juntarTarefas(agendaVisivel(naFaseTudo.filter(x => !x.tarefa)), naFaseTudo.filter(x => x.tarefa))
    : naFaseTudo;
  h += '<div class="card filtros-agenda barra-filtro" style="padding:11px 13px;margin-bottom:14px">' +
    '<div class="linha"><span class="hl-tema">Situação:</span>' +
    [["abertos","A fazer",nPorFazer],["concluidos","Concluídos",tudo.length - nPorFazer]].map(([k,rot,n]) =>
      '<button class="aba" data-acao="fase-agenda" data-fase="'+k+'" aria-selected="'+(fase===k)+'">' +
      rot + '<span class="pin">'+n+'</span></button>').join("") +   // o total é neutro; o atraso tem o card dele
    '</div>' +
    '<div class="linha"><span class="hl-tema">Organizar:</span>' +
    [["dia","Por dia"],["assunto","Por assunto"],["mes","Mês"]].map(([k,rot]) =>
      '<button class="aba" data-acao="visao-agenda" data-visao="'+k+'" aria-selected="'+(visao===k)+'">' +
      rot + '</button>').join("") +
    '</div>' +
    /* disciplina e conteúdo: o mesmo filtro das outras abas (filtroDiscCont) */
    '<div class="filtros filtros-dentro"><div class="filtros-campos">' + adc.html + '</div>' +
      (filtroDisc || filtroAssunto
        ? '<div class="filtros-acoes"><span class="spacer"></span><button class="act atalho" type="button" ' +
          'data-acao="limpar-filtros-agenda" title="Tirar os filtros de disciplina e conteúdo">✕ limpar</button></div>'
        : '') + '</div>' +
    (fase === "abertos"
      /* O rótulo diz "Revisões" porque é nelas que a escolha pesa: a retomada é
         sempre uma por conteúdo — a próxima —, então só a escada se expande. */
      ? '<div class="linha" title="Vale para as revisões — o card de continuar é sempre um só, o próximo">' +
        '<span class="hl-tema">Revisões:</span>' +
        [[false,"Só as 2 próximas"],[true,"Todas as agendadas"]].map(([k,rot]) =>
          '<button class="aba aba-mini" data-acao="agenda-completa" data-valor="'+k+'" aria-selected="'+(!!ui.agendaCompleta===k)+'">' +
          rot + '</button>').join("") +
        '</div>' +
        /* revisões até a prova, por conteúdo: o atalho abre a janela com a escolha
           do conteúdo (já no filtrado, se houver um) */
        (conteudosCad().some(podeEscolherAteProva)
          ? '<div class="linha linha-rev-prova"><button class="act atalho" type="button" data-acao="revisoes-prova" ' +
            'title="Escolha, por conteúdo concluído, quantas revisões fazer até a prova e em que dias">' +
            'Personalizar revisões até a prova</button></div>'
          : '')
      : '') +
    '</div>';
  h += cardAtrasadas(naFase);
  if (visao === "dia")  return h + agendaPorDia(naFase, fase);
  if (visao === "mes")  return h + agendaDoMes(naFase);

  // agrupa por assunto (sessão de estudo ou revisão avulsa) — dentro da sub-aba escolhida
  const grupos = new Map();
  const soTarefas = naFase.filter(x => x.tarefa);
  naFase.forEach(x => {
    if (x.tarefa) return;                     // tarefa não tem assunto: vai no card "Tarefas", acima
    const k = chaveCard(x.rev);
    if (!grupos.has(k)) grupos.set(k, { chave: k, disciplina: x.ctx.disciplina, assunto: x.ctx.rotulo,
                                        sub: x.ctx.sub,
                                        primeiro: x.ctx.assuntos[0] || "", ctx: x.ctx, itens: [] });
    grupos.get(k).itens.push(x);
  });

  if (!grupos.size && !soTarefas.length && (filtroDisc || filtroAssunto)){
    return h + '<div class="vazio"><strong>' +
      (fase === "concluidos" ? "Nada concluído com este filtro em dias anteriores" : "Nada a fazer com este filtro") +
      '</strong>Troque a disciplina ou o conteúdo no filtro acima, ou use <b>✕ limpar</b>.</div>';
  }
  if (soTarefas.length) h += cardTarefas(soTarefas, fase);
  if (!grupos.size && soTarefas.length) return h;
  if (!grupos.size){
    return h + (fase === "concluidos"
      ? '<div class="vazio"><strong>Nada concluído em dias anteriores</strong>' +
        'O que você marcar hoje aparece aqui a partir de amanhã.</div>'
      : '<div class="vazio"><strong>Nada agendado ainda</strong>' +
        'Registre uma sessão na aba “Sessões” — o plano é montado automaticamente — ou use o botão acima para lançar uma revisão à mão.</div>');
  }

  /* ORDEM ALFABÉTICA. Esta visão é a de PROCURAR um assunto ("cadê Crase?"), e
     procurar só funciona quando a ordem é previsível — a urgência já tem as
     suas telas (o card de hoje, o de atrasadas, a visão por dia). O atraso não
     some da lista: continua na etiqueta vermelha do card. */
  const ordenados = [...grupos.values()].map(g => {
    const est = estatContexto(g.ctx);
    const temAtraso = g.itens.some(x => x.status === "atrasada");
    return { g, est, temAtraso };
  }).sort((a,b) => a.g.assunto.localeCompare(b.g.assunto, "pt-BR", { sensitivity: "base" }));

  h += '<div class="card"><h2>Agenda por assunto <span class="dica">marque o que já fez</span></h2>';
  // com muitos assuntos a tela vira uma parede: mostra os primeiros e guarda o
  // resto atrás do "+".
  const visiveis = ui.verTodosAssuntos ? ordenados : ordenados.slice(0, CONFIG.ASSUNTOS_VISIVEIS);
  /* Em ordem alfabética o corte é cego à urgência: um assunto atrasado pode
     cair atrás do "+". Então o botão conta quantos ficaram lá — senão a lista
     esconderia justamente o que não podia ser escondido. */
  const atrasoEscondido = ordenados.slice(visiveis.length).filter(o => o.temAtraso).length;
  h += visiveis.map(({g, est, temAtraso}) => {
    const itens = g.itens.slice().sort((a,b) => a.rev.data.localeCompare(b.rev.data));
    // o dono do card diz a fase: aberto = voltas; fechado = escada de revisões
    const dono = donoDaRevisao(g.itens[0].rev);
    const aberto = conteudoAberto(dono);
    const desde = dono ? D.dif(dono.concluidoEm || dono.data || D.hoje(), D.hoje()) : 0;
    const mini = minimizados.has(g.chave);
    // minimizado, o card fica só no cabeçalho — e diz quanto guarda e quando é o próximo
    const proximo = itens.find(x => !x.rev.feita);
    return '<div class="grupo-rev'+(temAtraso ? " tem-atraso" : "")+(aberto ? " aberto" : "")+(mini ? " minimizado" : "")+'">' +
      '<div class="linha cab">' +
      // a seta e o nome são um botão só: o nome inteiro é área de clique
      '<button class="minimizar" type="button" data-acao="minimizar-assunto" data-chave="'+esc(g.chave)+'" ' +
        'aria-expanded="'+(!mini)+'" title="'+(mini ? "Mostrar os itens" : "Minimizar este card")+'">' +
        '<span class="seta" aria-hidden="true"></span><strong>'+esc(g.assunto)+'</strong></button>' +
      '<span class="badge">'+esc(g.disciplina)+'</span>' +
      (mini ? '<span class="badge">'+itens.length+(itens.length === 1 ? " item" : " itens") +
              (proximo ? ' · próximo ' + D.br(proximo.rev.data) : '')+'</span>' : '') +
      (aberto ? '<span class="badge b-misto" title="A agenda está chamando para voltar ao assunto, não para revisar">' +
                'em andamento' + (desde >= CONFIG.AVISO_ABERTO_DIAS ? ' · há ' + desde + ' dias' : '') + '</span>' : '') +
      (temAtraso ? '<span class="badge b-critico">tem atraso</span>' : '') +
      (g.ctx.assuntos.length === 1 && pausaAteProva(acharConteudo(g.disciplina, g.ctx.assuntos[0]))
        ? '<span class="badge" title="Até a prova, as revisões deste conteúdo são as que você escolheu; depois dela, o automático volta">' +
          'datas suas até ' + D.br(pausaAteProva(acharConteudo(g.disciplina, g.ctx.assuntos[0]))) + '</span>' : '') +
      '<span class="spacer"></span>' +
      '<button class="act'+(aberto && desde >= CONFIG.AVISO_ABERTO_DIAS ? " destaque" : "")+'" ' +
        'data-acao="'+(aberto ? "concluir-conteudo" : "reabrir-conteudo")+'" ' +
        'data-disc="'+esc(g.disciplina)+'" data-conts="'+esc(g.ctx.assuntos.join("|"))+'" ' +
        'title="'+(aberto ? "Vale para todas as sessões deste conteúdo: começa a repetição espaçada"
                          : "Volta a ser conteúdo em andamento, em todas as sessões")+'">' +
        (aberto ? "✓ terminei este conteúdo" : "↩ reabrir conteúdo") + '</button>' +
      '<button class="act" data-acao="nova-revisao" data-disc="'+esc(g.disciplina)+'" data-ass="'+esc(g.ctx.assuntos.join("|"))+'">+ revisão</button>' +
      '<button class="act" data-acao="ver-erros" data-disc="'+esc(g.disciplina)+'" data-ass="'+esc(g.primeiro)+'">anotações →</button></div>' +
      (mini ? '' : itens.map(linhaRevisao).join("")) + '</div>';
  }).join("");
  if (ordenados.length > CONFIG.ASSUNTOS_VISIVEIS){
    h += '<button class="act ver-mais' + (atrasoEscondido ? " destaque" : "") + '" data-acao="toggle-assuntos">' +
         (ui.verTodosAssuntos ? "− mostrar menos"
                              : "+ ver todos os " + ordenados.length + " assuntos" +
                                (atrasoEscondido ? " · " + atrasoEscondido + " com atraso aqui dentro" : "")) +
         '</button>';
  }
  return h + '</div>';
}
/* AS TAREFAS NA VISÃO POR ASSUNTO. Tarefa não tem assunto, então ganha um card
   só dela, antes dos assuntos, em ordem de data (em "Concluídos", da mais
   recente para a mais antiga, como o resto daquela sub-aba). */
function cardTarefas(lista, fase){
  const ord = fase === "concluidos"
    ? lista.slice().sort((a,b) => diaConcluida(b.rev).localeCompare(diaConcluida(a.rev)))
    : lista;
  const quando = x => x.rev.feita ? "feita em " + D.br(diaConcluida(x.rev))
                    : x.status === "atrasada" ? "atrasada desde " + D.extenso(x.rev.data)
                    : x.status === "hoje" ? "hoje" : D.extenso(x.rev.data);
  return '<div class="card"><h2>Tarefas <span class="dica">' + plural(lista.length, "tarefa", "tarefas") + '</span></h2>' +
    ord.map(x => itemTarefa(x, quando(x), { editavel: true })).join("") + '</div>';
}
/* VISÃO POR DIA — o padrão. A pergunta que a pessoa traz para esta aba é "o
   que eu faço agora?", e ela se responde com os próximos dias em lista, não
   com o cronograma inteiro por assunto.                                     */
function agendaPorDia(det, fase){
  const hoje = D.hoje();
  if (fase === "concluidos") return agendaJaFeita(det);
  const futuras = det.filter(x => !x.rev.feita && x.rev.data > hoje)
                     .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
  if (!futuras.length){
    return '<div class="card"><h2>Próximos dias</h2>' +
      '<div class="vazio">' + (det.length
        ? '<strong>Nada marcado para a frente</strong>O que existe está em hoje ou atrasado.'
        : '<strong>Agenda vazia</strong>Registre uma sessão na aba <b>Sessões</b> — o plano nasce de lá.') +
      '</div></div>';
  }
  const teto = ui.verTodaAgenda ? futuras.length : CONFIG.AGENDA_VISIVEL;
  const mostradas = futuras.slice(0, teto);
  const dias = new Map();
  mostradas.forEach(x => {
    if (!dias.has(x.rev.data)) dias.set(x.rev.data, []);
    dias.get(x.rev.data).push(x);
  });
  const blocos = [...dias.entries()].map(([data, itens]) => {
    const faltam = D.dif(hoje, data);
    const noDia = futuras.filter(x => x.rev.data === data).length;    // o dia inteiro, não só o que coube
    return '<div class="dia-bloco">' +
      '<div class="dia-rotulo">' + esc(D.semana(data)) + ' · ' + D.br(data) +
        '<span>' + (faltam === 1 ? "amanhã" : "em " + faltam + " dias") +
        ' · ' + plural(noDia, "item", "itens") + '</span></div>' +
      itens.map(x => itemRevisao(x, "", { editavel: true })).join("") + '</div>';
  }).join("");
  return '<div class="card"><h2>Próximos dias ' +
    '<span class="dica">' + futuras.length + (futuras.length === 1 ? " item na agenda" : " itens na agenda") + '</span></h2>' +
    blocos +
    (futuras.length > CONFIG.AGENDA_VISIVEL
      ? '<button class="act ver-mais" data-acao="toggle-agenda">' +
        (ui.verTodaAgenda ? "− mostrar menos" : "+ ver todos os " + futuras.length + " itens") + '</button>'
      : '') + '</div>';
}

/* A MESMA VISÃO POR DIA, do outro lado do corte: o que já foi marcado em dias
   anteriores, do mais recente para o mais antigo — é assim que se relê o que
   passou. O dia que manda é o em que foi CONCLUÍDA, não o em que foi marcada:
   uma revisão de terça cumprida na quinta aparece na quinta, que é o dia em
   que ela de fato aconteceu.                                                */
function agendaJaFeita(det){
  const lista = det.slice().sort((a,b) => diaConcluida(b.rev).localeCompare(diaConcluida(a.rev)));
  if (!lista.length){
    return '<div class="card"><h2>Dias anteriores</h2>' +
      '<div class="vazio"><strong>Nada concluído em dias anteriores</strong>' +
      'O que você marcar hoje aparece aqui a partir de amanhã.</div></div>';
  }
  const teto = ui.verTodaAgenda ? lista.length : CONFIG.AGENDA_VISIVEL;
  const dias = new Map();
  lista.slice(0, teto).forEach(x => {
    const d = diaConcluida(x.rev);
    if (!dias.has(d)) dias.set(d, []);
    dias.get(d).push(x);
  });
  const blocos = [...dias.entries()].map(([data, itens]) => {
    const faz = D.dif(data, D.hoje());
    return '<div class="dia-bloco">' +
      '<div class="dia-rotulo">' + esc(D.semana(data)) + ' · ' + D.br(data) +
        '<span>' + (faz === 1 ? "ontem" : "há " + faz + " dias") +
        ' · ' + itens.length + (itens.length === 1 ? " item" : " itens") + '</span></div>' +
      itens.map(x => itemRevisao(x, "", { editavel: true })).join("") + '</div>';
  }).join("");
  return '<div class="card"><h2>Dias anteriores ' +
    '<span class="dica">' + lista.length + (lista.length === 1 ? " item concluído" : " itens concluídos") + '</span></h2>' +
    '<p class="sub">O que foi marcado antes de hoje, do mais recente para o mais antigo.</p>' +
    blocos +
    (lista.length > CONFIG.AGENDA_VISIVEL
      ? '<button class="act ver-mais" data-acao="toggle-agenda">' +
        (ui.verTodaAgenda ? "− mostrar menos" : "+ ver todos os " + lista.length + " itens") + '</button>'
      : '') + '</div>';
}

/* VISÃO DO MÊS — a de longe. Cada dia mostra quantos itens tem e de que cor:
   vermelho se há atraso, verde se tudo já foi feito, verde-escuro se há o que
   fazer. Clicar num dia abre a lista daquele dia, logo abaixo.              */
function agendaDoMes(det){
  const hoje = D.hoje();
  const mes = ui.mesAgenda || hoje.slice(0,7);
  const [ano, m] = mes.split("-").map(Number);
  const primeiro = mes + "-01";
  const inicio = D.soma(primeiro, -D.parse(primeiro).getDay());
  const porDia = new Map();
  det.forEach(x => {
    const d = x.rev.feita ? (x.rev.feitaEm || x.rev.data) : x.rev.data;
    const atual = porDia.get(d) || { total: 0, atrasadas: 0, feitas: 0, tarefas: 0 };
    atual.total++;
    if (x.tarefa) atual.tarefas++;
    if (x.rev.feita) atual.feitas++; else if (x.status === "atrasada") atual.atrasadas++;
    porDia.set(d, atual);
  });
  let celulas = "";
  for (let i = 0; i < 42; i++){
    const data = D.soma(inicio, i);
    if (i >= 35 && data.slice(0,7) !== mes) break;
    const doMes = data.slice(0,7) === mes;
    const info = porDia.get(data);
    const cor = !info ? "" : info.atrasadas ? "var(--critico-soft)"
              : info.feitas === info.total ? "var(--bom-soft)" : "var(--accent-soft)";
    const sel = data === ui.diaAgenda;
    // dia com tarefa ganha um segundo pontinho, na cor dela; só tarefa, só o dela
    const soTarefa = info && info.tarefas === info.total;
    celulas += '<button class="cal-dia' + (doMes ? "" : " fora") + (data === hoje ? " hoje" : "") +
      (info && info.tarefas && !soTarefa ? " dois-pts" : "") +
      (sel ? " sel" : "") + '" data-acao="dia-agenda" data-dia="' + data + '"' +
      (cor && !sel ? ' style="background:' + cor + '"' : '') +
      ' title="' + esc(D.extenso(data) + (info ? " — " + plural(info.total, "item", "itens") +
        (info.atrasadas ? ", " + plural(info.atrasadas, "atrasado", "atrasados") : "") : " — nada marcado")) + '">' +
      Number(data.slice(8)) +
      (info && !soTarefa ? '<span class="pt" style="background:' + (info.atrasadas ? "var(--critico)"
              : info.feitas === info.total ? "var(--bom)" : "var(--accent-forte)") + '"></span>' : '') +
      (info && info.tarefas ? '<span class="pt pt-tarefa"></span>' : '') +
      '</button>';
  }
  const nomeMes = ["janeiro","fevereiro","março","abril","maio","junho",
                   "julho","agosto","setembro","outubro","novembro","dezembro"][m-1];
  const doDia = ui.diaAgenda ? det.filter(x => (x.rev.feita ? (x.rev.feitaEm || x.rev.data) : x.rev.data) === ui.diaAgenda)
                             : [];
  const temTarefa = [...porDia.values()].some(i => i.tarefas);
  return '<div class="card"><h2>Mês <span class="dica">clique num dia para ver o que há nele' +
    (temTarefa ? ' · <span class="pt-legenda" style="background:var(--star)"></span> tarefa' : '') + '</span></h2>' +
    '<div class="cal" style="width:100%;max-width:420px">' +
      '<div class="cal-cab"><b>' + nomeMes + ' ' + ano + '</b>' +
        (mes === hoje.slice(0,7) ? '' : '<button class="act" data-acao="mes-agenda" data-delta="0">hoje</button>') +
        '<button class="cal-nav" data-acao="mes-agenda" data-delta="-1" aria-label="Mês anterior">‹</button>' +
        '<button class="cal-nav" data-acao="mes-agenda" data-delta="1" aria-label="Próximo mês">›</button>' +
      '</div>' +
      '<div class="cal-semana">' + ["dom","seg","ter","qua","qui","sex","sáb"].map(n => '<span>'+n+'</span>').join("") + '</div>' +
      '<div class="cal-dias">' + celulas + '</div>' +
    '</div>' +
    (ui.diaAgenda
      ? '<div style="margin-top:14px"><div class="dia-rotulo">' + esc(D.extenso(ui.diaAgenda)) +
        '<span>' + doDia.length + (doDia.length === 1 ? " item" : " itens") + '</span></div>' +
        (doDia.length ? doDia.map(x => itemRevisao(x, rotuloDeHoje(x, ui.diaAgenda))).join("")
                      : '<div class="vazio">Nada marcado neste dia.</div>') + '</div>'
      : '') + '</div>';
}

/* "Como o cronograma é montado?" saiu do pé da Agenda (pedido do Pedro, 26/09): a explicação
   mora na Ajuda, seção Continuar e revisar. */

/* ---------- linha e formulário de revisão ---------- */
function linhaRevisao(x){
  const rev = x.rev;
  const rot = { feita:(ehRetomada(rev) ? "continuado em " : "revisada em ")+(rev.feitaEm ? D.br(rev.feitaEm) : D.br(rev.data)),
                atrasada:"atrasada desde "+D.extenso(rev.data),
                hoje:"hoje — "+D.extenso(rev.data), futura:D.extenso(rev.data) }[x.status];
  const num = numerosDaRevisao(rev);           // tempo e questões vêm da sessão
  const partes = [];
  if (num.minutos) partes.push(hhmm(num.minutos));
  const junto = juntoCom(rev);                 // a mesma sessão cumpriu outros itens: o tempo é dela, dividido
  if (junto) partes.push(junto);
  if (num.questoes) partes.push(num.acertos+"/"+num.questoes+" questões");
  if (rev.dataOriginal) partes.push("estava marcada para " + D.br(rev.dataOriginal));
  const extra = partes.length ? " · " + partes.join(" · ") : "";
  const nome = nomeRevisao(rev);
  const bloq = bloqueadaPelaProva(rev);
  // a âncora do salto vindo do card de hoje (ver "ir-para-card")
  return '<div class="item rev-linha '+x.status+(bloq ? " bloqueada" : "")+'" id="rev-'+esc(rev.id)+'"'+(bloq ? ' aria-disabled="true"' : '')+'>' +
    '<div class="rev-topo">' +
      '<button class="check" role="checkbox" aria-checked="'+rev.feita+'" data-acao="'+(rev.feita?"reabrir":"concluir")+'" data-id="'+esc(rev.id)+'" ' +
      (bloq ? 'disabled ' : '') +
      'title="'+(rev.feita?"Desmarcar":"Confirmar que já fiz")+'" aria-label="'+esc((rev.feita?"Desmarcar ":"Confirmar que já fiz: ") + nome)+'">✓</button>' +
      '<div class="corpo"><div class="titulo" style="font-size:13.5px">' +
        esc(nome) + ' — ' + esc(rot) + '</div>' +
      '<div class="meta">'+ (rev.feita ? "concluída"+extra : "planejada para "+D.brFull(rev.data)+extra) +
        (bloq ? ' · <span class="selo-bloq">bloqueada até ' + D.br(bloq) + '</span>' : '') +
        // com nome próprio, a posição na sequência sai do título e vai para cá
        (rev.rotulo && ordemVisivel(rev) ? ' · ' + ordemVisivel(rev) + 'ª da sequência' : '') +
        '</div></div>' +
      (bloq ? '' : (rev.sessaoId ? '<button class="act" data-acao="abrir-sessao" data-id="'+esc(rev.sessaoId)+'" ' +
        'title="As horas ficam na sessão — clique para editá-las">ver sessão</button>' : '') +
      '<button class="act" data-acao="editar-revisao" data-id="'+esc(rev.id)+'">editar</button>') +
    '</div>' + descricaoAtividade(rev) + '</div>';
}

/** Formulário de nova revisão / edição — data, o que foi revisado, tempo e desempenho. */

    (rev ? '<button class="act excluir excluir-tela" type="button" data-acao="excluir-revisao" data-id="'+esc(rev.id)+'">Excluir</button>' : '') +

/* CRIAÇÃO EM CADEIA. Quem monta a própria rotina (ou traz uma de fora) marca
   várias datas de uma vez para o mesmo conteúdo, e cada data vira um card.
   As datas ficam em etiquetas (inputs escondidos "datas"); a caixa de data
   também vale sozinha — sem etiqueta nenhuma, é um card só, como sempre foi.
   Dois atalhos geram as etiquetas a partir da data da caixa: "a cada N dias,
   K vezes" e a escada padrão. */
function campoDatasEmCadeia(semEspacado){   // semEspacado: a tarefa não tem escada de revisão
  /* Revisão de UX (26/09): os atalhos eram links soltos ("gerar", "escada D+1…")
     e no celular a frase "a cada 7 dias, 4 vezes" quebrava no meio. Agora a caixa
     de data vale sozinha, e "Mais de uma data" guarda os três jeitos de marcar
     várias, como botões de verdade. As datas escolhidas aparecem embaixo. */
  return '<div class="campo largo"><span id="rotDataRev">Data *</span>' +
    '<input type="date" name="data" id="dataRevisao" aria-labelledby="rotDataRev" value="'+D.hoje()+'" style="max-width:200px">' +
    '<details class="mais-datas"><summary>Mais de uma data</summary>' +
      '<div class="mais-datas-corpo">' +
        '<button class="btn mini ghost" type="button" data-acao="add-data-rev">+ Adicionar a data acima</button>' +
        '<div class="linha cadeia">' +
          '<label for="cadeiaCada">A cada</label>' +
          '<input type="number" id="cadeiaCada" min="1" max="90" value="7">' +
          '<label for="cadeiaVezes">dias,</label>' +
          '<input type="number" id="cadeiaVezes" min="1" max="30" value="4">' +
          '<span>vezes</span>' +
          '<button class="btn mini ghost" type="button" data-acao="gerar-datas-rev">Gerar</button>' +
        '</div>' +
        (semEspacado ? '' :
        '<button class="btn mini ghost" type="button" data-acao="escada-datas-rev">Espaçado: ' +
          CONFIG.INTERVALOS_LIVRES.slice(0, 5).join(", ").replace(/, (\d+)$/, " e $1") + ' dias</button>') +
      '</div></details>' +
    '<div id="datasRevisao" class="tags" style="margin-top:7px"></div></div>';
}
/** põe uma data na lista de etiquetas (sem repetir), em ordem */
function adicionarDataCadeia(data){
  const box = document.getElementById("datasRevisao");
  if (!box || !data) return;
  const atuais = [...box.querySelectorAll('input[name="datas"]')].map(i => i.value);
  if (atuais.includes(data)) return;
  atuais.push(data); atuais.sort();
  box.innerHTML = atuais.map(dt => '<span class="tag" data-data="'+dt+'">' + esc(D.semana(dt)) + ', ' + D.br(dt) +
    '<input type="hidden" name="datas" value="'+dt+'">' +
    '<button type="button" data-acao="tirar-data-rev" aria-label="Tirar esta data">✕</button></span>').join("");
}
function gerarDatasCadeia(escada){
  const base = (document.getElementById("dataRevisao") || {}).value || D.hoje();
  const offs = escada
    ? CONFIG.INTERVALOS_LIVRES.slice(0, 5)
    : (() => {
        const cada = Math.max(1, Math.min(90, Number((document.getElementById("cadeiaCada") || {}).value) || 7));
        const vezes = Math.max(1, Math.min(30, Number((document.getElementById("cadeiaVezes") || {}).value) || 4));
        return Array.from({ length: vezes }, (_, i) => i * cada);
      })();
  offs.forEach(o => adicionarDataCadeia(D.soma(base, o)));
}

/* ---------- formulário da tarefa ----------
   Título e data, e só. Hora e detalhes são opcionais. Nova, aceita várias datas
   de uma vez (o mesmo "Mais de uma data" da revisão): cada data vira uma tarefa.
   Dia de prova NÃO é barrado — "levar documento" cai justamente nele. */
