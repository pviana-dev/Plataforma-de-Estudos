/** Recria as revisões PENDENTES de um registro (as já feitas são preservadas). */
/* Plano de revisões de um registro:
   "individual"  → o padrão: a sessão tem o seu plano, deduplicado por conteúdo
   "sem"         → conteúdo de estudo diário: registra o tempo, mas não gera cronograma
   "manual"      → só o que você marcou à mão; nada é agendado automaticamente      */
const planoDe = reg => reg.plano || "individual";
/* FASE DO CONTEÚDO. "andamento" (padrão) = você ainda está vendo aquilo pela
   primeira vez; a agenda chama para VOLTAR ao assunto, uma volta de cada vez.
   "concluido" = primeira passada fechada; aí começa a escada da repetição
   espaçada, contada do dia em que você fechou.                              */
/* A fase de uma SESSÃO é lida dos conteúdos dela: está aberta
   enquanto qualquer um dos seus conteúdos estiver aberto. Assim não existe
   sessão "concluída" falando de conteúdo que ainda está sendo visto.        */
function faseDe(alvo){
  if (!alvo) return "andamento";
  const itens = conteudosDoAlvo(alvo);
  if (!itens.length) return alvo.fase === "concluido" ? "concluido" : "andamento";
  return itens.every(c => c.fase === "concluido") ? "concluido" : "andamento";
}
/** as fichas de conteúdo de uma sessão */
function conteudosDoAlvo(alvo){
  if (!alvo) return [];
  // duas sessões antigas de A e B juntados apontam para a mesma ficha: uma vez só
  return [...new Set(assuntosDe(alvo).map(a => acharConteudo(alvo.disciplina, a)).filter(Boolean))];
}
/* SEM FICHA, NADA É AGENDADO. Quem planeja olha a SESSÃO, não o cadastro: sem
   esta guarda, excluir um conteúdo não pegaria — garantirRetomadas() (e o
   replanejamento) marcariam uma volta nova no dia seguinte, e o conteúdo
   apagado voltaria sozinho para a agenda. A sessão continua registrada, com as
   horas e as questões; o que acabou é a cobrança. */
const temCadastro = alvo => conteudosDoAlvo(alvo).length > 0;

const conteudoAberto = alvo => faseDe(alvo) === "andamento";
/** quantos dias até a próxima volta, num conteúdo ainda aberto */
/* Quem decide o ritmo é a DIFICULDADE, só ela. A taxa de acerto continua
   medindo desempenho na tela, mas ficou fora do cronograma: ela oscila com o
   lote de questões do dia e fazia o plano balançar junto, sem você ter pedido. */
function diasDaVolta(dificuldade){
  const nivel = tresNiveis(dificuldade);
  const escolhido = Number((db.diasRetomada || {})[nivel]);          // o que você pôs nos ajustes
  if (escolhido >= 1) return Math.min(CONFIG.VOLTA_MAX_ESCOLHA, Math.round(escolhido));
  return diasDaVoltaPadrao(nivel);
}
/* O TEMPO DE ESTUDO PREVISTO: até quando você pretende estudar. Não é só a
   prova — vale também sem objetivo nenhum. Nesta ordem: o que você disse nos
   ajustes ("estudo previsto até"), a prova que está à frente, o "revisar até".
   Sem nenhum deles, não há prazo. */
function fimDoEstudoPrevisto(estudoAte, revisarAte){
  const ate = estudoAte === undefined ? db.estudoAte : estudoAte;
  if (ate && ate > D.hoje()) return ate;
  if (provaFutura()) return ultimaProva();
  return (revisarAte === undefined ? db.revisarAte : revisarAte) || "";
}
/** o padrão: dificuldade × tempo de estudo previsto (`fim` só para a tela prever antes de salvar) */
/* EXEMPLO QUE NÃO PARECE VALOR (revisão de UX R1, 27/09). Número ou nome cinza dentro
   da caixa, do tamanho de um digitado, passava por preenchido. Exemplo vira "ex.: 60";
   o que vale se a caixa ficar em branco diz "padrão:" — ou vai para o lado, quando
   a caixa é estreita demais (os dias até continuar). */
const padraoDoNome = nome => nome ? "padrão: " + nome : "";
const textoPadraoVolta = n => "dias · padrão " + n;
function diasDaVoltaPadrao(nivel, fim){
  if (fim === undefined) fim = fimDoEstudoPrevisto();
  const faltam = fim ? D.dif(D.hoje(), fim) : Infinity;
  const faixa = faltam <= CONFIG.VOLTA_PERTO ? "perto" : faltam <= CONFIG.VOLTA_MEDIO ? "medio" : "longe";
  return CONFIG.VOLTA_DIAS[faixa][tresNiveis(nivel)];
}
/** a revisão é uma volta (conteúdo aberto) ou revisão de verdade? */
const ehRetomada = rev => !!rev && !!rev.retomada;
/* O VOCABULÁRIO MUDA COM A NATUREZA DO ITEM. Conteúdo em andamento é chamado
   para CONTINUAR (o item se chama "Continuar" — até 24/09 era "Retomar"; por
   dentro o dado continua `retomada`); conteúdo concluído tem REVISÕES. Onde é
   preciso um substantivo, o item de continuar é o "card" (escolha do Pedro). A agenda já fala assim — a tela
   de edição é a mesma para os dois, e chamar uma volta de "revisão" ali desmente
   o que o card acabou de dizer. Um lugar só, para as duas não se descolarem. */
function termosDoItem(rev){
  return ehRetomada(rev)
    ? { titulo:"Editar card", item:"card", doItem:"do card", esta:"este card", ligada:"ligada a ele",
        conteudos:"Conteúdos a continuar *", nomePadrao:"Continuar",
        cumpre:"que continuar o conteúdo", atualizado:"Card atualizado.", excluido:"Card excluído.",
        exemploNota:"Ex.: parei na aula 4, continuar dos mapas mentais" }
    : { titulo:"Editar revisão", item:"revisão", doItem:"da revisão", esta:"esta revisão", ligada:"ligada a ela",
        atualizado:"Revisão atualizada.", excluido:"Revisão excluída.",
        conteudos:"Conteúdos revisados *", nomePadrao:"",
        cumpre:"que cumprir esta revisão",
        exemploNota:"Ex.: refazer as 10 questões que errei da aula 3" };
}
/** a volta em aberto de OUTRA sessão do mesmo conteúdo (é ela que anda, em vez de duplicar) */
function voltaEmAberto(reg, opcoes){
  const chave = chaveSessao(reg);
  const manter = !!(opcoes && opcoes.manterAtrasadas), hoje = D.hoje();
  return db.revisoes.find(r => {
    if (r.feita || r.manual || !ehRetomada(r) || !r.registroId || r.registroId === reg.id) return false;
    if (manter && r.data < hoje) return false;          // atrasada fica atrasada (replanejarTudo)
    if (r.id === reg.revisaoId) return false;          // é a volta que esta sessão está fechando
    /* Volta JÁ VENCIDA não anda: ela é cumprida por esta sessão (resolverLembrete)
       e fica no histórico como "voltei neste dia". Só a que ainda está por vir
       é que se desloca, para não marcar duas idas ao mesmo conteúdo. */
    if (r.data <= reg.data) return false;
    const dono = acharRegistro(r.registroId);
    return !!dono && conteudoAberto(dono) && chaveSessao(dono) === chave;
  }) || null;
}
const ROTULO_PLANO = { sem: "sem cronograma", manual: "revisão manual" };

function gerarRevisoes(reg, opcoes){
  if (planoDe(reg) === "sem"){                                 // sem cronograma: limpa o que era automático
    db.revisoes = db.revisoes.filter(r => r.registroId !== reg.id || r.feita || r.manual);
    return;
  }
  if (ehRevisaoSessao(reg)) return;                            // sessão de revisão não agenda nada
  if (!temCadastro(reg)) return;                               // conteúdo excluído do cadastro
  if (!agendamentoAtivo()) return;                             // você disse que encerrou os estudos
  if (sessaoEmSilencio(reg)) return;                           // a prova dela passou: espera o último dia
  /* Conteúdo FECHADO: a escada é do conteúdo, não da sessão — continuarEscada
     não apaga nada, só completa o que falta. Estudar de novo um conteúdo
     concluído não abre uma segunda fila: é contato, e contato empurra a escada
     que já existe (reancorarEscada). */
  conteudosDoAlvo(reg).filter(c => c.fase === "concluido").forEach(continuarEscada);
  if (!conteudoAberto(reg) || !autoContinuar()) return;        // cards de continuar fora do automático

  const base = contarDoUltimoEstudo ? reg.data : (opcoes && opcoes.base) || reg.data;
  // revisões feitas e as criadas/editadas à mão nunca são reescritas pelo replanejamento
  const mantidas = db.revisoes.filter(r => r.registroId === reg.id && (r.feita || r.manual));
  // o que se refaz aqui são as VOLTAS; a escada dos conteúdos fechados fica
  /* manterAtrasadas (replanejar tudo): a volta que já venceu continua onde está.
     Mudar o horizonte refaz o que vem pela frente; o dia que era para ter sido
     usado continua atrasado (decisão do Pedro) — antes ele sumia e a volta
     reaparecia daqui a N dias, como se nada tivesse ficado para trás. */
  const hojeJa = D.hoje();
  const atrasadaMantida = r => !!(opcoes && opcoes.manterAtrasadas) && !r.feita && r.data < hojeJa;
  db.revisoes = db.revisoes.filter(r => r.registroId !== reg.id || r.feita || r.manual || !ehRetomada(r) || atrasadaMantida(r));
  const feitas = mantidas.filter(r => r.feita);

  const hoje = D.hoje();
  let partida = base < hoje && !contarDoUltimoEstudo ? hoje : base;   // nunca agenda no passado (religando, pularPassadas cuida)
  const ultimaFeita = feitas.map(f => f.feitaEm || f.data).sort().pop();
  if (ultimaFeita && ultimaFeita > partida) partida = ultimaFeita;

  /* CONTEÚDO AINDA ABERTO: uma volta de cada vez. Não adianta marcar cinco
     retornos de um assunto que você nem terminou de ver — o que serve é saber
     quando voltar da próxima vez. Feita a volta, a seguinte nasce dali.     */
  if (mantidas.some(r => !r.feita)) return;                     // já existe uma volta marcada à mão
  const quando = foraDaProva(pularPassadas(partida, diasDaVolta(dificuldadeDe(reg))));
  if (quando > limiteDe(reg)) return;
  if (mantidas.some(r => r.data === quando)) return;
  /* CONTINUAÇÃO. Conteúdo grande leva várias sessões, e cada sessão é dona do
     próprio plano — sem isto, duas sessões do mesmo conteúdo marcariam duas
     voltas idênticas no mesmo dia. Havendo uma volta em aberto do mesmo
     conteúdo, ela ANDA para a frente e passa a pertencer à sessão nova, que
     é a que tem o contexto mais recente.                                   */
  const irma = voltaEmAberto(reg, opcoes);
  if (irma){ irma.registroId = reg.id; irma.data = quando; return; }
  /* E o resto segue a invariante: só nasce volta para o conteúdo que ainda
     não tem quem o chame de volta (ver conteudosSemVolta). */
  const faltando = conteudosSemVolta(reg);
  separarPorCard(reg, faltando).forEach(lista => marcarVolta(reg, lista, partida));
}

/* ==========================================================================
   A ESCADA É DO CONTEÚDO. Cada conteúdo concluído tem uma fila só de revisões:
   as que o sistema marca e quantas você quiser marcar à mão. Três regras:

   1. CONTINUAR (continuarEscada): a fila vai até o fim da escada. Havendo
      revisões pendentes — automáticas ou suas —, as próximas nascem DEPOIS da
      última, no degrau seguinte; não havendo, nascem do último contato.
   2. EMPURRAR (reancorarEscada): um contato com o conteúdo — revisão feita,
      com atraso ou não, revisão marcada à mão, sessão fora da agenda — vira o
      novo ponto de partida. Cada revisão seguinte mantém a DISTÂNCIA que tinha
      da anterior (o `passo`). Ex.: 15, 17 e 22 marcadas; revisão extra no dia
      20 → a de 22 vai para 25 (+5), e as de depois andam junto. Nada anda
      para trás: revisar antes da hora não adianta o que vem.
   3. A revisão extra não pula degrau: ela fica no degrau da anterior, porque
      revisar cedo não prova que o conteúdo fixou.
   ========================================================================== */
const porData = (a, b) => a.data.localeCompare(b.data);
/** o item da agenda fala deste conteúdo? (chave = chaveAssunto da ficha) */
function falaDe(rev, chave){
  const ctx = contextoRevisao(rev);
  return !!ctx && (ctx.assuntos || []).some(a => chaveAssunto(ctx.disciplina, a) === chave);
}
const chaveDaFicha = f => chaveAssunto(f.disciplina, f.nome);
/** as sessões do conteúdo, da mais recente para a mais antiga */
function sessoesDaFicha(ficha){
  return sessoesDoConteudo(ficha.disciplina, [ficha.nome]).slice()
    .sort((a,b) => String(b.data).localeCompare(String(a.data)) || (b.criadoEm||0) - (a.criadoEm||0));
}
/* A sessão que fala pelo conteúdo: a mais recente em que ele foi o card
   principal. Onde ele só foi "junto" (Estudar junto, 02/10), a sessão é do
   outro conteúdo — a dificuldade dela não é a dele, e ele segue no ritmo
   próprio. */
const sessaoPropriaDaFicha = ficha => sessoesDaFicha(ficha).find(s => grupoNaSessao(s, ficha.nome) === 0 && depoisDaJuncao(ficha, s)) || null;
/* Juntado, o conteúdo começa com a dificuldade mais alta dos que entraram nele
   (decisão do Pedro, 04/10), guardada na ficha. As sessões antigas de A e B
   contam como contato, mas não falam pela dificuldade: só as do conteúdo
   juntado, registradas depois da junção. */
const depoisDaJuncao = (ficha, s) => !ficha.juntadoEm ||
  ((s.criadoEm || 0) >= ficha.juntadoEm && assuntosDe(s).some(a => a.toLowerCase() === ficha.nome.toLowerCase()));
/** a dificuldade de AGORA: a da sessão mais recente do conteúdo, revisão ou estudo */
function dificuldadeDaFicha(ficha){
  const s = sessaoPropriaDaFicha(ficha);
  return s ? dificuldadeDe(s) : tresNiveis(ficha && ficha.dificuldade || 2);   // sem sessão: a escolhida na aba Disciplinas
}
/* MUDAR A DIFICULDADE PELA ABA DISCIPLINAS (pedido do Pedro, 26/09). A dificuldade
   de um conteúdo é a da sessão MAIS RECENTE dele — então é ali que a mudança entra,
   e salvar a sessão pelo caminho de sempre (salvarRegistro) faz o resto: refaz a
   escada do concluído, o card de continuar do em andamento, e a aba Sessões, o
   formulário e a agenda passam a mostrar a nova. Conteúdo ainda sem sessão guarda
   a escolha na ficha, e ela vem preenchida na primeira sessão.
   Devolve os outros conteúdos da mesma sessão (a dificuldade é da sessão). */
function definirDificuldadeDoConteudo(ficha, nivel){
  nivel = tresNiveis(nivel);
  const s = sessaoPropriaDaFicha(ficha);
  if (!s){ ficha.dificuldade = nivel; persistir(); return []; }
  if (dificuldadeDe(s) !== nivel) salvarRegistro(Object.assign({}, s, { dificuldade: nivel }));
  return assuntosDe(s).filter(a => a.toLowerCase() !== ficha.nome.toLowerCase());
}
/* A sessão que responde pela escada: a de estudo mais recente que agenda. É
   dela que o item tira a disciplina e o contexto do "continuar". Conteúdo que
   só aparece em sessão "sem revisão" (o estudo diário) não ganha escada. */
function donoDaEscada(ficha){
  return sessoesDaFicha(ficha).find(r => !ehRevisaoSessao(r) && planoDe(r) !== "sem") || null;
}
/** os itens de revisão (não voltas) do conteúdo, em ordem de data */
function itensDaFicha(ficha){
  const k = chaveDaFicha(ficha);
  return db.revisoes.filter(r => !ehRetomada(r) && falaDe(r, k)).sort(porData);
}
/** o degrau de um item: o guardado nele ou, no item antigo, o mais perto da data */
function degrauDoItem(rev, ficha, degraus){
  if (Number.isInteger(rev.degrau)) return Math.min(rev.degrau, degraus.length - 1);
  return degrauMaisPerto(degraus, Math.max(0, D.dif(ficha.concluidoEm || rev.data, rev.data)));
}

/* REVISÕES ATÉ A PROVA ESCOLHIDAS PELA PESSOA (pedido do Pedro, 25/09). Num
   conteúdo CONCLUÍDO, com prova marcada, a pessoa pode trocar a escada automática
   por revisões que ela mesma escolhe — quantas e em que dias — até a prova. Até
   lá, a escada automática fica PAUSADA só para aquele conteúdo; no dia seguinte à
   prova ela recomeça sozinha, a partir da última revisão. As datas escolhidas são
   dela: nada as empurra (reancorar/remanejar pulam `planoProva`).
   ficha.revisoesProva = "AAAA-MM-DD" → o conteúdo está no modo "eu escolho"
                                        até ESSA prova (guardada: se outra prova
                                        for marcada depois, a pausa não se estende).
   rev.planoProva = true               → revisão escolhida nesse modo (é manual).
   As revisões escolhidas não sobem degrau: passada a prova, a escada recomeça
   do degrau em que estava — o automático volta inteiro, não pela metade. */
/** a prova que vale para o conteúdo: a do dia ligado a ele (vestibular) ou a próxima; "" se não há prova à frente */
function dataProvaDaFicha(ficha){
  const hoje = D.hoje();
  const ligado = ficha ? diaDoConteudo(ficha) : null;
  if (ligado && ligado.data > hoje) return ligado.data;
  const prox = proximaProva();
  return prox && prox.data > hoje ? prox.data : "";
}
/** até que dia a escada automática deste conteúdo está pausada ("" = não está) */
function pausaAteProva(ficha){
  if (!ficha || ficha.fase !== "concluido" || typeof ficha.revisoesProva !== "string") return "";
  return ficha.revisoesProva >= D.hoje() ? ficha.revisoesProva : "";
}
/** o conteúdo pode escolher as revisões até a prova? (concluído, com escada, prova à frente) */
const podeEscolherAteProva = f => !!f && f.fase === "concluido" && !!dataProvaDaFicha(f) && escadaAtiva(f);
/** as revisões pendentes do conteúdo até a prova (o que o modal mostra e troca) */
function pendentesAteProva(ficha, prova){
  return itensDaFicha(ficha).filter(r => !r.feita && r.data <= prova);
}
/* Troca o plano do conteúdo. `datas` = lista de dias escolhidos (modo "eu
   escolho"); null = volta ao automático. As pendentes AUTOMÁTICAS do conteúdo
   saem todas (a escada é refeita depois da prova, ou do jeito de sempre), e as
   pendentes até a prova também — o modal as mostrou e a pessoa decidiu por elas.
   Item que fala também de outro conteúdo só perde este. */
function definirRevisoesProva(ficha, datas){
  const prova = dataProvaDaFicha(ficha);
  const chave = chaveDaFicha(ficha);
  const sai = r => !r.feita && !ehRetomada(r) &&
                   (!r.manual || r.planoProva || (datas && prova && r.data <= prova));
  db.revisoes = db.revisoes.filter(r => {
    if (!sai(r) || !falaDe(r, chave)) return true;
    const ctx = contextoRevisao(r);
    const resto = ctx.assuntos.filter(a => chaveAssunto(ctx.disciplina, a) !== chave);
    if (!resto.length) return false;
    r.assuntos = resto;
    return true;
  });
  if (!datas || !prova){
    delete ficha.revisoesProva;
  } else {
    ficha.revisoesProva = prova;
    const inicio = ficha.concluidoEm || "";
    const degraus = degrausDaFicha(ficha);
    const feitas = itensDaFicha(ficha).filter(r => r.feita && (r.feitaEm || r.data) >= inicio)
      .sort((a,b) => (a.feitaEm || a.data).localeCompare(b.feitaEm || b.data));
    const ultima = feitas[feitas.length - 1];
    const degrau = ultima ? degrauDoItem(ultima, ficha, degraus) : 0;
    const dono = donoDaEscada(ficha);
    const unicas = [...new Set(datas)].filter(d => d && d <= prova).sort();
    let ant = ultima ? (ultima.feitaEm || ultima.data) : (inicio || D.hoje());
    unicas.forEach((data, i) => {
      const rev = { id: uid(), assuntos: [ficha.nome], data, ordem: i + 1, degrau,
                    passo: Math.max(1, D.dif(ant, data)),
                    feita: false, feitaEm: null, minutos: null, questoes: null, acertos: null,
                    dificuldade: null, atividade: "", nota: "", manual: true, planoProva: true };
      if (dono) rev.registroId = dono.id;
      else { rev.registroId = null; rev.disciplina = ficha.disciplina; }
      db.revisoes.push(rev);
      ant = data;
    });
  }
  continuarEscada(ficha);
  juntarIrmas();
}
/** completa a escada do conteúdo até o último degrau que cabe no horizonte */
function continuarEscada(ficha){
  if (!ficha || ficha.fase !== "concluido" || !escadaAtiva(ficha)) return 0;
  const dono = donoDaEscada(ficha);
  if (!dono) return 0;
  const inicio = ficha.concluidoEm || D.hoje();
  const degraus = degrausDaFicha(ficha);
  const itens = itensDaFicha(ficha);
  const pendentes = itens.filter(r => !r.feita);
  const feitas = itens.filter(r => r.feita && (r.feitaEm || r.data) >= inicio)
    .sort((a,b) => (a.feitaEm || a.data).localeCompare(b.feitaEm || b.data));
  const hoje = D.hoje();
  let dia, k, piso;
  if (pendentes.length){
    const ultima = pendentes[pendentes.length - 1];
    dia = ultima.data; k = degrauDoItem(ultima, ficha, degraus);
    piso = D.soma(hoje, 1);                     // a pendente atrasada ainda é a de hoje
  } else if (feitas.length && !(ficha.ancoraEscada && ficha.ancoraEscada.dia > (feitas[feitas.length - 1].feitaEm || feitas[feitas.length - 1].data))){
    const ultima = feitas[feitas.length - 1];
    dia = ultima.feitaEm || ultima.data; k = degrauDoItem(ultima, ficha, degraus);
    piso = hoje;
  } else if (ficha.ancoraEscada && ficha.ancoraEscada.dia >= inicio){
    dia = ficha.ancoraEscada.dia; k = ficha.ancoraEscada.degrau; piso = hoje;   // ver replanejarAoReligar
  } else {
    dia = inicio; k = 0; piso = hoje;
  }
  const limite = ultimoDiaRevisao();
  const pausa = pausaAteProva(ficha), desde = inicioDasAutomaticas(ficha);
  let criadas = 0;
  for (let j = k + 1; j < degraus.length; j++){
    const passo = degraus[j] - degraus[j - 1];
    let quando = D.soma(dia, passo);
    /* Religando (replanejarAoReligar): o degrau que já passou conta como feito,
       sem marcar nada. Fica gravado no conteúdo (ancoraEscada) para a próxima
       conta não refazer a escada do começo. */
    if (contarDoUltimoEstudo && !pendentes.length && quando < hoje){
      dia = quando; ficha.ancoraEscada = { dia, degrau: j };
      continue;
    }
    if (quando < piso) quando = piso;           // o que era para ontem vira hoje, não uma pilha
    if (desde && quando < desde) quando = desde;  // religada a partir de um dia: nada antes dele
    // revisões escolhidas até a prova: a escada automática só volta DEPOIS dela
    if (pausa && quando <= pausa) quando = D.soma(pausa, 1);
    quando = foraDaProva(quando);
    if (quando > limite) break;                 // o resto nasce quando o horizonte andar
    db.revisoes.push({ id: uid(), registroId: dono.id, assuntos: [ficha.nome], data: quando,
                       ordem: j, degrau: j, passo,
                       feita: false, feitaEm: null, minutos: null, questoes: null, acertos: null,
                       dificuldade: null, atividade: "", nota: "", manual: false });
    dia = quando; piso = D.soma(quando, 1); criadas++;
  }
  return criadas;
}

/* A distância de cada item pendente até o anterior, gravada no item. Guardar
   (em vez de medir toda vez) é o que deixa o empurrão idempotente: salvar de
   novo a mesma sessão não empurra a escada uma segunda vez. */
function fixarPassos(ficha, novoId){
  const inicio = ficha.concluidoEm || "";
  const seq = itensDaFicha(ficha).filter(r => !r.feita || (r.feitaEm || r.data) >= inicio);
  const degraus = degrausDaFicha(ficha);
  let ant = inicio;
  seq.filter(r => r.id !== novoId).forEach(r => {
    if (!r.feita && !Number.isInteger(r.passo)) r.passo = Math.max(1, D.dif(ant || r.data, r.data));
    // o degrau também fica gravado: depois de empurrada, a data já não diz qual era
    if (!r.feita && !Number.isInteger(r.degrau)) r.degrau = degrauDoItem(r, ficha, degraus);
    ant = r.data;
  });
  const novo = novoId && seq.find(r => r.id === novoId);
  if (!novo || novo.feita) return;
  const antes = seq.filter(r => r.id !== novoId && r.data < novo.data);
  const prev = antes[antes.length - 1];
  if (!Number.isInteger(novo.passo)) novo.passo = Math.max(1, D.dif(prev ? prev.data : (inicio || novo.data), novo.data));
  // a revisão extra fica no degrau da anterior: revisar cedo não sobe a escada
  if (!Number.isInteger(novo.degrau)) novo.degrau = prev ? degrauDoItem(prev, ficha, degraus) : 0;
}

/* O EMPURRÃO. `data` é o dia do contato; `opcoes.exceto` é a revisão marcada à
   mão que causou o contato (ela fica onde você pôs); `opcoes.mesmoDia` empurra
   também o que estava marcado no próprio dia (revisão extra: o dia é dela).
   Item que fala também de um conteúdo que NÃO teve contato se divide: a parte
   tocada anda, o resto fica onde estava. */
function reancorarEscada(fichas, data, opcoes){
  const o = opcoes || {};
  const alvo = (fichas || []).filter(f => f && f.fase === "concluido" && !f.semAutomaticas && data >= (f.concluidoEm || ""));
  if (!alvo.length || !data) return 0;
  if (data > D.hoje() && !o.exceto) return 0;         // sessão no futuro não é contato ainda
  const chaves = new Set(alvo.map(chaveDaFicha));
  alvo.forEach(f => fixarPassos(f, o.exceto));

  const depois = r => !r.feita && !ehRetomada(r) && r.id !== o.exceto && !r.planoProva &&   // a data escolhida é da pessoa
                      (o.mesmoDia ? r.data >= data : r.data > data);
  db.revisoes.filter(depois).forEach(r => {
    const ctx = contextoRevisao(r); if (!ctx) return;
    const tocados = ctx.assuntos.filter(a => chaves.has(chaveAssunto(ctx.disciplina, a)));
    if (!tocados.length || tocados.length === ctx.assuntos.length) return;
    const resto = ctx.assuntos.filter(a => !tocados.includes(a));
    r.assuntos = resto;                                          // fica onde estava
    db.revisoes.push(Object.assign({}, r, { id: uid(), assuntos: tocados }));   // e esta anda
  });

  let movidos = 0;
  alvo.forEach(f => {
    let ant = data;
    itensDaFicha(f).filter(depois).forEach(r => {
      const passo = Number.isInteger(r.passo) ? r.passo : 1;
      const nova = foraDaProva(D.soma(ant, passo));
      if (nova > r.data){ r.data = nova; movidos++; }
      ant = r.data;
    });
  });
  return movidos;
}

/* MUDOU A DIFICULDADE: as pendentes automáticas são refeitas com os passos da
   dificuldade nova, contando do último contato; as marcadas à mão ficam onde
   estão. A escada também muda de tamanho — o que sobra sai, o que falta nasce.
   Atrasada não se mexe: ela ainda é a de hoje. */
function reespacarEscada(ficha){
  if (!ficha || ficha.fase !== "concluido" || !escadaAtiva(ficha)) return 0;
  const inicio = ficha.concluidoEm || "";
  const degraus = degrausDaFicha(ficha);
  const itens = itensDaFicha(ficha);
  const feitas = itens.filter(r => r.feita && (r.feitaEm || r.data) >= inicio)
    .sort((a,b) => (a.feitaEm || a.data).localeCompare(b.feitaEm || b.data));
  const ultimaFeita = feitas[feitas.length - 1];
  let ant = ultimaFeita ? (ultimaFeita.feitaEm || ultimaFeita.data) : (inicio || D.hoje());
  let k = ultimaFeita ? degrauDoItem(ultimaFeita, ficha, degraus) : 0;
  const hoje = D.hoje(), sobra = new Set();
  let mudou = 0;
  itens.filter(r => !r.feita).forEach(r => {
    if (r.manual || r.data < hoje){
      ant = r.data; k = Number.isInteger(r.degrau) ? r.degrau : degrauDoItem(r, ficha, degraus);
      return;
    }
    k = Number.isInteger(r.degrau) ? r.degrau : k + 1;
    if (k >= degraus.length){ sobra.add(r.id); return; }
    let nova = foraDaProva(D.soma(ant, degraus[k] - degraus[k - 1]));
    if (nova < hoje) nova = hoje;
    const desde = inicioDasAutomaticas(ficha);
    if (desde && nova < desde) nova = desde;                    // religada a partir de um dia
    const pausa = pausaAteProva(ficha);
    if (pausa && nova <= pausa) nova = D.soma(pausa, 1);        // pausada até a prova
    if (nova !== r.data) mudou++;
    r.data = nova; r.degrau = k; r.passo = degraus[k] - degraus[k - 1];
    ant = nova;
  });
  if (sobra.size){ db.revisoes = db.revisoes.filter(r => !sobra.has(r.id)); mudou += sobra.size; }
  return mudou + continuarEscada(ficha);
}

/* Itens da escada que nasceram no mesmo dia, do mesmo degrau e da mesma
   sessão viram um só: fechar Scrum e XP juntos (estudados juntos) dá um card
   "Scrum · XP", não dois. Se depois só um deles for revisado, o empurrão
   separa de novo. Conteúdos que vieram de cards diferentes ("Estudar junto")
   não se juntam: a junção valeu só para aquela sessão (grupoNaSessao). */
function juntarIrmas(){
  const vistos = new Map();
  db.revisoes = db.revisoes.filter(r => {
    if (r.feita || r.manual || ehRetomada(r) || !r.registroId ||
        !Array.isArray(r.assuntos) || !Number.isInteger(r.degrau)) return true;
    const dono = acharRegistro(r.registroId);
    const k = r.registroId + "|" + r.data + "|" + r.degrau + "|" + (dono ? grupoDoCard(dono, r.assuntos[0] || "") : 0);
    const irma = vistos.get(k);
    if (!irma){ vistos.set(k, r); return true; }
    r.assuntos.forEach(a => { if (!irma.assuntos.includes(a)) irma.assuntos.push(a); });
    const ordem = assuntosDe(acharRegistro(r.registroId) || {});
    irma.assuntos.sort((x, y) => ordem.indexOf(x) - ordem.indexOf(y));
    return false;
  });
}

/* GARANTIA DE REVISÃO. Conteúdo concluído não fica sem escada: se tem revisões
   pendentes, as próximas nascem depois delas; se não tem nenhuma, a escada
   nasce do último contato. É o par de garantirRetomadas, que cuida dos
   conteúdos abertos. */
function garantirEscadas(){
  if (!autoRevisoes()) return 0;
  let n = 0;
  conteudosCad().forEach(c => {
    // passada a prova, o modo "eu escolho" acaba sozinho: volta o automático
    if (typeof c.revisoesProva === "string" && c.revisoesProva < D.hoje()) delete c.revisoesProva;
    n += continuarEscada(c);
  });
  if (n) juntarIrmas();
  return n;
}
/** nenhum conteúdo fica fora do radar: aberto tem volta, fechado tem escada */
function garantirAgenda(){ return garantirRetomadas() + garantirEscadas(); }
/** houve contato com estes conteúdos neste dia: a escada deles anda */
function contatoComConteudos(fichas, data, opcoes){
  const n = reancorarEscada(fichas, data, opcoes);
  (fichas || []).forEach(continuarEscada);
  juntarIrmas();
  return n;
}


function reabrirRevisao(rev){
  esquecerRevisaoNaSessao(sessaoDaRevisao(rev), rev.id);   // a sessão e as horas dela continuam
  delete rev.sessaoId;
  rev.feita = false; rev.feitaEm = null; rev.minutos = null; rev.questoes = null; rev.acertos = null; rev.dificuldade = null;
  persistir();
}

/* Consultas usadas pelos painéis */
/** De onde a revisão tira disciplina/assuntos: da sessão de estudo ou dela mesma (avulsa). */
function contextoRevisao(rev){
  const reg = rev.registroId ? acharRegistro(rev.registroId) : null;
  if (reg){
    /* A volta pode cobrir só PARTE dos conteúdos da sessão: quando ela nasce,
       leva apenas os que ainda não tinham quem os chamasse de volta (ver
       conteudosSemVolta). Por isso a lista da revisão, quando existe, manda
       sobre a da sessão. Sem `assuntos` — o caso da escada e de todo dado
       antigo — vale a sessão inteira, como sempre. */
    const lista = (rev.assuntos && rev.assuntos.length) ? rev.assuntos : assuntosDe(reg);
    return { reg, disciplina: reg.disciplina, assuntos: lista,
             rotulo: lista.join(" · ") || "(sem assunto)", sub: reg.disciplina };
  }
  if (rev.disciplina){
    // avulsa: ela mesma diz do que fala. Histórico do modelo antigo, que era por
    // disciplina e podia não ter conteúdo nenhum, cai no nome da disciplina.
    const lista = rev.assuntos || [];
    return { reg: null, disciplina: rev.disciplina, assuntos: lista,
             rotulo: lista.join(" · ") || rev.disciplina,
             sub: rev.disciplina };
  }
  return null;                                   // revisão órfã (sessão excluída)
}
/** Estatística do contexto = a do assunto mais frágil. */
function estatContexto(ctx){
  const lista = (ctx.assuntos || []).map(a => estatAssunto(ctx.disciplina, a));
  if (!lista.length) return { taxa: null, errosBobos: 0, questoes: 0, acertos: 0 };
  return {
    taxa: lista.reduce((m,e) => e.taxa === null ? m : (m === null ? e.taxa : Math.min(m, e.taxa)), null),
    errosBobos: Math.max.apply(null, lista.map(e => e.errosBobos)),
    questoes: lista.reduce((t,e) => t + e.questoes, 0),
    acertos: lista.reduce((t,e) => t + e.acertos, 0)
  };
}
const atividadeDe = rev => (rev && rev.atividade)
  ? (CONFIG.ATIVIDADES_REVISAO.find(a => a.id === rev.atividade) || null) : null;
/** atividade em destaque — só aparece com o que você inseriu (atividade e/ou detalhe) */
function descricaoAtividade(rev){
  const at = atividadeDe(rev);
  if (!at && !rev.nota) return "";
  return '<div class="ativ">' +
    (at ? '<span class="nome">'+esc(at.nome)+'</span>' : '') +
    (rev.nota ? '<span class="det">'+esc(rev.nota)+'</span>' : '') + '</div>';
}
/** A que card a revisão pertence — a MESMA regra usada na aba Agenda e na numeração,
    senão o card junta duas sessões e cada uma continua contando do 1. */
function chaveCard(rev){
  const ctx = contextoRevisao(rev);
  if (!ctx) return "";
  return chaveConteudos(ctx.disciplina, ctx.assuntos);
}
/** Como a revisão se chama: o nome que você deu, ou o automático "Revisão N".
    O número vem da POSIÇÃO por data entre as irmãs do card — inclusive as que
    ganharam nome próprio. Por isso batizar a revisão 2 não faz a 3 virar 2. */
function nomeRevisao(rev){
  const proprio = (rev.rotulo || "").trim();
  if (proprio) return proprio;
  if (ehRetomada(rev)) return "Continuar";    // conteúdo aberto: continuar, não revisar
  const n = ordemVisivel(rev);
  return n ? "Revisão " + n : "Revisão";
}
/** Número mostrado: a ordem é sempre por data, então a revisão mais próxima é a nº 1. */
function ordemVisivel(rev){
  if (ehRetomada(rev)) return 0;              // volta não ocupa número de revisão
  const k = chaveCard(rev);
  const irmas = db.revisoes.filter(r => chaveCard(r) === k && !ehRetomada(r))
    .sort((a,b) => a.data.localeCompare(b.data) || String(a.id).localeCompare(String(b.id)));
  const i = irmas.findIndex(r => r.id === rev.id);
  return i >= 0 ? i + 1 : (rev.ordem || 1);
}
const statusRevisao = rev => {
  const h = D.hoje();
  if (rev.feita) return "feita";
  if (rev.data < h) return "atrasada";
  if (rev.data === h) return "hoje";
  return "futura";
};
/* A agenda que a tela mostra. O item em silêncio (a prova do conteúdo já
   passou, e o último dia ainda não) fica guardado mas fora de TODAS as telas e
   contagens — é por aqui que a agenda, o card de hoje, o calendário e os
   pinos das abas passam. */
/* SÓ AS PRÓXIMAS. De cada card (conteúdo), as REVISOES_VISIVEIS primeiras
   revisões pendentes e as RETOMADAS_VISIVEIS primeiras retomadas, em ordem de
   data — o atraso entra na conta, porque ele é o próximo a fazer. O que já foi
   feito não é cortado. A lista precisa vir em ordem de data. */
function soAsProximas(lista){
  const vistos = new Map();
  return lista.filter(x => {
    if (x.rev.feita) return true;
    if (bloqueadaPelaProva(x.rev)) return false;          // até a prova, só as personalizadas
    const volta = ehRetomada(x.rev);
    const k = chaveCard(x.rev) + (volta ? "|volta" : "|revisao");
    const n = vistos.get(k) || 0;
    if (n >= (volta ? CONFIG.RETOMADAS_VISIVEIS : CONFIG.REVISOES_VISIVEIS)) return false;
    vistos.set(k, n + 1);
    return true;
  });
}
/* BLOQUEADA ATÉ A PROVA (pedido do Pedro, 26/09). Com as revisões até a prova
   personalizadas, só elas valem até lá: as outras pendentes do conteúdo (a escada
   automática, que recomeça depois da prova, e as marcadas à mão) aparecem em
   "Todas as agendadas" apagadas e sem ação, e somem de "Só as 2 próximas".
   Devolve a data até a qual o item está bloqueado, ou "". */
function bloqueadaPelaProva(rev){
  if (!rev || rev.feita || rev.planoProva || ehRetomada(rev)) return "";
  const ctx = contextoRevisao(rev); if (!ctx) return "";
  let ate = "";
  (ctx.assuntos || []).forEach(a => { const p = pausaAteProva(acharConteudo(ctx.disciplina, a)); if (p > ate) ate = p; });
  return ate;
}
/** a agenda como ela aparece: só as próximas, a não ser que se peça todas */
const agendaVisivel = lista => ui.agendaCompleta ? lista : soAsProximas(lista);
function revisoesDetalhadas(){
  return db.revisoes.filter(rev => !itemEmSilencio(rev)).map(rev => {
    const ctx = contextoRevisao(rev);
    return ctx ? { rev, ctx, reg: ctx.reg, status: statusRevisao(rev) } : null;
  }).filter(Boolean).sort((a,b) => a.rev.data.localeCompare(b.rev.data));
}
/* AS TAREFAS NA MESMA FILA DA AGENDA. Cada uma vira um item com a cara dos da
   agenda ({ rev, ctx, status }), para as listas por dia, o mês e os atrasados
   agruparem tudo junto; o `tarefa` diz quem ela é, e quem desenha (itemRevisao,
   cardAtrasadas) desvia para o jeito dela. Sem disciplina nem conteúdo: o filtro
   de disciplina/conteúdo da Agenda as esconde. */
function tarefasDetalhadas(){
  return getTarefas().map(t => ({
    tarefa: t,
    rev: { id: t.id, data: t.data, feita: t.feita, feitaEm: t.feitaEm },
    ctx: { disciplina: "", assuntos: [], rotulo: t.titulo, sub: "" },
    status: statusRevisao(t)
  }));
}
/** dentro do mesmo dia: tarefas com hora (na ordem da hora), tarefas sem hora, depois o resto */
const ordemNoDia = x => x.tarefa ? (x.tarefa.hora ? "0" + x.tarefa.hora : "1") : "2";
/** a agenda e as tarefas numa lista só, em ordem de data */
const juntarTarefas = (det, tar) => det.concat(tar).sort((a,b) =>
  a.rev.data.localeCompare(b.rev.data) || ordemNoDia(a).localeCompare(ordemNoDia(b)));
function disciplinas(){
  const set = new Set(db.disciplinas || []);
  db.registros.forEach(r => r.disciplina && set.add(r.disciplina));
  db.erros.forEach(e => e.disciplina && set.add(e.disciplina));
  db.revisoes.forEach(r => r.disciplina && set.add(r.disciplina));
  return [...set].sort((a,b) => a.localeCompare(b, "pt-BR"));
}
/* CADASTRO DE CONTEÚDOS. Conteúdo deixou de ser texto livre digitado em cada
   sessão e passou a ser uma ficha escolhida numa lista: é ela que carrega a
   FASE (em andamento × concluído), e por isso fechar um conteúdo fecha todas
   as sessões que falam dele. O que distingue uma sessão da outra passa a ser
   a descrição.                                                              */
const conteudosCad = () => Array.isArray(db.conteudos) ? db.conteudos : (db.conteudos = []);
function conteudosDaDisciplina(disc){
  return conteudosCad().filter(c => c.disciplina === disc)
    .sort((a,b) => a.nome.localeCompare(b.nome, "pt-BR"));
}
/* CONTEÚDOS JUNTADOS (pedido do Pedro, 04/10). Juntar A e B na aba
   Disciplinas cria UMA ficha nova ("A + B", ou o nome que você der), que guarda
   as fichas de A e B em `juntados`, como estavam (para separar depois), e a
   hora da junção em `juntadoEm`. A e B saem do cadastro, mas o nome deles
   continua apontando para a ficha nova: as sessões antigas de A e de B seguem
   escritas "A" e "B" — o feito não muda —, e para a agenda elas contam como
   contato com o conteúdo juntado. Junção de junção guarda a de dentro inteira:
   separar volta um passo de cada vez. */
const nomesDaFicha = f => [f.nome].concat((f.juntados || []).flatMap(nomesDaFicha));
function acharConteudo(disc, nome){
  const n = (nome || "").trim().toLowerCase();
  const daDisc = conteudosCad().filter(c => c.disciplina === disc);
  return daDisc.find(c => c.nome.toLowerCase() === n) ||
         daDisc.find(c => c.juntados && nomesDaFicha(c).some(x => x.toLowerCase() === n)) || null;
}
/** a ficha que tem EXATAMENTE este nome (sem passar pela junção) */
function fichaDoNome(disc, nome){
  const f = acharConteudo(disc, nome);
  return f && f.nome.toLowerCase() === (nome || "").trim().toLowerCase() ? f : null;
}
/** cria a ficha do conteúdo se ela ainda não existe; devolve a ficha */
function registrarConteudo(disc, nome){
  const n = (nome || "").trim();
  if (!disc || !n) return null;
  const ja = acharConteudo(disc, n);
  if (ja) return ja;
  const novo = { id: uid(), nome: n, disciplina: disc, fase: "andamento", concluidoEm: null, criadoEm: Date.now() };
  conteudosCad().push(novo);
  return novo;
}
/** a fase de um conteúdo: só a ficha responde */
const faseConteudo = (disc, nome) => {
  const c = acharConteudo(disc, nome);
  return c && c.fase === "concluido" ? "concluido" : "andamento";
};
/** grava a disciplina no cadastro (usado ao criar uma nova pelo seletor) */
function registrarDisciplina(nome){
  const n = (nome || "").trim();
  if (!n) return "";
  if (!Array.isArray(db.disciplinas)) db.disciplinas = [];
  if (!db.disciplinas.some(d => d.toLowerCase() === n.toLowerCase())) db.disciplinas.push(n);
  return n;
}
/* RENOMEAR UMA DISCIPLINA. O nome dela está escrito em seis lugares — a lista
   própria, as sessões, as revisões avulsas, as anotações, as fichas de
   conteúdo e a ligação ao dia de prova do vestibular. Renomear em um só deixaria o resto órfão: a sessão continuaria
   falando de "Legislação" enquanto a ficha já se chamasse outra coisa, e o
   cadastro se partiria em duas disciplinas com os mesmos conteúdos. */
function renomearDisciplina(antigo, novo){
  const bate = d => (d || "").toLowerCase() === (antigo || "").toLowerCase();
  if (!Array.isArray(db.disciplinas)) db.disciplinas = [];
  db.disciplinas = db.disciplinas.map(d => bate(d) ? novo : d);
  if (!db.disciplinas.some(d => d === novo)) db.disciplinas.push(novo);
  db.registros.forEach(r => { if (bate(r.disciplina)) r.disciplina = novo; });
  db.revisoes.forEach(r  => { if (bate(r.disciplina)) r.disciplina = novo; });
  db.erros.forEach(e     => { if (bate(e.disciplina)) e.disciplina = novo; });
  conteudosCad().forEach(c => { if (bate(c.disciplina)) c.disciplina = novo; });
  // e a ligação ao dia de prova, que é guardada pelo nome
  const lig = vestibular().disciplinas;
  Object.keys(lig).forEach(k => { if (bate(k) && k !== novo){ lig[novo] = lig[k]; delete lig[k]; } });
  // os filtros de tela apontam para o nome: acompanham, senão a lista fica vazia
  ["fDisciplina","eDisciplina","pDisciplina","cDisciplina","aDisciplina"].forEach(k => {
    if (bate(ui[k])) ui[k] = novo;
  });
  // o conteúdo escolhido nos filtros é guardado pela chave (disciplina|nome): a disciplina da chave acompanha
  ["fAssunto","aAssunto","cAssunto","pAssunto","qAssunto"].forEach(k => {
    if (ui[k] && ui[k].split("|")[0] === (antigo || "").trim().toLowerCase())
      ui[k] = chaveAssunto(novo, ui[k].split("|").slice(1).join("|"));
  });
  if (Array.isArray(ui.qDiscs)) ui.qDiscs = ui.qDiscs.map(d => bate(d) ? novo : d);
  if (ui.eAssunto && ui.eAssunto.split("|")[0] === (antigo || "").trim().toLowerCase())
    ui.eAssunto = chaveAssunto(novo, ui.eAssunto.split("|").slice(1).join("|"));
}
/* EXCLUIR UMA DISCIPLINA. Só a que nada usa: sem sessão, sem anotação e sem
   revisão marcada à mão. Com qualquer uma delas o nome continua escrito no
   dado, e a disciplina reapareceria sozinha (disciplinas() lê tudo) — aí o
   caminho é renomear. Os conteúdos dela, todos "a estudar", saem junto. */
function disciplinaExcluivel(disc){
  const bate = d => (d || "").toLowerCase() === (disc || "").toLowerCase();
  return !db.registros.some(r => bate(r.disciplina)) && !db.erros.some(e => bate(e.disciplina)) &&
         !db.revisoes.some(r => bate(r.disciplina));
}
function excluirDisciplina(disc){
  const bate = d => (d || "").toLowerCase() === (disc || "").toLowerCase();
  const fichas = conteudosCad().filter(c => bate(c.disciplina)).length;
  db.disciplinas = (db.disciplinas || []).filter(d => !bate(d));
  db.conteudos = conteudosCad().filter(c => !bate(c.disciplina));
  const lig = vestibular().disciplinas;
  Object.keys(lig).forEach(k => { if (bate(k)) delete lig[k]; });
  ["fDisciplina","eDisciplina","pDisciplina","cDisciplina","aDisciplina"].forEach(k => { if (bate(ui[k])) ui[k] = ""; });
  if (Array.isArray(ui.qDiscs)) ui.qDiscs = ui.qDiscs.filter(d => !bate(d));
  return fichas;
}
/** quanto um renome de disciplina alcança */
function alcanceDaDisciplina(disc){
  const bate = d => (d || "").toLowerCase() === (disc || "").toLowerCase();
  return {
    conteudos: conteudosCad().filter(c => bate(c.disciplina)).length,
    sessoes: db.registros.filter(r => bate(r.disciplina)).length,
    anotacoes: db.erros.filter(e => bate(e.disciplina)).length
  };
}

/** conteúdos (assuntos) de uma disciplina */
const conteudosDe = disc => assuntos().filter(a => !disc || a.disciplina === disc);
function assuntos(){
  const m = new Map();
  db.registros.forEach(r => assuntosDe(r).forEach(a =>
    m.set(chaveAssunto(r.disciplina, a), { disciplina: r.disciplina, assunto: a })));
  db.erros.forEach(e => { if (e.assunto)
    m.set(chaveAssunto(e.disciplina, e.assunto), { disciplina: e.disciplina, assunto: e.assunto }); });
  db.revisoes.forEach(r => { if (r.disciplina) (r.assuntos||[]).forEach(a =>
    m.set(chaveAssunto(r.disciplina, a), { disciplina: r.disciplina, assunto: a })); });
  return [...m.values()].sort((a,b) => (a.disciplina+a.assunto).localeCompare(b.disciplina+b.assunto));
}
/* Tempo estudado num dia. Um bloco cronometrado pode ter sido somado hoje a uma
   sessão de outro dia: ele conta no dia em que foi cronometrado, e por isso é
   descontado do "tempo próprio" da sessão.                                    */
const somaBlocos = (item, dia) =>
  (item.blocos || []).reduce((s,b) => s + ((!dia || b.data === dia) ? (b.minutos||0) : 0), 0);
/* Os blocos são PARTE do tempo da sessão, nunca mais que ele. Baixar o tempo
   para menos do que o cronômetro mediu corta os blocos, do mais recente para o
   mais antigo — senão o dia continuava somando o tempo antigo. Antes disso, o
   corte sai do tempo próprio (o digitado, que não é de bloco nenhum).        */
function ajustarBlocosAoTempo(item){
  if (!item.blocos || !item.blocos.length) return;
  // soma à mão: roda também na carga (prepararDados), antes de somaBlocos existir
  let sobra = item.blocos.reduce((t,b) => t + ((b && b.minutos) || 0), 0) - (item.minutos || 0);
  if (sobra <= 0) return;
  const blocos = item.blocos.map(b => Object.assign({}, b));
  for (let i = blocos.length - 1; i >= 0 && sobra > 0; i--){
    const corte = Math.min(sobra, blocos[i].minutos || 0);
    blocos[i].minutos = (blocos[i].minutos || 0) - corte;
    sobra -= corte;
  }
  item.blocos = blocos.filter(b => (b.minutos || 0) > 0);
}
function minutosNoDia(item, dia, dataBase){
  const doDia   = somaBlocos(item, dia);
  const proprio = (dataBase && dataBase === dia) ? Math.max(0, (item.minutos||0) - somaBlocos(item)) : 0;
  return proprio + doDia;
}
const minutosDoDia = (dia, regs, revs) =>
  (regs || db.registros).reduce((s,r) => s + minutosNoDia(r, dia, r.data), 0) +
  (revs || db.revisoes).reduce((s,r) => s + minutosNoDia(r, dia, r.feita ? (r.feitaEm || r.data) : null), 0);
function sequenciaDias(regs, revs){   // streak de dias consecutivos com estudo (sessões, revisões ou cronômetro)
  const dias = new Set((regs || db.registros).filter(r => (r.minutos||0) > 0 || (r.questoes||0) > 0).map(r => r.data));
  (regs || db.registros).forEach(r => (r.blocos || []).forEach(b => dias.add(b.data)));
  // bateria de questões feita num dia é estudo naquele dia (das sessões em questão)
  const ids = new Set((regs || db.registros).map(r => r.id));
  (db.lancamentos || []).forEach(l => { if (ids.has(l.registroId) && (l.questoes || 0) > 0) dias.add(l.data); });
  (revs || db.revisoes).forEach(r => {
    if (r.feita && ((r.minutos||0) > 0 || (r.questoes||0) > 0)) dias.add(r.feitaEm || r.data);
    (r.blocos || []).forEach(b => dias.add(b.data));
  });
  let d = D.hoje(), n = 0;
  if (!dias.has(d)) d = D.soma(d, -1);
  while (dias.has(d)){ n++; d = D.soma(d, -1); }
  return n;
}

let tToast = null;
/** acao (opcional): { rotulo, fazer } — um botão de atalho dentro do aviso */
function toast(msg, acao){
  const t = $("#toast"); t.textContent = msg; t.classList.toggle("com-acao", !!acao);
  if (acao){
    const b = document.createElement("button");
    b.type = "button"; b.className = "act atalho toast-acao"; b.textContent = acao.rotulo;
    b.addEventListener("click", () => { clearTimeout(tToast); t.classList.remove("show"); acao.fazer(); });
    const texto = document.createElement("span"); texto.textContent = msg;
    t.replaceChildren(texto, b);
  }
  t.classList.add("show");
  // aviso longo fica mais tempo: 2,6 s mal dava para ler duas linhas no celular; com botão, tempo de tocar nele
  const ms = acao ? 7000 : Math.min(7000, Math.max(2600, String(msg).length * 55));
  clearTimeout(tToast); tToast = setTimeout(() => t.classList.remove("show"), ms);
}

const CHAVE_TELA = "plataforma-estudos:tela";
/* CARDS MINIMIZADOS NA AGENDA POR ASSUNTO. Ficam no sessionStorage, não no
   localStorage: sobrevivem ao F5 (a mesma aba continua aberta), e somem ao

const CHAVE_MINIMIZADOS = "plataforma-estudos:minimizados";

        return new Set(Array.isArray(l) ? l : []); }

})();
function alternarMinimizado(chave){

  try { sessionStorage.setItem(CHAVE_MINIMIZADOS, JSON.stringify([...minimizados])); } catch(e){}
}
const CHAVE_ABA  = "plataforma-estudos:aba";      // formato antigo: só a aba
const CAMPOS_TELA = ["aba",
  "fDisciplina","fAssunto","fPeriodo","fOrdem","fBusca","fTipo",   // filtros de Registros
  "eDisciplina","eAssunto","eSoImportantes","eJuntarTudo",      // filtros das Anotações
  "qVisao","qOrdemTaxa","qPeriodo","qDiscs","qAssunto","pDisciplina","pAssunto","diaSel","mesCal",   // Questões e Painel
  "verTodasProximas","verTodosAssuntos","verTodoMural",         // listas abertas/fechadas
  "visaoAgenda","mesAgenda","diaAgenda","verTodaAgenda","faseAgenda","aDisciplina","aAssunto","agendaCompleta",   // como a Agenda está sendo vista
  "cDisciplina","cAssunto",                                     // filtro da aba Disciplinas
  "cronoDestino",                                               // a sessão escolhida no cronômetro (vale só no dia)
  "compondo","rascunhoAnot"];                                   // e o que está sendo escrito
function abaSalva(){
  try { const a = localStorage.getItem(CHAVE_ABA); return ABAS.some(x => x.id === a) ? a : ""; }
  catch(e){ return ""; }
}
function restaurarTela(){
  let salvo = {};
  try { salvo = JSON.parse(localStorage.getItem(CHAVE_TELA) || "{}") || {}; } catch(e){ salvo = {}; }
  CAMPOS_TELA.forEach(k => { if (salvo[k] !== undefined && salvo[k] !== null) ui[k] = salvo[k]; });
  if (salvo.aba === undefined) ui.aba = abaSalva() || ui.aba;    // guardado no formato antigo
  if (!ABAS.some(x => x.id === ui.aba)) ui.aba = "hoje";
  // um filtro que aponta para algo que não existe mais deixaria a lista vazia sem explicação
  const discs = disciplinas();
  if (ui.fDisciplina && discs.indexOf(ui.fDisciplina) < 0) ui.fDisciplina = "";
  if (ui.pDisciplina && discs.indexOf(ui.pDisciplina) < 0) ui.pDisciplina = "";
  /* O filtro de Questões guarda uma LISTA. Disciplina apagada (ou renomeada por
     fora) sai dela — senão a aba abriria filtrada por algo que não existe e
     pareceria vazia sem explicação. Estado antigo guardava um nome só. */
  if (typeof ui.qDiscs === "string") ui.qDiscs = ui.qDiscs ? [ui.qDiscs] : [];
  if (!Array.isArray(ui.qDiscs)) ui.qDiscs = [];
  ui.qDiscs = ui.qDiscs.filter(d => discs.indexOf(d) >= 0);
  if (ui.cDisciplina && discs.indexOf(ui.cDisciplina) < 0) ui.cDisciplina = "";
  if (ui.eDisciplina && discs.indexOf(ui.eDisciplina) < 0){ ui.eDisciplina = ""; ui.eAssunto = ""; }
  if (ui.eAssunto && !conteudosDisponiveis().some(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto)){
    ui.eAssunto = "";
  }
  if (!ui.rascunhoAnot) ui.compondo = !!ui.compondo && ui.aba === "erros";
  /* O dia do Painel é o único estado que envelhece: guardado ontem, "hoje" virou
     ontem. Por isso o retrato guarda também o dia em que foi tirado — se o dia
     escolhido ERA o de então, ele acompanha o relógio; um dia escolhido de
     propósito (outro qualquer) continua onde estava. */
  /* Desde 27/09 (revisão de UX, pedido do Pedro) o Progresso abre no PANORAMA: o
     "hoje" guardado num dia que já passou volta ao panorama em vez de seguir o relógio. */
  const ontem = salvo.gravadoEm || "";
  if (ontem && ontem !== D.hoje() && ui.diaSel === ontem) ui.diaSel = null;
  /* A SESSÃO ESCOLHIDA NO CRONÔMETRO continua escolhida — ao fechar e abrir, depois de
     encerrar — e só recomeça do zero em OUTRO DIA (pedido do Pedro, 25/09): o
     cronômetro só soma em sessão de hoje, então a escolha de ontem não vale mais. */
  if (ontem !== D.hoje()) ui.cronoDestino = "";
  if (ontem && ui.mesCal && ui.mesCal === ontem.slice(0,7)) ui.mesCal = D.hoje().slice(0,7);
}
