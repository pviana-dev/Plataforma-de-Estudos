/* ---------- backup ---------- */
/* ==========================================================================
   NUVEM (Supabase) — opcional, é o que permite usar em qualquer aparelho
   --------------------------------------------------------------------------
   Preencha as duas linhas abaixo com os dados do seu projeto no Supabase
   (Project Settings → API). Enquanto estiverem vazias, a plataforma funciona
   exatamente como antes, só no navegador (e no .json, se você ligar um).

   No Supabase, uma vez só:
   1. SQL Editor → rode:
        create table dados (
          id uuid primary key references auth.users on delete cascade,
          conteudo jsonb not null,
          atualizado_em timestamptz not null default now()
        );
        alter table dados enable row level security;
        create policy "cada um vê o seu" on dados
          for all using (auth.uid() = id) with check (auth.uid() = id);
   2. Authentication → Email Templates → "Magic Link": inclua {{ .Token }} no
      corpo. É esse código de 6 dígitos que a plataforma pede (sem link, sem
      redirecionamento — funciona até com o arquivo aberto localmente).
   ========================================================================== */
const NUVEM = {
  url:   "",          // ex.: "https://abcdefgh.supabase.co"
  chave: ""           // a chave "anon public" (pode ficar no código: é pública)
};
const CHAVE_SESSAO = "plataforma-estudos:sessao";
const nuvem = { estado: "desligada", email: "", uid: "", ultimo: null, erro: "", pendente: false };
//              desligada | deslogado | entrando | pronta | sincronizando | offline | erro

const nuvemLigada = () => !!(NUVEM.url && NUVEM.chave);
function lerSessao(){
  try { return JSON.parse(localStorage.getItem(CHAVE_SESSAO) || "null"); } catch(e){ return null; }
}
function gravarSessao(s){
  try { s ? localStorage.setItem(CHAVE_SESSAO, JSON.stringify(s)) : localStorage.removeItem(CHAVE_SESSAO); } catch(e){}
}
/** chamada crua à API do Supabase — sem SDK, para o arquivo seguir sem dependências */
async function chamarNuvem(caminho, opcoes, comToken){
  const s = lerSessao();
  const cab = Object.assign({ "apikey": NUVEM.chave, "Content-Type": "application/json" },
                            (opcoes && opcoes.headers) || {});
  if (comToken && s) cab["Authorization"] = "Bearer " + s.access_token;
  const r = await fetch(NUVEM.url + caminho, Object.assign({}, opcoes, { headers: cab }));
  if (r.status === 401 && comToken && s && s.refresh_token){
    if (await renovarSessao()) return chamarNuvem(caminho, opcoes, comToken);   // uma segunda chance
  }
  if (!r.ok){
    let msg = r.status + " " + r.statusText;
    try { const e = await r.json(); msg = e.msg || e.message || e.error_description || msg; } catch(x){}
    throw new Error(msg);
  }
  return r.status === 204 ? null : r.json();
}
async function renovarSessao(){
  const s = lerSessao(); if (!s || !s.refresh_token) return false;
  try {
    const d = await chamarNuvem("/auth/v1/token?grant_type=refresh_token",
      { method: "POST", body: JSON.stringify({ refresh_token: s.refresh_token }) }, false);
    gravarSessao({ access_token: d.access_token, refresh_token: d.refresh_token,
                   email: (d.user && d.user.email) || s.email, uid: (d.user && d.user.id) || s.uid });
    return true;
  } catch(e){ gravarSessao(null); return false; }
}
/** manda o código de 6 dígitos para o e-mail */
async function enviarCodigo(email){
  await chamarNuvem("/auth/v1/otp", { method: "POST", body: JSON.stringify({ email, create_user: true }) }, false);
}
/** confere o código e abre a sessão */
async function confirmarCodigo(email, codigo){
  const d = await chamarNuvem("/auth/v1/verify",
    { method: "POST", body: JSON.stringify({ email, token: codigo, type: "email" }) }, false);
  gravarSessao({ access_token: d.access_token, refresh_token: d.refresh_token,
                 email: d.user.email, uid: d.user.id });
  nuvem.email = d.user.email; nuvem.uid = d.user.id;
}
async function baixarDaNuvem(){
  const s = lerSessao(); if (!s) return null;
  const linhas = await chamarNuvem("/rest/v1/dados?select=conteudo,atualizado_em&id=eq." + s.uid, { method: "GET" }, true);
  return (linhas && linhas[0]) || null;
}
let tNuvem = null;
async function subirParaNuvem(){
  const s = lerSessao();
  if (!nuvemLigada() || !s) return;
  nuvem.estado = "sincronizando"; pintarChipNuvem();
  try {
    await chamarNuvem("/rest/v1/dados", {
      method: "POST",
      headers: { "Prefer": "resolution=merge-duplicates,return=minimal" },
      body: JSON.stringify([{ id: s.uid, conteudo: db, atualizado_em: new Date().toISOString() }])
    }, true);
    nuvem.estado = "pronta"; nuvem.ultimo = Date.now(); nuvem.erro = ""; nuvem.pendente = false;
  } catch(e){
    nuvem.estado = "offline"; nuvem.erro = e.message || String(e); nuvem.pendente = true;
  }
  pintarChipNuvem();
}
function agendarSincronia(agora){
  if (!nuvemLigada() || !lerSessao()) return;
  clearTimeout(tNuvem);
  if (agora) subirParaNuvem(); else tNuvem = setTimeout(subirParaNuvem, 900);
}
/** no arranque: recupera a sessão e decide quem está mais novo, nuvem ou navegador */
async function iniciarNuvem(){
  if (!nuvemLigada()){ nuvem.estado = "desligada"; pintarChipNuvem(); return; }
  const s = lerSessao();
  if (!s){ nuvem.estado = "deslogado"; pintarChipNuvem(); return; }
  nuvem.email = s.email; nuvem.uid = s.uid;
  try {
    const linha = await baixarDaNuvem();
    if (linha && pareceBackup(linha.conteudo)){
      const daNuvem = new Date(linha.atualizado_em).getTime();
      const daqui   = Number(db.atualizadoEm || 0);
      if (daNuvem > daqui + 2000){                 // a nuvem tem algo mais recente
        aplicarDados(linha.conteudo);
        persistir(true); render();
        toast("Dados carregados da nuvem.");
      } else if (daqui > daNuvem){
        await subirParaNuvem();
      }
    } else {
      await subirParaNuvem();                      // primeira vez: sobe o que existe aqui
    }
    nuvem.estado = "pronta"; nuvem.ultimo = Date.now();
  } catch(e){ nuvem.estado = "offline"; nuvem.erro = e.message || String(e); }
  pintarChipNuvem();
}
function sairDaNuvem(){
  if (!confirm("Sair da conta? Os dados continuam neste navegador e na nuvem.")) return;
  gravarSessao(null);
  nuvem.estado = "deslogado"; nuvem.email = ""; nuvem.uid = "";
  fecharModal(); render(); toast("Você saiu da conta.");
}

/* ==========================================================================
   ARQUIVO LOCAL (.json fora do navegador)
   --------------------------------------------------------------------------
   localStorage some quando se limpa os dados do navegador. Com a File System
   Access API (Chrome/Edge) a plataforma escreve num .json de verdade no disco:
   toda alteração é gravada lá, e limpar o navegador não apaga o arquivo.
   O navegador NÃO deixa uma página abrir um caminho fixo sozinha — é preciso
   escolher o arquivo uma vez (e reautorizar a cada sessão, com um clique).
   Firefox e Safari não têm a API: lá continua valendo o backup manual (↓ / ↑).
   ========================================================================== */
const suportaArquivo = () => typeof window.showSaveFilePicker === "function";
const arq = { handle: null, estado: "desligado", nome: "", ultimo: null, erro: "" };
//            estado: desligado | pronto | permissao | erro | indisponivel

/* o handle do arquivo não cabe no localStorage (não é JSON); vai no IndexedDB */
function bancoHandles(){
  return new Promise((ok, falha) => {
    const req = indexedDB.open("plataforma-estudos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("arq");
    req.onsuccess = () => ok(req.result);
    req.onerror   = () => falha(req.error);
  });
}
function guardarHandle(h){
  return bancoHandles().then(bd => new Promise((ok, falha) => {
    const t = bd.transaction("arq", "readwrite");
    t.objectStore("arq").put(h, "handle");
    t.oncomplete = () => ok(); t.onerror = () => falha(t.error);
  })).catch(() => {});
}
function lerHandleGuardado(){
  return bancoHandles().then(bd => new Promise((ok) => {
    const r = bd.transaction("arq", "readonly").objectStore("arq").get("handle");
    r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
  })).catch(() => null);
}

let tArquivo = null;
/** grava o estado inteiro no arquivo; chamada a cada alteração (com folga) */
async function gravarArquivo(){
  if (arq.estado !== "pronto" || !arq.handle) return;
  try {
    const fluxo = await arq.handle.createWritable();
    await fluxo.write(JSON.stringify(db, null, 2));
    await fluxo.close();
    arq.ultimo = Date.now(); arq.erro = "";
    pintarChipArquivo();
  } catch(e){
    arq.estado = "erro"; arq.erro = e.message || String(e);
    pintarChipArquivo();
  }
}
function agendarGravacao(agora){
  if (arq.estado !== "pronto") return;
  clearTimeout(tArquivo);
  if (agora) gravarArquivo(); else tArquivo = setTimeout(gravarArquivo, 500);
}
async function lerDoArquivo(){
  const f = await arq.handle.getFile();
  const txt = await f.text();
  if (!txt.trim()) return null;                 // arquivo novo, ainda vazio
  return JSON.parse(txt);
}
/** confere a permissão do handle guardado e, se puder, carrega o arquivo */
async function iniciarArquivo(){
  if (!suportaArquivo()){ arq.estado = "indisponivel"; pintarChipArquivo(); return; }
  const h = await lerHandleGuardado();
  if (!h){ arq.estado = "desligado"; pintarChipArquivo(); return; }
  arq.handle = h; arq.nome = h.name || "estudos.json";
  try {
    const p = await h.queryPermission({ mode: "readwrite" });
    if (p !== "granted"){ arq.estado = "permissao"; pintarChipArquivo(); return; }
    arq.estado = "pronto";
    const d = await lerDoArquivo();
    if (pareceBackup(d)){ aplicarDados(d); persistir(true); render(); }
    pintarChipArquivo();
  } catch(e){ arq.estado = "erro"; arq.erro = e.message || String(e); pintarChipArquivo(); }
}
/** pede a permissão de volta (precisa vir de um clique) */
async function reconectarArquivo(){
  if (!arq.handle) return escolherArquivo(false);
  try {
    const p = await arq.handle.requestPermission({ mode: "readwrite" });
    if (p !== "granted"){ toast("Permissão negada — o arquivo não será atualizado."); return; }
    arq.estado = "pronto";
    const d = await lerDoArquivo();
    if (pareceBackup(d) && confirm("Carregar os dados do arquivo “" + arq.nome + "”? Isso substitui o que está aberto agora."))
      aplicarDados(d);
    persistir(true); await gravarArquivo(); render();
    toast("Arquivo reconectado.");
  } catch(e){ arq.estado = "erro"; arq.erro = e.message || String(e); render(); }
}
/** escolhe (ou cria) o arquivo que passa a guardar os dados */
async function escolherArquivo(criar){
  if (!suportaArquivo()){
    alert("Este navegador não permite que a página escreva num arquivo. Use o Chrome ou o Edge, " +
          "ou continue com o backup manual (botões ↓ e ↑)."); return;
  }
  const tipos = [{ description: "JSON", accept: { "application/json": [".json"] } }];
  try {
    const h = criar ? await window.showSaveFilePicker({ suggestedName: "estudos.json", types: tipos })
                    : (await window.showOpenFilePicker({ types: tipos, multiple: false }))[0];
    const p = await h.requestPermission({ mode: "readwrite" });
    if (p !== "granted"){ toast("Permissão negada."); return; }
    arq.handle = h; arq.nome = h.name; arq.estado = "pronto"; arq.erro = "";
    await guardarHandle(h);
    let d = null;
    try { d = await lerDoArquivo(); } catch(e){ d = null; }
    if (pareceBackup(d)){
      const daqui = db.registros.length, dele = d.registros.length;
      const usarArquivo = confirm(
        "O arquivo “" + h.name + "” já tem " + dele + " sessão(ões).\n\n" +
        "OK = usar os dados do arquivo (substitui as " + daqui + " sessão(ões) abertas agora).\n" +
        "Cancelar = manter o que está aberto e gravar por cima do arquivo.");
      if (usarArquivo) aplicarDados(d);
    }
    persistir(true);
    await gravarArquivo();
    render();
    toast("Agora os dados são gravados em “" + h.name + "”.");
  } catch(e){
    if (e && e.name === "AbortError") return;            // o usuário fechou o seletor
    arq.estado = "erro"; arq.erro = e.message || String(e); render();
    alert("Não foi possível usar o arquivo: " + arq.erro);
  }
}
function desconectarArquivo(){
  if (!confirm("Parar de gravar no arquivo? Os dados continuam no navegador e o arquivo fica como está.")) return;
  arq.handle = null; arq.estado = "desligado"; arq.nome = ""; arq.ultimo = null;
  guardarHandle(null);
  fecharModal(); render(); toast("Arquivo desconectado.");
}

/** chip da conta: em uma linha, se os dados estão indo para a nuvem */
function pintarChipNuvem(){
  const c = document.getElementById("chipNuvem"); if (!c) return;
  const curto = e => (e || "").split("@")[0];
  const mapa = {
    desligada:     ["", "", "", true],
    deslogado:     ["Entrar na conta", "atencao", "Seus dados só estão neste navegador — entre para sincronizar", false],
    entrando:      ["Entrando…", "", "", false],
    sincronizando: ["Salvando…", "", "Enviando para a nuvem", false],
    pronta:        [curto(nuvem.email), "ligado", "Sincronizado" + (nuvem.ultimo ? " às " + horaDe(nuvem.ultimo) : "") + " · " + nuvem.email, false],
    offline:       ["Sem conexão", "atencao", "As alterações ficaram salvas aqui e sobem quando a conexão voltar. " + nuvem.erro, false],
    erro:          ["Falha na conta", "falha", nuvem.erro, false]
  };
  const [texto, classe, titulo, esconder] = mapa[nuvem.estado] || mapa.deslogado;
  c.hidden = esconder;
  c.className = "chip-arq" + (classe ? " " + classe : "");
  c.title = titulo;
  c.innerHTML = (nuvem.estado === "pronta" ? "☁ " : nuvem.estado === "offline" ? "⚠ " : "") + esc(texto);
}

function exportar(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "estudos-" + D.hoje() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Backup exportado.");
}
/** true se o objeto tem a cara de um backup desta plataforma */
const pareceBackup = d => !!d && typeof d === "object" &&
  Array.isArray(d.registros) && Array.isArray(d.revisoes) && Array.isArray(d.erros);
/** adota um JSON como estado atual (usado pela importação e pelo arquivo local) */
function aplicarDados(d){
  db = Object.assign(estadoInicial(), d);
  db.registros   = normalizarRegistros(db.registros);
  db.revisoes    = normalizarRevisoes(db.revisoes);
  db.grupos      = Array.isArray(db.grupos) ? db.grupos : [];
  db.lancamentos = Array.isArray(db.lancamentos) ? db.lancamentos : [];
  const soltos = migrarIntegracoes(db);            // backup do modelo antigo (integração por disciplina)
  soltos.forEach(id => { const r = acharRegistro(id); if (r) gerarRevisoes(r, { base: D.hoje() }); });
  limparGrupos();
  return soltos.length;
}
function importar(arquivo){
  const leitor = new FileReader();
  leitor.onload = () => {
    let d;
    try { d = JSON.parse(leitor.result); }
    catch(e){ alert("Arquivo inválido: não é um JSON legível."); return; }
    if (!pareceBackup(d)){
      alert("JSON válido, mas não parece um backup desta plataforma (faltam registros/revisões/erros)."); return;
    }
    if (!confirm("Isso substitui todos os dados atuais. Continuar?")) return;
    const soltos = aplicarDados(d);
    persistir(true); render();
    toast(soltos ? "Backup importado — " + soltos + " sessão(ões) saíram do antigo plano por disciplina."
                 : "Backup importado.");
  };
  leitor.readAsText(arquivo);
}

/* ---------- delegação de eventos ---------- */
document.addEventListener("click", ev => {
  const aba = ev.target.closest("[data-aba]");
  if (aba){ ui.aba = aba.dataset.aba; ui.foco = null; ui.formAberto = false; render(); return; }
  const alvo = ev.target.closest("[data-acao]");
  if (!alvo) return;
  const id = alvo.dataset.id;
  switch (alvo.dataset.acao){
    case "abrir-ajustes": modalAjuda(); break;
    case "fechar-modal": fecharModal(); break;
    case "concluir": { const r = acharRevisao(id); if (r) registrarRevisao(r); break; }
    case "reabrir":  { const r = acharRevisao(id);
      if (r && confirm("Desmarcar esta revisão? A sessão de estudo ligada a ela continua registrada.")){
        reabrirRevisao(r); render(); toast("Revisão desmarcada.");
      } break; }
    case "editar-registro": ui.editandoRegistro = id; ui.formAberto = false; ui.aba = "registros"; render(); break;
    case "toggle-form-registro": ui.formAberto = !ui.formAberto; render(); break;
    case "cancelar-edicao": ui.editandoRegistro = null; ui.prefill = null; ui.formAberto = false; render(); break;
    case "excluir-registro": {
      const r = acharRegistro(id); if (!r) break;
      if (confirm('Excluir o registro de "'+rotuloAssuntos(r)+'" e suas revisões?')){
        excluirRegistro(id); if (ui.editandoRegistro === id) ui.editandoRegistro = null;
        render(); toast("Registro excluído.");
      }
      break;
    }
    case "sel-conteudo":
      ui.eAssunto = alvo.dataset.k; ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null; ui.foco = null;
      render(); break;
    case "abrir-composer": ui.compondo = true; ui.editandoErro = null; ui.foco = "txtNovo"; render(); break;
    case "salvar-pos-prova": salvarPosProva(); break;
    case "cancelar-composer": ui.compondo = false; ui.rascunhoAnot = ""; ui.foco = null; render(); break;
    case "salvar-aprendizado": salvarNovoAprendizado(); break;
    case "editar-erro": ui.editandoErro = id; ui.compondo = false; ui.rascunhoAnot = ""; ui.foco = null; render(); break;
    case "cancelar-edicao-erro": ui.editandoErro = null; render(); break;
    case "excluir-erro":
      if (confirm("Excluir esta anotação?")){ excluirErro(id); ui.editandoErro = null; render(); toast("Anotação excluída."); }
      break;
    case "q-visao": ui.qVisao = alvo.dataset.visao; render(); break;
    case "sel-dia":
      ui.diaSel = (ui.diaSel === alvo.dataset.dia) ? null : alvo.dataset.dia;
      if (ui.diaSel) ui.mesCal = ui.diaSel.slice(0,7);    // clicou num dia de outro mês: acompanha
      render(); break;
    case "cal-mes": {
      const base = (ui.mesCal || (ui.diaSel || D.hoje()).slice(0,7)) + "-01";
      const d = D.parse(base); d.setMonth(d.getMonth() + Number(alvo.dataset.delta || 0));
      ui.mesCal = D.iso(d).slice(0,7);
      render(); break;
    }
    case "cal-hoje": ui.mesCal = D.hoje().slice(0,7); render(); break;
    case "filtrar-disc":
      ui.pDisciplina = (ui.pDisciplina === alvo.dataset.disc) ? "" : alvo.dataset.disc;
      render(); break;
    case "erro-estrela": { const e = acharErro(id); if (e){ e.importante = !e.importante; persistir(); render(); } break; }
    case "erro-refeita": { const e = acharErro(id); if (e){ e.refeita = !e.refeita; persistir(); render(); } break; }
    case "toggle-importantes": ui.eSoImportantes = !ui.eSoImportantes; render(); break;
    case "toggle-juntar": ui.eJuntarTudo = !ui.eJuntarTudo; render(); break;
    case "limpar-filtros-reg":
      ui.fDisciplina = ""; ui.fPeriodo = "todos"; ui.fOrdem = "data-desc"; ui.fBusca = ""; ui.fTipo = "todos";
      ui.foco = null; render(); break;
    case "limpar-filtros-fb":
      ui.eDisciplina = ""; ui.eAssunto = ""; ui.eSoImportantes = false;
      ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null; render(); break;
    case "ver-erros":
      ui.aba = "erros"; ui.eDisciplina = alvo.dataset.disc;
      ui.eAssunto = chaveAssunto(alvo.dataset.disc, alvo.dataset.ass);
      ui.eSoImportantes = false; ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null;
      render(); break;
    case "outra-dica": ui.dicaIdx = (ui.dicaIdx + 1) % CONFIG.DICAS.length; render(); break;
    case "toggle-proximas": ui.verTodasProximas = !ui.verTodasProximas; render(); break;
    case "toggle-assuntos": ui.verTodosAssuntos = !ui.verTodosAssuntos; render(); break;
    case "add-assunto": adicionarAssuntoForm(); return;      // sem redesenhar: preserva o que já foi digitado
    case "painel-nuvem": painelNuvem(); break;
    case "nuvem-sincronizar": subirParaNuvem().then(() => toast("Sincronizado.")); break;
    case "nuvem-baixar":
      if (confirm("Trazer os dados da nuvem? Isso substitui o que está neste navegador."))
        baixarDaNuvem().then(l => {
          if (l && pareceBackup(l.conteudo)){ aplicarDados(l.conteudo); persistir(true); fecharModal(); render(); toast("Dados trazidos da nuvem."); }
          else toast("A nuvem ainda não tem dados desta conta.");
        }).catch(e => alert("Não deu para baixar: " + e.message));
      break;
    case "nuvem-sair": sairDaNuvem(); break;
    case "painel-arquivo": painelArquivo(); break;
    case "arq-criar":  escolherArquivo(true); break;
    case "arq-abrir":  escolherArquivo(false); break;
    case "arq-trocar": escolherArquivo(false); break;
    case "arq-reconectar": reconectarArquivo(); break;
    case "arq-gravar": gravarArquivo().then(() => toast("Arquivo atualizado.")); break;
    case "arq-desligar": desconectarArquivo(); break;
    case "fmt": aplicarFormato(alvo.dataset.alvo, alvo.dataset.fmt); return;   // sem redesenhar
    case "add-membro": adicionarMembroGrupo(alvo); return;
    case "remover-membro": removerMembroGrupo(alvo); return;
    case "editar-card": abrirEditorCard(alvo.dataset.card); break;
    case "abrir-conteudos": modalConteudos(); break;
    case "concluir-disciplina": {
      const disc = alvo.dataset.disc;
      const n = conteudosDaDisciplina(disc).filter(c => c.fase !== "concluido").length;
      if (!confirm("Concluir " + n + " conteúdo(s) de " + disc + "? Todas as sessões deles passam a ser revisadas.")) break;
      concluirDisciplina(disc); persistir(); render(); modalConteudos();
      toast(disc + ": " + n + " conteúdo(s) concluído(s).");
      break; }
    case "reabrir-disciplina": {
      const disc = alvo.dataset.disc;
      if (!confirm("Reabrir todos os conteúdos de " + disc + "?")) break;
      reabrirDisciplina(disc); persistir(); render(); modalConteudos();
      toast(disc + " voltou a ser conteúdo em andamento.");
      break; }
    case "renomear-conteudo": {
      const disc = alvo.dataset.disc, antigo = alvo.dataset.cont;
      const novo = (prompt("Novo nome para “" + antigo + "”:", antigo) || "").trim();
      if (!novo || novo === antigo) break;
      if (acharConteudo(disc, novo) && novo.toLowerCase() !== antigo.toLowerCase()){
        alert("Já existe um conteúdo com esse nome nesta disciplina."); break;
      }
      renomearConteudo(disc, antigo, novo); persistir(); render(); modalConteudos();
      toast("Renomeado em todo o sistema.");
      break; }
    case "concluir-conteudo": {
      const disc = alvo.dataset.disc, nomes = (alvo.dataset.conts || "").split("|").filter(Boolean);
      const quantas = sessoesDoConteudo(disc, nomes).length;
      if (quantas > 1 && !confirm("Fechar " + (nomes.length > 1 ? "estes conteúdos" : "este conteúdo") +
          " vale para as " + quantas + " sessões que falam dele. Continuar?")) break;
      marcarConteudos(nomes.map(n => acharConteudo(disc, n)), "concluido");
      persistir(); render();
      toast("Conteúdo fechado — as revisões começam a partir de hoje.");
      break; }
    case "reabrir-conteudo": {
      const disc = alvo.dataset.disc, nomes = (alvo.dataset.conts || "").split("|").filter(Boolean);
      if (!confirm("Reabrir? As revisões pendentes viram uma volta só, e a escada recomeça quando você fechar de novo.")) break;
      marcarConteudos(nomes.map(n => acharConteudo(disc, n)), "andamento");
      persistir(); render();
      toast("Conteúdo reaberto — a agenda volta a chamar para estudar.");
      break; }
    case "salvar-card": salvarCard(); break;
    case "remover-assunto": {
      const t = alvo.closest(".tag"); if (t) t.remove();
      const c = document.getElementById("campoAssunto"); if (c) c.focus();
      return;
    }
    case "nova-revisao":
      ui.aba = "revisoes"; ui.editandoRevisao = "nova";
      ui.prefRevisao = alvo.dataset.disc
        ? { disciplina: alvo.dataset.disc, assuntos: (alvo.dataset.ass || "").split("|").filter(Boolean) }
        : null;
      render(); break;
    case "editar-revisao": ui.editandoRevisao = id; ui.prefRevisao = null; render(); break;
    case "abrir-sessao": ui.editandoRegistro = id; ui.formAberto = false; ui.aba = "registros"; render(); break;
    case "remarcar-revisao": {
      const r = acharRevisao(id); if (!r) break;
      const nova = prompt("Nova data para esta revisão (aaaa-mm-dd):", D.hoje());
      if (!nova || !/^\d{4}-\d{2}-\d{2}$/.test(nova)){ if (nova) toast("Data inválida."); break; }
      if (nova < D.hoje()){ toast("Escolha hoje ou uma data à frente."); break; }
      const k = chaveCard(r);
      if (db.revisoes.some(o => o.id !== r.id && !o.feita && o.data === nova && chaveCard(o) === k)){
        toast("Já existe revisão deste conteúdo nesse dia — escolha outra data."); break;
      }
      remarcarRevisao(r, nova); render();
      toast("Revisão remarcada para " + D.brFull(nova) + ".");
      break;
    }
    case "novo-lancamento": ui.editandoLancamento = "novo"; ui.aba = "questoes"; render(); break;
    case "editar-lancamento": ui.editandoLancamento = id; render(); break;
    case "cancelar-lancamento": ui.editandoLancamento = null; render(); break;
    case "excluir-lancamento":
      if (confirm("Excluir este lançamento de questões?")){
        excluirLancamento(id); ui.editandoLancamento = null; render(); toast("Lançamento excluído.");
      }
      break;
    case "cancelar-revisao": ui.editandoRevisao = null; ui.prefRevisao = null; render(); break;
    case "excluir-revisao":
      if (confirm("Excluir esta revisão? A sessão de estudo ligada a ela, se houver, continua como está.")){
        const rv = acharRevisao(id);
        const sv = rv ? sessaoDaRevisao(rv) : null;
        if (sv) delete sv.revisaoId;             // a sessão sobrevive, só perde o vínculo
        db.revisoes = db.revisoes.filter(r => r.id !== id);
        ui.editandoRevisao = null; persistir(); render(); toast("Revisão excluída.");
      }
      break;
    case "crono-encerrar": encerrarCrono(); break;
    case "crono-cancelar":
      if (confirm("Descartar este cronômetro? O tempo não será registrado.")){
        db.cronometro = null; persistir(true); render(); toast("Cronômetro descartado.");
      }
      break;
    case "descartar-prefill": ui.prefill = null; redesenharTelaForm(); break;
  }
});

// filtros (mudam o estado e redesenham, preservando o foco do campo)
document.addEventListener("input", ev => {
  if (ev.target.id === "fBusca"){ ui.fBusca = ev.target.value; ui.foco = "fBusca"; render(); }
  // o que está sendo escrito na anotação sobrevive a um recarregamento
  if (ev.target.id === "txtNovo"){ ui.rascunhoAnot = ev.target.value; guardarTela(); }
  // contador da caixa de anotação: só troca o texto, sem redesenhar a tela
  if (ev.target.id && ev.target.tagName === "TEXTAREA"){
    const c = document.querySelector('.contador[data-para="'+ev.target.id+'"]');
    if (c){
      const n = ev.target.value.length, max = CONFIG.MAX_ANOTACAO;
      c.textContent = n + " / " + max;
      c.classList.toggle("perto", n >= max*0.9 && n < max);
      c.classList.toggle("cheio", n >= max);
    }
  }
  // renomear um assunto: a etiqueta guarda o texto novo em data-assunto
  if (ev.target.matches && ev.target.matches(".tag .txt")){
    const tag = ev.target.closest(".tag");
    if (tag) tag.dataset.assunto = ev.target.textContent.replace(/\s+/g, " ").trim();
  }
});
// colar dentro da etiqueta entra como texto puro, nunca como HTML
document.addEventListener("paste", ev => {
  if (!(ev.target.matches && ev.target.matches(".tag .txt"))) return;
  ev.preventDefault();
  const txt = (ev.clipboardData || window.clipboardData).getData("text/plain").replace(/\s+/g, " ");
  document.execCommand("insertText", false, txt);
});
document.addEventListener("keydown", ev => {
  const alvo = ev.target;
  if (!(alvo.matches && alvo.matches(".tag .txt"))) return;
  if (ev.key === "Enter"){ ev.preventDefault(); alvo.blur(); }
  if (ev.key === "Escape"){                        // desfaz sem fechar a tela de edição
    ev.preventDefault(); ev.stopPropagation();
    const tag = alvo.closest(".tag");
    if (tag){
      const original = tag.dataset.assuntoOriginal || tag.dataset.assunto;
      alvo.textContent = original;
      tag.dataset.assunto = original;              // o que vai ser salvo volta junto
    }
    alvo.blur();
  }
}, true);
// guardar o nome de partida (para o Esc) e limpar o que ficar vazio
document.addEventListener("focusin", ev => {
  if (ev.target.matches && ev.target.matches(".tag .txt")){
    const tag = ev.target.closest(".tag");
    if (tag) tag.dataset.assuntoOriginal = tag.dataset.assunto;
  }
});
document.addEventListener("focusout", ev => {
  if (!(ev.target.matches && ev.target.matches(".tag .txt"))) return;
  const tag = ev.target.closest(".tag"); if (!tag) return;
  const texto = ev.target.textContent.replace(/\s+/g, " ").trim();
  if (!texto){                                     // esvaziou: volta ao que era
    ev.target.textContent = tag.dataset.assuntoOriginal || "";
    tag.dataset.assunto = ev.target.textContent;
  } else { ev.target.textContent = texto; tag.dataset.assunto = texto; }
});
document.addEventListener("change", ev => {
  // escolheu a data: tira o foco para o calendário do navegador fechar sozinho
  if (ev.target.matches && ev.target.matches('input[type="date"]')) ev.target.blur();
  // "＋ Criar novo conteúdo" abre o campo do nome, ali mesmo
  if (ev.target.id === "campoAssunto"){
    const cx = document.getElementById("novoConteudoNome");
    if (cx){ cx.hidden = ev.target.value !== "__novo"; if (!cx.hidden) cx.focus(); }
    return;
  }
  // "Isto apareceu numa questão?": o bloco abre e fecha na hora, sem redesenhar
  if (ev.target.name === "daQuestao"){
    const painel = document.getElementById("painelQuestao");
    const abrir = ev.target.value === "sim";
    if (painel) painel.classList.toggle("aberto", abrir);
    document.querySelectorAll('[name="daQuestao"]')
      .forEach(r => r.setAttribute("aria-expanded", abrir ? "true" : "false"));
    return;
  }
  // filtros da aba Aprendizados: disciplina manda no conteúdo, e vice-versa
  if (ev.target.id === "eDisciplina"){
    ui.eDisciplina = ev.target.value;
    const atual = ui.eAssunto ? assuntos().find(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto) : null;
    if (!ui.eDisciplina || (atual && atual.disciplina !== ui.eDisciplina)) ui.eAssunto = "";
    ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null;
    render(); return;
  }
  if (ev.target.id === "eAssunto"){
    ui.eAssunto = ev.target.value;
    const atual = ui.eAssunto ? assuntos().find(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto) : null;
    if (atual) ui.eDisciplina = atual.disciplina;
    ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null;
    render(); return;
  }
  const mapa = { fDisciplina:"fDisciplina", fPeriodo:"fPeriodo", fOrdem:"fOrdem", fTipo:"fTipo",
                 cronoDestino:"cronoDestino" };
  if (mapa[ev.target.id]){ ui[mapa[ev.target.id]] = ev.target.value; ui.foco = null; render(); }
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !$("#overlay").hidden) fecharModal();
});
document.addEventListener("mousedown", ev => {
  if (sug && !sug.ul.contains(ev.target) && ev.target !== sug.inp) fecharSugestoes();
}, true);
// rolar a página fecha a lista — mas rolar DENTRO dela (ou o scrollIntoView
// das setas) não pode fechar
window.addEventListener("scroll", ev => {
  if (sug && !sug.ul.contains(ev.target)) fecharSugestoes();
}, true);

$("#btnTema").onclick = () => { db.tema = db.tema === "escuro" ? "claro" : "escuro"; persistir(); render(); };
$("#btnAjuda").onclick = modalAjuda;
$("#btnExportar").onclick = exportar;
// sair da aba/fechar o navegador: grava o que ainda não foi
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden"){ clearTimeout(tArquivo); gravarArquivo(); }
});
window.addEventListener("pagehide", () => { clearTimeout(tArquivo); gravarArquivo(); clearTimeout(tNuvem); subirParaNuvem(); });

/* A VIRADA DO DIA. Deixar a plataforma aberta a noite toda (ou o celular só
   dormindo com a aba aberta) mantinha a tela no dia anterior: "hoje", a
   contagem regressiva e o dia do Painel só eram recalculados num render, e
   nenhum acontecia sozinho. Agora um relógio confere de minuto em minuto — e
   também quando a aba volta a ficar visível, que é o caso do celular.       */
let diaCorrente = D.hoje();
function verificarVirada(){
  const agora = D.hoje();
  if (agora === diaCorrente) return;
  const seguiaHoje = ui.diaSel === diaCorrente;       // estava no "hoje", não num dia escolhido
  const mesAnterior = diaCorrente.slice(0,7);
  diaCorrente = agora;
  if (seguiaHoje) ui.diaSel = agora;
  if (ui.mesCal === mesAnterior) ui.mesCal = agora.slice(0,7);
  render();
  toast("Virou o dia: a tela agora mostra " + D.brFull(agora) + ".");
  if (precisaPerguntarPosProva() && $("#overlay").hidden) modalPosProva();
}
setInterval(verificarVirada, 60000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) verificarVirada(); });
window.addEventListener("focus", verificarVirada);

/* ---------- arranque ---------- */
if (!temStorage) $("#avisoStorage").hidden = false;
render();
// a prova passou e ninguém disse o que fazer: pergunta uma vez
if (precisaPerguntarPosProva()) modalPosProva();
if (inicio.abertos){
  persistir();
  toast(inicio.abertos + " conteúdo(s) passaram a “em andamento” — a agenda agora chama para voltar ao assunto. " +
        "Marque “terminei” quando fechar cada um.");
}
iniciarArquivo();                 // religa o .json escolhido antes, se houver
iniciarNuvem();                   // e a conta da nuvem, se houver sessão salva
// voltou a ter conexão: sobe o que ficou pendente
window.addEventListener("online", () => { if (nuvem.pendente) subirParaNuvem(); });
/* Pede ao navegador que trate estes dados como permanentes: sem isso ele pode
   descartá-los sozinho quando o disco aperta. Não protege de uma limpeza feita
   à mão, mas tira o risco de sumiço silencioso. */
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(ja => { if (!ja) navigator.storage.persist(); }).catch(() => {});
}
if (inicio.desintegrados && inicio.desintegrados.length){
  inicio.desintegrados.forEach(id => {
    const r = acharRegistro(id); if (r) gerarRevisoes(r, { base: D.hoje() });
  });
  persistir(); render();
  toast(inicio.desintegrados.length + " sessão(ões) saíram do antigo plano por disciplina — " +
        "reintegre escolhendo o conteúdo no formulário de registro.");
}
if (inicio.migrados){
  persistir();
  toast(inicio.migrados + " observação(ões) do protótipo viraram aprendizados.");
}
})();
