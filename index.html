function formTarefa(t){
  const novo = !t;
  return '<form id="formTarefa"'+(t ? ' data-id="'+esc(t.id)+'"' : '')+'>' +
    '<div class="campos">' +
      campo("Título *", '<input name="titulo" maxlength="80" required value="'+esc(t ? t.titulo : "")+'" ' +
            'placeholder="Ex.: pagar a inscrição, simulado geral, aula ao vivo" autocomplete="off">', true) +
      (novo ? campoDatasEmCadeia(true)
            : campo("Data *", '<input type="date" name="data" value="'+t.data+'" required>')) +
      campo("Horário (opcional)", '<input type="time" name="hora" value="'+esc(t && t.hora ? t.hora : "")+'" style="max-width:140px">') +
      campo("Detalhes (opcional)", '<textarea name="nota" class="texto-grande" placeholder="O que levar, link da aula, o que revisar antes…">' +
            esc(t && t.nota ? t.nota : "") + '</textarea>', true) +
    '</div>' +
    '<div class="linha acoes-form"><button class="btn" type="submit">'+(novo ? "Adicionar tarefa" : "Salvar")+'</button>' +
    '<button class="btn ghost" type="button" data-acao="cancelar-tarefa">Cancelar</button>' +
    (t ? '<button class="act excluir excluir-tela" type="button" data-acao="excluir-tarefa" data-id="'+esc(t.id)+'">Excluir</button>' : '') +
    '<span class="erro-form" id="erroTarefa"></span></div></form>';
}
function enviarTarefa(ev){
  ev.preventDefault();
  const f = ev.target, fd = new FormData(f);
  const aviso = document.getElementById("erroTarefa");
  const titulo = String(fd.get("titulo") || "").trim();
  const hora = /^\d{2}:\d{2}$/.test(fd.get("hora") || "") ? fd.get("hora") : "";
  const nota = String(fd.get("nota") || "").trim();
  const existente = f.dataset.id ? acharTarefa(f.dataset.id) : null;
  const datas = existente ? [fd.get("data")].filter(Boolean)
              : (() => { const l = fd.getAll("datas").filter(Boolean);
                         return l.length ? [...new Set(l)].sort() : [fd.get("data")].filter(Boolean); })();
  if (!titulo){ aviso.textContent = "Dê um título à tarefa."; return; }
  if (!datas.length){ aviso.textContent = "Informe a data da tarefa."; return; }
  if (existente){
    Object.assign(existente, { titulo, data: datas[0], hora, nota });
  } else {
    datas.forEach(data => getTarefas().push({ id: uid(), titulo, data, hora, nota,
                                              feita: false, feitaEm: "", criadoEm: Date.now() }));
  }
  persistir();
  ui.editandoTarefa = null;
  render();
  toast(existente ? "Tarefa atualizada."
        : datas.length > 1 ? datas.length + " tarefas adicionadas (" + datas.map(D.br).join(", ") + ")."
        : "Tarefa adicionada para " + D.brFull(datas[0]) + ".");
}

function enviarRevisao(ev){
  ev.preventDefault();
  const f = ev.target, d = Object.fromEntries(new FormData(f).entries());
  const aviso = document.getElementById("erroRevisao");
  const num = v => v === "" || v === undefined ? 0 : Math.max(0, Number(v) || 0);
  const listaAssuntos = lerAssuntosForm(f);
  const disciplina = lerDisciplina(f);
  const tf = termosDoItem(f.dataset.id ? acharRevisao(f.dataset.id) : null);   // "revisão" ou "retomada"
  // em cadeia: as etiquetas mandam; sem etiqueta, vale a caixa de data
  const datas = f.dataset.id ? [d.data].filter(Boolean)
              : (() => { const l = new FormData(f).getAll("datas").filter(Boolean);
                         return l.length ? [...new Set(l)].sort() : [d.data].filter(Boolean); })();
  if (!datas.length){ aviso.textContent = "Informe a data " + tf.doItem + "."; return; }
  if (!disciplina){ aviso.textContent = "Escolha a disciplina (ou crie uma nova)."; return; }
  if (!listaAssuntos.length){ aviso.textContent = "Adicione ao menos um assunto."; return; }
  const deProva = datas.find(dt => dt >= D.hoje() && diaDeProva(dt));
  if (deProva){
    aviso.textContent = "Esse dia é de prova (" + D.brFull(deProva) + ") — escolha outro para " + tf.esta + "."; return;
  }
  if (datas.length > 1){
    datas.forEach(dt => salvarRevisaoManual(null, dt, disciplina, listaAssuntos, d));
    persistir();
    ui.editandoRevisao = null; ui.prefRevisao = null;
    render();
    toast(datas.length + " revisões adicionadas (" + datas.map(D.br).join(", ") + ").");
    return;
  }
  const rev = salvarRevisaoManual(f.dataset.id ? acharRevisao(f.dataset.id) : null, datas[0],
                                  disciplina, listaAssuntos, d);
  persistir();
  ui.editandoRevisao = null; ui.prefRevisao = null;
  render();
  toast(f.dataset.id ? termosDoItem(rev).atualizado
                     : "Revisão adicionada.");
}
/* Grava UMA revisão marcada à mão (nova, com existente = null, ou editada).
   A única trava de data — o dia de prova — é conferida antes, em enviarRevisao.
   Depois da prova vale marcar normalmente: as revisões seguem. */
function salvarRevisaoManual(existente, data, disciplina, listaAssuntos, d){
  const rev = existente || { id: uid(), ordem: 0 };
  // casa com uma sessão de estudo que tenha exatamente estes assuntos; senão, fica avulsa
  const chave = chaveConteudos(disciplina, listaAssuntos);
  const reg = db.registros.find(r => chaveSessao(r) === chave);

  const dataAntes = existente ? rev.data : null;
  // editar a data é remanejar: as seguintes andam junto (as distâncias são lidas antes)
  if (existente && data !== dataAntes) remanejarItem(existente, data);
  rev.registroId = reg ? reg.id : null;
  if (reg){ delete rev.disciplina; delete rev.assuntos; }
  else { rev.disciplina = disciplina; rev.assuntos = listaAssuntos.slice(); }
  rev.data = data;
  rev.rotulo = (d.rotulo || "").trim();       // vazio = volta a se chamar pela ordem
  rev.nota = (d.nota || "").trim();
  rev.manual = true;                       // não é reescrita pelo replanejamento automático
  delete rev.doAutomatico;                 // editada: é sua de verdade (ver desligarAgendaAutomatica)
  /* A revisão é agenda: quem guarda tempo e questões é a sessão que a cumpre.
     A EXCEÇÃO é a revisão feita no modelo antigo, sem sessão ligada: os números
     moram nela, e editar (dar um nome, corrigir a data) não pode desmarcá-la
     nem apagar as questões — antes as duas coisas aconteciam em silêncio. */
  const feitaAntiga = !!(existente && existente.feita && !existente.sessaoId);
  if (!feitaAntiga){
    rev.minutos = null; rev.questoes = null; rev.acertos = null; rev.dificuldade = null;
    rev.feita = !!rev.sessaoId;
    rev.feitaEm = rev.sessaoId ? rev.feitaEm : null;
  }
  if (!existente){
    if (!rev.ordem){
      const irmas = db.revisoes.filter(r => reg ? r.registroId === reg.id
                                              : (!r.registroId && r.disciplina === disciplina));
      rev.ordem = irmas.length + 1;
    }
    db.revisoes.push(rev);
  }
  /* Revisão NOVA marcada à mão, de conteúdo concluído, é contato: as seguintes
     andam a partir dela, cada uma mantendo a sua distância. (A editada já foi
     remanejada lá em cima.) */
  if (!existente && !ehRetomada(rev) && !rev.feita)
    contatoComConteudos(fichasDaRevisao(rev), rev.data, { exceto: rev.id, mesmoDia: true });
  return rev;
}

/* ---------- TELA: APRENDIZADO COM QUESTÕES ----------
   Fluxo: escolher o conteúdo → botão "+" no topo da lista → escrever só o
   aprendizado. Banca, o que errei e tipo do erro são opcionais e entram
   depois, pelo "editar" dentro do próprio card (sem abrir outra tela).      */

/* Conteúdos que podem receber uma anotação: só os das SESSÕES DE ESTUDO já
   registradas — aqui não se cria disciplina nem conteúdo. Anotações antigas que
   apontam para um conteúdo sem sessão continuam na lista, marcadas, para não
   sumirem da tela; o que não dá é criar outras assim. */
/* ONDE UMA ANOTAÇÃO PODE ENTRAR.
   Antes, só o que estivesse numa SESSÃO já registrada. A regra tinha lógica
   quando conteúdo era texto livre digitado dentro da sessão — sem sessão, não
   havia conteúdo. Mas hoje disciplina e conteúdo são CADASTRO, e a vida não
   segue essa ordem: você esbarra num ponto importante de uma matéria que ainda
   nem começou a estudar, e não tinha onde guardar.
   Agora valem três origens, nesta ordem de força:
     - o CADASTRO (disciplinas e fichas de conteúdo), com ou sem sessão;
     - as SESSÕES já registradas;
     - e o que aparece só nas anotações antigas.
   Tudo recebe anotação nova. O que sobrou do antigo "órfão" é um AVISO, não uma
   trava: o item que ainda não tem sessão nenhuma é marcado como tal na lista —
   é informação útil ("isto eu ainda não estudei"), não motivo para impedir. */
function conteudosDisponiveis(){
  const m = new Map();
  const por = (disc, assunto) => {
    if (!disc) return;
    const k = chaveAssunto(disc, assunto || "");
    if (!m.has(k)) m.set(k, { disciplina: disc, assunto: assunto || "", semSessao: true });
  };
  disciplinas().forEach(d => por(d, ""));               // a disciplina inteira é sempre um alvo
  conteudosCad().forEach(c => por(c.disciplina, c.nome));
  db.erros.forEach(e => { por(e.disciplina, ""); por(e.disciplina, e.assunto || ""); });
  // quem tem sessão perde a marca
  db.registros.forEach(r => {
    [""].concat(assuntosDe(r)).forEach(a => {
      por(r.disciplina, a);
      const alvo = m.get(chaveAssunto(r.disciplina, a || ""));
      if (alvo) alvo.semSessao = false;
    });
  });
  return [...m.values()].sort((a,b) => (a.disciplina+a.assunto).localeCompare(b.disciplina+b.assunto, "pt-BR"));
}
const rotuloConteudo = a => (a.assunto || "toda a disciplina") +
                            (a.semSessao ? " — ainda sem sessão" : "");
/** Onde a próxima anotação entra: o conteúdo escolhido ou, sem ele, a disciplina
    inteira. As duas dimensões podem ser filtradas pelo seletor de conteúdo. */
function alvoAnotacao(){
  const lista = conteudosDisponiveis();
  const achar = k => lista.find(a => chaveAssunto(a.disciplina, a.assunto) === k);
  const alvo = ui.eAssunto ? achar(ui.eAssunto)
             : ui.eDisciplina ? achar(chaveAssunto(ui.eDisciplina, "")) : null;
  return alvo || null;
}
/** todas as questões feitas: sessões de estudo + revisões concluídas */
function lancamentosDeQuestoes(){
  const itens = [];
  db.registros.forEach(r => {
    if (!(r.questoes > 0)) return;
    itens.push({ data: r.data, disciplina: r.disciplina, rotulo: rotuloAssuntos(r), tipo: "sessão",
                 questoes: r.questoes, acertos: r.acertos || 0, assuntos: assuntosDe(r) });
  });
  db.revisoes.forEach(rev => {
    if (!rev.feita || !(rev.questoes > 0)) return;
    const ctx = contextoRevisao(rev); if (!ctx) return;
    itens.push({ data: rev.feitaEm || rev.data, disciplina: ctx.disciplina, rotulo: ctx.rotulo,
                 tipo: "revisão", questoes: rev.questoes, acertos: rev.acertos || 0, assuntos: ctx.assuntos || [] });
  });
  (db.lancamentos || []).forEach(l => {
    const reg = acharRegistro(l.registroId); if (!reg) return;
    itens.push({ data: l.data, disciplina: reg.disciplina, rotulo: rotuloAssuntos(reg),
                 tipo: "questões", questoes: l.questoes || 0, acertos: l.acertos || 0, lancamento: l,
                 assuntos: assuntosDe(reg) });
  });
  return itens.sort((a,b) => b.data.localeCompare(a.data));
}
const botaoLancarQuestoes = () =>
  '<button class="btn-add" data-acao="novo-lancamento"><span class="mais">+</span> Lançar questões</button>';
function totalQuestoes(lista){
  const itens = lista || lancamentosDeQuestoes();
  const questoes = itens.reduce((t,x) => t + x.questoes, 0);
  const acertos  = itens.reduce((t,x) => t + x.acertos, 0);
  return { questoes, acertos, erros: questoes - acertos, taxa: pct(acertos, questoes), itens };
}

/** desempenho consolidado de uma disciplina inteira */
function estatDisciplina(disc){
  const regs = db.registros.filter(r => r.disciplina === disc);
  const ids = new Set(regs.map(r => r.id));
  const revs = db.revisoes.filter(r => (r.registroId && ids.has(r.registroId)) ||
                                       (!r.registroId && r.disciplina === disc));
  const feitas = revs.filter(r => r.feita);
  const somar = (lista, campo) => lista.reduce((t,x) => t + (x[campo]||0), 0);
  const lancs = (db.lancamentos || []).filter(l => ids.has(l.registroId));
  const q = somar(regs, "questoes") + somar(feitas, "questoes") + somar(lancs, "questoes");
  const a = somar(regs, "acertos")  + somar(feitas, "acertos")  + somar(lancs, "acertos");
  const errs = db.erros.filter(e => e.disciplina === disc);
  return { questoes: q, acertos: a, taxa: pct(a, q), erros: errs.length,
           errosBobos: errs.filter(e => e.categoria === "bobo").length,
           refeitas: errs.filter(e => e.refeita).length,
           conteudos: conteudosDaDisciplina(disc).length };   // o cadastro: o mesmo número da aba Disciplinas
}

function telaErros(){
  const lista = conteudosDisponiveis();
  let sel = ui.eAssunto ? lista.find(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto) : null;
  if (sel && !sel.assunto){ ui.eDisciplina = sel.disciplina; ui.eAssunto = ""; sel = null; }
  if (ui.eAssunto && !sel) ui.eAssunto = "";
  if (sel) ui.eDisciplina = sel.disciplina;
  const disc = ui.eDisciplina || "";
  const daDisciplina = lista.filter(a => !disc || a.disciplina === disc);

  const discsComConteudo = [...new Set(lista.map(a => a.disciplina))]
    .sort((a,b) => a.localeCompare(b, "pt-BR"));

  let h = '<div class="card"><h2>Anotações</h2>';

  // ----- filtros: disciplina e conteúdo (só o que já existe em Registros)
  const filtrandoFb = !!(disc || ui.eAssunto || ui.eSoImportantes || ui.eBusca);
  h += '<div class="filtros"><div class="filtros-campos">' +
    campo("Disciplina", '<select id="eDisciplina"><option value="">Todas as disciplinas</option>' +
      discsComConteudo.map(d => '<option'+(disc === d ? " selected" : "")+'>'+esc(d)+'</option>').join("") + '</select>') +
    campo("Conteúdo", '<select id="eAssunto"><option value="">' +
      (disc ? "Tudo de " + esc(disc) : "Tudo") + '</option>' +
      daDisciplina.filter(a => a.assunto).map(a => {      // o nível "disciplina" é o próprio "Tudo de X"
        const k = chaveAssunto(a.disciplina, a.assunto);
        return '<option value="'+esc(k)+'"'+(ui.eAssunto === k ? " selected" : "")+'>' +
               esc(disc ? rotuloConteudo(a) : a.disciplina + " · " + rotuloConteudo(a)) + '</option>';
      }).join("") + '</select>') +
    '</div><div class="filtros-acoes">' +
      '<button class="btn mini '+(ui.eSoImportantes?"":"ghost")+'" data-acao="toggle-importantes" ' +
        'aria-pressed="'+(ui.eSoImportantes?"true":"false")+'">' + ESTRELA().filtro + '</button>' +
      '<button class="btn mini '+(ui.eJuntarTudo?"":"ghost")+'" data-acao="toggle-juntar" ' +
        'aria-pressed="'+(ui.eJuntarTudo?"true":"false")+'" ' +
        'title="'+(ui.eJuntarTudo ? "Voltar a separar por dia" : "Um card por conteúdo, com todos os dias dentro")+'">' +
        (ui.eJuntarTudo ? "⇕ separar por dia" : "⇅ juntar os dias") + '</button>' +
      (filtrandoFb ? '<span class="spacer"></span>' +
        '<button class="btn mini ghost" data-acao="limpar-filtros-fb">limpar filtros</button>' : '') +
    '</div></div>';

  /* ----- os números do que está selecionado.
     Saíram a TAXA DE ACERTO e o POR DESATENÇÃO: os dois medem desempenho em
     questão, e esta aba é de conhecimento — o que se anota aqui "vem de questão
     ou não". O desempenho tem a aba Questões inteira para ele. Saiu também o
     "N refeitas e acertadas" de baixo da contagem, pelo mesmo motivo.
     No lugar entraram dois números que respondem o que se pergunta AQUI:
     quanto disto vai para a véspera, e quando foi a última vez que anotei. */
  const somaAnot = alvo => {
    const lista = db.erros.filter(e => alvo.assunto
      ? chaveAssunto(e.disciplina, e.assunto) === chaveAssunto(alvo.disciplina, alvo.assunto)
      : e.disciplina === alvo.disciplina);
    const ultima = lista.reduce((t,e) => Math.max(t, e.criadoEm || 0), 0);
    return { total: lista.length, vespera: lista.filter(e => e.importante).length, ultima };
  };
  const tileUltima = a => {
    if (!a.ultima) return tile("Última anotação", "—", "nada anotado ainda");
    const dia = D.iso(new Date(a.ultima)), faz = D.dif(dia, D.hoje());
    return tile("Última anotação", D.br(dia),
                faz <= 0 ? "hoje" : faz === 1 ? "ontem" : "há " + faz + " dias");
  };
  if (sel && sel.assunto){
    const est = estatAssunto(sel.disciplina, sel.assunto), a = somaAnot(sel);
    h += '<div class="tiles" style="margin-bottom:14px">' +
      tile("Pontos anotados", String(a.total), esc(sel.disciplina)) +
      tile(ESTRELA().tile, String(a.vespera),
           a.total ? (a.vespera ? pct(a.vespera, a.total) + "% das anotações" : "nenhuma marcada") : "—",
           "", a.vespera ? "star" : "") +
      tileUltima(a) +
      tile("Questões do conteúdo", String(est.questoes), est.acertos + " acertos") + '</div>';
  } else if (disc){
    const est = estatDisciplina(disc), a = somaAnot({ disciplina: disc, assunto: "" });
    // quantos conteúdos DA DISCIPLINA já têm alguma anotação: mostra a cobertura
    const comNota = new Set(db.erros.filter(e => e.disciplina === disc && e.assunto).map(e => e.assunto.toLowerCase()));
    const totalCont = conteudosDaDisciplina(disc).length;
    h += '<div class="tiles" style="margin-bottom:14px">' +
      tile("Pontos anotados", String(a.total), plural(est.conteudos, "conteúdo", "conteúdos") + " na disciplina") +
      tile(ESTRELA().tile, String(a.vespera),
           a.total ? (a.vespera ? pct(a.vespera, a.total) + "% das anotações" : "nenhuma marcada") : "—",
           "", a.vespera ? "star" : "") +
      tile("Conteúdos anotados", String(comNota.size),
           totalCont ? "de " + totalCont + " no cadastro" : "—",
           totalCont ? '<div class="barra"><i class="'+(comNota.size >= totalCont && totalCont ? "cheia" : "")+
                       '" style="width:'+Math.round((comNota.size/totalCont)*100)+'%"></i></div>' : "") +
      tile("Questões da disciplina", String(est.questoes), est.acertos + " acertos") + '</div>';
  }

  // ----- botão "+" no topo da lista: anota no conteúdo escolhido ou na disciplina
  /* O botão + não depende mais do filtro: dá para começar a escrever a
     qualquer momento. Sem disciplina/conteúdo escolhido, o próprio compositor
     traz o seletor — e só salva depois de escolhido.                        */
  const alvo = alvoAnotacao();
  const podeAnotar = lista.length > 0;
  if (podeAnotar){
    h += ui.compondo
      ? '<div class="compositor">' + barraFormato("txtNovo", (ui.rascunhoAnot || "").length) +
        '<textarea id="txtNovo" maxlength="'+CONFIG.MAX_ANOTACAO+'" ' +
        'placeholder="O que você não quer esquecer disto?">'+esc(ui.rascunhoAnot || "")+'</textarea>' +
        (alvo ? '' :
          '<div class="campos" style="margin-top:9px">' +
          /* O compositor fica aberto depois de salvar, para a próxima anotação —
             então ele guarda o destino da anterior: quase sempre a próxima é do
             mesmo assunto, e escolher tudo de novo a cada ponto era trabalho à toa. */
          camposAlvoAnotacao((ui.alvoAnot || {}).disciplina || "",
                             (ui.alvoAnot || {}).assunto || "", "novoConteudo") + '</div>') +
        /* Salvar | Cancelar, na mesma ordem das janelas; a dica do teclado só onde há teclado */
        '<div class="rodape">' +
        '<button class="btn" data-acao="salvar-aprendizado">Salvar</button>' +
        '<button class="btn ghost" data-acao="cancelar-composer">Cancelar</button>' +
        '<span class="ajuda-composer">' +
          (alvo ? 'Vai entrar em <b>'+esc(alvo.assunto || alvo.disciplina)+'</b>'+(alvo.assunto ? "" : " (disciplina inteira)") : '') +
          '<span class="so-teclado">' + (alvo ? ' · ' : '') + 'Ctrl/⌘ + Enter salva · Esc fecha</span></span>' +
        '<span class="erro-form" id="erroComposer"></span></div></div>'
      : '<button class="btn-add" data-acao="abrir-composer"><span class="mais">+</span> Nova anotação' +
        (alvo ? '<span class="pista">em “' + esc(alvo.assunto || alvo.disciplina) + '”</span>' +
                (alvo.assunto ? '' : '<span class="badge">disciplina inteira</span>')
              : '') + '</button>';
  } else {
    h += '<div class="vazio"><strong>Nenhuma disciplina para anotar ainda</strong>' +
      'Crie uma na aba <b>Disciplinas</b> — dá para anotar nela antes mesmo de começar a estudar — ' +
      'ou registre uma sessão na aba <b>Sessões</b>.</div>';
  }

  // ----- lista
  let itens = db.erros.slice();
  // filtrar por um conteúdo mostra só ele; sem conteúdo escolhido, tudo da disciplina
  if (ui.eAssunto)  itens = itens.filter(e => chaveAssunto(e.disciplina, e.assunto || "") === ui.eAssunto);
  else if (disc)    itens = itens.filter(e => e.disciplina === disc);
  if (ui.eSoImportantes) itens = itens.filter(e => e.importante);
  const antesDaBusca = itens.length;
  const busca = termoDaBusca();
  if (busca) itens = itens.filter(e => anotacaoTem(e, busca));
  itens.sort((a,b) => (b.importante - a.importante) || (b.criadoEm - a.criadoEm));

  h += '</div>';                       // fecha o card dos filtros
  h += '<div class="card"><h2>' + (ui.eSoImportantes ? ESTRELA().titulo : "Todas as anotações") +
       '<span class="dica">' + itens.length + (itens.length === 1 ? " anotação" : " anotações") +
       (busca ? " com “" + esc(ui.eBusca.trim()) + "”" : "") +
       (sel ? " em " + esc(sel.assunto || sel.disciplina) : disc ? " em " + esc(disc) : "") + '</span></h2>';
  /* PESQUISAR (pedido do Pedro, 05/10): só no texto da anotação, dentro do que
     os filtros de cima já escolheram. Parte da palavra vale, e maiúsculas e
     acentos não contam ("funcao" acha "Função"). */
  if (antesDaBusca || busca)
    h += '<div class="campo campo-busca busca-anot"><span class="lupa" aria-hidden="true">⌕</span>' +
      '<input id="eBusca" type="search" aria-label="Pesquisar nas anotações" autocomplete="off" ' +
        'value="' + esc(ui.eBusca) + '" placeholder="Pesquisar nas anotações…"></div>';
  if (!itens.length && busca){
    h += '<div class="vazio"><strong>Nenhuma anotação com “' + esc(ui.eBusca.trim()) + '”</strong>' +
      'Tente outro termo' + (disc || ui.eAssunto || ui.eSoImportantes ? ' ou limpe os filtros de cima' : '') + '.</div>';
  } else if (!itens.length){
    h += '<div class="vazio">' + (sel
      ? '<strong>Nenhuma anotação '+(sel.assunto ? "neste conteúdo" : "solta nesta disciplina")+' ainda</strong>' +
        'Use o botão + acima: escreva o que você quer lembrar sobre isso.'
      : disc
        ? '<strong>Nenhuma anotação nesta disciplina ainda</strong>Escolha um conteúdo dela para começar a anotar.'
        : '<strong>Nenhuma anotação ainda</strong>Use o <b>+ Nova anotação</b> acima — a disciplina e o conteúdo vêm do cadastro (aba Disciplinas).') + '</div>';
  } else {
    // mesmo conteúdo + mesma disciplina (ou a mesma ausência de conteúdo) E MESMO DIA = um card só;
    // dias diferentes ficam em cards separados, mesmo sendo do mesmo conteúdo.
    // Com "juntar tudo" ligado, o dia sai da chave: todo o conteúdo vira um card só,
    // e aí cada anotação passa a mostrar a própria data na linha.
    const cards = new Map();
    itens.forEach(e => {
      const dia = D.iso(new Date(e.criadoEm));
      const k = (ui.eJuntarTudo ? "" : dia + "|") + chaveAssunto(e.disciplina, e.assunto || "");
      if (!cards.has(k)) cards.set(k, { disciplina: e.disciplina, assunto: e.assunto || "",
                                        dia: ui.eJuntarTudo ? "" : dia, itens: [] });
      cards.get(k).itens.push(e);
    });
    const recente = g => Math.max.apply(null, g.itens.map(e => e.criadoEm || 0));
    h += [...cards.values()]
      .sort((a,b) => (b.itens.some(e => e.importante) - a.itens.some(e => e.importante)) || (recente(b) - recente(a)))
      .map(cardConteudo).join("");
  }
  return h + '</div>';
}

/* A PESQUISA DAS ANOTAÇÕES. Compara sem maiúsculas e sem acentos, e sem os
   marcadores de formatação (** e _), que não aparecem na tela. */
const semAcento = t => String(t || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase();
const termoDaBusca = () => semAcento(ui.eBusca.trim());
const anotacaoTem = (e, termo) =>
  semAcento(((e.ensinamento || "") + "\n" + (e.oQueErrei || "")).replace(/\*\*|_/g, "")).includes(termo);
/* Marca o trecho encontrado no texto já desenhado. Anda só pelos nós de texto
   (as tags da formatação ficam intactas) e acha o termo letra a letra, para que
   "funcao" marque "Função" inteira. O rótulo "O que me confundiu:" não conta. */
function realcarBusca(raiz){
  const termo = termoDaBusca(); if (!termo) return;
  raiz.querySelectorAll(".apr-item .aprendizado, .apr-item .detalhe").forEach(bloco => {
    const andador = document.createTreeWalker(bloco, NodeFilter.SHOW_TEXT);
    const nos = [];
    while (andador.nextNode()) nos.push(andador.currentNode);
    nos.forEach(no => {
      if (no.parentNode.matches(".detalhe > b:first-child")) return;
      const texto = no.nodeValue;
      // o texto sem acento, guardando de que letra do original veio cada letra
      let norm = "", origem = [];
      for (let i = 0; i < texto.length; i++){
        const c = semAcento(texto[i]);
        for (let j = 0; j < c.length; j++){ norm += c[j]; origem.push(i); }
      }
      let pos = norm.indexOf(termo); if (pos < 0) return;
      const frag = document.createDocumentFragment();
      let ultimo = 0;
      while (pos >= 0){
        const ini = origem[pos], fim = origem[pos + termo.length - 1] + 1;
        if (ini > ultimo) frag.appendChild(document.createTextNode(texto.slice(ultimo, ini)));
        const m = document.createElement("mark"); m.textContent = texto.slice(ini, fim);
        frag.appendChild(m);
        ultimo = fim;
        pos = norm.indexOf(termo, pos + termo.length);
      }
      if (ultimo < texto.length) frag.appendChild(document.createTextNode(texto.slice(ultimo)));
      no.parentNode.replaceChild(frag, no);
    });
  });
}

/* A ORDEM DENTRO DO CARD. Enquanto ninguém arrastou nada, ela é automática:
   as da véspera em cima, as mais recentes antes. Assim que você arrasta uma, o
   card inteiro ganha `ordem` e passa a ser SEU — a automática não volta a
   mexer nele, senão o que você arrumou se desfaria sozinho na próxima anotação.
   Anotação nova (sem `ordem`) entra depois das que você posicionou. */
function ordemDasAnotacoes(a, b){
  const ao = Number.isFinite(a.ordem) ? a.ordem : null;
  const bo = Number.isFinite(b.ordem) ? b.ordem : null;
  if (ao !== null && bo !== null) return ao - bo;
  if (ao !== null) return -1;
  if (bo !== null) return 1;
  return (b.importante - a.importante) || (b.criadoEm - a.criadoEm);
}

/* Um card por conteúdo (ou pela disciplina, nas anotações sem conteúdo): o
   cabeçalho diz de onde é, e as anotações daquele conteúdo ficam empilhadas
   dentro, cada uma com a cor da sua categoria na borda.                      */
function cardConteudo(g){
  const titulo = g.assunto || g.disciplina;
  const sub    = g.assunto ? g.disciplina : "toda a disciplina";
  const n = g.itens.length;
  const temVespera = g.itens.some(e => e.importante);
  const itens = g.itens.slice().sort(ordemDasAnotacoes);
  // separado por dia, a data aparece UMA vez, no cabeçalho; com "juntar tudo" ela
  // vai para cada linha (o cabeçalho mostra só de quantos dias o card é feito)
  const dias = [...new Set(g.itens.map(e => D.iso(new Date(e.criadoEm))))].sort();
  const juntos = !g.dia;
  const quando = juntos ? dias.length + (dias.length === 1 ? " dia" : " dias")
                        : D.brFull(g.dia);
  /* Minimizar o bloco, como na Agenda por assunto: o nome vira o botão, o bloco
     fica só no cabeçalho (que continua dizendo quantas anotações guarda) e o
     estado vale até fechar a aba (sessionStorage, o mesmo da Agenda). */
  const chave = "anot|" + g.disciplina + "|" + (g.assunto || "") + "|" + (g.dia || "todos");
  const mini = minimizados.has(chave);
  return '<article class="apr'+(temVespera ? " tem-vespera" : "")+(mini ? " minimizado" : "")+'">' +
    '<header class="apr-cab">' +
      '<button class="minimizar" type="button" data-acao="minimizar-anot" data-chave="'+esc(chave)+'" ' +
        'aria-expanded="'+(!mini)+'" title="'+(mini ? "Mostrar as anotações" : "Minimizar este bloco")+'">' +
        '<span class="seta" aria-hidden="true"></span>' +
        '<span class="apr-origem"><b>'+esc(titulo)+'</b><span>'+esc(sub)+'</span></span></button>' +
      '<span class="badge">'+n+(n === 1 ? " anotação" : " anotações")+'</span>' +
      '<span class="meta" title="'+(juntos ? "Dias diferentes reunidos neste card" : "Quando foi anotada")+'">' +
        esc(quando)+'</span>' +
    '</header>' +
    // a edição acontece na tela sobreposta (centrada, com o Salvar sempre à vista);
    // aqui a linha só fica marcada como "em edição"
    (mini ? '' : itens.map(e => linhaAprendizado(e, juntos, ui.editandoErro === e.id)).join("")) +
    '</article>';
}
/** uma anotação dentro do card do conteúdo; com tudo junto, ela mostra a própria data */
function linhaAprendizado(e, comData, editando){
  const c = catDe(e.categoria);
  const pe = [
    c ? '<span class="badge"><span class="ponto" style="background:'+c.cor+'"></span> '+esc(c.nome)+'</span>' : '',
    e.fonte ? '<span class="badge">'+esc(e.fonte)+'</span>' : '',
    e.refeita ? '<span class="badge b-bom">✓ refeita e acertada</span>' : ''
  ].filter(Boolean).join("");
  /* A ALÇA. O item só vira arrastável quando o mouse desce NELA — com o item
     inteiro arrastável não dava para selecionar o texto da anotação. As setas
     ↑↓ do teclado fazem o mesmo. No TOQUE não há arrastar do HTML nem teclado
     de setas: lá a alça some e aparecem os botões ↑ ↓ (setasDeToque). */
  const alca = '<button class="act arrasta" data-acao="mover-anotacao" data-id="'+esc(e.id)+'" ' +
    'title="Arraste para mudar a ordem — ou usa as setas ↑ ↓" ' +
    'aria-label="Mover esta anotação na ordem do card">⠿</button>' + setasDeToque("anotacao", e.id);
  return '<div class="apr-item'+(e.importante ? " marcado" : "")+(editando ? " em-edicao" : "")+'"' +
      (c ? ' style="border-left-color:'+c.cor+'"' : '') + ' data-anotacao="'+esc(e.id)+'"' +
      ' title="Anotada em '+D.brFull(D.iso(new Date(e.criadoEm)))+'">' +
    '<div class="apr-topo">' + alca +
      '<div class="apr-texto">' +
        '<div class="aprendizado">' + (e.ensinamento ? textoFormatado(e.ensinamento)
                                     : '<span style="color:var(--muted)">(sem texto)</span>') + '</div>' +
        (e.oQueErrei ? '<div class="detalhe"><b>O que me confundiu:</b> '+textoFormatado(e.oQueErrei)+'</div>' : '') +
      '</div>' +
      (comData ? '<span class="apr-data">'+D.br(D.iso(new Date(e.criadoEm)))+'</span>' : '') +
      '<button class="act estrela'+(e.importante ? " on" : "")+'" data-acao="erro-estrela" data-id="'+esc(e.id)+'" ' +
        'title="'+(e.importante ? ESTRELA().tirar : ESTRELA().marcar)+'" aria-label="'+esc(e.importante ? ESTRELA().tirar : ESTRELA().marcar)+'" ' +
        'aria-pressed="'+!!e.importante+'">' + (e.importante ? "★" : "☆") + '</button>' +
      '<button class="act" data-acao="editar-erro" data-id="'+esc(e.id)+'">editar</button>' +
    '</div>' +
    (pe ? '<div class="apr-pe">' + pe + '</div>' : '') +
  '</div>';
}

/** Seletor de conteúdo: só o que já existe nas sessões registradas. Não há campo
    livre nem criação de disciplina — o ponto fica sempre preso a um registro. */
/* ONDE A ANOTAÇÃO ENTRA: dois campos em cascata, disciplina e conteúdo.
   Era um seletor só, com "Disciplina · Conteúdo" na mesma linha — e com muitas
   matérias virava uma lista enorme onde se procurava o conteúdo lendo o nome da
   disciplina repetido dezenas de vezes. Separados, o segundo campo só mostra os
   conteúdos DAQUELA disciplina, e a lista encurta sozinha.
   O conteúdo é opcional: "toda a disciplina" é um destino legítimo — nem todo
   ponto importante pertence a um tópico específico. */
const conteudosDaLista = disc => conteudosDisponiveis()
  .filter(a => a.disciplina === disc && a.assunto);

function opcoesConteudoDe(disc, atual){
  return '<option value="">Toda a disciplina</option>' +
    conteudosDaLista(disc).map(a =>
      '<option value="'+esc(a.assunto)+'"'+(a.assunto === atual ? " selected" : "")+'>' +
      esc(rotuloConteudo(a)) + '</option>').join("");
}

function camposAlvoAnotacao(disc, assunto, idDisc){
  const discs = [...new Set(conteudosDisponiveis().map(a => a.disciplina))]
    .sort((a,b) => a.localeCompare(b, "pt-BR"));
  const temDisc = discs.indexOf(disc) >= 0;
  return campo("Disciplina *",
      '<select name="alvoDisciplina" class="sel-alvo-disc"'+(idDisc ? ' id="'+idDisc+'"' : '')+' required>' +
      (temDisc ? "" : '<option value="" selected>Escolha a disciplina…</option>') +
      discs.map(d => '<option value="'+esc(d)+'"'+(d === disc ? " selected" : "")+'>'+esc(d)+'</option>').join("") +
      '</select>') +
    campo("Conteúdo",
      '<select name="alvoConteudo" class="sel-alvo-cont">' +
      (temDisc ? opcoesConteudoDe(disc, assunto) : '<option value="">Toda a disciplina</option>') +
      '</select>', false);
}

/** lê os dois campos e devolve o destino; `null` = falta escolher a disciplina */
function lerAlvoAnotacao(raiz){
  const sd = raiz && raiz.querySelector('[name="alvoDisciplina"]');
  if (!sd || !sd.value) return null;
  const sc = raiz.querySelector('[name="alvoConteudo"]');
  return { disciplina: sd.value, assunto: (sc && sc.value) || "" };
}

/* ---------- texto das anotações ----------
   Formatação leve, no espírito do Markdown: **negrito**, _itálico_, linhas
   começando com "- " viram lista — "-- " e "--- " descem um e dois níveis — e
   a quebra de linha é respeitada. O texto é
   escapado ANTES de qualquer transformação, então nada do que for digitado
   vira HTML — só os marcadores viram tag.                                    */
function textoFormatado(txt){
  if (!txt) return "";
  /* Duas regras evitam que um símbolo comum vire formatação sem querer:
     1. o marcador só vale COLADO no texto — "==isto==" pinta, "a == b" não;
     2. uma barra invertida antes escreve o símbolo cru — "\\==" sai como "==".
     Os trechos escapados saem de cena antes das trocas e voltam no fim, para
     não serem reprocessados. */
  const cru = [];
  const inline = t => {
    let x = esc(t).replace(/\\(\*\*|==|!!|\+\+|@@|_|\*)/g, (m, sinal) => {
      cru.push(sinal); return "\u0001" + (cru.length - 1) + "\u0001";
    });
    return x
      .replace(/\*\*([^\s*]|[^\s*][^*\n]*[^\s*])\*\*/g, "<strong>$1</strong>")
      // *assim* também é negrito, como no WhatsApp — só com espaço (ou pontuação) em volta
      .replace(/(^|[\s(])\*([^\s*]|[^\s*][^*\n]*[^\s*])\*(?=$|[\s.,;:!?)])/g, "$1<strong>$2</strong>")
      .replace(/==([^\s=]|[^\s=][^=\n]*[^\s=])==/g,       '<span class="mk mk-grifo">$1</span>')
      .replace(/!!([^\s!]|[^\s!][^!\n]*[^\s!])!!/g,       '<span class="mk mk-atencao">$1</span>')
      .replace(/\+\+([^\s+]|[^\s+][^+\n]*[^\s+])\+\+/g, '<span class="mk mk-regra">$1</span>')
      .replace(/@@([^\s@]|[^\s@][^@\n]*[^\s@])@@/g,       '<span class="mk mk-ref">$1</span>')
      .replace(/(^|[\s(])_([^_\n]+)_(?=$|[\s.,;:!?)])/g, "$1<em>$2</em>")
      .replace(/\u0001(\d+)\u0001/g, (m, i) => cru[+i]);
  };
  const blocos = [];
  let lista = null, para = [];
  const fecharPara  = () => { if (para.length){ blocos.push("<p>" + para.join("<br>") + "</p>"); para = []; } };
  /* SUBLISTAS: cada item guarda o nível e a árvore sai daqui. Um item nunca
     desce mais de um nível de uma vez — "--- " logo depois de "- " vira
     segundo nível —, senão sobraria um <li> vazio só para segurar o degrau. */
  const fecharLista = () => {
    if (!lista) return;
    let html = "", aberto = 0;
    lista.forEach(({ nivel, conteudo }) => {
      const n = Math.min(nivel, aberto + 1);
      if (n > aberto){ html += "<ul>"; aberto = n; }
      else { html += "</li>"; while (aberto > n){ html += "</ul></li>"; aberto--; } }
      html += "<li>" + conteudo;
    });
    html += "</li>"; while (aberto > 1){ html += "</ul></li>"; aberto--; }
    blocos.push(html + "</ul>"); lista = null;
  };
  String(txt).split(/\r?\n/).forEach(linha => {
    const item = linha.match(/^\s*(-{1,3}|[*•])\s+(.+)$/);
    if (item){
      fecharPara();
      const nivel = item[1][0] === "-" ? item[1].length : 1;
      (lista = lista || []).push({ nivel, conteudo: inline(item[2]) });
      return;
    }
    if (!linha.trim()){ fecharPara(); fecharLista(); return; }      // linha em branco separa blocos
    fecharLista(); para.push(inline(linha));
  });
  fecharPara(); fecharLista();
  return blocos.join("");
}
/* A CAIXA CRESCE COM O TEXTO. Sem isto ela ficava com a altura mínima e o
   texto rolava lá dentro: quem apertava Enter via a linha sumir para cima e
   concluía que a quebra não tinha sido guardada — quando estava. O teto é o
   max-height do CSS; passando dele, aí sim rola.
   scrollHeight é 0 onde não há layout (jsdom), e aí a altura mínima do CSS é
   que vale — por isso o guard. */
function crescerCaixa(ta){
  if (!ta) return;
  ta.style.height = "auto";
  const alt = ta.scrollHeight;
  ta.style.height = alt > 0 ? alt + "px" : "";
}

/** barra de formatação de um textarea (escreve os marcadores por você) */
function barraFormato(alvo, usados){
  const bt = (fmt, rot, titulo, cls) =>
    '<button type="button" class="act'+(cls ? " "+cls : "")+'" data-acao="fmt" data-fmt="'+fmt+'" ' +
    'data-alvo="'+alvo+'" title="'+esc(titulo)+'">'+rot+'</button>';
  const cores = CONFIG.CORES_TEXTO.map(c =>
    bt(c.id, '<span class="amostra" style="background:'+c.cor+'"></span>'+esc(c.rotulo), c.dica, "cor")).join("");
  return '<div class="fmt">' +
    bt("negrito", "<b>B</b>", "Negrito — **texto**") +
    bt("italico", '<i class="fmt-i">I</i>', "Itálico — _texto_ (deixa o texto inclinado)") +
    bt("lista",   "• lista",  "Lista — cada linha começa com \"- \"; \"-- \" e \"--- \" fazem os subníveis") +
    '<span class="sep-fmt"></span>' + cores +
    contadorTexto(alvo, usados) + '</div>';
}
/** quanto já foi escrito na caixa — vira âmbar perto do teto e vermelho no teto */
function contadorTexto(alvo, usados){
  const n = usados || 0, max = CONFIG.MAX_ANOTACAO;
  const tom = n >= max ? " cheio" : n >= max*0.9 ? " perto" : "";
  return '<span class="contador'+tom+'" data-para="'+alvo+'">'+n+' / '+max+'</span>';
}
/* Os botões da barra escrevem MARCA, nunca texto de exemplo: sem seleção eles
   deixam o cursor no lugar de escrever, em vez de plantar palavras ("item",
   "texto", "grifar") que a pessoa teria de apagar. Com seleção, embrulham o
   que está selecionado.                                                      */
function aplicarFormato(id, tipo){
  const ta = document.getElementById(id); if (!ta) return;
  const ini = ta.selectionStart, fim = ta.selectionEnd, sel = ta.value.slice(ini, fim);
  const mudou = () => {            // contador e rascunho salvo acompanham o clique
    ta.focus();
    ta.dispatchEvent(new Event("input", { bubbles: true }));
  };
  const cabe = n => {              // a marca ocupa espaço: respeita o teto em vez de estourar
    if (ta.value.length - sel.length + n <= CONFIG.MAX_ANOTACAO) return true;
    toast("A anotação chegou ao limite de " + CONFIG.MAX_ANOTACAO + " caracteres.");
    ta.focus(); return false;
  };
  if (tipo === "lista"){
    if (sel){                      // cada linha da seleção vira item (as que já são, ficam)
      const texto = sel.split(/\r?\n/)
        .map(l => l.trim() ? (/^\s*(-{1,3}|[*•])\s/.test(l) ? l : "- " + l) : l).join("\n");
      if (!cabe(texto.length)) return;
      ta.setRangeText(texto, ini, fim, "end");
    } else {                       // sem seleção: a LINHA DO CURSOR vira item, e só
      const ini0 = ta.value.lastIndexOf("\n", ini - 1) + 1;
      const quebra = ta.value.indexOf("\n", ini0);
      const linha = ta.value.slice(ini0, quebra < 0 ? ta.value.length : quebra);
      if (/^\s*(-{1,3}|[*•])\s/.test(linha)){ ta.focus(); return; }   // já é item: nada a fazer
      if (!cabe(2)) return;
      ta.setRangeText("- ", ini0, ini0, "end");
      const p = ini + 2;
      ta.setSelectionRange(p, p);                                 // o cursor segue onde estava
    }
  } else {
    const cor = CONFIG.CORES_TEXTO.find(c => c.id === tipo);
    const marca = cor ? cor.marca : tipo === "negrito" ? "**" : "_";
    if (!sel){                     // só as marcas, com o cursor no meio, pronto para escrever
      if (!cabe(marca.length*2)) return;
      ta.setRangeText(marca + marca, ini, fim, "end");
      const p = ini + marca.length;
      ta.setSelectionRange(p, p);
    } else {
      // o marcador só vale colado no texto: espaço da seleção fica do lado de fora
      const partes = sel.match(/^(\s*)([\s\S]*?)(\s*)$/);
      const texto = partes[2];
      if (!texto){ ta.focus(); return; }          // seleção só de espaços: não há o que marcar
      if (!cabe(partes[1].length + texto.length + partes[3].length + marca.length*2)) return;
      ta.setRangeText(partes[1] + marca + texto + marca + partes[3], ini, fim, "end");
    }
  }
  mudou();
}

/** edição dentro do próprio card — é aqui que entram os campos opcionais */
function formEdicaoErro(e){
  // dentro da tela sobreposta o próprio modal é a moldura: nada de caixa dentro de caixa
  /* Nem toda anotação nasce de uma questão: só quando ela nasce é que
     fazem sentido banca, tipo do erro e "refeita e acertada". Por isso esses
     três campos ficam guardados atrás de uma pergunta, que começa em "Não". */
  const daQuestao = !!(e.fonte || e.categoria || e.refeita);
  return '<form id="formEdicaoErro" data-id="'+esc(e.id)+'"><div class="campos">' +
    campo("Anotação", barraFormato("eEnsinamento", (e.ensinamento||"").length) +
          '<textarea id="eEnsinamento" name="ensinamento" class="cresce" ' +
          'maxlength="'+CONFIG.MAX_ANOTACAO+'" ' +
          'placeholder="O que você não quer esquecer disto?">'+esc(e.ensinamento||"")+'</textarea>', true) +
    camposAlvoAnotacao(e.disciplina, e.assunto || "") +
    '<div class="campo largo"><span>Isto apareceu numa questão?</span><div class="opcoes">' +
      '<label class="opcao"><input type="radio" name="daQuestao" value="nao" aria-controls="painelQuestao" ' +
        'aria-expanded="'+(daQuestao ? "true" : "false")+'"'+(daQuestao ? "" : " checked")+'>' +
        '<span>Não — é da matéria</span></label>' +
      '<label class="opcao"><input type="radio" name="daQuestao" value="sim" aria-controls="painelQuestao" ' +
        'aria-expanded="'+(daQuestao ? "true" : "false")+'"'+(daQuestao ? " checked" : "")+'>' +
        '<span>Sim — caiu numa questão <span class="seta">▾</span></span></label>' +
    '</div></div>' +
    '<div class="campo largo painel-questao'+(daQuestao ? " aberto" : "")+'" id="painelQuestao">' +
      '<div class="interno"><div class="campos">' +
        campo("De onde veio — banca, ENEM, vestibular, simulado (opcional)",
              '<input name="fonte" value="'+esc(e.fonte||"")+'" placeholder="ex.: CESPE 2026 Q42 · ENEM 2024 Q135 · simulado 3">', true) +
        campo("Tipo do erro (opcional)", '<select name="categoria"><option value="">— sem classificar —</option>' +
          CONFIG.CATEGORIAS_ERRO.map(c => '<option value="'+esc(c.id)+'"'+(e.categoria===c.id?" selected":"")+'>'+esc(c.nome)+'</option>').join("") + '</select>') +
        campoOpcoes("Situação da questão", [
          { nome: "refeita", marcado: e.refeita, texto: "✓ Refiz depois e acertei" }
        ]) +
      '</div></div>' +
    '</div>' +
    campoOpcoes(ESTRELA().campo, [
      { nome: "importante", marcado: e.importante, texto: ESTRELA().opcao }
    ]) +
    '</div>' +
    '<div class="linha acoes-form"><button class="btn" type="submit">Salvar</button>' +
    '<button class="btn ghost" type="button" data-acao="cancelar-edicao-erro">Cancelar</button>' +
    '<button class="act excluir excluir-tela" type="button" data-acao="excluir-erro" data-id="'+esc(e.id)+'">Excluir</button>' +
    '<span class="erro-form" id="erroEdicao"></span></div></form>';
}

function salvarNovoAprendizado(){
  const ta = document.getElementById("txtNovo"); if (!ta) return;
  const aviso = document.getElementById("erroComposer");
  const sel = document.getElementById("novoConteudo");
  // sem filtro, o destino vem dos dois campos que o próprio compositor mostra
  const alvo = alvoAnotacao() || lerAlvoAnotacao(sel && sel.closest(".compositor"));
  if (!alvo){
    if (aviso) aviso.textContent = "Escolha a disciplina.";
    if (sel){ sel.classList.add("campo-errado"); sel.focus();
              sel.addEventListener("change", () => sel.classList.remove("campo-errado"), { once: true }); }
    toast("Escolha a disciplina para salvar a anotação.");
    return;
  }
  const texto = ta.value.trim().slice(0, CONFIG.MAX_ANOTACAO);
  if (!texto){
    if (aviso) aviso.textContent = "Escreva a anotação.";
    ta.focus(); return;
  }
  salvarErro({ id: uid(), disciplina: alvo.disciplina, assunto: alvo.assunto, fonte: "", oQueErrei: "",
               ensinamento: texto, categoria: "", refeita: false, importante: false, criadoEm: Date.now() });
  ui.alvoAnot = { disciplina: alvo.disciplina, assunto: alvo.assunto || "" };
  ui.rascunhoAnot = "";             // salvou: o rascunho deixa de existir
  ui.foco = "txtNovo";              // o compositor continua aberto para a próxima anotação
  render();
  toast("Anotação salva.");
}

function enviarEdicaoErro(ev){
  ev.preventDefault();
  const f = ev.target, atual = acharErro(f.dataset.id);
  if (!atual) return;
  const d = Object.fromEntries(new FormData(f).entries());
  const aviso = document.getElementById("erroEdicao");
  if (!(d.ensinamento || "").trim()){ aviso.textContent = "Escreva a anotação."; return; }
  const alvo = lerAlvoAnotacao(f);
  if (!alvo){ aviso.textContent = "Escolha a disciplina."; return; }
  const antes = { disciplina: atual.disciplina, assunto: atual.assunto };
  // marcou "não veio de questão": banca, tipo do erro e "refiz" deixam de valer
  const daQuestao = d.daQuestao === "sim";
  salvarErro({ id: atual.id, disciplina: alvo.disciplina, assunto: alvo.assunto,
               fonte: daQuestao ? (d.fonte||"").trim() : "",
               // o campo saiu do formulário: o que foi escrito antes continua guardado
               oQueErrei: (atual.oQueErrei || "").trim(),
               ensinamento: d.ensinamento.trim().slice(0, CONFIG.MAX_ANOTACAO),
               categoria: daQuestao ? (d.categoria || "") : "",
               refeita: daQuestao && !!d.refeita,
               importante: !!d.importante, criadoEm: atual.criadoEm });
  const chaveAlvo = chaveAssunto(alvo.disciplina, alvo.assunto || "");
  if (chaveAssunto(antes.disciplina, antes.assunto || "") !== chaveAlvo){
    ui.eDisciplina = alvo.disciplina;
    ui.eAssunto = alvo.assunto ? chaveAlvo : "";
  }
  ui.editandoErro = null; render(); toast("Anotação atualizada.");
}



/* ---------- TELA: PAINEL (dashboard) ----------
   Clicar numa disciplina (no filtro ou na própria barra) restringe TODOS os
   gráficos a ela; nesse modo as barras passam a mostrar os assuntos dela.   */
function telaPainel(){
  /* Disciplina e, dentro dela, um conteúdo (filtroDiscCont, 25/09). Com o
     conteúdo, entram as sessões que falam dele (e as revisões delas), e as
     revisões avulsas que o citam. */
  const pdc   = filtroDiscCont("p", { discs: disciplinas(),
    itens: db.registros.flatMap(r => assuntosDe(r).map(a => ({ disciplina: r.disciplina, nome: a }))) });
  const cont  = pdc.cont;
  const disc  = pdc.disc || (cont ? discDaChave(cont) : "");
  const nomeCont = cont ? (conteudosCad().find(c => chaveDaFicha(c) === cont) || {}).nome ||
                          cont.split("|").slice(1).join("|") : "";
  const regs  = disc ? db.registros.filter(r => r.disciplina === disc && (!cont || temAssunto(r, cont))) : db.registros;
  const ids   = new Set(regs.map(r => r.id));
  const revs  = disc ? db.revisoes.filter(r => (r.registroId && ids.has(r.registroId)) ||
                                               (!r.registroId && r.disciplina === disc &&
                                                (!cont || (r.assuntos || []).some(a => chaveAssunto(disc, a) === cont))))
                     : db.revisoes;
  const feitas = revs.filter(r => r.feita);

  const soma = (lista, campo) => lista.reduce((t,x) => t + (x[campo]||0), 0);
  const lancs = (db.lancamentos || []).filter(l => ids.has(l.registroId) || (!disc && acharRegistro(l.registroId)));
  const totQ = soma(regs, "questoes") + soma(feitas, "questoes") + soma(lancs, "questoes");
  const totA = soma(regs, "acertos")  + soma(feitas, "acertos")  + soma(lancs, "acertos");
  // --- últimos 7 dias (inclui hoje)
  const inicioSemana = D.soma(D.hoje(), -6);
  const naSemana = dia => dia >= inicioSemana && dia <= D.hoje();
  let minSemana = 0;
  for (let i = 0; i < 7; i++) minSemana += minutosDoDia(D.soma(inicioSemana, i), regs, revs);
  const regsSemana = regs.filter(r => naSemana(r.data));
  const revsSemana = feitas.filter(r => naSemana(r.feitaEm || r.data));
  const lancsSemana = lancs.filter(l => naSemana(l.data));
  const qSemana = soma(regsSemana, "questoes") + soma(revsSemana, "questoes") + soma(lancsSemana, "questoes");
  const aSemana = soma(regsSemana, "acertos")  + soma(revsSemana, "acertos")  + soma(lancsSemana, "acertos");
  const revsComTempo = revs.filter(r => (r.minutos||0) > 0);
  const totMin = soma(regs, "minutos") + soma(revs, "minutos");     // revisão também é tempo de estudo
  const min = minutosDoDia(D.hoje(), regs, revs), meta = db.metaDiariaMin || 1;
  const perc = Math.min(100, Math.round((min/meta)*100));
  const nFeitas = feitas.length;
  const naAgenda = revs.filter(r => !itemEmSilencio(r));      // em silêncio não conta como pendente
  const nAtras  = naAgenda.filter(r => statusRevisao(r) === "atrasada").length;
  const nPend   = naAgenda.length - nFeitas;
  const escopo  = cont ? "apenas " + nomeCont + " (" + disc + ")" : disc ? "apenas " + disc : "todas as disciplinas";
  /* Dia escolhido no calendário: filtra os gráficos e o card de revisões. Ficam
     de fora, de propósito, os números que só fazem sentido no acumulado —
     semana, sequência e acerto geral. */
  const diaSel = ui.diaSel;
  const regsDia = diaSel ? regs.filter(r => r.data === diaSel) : regs;
  const revsDia = diaSel ? revs.filter(r => r.feita && (r.feitaEm || r.data) === diaSel) : revs;
  const minDia  = minutosDoDia(diaSel || D.hoje(), regs, revs);
  const percDia = Math.min(100, Math.round((minDia/meta)*100));
  const escopoDia = diaSel ? esc(escopo) + " · " + D.brFull(diaSel) : esc(escopo);
  const avisoDia = diaSel
    ? '<div class="linha" style="margin-bottom:12px"><span class="marca-filtro">dia ' + D.brFull(diaSel) + '</span>' +
      '<span class="hl-tema">os gráficos abaixo mostram só o dia selecionado</span>' +
      '<span class="spacer"></span><button class="btn mini ghost" data-acao="sel-dia" data-dia="'+diaSel+'">Ver todos os dias</button></div>'
    : '';

  // ----- filtro de disciplina e conteúdo, o mesmo das outras abas (acima dos gráficos)
  let h = '<div class="filtros"><div class="filtros-campos">' + pdc.html + '</div>' +
    (disc ? '<div class="filtros-acoes"><span class="marca-filtro">filtro ativo</span><span class="spacer"></span>' +
            '<button class="btn mini ghost" data-acao="limpar-filtro-painel">limpar filtros</button></div>' : '') +
  '</div>';

  h += '<div class="tiles" style="margin-bottom:16px">' +
    tile(diaSel ? D.br(diaSel) : "Hoje", hhmm(minDia),
         "meta "+hhmm(meta)+" · "+percDia+"%",
         '<div class="barra"><i class="'+(percDia>=100?"cheia":"")+'" style="width:'+percDia+'%"></i></div>',
         percDia >= 100 ? "bom" : "accent") +
    tile("Estudo na semana", hhmm(minSemana), "últimos 7 dias · " + hhmm(totMin) + " no total") +
    tile("Questões da semana", String(qSemana),
         aSemana + " acertos" + (pct(aSemana, qSemana) === null ? "" : " · " + pct(aSemana, qSemana) + "%")) +
    tile("% de acerto geral", pct(totA, totQ) === null ? "—" : pct(totA, totQ)+"%", totQ + " questões · " + escopo,
         "", tomTaxa(pct(totA, totQ))) +
    tile("Sequência", (x => x + (x === 1 ? " dia" : " dias"))(sequenciaDias(regs, revs)), disc ? "dias seguidos nesta disciplina" : "dias seguidos") +
  '</div>';

  h += '<div class="card"><h2>Calendário de estudos</h2>' +
       '<figure>' + (disc ? '<figcaption>'+esc(escopo)+'.</figcaption>' : '') +
       '<div class="heat-grid">' + calendario(regs, revs) + painelDoDia(regs, revs) + '</div></figure></div>';

  const titulo = disc ? "por assunto" : "por disciplina";
  h += avisoDia + '<div class="grid g2">' +
       '<div class="card"><h2>% de acerto '+titulo+'</h2>' +
         '<p class="sub">'+escopoDia+(disc ? '' : ' · clique numa barra para ver só aquela disciplina')+'</p>' +
         barrasGrupo("taxa", regsDia, revsDia, disc, !!diaSel) + '</div>' +
       '<div class="card"><h2>Tempo de estudo '+titulo+'</h2>' +
         '<p class="sub">'+escopoDia+'</p>' +
         barrasGrupo("tempo", regsDia, revsDia, disc, !!diaSel) + '</div>' +
       '</div>';

  /* --- Evolução do % de acerto: fora da aba por enquanto, a pedido. ---------
     A função linhaEvolucao() continua inteira logo abaixo; para trazer o card
     de volta, basta descomentar a linha marcada aqui dentro.                  */
  h += '<div class="grid g2">' +
       // '<div class="card"><h2>Evolução do % de acerto</h2><p class="sub">'+esc(escopo)+
       //   (diaSel ? ' · <b>'+D.br(diaSel)+'</b> em destaque' : '')+'</p>' + linhaEvolucao(regs, revs, diaSel) + '</div>' +
       /* A AGENDA É O RETRATO DE AGORA: pendentes e atrasadas não são "do dia".
          Antes o card dizia "Feitas no dia 0" ao lado de uma barra com "concluídas 1"
          (o total) — dois escopos no mesmo card. O que foi feito no dia escolhido
          está no painel do dia, no calendário. */
       '<div class="card"><h2>Agenda</h2><p class="sub">'+esc(escopo)+' · situação de hoje</p>' +
         '<div class="tiles t3">' +
           tile("✓ Concluídas", String(nFeitas), "", "", nFeitas ? "bom" : "") +
           tile("⏳ Pendentes", String(nPend), semProva() ? "sem prazo" : "até " + D.brFull(ultimoDiaRevisao()), "", nPend ? "accent" : "") +
           tile("⚠ Atrasados", String(nAtras), nAtras ? "prioridade máxima" : "nada atrasado", "", nAtras ? "critico" : "bom") +
         '</div>' + barraRevisoes(nFeitas, nPend - nAtras, nAtras) +
       '</div></div>';

  return h;
}

/* As BATERIAS AVULSAS também são questões. O Progresso as deixava de fora das
   barras e do painel do dia, enquanto a aba Questões e o "% de acerto geral"
   as contavam — a mesma disciplina aparecia com duas taxas. A bateria conta no
   dia em que foi feita (l.data), não no da sessão a que está ligada. */
function lancsNoEscopo(disc, dia){
  return (db.lancamentos || []).map(l => ({ l, reg: acharRegistro(l.registroId) }))
    .filter(x => x.reg && (!disc || x.reg.disciplina === disc) && (!dia || x.l.data === dia));
}
/** barras por disciplina; com uma disciplina filtrada, por assunto dela */
function barrasGrupo(modo, regs, revs, disc, porDia){
  const lancs = modo === "taxa" ? lancsNoEscopo(disc, porDia ? ui.diaSel : "") : [];
  const nomes = disc ? [...new Set(regs.concat(lancs.map(x => x.reg)).flatMap(r => assuntosDe(r)))]
                     : disciplinas().filter(d => regs.some(r => r.disciplina === d) ||
                                                 lancs.some(x => x.reg.disciplina === d));
  const dados = nomes.map(nome => {
    if (disc && !porDia){                        // drill-down: crédito rateado entre os assuntos da sessão
      const e = estatAssunto(disc, nome);
      return { nome, q: e.questoes, valor: modo === "taxa" ? e.taxa : e.minutos,
               rot: modo === "taxa" ? (e.taxa === null ? "—" : e.taxa+"%") : hhmm(e.minutos),
               cor: COR_BARRAS };
    }
    if (disc){                                   // com um dia escolhido, conta só o que caiu nele
      const rs = regs.filter(r => assuntosDe(r).includes(nome));
      const n = r => assuntosDe(r).length || 1;
      const ls = lancs.filter(x => assuntosDe(x.reg).includes(nome));
      const q = rs.reduce((t,r)=>t+(r.questoes||0)/n(r),0) + ls.reduce((t,x)=>t+(x.l.questoes||0)/n(x.reg),0);
      const a = rs.reduce((t,r)=>t+(r.acertos||0)/n(r),0)  + ls.reduce((t,x)=>t+(x.l.acertos||0)/n(x.reg),0);
      const min = rs.reduce((t,r)=>t+(r.minutos||0)/n(r),0);
      return { nome, q: Math.round(q), valor: modo === "taxa" ? pct(a,q) : Math.round(min),
               rot: modo === "taxa" ? (pct(a,q) === null ? "—" : pct(a,q)+"%") : hhmm(Math.round(min)),
               cor: COR_BARRAS };
    }
    const rs = regs.filter(r => r.disciplina === nome);
    const idsr = new Set(rs.map(r => r.id));
    const rvTodas = revs.filter(r => idsr.has(r.registroId));
    const rv = rvTodas.filter(r => r.feita);
    const ls = lancs.filter(x => x.reg.disciplina === nome);
    const q = rs.reduce((t,r)=>t+(r.questoes||0),0) + rv.reduce((t,r)=>t+(r.questoes||0),0) +
              ls.reduce((t,x)=>t+(x.l.questoes||0),0);
    const a = rs.reduce((t,r)=>t+(r.acertos||0),0)  + rv.reduce((t,r)=>t+(r.acertos||0),0) +
              ls.reduce((t,x)=>t+(x.l.acertos||0),0);
    const min = rs.reduce((t,r)=>t+(r.minutos||0),0) + rvTodas.reduce((t,r)=>t+(r.minutos||0),0);
    return { nome, q, valor: modo === "taxa" ? pct(a,q) : min,
             rot: modo === "taxa" ? (pct(a,q) === null ? "—" : pct(a,q)+"%") : hhmm(min),
             cor: COR_BARRAS };
  }).filter(x => modo === "taxa" ? x.q > 0 : x.valor > 0);

  if (!dados.length) return '<div class="vazio">Sem dados suficientes ainda.</div>';
  dados.sort((a,b) => (b.valor||0) - (a.valor||0));
  const max = modo === "taxa" ? 100 : Math.max(...dados.map(x => x.valor));
  const alturaLinha = 30, larg = 340, rotLarg = 124, barraLarg = larg - rotLarg - 48;
  const barra = (x,y,w,h,r) => { const rr = Math.min(r, w);
    return "M"+x+" "+y+"h"+(w-rr)+"a"+rr+" "+rr+" 0 0 1 "+rr+" "+rr+"v"+(h-2*rr)+
           "a"+rr+" "+rr+" 0 0 1 "+(-rr)+" "+rr+"H"+x+"z"; };
  const alt = dados.length * alturaLinha + 6;
  const corpo = dados.map((x,i) => {
    const y = i*alturaLinha + 4, w = Math.max(3, Math.round((x.valor/max) * barraLarg));
    const nome = x.nome.length > 18 ? x.nome.slice(0,17)+"…" : x.nome;
    const clicavel = !disc ? ' data-acao="filtrar-disc" data-disc="'+esc(x.nome)+'" style="cursor:pointer"' : '';
    return '<g'+clicavel+'>' +
      '<rect x="0" y="'+y+'" width="'+larg+'" height="18" fill="transparent"><title>'+esc(x.nome+" — "+x.rot+(clicavel?" (clique para filtrar)":""))+'</title></rect>' +
      '<text x="0" y="'+(y+15)+'" font-size="12" fill="var(--text-2)">'+esc(nome)+'</text>' +
      '<path d="'+barra(rotLarg, y, w, 18, 4)+'" fill="'+x.cor+'"/>' +
      '<text x="'+(rotLarg+w+7)+'" y="'+(y+14)+'" font-size="12" fill="var(--text-2)" class="num">'+esc(x.rot)+'</text></g>';
  }).join("");
  return '<svg viewBox="0 0 '+larg+' '+alt+'" width="100%" role="img" aria-label="Barras">'+corpo+'</svg>';
}
/** cor de série estável por disciplina (ordem fixa, nunca cíclica; da 7ª em diante, neutra) */
/* AS DISCIPLINAS NÃO TÊM COR. Tinham seis cores, e da sétima em diante todas
   ficavam cinza — não há paleta que separe dez ou vinte disciplinas a olho, e
   inventar cores novas as deixaria parecidas demais. A cor também não fazia
   falta: nas barras o nome vem escrito ao lado, e no filtro está no próprio
   botão. Uma cor só para as barras (uma série, uma cor). */
const COR_BARRAS = "var(--s1)";

/* Calendário no formato de sempre: um mês por vez, semana começando no domingo,
   o número do dia dentro de um círculo. O tom do círculo é quanto você estudou
   naquele dia; o pontinho embaixo diz que há revisão marcada. Clicar escolhe o
   dia e filtra o painel.                                                      */
function calendario(regs, revs){
  const hoje = D.hoje();
  const mes = ui.mesCal || (ui.diaSel || hoje).slice(0,7);
  const [ano, m] = mes.split("-").map(Number);
  const primeiro = mes + "-01";
  const diasNoMes = new Date(ano, m, 0).getDate();
  const inicio = D.soma(primeiro, -D.parse(primeiro).getDay());   // volta até o domingo
  const meta = db.metaDiariaMin || 1;
  const nomeMes = ["janeiro","fevereiro","março","abril","maio","junho",
                   "julho","agosto","setembro","outubro","novembro","dezembro"][m-1];

  // revisões por dia, para o pontinho
  const revPorDia = new Map();
  revisoesDetalhadas().forEach(x => {
    const d = x.rev.feita ? (x.rev.feitaEm || x.rev.data) : x.rev.data;
    const atual = revPorDia.get(d) || { pendente: 0, feita: 0, atrasada: 0 };
    if (x.rev.feita) atual.feita++; else if (x.status === "atrasada") atual.atrasada++; else atual.pendente++;
    revPorDia.set(d, atual);
  });

  let celulas = "";
  for (let i = 0; i < 42; i++){
    const data = D.soma(inicio, i);
    if (i >= 35 && data.slice(0,7) !== mes) break;          // sexta linha só quando o mês precisa
    const doMes = data.slice(0,7) === mes;
    const min = minutosDoDia(data, regs, revs);
    const r = min / meta;
    const tom = !min ? "" : r < 0.34 ? "var(--seq1)" : r < 0.67 ? "var(--seq2)" : r < 1 ? "var(--seq3)" : "var(--seq4)";
    const sel = data === ui.diaSel, eHoje = data === hoje, prova = diaDeProva(data);
    const rv = revPorDia.get(data);
    const ponto = rv ? (rv.atrasada ? "var(--critico)" : rv.pendente ? "var(--accent-forte)" : "var(--bom)") : "";
    const titulo = D.extenso(data) + " — " + (min ? hhmm(min) : "sem estudo") +
      (rv ? " · " + (rv.atrasada ? plural(rv.atrasada, "atrasado", "atrasados") : rv.pendente ? plural(rv.pendente, "item", "itens") + " na agenda" : plural(rv.feita, "feito", "feitos")) : "") +
      (prova ? " · PROVA" : "");
    celulas += '<button class="cal-dia' + (doMes ? "" : " fora") + (eHoje ? " hoje" : "") +
      (prova ? " prova" : "") + (sel ? " sel" : "") + '" data-acao="sel-dia" data-dia="' + data + '"' +
      (tom && !sel ? ' style="background:' + tom + '"' : '') +
      ' title="' + esc(titulo) + '">' + Number(data.slice(8)) +
      (ponto ? '<span class="pt" style="background:' + ponto + '"></span>' : '') + '</button>';
  }

  const semana = ["dom","seg","ter","qua","qui","sex","sáb"]
    .map(n => '<span>' + n + '</span>').join("");
  return '<div class="cal">' +
    '<div class="cal-cab">' +
      '<b>' + nomeMes + ' ' + ano + '</b>' +
      (mes === hoje.slice(0,7) ? '' : '<button class="act" data-acao="cal-hoje">hoje</button>') +
      '<button class="cal-nav" data-acao="cal-mes" data-delta="-1" aria-label="Mês anterior">‹</button>' +
      '<button class="cal-nav" data-acao="cal-mes" data-delta="1" aria-label="Próximo mês">›</button>' +
    '</div>' +
    '<div class="cal-semana">' + semana + '</div>' +
    '<div class="cal-dias">' + celulas + '</div>' +
    '<div class="legenda" style="margin-top:12px">' +
      '<span>menos</span>' +
      ["var(--seq0)","var(--seq1)","var(--seq2)","var(--seq3)","var(--seq4)"].map(c =>
        '<span class="ponto" style="background:'+c+';border:1px solid var(--border);width:12px;height:12px;border-radius:4px"></span>').join("") +
      '<span>mais</span>' +
      '<span style="margin-left:8px"><span class="pt-legenda" style="background:var(--accent-forte)"></span> revisão marcada</span>' +
      '<span><span class="pt-legenda" style="background:var(--critico)"></span> atrasada</span>' +
    '</div></div>';
}

/** o que foi estudado num dia: sessões, revisões, tempo e questões */
/* Cada medição do cronômetro vira um bloco. Mostrar só "primeiro início →
   último fim" mentia: duas medições de 11-13 e 15-18 apareciam como 11-18.
   Aqui sai a lista real dos intervalos, com a data quando o bloco é de outro
   dia (dá para cronometrar hoje e somar numa sessão de ontem).             */
function intervalosDe(item){
  const blocos = (item.blocos || []).filter(b => b && b.inicio);
  if (blocos.length) return blocos.slice()
    .sort((a,b) => (a.data+a.inicio).localeCompare(b.data+b.inicio))
    .map(b => ({ data: b.data, rotulo: (b.data && b.data !== item.data ? D.br(b.data) + " " : "") +
                                       b.inicio + "–" + (b.fim || "") +
                                       (b.viradas ? " (+" + b.viradas + ")" : "") }));
  return item.inicio ? [{ data: item.data, rotulo: item.inicio + "–" + (item.fim || "") }] : [];
}
/** todos os intervalos, para o title (onde cabe a lista inteira) */
function intervaloCompleto(item){
  const lista = intervalosDe(item);
  if (!lista.length) return "";
  return lista.length + (lista.length === 1 ? " medição: " : " medições do cronômetro: ") +
         lista.map(x => x.rotulo).join(" · ");
}
/** os intervalos em texto curto; acima de `teto` resume o excedente */
function textoIntervalos(item, teto){
  const lista = intervalosDe(item);
  if (!lista.length) return "";
  const max = teto || 3;
  const mostra = lista.slice(0, max).map(x => x.rotulo).join(" · ");
  return lista.length > max ? mostra + " +" + (lista.length - max) : mostra;
}

function detalhesDoDia(dia, regs, revs){
  const itens = [];
  regs.forEach(r => {
    const min = minutosNoDia(r, dia, r.data);
    const doDia = r.data === dia;
    if (!min && !doDia) return;
    const faixas = intervalosDe(r).filter(x => x.data === dia).map(x => x.rotulo.replace(/^\d\d\/\d\d /, ""));
    itens.push({ tipo: tipoDaSessao(r).curto, rotulo: rotuloAssuntos(r), disciplina: r.disciplina, minutos: min,
                 questoes: doDia ? (r.questoes||0) : 0, acertos: doDia ? (r.acertos||0) : 0,
                 extra: faixas.join(" · ") });
  });
  revs.forEach(rv => {
    if (rv.sessaoId) return;            // já aparece como a sessão que a cumpriu
    const base = rv.feita ? (rv.feitaEm || rv.data) : null;
    const min = minutosNoDia(rv, dia, base);
    const doDia = base === dia;
    if (!min && !doDia) return;
    const ctx = contextoRevisao(rv);
    if (!ctx) return;
    const faixasRev = intervalosDe(rv).filter(x => x.data === dia).map(x => x.rotulo.replace(/^\d\d\/\d\d /, ""));
    itens.push({ tipo: "revisão", rotulo: ctx.rotulo, disciplina: ctx.disciplina, minutos: min,
                 questoes: doDia ? (rv.questoes||0) : 0, acertos: doDia ? (rv.acertos||0) : 0,
                 extra: [atividadeDe(rv) ? atividadeDe(rv).nome : "", faixasRev.join(" · ")].filter(Boolean).join(" · ") });
  });
  // baterias avulsas feitas neste dia, das sessões que estão no escopo
  const ids = new Set(regs.map(r => r.id));
  (db.lancamentos || []).forEach(l => {
    if (l.data !== dia || !ids.has(l.registroId)) return;
    const reg = acharRegistro(l.registroId);
    itens.push({ tipo: "questões", rotulo: rotuloAssuntos(reg), disciplina: reg.disciplina, minutos: 0,
                 questoes: l.questoes || 0, acertos: l.acertos || 0, extra: "bateria avulsa" });
  });
  const minutos = itens.reduce((t,x) => t + x.minutos, 0);
  const questoes = itens.reduce((t,x) => t + x.questoes, 0);
  const acertos  = itens.reduce((t,x) => t + x.acertos, 0);
  return { itens, minutos, questoes, acertos };
}

function painelDoDia(regs, revs){
  const dia = ui.diaSel;
  if (!dia){
    return '<div class="dia-info vazia">' +
      '<span class="dia-rot">Nenhum dia escolhido</span>' +
      '<p class="dia-vazio">Clique num dia do calendário para ver o que você estudou nele — e para a ' +
      'aba inteira passar a mostrar só aquele dia.</p></div>';
  }
  const det = detalhesDoDia(dia, regs, revs);
  const meta = db.metaDiariaMin || 1;
  const perc = Math.min(100, Math.round((det.minutos/meta)*100));
  const taxa = pct(det.acertos, det.questoes);
  const revsDia = det.itens.filter(x => x.tipo === "revisão").length;
  const eHoje = dia === D.hoje();

  let h = '<div class="dia-info">' +
    '<div class="dia-cab">' +
      '<div><span class="dia-rot">' + esc(D.semana(dia)) + (eHoje ? ' · hoje' : '') + '</span>' +
      '<b>' + D.brFull(dia) + '</b></div>' +
      '<button class="act" data-acao="sel-dia" data-dia="'+dia+'" title="Voltar a ver todos os dias">limpar ✕</button>' +
    '</div>' +
    '<div class="dia-numeros">' +
      '<div><span>Tempo</span><b>'+hhmm(det.minutos)+'</b></div>' +
      '<div><span>Questões</span><b>'+det.questoes+'</b></div>' +
      '<div><span>Acerto</span><b class="'+(taxa === null ? "" : "t-"+tomTaxa(taxa))+'">' +
        (taxa === null ? "—" : taxa+"%")+'</b></div>' +
    '</div>' +
    '<div class="dia-meta">' +
      '<div class="barra" style="margin:0"><i class="'+(perc>=100?"cheia":"")+'" style="width:'+perc+'%"></i></div>' +
      '<span>'+perc+'% da meta de '+hhmm(meta)+'</span>' +
    '</div>';

  if (!det.itens.length){
    h += '<p class="dia-vazio">Nada registrado neste dia.</p>';
  } else {
    h += '<div class="dia-rot" style="margin-top:14px">' + det.itens.length +
      (det.itens.length === 1 ? " registro" : " registros") +
      (revsDia ? ' · ' + revsDia + (revsDia === 1 ? " item da agenda" : " itens da agenda") : "") + '</div>' +
      '<ul class="dia-lista">' + det.itens
      .sort((a,b) => b.minutos - a.minutos)
      .map(x => '<li class="'+(x.tipo === "revisão" ? "rev" : "")+'">' +
        '<div class="linha" style="gap:6px"><b>'+esc(x.rotulo)+'</b>' +
          '<span class="badge'+(x.tipo === "revisão" ? " b-alerta" : "")+'">'+esc(x.tipo)+'</span>' +
          (x.minutos ? '<span class="spacer"></span><span class="dia-tempo num">'+hhmm(x.minutos)+'</span>' : '') +
        '</div>' +
        '<span>'+esc(x.disciplina)+(x.questoes ? ' · '+x.acertos+'/'+x.questoes+' questões' : '') +
        (x.extra ? ' · '+esc(x.extra) : '')+'</span></li>').join("") + '</ul>';
  }
  return h + '</div>';
}


function linhaEvolucao(regs, revs, diaSel){
  const porDia = new Map();
  const add = (data, q, a) => { if (!q) return;
    const o = porDia.get(data) || { q:0, a:0 }; o.q += q; o.a += a || 0; porDia.set(data, o); };
  regs.forEach(r => add(r.data, r.questoes||0, r.acertos||0));
  revs.filter(r => r.feita && r.questoes).forEach(r => add(r.feitaEm || r.data, r.questoes, r.acertos||0));
  const pontos = [...porDia.entries()].sort((a,b) => a[0].localeCompare(b[0]))
    .map(([data,o]) => ({ data, taxa: pct(o.a, o.q), q: o.q }));

  if (pontos.length < 2){
    return '<div class="vazio">' + (pontos.length
      ? 'Um dia com questões até agora (' + pontos[0].taxa + '% em ' + D.br(pontos[0].data) + ').<br>Registre mais dias para ver a evolução.'
      : 'Registre questões para acompanhar sua evolução.') + '</div>';
  }
  const larg = 340, alt = 150, ml = 30, mr = 12, mt = 10, mb = 22;
  const px = i => ml + (i/(pontos.length-1)) * (larg-ml-mr);
  const py = t => mt + (1 - t/100) * (alt-mt-mb);
  const linha = pontos.map((p,i) => (i?"L":"M") + px(i).toFixed(1) + " " + py(p.taxa).toFixed(1)).join(" ");
  const grade = [0,50,100].map(t => '<line x1="'+ml+'" y1="'+py(t)+'" x2="'+(larg-mr)+'" y2="'+py(t)+'" stroke="var(--grade)" stroke-width="1"/>' +
    '<text x="0" y="'+(py(t)+4)+'" font-size="10" fill="var(--muted)">'+t+'%</text>').join("");
  const marcas = pontos.map((p,i) => {
    const destaque = diaSel && p.data === diaSel;   // o dia escolhido no calendário
    return (destaque ? '<line x1="'+px(i).toFixed(1)+'" y1="'+mt+'" x2="'+px(i).toFixed(1)+'" y2="'+(alt-mb)+
              '" stroke="var(--accent)" stroke-width="1.5" stroke-dasharray="3 3"/>' : '') +
      '<circle cx="'+px(i).toFixed(1)+'" cy="'+py(p.taxa).toFixed(1)+'" r="'+(destaque?7:4.5)+'" ' +
      'fill="'+(destaque?"var(--accent-forte)":"var(--s1)")+'" stroke="var(--surface)" stroke-width="2">' +
      '<title>'+esc(D.extenso(p.data)+" — "+p.taxa+"% ("+p.q+" questões)")+'</title></circle>';
  }).join("");
  const ultimo = pontos[pontos.length-1];
  const rotulos = '<text x="'+ml+'" y="'+(alt-6)+'" font-size="10" fill="var(--muted)">'+D.br(pontos[0].data)+'</text>' +
    '<text x="'+(larg-mr)+'" y="'+(alt-6)+'" font-size="10" fill="var(--muted)" text-anchor="end">'+D.br(ultimo.data)+'</text>' +
    '<text x="'+(px(pontos.length-1)).toFixed(1)+'" y="'+(py(ultimo.taxa)-13).toFixed(1)+'" font-size="11.5" fill="var(--text-2)" ' +
    'text-anchor="end" stroke="var(--surface)" stroke-width="3.5" paint-order="stroke" class="num">'+ultimo.taxa+'%</text>';
  return '<svg viewBox="0 0 '+larg+' '+alt+'" width="100%" role="img" aria-label="Evolução do percentual de acerto">' +
    grade + '<path d="'+linha+'" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>' +
    marcas + rotulos + '</svg>';
}

function barraRevisoes(feitas, pendentes, atrasadas){
  const total = feitas + pendentes + atrasadas;
  if (!total) return '<div class="vazio" style="margin-top:12px">Nenhuma revisão agendada.</div>';
  const larg = 340, h = 16;
  let x = 0, corpo = "";
  [["var(--bom)", feitas, "concluídas"], ["var(--s1)", pendentes, "pendentes"], ["var(--critico)", atrasadas, "atrasadas"]]
    .forEach(([cor, v, nome]) => {
      if (!v) return;
      const w = (v/total)*larg;
      corpo += '<rect x="'+x.toFixed(1)+'" y="0" width="'+Math.max(0, w-2).toFixed(1)+'" height="'+h+'" rx="4" fill="'+cor+'">' +
               '<title>'+v+' '+nome+'</title></rect>';
      x += w;
    });
  return '<svg viewBox="0 0 '+larg+' '+h+'" width="100%" height="16" style="margin-top:12px" role="img" aria-label="Distribuição das revisões">'+corpo+'</svg>' +
    '<div class="legenda">' +
      '<span><span class="ponto" style="background:var(--bom)"></span> ✓ concluídas '+feitas+'</span>' +
      '<span><span class="ponto" style="background:var(--s1)"></span> ⏳ pendentes '+pendentes+'</span>' +
      '<span><span class="ponto" style="background:var(--critico)"></span> ⚠ atrasadas '+atrasadas+'</span></div>';
}

/* ==========================================================================
   6. AÇÕES / EVENTOS
   ========================================================================== */
async function enviarRegistro(ev){
  ev.preventDefault();
  const f = ev.target, dado = Object.fromEntries(new FormData(f).entries());
  const anteriorId = ui.editandoRegistro || "";
  const divisao = !anteriorId && ui.prefill && ui.prefill.divisao ? ui.prefill.divisao : null;
  const erro = $("#erroForm");
  const num = v => v === "" || v === undefined ? 0 : Math.max(0, Number(v) || 0);
  const questoes = num(dado.questoes), acertos = num(dado.acertos);
  const tipo = TIPOS_SESSAO[dado.tipo] ? dado.tipo : "estudo";
  const anterior0 = anteriorId ? acharRegistro(anteriorId) : null;
  const revAlvo = acharRevisao(dado.revisaoAlvo || "");   // qualquer tipo pode cumprir
  const ctxRev = revAlvo ? contextoRevisao(revAlvo) : null;
  if (ehTipoRevisao(tipo) && !revAlvo){
    erro.textContent = "Escolha qual revisão esta sessão cumpre (ou registre como estudo)."; return;
  }
  // estudo/revisão nasceu de uma revisão: não dá para virar só estudo
  if (anterior0 && anterior0.tipo === "misto" && tipo === "estudo"){
    erro.textContent = "Uma sessão de estudo/revisão só pode voltar a ser revisão — ela cumpre uma revisão marcada."; return;
  }
  const herda = ehTipoRevisao(tipo) && ctxRev;      // revisão de verdade: conteúdo travado
  const listaAssuntos = herda ? ctxRev.assuntos.slice() : lerAssuntosForm(f);
  // "Estudar junto": o conteúdo de cada item marcado entra na sessão (na revisão, é o único jeito de entrar)
  const juntarIds = [...f.querySelectorAll('input[name="juntar"]:checked')].map(i => i.value);
  juntarIds.forEach(id => {
    const r = acharRevisao(id), c = r && contextoRevisao(r);
    if (c) c.assuntos.forEach(a => { if (!listaAssuntos.some(x => x.toLowerCase() === a.toLowerCase())) listaAssuntos.push(a); });
  });
  const disciplina = herda ? ctxRev.disciplina : lerDisciplina(f);
  if (!disciplina){ erro.textContent = "Escolha a disciplina (ou crie uma nova)."; return; }
  // editando, a sessão escolheu um card de hoje para cumprir: só hoje com hoje, e o conteúdo dele entra
  if (revAlvo && anterior0 && ligaNaEdicao({ tipo }, anterior0)){
    if (anterior0.data !== D.hoje() || dado.data !== D.hoje() || revAlvo.data !== D.hoje()){
      erro.textContent = "Só uma sessão de hoje pode cumprir um card, e só um card de hoje."; return;
    }
    if (ctxRev.disciplina !== disciplina){
      erro.textContent = "O card é de " + ctxRev.disciplina + " — a sessão precisa ser da mesma disciplina."; return;
    }
    ctxRev.assuntos.forEach(a => { if (!listaAssuntos.some(x => x.toLowerCase() === a.toLowerCase())) listaAssuntos.push(a); });
  }
  if (!listaAssuntos.length){ erro.textContent = "Adicione ao menos um assunto."; return; }
  if (!ehTipoRevisao(tipo) && sessaoDeConcluido({ disciplina, assuntos: listaAssuntos, data: dado.data }, anterior0)){
    erro.textContent = "Conteúdo concluído se registra como revisão — para estudar de novo, reabra o conteúdo."; return;
  }
  if (anterior0 && anterior0.tipo === "estudo" && ehTipoRevisao(tipo)){
    if (anterior0.data !== D.hoje()){
      erro.textContent = "Só uma sessão registrada hoje pode virar revisão."; return;
    }
    const feitas = db.revisoes.filter(r => r.registroId === anterior0.id && r.feita);
    if (feitas.length){
      erro.textContent = "Esta sessão já tem revisão cumprida — não dá para transformá-la em revisão."; return;
    }
    const agendadas = db.revisoes.filter(r => r.registroId === anterior0.id).length;
    if (agendadas && !(await confirmar({ titulo: "Transformar em revisão", botao: "Transformar", perigo: true,
        texto: "Isso apaga " + (agendadas === 1 ? "o item" : "os " + agendadas + " itens") + " que esta sessão tinha na agenda." }))) return;
  }
  if (revAlvo){                     // uma revisão vale por uma sessão só
    const dono = sessaoDaRevisao(revAlvo);
    if (dono && (!anteriorId || dono.id !== anteriorId)){
      erro.textContent = "Essa revisão já foi cumprida por outra sessão — escolha outra."; return;
    }
  }
  if (acertos > questoes){ erro.textContent = "Acertos não podem passar do total de questões."; return; }
  if (!["1","2","3"].includes(String(dado.dificuldade || ""))){
    erro.textContent = "Escolha a dificuldade do assunto: difícil, média ou fácil.";
    const sel = f.querySelector('[name="dificuldade"]');
    if (sel){ sel.classList.add("campo-errado"); sel.focus();
              sel.addEventListener("change", () => sel.classList.remove("campo-errado"), { once: true }); }
    return;
  }
  if (!dado.data){ erro.textContent = "Informe a data do estudo."; return; }
  if (num(dado.minutos) > 0 && ehFuturo(dado.data)){
    erro.textContent = "Data futura (" + D.brFull(dado.data) + ") não pode receber tempo de estudo — registre o tempo no dia em que estudar.";
    return;
  }
  erro.textContent = "";

  const anterior = anteriorId ? acharRegistro(anteriorId) : null;
  // parte do que a sessão tem não passa pelo formulário (medições do cronômetro,
  // vínculos): preservar o registro anterior evita apagar isso ao editar
  const reg = Object.assign({}, anterior || {}, {
    id: anterior ? anterior.id : uid(),
    data: dado.data, disciplina,
    assuntos: listaAssuntos, assunto: listaAssuntos[0],
    minutos: num(dado.minutos), questoes, acertos,
    dificuldade: tresNiveis(dado.dificuldade), anotacoes: (dado.anotacoes||"").trim(),
    tipo,
    criadoEm: anterior ? anterior.criadoEm : Date.now()
  });
  if (anterior && anterior.revisaoId) reg.revisaoId = anterior.revisaoId;
  ajustarBlocosAoTempo(reg);          // tempo baixado: o que o cronômetro mediu não pode passar dele
  // a fase mora na ficha do conteúdo: a sessão não carrega mais isso
  if (dado.inicio) { reg.inicio = dado.inicio; reg.fim = dado.fim || ""; }
  else if (anterior && anterior.inicio) { reg.inicio = anterior.inicio; reg.fim = anterior.fim; }
  const planoAntes = anterior ? planoDe(anterior) : "individual";
