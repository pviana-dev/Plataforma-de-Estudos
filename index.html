const catDe = id => CONFIG.CATEGORIAS_ERRO.find(c => c.id === id) || null;   // "" = sem classificação

/* ---------- sugestões de preenchimento (autocomplete próprio) ----------
   O <datalist> nativo é desenhado pelo navegador e, dependendo do tema do
   sistema, ficava ilegível (texto claro sobre fundo branco). Aqui a lista é
   nossa: usa os mesmos tokens de cor do resto da interface.                */
const FONTES_SUG = {
  disciplinas: () => disciplinas(),
  assuntos: () => [...new Set(assuntos().map(a => a.assunto))]
};
let sug = null;                      // { inp, ul, itens, idx }

function fecharSugestoes(){
  if (!sug) return;
  sug.ul.remove();
  sug.inp.removeAttribute("aria-expanded");
  sug = null;
}
function realceSug(texto, termo){
  const t = esc(texto);
  if (!termo) return t;
  const at = t.toLowerCase().indexOf(termo);
  return at < 0 ? t : t.slice(0,at) + "<b>" + t.slice(at, at+termo.length) + "</b>" + t.slice(at+termo.length);
}
function abrirSugestoes(inp){
  const fonte = FONTES_SUG[inp.dataset.sug];
  if (!fonte) return;
  const termo = inp.value.trim().toLowerCase();
  const itens = fonte().filter(x => !termo || x.toLowerCase().includes(termo)).slice(0, 8);
  const mesmoCampo = sug && sug.inp === inp;
  fecharSugestoes();
  if (!itens.length) return;
  if (itens.length === 1 && itens[0].toLowerCase() === termo) return;   // já digitado por inteiro
  const pai = inp.parentElement;
  if (getComputedStyle(pai).position === "static") pai.style.position = "relative";
  const ul = document.createElement("ul");
  ul.className = "sug-lista";
  ul.setAttribute("role", "listbox");
  ul.innerHTML = itens.map(x => '<li role="option">' + realceSug(x, termo) + '</li>').join("");
  [...ul.children].forEach((li, i) => {
    li.addEventListener("mousedown", ev => { ev.preventDefault(); escolherSugestao(itens[i]); });
  });
  pai.appendChild(ul);
  ul.style.left = inp.offsetLeft + "px";
  ul.style.top  = (inp.offsetTop + inp.offsetHeight + 4) + "px";
  ul.style.minWidth = inp.offsetWidth + "px";
  inp.setAttribute("aria-expanded", "true");
  sug = { inp, ul, itens, idx: -1 };
  if (mesmoCampo) { /* mantém fechado o ciclo de foco */ }
}
function escolherSugestao(valor){
  if (!sug) return;
  const inp = sug.inp;
  inp.value = valor;
  fecharSugestoes();
  inp.focus();
}
function navegarSugestoes(ev){
  if (!sug || sug.inp !== ev.target) return false;
  const n = sug.itens.length;
  const marcar = i => {
    [...sug.ul.children].forEach(li => li.classList.remove("ativo"));
    if (i >= 0){ sug.ul.children[i].classList.add("ativo"); sug.ul.children[i].scrollIntoView({ block: "nearest" }); }
    sug.idx = i;
  };
  if (ev.key === "ArrowDown"){ ev.preventDefault(); marcar((sug.idx + 1) % n); return true; }
  if (ev.key === "ArrowUp"){ ev.preventDefault(); marcar((sug.idx - 1 + n) % n); return true; }
  if (ev.key === "Escape"){ ev.preventDefault(); ev.stopPropagation(); fecharSugestoes(); return true; }
  if (ev.key === "Enter" && sug.idx >= 0){ ev.preventDefault(); escolherSugestao(sug.itens[sug.idx]); return true; }
  if (ev.key === "Tab" && sug.idx >= 0){ escolherSugestao(sug.itens[sug.idx]); return true; }
  return false;
}
/** liga o autocomplete a todos os campos com data-sug, a cada redesenho */
function montarSugestoes(){
  document.querySelectorAll("input[data-sug]").forEach(inp => {
    if (inp.dataset.sugPronto) return;
    inp.dataset.sugPronto = "1";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("role", "combobox");
    inp.addEventListener("input", () => abrirSugestoes(inp));
    inp.addEventListener("focus", () => abrirSugestoes(inp));
    inp.addEventListener("keydown", ev => { if (navegarSugestoes(ev)) ev.sugConsumida = true; });
    inp.addEventListener("blur", () => setTimeout(() => { if (sug && sug.inp === inp) fecharSugestoes(); }, 120));
  });
}

/* ---------- TELA: HOJE ---------- */
function telaHoje(){
  const det = revisoesDetalhadas();
  const atrasadas = det.filter(x => x.status === "atrasada");
  const hoje      = det.filter(x => x.status === "hoje");
  const proximas  = det.filter(x => x.status === "futura" && D.dif(D.hoje(), x.rev.data) <= 7);
  const min = minutosDoDia(D.hoje());
  const meta = db.metaDiariaMin || 1;
  const perc = Math.min(100, Math.round((min/meta)*100));
  const streak = sequenciaDias();

  let h = '<div class="tiles" style="margin-bottom:16px">' +
    tile("Estudo de hoje", hhmm(min), "meta: "+hhmm(meta)+" · "+perc+"%",
         '<div class="barra"><i class="'+(perc>=100?"cheia":"")+'" style="width:'+perc+'%"></i></div>',
         perc >= 100 ? "bom" : "accent") +
    tile("Sequência", streak + (streak===1?" dia":" dias"), streak ? "dias seguidos estudando" : "estude hoje para começar",
         "", streak ? "accent" : "") +
    tile("Revisões atrasadas", String(atrasadas.length), atrasadas.length ? "⚠ prioridade máxima" : "✓ nada atrasado",
         "", atrasadas.length ? "critico" : "bom") +
    tile("Revisões de hoje", String(hoje.length), hoje.length ? "na agenda de hoje" : "✓ dia livre de revisões",
         "", hoje.length ? "accent" : "bom") +
  '</div>';

  // o cronômetro é a ação mais usada do dia: vem logo depois dos números
  h += '<div class="card card-crono"><h2>⏱ Cronômetro de estudo</h2>' +
       '<p class="sub">Escolha para onde o tempo vai e comece. Ele entra no seu tempo estudado de hoje.</p>' +
       blocoCronometro() + '</div>';

  h += '<div class="card"><h2>Revisões de hoje e atrasadas</h2>' +
       '<p class="sub">Marque como feita para o sistema recalcular o que ainda falta ' + rotuloPrazo() + '.</p>';
  if (!atrasadas.length && !hoje.length){
    h += '<div class="vazio"><strong>Nada pendente para hoje</strong>Aproveite para registrar um estudo novo ou reler seus pontos importantes.</div>';
  } else {
    h += atrasadas.map(x => itemRevisao(x, "Atrasada desde " + D.extenso(x.rev.data))).join("");
    h += hoje.map(x => itemRevisao(x, "Para hoje")).join("");
  }
  h += '</div>';

  h += blocoRegistrosDeHoje();
  h += '<div class="grid g2">';
  h += '<div class="card"><h2>Próximos 7 dias' +
       (proximas.length > CONFIG.PROXIMAS_VISIVEIS
         ? '<span class="dica">'+proximas.length+' no total</span>' : '') + '</h2>' +
       (proximas.length ? proximosPorDia(proximas)
                        : '<div class="vazio">Sem revisões agendadas para a próxima semana.</div>') +
       (proximas.length > CONFIG.PROXIMAS_VISIVEIS
         ? '<button class="act ver-mais" data-acao="toggle-proximas">' +
           (ui.verTodasProximas ? "− mostrar menos" : "+ ver todas as " + proximas.length) + '</button>'
         : '') + '</div>';

  h += '<div class="card"><h2>Para lembrar</h2>' +
       '<details class="ajuda"><summary>Por que revisar resolvendo questões?</summary>' +
       '<p>Recordação ativa: buscar a informação na memória fixa muito mais do que reler. ' +
       'O registro de questões e acertos existe justamente para medir isso.</p></details>' +
       '<p class="sub" style="margin-top:14px">💡 ' + esc(CONFIG.DICAS[ui.dicaIdx]) + '</p>' +
       '<button class="btn mini ghost" data-acao="outra-dica">outra dica</button></div>';
  h += '</div>';
  return h;
}
/* O que já foi registrado hoje, só para conferência — a edição continua sendo
   na aba Sessões, que é onde as horas de fato moram. */
function blocoRegistrosDeHoje(){
  const hoje = D.hoje();
  const doDia = db.registros.filter(r => r.data === hoje)
    .sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
  if (!doDia.length) return "";
  const total = doDia.reduce((t,r) => t + (r.minutos||0), 0);
  return '<div class="card"><h2>Registrado hoje ' +
    '<span class="dica">'+doDia.length+(doDia.length===1?" sessão":" sessões")+' · '+hhmm(total)+'</span></h2>' +
    '<div class="tab-rolagem"><table><thead><tr><th>Conteúdo</th><th>Disciplina</th>' +
    '<th>Tipo</th><th class="num">Tempo</th></tr></thead><tbody>' +
    doDia.map(r => '<tr><td>'+esc(rotuloAssuntos(r))+'</td><td>'+esc(r.disciplina)+'</td>' +
      '<td>'+badgeTipoSessao(r)+'</td>' +
      '<td class="num">'+(r.minutos ? hhmm(r.minutos) : "—")+'</td></tr>').join("") +
    '</tbody></table></div>' +
    '<p class="sub" style="margin:10px 0 0">Só para conferência — para editar, vá em <b>Registros</b>.</p></div>';
}

/* ---------- cronômetro de estudo ----------
   Fica na aba Hoje, mas enquanto roda aparece um chip no cabeçalho (visível
   em todas as abas). O tempo é contado a partir do instante de início gravado
   no armazenamento, então sobrevive a recarregar ou fechar a página.        */
/** Para onde vai o tempo: sessão nova, uma sessão já registrada ou uma revisão. */
function alvoCrono(tipo, id){
  if (tipo === "registro"){
    const reg = acharRegistro(id);
    return reg ? { tipo, id, item: reg, disciplina: reg.disciplina, rotulo: rotuloAssuntos(reg),
                   detalhe: "sessão de " + D.br(reg.data) + " · " + hhmm(reg.minutos || 0) + " até agora" } : null;
  }
  if (tipo === "revisao"){
    const rev = acharRevisao(id), ctx = rev ? contextoRevisao(rev) : null;
    return rev && ctx ? { tipo, id, item: rev, disciplina: ctx.disciplina, rotulo: ctx.rotulo,
                          detalhe: "revisão de " + D.br(rev.data) + (rev.feita ? " · concluída" : " · pendente") +
                                   (rev.minutos ? " · " + hhmm(rev.minutos) + " até agora" : "") } : null;
  }
  return null;
}
/* As medições que o alvo já tem, em etiquetas — para o cronômetro mostrar tudo
   o que já foi cronometrado ali, e não só o total. `agora` acrescenta a medição
   em andamento. */
function faixasDoAlvo(alvo, agora){
  const lista = alvo && alvo.item ? intervalosDe(alvo.item) : [];
  let h = lista.map(f => '<span class="faixa">'+esc(f.rotulo)+'</span>').join("");
  if (agora) h += '<span class="faixa agora">'+esc(agora)+'–agora</span>';
  return h;
}
/** opções do seletor de destino */
function opcoesDestino(){
  const hoje = D.hoje();
  // sessão de revisão é uma sessão como outra qualquer: o cronômetro mira nelas
  const regs = db.registros.filter(r => r.data === hoje)         // o tempo é de hoje: só sessão de hoje recebe
    .sort((a,b) => (b.fim || "").localeCompare(a.fim || ""))
    .map(r => ['registro:'+r.id, (ehRevisaoSessao(r) ? "↻ " : "") + r.disciplina + " · " +
               rotuloAssuntos(r) + " · " + hhmm(r.minutos || 0)]);
  let h = '<option value=""'+(ui.cronoDestino ? "" : " selected")+'>Escolha para onde vai o tempo…</option>' +
          '<option value="novo"'+(ui.cronoDestino === "novo" ? " selected" : "")+'>Nova sessão</option>';
  if (regs.length) h += '<optgroup label="Somar a uma sessão de hoje">' +
    regs.map(([v,t]) => '<option value="'+v+'"'+(ui.cronoDestino===v?" selected":"")+'>'+esc(t)+'</option>').join("") + '</optgroup>';
  return h;
}

function blocoCronometro(){
  const c = db.cronometro;
  if (c){
    const alvo = c.destinoTipo ? alvoCrono(c.destinoTipo, c.destinoId) : null;
    return '<div class="crono">' +
      '<span class="crono-tempo num" id="cronoTempo">'+fmtCrono(Math.floor((Date.now()-c.inicio)/1000))+'</span>' +
      '<span class="crono-info"><b><span class="pulso"></span>'+esc(alvo ? alvo.rotulo : "Nova sessão")+'</b>' +
      '<span>'+esc(alvo ? alvo.disciplina + " · " + alvo.detalhe : "disciplina e assunto ao encerrar")+'</span>' +
      (alvo ? '<span class="faixas">'+faixasDoAlvo(alvo, horaDe(c.inicio))+'</span>'
            : '<span>começou às '+horaDe(c.inicio)+'</span>') + '</span>' +
      '<button class="btn" data-acao="crono-encerrar">'+(alvo ? "Encerrar e somar" : "Encerrar e registrar")+'</button>' +
      '<button class="btn ghost" data-acao="crono-cancelar">Descartar</button></div>';
  }
  const opcoes = opcoesDestino();
  let destino = ui.cronoDestino || "";
  if (destino && destino !== "novo" && opcoes.indexOf('value="' + destino + '"') < 0) destino = ui.cronoDestino = "";
  const alvo = (destino && destino !== "novo") ? alvoCrono(destino.split(":")[0], destino.split(":")[1]) : null;
  return '<form id="formCrono"><div class="campos" style="grid-template-columns:1fr auto">' +
    '<div class="campo"><span>O tempo vai para *</span>' +
      '<select id="cronoDestino" name="destino">' + opcoes + '</select></div>' +
    // o botão fica sempre clicável: sem destino ele EXPLICA o que falta, em vez
    // de não fazer nada — botão morto parece defeito
    '<label class="campo"><span>&nbsp;</span><button class="btn" type="submit"' +
      (destino ? "" : ' title="Escolha para onde o tempo vai antes de iniciar"') +
      '>▶ Iniciar</button></label>' +
    (alvo
      ? '<div class="campo largo"><div class="faixa-edicao" style="margin:0;flex-direction:column;align-items:flex-start">' +
          '<span>⏱ vai somar em <b>' + esc(alvo.rotulo) + '</b> · ' + esc(alvo.disciplina) + ' · ' + esc(alvo.detalhe) + '</span>' +
          (faixasDoAlvo(alvo) ? '<span class="faixas">já cronometrado: ' + faixasDoAlvo(alvo) + '</span>' : '') +
        '</div></div>'
      : '<div class="campo largo"><p class="sub" style="margin:0">' +
        (destino ? 'Disciplina e assunto você preenche ao encerrar, no registro da sessão.'
                 : 'Escolha acima para onde o tempo vai — o cronômetro só inicia com um destino definido.') +
        '</p></div>') +
    '</div><span class="erro-form" id="erroCrono"></span></form>';
}

function iniciarCrono(ev){
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target).entries());
  const destino = (d.destino || "").trim();
  if (!destino){          // trava: o cronômetro não começa sem saber onde o tempo entra
    const temSessao = db.registros.some(r => r.data === D.hoje());
    document.getElementById("erroCrono").textContent = temSessao
      ? "Escolha para onde o tempo vai: uma sessão de hoje ou uma sessão nova."
      : "Escolha para onde o tempo vai — como ainda não há sessão hoje, use “Nova sessão”.";
    const sel = document.getElementById("cronoDestino");
    if (sel){ sel.classList.add("campo-errado"); sel.focus();
              sel.addEventListener("change", () => sel.classList.remove("campo-errado"), { once: true }); }
    toast("Escolha uma sessão antes de iniciar o cronômetro.");
    return;
  }
  const [tipo, id] = destino.split(":");
  if (destino !== "novo" && !alvoCrono(tipo, id)){
    document.getElementById("erroCrono").textContent = "Esse destino não existe mais — escolha outro."; return;
  }
  db.cronometro = { inicio: Date.now(),
                    disciplina: "", assunto: "",
                    destinoTipo: destino === "novo" ? null : tipo,
                    destinoId: destino === "novo" ? null : id };
  persistir(true); render();
  toast("Cronômetro iniciado às " + horaDe(db.cronometro.inicio) + ".");
}

function encerrarCrono(){
  const c = db.cronometro; if (!c) return;
  const fim = Date.now();
  const minutos = Math.max(1, Math.round((fim - c.inicio)/60000));
  // o cronômetro só lança tempo no dia atual — nunca em dia passado ou futuro
  const bloco = { data: D.hoje(), inicio: horaDe(c.inicio), fim: horaDe(fim), minutos };
  const alvo = c.destinoTipo ? alvoCrono(c.destinoTipo, c.destinoId) : null;
  db.cronometro = null;

  // --- soma numa sessão de estudo já registrada
  if (alvo && alvo.tipo === "registro"){
    const reg = acharRegistro(alvo.id);
    reg.minutos = (reg.minutos || 0) + minutos;
    reg.blocos = (reg.blocos || []).concat([bloco]);
    if (!reg.inicio) reg.inicio = bloco.inicio;
    reg.fim = bloco.fim;
    persistir(true); render();
    toast(hhmm(minutos) + " somados a “" + alvo.rotulo + "” — agora " + hhmm(reg.minutos) + ".");
    return;
  }
  // --- nova sessão: abre o registro pré-preenchido
  ui.prefill = {
    data: bloco.data, disciplina: c.disciplina, assuntos: c.assunto ? [c.assunto] : [],
    minutos, questoes: "", acertos: "", dificuldade: 3,
    inicio: bloco.inicio, fim: bloco.fim,
    anotacoes: "Sessão cronometrada: " + bloco.inicio + " → " + bloco.fim + " (" + hhmm(minutos) + ")."
  };
  persistir(true);
  ui.aba = "registros"; ui.editandoRegistro = null; ui.foco = null; ui.formAberto = true;
  redesenharTelaForm();
  toast(hhmm(minutos) + " cronometrados — complete o registro para agendar as revisões.");
}

/* tom: "accent" | "bom" | "alerta" | "critico" — cor com função, não enfeite:
   diz num relance se o número é conquista, aviso ou urgência. */
function tile(rot, val, pe, extra, tom){
  return '<div class="tile'+(tom ? " t-"+tom : "")+'"><div class="rot">'+esc(rot)+'</div>' +
         '<div class="val num">'+esc(val)+'</div>' +
         (pe ? '<div class="pe">'+esc(pe)+'</div>' : '') + (extra || '') + '</div>';
}
/** tom da taxa de acerto, nos mesmos cortes que o agendamento usa */
const tomTaxa = t => t === null ? "" : t >= CONFIG.TAXA_ATENCAO ? "bom" : t >= CONFIG.TAXA_CRITICA ? "alerta" : "critico";
/* A lista dos próximos dias era um bloco corrido de cards iguais, um colado no
   outro. Agrupar por dia dá o ponto de corte: cada dia tem rótulo, contagem e
   uma linha separando do dia seguinte. */
function proximosPorDia(lista){
  const dias = new Map();
  const ordenada = lista.slice().sort((a,b) => a.rev.data.localeCompare(b.rev.data));
  (ui.verTodasProximas ? ordenada : ordenada.slice(0, CONFIG.PROXIMAS_VISIVEIS))   // amostra curta
       .forEach(x => { if (!dias.has(x.rev.data)) dias.set(x.rev.data, []); dias.get(x.rev.data).push(x); });
  const hoje = D.hoje();
  return [...dias.entries()].map(([data, itens]) => {
    const faltam = D.dif(hoje, data);
    return '<div class="dia-bloco">' +
      '<div class="dia-rotulo">' + esc(D.semana(data)) + ' · ' + D.br(data) +
        '<span>' + (faltam === 1 ? "amanhã" : "em " + faltam + " dias") +
        ' · ' + itens.length + (itens.length === 1 ? " revisão" : " revisões") + '</span></div>' +
      itens.map(x => itemRevisao(x, "")).join("") + '</div>';
  }).join("");
}

/** como a revisão entrou no dia de hoje: fazendo, feita ou ainda por fazer */
function rotuloDeHoje(x, dia){
  if (emAndamento(x.rev)) return "Em andamento agora";
  if (x.rev.feita){
    return "Concluída hoje" + (x.rev.data !== dia ? " · estava marcada para " + D.br(x.rev.data) : "");
  }
  return x.status === "atrasada" ? "Atrasada desde " + D.extenso(x.rev.data) : "Para hoje";
}
/** a revisão está sendo cumprida agora: o cronômetro aponta para a sessão dela */
function emAndamento(rev){
  const c = db.cronometro;
  return !!(c && rev && rev.sessaoId && c.destinoTipo === "registro" && c.destinoId === rev.sessaoId);
}
function itemRevisao(x, quando){
  const nome = nomeRevisao(x.rev);
  const feita = x.status === "feita";
  return '<div class="item rev-linha '+x.status+(emAndamento(x.rev) ? " em-andamento" : "")+'">' +
    '<div class="rev-topo">' +
      '<button class="check" role="checkbox" aria-checked="'+feita+'" data-acao="'+(feita ? "reabrir" : "concluir")+'" data-id="'+x.rev.id+'" ' +
      'title="'+(feita ? "Desmarcar esta revisão" : "Marcar revisão como feita")+'">✓</button>' +
      '<div class="corpo"><div class="titulo">'+esc(x.ctx.rotulo)+'</div>' +
      '<div class="meta">'+esc(x.ctx.sub)+(quando ? ' · '+esc(quando) : '')+' · '+esc(nome.toLowerCase())+'</div></div>' +
    '</div>' + descricaoAtividade(x.rev) + '</div>';
}

/* ---------- TELA: REGISTROS ---------- */
function telaRegistros(){
  const pre = ui.prefill;
  return '<button class="btn-add" data-acao="toggle-form-registro" style="margin-bottom:16px">' +
    '<span class="mais">+</span> Registrar sessão' +
    (pre ? '<span class="badge b-bom" style="margin-left:10px">⏱ ' + hhmm(pre.minutos) +
           ' cronometrados esperando registro</span>' : '') +
    '</button>' + telaHistorico();
}

/* O que a sessão guarda além dos campos editáveis: as medições do cronômetro
   (cada intervalo, não o vão entre o primeiro e o último), quando ela foi
   criada e como está o plano de revisões. Fica aqui, dentro da própria sessão,
   em vez de poluir a lista do histórico.                                    */
function infoDaSessao(reg){
  const faixas = intervalosDe(reg);
  const revs = db.revisoes.filter(x => x.registroId === reg.id || (x.grupoId && x.grupoId === reg.grupoId));
  const feitas = revs.filter(x => x.feita).length;
  const prox = revs.filter(x => !x.feita).map(x => x.data).sort()[0];
  const linha = (rot, valor) => '<div class="linha-info"><span>'+esc(rot)+'</span><div>'+valor+'</div></div>';
  let h = '<div class="info-extra"><span class="rot-info">Esta sessão</span>';
  if (faixas.length){
    h += linha(faixas.length === 1 ? "Cronômetro" : "Cronômetro · " + faixas.length + " medições",
      faixas.map(f => '<span class="faixa">'+esc(f.rotulo)+'</span>').join("") +
      (reg.minutos ? '<span class="meta">'+hhmm(reg.minutos)+' no total</span>' : ""));
  } else if (reg.minutos){
    h += linha("Tempo", hhmm(reg.minutos) + ' <span class="meta">informado à mão</span>');
  }
  const revLig = revisaoDaSessao(reg);
  if (ehRevisaoSessao(reg)) h += linha("Cumpre a revisão",
    revLig ? esc(contextoRevisao(revLig) ? contextoRevisao(revLig).rotulo : "") +
             ' <span class="meta">de ' + D.brFull(revLig.data) + '</span>'
           : '<span class="meta">a revisão foi excluída — a sessão continua valendo</span>');
  if (reg.criadoEm) h += linha("Registrada em",
    D.brFull(D.iso(new Date(reg.criadoEm))) + ' <span class="meta">às ' + horaDe(reg.criadoEm) + '</span>');
  h += linha("Revisões", revs.length
    ? feitas + " de " + revs.length + " feitas" +
      (prox ? ' <span class="meta">· próxima em ' + D.brFull(prox) + '</span>'
            : ' <span class="meta">· nada pendente</span>')
    : '<span class="meta">' + (ROTULO_PLANO[planoDe(reg)] || "nenhuma agendada") + '</span>');
  return h + '</div>';
}

/** O formulário do registro vive na tela sobreposta (modal), não dentro do card. */
function formRegistroHtml(){
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  const pre = !ed && ui.prefill ? ui.prefill : null;
  let base = ed || pre || { data: D.hoje(), disciplina:"", assuntos:[], minutos:"", questoes:"", acertos:"", dificuldade:3, anotacoes:"" };

      (ehTipoRevisao(base.tipo) || ehRetomada(acharRevisao(base.revisaoId)))){

    if (ctxPre) base = Object.assign({}, base, { disciplina: ctxPre.disciplina, assuntos: ctxPre.assuntos.slice() });

  // rascunho = o que estava na tela antes de trocar o tipo/revisão
  const v = ui.rascunho ? Object.assign({}, base, ui.rascunho) : base;
  ui.rascunho = null;

  let h = "";
  const eRevisao = ehTipoRevisao(v.tipo);
  const planoAtual = planoDe(v);
  if (ed){
    h += '<div class="faixa-edicao">✎ Editando <b>'+esc(rotuloAssuntos(ed))+'</b> · '+esc(ed.disciplina)+' · '+D.brFull(ed.data)+'</div>' +
         infoDaSessao(ed);
  } else {
    h += '<p class="sub">Ao salvar, o sistema agenda automaticamente as revisões ' + rotuloPrazo() + '.</p>';
    if (pre) h += '<div class="faixa-edicao">⏱ Sessão cronometrada: <b>'+hhmm(pre.minutos)+'</b> ('+esc(pre.inicio)+' → '+esc(pre.fim)+
      '). Complete as questões e o domínio para salvar.<span class="spacer"></span>' +
      '<button class="btn mini ghost" type="button" data-acao="descartar-prefill">Descartar</button></div>';
  }
  h += (eRevisao ? '' : planoAtual === "grupo"
        ? '<p class="sub" style="color:var(--accent-ink)">As revisões desta sessão fazem parte do grupo <b>' +
          esc((grupoDe(v) || {}).nome || "") + '</b> — o card da revisão mostra o nome do grupo. Abaixo você troca o nome, ' +
          'vê os conteúdos que ele reúne e traz outras sessões para dentro. Desmarcar não recria o plano individual: as revisões passam a ser criadas à mão.</p>'
        : planoAtual === "manual"
        ? '<p class="sub" style="color:var(--accent-ink)">Esta sessão saiu de um grupo de revisão: nada é agendado automaticamente para ela. Marque a caixa para integrar de novo, ou crie revisões à mão na aba Revisões.</p>'
        : planoAtual === "sem"
        ? '<p class="sub" style="color:var(--accent-ink)">Esta sessão está <b>sem cronograma de revisão</b> — serve para o conteúdo que você estuda todo dia. Desmarque a caixa para voltar a agendar revisões.</p>'
        : '') +
    '<form id="formRegistro" novalidate>' +
    (v.inicio ? '<input type="hidden" name="inicio" value="'+esc(v.inicio)+'"><input type="hidden" name="fim" value="'+esc(v.fim||"")+'">' : '') +
    '<div class="campos">' +
      campoTipoSessao(v, ed) +
      campo("Data do estudo", '<input type="date" name="data" value="'+v.data+'" max="'+D.hoje()+'" required>') +
      (eRevisao
        ? campo("Disciplina", '<input value="'+esc(v.disciplina||"")+'" disabled>' +
                '<input type="hidden" name="disciplina" value="'+esc(v.disciplina||"")+'">')
        : campo("Disciplina *", seletorDisciplina(v.disciplina))) +
      camposAssuntos(assuntosDe(v), eRevisao ? "Conteúdos revisados" : undefined,
                     eRevisao ? "" : undefined, eRevisao, v.disciplina || "") +
      campo("Tempo (min)", '<input type="number" name="minutos" min="0" max="1440" value="'+(v.minutos ?? "")+'" placeholder="60">') +
      campo("Questões feitas (opcional)", '<input type="number" name="questoes" min="0" value="'+(v.questoes ?? "")+'" placeholder="20">') +
      campo("Acertos", '<input type="number" name="acertos" min="0" value="'+(v.acertos ?? "")+'" placeholder="14">') +
      campo("Dificuldade do assunto", seletorDificuldade(dificuldadeDe(v))) +
      (eRevisao ? "" : campoIntegracao(v)) +
      campo("Descrição", '<textarea name="anotacoes" placeholder="O que ficou confuso, o que revisar…">'+esc(v.anotacoes||"")+'</textarea>', true) +
    '</div><div class="linha acoes-form">' +
      '<button class="btn" type="submit">'+(ed ? "Salvar alterações" : "Registrar")+'</button>' +
      '<button class="btn ghost" type="button" data-acao="'+(ed ? "cancelar-edicao" : "toggle-form-registro")+'">Cancelar</button>' +
      (ed ? '<span class="spacer"></span><button class="act excluir" type="button" data-acao="excluir-registro" data-id="'+ed.id+'">Excluir</button>' : '') +
      '<span class="erro-form" id="erroForm"></span></div></form>';

  return h;
}

function telaHistorico(){
  const total = db.registros.length;
  let h = '<div class="card"><h2>Todas as sessões <span class="dica">'+total+(total===1?" sessão":" sessões")+' cadastrada(s)</span></h2>';
  const filtrando = !!(ui.fDisciplina || ui.fPeriodo !== "todos" || ui.fOrdem !== "data-desc" ||
                       ui.fBusca || ui.fTipo !== "todos");
  h += '<div class="filtros"><div class="filtros-campos">' +
    campo("Disciplina", '<select id="fDisciplina"><option value="">Todas</option>' +
      disciplinas().map(d => '<option'+(ui.fDisciplina===d?" selected":"")+'>'+esc(d)+'</option>').join("") + '</select>') +
    campo("Período", '<select id="fPeriodo">' +
      [["todos","Tudo"],["7","Últimos 7 dias"],["30","Últimos 30 dias"],["futuro","A partir de hoje"]]
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fPeriodo===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    campo("Tipo", '<select id="fTipo">' +
      [["todos","Todos os tipos"],["estudo","Só estudo"],["revisao","Só revisão"],
       ["misto","Só estudo/revisão"],["revisoes","Revisão e estudo/revisão"]]
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fTipo===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    campo("Ordenar por", '<select id="fOrdem">' +
      [["data-desc","Data (mais recente)"],["data-asc","Data (mais antiga)"],
       ["dificuldade-desc","Mais difícil"],["tempo-desc","Mais tempo"]]
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fOrdem===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    '<label class="campo busca campo-busca"><span>Buscar</span><span class="lupa" aria-hidden="true">⌕</span>' +
      '<input id="fBusca" type="search" value="'+esc(ui.fBusca)+'" placeholder="assunto ou descrição"></label>' +
    '</div>' +
    (filtrando ? '<div class="filtros-acoes"><span class="marca-filtro">filtro ativo</span>' +
      '<span class="spacer"></span><button class="btn mini ghost" data-acao="limpar-filtros-reg">limpar filtros</button></div>' : '') +
  '</div>';

  const linhas = registrosFiltrados();
  if (!linhas.length){
    return h + '<div class="vazio"><strong>Nenhum registro encontrado</strong>' +
      (total ? 'Nenhuma sessão bate com os filtros acima.' : 'Use o botão “Registrar sessão” para lançar a primeira.') +
      '</div></div>';
  }

  // --- resumo do que está sendo listado
  const soma = (c) => linhas.reduce((t,r) => t + (r[c]||0), 0);
  const min = soma("minutos");
  const idsList = new Set(linhas.map(r => r.id));
  const revsList = db.revisoes.filter(r => idsList.has(r.registroId));
  const pend = revsList.filter(r => !r.feita).length;
  const atras = revsList.filter(r => statusRevisao(r) === "atrasada").length;
  const dias = new Set(linhas.map(r => r.data)).size;
  // semana corrente, de domingo a sábado — independe do filtro, é referência fixa
  const iniSemana = D.soma(D.hoje(), -D.parse(D.hoje()).getDay());
  const fimSemana = D.soma(iniSemana, 6);
  const naSemana = db.registros.filter(r => r.data >= iniSemana && r.data <= fimSemana);
  const minSemana = naSemana.reduce((t,r) => t + (r.minutos||0), 0);
  const minTotal  = db.registros.reduce((t,r) => t + (r.minutos||0), 0);
  h += '<div class="tiles" style="margin-bottom:14px">' +
    tile("Sessões listadas", String(linhas.length),
         dias + (dias===1?" dia":" dias") + " diferentes" + (min ? " · " + hhmm(min) + " no filtro" : "")) +
    tile("Tempo na semana", hhmm(minSemana),
         D.br(iniSemana) + " a " + D.br(fimSemana) + " · " + naSemana.length +
         (naSemana.length === 1 ? " sessão" : " sessões")) +
    tile("Revisões pendentes", String(pend), atras ? atras + " em atraso" : "nenhuma atrasada",
         "", atras ? "critico" : "") +
    tile("Tempo total", hhmm(minTotal),
         db.registros.length + (db.registros.length === 1 ? " sessão registrada" : " sessões registradas"),
         "", "accent") + '</div>';

  h += '<div class="tab-rolagem"><table><thead><tr>' +
    '<th>Data</th><th>Disciplina</th><th>Assuntos</th><th class="num">Tempo</th>' +
    '<th>Dificuldade</th><th>Revisões</th><th>Tipo</th></tr></thead><tbody>';
  const emEdicao = ui.editandoRegistro;
  let ultimoDia = "";
  h += linhas.map(r => {
    const revs = db.revisoes.filter(x => x.registroId === r.id);
    const feitas = revs.filter(x => x.feita).length;
    const atrasada = revs.some(x => statusRevisao(x) === "atrasada");
    const plano = planoDe(r);
    const gr = plano === "grupo" ? grupoDe(r) : null;
    const revLigada = revisaoDaSessao(r);
    const rotuloRev = ehRevisaoSessao(r)
      ? '<span class="badge b-bom" title="Esta sessão cumpriu uma revisão">' +
        (revLigada ? "cumpriu revisão" : "revisão avulsa") + '</span>'
      : plano === "sem" ? '<span class="badge">sem revisão</span>'
      : plano === "grupo" ? '<span class="badge b-bom" title="Plano integrado">'+esc(gr ? gr.nome : "integrado")+'</span>'
      : plano === "manual" ? '<span class="badge">manual</span>'
      : '<span class="num">'+feitas+"/"+revs.length+'</span>' + (atrasada ? ' <span class="badge b-critico">atraso</span>' : '');
    // separador de dia, para a lista ficar legível quando há muitas sessões
    let sep = "";
    if (r.data !== ultimoDia && (ui.fOrdem === "data-desc" || ui.fOrdem === "data-asc")){
      ultimoDia = r.data;
      sep = '<tr class="sep-dia"><td colspan="7">'+esc(D.semana(r.data))+' · '+D.brFull(r.data) +
            ' <span class="meta">'+hhmm(minutosDoDia(r.data))+' no dia</span></td></tr>';
    }
    return sep + '<tr class="linha-clicavel'+(emEdicao === r.id ? " editando-linha" : "")+'"' +
      ' data-acao="editar-registro" data-id="'+r.id+'" title="Clique para abrir esta sessão">' +
      '<td class="num">'+D.br(r.data)+'</td><td>'+esc(r.disciplina)+'</td>' +
      '<td>'+esc(rotuloAssuntos(r)) +
        (r.anotacoes ? '<div class="pe" style="font-size:12px;color:var(--muted)">'+esc(r.anotacoes.slice(0,90))+(r.anotacoes.length>90?"…":"")+'</div>' : '') + '</td>' +
      '<td class="num">'+(r.minutos ? hhmm(r.minutos) : "—") +
        (intervalosDe(r).length > 1
          ? '<div style="font-size:11px;color:var(--muted)">'+intervalosDe(r).length+' medições</div>' : '') +
        '</td>' +
      '<td>'+badgeDificuldade(dificuldadeDe(r))+'</td>' +
      '<td>'+rotuloRev+'</td>' +
      '<td class="col-tipo">'+badgeTipoSessao(r)+'</td></tr>';
  }).join("");
  return h + '</tbody></table></div></div>';
}
/** Seletor de disciplina: só as cadastradas + "criar nova" no topo da lista. */
function seletorDisciplina(valor){
  const lista = disciplinas();
  const criando = !valor && !lista.length;
  const opcoes = (!valor && lista.length ? '<option value="" selected>Selecione a disciplina…</option>' : '') +
    '<option value="__nova"'+(criando ? " selected" : "")+'>＋ Criar nova disciplina</option>' +
    (lista.length ? '<optgroup label="Minhas disciplinas">' +
      lista.map(d => '<option'+(d === valor ? " selected" : "")+'>'+esc(d)+'</option>').join("") + '</optgroup>' : '');
  return '<select name="disciplina" class="sel-disciplina">' + opcoes + '</select>' +
         '<input name="novaDisciplina" class="nova-disciplina" placeholder="Nome da nova disciplina"' +
         (criando ? '' : ' hidden') + ' style="margin-top:6px">';
}
/** liga o comportamento "criar nova" (mostra o campo de texto sem redesenhar a tela) */
function ligarSeletoresDisciplina(){
  document.querySelectorAll("select.sel-disciplina").forEach(sel => {
    if (sel.dataset.pronto) return;
    sel.dataset.pronto = "1";
    const inp = sel.parentElement.querySelector(".nova-disciplina");
    if (!inp) return;
    sel.addEventListener("change", () => {
      const criar = sel.value === "__nova";
      inp.hidden = !criar;
      if (criar) inp.focus(); else inp.value = "";
      /* Trocou a disciplina: a lista de conteúdos é outra. Redesenha o
         formulário (guardando o que já estava digitado) para o campo de
         conteúdo passar a mostrar só o que é daquela disciplina. */
      if (!criar && sel.closest("#formRegistro")){ guardarRascunhoRegistro(); redesenharTelaForm(); }
    });
  });
}
/** lê a disciplina escolhida (ou digitada, se for nova) e a cadastra */
function lerDisciplina(form){
  const sel = form.querySelector("select.sel-disciplina");
  if (!sel) return (form.disciplina ? form.disciplina.value.trim() : "");
  if (sel.value === "__nova"){
    const inp = form.querySelector(".nova-disciplina");
    return registrarDisciplina(inp ? inp.value : "");
  }
  return sel.value;
}

function campo(rot, inner, largo, ajuda){
  return '<label class="campo'+(largo?" largo":"")+'"><span>'+esc(rot)+'</span>'+inner+
    (ajuda ? '<span class="ajuda-campo">'+esc(ajuda)+'</span>' : '') + '</label>';
}
/** Assuntos da sessão: vários, em etiquetas. A descrição continua sendo um campo só. */
/* O nome do assunto é editável na própria etiqueta: clicar nele deixa digitar,
   Enter confirma, Esc desfaz. O data-assunto acompanha o que for digitado, que
   é de onde lerAssuntosForm tira a lista ao salvar.                          */
/* A etiqueta não é mais editável: o nome mora na ficha do conteúdo, e renomear
   ali seria renomear só nesta sessão — foi assim que nasciam duplicatas. Para
   renomear de verdade, a tela de Conteúdos (em Ajustes) muda em todo lugar. */
const tagAssunto = a => '<span class="tag" data-assunto="'+esc(a)+'">' +
  '<span class="txt">'+esc(a)+'</span>' +
  '<button type="button" data-acao="remover-assunto" aria-label="Remover '+esc(a)+'">✕</button></span>';
/* ---------- tipo da sessão: estudo ou revisão ----------
   Revisão = a sessão cumpre uma revisão agendada. O conteúdo vem dela (por isso
   as etiquetas ficam travadas), não gera cronograma novo e as caixas de
   integração somem — nada disso faz sentido numa revisão.                     */
function campoTipoSessao(v, ed){
  const atual = TIPOS_SESSAO[v.tipo] ? v.tipo : "estudo";
  // sessão de estudo só vira revisão (ou estudo/revisão) no mesmo dia em que foi registrada
  const travado = ed && ed.tipo === "estudo" && ed.data !== D.hoje();
  // estudo/revisão não volta a ser só estudo: ela cumpre uma revisão e as horas já estão lá
  const semEstudo = ed && ed.tipo === "misto";
  const opcao = (valor, rotulo, desligado) =>
    '<label class="opcao'+(desligado ? " fixa" : "")+'">' +
      '<input type="radio" name="tipo" value="'+valor+'" id="tipo'+valor[0].toUpperCase()+valor.slice(1)+'"' +
      (atual === valor ? " checked" : "") + (desligado ? " disabled" : "") + '>' +
      '<span>'+rotulo+'</span></label>';
  const avisos = [
    travado   ? "sessão de outro dia não vira revisão — só as de hoje" : "",
    semEstudo ? "estudo/revisão só volta a ser revisão: ela cumpre uma revisão que já está marcada" : ""
  ].filter(Boolean);
  /* Os três tipos respondem "o que eu fiz nesta sessão" — e só isso. Se o
     CONTEÚDO está aberto ou fechado é outra pergunta, que a fase responde.
     Os rótulos dizem quando cada um cabe, porque com as fases o caminho comum
     mudou: conteúdo aberto se continua com Estudo, fechando a volta.        */
  return '<div class="campo largo"><span>Esta sessão é *</span><div class="opcoes">' +
    opcao("estudo",  "Estudo — conteúdo novo ou continuação",
                     (travado && atual !== "estudo") || semEstudo) +
    opcao("revisao", "Revisão — conteúdo que já fechei", travado && atual === "estudo") +
    opcao("misto",   "Estudo/Revisão — revisei e ainda vi conteúdo novo",
                     travado && atual === "estudo") +
    (avisos.length ? '<span class="dica-fmt">'+esc(avisos.join(" · "))+'</span>' : '') +
    '</div><div id="painelRevisao">' + htmlPainelRevisao(v, ed) + '</div></div>';
}
/** as revisões que esta sessão pode cumprir */
function revisoesDisponiveis(v, ed){
  const atual = ed && ed.revisaoId ? ed.revisaoId : "";
  return revisoesDetalhadas()
    .filter(x => !x.rev.feita || x.rev.id === atual)          // já cumprida por outra sessão sai da lista
    .filter(x => x.status !== "futura" || x.rev.id === atual)  // só hoje e atrasadas
    .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
}
function htmlPainelRevisao(v, ed){
  const alvoRetomada = (v.revisaoId || (ed && ed.revisaoId)) &&
                       ehRetomada(acharRevisao(v.revisaoId || (ed && ed.revisaoId)));
  // volta de conteúdo aberto: a sessão é de estudo e mesmo assim fecha a volta
  if (!ehTipoRevisao(v.tipo) && !alvoRetomada) return "";
  const atual = (ed && ed.revisaoId) || v.revisaoId || "";
  const lista = revisoesDisponiveis(v, ed);
  const opcoes = '<option value=""'+(atual ? "" : " selected")+'>Escolha a revisão…</option>' +
    lista.map(x => {
      const atraso = x.status === "atrasada";
      return '<option value="'+esc(x.rev.id)+'"'+(x.rev.id === atual ? " selected" : "")+
             (atraso ? ' class="atrasada"' : '')+'>' +
             (atraso ? "⚠ atrasada de " + D.br(x.rev.data) + " · " : "") +
             esc(x.ctx.rotulo) + " · " + esc(x.ctx.disciplina) +
             (atraso ? "" : " · " + D.br(x.rev.data)) + '</option>';
    }).join("");
  const rev = atual ? acharRevisao(atual) : null;
  const ctx = rev ? contextoRevisao(rev) : null;
  return '<div class="painel-rev">' +
    '<label class="campo"><span>Qual revisão esta sessão cumpre? *</span>' +
      '<select name="revisaoAlvo" id="revisaoAlvo">' + opcoes + '</select></label>' +
    (lista.length ? '' : '<p class="sub" style="margin:8px 0 0">Não há revisão de hoje nem atrasada para cumprir. ' +
      'Agende uma na aba <b>Revisões</b> — ou registre isto como estudo.</p>') +
    (ctx ? '<p class="sub" style="margin:8px 0 0">O conteúdo vem da revisão: <b>'+esc(ctx.rotulo)+'</b> · ' +
      esc(ctx.disciplina) + (rev.dataOriginal ? ' <span class="badge b-alerta">estava marcada para ' +
      D.br(rev.dataOriginal) + '</span>' : '') + '</p>' : '') +
    '</div>';
}

/* ---------- integração: com qual conteúdo esta sessão vai ser revisada ----------
   A caixa "Integrar" não vale sozinha: ao lado dela vem o seletor obrigatório do
   destino — um grupo que já existe ou uma sessão que ainda está sozinha (juntar
   com ela cria o grupo já com as duas dentro). O painel abaixo é o editor do
   grupo: nome e a lista dos conteúdos que ele reúne.                          */
function campoIntegracao(v){
  const g = grupoDe(v);
  const alvo = g ? "g:" + g.id : "";
  /* A fase não é mais desta sessão: ela é do CONTEÚDO, e vale para todas as
     sessões que falam dele. Aqui a tela só mostra como está cada um, com o
     atalho para fechar — quem fecha, fecha para todo mundo.                 */
  const fichas = assuntosDe(v).map(a => acharConteudo(v.disciplina, a)).filter(Boolean);
  const abertos = fichas.filter(c => c.fase !== "concluido");
  const estado = !fichas.length
    ? '<span class="ajuda-campo">Escolha os conteúdos acima — a fase de cada um aparece aqui.</span>'
    : '<div class="linha" style="flex-wrap:wrap;gap:7px">' +
        fichas.map(c => '<span class="badge'+(c.fase === "concluido" ? " b-bom" : " b-misto")+'">' +
          esc(c.nome) + ' · ' + (c.fase === "concluido" ? "concluído" : "em andamento") + '</span>').join("") +
        (abertos.length
          ? '<span class="spacer"></span><button class="act" type="button" data-acao="concluir-conteudo" ' +
            'data-disc="'+esc(v.disciplina)+'" data-conts="'+esc(abertos.map(c => c.nome).join("|"))+'">' +
            '✓ marcar como concluído' + (abertos.length > 1 ? "s" : "") + '</button>'
          : '') +
      '</div>' +
      '<span class="ajuda-campo">Em andamento, a agenda marca <b>uma volta de cada vez</b> para continuar ' +
      'de onde parou. Concluído, começa a repetição espaçada — e vale para <b>todas</b> as sessões deste conteúdo.</span>';
  return '<div class="campo largo"><span>Fase dos conteúdos</span>' + estado + '</div>' +
    '<div class="campo largo"><span>Revisões</span><div class="opcoes">' +
    '<label class="opcao"><input type="checkbox" name="integrado" id="cxIntegrado"'+(g ? " checked" : "")+'>' +
      '<span>Integrar com outro conteúdo</span></label>' +
    '<select name="grupoAlvo" id="grupoAlvo" class="sel-grupo"'+(g ? "" : " hidden")+'>' +
      opcoesGrupo(v.disciplina, v.id, alvo) + '</select>' +
    '<label class="opcao"><input type="checkbox" name="semRevisao"'+(planoDe(v) === "sem" ? " checked" : "")+'>' +
      '<span>Sem revisão — só registrar o estudo</span></label>' +
    '</div><div id="painelGrupo">' + htmlPainelGrupo(alvo, v) + '</div></div>';
}
/** destinos possíveis: grupos da disciplina, sessões ainda sozinhas, ou um grupo novo */
function opcoesGrupo(disc, idAtual, alvo){
  const grupos = gruposDaDisciplina(disc);
  const soltas = db.registros
    .filter(r => r.disciplina === disc && r.id !== idAtual && planoDe(r) !== "grupo" && planoDe(r) !== "sem")
    .sort((a,b) => b.data.localeCompare(a.data)).slice(0, 30);
  let h = '<option value=""'+(alvo ? "" : " selected")+'>Juntar com… *</option>';
  if (grupos.length) h += '<optgroup label="Grupos de revisão">' + grupos.map(g => {
    const n = registrosDoGrupo(g.id).length;
    return '<option value="g:'+g.id+'"'+(alvo === "g:"+g.id ? " selected" : "")+'>' +
           esc(g.nome) + ' (' + n + (n === 1 ? " conteúdo" : " conteúdos") + ')</option>';
  }).join("") + '</optgroup>';
  if (soltas.length) h += '<optgroup label="Sessões desta disciplina">' +
    soltas.map(r => '<option value="r:'+r.id+'">'+esc(rotuloAssuntos(r))+' · '+D.br(r.data)+'</option>').join("") +
    '</optgroup>';
  return h + '<option value="__novo">＋ Criar novo grupo…</option>';
}
const rotuloSessao = r => rotuloAssuntos(r) + " · " + D.br(r.data);
const chipMembro = r => '<span class="tag" data-membro="'+esc(r.id)+'" data-rot="'+esc(rotuloSessao(r))+'">' +
  esc(rotuloSessao(r)) + '<button type="button" data-acao="remover-membro" ' +

/** editor do grupo: nome, conteúdos que ele reúne e de onde puxar mais */
function htmlPainelGrupo(alvo, v){
  if (!alvo) return '';
  const g = alvo.slice(0,2) === "g:" ? acharGrupo(alvo.slice(2)) : null;
  const base = alvo.slice(0,2) === "r:" ? acharRegistro(alvo.slice(2)) : null;
  const nome = g ? g.nome : base ? rotuloAssuntos(base) : "";
  const membros = g ? registrosDoGrupo(g.id).filter(r => r.id !== v.id) : base ? [base] : [];
  const dentro = new Set(membros.map(r => r.id));
  const fora = db.registros
    .filter(r => r.disciplina === v.disciplina && r.id !== v.id && !dentro.has(r.id) &&
                 planoDe(r) !== "sem" && (planoDe(r) !== "grupo" || (g && r.grupoId !== g.id)))
    .sort((a,b) => b.data.localeCompare(a.data)).slice(0, 30);
  const esta = rotuloAssuntos(v) || "esta sessão";
  return '<div class="grupo-editor">' +
    '<label class="campo" style="margin-bottom:10px"><span>Nome do grupo de revisão *</span>' +
      '<input name="grupoNome" id="grupoNome" value="'+esc(nome)+'" placeholder="LAI" autocomplete="off"></label>' +
    '<span class="rot-grupo">Conteúdos revisados juntos</span>' +
    '<div id="listaMembros" class="tags" style="margin:6px 0 9px">' +
      '<span class="tag fixo" title="A sessão que você está editando entra sempre no grupo">'+esc(esta)+' · esta sessão</span>' +
      membros.map(chipMembro).join("") + '</div>' +
    '<div class="linha" style="gap:7px;flex-wrap:nowrap">' +
      '<select id="addMembro" style="flex:1">' +
        '<option value="">Trazer outra sessão para o grupo…</option>' +
        fora.map(r => '<option value="'+esc(r.id)+'" data-rot="'+esc(rotuloSessao(r))+'">' +
                      esc(rotuloSessao(r)) + (planoDe(r) === "grupo" ? " (em outro grupo)" : "") + '</option>').join("") +
      '</select>' +
      '<button class="btn mini ghost" type="button" data-acao="add-membro">+ adicionar</button></div>' +
    '<span style="font-size:11.5px;color:var(--muted);margin-top:6px;display:block">' +
      'Integrar <b>não cria cards de revisão novos</b>: o conteúdo entra nos cards que já existem. ' +
      'O grupo tem um plano só, calculado pelo conteúdo mais frágil da lista — e o título dele ' +
      'também pode ser editado no card, na aba Revisões.</span></div>';
}
/* Revisões que ficaram para trás, num bloco só: é daqui que você remarca cada
   uma para hoje ou para a frente, guardando a data em que ela estava. */
function cardAtrasadas(det){
  const atrasadas = det.filter(x => x.status === "atrasada")
                       .sort((a,b) => a.rev.data.localeCompare(b.rev.data));
  if (!atrasadas.length) return "";
  return '<div class="card" id="revisoes-atrasadas">' +
    '<h2>Revisões atrasadas <span class="dica">' + atrasadas.length +
      (atrasadas.length === 1 ? " para remarcar" : " para remarcar") + '</span></h2>' +
    '<p class="sub">Ficaram para trás. Remarque para hoje ou para a frente — a data original fica registrada.</p>' +
    atrasadas.map(x => '<div class="item atrasada">' +
      '<div class="corpo"><div class="titulo">'+esc(x.ctx.rotulo)+'</div>' +
      '<div class="meta">'+esc(x.ctx.disciplina)+' · estava marcada para '+D.brFull(x.rev.data)+

/* ---------- editor do card de revisão (aba Revisões) ----------
   O título do card é o nome do grupo: dar um título a um card que ainda não é
   integrado transforma a sessão num grupo, e daí em diante dá para ver e mexer
   nos conteúdos ligados a ele.                                              */
function abrirEditorCard(chave){
  const itens = db.revisoes.filter(r => chaveCard(r) === chave);
  if (!itens.length) return;
  const ctx = contextoRevisao(itens[0]); if (!ctx) return;
  const g = ctx.grupo, disc = ctx.disciplina;
  const membros = g ? registrosDoGrupo(g.id)
                    : [...new Set(itens.map(r => r.registroId).filter(Boolean))]
                        .map(acharRegistro).filter(Boolean);
  const dentro = new Set(membros.map(r => r.id));
  const fora = db.registros
    .filter(r => r.disciplina === disc && !dentro.has(r.id) && planoDe(r) !== "sem")
    .sort((a,b) => b.data.localeCompare(a.data)).slice(0, 30);
  abrirModal("Editar card de revisão",
    '<div class="grupo-editor" data-chave="'+esc(chave)+'" style="margin-top:0">' +
      '<label class="campo"><span>Título do card *</span>' +
        '<input id="tituloCard" value="'+esc(ctx.rotulo)+'" placeholder="LAI" autocomplete="off"></label>' +
      '<span class="rot-grupo" style="margin-top:11px">Conteúdos revisados neste card</span>' +
      '<div id="listaMembros" class="tags" style="margin:6px 0 9px">' +
        (membros.length ? membros.map(chipMembro).join("")
                        : '<span class="tag fixo">nenhuma sessão ligada</span>') + '</div>' +
      '<div class="linha" style="gap:7px;flex-wrap:nowrap">' +
        '<select id="addMembro" style="flex:1"><option value="">Ligar outra sessão a este card…</option>' +
          fora.map(r => '<option value="'+esc(r.id)+'" data-rot="'+esc(rotuloSessao(r))+'">' +
                        esc(rotuloSessao(r)) + (planoDe(r) === "grupo" ? " (em outro card)" : "") + '</option>').join("") +
        '</select>' +
        '<button class="btn mini ghost" type="button" data-acao="add-membro">+ adicionar</button></div>' +
      '<p class="sub" style="margin:10px 0 0">As revisões que já estão marcadas continuam como estão — o ' +
        'conteúdo ligado entra <b>nos cards que já existem</b>, sem abrir fila nova. Tirar uma sessão daqui ' +
        'não recria o plano individual dela.</p>' +
      '<div class="linha acoes-form" style="margin-top:12px">' +
        '<button class="btn" type="button" data-acao="salvar-card">Salvar card</button>' +
        '<button class="btn ghost" type="button" data-acao="fechar-modal">Cancelar</button>' +
        '<span class="erro-form" id="erroCard"></span></div></div>');
}
function salvarCard(){
  const raiz = document.querySelector("#modalCorpo .grupo-editor"); if (!raiz) return;
  const erro = document.getElementById("erroCard");
  const titulo = (raiz.querySelector("#tituloCard").value || "").trim();
  const ids = [...raiz.querySelectorAll("[data-membro]")].map(x => x.dataset.membro);
  if (!titulo){ erro.textContent = "Dê um título ao card."; return; }
  if (!ids.length){ erro.textContent = "O card precisa de pelo menos um conteúdo ligado."; return; }
  const itens = db.revisoes.filter(r => chaveCard(r) === raiz.dataset.chave);
  const ctx = itens.length ? contextoRevisao(itens[0]) : null;
  if (!ctx){ fecharModal(); return; }

  const g = ctx.grupo || criarGrupo(titulo, ctx.disciplina);
  g.nome = titulo;
  // revisões avulsas deste card passam a ser do grupo, para o título valer para elas também
  itens.forEach(r => { if (!r.registroId && !r.grupoId){ r.grupoId = g.id; r.integrada = true; } });
  const antes = registrosDoGrupo(g.id).map(r => r.id);
  const outros = new Set();                     // grupos que perderam sessões para este
  ids.forEach(id => {
    const m = acharRegistro(id); if (!m) return;
    if (m.grupoId && m.grupoId !== g.id) outros.add(m.grupoId);
    entrarNoGrupo(m, g.id);
  });
  antes.filter(id => ids.indexOf(id) < 0).forEach(id => {
    const m = acharRegistro(id); if (m) sairDoGrupo(m);
  });
  gerarRevisoesGrupo(g.id, { base: D.hoje() });
  outros.forEach(id => gerarRevisoesGrupo(id));
  limparGrupos(); persistir(); fecharModal(); render();
  toast("Card “" + titulo + "” salvo — " + registrosDoGrupo(g.id).length + " conteúdo(s) ligado(s).");
}

/** troca o painel quando o destino muda — sem redesenhar a tela (preserva o que já foi digitado) */
function atualizarPainelGrupo(){
  const f = document.getElementById("formRegistro"); if (!f) return;
  const cx = f.querySelector("#cxIntegrado"), sel = f.querySelector("#grupoAlvo"),
        painel = f.querySelector("#painelGrupo");
  if (!cx || !sel || !painel) return;
  sel.hidden = !cx.checked;
  painel.innerHTML = cx.checked ? htmlPainelGrupo(sel.value === "__novo" ? "__novo" : sel.value, registroDoForm(f)) : "";
  const nome = painel.querySelector("#grupoNome");
  if (nome && sel.value === "__novo") nome.focus();
}
/** o que o formulário tem agora (para o painel saber a disciplina e o nome da sessão) */
function registroDoForm(f){
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  return { id: ed ? ed.id : "", disciplina: disciplinaDoForm(f), assuntos: lerAssuntosForm(f) };
}
/** lê a disciplina escolhida sem cadastrar nada (lerDisciplina cadastra) */
function disciplinaDoForm(f){
  const sel = f.querySelector("select.sel-disciplina");
  // na sessão de revisão a disciplina vem travada, num campo oculto
  if (!sel){ const oculto = f.querySelector('[name="disciplina"]'); return oculto ? oculto.value.trim() : ""; }
  if (sel.value === "__nova"){ const i = f.querySelector(".nova-disciplina"); return i ? i.value.trim() : ""; }
  return sel.value;
}
function adicionarMembroGrupo(botao){
  const raiz = (botao && botao.closest(".grupo-editor")) || document;
  const sel = raiz.querySelector("#addMembro"), lista = raiz.querySelector("#listaMembros");
  if (!sel || !lista || !sel.value) return;
  const reg = acharRegistro(sel.value);
  const vazio = lista.querySelector(".tag.fixo:only-child");
  if (vazio && !reg) return;
  if (reg){
    if (vazio && /nenhuma sessão/.test(vazio.textContent)) vazio.remove();
    lista.insertAdjacentHTML("beforeend", chipMembro(reg));
  }
  sel.querySelector('option[value="'+sel.value+'"]').remove();
  sel.value = "";
}
function removerMembroGrupo(botao){
  const chip = botao.closest("[data-membro]"); if (!chip) return;
  const raiz = botao.closest(".grupo-editor") || document;
  const sel = raiz.querySelector("#addMembro");

    '<option value="'+esc(chip.dataset.membro)+'" data-rot="'+esc(chip.dataset.rot)+'">'+esc(chip.dataset.rot)+'</option>');

function camposAssuntos(lista, rotulo, dica, travado, disciplina){
  // dica === "" desliga a linha de ajuda; travado = o conteúdo vem da revisão
  const ajuda = dica === undefined
    ? "Estudou mais de um conteúdo? Escolha um de cada vez. O que diferencia duas sessões " +
      "do mesmo conteúdo é a descrição."
    : dica;
  if (travado) return '<div class="campo largo"><span>'+esc(rotulo || "Conteúdos revisados")+'</span>' +
    '<div id="listaAssuntosForm" class="tags" style="margin-bottom:4px">' +
      (lista.length ? lista.map(a => '<span class="tag fixo" data-assunto="'+esc(a)+'">'+esc(a)+'</span>').join("")
                    : '<span class="tag fixo">escolha a revisão acima</span>') + '</div>' +
    '<span style="font-size:11.5px;color:var(--muted)">Vêm da revisão escolhida — para mudar, escolha outra revisão.</span></div>';
  /* Conteúdo não se digita mais: escolhe-se na lista da disciplina. O que
     diferencia duas sessões do mesmo conteúdo é a DESCRIÇÃO, não um nome
     ligeiramente diferente — era assim que nasciam "LAI", "LAI " e "Lei de
     acesso", três fichas para a mesma coisa.                                */
  const disc = disciplina || "";
  const doCadastro = conteudosDaDisciplina(disc);
  const jaNa = a => lista.some(x => x.toLowerCase() === a.nome.toLowerCase());
  const opcoes = doCadastro.filter(c => !jaNa(c))
    .map(c => '<option value="'+esc(c.nome)+'">'+esc(c.nome) +
              (c.fase === "concluido" ? " — concluído" : "") + '</option>').join("");
  return '<div class="campo largo"><span>'+esc(rotulo || "Conteúdos da sessão *")+'</span>' +
    '<div id="listaAssuntosForm" class="tags" style="margin-bottom:7px">' + lista.map(tagAssunto).join("") + '</div>' +
    '<div class="linha" style="gap:7px;flex-wrap:nowrap">' +
      '<select id="campoAssunto" style="flex:1">' +
        '<option value="">' +
          (opcoes ? "Escolha um conteúdo…"
                  : disc ? "Nenhum conteúdo cadastrado em " + esc(disc)
                         : "Escolha a disciplina para ver os conteúdos") + '</option>' +
        opcoes +
        '<option value="__novo">＋ Criar novo conteúdo</option>' +
      '</select>' +
      '<button class="btn mini ghost" type="button" data-acao="add-assunto">+ adicionar</button></div>' +
    '<input id="novoConteudoNome" class="nova-disciplina" hidden placeholder="Nome do novo conteúdo" style="margin-top:6px">' +
    (ajuda ? '<span style="font-size:11.5px;color:var(--muted);margin-top:4px">'+esc(ajuda)+'</span>' : '') +
    '</div>';
}
function adicionarAssuntoForm(){
  const inp = document.getElementById("campoAssunto"), lista = document.getElementById("listaAssuntosForm");
  if (!inp || !lista) return;
  const novoNome = document.getElementById("novoConteudoNome");
  const disc = disciplinaDoForm(inp.closest("form")) || "";
  let v = inp.value.trim();
  if (v === "__novo"){                                   // criar ficha nova, ali mesmo
    const nome = novoNome ? novoNome.value.trim() : "";
    if (!nome){ if (novoNome){ novoNome.hidden = false; novoNome.focus(); } return; }
    // disciplina ainda não existe (está sendo criada agora): a ficha nasce no salvamento
    if (disc){ registrarConteudo(disc, nome); persistir(); }
    v = nome;
    if (novoNome){ novoNome.value = ""; novoNome.hidden = true; }
  }
  if (!v){ inp.focus(); return; }
  const jaTem = [...lista.querySelectorAll("[data-assunto]")].some(x => x.dataset.assunto.toLowerCase() === v.toLowerCase());
  if (!jaTem){
    lista.insertAdjacentHTML("beforeend", tagAssunto(v));
    const op = [...inp.options].find(o => o.value.toLowerCase() === v.toLowerCase());
    if (op) op.remove();                                  // sai da lista: já está na sessão
  }
  inp.value = ""; inp.focus();
}
/** lê as etiquetas + o que estiver digitado e ainda não foi adicionado */
function lerAssuntosForm(form){
  const out = [...form.querySelectorAll("#listaAssuntosForm [data-assunto]")].map(x => x.dataset.assunto);
  const inp = form.querySelector("#campoAssunto");
  let pendente = inp ? inp.value.trim() : "";
  if (pendente === "__novo"){                       // escolheu criar e esqueceu de adicionar
    const nome = form.querySelector("#novoConteudoNome");
    pendente = nome ? nome.value.trim() : "";
  }
  if (pendente && !out.some(a => a.toLowerCase() === pendente.toLowerCase())) out.push(pendente);
  return out;
}
function registrosFiltrados(){
  const hoje = D.hoje();
  let lista = db.registros.slice();
  if (ui.fDisciplina) lista = lista.filter(r => r.disciplina === ui.fDisciplina);
  if (ui.fTipo === "estudo")   lista = lista.filter(r => !ehRevisaoSessao(r));
  if (ui.fTipo === "revisao")  lista = lista.filter(r => r.tipo === "revisao");
  if (ui.fTipo === "misto")    lista = lista.filter(r => r.tipo === "misto");
  if (ui.fTipo === "revisoes") lista = lista.filter(r => ehRevisaoSessao(r));
  if (ui.fPeriodo === "7")  lista = lista.filter(r => D.dif(r.data, hoje) <= 7 && r.data <= hoje);
  if (ui.fPeriodo === "30") lista = lista.filter(r => D.dif(r.data, hoje) <= 30 && r.data <= hoje);
  if (ui.fPeriodo === "futuro") lista = lista.filter(r => r.data >= hoje);
  if (ui.fBusca){
    const q = ui.fBusca.toLowerCase();
    lista = lista.filter(r => (assuntosDe(r).join(" ")+" "+r.disciplina+" "+(r.anotacoes||"")).toLowerCase().includes(q));
  }
  const ordens = {
    "data-desc": (a,b) => b.data.localeCompare(a.data),
    "data-asc":  (a,b) => a.data.localeCompare(b.data),
    "dificuldade-desc": (a,b) => dificuldadeDe(b) - dificuldadeDe(a),
    "tempo-desc": (a,b) => (b.minutos||0) - (a.minutos||0)
  };
  return lista.sort(ordens[ui.fOrdem] || ordens["data-desc"]);
}

/* ---------- TELA: QUESTÕES ---------- */
function barraAcerto(taxa){
  if (taxa === null) return '<span class="meta">—</span>';
  const cor = taxa >= CONFIG.TAXA_ATENCAO ? "var(--bom)" : taxa >= CONFIG.TAXA_CRITICA ? "var(--alerta)" : "var(--critico)";
  return '<div class="acerto"><div class="acerto-barra"><i style="width:'+taxa+'%;background:'+cor+'"></i></div>' +
         '<b class="num">'+taxa+'%</b></div>';
}

/* Agrupamento das questões — segue a regra da integração:
   cada grupo de revisão vira um bloco único; o resto fica por conteúdo. */
function assuntosIntegrados(){
  const mapa = new Map();                       // disciplina -> Set(assuntos que estão em algum grupo)
  db.registros.filter(r => planoDe(r) === "grupo").forEach(r => {
    if (!mapa.has(r.disciplina)) mapa.set(r.disciplina, new Set());
    assuntosDe(r).forEach(a => mapa.get(r.disciplina).add(a));
  });
  return mapa;
}
function linhasPorConteudo(){
  const integrados = assuntosIntegrados();
  const linhas = [];
  (db.grupos || []).forEach(g => {
    const conteudos = assuntosDoGrupo(g.id);
    if (!conteudos.length) return;
    const lista = conteudos.map(a => estatAssunto(g.disciplina, a));
    const questoes = lista.reduce((t,e) => t + e.questoes, 0);
    const acertos  = lista.reduce((t,e) => t + e.acertos, 0);
    linhas.push({ nome: g.nome, sub: conteudos.join(" · "), integrada: true,
                  questoes, acertos, taxa: pct(acertos, questoes) });
  });
  assuntos().forEach(a => {
    const set = integrados.get(a.disciplina);
    if (set && set.has(a.assunto)) return;      // já contabilizado no bloco do grupo
    const e = estatAssunto(a.disciplina, a.assunto);
    linhas.push({ nome: a.assunto, sub: a.disciplina, questoes: e.questoes, acertos: e.acertos, taxa: e.taxa });
  });
  return linhas;
}
function linhasPorDisciplina(){
  const integrados = assuntosIntegrados();
  return disciplinas().map(d => {
    const e = estatDisciplina(d);
    return { nome: d, integrada: integrados.has(d),
             sub: e.conteudos + (e.conteudos === 1 ? " conteúdo" : " conteúdos"),
             questoes: e.questoes, acertos: e.acertos, taxa: e.taxa };
  });
}

function telaQuestoes(){
  const geral = totalQuestoes();
  const itens = geral.itens;
  if (!itens.length){
    return '<div class="vazio" style="margin-bottom:12px"><strong>Nenhuma questão registrada ainda</strong>' +
      'As questões entram pelo formulário de <b>Registrar sessão</b>, ao concluir uma revisão, ' +
      'ou pelo botão abaixo, ligadas a uma sessão já registrada. ' +
      'Nem toda sessão precisa ter questões — em assunto novo, é normal só estudar.</div>' +
      (db.registros.length ? botaoLancarQuestoes() : '');
  }
  const inicioSemana = D.soma(D.hoje(), -6);
  const semana = totalQuestoes(itens.filter(x => x.data >= inicioSemana && x.data <= D.hoje()));

  let h = '<div class="tiles" style="margin-bottom:14px">' +
    tile("Questões feitas", String(geral.questoes), geral.erros + " erros · " + itens.length + " lançamentos") +
    tile("Taxa de acerto", geral.taxa === null ? "—" : geral.taxa + "%", geral.acertos + " acertos",
         "", tomTaxa(geral.taxa)) +
    tile("Na última semana", String(semana.questoes),
         semana.taxa === null ? "sem questões nos últimos 7 dias" : semana.taxa + "% de acerto") +
    tile("Dias com questões", String(new Set(itens.map(x => x.data)).size), "de estudo registrado") +
  '</div>';
  // o botão vem depois dos indicadores: primeiro o retrato, depois a ação
  if (db.registros.length) h += botaoLancarQuestoes();

  // ----- agrupamento por conteúdo ou por disciplina
  const porConteudo = ui.qVisao === "conteudo";
  h += '<div class="card"><h2>Desempenho por ' + (porConteudo ? "conteúdo" : "disciplina") + '</h2>' +
    '<p class="sub">Ordenado pela pior taxa de acerto — é por onde começar a revisar.</p>' +
    '<div class="linha" style="margin-bottom:12px"><span class="hl-tema">Agrupar por:</span>' +
      '<button class="aba" data-acao="q-visao" data-visao="disciplina" aria-selected="'+(!porConteudo)+'">Disciplina</button>' +
      '<button class="aba" data-acao="q-visao" data-visao="conteudo" aria-selected="'+porConteudo+'">Conteúdo</button>' +
    '</div>';

  const linhas = porConteudo ? linhasPorConteudo() : linhasPorDisciplina();
  const comQuestoes = linhas.filter(l => l.questoes > 0)
    .sort((a,b) => (a.taxa ?? 101) - (b.taxa ?? 101));

  if (!comQuestoes.length){
    h += '<div class="vazio">Ainda não há questões registradas neste agrupamento.</div>';
  } else {
    h += '<div class="tab-rolagem"><table><thead><tr>' +
      '<th>'+(porConteudo ? "Conteúdo" : "Disciplina")+'</th><th class="num">Questões</th>' +
      '<th class="num">Acertos</th><th class="num">Erros</th><th>Taxa de acerto</th></tr></thead><tbody>' +
      comQuestoes.map(l => '<tr><td><b style="font-weight:550">'+esc(l.nome)+'</b>' +
        '<div class="meta">'+esc(l.sub)+'</div></td>' +
        '<td class="num">'+l.questoes+'</td><td class="num">'+l.acertos+'</td>' +
        '<td class="num">'+(l.questoes - l.acertos)+'</td>' +
        '<td style="min-width:170px">'+barraAcerto(l.taxa)+'</td></tr>').join("") +
      '</tbody></table></div>';
    const semQuestoes = linhas.filter(l => !l.questoes).map(l => l.nome);
    if (semQuestoes.length)
      h += '<p class="sub" style="margin-top:12px">Sem questões ainda: ' + esc(semQuestoes.join(" · ")) + '</p>';
  }
  h += '</div>';

  // ----- de onde vieram as questões
  h += '<div class="card"><h2>Lançamentos <span class="dica">'+itens.length+' no total</span></h2>' +
    '<div class="tab-rolagem"><table><thead><tr><th>Data</th><th>Disciplina</th><th>Conteúdo</th>' +
    '<th>Origem</th><th class="num">Questões</th><th class="num">Acertos</th><th class="num">%</th>' +
    '<th></th></tr></thead><tbody>' +
    itens.slice(0, 40).map(x => '<tr><td class="num">'+D.br(x.data)+'</td><td>'+esc(x.disciplina)+'</td>' +
      '<td>'+esc(x.rotulo)+'</td>' +
      '<td><span class="badge'+(x.tipo === "sessão" ? " b-bom" : x.tipo === "questões" ? " b-alerta" : "")+'">'+x.tipo+'</span></td>' +
      '<td class="num">'+x.questoes+'</td><td class="num">'+x.acertos+'</td>' +
      '<td class="num">'+(pct(x.acertos, x.questoes) ?? "—")+'%</td>' +
      '<td class="acoes-linha">' + (x.lancamento
        ? '<button class="act" data-acao="editar-lancamento" data-id="'+x.lancamento.id+'">editar</button>' +

        : '') + '</td></tr>').join("") +
    '</tbody></table></div>' +
    (itens.length > 40 ? '<p class="sub" style="margin-top:10px">Mostrando os 40 mais recentes.</p>' : '') +
    '</div>';
  return h;
}

/* ---------- TELA: ROTINA DE REVISÕES ---------- */
function telaRevisoes(){
  const det = revisoesDetalhadas();
  const pendentes = det.filter(x => !x.rev.feita);
  const atrasadas = det.filter(x => x.status === "atrasada");
  const feitas = det.filter(x => x.rev.feita);
  const dias = diasParaProva();

  let h = '<div class="tiles" style="margin-bottom:16px">' +
    tile(semProva() ? "Revisões à frente" : "Faltam até a prova", String(pendentes.length), "revisões agendadas", "", "accent") +
    tile("Atrasadas", String(atrasadas.length), atrasadas.length ? "⚠ resolva hoje" : "✓ em dia",
         "", atrasadas.length ? "critico" : "bom") +
    tile("Já revisadas", String(feitas.length), "de " + det.length + " no total", "", feitas.length ? "bom" : "") +
    (semProva()
      ? tile("Ritmo", "Contínuo", "sem data de prova marcada", "", "accent")
      : tile("Contagem regressiva", (dias > 0 ? dias + (dias===1?" dia":" dias") : "—"), "até " + D.brFull(db.dataProva),
             "", dias <= 7 ? "critico" : "accent")) + '</div>';

  /* O que é para hoje vem primeiro, igual à aba Hoje: quem abre esta aba quer
     saber o que fazer agora, não percorrer o cronograma inteiro. As atrasadas
     continuam no card próprio, mais abaixo — aqui só entra a contagem delas. */
  /* Tudo o que tem a data de hoje: o que falta, o que está sendo cronometrado
     agora e o que já foi concluído hoje — inclusive revisão que estava marcada
     para outro dia e foi cumprida hoje. */
  const agora = D.hoje();
  const deHoje = det.filter(x => x.rev.data === agora ||
                                 (x.rev.feita && (x.rev.feitaEm || x.rev.data) === agora));
  const peso = x => emAndamento(x.rev) ? 0 : x.rev.feita ? 2 : 1;   // em andamento, pendente, feita
  deHoje.sort((a,b) => peso(a) - peso(b) || a.rev.data.localeCompare(b.rev.data));
  const nFeitasHoje = deHoje.filter(x => x.rev.feita).length;
  const nAbertas = deHoje.length - nFeitasHoje;
  h += '<div class="card"><h2>Revisões de hoje ' +
       '<span class="dica">' + D.extenso(agora) +
       (deHoje.length ? ' · ' + nAbertas + ' em aberto · ' + nFeitasHoje + ' concluída(s)' : '') +
       '</span></h2>';
  if (!deHoje.length){
    h += '<div class="vazio"><strong>Nada marcado para hoje</strong>' +
         (atrasadas.length
           ? 'Mas há ' + atrasadas.length + (atrasadas.length === 1 ? ' revisão atrasada' : ' revisões atrasadas') +
             ' — o card logo abaixo traz o que ficou para trás.'
           : 'O cronograma abaixo mostra o que vem pela frente.') + '</div>';
  } else {
    h += '<p class="sub">Marque como feita para registrar a sessão que a cumpriu' +
         (atrasadas.length ? ' · <b>' + atrasadas.length + '</b> atrasada(s) no card abaixo' : '') + '.</p>';
    h += deHoje.map(x => itemRevisao(x, rotuloDeHoje(x, agora))).join("");
  }
  h += '</div>';

  // o formulário de revisão abre numa tela sobreposta, não aqui dentro
  h += '<button class="btn-add" data-acao="nova-revisao"><span class="mais">+</span> Adicionar revisão' +
       '<span class="pista">que eu fiz ou quero fazer</span></button>';

  // agrupa por assunto (sessão de estudo ou revisão avulsa)
  const grupos = new Map();
  det.forEach(x => {
    const k = chaveCard(x.rev);
    if (!grupos.has(k)) grupos.set(k, { chave: k, disciplina: x.ctx.disciplina, assunto: x.ctx.rotulo,
                                        integrada: x.ctx.integrada, sub: x.ctx.sub,
                                        primeiro: x.ctx.assuntos[0] || "", ctx: x.ctx, itens: [] });
    grupos.get(k).itens.push(x);
  });

  if (!grupos.size){
    return h + '<div class="vazio"><strong>Nenhuma revisão agendada ainda</strong>' +
      'Registre uma sessão na aba “Sessões” — o plano é montado automaticamente — ou use o botão acima para lançar uma revisão à mão.</div>';
  }

  // ordena: assunto com revisão atrasada/pior taxa primeiro
  const ordenados = [...grupos.values()].map(g => {
    const est = estatContexto(g.ctx);
    const temAtraso = g.itens.some(x => x.status === "atrasada");
    return { g, est, temAtraso };
  }).sort((a,b) => (b.temAtraso - a.temAtraso) || ((a.est.taxa ?? 999) - (b.est.taxa ?? 999)));

  h += '<div class="card"><h2>Revisão por assunto <span class="dica">marque cada dia revisado</span></h2>' +
       '<p class="sub">Assuntos com pior desempenho aparecem primeiro e recebem mais revisões.</p>';
  // com muitos assuntos a tela vira uma parede: mostra os primeiros (os mais
  // urgentes, porque a ordenação já põe atraso e pior taxa na frente) e guarda
  // o resto atrás do "+".
  const visiveis = ui.verTodosAssuntos ? ordenados : ordenados.slice(0, CONFIG.ASSUNTOS_VISIVEIS);
  h += visiveis.map(({g, est, temAtraso}) => {
    const itens = g.itens.slice().sort((a,b) => a.rev.data.localeCompare(b.rev.data));
    // o dono do card diz a fase: aberto = voltas; fechado = escada de revisões
    const dono = donoDaRevisao(g.itens[0].rev);
    const aberto = conteudoAberto(dono);
    const desde = dono ? D.dif(dono.concluidoEm || dono.data || D.hoje(), D.hoje()) : 0;
    return '<div class="grupo-rev'+(temAtraso ? " tem-atraso" : "")+(aberto ? " aberto" : "")+'">' +
      '<div class="linha cab"><strong>'+esc(g.assunto)+'</strong>' +
      (g.integrada ? '<span class="badge b-bom">plano integrado</span><span class="badge">'+esc(g.sub)+'</span>'
                   : '<span class="badge">'+esc(g.disciplina)+'</span>') +
      (aberto ? '<span class="badge b-misto" title="A agenda está chamando para voltar ao assunto, não para revisar">' +
                'em andamento' + (desde >= CONFIG.AVISO_ABERTO_DIAS ? ' · há ' + desde + ' dias' : '') + '</span>' : '') +
      (temAtraso ? '<span class="badge b-critico">tem atraso</span>' : '') +
      '<span class="spacer"></span>' +
      '<button class="act'+(aberto && desde >= CONFIG.AVISO_ABERTO_DIAS ? " destaque" : "")+'" ' +
        'data-acao="'+(aberto ? "concluir-conteudo" : "reabrir-conteudo")+'" ' +
        'data-disc="'+esc(g.disciplina)+'" data-conts="'+esc(g.ctx.assuntos.join("|"))+'" ' +
        'title="'+(aberto ? "Vale para todas as sessões deste conteúdo: começa a repetição espaçada"
                          : "Volta a ser conteúdo em andamento, em todas as sessões")+'">' +
        (aberto ? "✓ terminei este conteúdo" : "↩ reabrir conteúdo") + '</button>' +
      '<button class="act" data-acao="nova-revisao" data-disc="'+esc(g.disciplina)+'" data-ass="'+esc(g.ctx.assuntos.join("|"))+'">+ revisão</button>' +
      '<button class="act" data-acao="editar-card" data-card="'+esc(g.chave)+'">✎ editar card</button>' +
      '<button class="act" data-acao="ver-erros" data-disc="'+esc(g.disciplina)+'" data-ass="'+esc(g.primeiro)+'">pontos importantes →</button></div>' +
      itens.map(linhaRevisao).join("") + '</div>';
  }).join("");
  if (ordenados.length > CONFIG.ASSUNTOS_VISIVEIS){
    h += '<button class="act ver-mais" data-acao="toggle-assuntos">' +
         (ui.verTodosAssuntos ? "− mostrar menos"
                              : "+ ver todos os " + ordenados.length + " assuntos") + '</button>';
  }
  h += '</div>' + cardAtrasadas(det) + '<div class="card">' +
    '<details class="ajuda"><summary>Como o cronograma é montado?</summary><p>' +
    (semProva()
      ? 'Sem data de prova, as revisões seguem os intervalos crescentes clássicos da repetição espaçada — ' +
        'cerca de D+' + CONFIG.INTERVALOS_LIVRES.slice(0,4).join(', D+') + ' — contados a partir do estudo. '
      : 'Como faltam poucas semanas, o clássico D+1/D+7/D+30 não cabe. O sistema distribui de 1 a 3 revisões ' +
        'entre a data do estudo e ' + D.brFull(ultimoDiaRevisao()) + ', com intervalos crescentes (repetição espaçada comprimida). ') +
    'Quanto maior a <b>dificuldade</b> do assunto (e quanto pior a taxa de acerto), mais revisões ele recebe e mais cedo elas começam — Sistema Leitner. ' +
    'O teto vem do tempo que ainda resta: com ' + capacidadeDeRevisoes(D.dif(D.hoje(), ultimoDiaRevisao())) + ' cabendo hoje, é esse o máximo por assunto.' +
    '</p></details></div>';
  return h;
}

/* ---------- linha e formulário de revisão ---------- */
function linhaRevisao(x){
  const rev = x.rev;
  const rot = { feita:"revisada em "+(rev.feitaEm ? D.br(rev.feitaEm) : D.br(rev.data)),
                atrasada:"atrasada desde "+D.extenso(rev.data),
                hoje:"hoje — "+D.extenso(rev.data), futura:D.extenso(rev.data) }[x.status];
  const num = numerosDaRevisao(rev);           // tempo e questões vêm da sessão
  const partes = [];
  if (num.minutos) partes.push(hhmm(num.minutos));
  if (num.questoes) partes.push(num.acertos+"/"+num.questoes+" questões");
  if (rev.dataOriginal) partes.push("estava marcada para " + D.br(rev.dataOriginal));
  const extra = partes.length ? " · " + partes.join(" · ") : "";
  const nome = nomeRevisao(rev);
  return '<div class="item rev-linha '+x.status+'">' +
    '<div class="rev-topo">' +
      '<button class="check" role="checkbox" aria-checked="'+rev.feita+'" data-acao="'+(rev.feita?"reabrir":"concluir")+'" data-id="'+rev.id+'" ' +
      'title="'+(rev.feita?"Desmarcar":"Confirmar que revisei")+'">✓</button>' +
      '<div class="corpo"><div class="titulo" style="font-size:13.5px">' +
        esc(nome) + ' — ' + esc(rot) + '</div>' +
      '<div class="meta">'+ (rev.feita ? "concluída"+extra : "planejada para "+D.brFull(rev.data)+extra) +
        // com nome próprio, a posição na sequência sai do título e vai para cá
        (rev.rotulo && ordemVisivel(rev) ? ' · ' + ordemVisivel(rev) + 'ª da sequência' : '') +
        '</div></div>' +
      (rev.sessaoId ? '<button class="act" data-acao="abrir-sessao" data-id="'+esc(rev.sessaoId)+'" ' +
        'title="As horas ficam na sessão — clique para editá-las">ver sessão</button>' : '') +
      '<button class="act" data-acao="editar-revisao" data-id="'+rev.id+'">editar</button>' +
    '</div>' + descricaoAtividade(rev) + '</div>';
}
