  reg.plano = ehTipoRevisao(tipo) ? "sem"
            : (anterior && ehTipoRevisao(anterior.tipo)) ? "sem"   // virou estudo: segue sem plano
            : dado.semRevisao ? "sem"
            : planoAntes === "sem"   ? "individual"         // voltar a ter revisões
            : planoAntes;
  registrarDisciplina(reg.disciplina);
  /* Cadastro dos conteúdos — só dos que ENTRARAM agora. O nome que a sessão já
     tinha e não tem mais ficha é de um conteúdo EXCLUÍDO: recriar a ficha aqui
     o trazia de volta (com agenda) só por você ter corrigido a descrição. */
  const jaTinha = new Set(anterior && anterior.disciplina === reg.disciplina
                          ? assuntosDe(anterior).map(a => a.toLowerCase()) : []);
  listaAssuntos.forEach(a => { if (!jaTinha.has(a.toLowerCase())) registrarConteudo(reg.disciplina, a); });

  if (anterior && anterior.tipo === "estudo" && ehTipoRevisao(tipo)){
    db.revisoes = db.revisoes.filter(r => r.registroId !== reg.id);   // o plano dela deixa de existir
  }
  // o vínculo é declarado ANTES de gerar o plano: a volta que esta sessão vem
  // fechar não pode ser confundida com a volta em aberto que a continuação move
  if (revAlvo) reg.revisaoId = revAlvo.id;
  /* os cards marcados em "Estudar junto" também vão antes (cumprirJuntas os
     confirma lá embaixo): sem isso, salvar dava ao conteúdo que foi junto a
     dificuldade da sessão — a do card principal — e refazia a escada dele */
  const juntasAntes = ((anterior && anterior.juntasIds) || []).slice();
  if (revAlvo && juntarIds.length) reg.juntasIds = juntarIds.slice();
  const planoMudou = salvarRegistro(reg);
  /* a ficha de cada conteúdo guarda a dificuldade de agora — o conteúdo criado
     nesta sessão chega à aba Disciplinas com a escolhida aqui */
  listaAssuntos.forEach(a => { const fc = acharConteudo(reg.disciplina, a); if (fc) fc.dificuldade = dificuldadeDaFicha(fc); });
  // vínculo com a revisão: marca a caixa dela, ou solta se deixou de ser revisão
  const salvo = acharRegistro(reg.id);
  if (revAlvo){
    const cumpridasAntes = new Map(juntasAntes.map(acharRevisao).filter(r => r && r.sessaoId === salvo.id)
                                              .map(r => [r.id, r.feitaEm]));
    ligarSessaoRevisao(salvo, revAlvo);
    // os outros conteúdos da sessão cumprem o item deles; o próximo nasce daqui, como no resolverLembrete
    if (cumprirJuntas(salvo, juntasAntes, juntarIds) && !ehRevisaoSessao(salvo) && planoDe(salvo) !== "sem")
      gerarRevisoes(salvo, { base: salvo.data });
    manterJuntasDoPassado(salvo, cumpridasAntes);
  }
  else if (anterior && anterior.revisaoId) desligarSessaoRevisao(salvo);
  else resolverLembrete(salvo, juntarIds);   // estudou o conteúdo? o lembrete vencido se dá por cumprido
  /* Sessão de conteúdo CONCLUÍDO é contato — cumprindo item da agenda (em dia,
     atrasado ou adiantado) ou fora dela: a escada anda a partir deste dia.
     Só quando a sessão é nova ou mudou de dia ou de conteúdo: corrigir a
     descrição não é estudar de novo. */
  if (!anterior || anterior.data !== salvo.data || chaveSessao(anterior) !== chaveSessao(salvo))
    contatoComConteudos(conteudosDoAlvo(salvo), salvo.data);
  /* Trocar um conteúdo por outro na sessão deixou de significar "renomeei":
     os nomes vêm do cadastro, e renomear de verdade se faz na aba
     Disciplinas, que já propaga para tudo. A pergunta antiga
     ("LAI virou Licitações?") agora só confundiria.                        */
  if (divisao) criarContinuacoes(salvo, divisao);   // o cronômetro passou da meia-noite e você dividiu
  garantirAgenda();              // aberto sem volta ou fechado sem escada: não fica
  persistir();
  // veio do cronômetro ("Nova sessão"): a próxima medição já soma nesta sessão, que é a de hoje
  if (!anterior && ui.prefill && ui.prefill.inicio && salvo.data === D.hoje()) ui.cronoDestino = "registro:" + salvo.id;
  ui.editandoRegistro = null; ui.prefill = null; ui.formAberto = false; ui.ligarRevisao = "";
  const resumo = resumoDaAgenda(salvo);
  render();
  /* A mensagem conta o que ACONTECEU, não quantas revisões a sessão tem — e diz
     o que existe de verdade para os conteúdos dela: conteúdo em andamento tem a
     próxima RETOMADA; concluído tem a escada de REVISÕES. Antes chamava tudo de
     "revisão" e mostrava o horizonte ("até dd/mm"), o que num conteúdo em
     andamento dava a impressão de uma escada que não existe. */
  const semAuto = !agendaAutomatica() ? " — o agendamento automático está desligado." : ".";
  toast(!anterior ? "Sessão registrada" + (resumo ? " · " + resumo + "." : semAuto)
      : !planoMudou ? "Alterações salvas — a agenda continua a mesma."
      : "Alterações salvas · agenda atualizada" + (resumo ? ": " + resumo + "." : semAuto));
}
/** o que a agenda tem para os conteúdos da sessão: a próxima retomada e as revisões */
function resumoDaAgenda(reg){
  const fichas = conteudosDoAlvo(reg);
  const pend = db.revisoes.filter(r => !r.feita && fichas.some(f => falaDe(r, chaveDaFicha(f)))).sort(porData);
  const voltas = pend.filter(ehRetomada), revs = pend.filter(r => !ehRetomada(r));
  const quando = dt => D.semana(dt) + ", " + D.br(dt);
  const partes = [];
  if (voltas.length) partes.push("continuar " + quando(voltas[0].data));
  if (revs.length) partes.push(revs.length + (revs.length === 1 ? " revisão na agenda" : " revisões na agenda") +
                               ", a próxima " + quando(revs[0].data));
  return partes.join(" · ");
}

function abrirModal(titulo, html, apos, grande){
  $("#modalTitulo").textContent = titulo;
  $("#modalCorpo").innerHTML = html;
  $("#modalCaixa").classList.toggle("grande", !!grande);
  destacarRodape();
  $("#overlay").hidden = false;
  document.body.style.overflow = "hidden";     // a página de trás não rola junto
  if (apos) apos();
  const primeiro = $("#modalCorpo").querySelector("input,select,textarea,button");
  if (primeiro) primeiro.focus();
}
/* Tira a barra de ações de dentro do miolo que rola e a prende no pé da caixa.
   Os botões continuam pertencendo ao formulário pelo atributo `form=`, então
   submit, cancelar e excluir seguem funcionando de onde estão.               */
function destacarRodape(){
  const caixa = $("#modalCaixa"), corpo = $("#modalCorpo");
  limparRodape();
  const acoes = corpo.querySelector(".acoes-form");
  if (!acoes) return;
  const form = acoes.closest("form");
  if (form && form.id){
    acoes.querySelectorAll("button").forEach(b => { if (!b.hasAttribute("form")) b.setAttribute("form", form.id); });
  }
  caixa.appendChild(acoes);
  caixa.classList.add("com-rodape");
}
function limparRodape(){
  const caixa = $("#modalCaixa");
  caixa.querySelectorAll(":scope > .acoes-form").forEach(el => el.remove());
  caixa.classList.remove("com-rodape");
}
/** fecha a caixa sem mexer no estado (usado de dentro do próprio render) */
function esconderModal(){
  $("#overlay").hidden = true;
  limparRodape();
  $("#modalCorpo").innerHTML = "";
  $("#modalCaixa").classList.remove("grande");
  document.body.style.overflow = "";
}
/** fechar pelo ✕, pelo fundo ou pelo Esc também cancela a edição em curso */
function fecharModal(){
  const eraForm = !!telaForm;
  telaForm = null;
  esconderModal();
  if (eraForm){
    ui.editandoRegistro = null; ui.editandoRevisao = null; ui.editandoLancamento = null;
    ui.editandoErro = null; ui.editandoTarefa = null;                       // a edição da anotação mora aqui também
    ui.prefRevisao = null; ui.formAberto = false; ui.ligarRevisao = "";
    render();
  }
}

/* Marcar a revisão como feita = registrar a sessão que a cumpriu. Em vez de um
   modal que guardava números na própria revisão, abre a tela de sessão já com o
   tipo Revisão e ela escolhida — as horas passam a morar num lugar só.       */
function registrarRevisao(rev){
  if (!rev) return;
  /* Já existe uma sessão DESTE conteúdo hoje? Então é nela que o tempo entra —
     abrir uma segunda com o mesmo nome era o que duplicava a lista. A sessão
     existente é aberta para edição, já apontando para esta revisão. */
  const ctx = contextoRevisao(rev);
  const jaHa = ctx ? sessaoDoDia(ctx, D.hoje(), rev.id) : null;
  if (jaHa){
    ui.ligarRevisao = rev.id;
    ui.editandoRegistro = jaHa.id; ui.formAberto = false; ui.foco = null;   // sem trocar de aba
    redesenharTelaForm();
    toast("Esta sessão de hoje já é deste conteúdo — o tempo entra nela.");
    return;
  }
  /* O que você escreveu no item da agenda ("refazer as 10 questões da aula 3")
     é a instrução da sessão que vai cumpri-lo — então ela nasce com aquilo na
     descrição, em vez de você reescrever ou perder o combinado. */
  ui.prefill = { data: D.hoje(), tipo: ehRetomada(rev) ? "estudo" : "revisao", revisaoId: rev.id,
                 disciplina: "", assuntos: [], minutos: "", questoes: "", acertos: "",
                 dificuldade: null, anotacoes: (rev.nota || "").trim() };
  /* SEM TROCAR DE ABA (revisão de UX, 26/09): o registro abre por cima de Hoje ou
     da Agenda, e ao salvar a pessoa continua onde estava, com o item marcado.
     Antes ia para Sessões e ficava lá — três itens, três voltas. */
  ui.editandoRegistro = null; ui.formAberto = true; ui.foco = null;
  redesenharTelaForm();
}
/** a revisão que a continuação de uma sessão de revisão vai cumprir: a do
    mesmo conteúdo ainda por fazer — primeiro a de hoje/atrasada, senão a
    próxima (adiantar é permitido). Cards de "continuar conteúdo" não contam:
    esses são cumpridos por estudo. */
/* CONTEÚDO CONCLUÍDO NÃO SE ESTUDA, SE REVISA (pedido do Pedro, 27/09). A sessão
   nova — ou a revisão sendo editada — cujos conteúdos já estavam todos concluídos
   no dia dela não pode ser Estudo. Ficam de fora: a sessão do próprio dia da
   conclusão (é a que fechou o conteúdo), a de antes dela (estudo esquecido) e a
   sessão de estudo já registrada, que continua como foi. Para estudar de novo,
   reabre-se o conteúdo. */
function sessaoDeConcluido(v, ed){
  if (ed && ed.tipo === "estudo") return false;
  const lista = assuntosDe(v), dia = v.data || D.hoje();
  if (!v.disciplina || !lista.length) return false;
  return lista.every(a => { const c = acharConteudo(v.disciplina, a);
    return !!c && c.fase === "concluido" && (!c.concluidoEm || dia > c.concluidoEm); });
}
/** o formulário de estudo passou a falar só de conteúdo concluído: vira revisão */
function conferirConcluidoNoForm(form){
  const est = form && form.querySelector('[name="tipo"]:checked');
  if (!est || est.value !== "estudo") return;
  const dataEl = form.querySelector('[name="data"]');
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  if (!sessaoDeConcluido({ disciplina: disciplinaDoForm(form), assuntos: lerAssuntosForm(form),
                           data: dataEl ? dataEl.value : "" }, ed)) return;
  guardarRascunhoRegistro(); redesenharTelaForm();          // formRegistroHtml faz a troca
  toast("Conteúdo concluído: a sessão passa a ser revisão.");
}
function revisaoParaContinuar(reg){
  const meus = new Set(assuntosDe(reg).map(a => a.toLowerCase()));
  const cands = revisoesDetalhadas().filter(x =>
    !x.rev.feita && !ehRetomada(x.rev) && !sessaoDaRevisao(x.rev) && !bloqueadaPelaProva(x.rev) &&
    x.ctx.disciplina === reg.disciplina && x.ctx.assuntos.some(a => meus.has(a.toLowerCase())));
  const hoje = D.hoje();
  return (cands.find(x => x.rev.data <= hoje) || cands[0] || {}).rev || null;
}
/** a sessão daquele conteúdo naquele dia (a que deve receber o tempo) */
function sessaoDoDia(ctx, data, exceto){
  if (!ctx) return null;
  const chave = chaveConteudos(ctx.disciplina, ctx.assuntos);
  return db.registros.filter(r => r.data === data && chaveSessao(r) === chave &&
                                  (!r.revisaoId || r.revisaoId === exceto))
    .sort((a,b) => (b.minutos || 0) - (a.minutos || 0))[0] || null;
}

/* A PROVA PASSOU, E AGORA? Antes o sistema simplesmente parava de agendar: a
   véspera ficava no passado, a janela virava negativa e nenhuma revisão nova
   nascia — sem dizer nada. Agora ele pergunta uma vez, e a resposta fica
   guardada (db.posProva) para não virar interrogatório diário.               */
function precisaPerguntarPosProva(){
  return !!ultimaProva() && ultimaProva() <= D.hoje() && !db.posProva;
}
function modalPosProva(){
  const ultimo = diasDeProva().slice(-1)[0];
  const dias = Math.abs(D.dif(ultimo.data, D.hoje()));
  const vest = objetivo() === "vestibular";
  const oQue = vest ? "O último dia de prova (" + esc(nomeDoDia(ultimo)) + ", <b>" + D.brFull(ultimo.data) + "</b>)"
                    : "A prova de <b>" + D.brFull(ultimo.data) + "</b>";
  abrirModal("E depois da prova?",
    '<p class="sub">' + oQue + ' ' +
      (dias === 0 ? "é hoje" : "foi há " + dias + (dias === 1 ? " dia" : " dias")) + '. ' +
      'As revisões <b>continuam sendo agendadas normalmente</b>; se quiser parar, escolha ' +
      '<b>encerrei</b>.</p>' +
    '<div class="campos">' +
      '<div class="campo largo"><span>Você continua estudando?</span><div class="opcoes">' +
        '<label class="opcao"><input type="radio" name="rumo" value="continuo" checked>' +
          '<span>Sim, continuo — em estudo contínuo</span></label>' +
        '<label class="opcao"><input type="radio" name="rumo" value="outra">' +
          '<span>Sim, tenho outra prova</span></label>' +
        '<label class="opcao"><input type="radio" name="rumo" value="encerrei">' +
          '<span>Não, encerrei por aqui</span></label>' +
      '</div></div>' +
      '<div class="campo largo painel-questao" id="painelOutraProva">' +
        '<div class="interno"><div class="campos">' +
          (vest
            ? '<p class="sub">Os novos dias se marcam nos ajustes — eles abrem ao confirmar.</p>'
            : campo("Data da nova prova", '<input type="date" name="novaProva" id="campoNovaProva" ' +
                'min="' + D.soma(D.hoje(), 1) + '">', true)) +
        '</div></div>' +
      '</div>' +
    '</div>' +
    '<p class="sub" style="margin-top:10px">Escolhendo <b>continuo</b>, o objetivo passa a ser <b>Estudo contínuo</b> ' +
      '(as datas ficam guardadas nos ajustes) e as revisões voltam em intervalos crescentes — as primeiras, ' +
      'espalhadas pelos dias seguintes para não caírem todas juntas. Escolhendo <b>encerrei</b>, ' +
      'nada é apagado — o sistema só para de agendar, e você pode religar quando quiser.</p>' +
    '<div class="linha acoes-form"><button class="btn" type="button" data-acao="salvar-pos-prova">Confirmar</button></div>',
    () => {
      const painel = $("#painelOutraProva");
      document.querySelectorAll('[name="rumo"]').forEach(r =>
        r.addEventListener("change", () => {
          if (painel) painel.classList.toggle("aberto", r.value === "outra" && r.checked);
        }));
    });
}
function salvarPosProva(){
  const escolha = (document.querySelector('[name="rumo"]:checked') || {}).value || "continuo";
  const nova = (document.getElementById("campoNovaProva") || {}).value || "";
  /* Vestibular com outra prova: os dias novos (nome e data de cada um) se
     marcam nos ajustes. A pergunta segue pendente até lá — se os ajustes forem
     fechados sem data nova, ela volta, e é o certo: o ciclo não recomeçou. */
  if (escolha === "outra" && objetivo() === "vestibular"){ fecharModal(); modalAjustes(); return; }
  if (escolha === "outra" && !nova){
    toast("Informe a data da nova prova."); return;
  }
  // o que ficou em silêncio precisa ser lido ANTES de o modo mudar: as ligações só valem no vestibular
  const guardados = escolha === "continuo" ? itensQueFicaramEmSilencio() : [];
  if (escolha === "outra"){ db.dataProva = nova; db.posProva = ""; }      // prova nova: o ciclo recomeça
  else if (escolha === "continuo"){ db.objetivo = "livre"; db.posProva = "continuo"; }   // a data fica guardada
  else { db.posProva = "encerrei"; }
  if (agendamentoAtivo()){
    replanejarTudo();
    if (escolha === "continuo") espalharRetorno(guardados);
  }
  persistir(); fecharModal(); render();
  toast(escolha === "encerrei" ? "Agendamento encerrado — nada foi apagado."
       : escolha === "outra"   ? "Nova prova em " + D.brFull(nova) + " — cronograma refeito."
                               : "Estudo contínuo — revisões em intervalos crescentes.");
}

/** os itens pendentes que o silêncio escondeu e já venceram — lidos ainda no
    modo vestibular, antes de a volta desligar as ligações */
function itensQueFicaramEmSilencio(){
  if (!ligacoesAtivas()) return [];
  const hoje = D.hoje(), ultima = ultimaProva();
  return db.revisoes.filter(r => {
    if (r.feita || r.data >= hoje || r.data > ultima) return false;
    const fichas = fichasDaRevisao(r);
    return fichas.length > 0 && fichas.every(f => { const d = diaDoConteudo(f); return d && d.data < ultima; });
  }).map(r => r.id);
}
/* A VOLTA DEPOIS DA PROVA. Replanejado tudo a partir de hoje, a primeira
   revisão de cada conteúdo concluído cairia no mesmo dia — e era o dia de
   voltar a estudar com calma. Aqui elas são espalhadas: no máximo
   CONFIG.RETORNO_POR_DIA por dia, as mais difíceis primeiro. Quem anda leva a
   escada inteira junto, então os intervalos entre as revisões não mudam.
   As retomadas não entram: já se espalham pela dificuldade (diasDaVolta). */
function espalharRetorno(guardados){
  const hoje = D.hoje(), limite = ultimoDiaRevisao();
  const porSessao = new Map();
  db.revisoes.forEach(r => {
    if (r.feita || r.manual || ehRetomada(r) || !r.registroId || r.data < hoje) return;
    const l = porSessao.get(r.registroId) || [];
    l.push(r); porSessao.set(r.registroId, l);
  });
  const filas = [...porSessao.entries()].map(([id, itens]) => {
    itens.sort((a,b) => a.data.localeCompare(b.data));
    return { itens, dif: dificuldadeDe(acharRegistro(id)) };
  });
  /* Os itens marcados à mão que passaram o silêncio escondidos: não voltam como
     atrasados — ganham data nova (a antiga fica em dataOriginal, como numa
     remarcação) e entram na mesma fila. Os automáticos já foram refeitos. */
  (guardados || []).forEach(id => {
    const r = acharRevisao(id);
    if (!r || r.feita || r.data >= hoje) return;
    if (!r.dataOriginal) r.dataOriginal = r.data;
    r.data = D.soma(hoje, 1);
    filas.push({ itens: [r], dif: dificuldadeDe(r.registroId ? acharRegistro(r.registroId) : r) });
  });
  filas.sort((a,b) => a.itens[0].data.localeCompare(b.itens[0].data) || b.dif - a.dif);
  const ocupacao = new Map();
  let movidas = 0;
  filas.forEach(f => {
    let dia = f.itens[0].data;
    while ((ocupacao.get(dia) || 0) >= CONFIG.RETORNO_POR_DIA || diaDeProva(dia)) dia = D.soma(dia, 1);
    ocupacao.set(dia, (ocupacao.get(dia) || 0) + 1);
    const passo = D.dif(f.itens[0].data, dia);
    if (!passo) return;
    movidas++;
    f.itens.forEach(r => { r.data = D.soma(r.data, passo); });
    // o que empurrado passa do horizonte sai: o teto continua mandando
    const fora = new Set(f.itens.filter(r => !r.manual && r.data > limite).map(r => r.id));
    if (fora.size) db.revisoes = db.revisoes.filter(r => !fora.has(r.id));
  });
  return movidas;
}

/* FECHAR E REABRIR UM CONTEÚDO. Fechar é o que dá partida na repetição
   espaçada: a escada passa a contar do dia de hoje. As voltas já feitas não
   somem — elas foram sessões de estudo, com tempo e questões registrados. */
/* Fechar e reabrir agora acontecem no CONTEÚDO, não na sessão: o conteúdo é a
   unidade que se aprende, e todas as sessões que falam dele acompanham. Dá
   para fechar uma disciplina inteira — é o mesmo, aplicado a cada ficha.    */
/* `escolhas` (só ao concluir): Map ficha → { auto, passos } — o que a janela de
   concluir respondeu. auto=false nasce sem revisões automáticas; `passos` é o
   cronograma escolhido (definirEscada). Sem escolha, fica como estava. */
function marcarConteudos(fichas, fase, escolhas){
  const tocadas = fichas.filter(Boolean);
  if (!tocadas.length) return 0;
  tocadas.forEach(c => {
    c.fase = fase;
    c.concluidoEm = fase === "concluido" ? D.hoje() : null;
    delete c.revisoesProva;                   // revisões até a prova são de conteúdo concluído
    delete c.semAutomaticas;                  // reabrir (ou fechar de novo) religa o automático (Pedro, 03/10)
    delete c.automaticasDesde;
    delete c.ancoraEscada;                    // a conta da escada recomeça (ver replanejarAoReligar)
    const e = fase === "concluido" && escolhas && escolhas.get(c);
    if (e && e.auto === false) c.semAutomaticas = true;
    if (e && e.passos) definirEscada(c, e.passos);
  });
  const chaves = new Set(tocadas.map(chaveDaFicha));

  /* O plano muda de régua: o que é automático e pendente destes conteúdos sai
     (as voltas, ao fechar; a escada, ao reabrir). Item que fala também de
     outro conteúdo não some — só perde estes. Feitas e manuais continuam
     intocadas: ao fechar, a escada nasce DEPOIS das revisões que você já
     tinha marcado (continuarEscada). */
  db.revisoes = db.revisoes.filter(r => {
    if (r.feita || (r.manual && !r.planoProva)) return true;   // as escolhidas até a prova saem com o modo
    const ctx = contextoRevisao(r); if (!ctx) return true;
    const resto = ctx.assuntos.filter(a => !chaves.has(chaveAssunto(ctx.disciplina, a)));
    if (resto.length === ctx.assuntos.length) return true;
    if (!resto.length) return false;
    r.assuntos = resto;
    return true;
  });
  garantirAgenda();
  return tocadas.length;
}
/* Renomear um conteúdo é renomear a FICHA e tudo o que apontava para ela: as
   sessões, as revisões avulsas e as anotações. Antes o nome vivia
   solto em cada sessão, e renomear numa não mexia nas outras.               */
function renomearConteudo(disc, antigo, novo){
  const ficha = fichaDoNome(disc, antigo);
  if (ficha) ficha.nome = novo;
  const bate = a => (a || "").toLowerCase() === antigo.toLowerCase();
  db.registros.forEach(r => {
    if (r.disciplina !== disc) return;
    r.assuntos = assuntosDe(r).map(a => bate(a) ? novo : a);
    r.assunto = r.assuntos[0] || "";
  });
  /* A lista `assuntos` existe em dois casos: revisão AVULSA (que traz a própria
     disciplina) e VOLTA, que herda a disciplina da sessão dona. Os dois
     precisam acompanhar o nome novo, senão a volta continua chamando pelo
     nome antigo depois do renome. */
  db.revisoes.forEach(r => {
    if (!Array.isArray(r.assuntos)) return;
    if (discDaRevisao(r) !== disc) return;
    r.assuntos = r.assuntos.map(a => bate(a) ? novo : a);
  });
  db.erros.forEach(e => { if (e.disciplina === disc && bate(e.assunto)) e.assunto = novo; });
  // e o conteúdo escolhido nos filtros das abas, que é guardado pela chave com o nome
  const velha = chaveAssunto(disc, antigo), nova = chaveAssunto(disc, novo);
  ["fAssunto","aAssunto","cAssunto","pAssunto","qAssunto","eAssunto"].forEach(k => { if (ui[k] === velha) ui[k] = nova; });
}
/* QUANTO UM RENOME ALCANÇA. Conta exatamente o que renomearConteudo() vai
   tocar — nem mais, nem menos —, para o aviso não prometer o que não faz. É
   usado pelos DOIS ✎ (a aba Disciplinas e a etiqueta no formulário da sessão),
   de propósito: as duas telas dizem a mesma frase porque leem o mesmo lugar. */
/** de que disciplina a revisão fala: a própria (avulsa) ou a da sessão dona */
function discDaRevisao(r){
  if (r.disciplina) return r.disciplina;
  const reg = r.registroId ? acharRegistro(r.registroId) : null;
  return reg ? reg.disciplina : "";
}
function alcanceDoConteudo(disc, nome){
  const bate = a => (a || "").toLowerCase() === (nome || "").toLowerCase();
  return {
    sessoes: db.registros.filter(r => r.disciplina === disc && assuntosDe(r).some(bate)).length,
    itens: db.revisoes.filter(r => Array.isArray(r.assuntos) && discDaRevisao(r) === disc &&
                                   r.assuntos.some(bate)).length,
    anotacoes: db.erros.filter(e => e.disciplina === disc && bate(e.assunto)).length
  };
}
function fraseAlcance(disc, nome){
  const a = alcanceDoConteudo(disc, nome);
  const partes = [];
  if (a.sessoes)   partes.push(a.sessoes + (a.sessoes === 1 ? " sessão" : " sessões"));
  if (a.itens)     partes.push(a.itens + (a.itens === 1 ? " item da agenda" : " itens da agenda"));
  if (a.anotacoes) partes.push(a.anotacoes + (a.anotacoes === 1 ? " anotação" : " anotações"));
  if (!partes.length) return "Nada usa esse nome ainda.";
  const ultimo = partes.pop();
  return "Muda em todo o sistema: " + (partes.length ? partes.join(", ") + " e " + ultimo : ultimo) + ".";
}

/* A PERGUNTA CURTA DO PRÓPRIO APP. Era o prompt() do navegador — caixa cinza,
   fora do estilo, e no remarcar pedia a data digitada como "aaaa-mm-dd". Esta
   abre por cima da tela sobreposta sem fechá-la (renomear um conteúdo com a
   sessão aberta não pode perder o que foi digitado nela). Devolve uma Promise
   com o valor, ou null se cancelou. `validar` devolve a mensagem de erro, ou "",
   e o erro aparece ali mesmo, sem alert. */
let dialogoAberto = null;                 // { cancelar } enquanto a pergunta está na tela
/* PERGUNTA DE SIM OU NÃO, DO PRÓPRIO APP (revisão de UX, 26/09). Substitui o
   confirm()/alert() do navegador: aquela janela vinha com "OK", que não diz o
   que acontece, e no iPhone com o endereço do site no topo. Aqui o botão diz o
   verbo ("Excluir", "Descartar") e o destrutivo fica vermelho. Usa a mesma caixa
   da pergunta curta (#dialogo), que abre por cima da tela sobreposta.
   o = { titulo, texto (\n\n separa parágrafos), botao, cancelar, perigo }
   Devolve uma Promise<boolean>. Com o.soAviso, um botão só ("Entendi").
   window.__confirmarNativo: só as suítes de teste (jsdom) ligam, para responder
   pelo w.confirm/w.alert que elas já simulam; o app de verdade nunca. */
function confirmar(o){
  if (typeof o === "string") o = { texto: o };
  if (window.__confirmarNativo){
    const t = (o.titulo ? o.titulo + "\n\n" : "") + (o.texto || "");
    if (o.soAviso){ window.alert(t); return Promise.resolve(true); }
    return Promise.resolve(!!window.confirm(t));
  }
  return new Promise(resolve => {
    const caixa = $("#dialogo"), corpo = $("#dialogoCorpo");
    const foco = document.activeElement;
    $("#dialogoTitulo").textContent = o.titulo || (o.soAviso ? "Aviso" : "Confirmar");
    const paragrafos = String(o.texto || "").split(/\n{2,}/).filter(Boolean)
      .map(t => '<p class="sub" style="margin:0 0 10px">' + esc(t).replace(/\n/g, "<br>") + '</p>').join("");
    corpo.innerHTML = '<form id="formDialogo" novalidate>' + paragrafos +
      '<div class="linha acoes-form" style="margin-top:14px">' +
        '<button class="btn' + (o.perigo ? ' perigo' : '') + '" type="submit">' + esc(o.botao || (o.soAviso ? "Entendi" : "Confirmar")) + '</button>' +
        (o.soAviso ? '' : '<button class="btn ghost" type="button" data-dialogo="cancelar">' + esc(o.cancelar || "Cancelar") + '</button>') +
      '</div></form>';
    const fechar = sim => {
      caixa.hidden = true; corpo.innerHTML = ""; dialogoAberto = null;
      if (foco && foco.focus && document.contains(foco)) try { foco.focus(); } catch(e){}
      resolve(sim);
    };
    dialogoAberto = { cancelar: () => fechar(!!o.soAviso) };
    caixa.querySelectorAll('[data-dialogo="cancelar"]').forEach(b => { b.onclick = ev => { ev.stopPropagation(); fechar(false); }; });
    caixa.onclick = ev => { ev.stopPropagation(); if (ev.target === caixa) fechar(!!o.soAviso); };
    $("#formDialogo").addEventListener("submit", ev => { ev.preventDefault(); fechar(true); });
    caixa.hidden = false;
    const b = $("#formDialogo button[type=submit]"); if (b) b.focus();
  });
}
const avisar = (titulo, texto) => confirmar({ titulo, texto, soAviso: true });
/** a mesma caixa, com botões de escolha: devolve o `valor` escolhido, ou null
    (fechou/cancelou). o = { titulo, texto, opcoes:[{ valor, rotulo, principal }] }
    Nos testes (__confirmarNativo), responde pelo w.__escolha, se houver. */
function escolher(o){
  if (window.__confirmarNativo) return Promise.resolve(window.__escolha === undefined ? null : window.__escolha);
  return new Promise(resolve => {
    const caixa = $("#dialogo"), corpo = $("#dialogoCorpo");
    const foco = document.activeElement;
    $("#dialogoTitulo").textContent = o.titulo || "Escolha";
    corpo.innerHTML = (o.texto ? '<p class="sub" style="margin:0 0 12px">' + esc(o.texto) + '</p>' : '') +
      '<div class="escolhas">' + o.opcoes.map((x, i) =>
        '<button class="btn' + (x.principal ? '' : ' ghost') + '" type="button" data-escolha="' + i + '">' + esc(x.rotulo) + '</button>').join("") +
      '<button class="btn ghost" type="button" data-dialogo="cancelar">Cancelar</button></div>';
    const fechar = v => {
      caixa.hidden = true; corpo.innerHTML = ""; dialogoAberto = null;
      if (foco && foco.focus && document.contains(foco)) try { foco.focus(); } catch(e){}
      resolve(v);
    };
    dialogoAberto = { cancelar: () => fechar(null) };
    caixa.querySelectorAll('[data-dialogo="cancelar"]').forEach(b => { b.onclick = ev => { ev.stopPropagation(); fechar(null); }; });
    corpo.querySelectorAll("[data-escolha]").forEach(b => { b.onclick = ev => { ev.stopPropagation(); fechar(o.opcoes[Number(b.dataset.escolha)].valor); }; });
    caixa.onclick = ev => { ev.stopPropagation(); if (ev.target === caixa) fechar(null); };
    caixa.hidden = false;
    const b = corpo.querySelector("[data-escolha]"); if (b) b.focus();
  });
}

function pedirValor(o){
  return new Promise(resolve => {
    const caixa = $("#dialogo"), corpo = $("#dialogoCorpo");
    const foco = document.activeElement;
    $("#dialogoTitulo").textContent = o.titulo;
    corpo.innerHTML = '<form id="formDialogo" novalidate>' +
      (o.texto ? '<p class="sub" style="margin-top:0">' + esc(o.texto) + '</p>' : '') +
      '<div class="campos uma-coluna">' +
        campo(o.rotulo, '<input name="valor" type="' + (o.tipo || "text") + '" autocomplete="off"' +
          (o.min ? ' min="' + esc(o.min) + '"' : '') + (o.max ? ' max="' + esc(o.max) + '"' : '') +
          ' maxlength="' + (o.maxlength || 80) + '" value="' + esc(o.valor || "") + '">', true) +
      '</div>' +
      // o.depois: mais conteúdo abaixo do campo (a janela do conteúdo); o.ler(form) o devolve junto
      (o.depois ? '<div class="dialogo-mais">' + o.depois + '</div>' : '') +
      '<div class="linha acoes-form"><button class="btn" type="submit">' + esc(o.botao || "Salvar") + '</button>' +
      '<button class="btn ghost" type="button" data-dialogo="cancelar">Cancelar</button>' +
      // o.extra: uma ação a mais no canto (o Excluir do conteúdo), fecha a pergunta e segue
      (o.extra ? '<button class="act excluir excluir-tela" type="button" data-dialogo="extra">' + esc(o.extra.rotulo) + '</button>' : '') +
      '<span class="erro-form" id="erroDialogo"></span></div></form>';
    const f = $("#formDialogo"), inp = f.querySelector('[name="valor"]');
    const fechar = valor => {
      caixa.hidden = true; corpo.innerHTML = ""; dialogoAberto = null;
      if (foco && foco.focus && document.contains(foco)) try { foco.focus(); } catch(e){}
      resolve(valor);
    };
    dialogoAberto = { cancelar: () => fechar(null) };
    caixa.querySelectorAll('[data-dialogo="cancelar"]').forEach(b => { b.onclick = ev => { ev.stopPropagation(); fechar(null); }; });
    const ex = caixa.querySelector('[data-dialogo="extra"]');
    if (ex) ex.onclick = ev => { ev.stopPropagation(); fechar(null); o.extra.ao(); };
    if (o.aoAbrir) o.aoAbrir(f, () => fechar(null));
    caixa.onclick = ev => { ev.stopPropagation(); if (ev.target === caixa) fechar(null); };
    inp.addEventListener("input", () => { $("#erroDialogo").textContent = ""; inp.classList.remove("campo-errado"); });
    /* NÃO FORÇAR O CALENDÁRIO A FECHAR (05/10). Trocar o tipo do campo (date →
       text → date) com o calendário aberto derrubava a página no Safari do Mac
       ("A problem repeatedly occurred"): o calendário some, e na segunda escolha
       a aba cai sem salvar. O calendário fecha sozinho ao clicar fora dele. */
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      const v = (inp.value || "").trim().replace(/\s+/g, " ");
      const erro = o.validar ? o.validar(v) : (v ? "" : "Preencha o campo.");
      if (erro){ $("#erroDialogo").textContent = erro; inp.classList.add("campo-errado"); inp.focus(); return; }
      fechar(o.ler ? { valor: v, extra: o.ler(f) } : v);
    });
    caixa.hidden = false;
    inp.focus(); if (inp.select && (o.tipo || "text") === "text") inp.select();
  });
}

/** excluir uma disciplina sem uso — pela janela "Editar disciplina", no canto */
async function excluirDisciplinaPerguntando(disc){
  if (!disciplinaExcluivel(disc)) return;
  const n = conteudosDaDisciplina(disc).length;
  if (!(await confirmar({ titulo: "Excluir disciplina", botao: "Excluir", perigo: true,
               texto: "Excluir a disciplina “" + disc + "”?" +
               (n ? "\n\nSaem junto " + n + (n === 1 ? " conteúdo cadastrado" : " conteúdos cadastrados") +
                    " (nenhum tem sessão ainda)." : "") + "\n\nNão dá para desfazer." }))) return;
  excluirDisciplina(disc); persistir(); render();
  toast("Disciplina “" + disc + "” excluída.");
}
/* EXCLUIR UM CONTEÚDO. A confirmação diz as duas metades em voz alta: o que
   some (cadastro e agenda) e o que FICA (as sessões e as horas). Mora na janela
   de editar o conteúdo, no canto, como o Excluir das outras telas de edição
   (revisão de UX, 26/09: eram 19 "✕ excluir" vermelhos, um por linha). */
async function excluirConteudoPerguntando(disc, nome){
  const itens = itensSoDesteConteudo(disc, nome).length;
  const sess = sessoesDoConteudo(disc, [nome]).length;
  const linhas = ['Excluir o conteúdo “' + nome + '” de ' + disc + '?', ''];
  linhas.push(itens
    ? "SAI da agenda: " + itens + (itens === 1 ? " item marcado" : " itens marcados") +
      " (revisões e cards de continuar deste conteúdo)."
    : "Não há nada dele na agenda.");
  linhas.push(sess
    ? "FICA o estudo: " + sess + (sess === 1 ? " sessão continua registrada" : " sessões continuam registradas") +
      ", com as horas e as questões. Nada muda na aba Sessões."
    : "Nenhuma sessão fala dele.");
  linhas.push('', "O cadastro do conteúdo some. Não dá para desfazer.");
  if (!(await confirmar({ titulo: "Excluir conteúdo", botao: "Excluir", perigo: true,
                          texto: linhas.join("\n").replace(/\n(?=SAI|FICA|Nenhuma|Não há)/g, "\n\n") }))) return;
  const r = excluirConteudo(disc, nome);
  persistir(); render();
  toast("“" + nome + "” excluído — " + (r.itens === 1 ? "1 item saiu" : r.itens + " itens saíram") + " da agenda.");
}

/* O ✎ da etiqueta no formulário da sessão: pergunta o nome, recusa duplicata na
   mesma disciplina e propaga. Devolve (numa Promise) o nome novo, ou "" se
   nada mudou. (O ✎ da aba Disciplinas abre a janela inteira: editarConteudo.) */
async function pedirNomeDoConteudo(disc, antigo){
  const novo = await pedirValor({ titulo: "Renomear conteúdo", rotulo: "Novo nome para “" + antigo + "”",
    texto: fraseAlcance(disc, antigo), valor: antigo, maxlength: 120, botao: "Renomear",
    validar: v => !v ? "Escreva o nome."
      : acharConteudo(disc, v) && v.toLowerCase() !== antigo.toLowerCase()
        ? "Já existe um conteúdo com esse nome nesta disciplina." : "" });
  if (!novo || novo === antigo) return "";
  renomearConteudo(disc, antigo, novo);
  persistir();
  return novo;
}

/* A PRÉVIA DO CRONOGRAMA. As datas que as janelas mostram saem do cálculo de
   verdade: a mesma conta da agenda (marcarConteudos ao concluir, reespacarEscada
   no ✎ editar) roda numa CÓPIA dos dados, e a cópia é jogada fora. Assim a prévia
   já conta com as revisões marcadas à mão e com os dias de prova pulados — e
   nunca diz uma coisa para a agenda fazer outra.
   `aplicar(fichasDaCopia)` mexe na cópia; devolve, por ficha, uma linha por
   revisão do cronograma: { data, feita, longe } (longe = além do horizonte da
   agenda: entra nela quando chegar mais perto). */
function previaDoCronograma(fichas, aplicar){
  const real = db, limite = ultimoDiaRevisao();
  db = JSON.parse(JSON.stringify(real));
  try {
    const copias = fichas.map(f => conteudosCad().find(c => chaveDaFicha(c) === chaveDaFicha(f)));
    aplicar(copias);
    return copias.map(c => c ? datasDoCronograma(c, limite) : []);
  } catch(e){
    return fichas.map(() => []);
  } finally { db = real; }
}
function datasDoCronograma(ficha, limite){
  const degraus = degrausDaFicha(ficha), inicio = ficha.concluidoEm || D.hoje();
  const itens = itensDaFicha(ficha).filter(r => !r.manual && (!r.feita || (r.feitaEm || r.data) >= inicio));
  const linhas = [];
  let ant = inicio;
  for (let j = 1; j < degraus.length; j++){
    const r = itens.find(x => degrauDoItem(x, ficha, degraus) === j);
    if (r){
      const data = r.feita ? (r.feitaEm || r.data) : r.data;
      linhas.push({ data, feita: !!r.feita });
      ant = data;
      continue;
    }
    // ainda não nasceu: depois do horizonte, a agenda cria quando chegar mais perto
    const data = foraDaProva(D.soma(ant, degraus[j] - degraus[j - 1]));
    linhas.push({ data, longe: data > limite });
    ant = data;
  }
  return linhas;
}

/* O EDITOR DO CRONOGRAMA: quantas revisões e quantos dias cada uma espera depois
   da anterior, com a data ao lado. O mesmo bloco serve à janela de concluir e à
   janela do conteúdo (✎ editar), para as duas dizerem a mesma coisa. */
const nomeDificuldade = n => (CONFIG.DIFICULDADES[n] || CONFIG.DIFICULDADES[2]).nome;
const unidadePasso = (p, i) => (p === 1 ? "dia" : "dias") + " depois " + (i ? "da anterior" : "de concluir");
const linhaEscada = (p, i) => '<li class="linha-escada"><span class="num">' + (i + 1) + 'ª</span>' +
  '<input type="number" name="passo" min="1" max="999" value="' + p + '" inputmode="numeric" ' +
    'aria-label="Dias da ' + (i + 1) + 'ª revisão depois ' + (i ? "da anterior" : "de concluir") + '">' +
  '<span class="unid">' + unidadePasso(p, i) + '</span><span class="data-escada"></span></li>';
function htmlEditorEscada(i, titulo, sub, passos){
  return '<div class="bloco-escada" data-bloco="' + i + '">' +
    (titulo ? '<div class="cab-escada"><b>' + esc(titulo) + '</b>' + (sub ? ' <span class="dica">' + esc(sub) + '</span>' : '') + '</div>' : '') +
    '<div class="linha qtd-escada"><label>Quantas revisões <input type="number" name="quantas" min="1" max="' + MAX_ESCOLHA + '" ' +
      'value="' + passos.length + '" inputmode="numeric"></label>' +
    '<button class="act atalho" type="button" data-escada="sugestao" title="O cronograma que a dificuldade sugere">usar a sugestão</button></div>' +
    '<ol class="lista-escada">' + passos.map(linhaEscada).join("") + '</ol></div>';
}
/** os passos escritos num bloco; null se algum estiver vazio ou fora de 1–999 */
function lerPassos(bloco){
  const l = [...bloco.querySelectorAll('[name="passo"]')].map(i => Number(i.value));
  return escadaValida(l) ? l : null;
}
/** escreve as datas da prévia ao lado de cada linha */
function pintarDatas(bloco, linhas){
  bloco.querySelectorAll(".linha-escada").forEach((li, i) => {
    const x = linhas && linhas[i], span = li.querySelector(".data-escada");
    span.classList.toggle("feita", !!(x && x.feita));
    span.classList.toggle("longe", !!(x && x.longe));
    const ano = x && x.data.slice(0, 4) !== D.hoje().slice(0, 4) ? "/" + x.data.slice(2, 4) : "";   // 23/02/27
    span.textContent = !x ? "" : "→ " + D.semana(x.data) + " " + D.br(x.data) + ano + (x.feita ? " · feita" : "");
    span.title = x && x.longe ? "Além do horizonte da agenda: entra nela quando a data chegar mais perto" : "";
  });
}
/* Liga os blocos de `raiz`. `sugestao(bloco)` dá os passos sugeridos daquele
   bloco (completar e "usar a sugestão"); `aoMudar()` refaz a prévia. */
function ligarEditoresEscada(raiz, sugestao, aoMudar){
  const refazer = (bloco, passos) => {
    bloco.querySelector(".lista-escada").innerHTML = passos.map(linhaEscada).join("");
    bloco.querySelector('[name="quantas"]').value = passos.length;
  };
  raiz.addEventListener("input", ev => {
    const bloco = ev.target.closest(".bloco-escada"); if (!bloco) return;
    if (ev.target.name === "quantas"){
      const n = Number(ev.target.value);
      if (!Number.isInteger(n) || n < 1 || n > MAX_ESCOLHA) return;
      const atuais = [...bloco.querySelectorAll('[name="passo"]')].map(i => Number(i.value) || 1);
      const sug = sugestao(bloco);
      while (atuais.length < n){
        const k = atuais.length;
        atuais.push(sug[k] || Math.min(365, (atuais[k - 1] || 1) * 2));   // passada a sugestão, dobra
      }
      bloco.querySelector(".lista-escada").innerHTML = atuais.slice(0, n).map(linhaEscada).join("");
    } else if (ev.target.name === "passo"){
      const li = ev.target.closest(".linha-escada");
      const i = [...bloco.querySelectorAll(".linha-escada")].indexOf(li);
      li.querySelector(".unid").textContent = unidadePasso(Number(ev.target.value), i);
    } else return;
    aoMudar();
  });
  raiz.addEventListener("click", ev => {
    const b = ev.target.closest('[data-escada="sugestao"]'); if (!b) return;
    const bloco = b.closest(".bloco-escada");
    refazer(bloco, sugestao(bloco));
    aoMudar();
  });
}

/* A JANELA DE CONCLUIR (pedido do Pedro, 06/10). Concluir um conteúdo — pela aba
   Disciplinas, pela Agenda ou pela sessão — ou uma disciplina inteira pergunta
   SEMPRE se as revisões automáticas devem nascer, com o cronograma inteiro à
   vista: quantas revisões, quantos dias cada uma espera e em que data cai. Só ao
   confirmar o conteúdo é concluído; cancelar não muda nada. Com vários
   conteúdos, a pessoa escolhe um cronograma para todos ou um para cada.
   o = { titulo, texto, botao }. Devolve o Map de escolhas de marcarConteudos, ou
   null (cancelou). Nos testes (__confirmarNativo): responde pelo w.confirm e,
   havendo w.__escolhaConcluir(ficha), por ele. */
function janelaConcluir(fichas, o){
  if (window.__confirmarNativo){
    if (!window.confirm(o.titulo + "\n\n" + o.texto)) return Promise.resolve(null);
    const f = window.__escolhaConcluir;
    return Promise.resolve(new Map(fichas.map(c => [c, f ? f(c) : {}])));
  }
  return new Promise(resolve => {
    const caixa = $("#dialogo"), corpo = $("#dialogoCorpo");
    const foco = document.activeElement;
    const ativo = autoRevisoes(), varios = fichas.length > 1;
    const inicial = c => escadaValida(c.escada) ? c.escada.slice() : passosSugeridos(c);
    // o conjunto começa pelo cronograma que todos já têm; diferentes, pela sugestão do mais difícil
    const maisDificil = fichas.slice().sort((a, b) => dificuldadeDaFicha(b) - dificuldadeDaFicha(a))[0];
    const iguais = fichas.every(c => JSON.stringify(inicial(c)) === JSON.stringify(inicial(fichas[0])));
    const passos = { conjunto: iguais ? inicial(fichas[0]) : passosSugeridos(maisDificil), cada: fichas.map(inicial) };
    let modo = "conjunto";
    $("#dialogoTitulo").textContent = o.titulo;
    corpo.innerHTML = '<form id="formDialogo" class="form-concluir" novalidate>' +
      String(o.texto || "").split(/\n{2,}/).filter(Boolean).map(t => '<p class="sub" style="margin:0 0 10px">' + esc(t) + '</p>').join("") +
      (!ativo
        ? '<p class="sub nota-conteudo">O agendamento automático está desligado para todos os conteúdos (engrenagem no topo): ' +
            'nenhuma revisão automática será criada.</p>'
        : '<div class="opcoes"><label class="opcao"><input type="checkbox" name="criarAuto" checked>' +
            '<span>Criar revisões automáticas</span></label></div>' +
          '<div id="painelEscadaConcluir">' +
            (varios
              ? '<div class="opcoes modo-escada">' +
                  '<label class="opcao"><input type="radio" name="modoEscada" value="conjunto" checked><span>Um cronograma para todos</span></label>' +
                  '<label class="opcao"><input type="radio" name="modoEscada" value="cada"><span>Um cronograma para cada conteúdo</span></label>' +
                '</div>'
              : '') +
            '<div id="blocosEscada"></div>' +
            '<p class="dica nota-escada">Cada revisão conta os dias a partir da anterior. Revisão atrasada ou feita a mais empurra as seguintes, mantendo as distâncias.</p>' +
          '</div>' +
          '<p class="sub nota-conteudo" id="notaSemAuto" hidden>Nenhuma revisão automática será criada: fica só o que você marcar. ' +
            'Dá para ligar depois no ✎ editar do conteúdo.</p>') +
      '<div class="linha acoes-form" style="margin-top:14px">' +
        '<button class="btn" type="submit">' + esc(o.botao || "Concluir") + '</button>' +
        '<button class="btn ghost" type="button" data-dialogo="cancelar">Cancelar</button>' +
        '<span class="erro-form" id="erroDialogo"></span></div></form>';
    const f = $("#formDialogo"), blocos = $("#blocosEscada");
    const subDe = c => "dificuldade: " + nomeDificuldade(dificuldadeDaFicha(c)) +
                       (escadaValida(c.escada) ? " · cronograma seu" : "");
    const guardar = () => {                        // o que está escrito sobrevive à troca de modo
      if (!blocos) return;
      blocos.querySelectorAll(".bloco-escada").forEach(b => {
        const l = [...b.querySelectorAll('[name="passo"]')].map(i => Number(i.value) || 1);
        if (modo === "conjunto") passos.conjunto = l; else passos.cada[Number(b.dataset.bloco)] = l;
      });
    };
    const desenhar = () => {
      blocos.innerHTML = modo === "conjunto"
        ? htmlEditorEscada(0, varios ? "Os " + fichas.length + " conteúdos" : fichas[0].nome,
                           varios ? "o mesmo cronograma para todos" : subDe(fichas[0]), passos.conjunto)
        : fichas.map((c, i) => htmlEditorEscada(i, c.nome, subDe(c), passos.cada[i])).join("");
      previa();
    };
    /** o que a janela responde agora (ou null, com algum campo inválido) */
    const escolhas = () => {
      const lidos = [...blocos.querySelectorAll(".bloco-escada")].map(lerPassos);
      if (lidos.some(l => !l)) return null;
      return new Map(fichas.map((c, i) => [c, { auto: true, passos: modo === "conjunto" ? lidos[0] : lidos[i] }]));
    };
    const previa = () => {
      const e = escolhas();
      const linhas = e ? previaDoCronograma(fichas, copias =>
        marcarConteudos(copias, "concluido", new Map(copias.map((c, i) => [c, e.get(fichas[i])])))) : [];
      blocos.querySelectorAll(".bloco-escada").forEach((b, i) => pintarDatas(b, linhas[i]));
    };
    if (ativo){
      const chave = f.querySelector('[name="criarAuto"]');
      chave.addEventListener("change", () => {
        $("#painelEscadaConcluir").hidden = !chave.checked;
        $("#notaSemAuto").hidden = chave.checked;
      });
      f.querySelectorAll('[name="modoEscada"]').forEach(r => r.addEventListener("change", () => {
        guardar(); modo = r.value; desenhar();
      }));
      ligarEditoresEscada(f, b => modo === "conjunto" ? passosSugeridos(maisDificil) : passosSugeridos(fichas[Number(b.dataset.bloco)]),
                          () => { $("#erroDialogo").textContent = ""; previa(); });
      desenhar();
    }
    const fechar = v => {
      caixa.hidden = true; corpo.innerHTML = ""; dialogoAberto = null;
      if (foco && foco.focus && document.contains(foco)) try { foco.focus(); } catch(e){}
      resolve(v);
    };
    dialogoAberto = { cancelar: () => fechar(null) };
    caixa.querySelectorAll('[data-dialogo="cancelar"]').forEach(b => { b.onclick = ev => { ev.stopPropagation(); fechar(null); }; });
    caixa.onclick = ev => { ev.stopPropagation(); if (ev.target === caixa) fechar(null); };
    f.addEventListener("submit", ev => {
      ev.preventDefault();
      if (!ativo) return fechar(new Map());
      if (!f.querySelector('[name="criarAuto"]').checked) return fechar(new Map(fichas.map(c => [c, { auto: false }])));
      const e = escolhas();
      if (!e){ $("#erroDialogo").textContent = "Cada revisão precisa de 1 a 999 dias, e a quantidade vai de 1 a " + MAX_ESCOLHA + "."; return; }
      fechar(e);
    });
    caixa.hidden = false;
    const b = f.querySelector("button[type=submit]"); if (b) b.focus();
  });
}
/** a frase do toast depois de concluir: o que a agenda ganhou */
function fraseDaConclusao(fichas){
  if (!autoRevisoes()) return "";
  const sem = fichas.filter(c => c.semAutomaticas).length;
  if (sem === fichas.length) return " — sem revisões automáticas";
  const prox = fichas.filter(c => !c.semAutomaticas)
    .map(c => (itensDaFicha(c).find(r => !r.feita) || {}).data).filter(Boolean).sort()[0];
  return (prox ? " — a 1ª revisão é " + (prox === D.hoje() ? "hoje" : "em " + D.br(prox)) : "") +
         (sem ? " (" + plural(sem, "conteúdo ficou", "conteúdos ficaram") + " sem automáticas)" : "");
}

/* A JANELA DO CONTEÚDO (✎ editar da aba Disciplinas; pedido do Pedro, 03/10). Além
   do nome e do Excluir: em que pé o conteúdo está, a chave das revisões automáticas
   DELE (ver escadaAtiva) e o atalho para as revisões até a prova. As duas últimas só

function htmlJanelaConteudo(ficha){

    (concluido ? "concluído" + (ficha.concluidoEm ? " em " + D.br(ficha.concluidoEm) : "") : nSess ? "em andamento" : "a estudar") +
    '</span> <span class="dica">' + esc(ficha.disciplina) + ' · ' + plural(nSess, "sessão", "sessões") + '</span></div>';

  if (!autoRevisoes())

  if (ligado)
    h += '<div class="campo largo painel-questao" id="painelAutoConteudo"><div class="interno">' +
      '<span>As revisões programadas dele</span><div class="opcoes">' +
      '<label class="opcao"><input type="radio" name="jaNaAgendaConteudo" value="manter" checked>' +
        '<span>Manter — as revisões automáticas pendentes continuam na agenda, como suas</span></label>' +
      '<label class="opcao"><input type="radio" name="jaNaAgendaConteudo" value="desabilitar">' +
        '<span>Desabilitar — as automáticas pendentes saem da agenda; fica só o que eu marquei</span></label>' +

    h += '<div class="campo largo painel-questao" id="painelAutoConteudo"><div class="interno">' +

  /* o cronograma das automáticas, o mesmo editor da janela de concluir (pedido do Pedro, 06/10) */

    h += '<div class="cronograma-conteudo" id="cronogramaConteudo"><span class="rot-escada">Cronograma das revisões automáticas</span>' +

        ? 'Cronograma escolhido por você: a dificuldade não muda mais estes dias.'

  if (ligado && podeEscolherAteProva(ficha))
    h += '<div class="linha linha-rev-prova"><button class="act atalho" type="button" data-dialogo="ate-prova">' +

/* A JANELA DE JUNTAR (aba Disciplinas, ⊕ juntar na disciplina). Marque dois
   ou mais conteúdos; o nome vem como a soma deles ("A + B") e pode ser
   trocado. As regras estão em juntarConteudos. */
function modalJuntar(disc){

      'O que já foi feito continua com o nome de cada um.</p>' +
    '<div class="campos">' +
      '<div class="campo largo"><span>Conteúdos (dois ou mais)</span><div class="opcoes opcoes-juntar">' +

          '<span>' + esc(c.nome) + ' <small>' + situacao(c) + '</small></span></label>').join("") +
      '</div></div>' +
      campo("Nome do conteúdo juntado", '<input name="nome" maxlength="120" autocomplete="off" placeholder="Escolha os conteúdos acima">', true) +
    '</div>' +
    '<div class="linha acoes-form"><button class="btn" type="submit">Juntar</button>' +

      let mexido = false;                          // o nome escrito por você não é trocado
      campoNome.addEventListener("input", () => { mexido = !!campoNome.value.trim(); });
      f.addEventListener("change", ev => {
        if (ev.target.name !== "juntar" || mexido) return;

      });
      f.addEventListener("submit", ev => {
        ev.preventDefault();
        const erro = $("#erroJuntar");

        if (outro && !fichas.includes(outro)){ erro.textContent = "Já existe um conteúdo com esse nome nesta disciplina."; return; }
        juntarConteudos(fichas, nome);
        persistir(); fecharModal(); render();
        toast("“" + nome + "” criado. Daqui para a frente, é um conteúdo só.");
      });
