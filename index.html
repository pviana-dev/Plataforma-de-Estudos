/** desenha (ou tira) a tela de acesso. Devolve se ela está no caminho. */
function pintarAcesso(){
  const el = document.getElementById("acesso");
  const fechado = portaoFechado();
  document.body.classList.toggle("sem-acesso", fechado);
  if (!el) return fechado;
  if (!fechado){ if (!el.hidden){ el.hidden = true; el.innerHTML = ""; } return false; }
  const s = lerSessao();
  if (s && s.senha === false && acesso.etapa !== "senha"){ acesso.etapa = "senha"; acesso.motivo = acesso.motivo || "conta"; }
  el.hidden = false;
  el.classList.toggle("apresentando", acesso.etapa === "apresentacao");
  el.innerHTML = htmlAcesso();
  el.querySelectorAll("[data-acesso]").forEach(b => b.addEventListener("click", () => navegarAcesso(b.dataset.acesso)));
  const f = document.getElementById("formAcesso");
  if (!f){ el.scrollTop = 0; return true; }                   // a apresentação: só botões, sem formulário
  f.addEventListener("submit", enviarAcesso);
  el.querySelectorAll("[data-acesso-mostrar]").forEach(c => c.addEventListener("change", () =>
    f.querySelectorAll('input[name^="senha"]').forEach(i => { i.type = c.checked ? "text" : "password"; })));
  const primeiro = f.querySelector(acesso.etapa === "entrar" && acesso.email ? '[name="senha"]' : "input");
  if (primeiro) try { primeiro.focus(); } catch(e){}
  return true;
}
function navegarAcesso(para){
  acesso.erro = ""; acesso.aviso = "";
  if (para === "sair"){ sairAgora(); return; }
  if (para === "reenviar"){ reenviarCodigo(); return; }
  acesso.etapa = para;
  pintarAcesso();
}
async function reenviarCodigo(){
  try {
    if (acesso.tipo === "recovery") await pedirRedefinicao(acesso.email);
    else await pedirCodigo(acesso.email, true);
    acesso.erro = ""; acesso.aviso = "Código reenviado. Veja também o spam.";
  } catch(e){ acesso.erro = traduzirErroAcesso(e); acesso.aviso = ""; }
  pintarAcesso();
}
async function enviarAcesso(ev){
  ev.preventDefault();
  if (acesso.ocupado) return;
  const f = ev.target, d = Object.fromEntries(new FormData(f).entries());
  const etapa = f.dataset.etapa;
  const falha = msg => { acesso.erro = msg; acesso.aviso = ""; acesso.ocupado = false; pintarAcesso(); };
  if (d.email !== undefined) acesso.email = (d.email || "").trim().toLowerCase();
  if (d.email !== undefined && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(acesso.email)) return falha("Digite um e-mail válido.");
  if (etapa === "entrar" && !d.senha) return falha("Digite a senha.");
  if (etapa === "codigo" && !(d.codigo || "").trim()) return falha("Digite o código que chegou no e-mail.");
  if (etapa === "senha"){
    if ((d.senha || "").length < SENHA_MINIMA) return falha("A senha precisa ter pelo menos " + SENHA_MINIMA + " caracteres.");
    if (d.senha !== d.senha2) return falha("As duas senhas não são iguais.");
  }
  acesso.erro = ""; acesso.aviso = ""; acesso.ocupado = true; pintarAcesso();
  try {
    if (etapa === "entrar"){
      await entrarComSenha(acesso.email, d.senha);
      return concluirEntrada("Bem-vindo de volta.");
    }
    if (etapa === "primeiro" || etapa === "esqueci"){
      acesso.tipo = etapa === "primeiro" ? "email" : "recovery";
      if (etapa === "primeiro") await pedirCodigo(acesso.email, true);
      else await pedirRedefinicao(acesso.email);
      acesso.etapa = "codigo"; acesso.ocupado = false; pintarAcesso(); return;
    }
    if (etapa === "codigo"){
      const r = await conferirCodigo(acesso.email, d.codigo.trim(), acesso.tipo || "email");
      if (acesso.tipo !== "recovery" && tem(r, "senha_criada")){
        // o primeiro acesso não serve de porta dos fundos: esta conta entra com a senha
        encerrarSessaoRemota(r.access_token);
        acesso.etapa = "entrar"; acesso.ocupado = false;
        return falha("Este e-mail já tem senha. Entre com ela — ou use “Esqueci minha senha”.");
      }
      gravarSessao(sessaoDe(r, { senha: false }));
      acesso.etapa = "senha"; acesso.motivo = acesso.tipo === "recovery" ? "redefinir" : "primeiro";
      acesso.ocupado = false; pintarAcesso(); return;
    }
    if (etapa === "senha"){
      await gravarSenhaNova(d.senha, (d.nome || "").trim().replace(/\s+/g, " "));
      const motivo = acesso.motivo;
      return concluirEntrada(motivo === "redefinir" ? "Senha nova salva." : "Senha criada — pronto para estudar.");
    }
  } catch(e){ return falha(traduzirErroAcesso(e)); }
}
/** entrou: some a tela, chegam os dados da conta e o app aparece */
async function concluirEntrada(msg){
  Object.assign(acesso, { etapa: "entrar", tipo: "", motivo: "", erro: "", aviso: "", ocupado: false });
  nuvem.estado = "pronta";
  render();                                       // tira a tela de acesso já
  await iniciarNuvem();
  render();
  toast(msg);
  // o que a abertura deixou esperando enquanto ninguém tinha entrado
  if (objetivoPendente && !db.registros.length && !conteudosCad().length && $("#overlay").hidden) modalObjetivo();
  objetivoPendente = false;
  if (precisaPerguntarPosProva() && $("#overlay").hidden) modalPosProva();
}

/** espera a conta sair do "iniciando" (a primeira resposta do Supabase) — no máximo 20 s */
function esperarConta(){
  return new Promise(pronto => {
    const inicio = Date.now();
    const olha = () => (nuvem.estado !== "iniciando" || Date.now() - inicio > 20000) ? pronto() : setTimeout(olha, 200);
    olha();
  });
}

  abrirModal("Conta e sincronização",

       : nuvem.estado === "offline" ? "sem conexão — o que você fez está salvo aqui e sobe depois"
       : esc(nuvem.estado)) + '</b></div>' +
    /* o erro cru do navegador ("Failed to fetch", "Load failed") não diz nada a
       quem usa: sem conexão a frase de cima já explica; o resto vai traduzido */
    (nuvem.erro && nuvem.estado !== "offline" && !/failed to fetch|load failed|networkerror|network request/i.test(nuvem.erro)
      ? '<p class="sub" style="margin-top:8px">Último erro: '+esc(traduzirErroAcesso(nuvem.erro))+'</p>' : '') +

    'entre com o mesmo e-mail e a mesma senha e os dados vêm junto.</p>');
}
/* O PERFIL. A inicial é a do nome da pessoa (o que ela deu ao criar a senha, ou
   em Editar perfil); sem nome, a do e-mail; sem conta, "?". O nome mora na conta
   do Supabase (user_metadata.full_name — é o "Display name" do painel dele) e a
   sessão guarda uma cópia, para aparecer sem internet. Um pontinho no círculo
   avisa quando a sincronização está parada (âmbar) ou com falha (vermelho). */
const nomeDoPerfil = () => { const s = lerSessao(); return (s && s.nome) || ""; };
function inicialDe(nome, email){
  const letra = (String(nome || "").trim().match(/\p{L}/u) || String(email || "").match(/\p{L}/u) || [""])[0];
  return letra ? letra.toLocaleUpperCase("pt-BR") : "?";
}
function pintarPerfil(){
  const s = lerSessao(), nome = nomeDoPerfil(), email = (s && s.email) || "";
  const letra = inicialDe(nome, email);
  const q = id => document.getElementById(id);
  if (!q("btnPerfil")) return;
  q("avatarLetra").textContent = letra; q("menuLetra").textContent = letra;
  // sem nome, o topo do menu mostra só o e-mail (nada de "sem nome")
  q("menuNome").textContent = nome || (s ? email : "Você não está na conta");
  q("menuEmail").textContent = nome ? email : (s ? "" : "os dados ficam só neste navegador");
  q("menuEmail").hidden = !q("menuEmail").textContent;
  q("btnPerfil").title = nome || email ? "Perfil de " + (nome || email) : "Seu perfil";
  q("btnPerfil").setAttribute("aria-label", q("btnPerfil").title);
  document.querySelectorAll("#menuPerfil .so-conta").forEach(el => { el.hidden = !s; });
  const ponto = q("avatarPonto");
  ponto.hidden = !(s && (nuvem.estado === "offline" || nuvem.estado === "erro"));
  ponto.classList.toggle("falha", nuvem.estado === "erro");
  const aberto = !!ui.menuPerfil;
  q("menuPerfil").hidden = !aberto;
  q("btnPerfil").setAttribute("aria-expanded", String(aberto));
}
function abrirMenuPerfil(abrir){
  ui.menuPerfil = abrir === undefined ? !ui.menuPerfil : !!abrir;
  pintarChipNuvem(); pintarChipArquivo(); pintarPerfil();
  if (ui.menuPerfil){ const p = document.querySelector("#menuPerfil .menu-item:not([hidden])"); if (p) try { p.focus(); } catch(e){} }
}
/** Editar perfil: o nome e, se quiser, uma senha nova */
function modalPerfil(){
  const s = lerSessao(); if (!s) return;
  abrirModal("Editar perfil",
    '<form id="formPerfil" novalidate><div class="campos uma-coluna">' +
      campo("Nome (opcional)", '<input name="nome" maxlength="60" autocomplete="name" value="' + esc(nomeDoPerfil()) + '" placeholder="Como você quer ser chamado">', true,
            "Em branco, o círculo do perfil usa a primeira letra do e-mail.") +
      campo("E-mail", '<input value="' + esc(s.email || "") + '" disabled>', true,
            "É o e-mail da conta, usado para entrar e para receber os códigos.") +
      '<div class="campo largo"><span>Trocar a senha (opcional)</span>' +
        '<input type="password" name="senha" autocomplete="new-password" placeholder="Senha nova — pelo menos ' + SENHA_MINIMA + ' caracteres">' +
        '<input type="password" name="senha2" autocomplete="new-password" placeholder="Repita a senha nova" style="margin-top:6px">' +
        '<span class="ajuda-campo">Em branco, a senha continua a mesma.</span></div>' +
    '</div><div class="linha acoes-form"><button class="btn" type="submit">Salvar</button>' +
      '<button class="btn ghost" type="button" data-acao="fechar-modal">Cancelar</button>' +
      '<span class="erro-form" id="erroPerfil"></span></div></form>',
    () => $("#formPerfil").addEventListener("submit", async ev => {
      ev.preventDefault();
      const d = Object.fromEntries(new FormData(ev.target).entries());
      const erro = m => { $("#erroPerfil").textContent = m; };
      const nome = (d.nome || "").trim().replace(/\s+/g, " ");
      if (d.senha || d.senha2){
        if ((d.senha || "").length < SENHA_MINIMA) return erro("A senha precisa ter pelo menos " + SENHA_MINIMA + " caracteres.");
        if (d.senha !== d.senha2) return erro("As duas senhas não são iguais.");
      }
      erro("Salvando…");
      try {
        const corpo = { data: { full_name: nome } };
        if (d.senha) Object.assign(corpo, { password: d.senha }, { data: { full_name: nome, senha_criada: true } });
        await chamarNuvem("/auth/v1/user", { method: "PUT", body: JSON.stringify(corpo) }, true);
        const agora = lerSessao(); if (agora){ agora.nome = nome; gravarSessao(agora); }
        fecharModal(); render();
        toast(d.senha ? "Perfil e senha atualizados." : "Perfil atualizado.");
      } catch(e){ erro(traduzirErroAcesso(e)); }
    }));
}
/** o chip do cabeçalho conta, em uma linha, onde os dados estão sendo gravados */
function pintarChipArquivo(){
  const c = document.getElementById("chipArquivo"); if (!c) return;
  const mapa = {
    indisponivel: ["", "", "", "", true],
    // com a conta, os dados já estão na nuvem: o arquivo é um extra, não um alerta
    //            [texto, aviso à direita, classe do aviso, título, esconder]
    desligado:    lerSessao() ? ["Gravar também num arquivo do computador", "", "", "Gravar uma cópia num arquivo no computador (Chrome/Edge)", false]
                              : ["Só no navegador", "", "", "Os dados só estão no navegador — clique para gravar num arquivo", false],
    permissao:    ["Arquivo " + arq.nome, "reconectar", "atencao", "Autorize de novo para voltar a gravar em " + arq.nome, false],
    pronto:       ["Arquivo " + arq.nome, "", "", "Gravando em " + arq.nome + (arq.ultimo ? " · último: " + horaDe(arq.ultimo) : ""), false],
    erro:         ["Arquivo " + (arq.nome || ".json"), "falha ao gravar", "falha", arq.erro, false]
  };
  const [texto, aviso, classe, titulo, esconder] = mapa[arq.estado] || mapa.desligado;
  c.hidden = esconder;
  c.className = "menu-item menu-estado";       // mora no menu do perfil, com o desenho dos outros itens
  c.title = titulo;
  c.innerHTML = ICONE_ARQUIVO + ' ' + esc(texto) +
    (aviso ? ' <em class="menu-aviso' + (classe ? " " + classe : "") + '">' + esc(aviso) + '</em>' : '');
}

function exportar(){
  const blob = new Blob([JSON.stringify(db, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "estudos-" + D.hoje() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  toast("Cópia dos dados baixada.");
}
/** true se o objeto tem a cara de um backup desta plataforma */
const pareceBackup = d => !!d && typeof d === "object" &&
  Array.isArray(d.registros) && Array.isArray(d.revisoes) && Array.isArray(d.erros);
/** adota um JSON como estado atual (usado pela importação e pelo arquivo local) */
function aplicarDados(d){
  const r = prepararDados(d);                 // as mesmas migrações da abertura (ver prepararDados)
  db = r.db;
  const soltos = r.soltos;
  soltos.forEach(id => { const r = acharRegistro(id); if (r) gerarRevisoes(r, { base: D.hoje() }); });
  garantirAgenda();
  return soltos.length;
}
function importar(arquivo){
  const leitor = new FileReader();
  leitor.onload = async () => {
    let d;
    try { d = JSON.parse(leitor.result); }
    catch(e){ avisar("Arquivo inválido", "Este arquivo não é uma cópia dos dados da plataforma."); return; }
    if (!pareceBackup(d)){
      avisar("Arquivo inválido", "Este arquivo não parece uma cópia dos dados desta plataforma."); return;
    }
    if (!(await confirmar({ titulo: "Restaurar uma cópia", botao: "Substituir tudo", perigo: true,
          texto: "Isso substitui todos os dados atuais pelos da cópia." }))) return;
    const soltos = aplicarDados(d);
    /* A marca do envio. No Supabase, o gatilho do histórico guarda a versão que
       estava lá SEMPRE que esta marca muda — enviar um backup troca tudo de uma
       vez, e a versão anterior da nuvem precisa ficar a salvo (estrutura.sql). */
    db.importadoEm = Date.now();
    persistir(true); render();
    toast(soltos ? "Cópia restaurada — " + plural(soltos, "sessão saiu", "sessões saíram") + " do antigo plano por disciplina."
                 : "Cópia restaurada.");
  };
  leitor.readAsText(arquivo);
}

/* ---------- delegação de eventos ---------- */
document.addEventListener("click", async ev => {   // async: as confirmações do app esperam a resposta
  // o menu do perfil fecha ao clicar fora dele (e depois de escolher um item)
  if (ui.menuPerfil && !(ev.target.closest && ev.target.closest("#btnPerfil"))){
    if (!ev.target.closest("#menuPerfil") || ev.target.closest(".menu-item,.menu-estado")) abrirMenuPerfil(false);
  }
  /* a lista de um filtro (listasDosFiltros): a caixa abre e fecha; escolher troca o
     valor do <select> escondido e avisa; clicar fora fecha */
  const caixaLista = ev.target.closest && ev.target.closest(".lista-unica");
  if (caixaLista){
    const op = ev.target.closest(".op-unica");
    if (!op){ alternarListaFiltro(caixaLista, !caixaLista.classList.contains("aberto")); return; }
    const sel = caixaLista.previousElementSibling;
    alternarListaFiltro(null, false);
    if (sel && sel.value !== op.dataset.valor){
      sel.value = op.dataset.valor;
      sel.dispatchEvent(new Event("change", { bubbles: true }));
    }
    return;
  }
  if (document.querySelector(".lista-unica.aberto")) alternarListaFiltro(null, false);
  // a lista de várias disciplinas (Questões) fecha ao clicar em qualquer lugar fora dela
  if (ui.qDiscsAberto && !(ev.target.closest && ev.target.closest(".multi-disc"))){
    ui.qDiscsAberto = false;
    if (!ev.target.closest("[data-acao],[data-aba]")){ render(); return; }
  }
  const aba = ev.target.closest("[data-aba]");
  if (aba){
    // entrar no Progresso é querer o panorama: o dia escolhido antes não fica preso (R5, 27/09)
    if (aba.dataset.aba === "painel" && ui.aba !== "painel") ui.diaSel = null;
    ui.aba = aba.dataset.aba; ui.foco = null; ui.formAberto = false; render(); return;
  }
  const alvo = ev.target.closest("[data-acao]");
  if (!alvo) return;
  const id = alvo.dataset.id;
  switch (alvo.dataset.acao){
    case "abrir-ajustes": ev.preventDefault(); modalAjustes(); break;
    /* o card das datas só INFORMA onde se muda a data (pedido do Pedro, 25/09): antes
       ele abria os Ajustes, e tocar nele por engano no celular jogava a pessoa lá.
       O aviso ganhou o atalho "Abrir Ajustes" (R4, 27/09): o toque por engano continua
       sem mudar nada, e quem queria mudar a data não perde o toque. */
    case "info-datas":
      toast(semProva() ? "Para marcar a data da prova, use os Ajustes."
                       : "A data da prova pode ser alterada nos Ajustes.",
            { rotulo: "Abrir Ajustes", fazer: modalAjustes });
      break;
    case "abrir-ajuda": ev.preventDefault(); modalAjuda(); break;
    case "ajuda-ir": ev.preventDefault(); irParaAjuda(alvo.dataset.alvo); break;   // sumário da ajuda
    case "minimizar-anot": {                                // bloco de anotações, com a mesma ancoragem da Agenda
      const seletor = '[data-acao="minimizar-anot"][data-chave="' + CSS.escape(alvo.dataset.chave) + '"]';
      manterNoLugar(alvo, seletor, () => { alternarMinimizado(alvo.dataset.chave); render(); });
      break; }
    case "minimizar-assunto": {
      const seletor = '[data-acao="minimizar-assunto"][data-chave="' + CSS.escape(alvo.dataset.chave) + '"]';
      manterNoLugar(alvo, seletor, () => { alternarMinimizado(alvo.dataset.chave); render(); });
      break; }
    /* dias do vestibular: a lista cresce e encolhe no lugar, sem redesenhar —
       redesenhar apagaria o que já foi digitado nos outros campos */
    case "add-dia-prova": {
      const lista = $("#listaDiasProva"); if (!lista) break;
      const n = lista.querySelectorAll(".dia-prova").length;
      lista.insertAdjacentHTML("beforeend", linhaDiaProva({ id: uid(), nome: (n + 1) + "º dia", data: "" }));
      const ultima = lista.lastElementChild.querySelector('[name="diaData"]'); if (ultima) ultima.focus();
      break; }
    case "tirar-dia-prova": { const linha = alvo.closest(".dia-prova"); if (linha) linha.remove(); break; }
    case "fechar-modal": fecharModal(); break;
    case "baixar-danificado": baixarDanificado(); break;
    case "concluir": { const r = acharRevisao(id);
      if (r && bloqueadaPelaProva(r)){ toast("Bloqueada até " + D.br(bloqueadaPelaProva(r)) + ": até a prova valem as revisões personalizadas."); break; }
      if (r) registrarRevisao(r); break; }
    case "reabrir":  { const r = acharRevisao(id);
      if (r && await confirmar({ titulo: "Desmarcar", botao: "Desmarcar",
            texto: "A sessão de estudo ligada a este item continua registrada." })){
        reabrirRevisao(r); render(); toast("Revisão desmarcada.");
      } break; }
    case "editar-registro": ui.editandoRegistro = id; ui.formAberto = false; ui.aba = "registros"; render(); break;
    case "toggle-form-registro": ui.formAberto = !ui.formAberto; render(); break;
    case "cancelar-edicao": ui.editandoRegistro = null; ui.prefill = null; ui.formAberto = false; render(); break;
    case "excluir-registro": {
      const r = acharRegistro(id); if (!r) break;
      const nLanc = lancamentosDoRegistro(id).length;
      if (await confirmar({ titulo: "Excluir sessão", botao: "Excluir", perigo: true,
          texto: 'Excluir a sessão de "'+rotuloAssuntos(r)+'" ('+D.brFull(r.data)+')?' +
          (nLanc ? '\n\nJunto sai' + (nLanc === 1 ? 'm as questões lançadas nela' : 'm os ' + nLanc + ' registros de questões lançados nela') + '.' : '') +
          '\n\nA agenda do conteúdo continua, se outra sessão dele estiver registrada.' })){
        excluirRegistro(id); if (ui.editandoRegistro === id) ui.editandoRegistro = null;
        render(); toast("Sessão excluída.");
      }
      break;
    }
    case "sel-conteudo":
      ui.eAssunto = alvo.dataset.k; ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null; ui.foco = null;
      render(); break;
    case "abrir-composer": ui.compondo = true; ui.editandoErro = null; ui.foco = "txtNovo"; render(); break;
    case "salvar-pos-prova": salvarPosProva(); break;
    case "continuar-sessao": {
      const r = acharRegistro(id); if (!r) break;
      /* Já existe sessão deste conteúdo hoje? Continuar é somar horas nela —
         abrir outra igual é o que enchia a lista de sessões com o mesmo nome. */
      const chave = chaveSessao(r);
      const hojeMesmo = db.registros.find(x => x.data === D.hoje() && chaveSessao(x) === chave);
      if (hojeMesmo){
        ui.editandoRegistro = hojeMesmo.id; ui.formAberto = false;
        toast("Já há uma sessão deste conteúdo hoje — o tempo entra nela.");
      } else if (ehRevisaoSessao(r)){
        /* Continuar uma REVISÃO é outra revisão, não estudo (pedido do Pedro,
           27/09 — antes a nova nascia como estudo). Revisão precisa de um item
           da agenda para cumprir: vai o deste conteúdo que estiver na vez. Sem
           nenhum, o formulário abre como revisão pedindo a escolha. */
        const rev = revisaoParaContinuar(r);
        ui.prefill = { data: D.hoje(), tipo: "revisao", revisaoId: rev ? rev.id : "",
                       disciplina: "", assuntos: [], minutos: "", questoes: "", acertos: "",
                       dificuldade: dificuldadeDe(r), anotacoes: rev ? (rev.nota || "").trim() : "" };
        ui.editandoRegistro = null; ui.formAberto = true;
        if (!rev) toast("Não há revisão deste conteúdo na agenda — escolha qual esta sessão cumpre.");
      } else {
        /* A sessão nova HERDA da sessão de origem o que é do conteúdo e do jeito de
           estudar — disciplina, conteúdos, dificuldade e o "sem revisão" (pedido do
           Pedro, 24/09). Não herda o que é daquele dia: tempo, questões e a
           descrição. A sessão feita do zero continua sem dificuldade escolhida. */
        ui.prefill = { data: D.hoje(), tipo: "estudo", disciplina: r.disciplina,
                       assuntos: assuntosDe(r).slice(), minutos: "", questoes: "", acertos: "",
                       dificuldade: dificuldadeDe(r), plano: planoDe(r) === "sem" ? "sem" : "individual",
                       anotacoes: "" };
        ui.editandoRegistro = null; ui.formAberto = true;
      }
      ui.aba = "registros"; ui.foco = null; redesenharTelaForm(); break; }
    case "cancelar-composer": ui.compondo = false; ui.rascunhoAnot = ""; ui.alvoAnot = null; ui.foco = null; render(); break;
    case "salvar-aprendizado": salvarNovoAprendizado(); break;
    case "editar-erro": ui.editandoErro = id; ui.compondo = false; ui.rascunhoAnot = ""; ui.foco = null; render(); break;
    case "cancelar-edicao-erro": ui.editandoErro = null; render(); break;
    case "excluir-erro":
      if (await confirmar({ titulo: "Excluir anotação", texto: "A anotação some e não dá para desfazer.", botao: "Excluir", perigo: true })){ excluirErro(id); ui.editandoErro = null; render(); toast("Anotação excluída."); }
      break;
    case "q-periodo": ui.qPeriodo = Number(alvo.dataset.dias) || 30; render(); break;
    /* Alterna: clicar numa disciplina já escolhida a TIRA da seleção. Sem
       disciplina nenhuma marcada, a aba fala de todas — que é o mesmo que
       "Todas" e evita o estado sem saída de zero selecionadas e nada na tela. */
    case "filtrar-questoes": {
      const d = alvo.dataset.disc;
      if (!Array.isArray(ui.qDiscs)) ui.qDiscs = [];
      if (!d) ui.qDiscs = [];
      else if (ui.qDiscs.indexOf(d) >= 0) ui.qDiscs = ui.qDiscs.filter(x => x !== d);

/* Aqui viviam cinco listeners do tempo em que o texto da etiqueta se digitava
   na própria etiqueta (digitar, colar, Enter, Esc, esvaziar). Esse campo saiu
   há tempos; eles só sobreviviam por inércia, junto de um CSS que dava cursor
   de texto a algo que não aceitava texto. Quem renomeia agora é o ✎ da
   etiqueta, que muda a FICHA em todo o sistema.                            */
document.addEventListener("change", ev => {
  // a dificuldade de um conteúdo, mudada na aba Disciplinas
  if (ev.target.matches && ev.target.matches(".sel-dif-cont") && ev.target.value){
    const f = acharConteudo(ev.target.dataset.disc, ev.target.dataset.cont); if (!f) return;
    const outros = definirDificuldadeDoConteudo(f, ev.target.value);
    garantirAgenda(); persistir(); render();
    toast(f.nome + ": " + CONFIG.DIFICULDADES[tresNiveis(ev.target.value)].nome.toLowerCase() +
          (sessoesDaFicha(f).length ? " — agenda refeita" : " — vale a partir da primeira sessão") +
          (outros.length ? ". Vale também para " + outros.join(", ") + ", da mesma sessão." : "."));
    return;
  }
  if (ev.target.matches && ev.target.matches('#formRegistro input[name="juntar"]')){ alternarJuntar(ev.target); return; }
  // escolheu a data: tira o foco para o calendário do navegador fechar sozinho
  if (ev.target.matches && ev.target.matches('input[type="date"]')) ev.target.blur();
  // "＋ Criar novo conteúdo" abre o campo do nome, ali mesmo
  if (ev.target.id === "campoAssunto"){
    const cx = document.getElementById("novoConteudoNome");
    if (cx){ cx.hidden = ev.target.value !== "__novo"; if (!cx.hidden) cx.focus(); }
    // escolher já adiciona — sem redesenhar: preserva o que já foi digitado
    if (ev.target.value && ev.target.value !== "__novo") adicionarAssuntoForm();
    return;
  }
  // o nome do conteúdo novo, ao sair do campo (no celular, é o "ok" do teclado)
  if (ev.target.id === "novoConteudoNome"){
    if (ev.target.value.trim()) adicionarAssuntoForm();
    return;
  }
  /* Trocou a disciplina da anotação: a lista de conteúdos é outra. Refeita no
     lugar, sem render() — redesenhar apagaria o texto já digitado. */
  if (ev.target.matches && ev.target.matches('[name="alvoDisciplina"]')){
    const raiz = ev.target.closest("form, .compositor");
    const sc = raiz && raiz.querySelector('[name="alvoConteudo"]');
    if (sc) sc.innerHTML = opcoesConteudoDe(ev.target.value, "");
    return;
  }
  // ligação opcional a um dia de prova (aba Disciplinas)
  if (ev.target.matches && ev.target.matches("select[data-vinc-disc]")){
    const disc = ev.target.dataset.vincDisc, nome = ev.target.dataset.vincCont || "";
    mudarLigacao(disc, nome, ev.target.value);
    persistir(); render();
    const dia = acharDiaProva(ev.target.value);
    toast((nome || disc) + (dia ? " ligado a " + nomeDoDia(dia) : ev.target.value === "-" ? " sem dia de prova"
                                  : nome ? " segue a disciplina" : " sem dia de prova") + ".");
    return;
  }
  // "Isto apareceu numa questão?": o bloco abre e fecha na hora, sem redesenhar
  if (ev.target.name === "daQuestao"){
    const painel = document.getElementById("painelQuestao");
    const abrir = ev.target.value === "sim";
    if (painel) painel.classList.toggle("aberto", abrir);
    document.querySelectorAll('[name="daQuestao"]')
      .forEach(r => r.setAttribute("aria-expanded", abrir ? "true" : "false"));
    return;
  }
  // filtro de assunto da Agenda
  // o par Disciplina / Conteúdo de qualquer aba (filtroDiscCont): a disciplina manda no conteúdo, e vice-versa
  if (ev.target.dataset && ev.target.dataset.filtroDc){
    const campos = FILTROS_DC[ev.target.dataset.filtroDc]; if (!campos) return;
    const v = ev.target.value;
    if (ev.target.dataset.parte === "disc"){
      ui[campos.disc] = v;
      if (ui[campos.cont] && discDaChave(ui[campos.cont]) !== v) ui[campos.cont] = "";
    } else {
      ui[campos.cont] = v;
      if (v && campos.disc) ui[campos.disc] = discDaChave(v);
    }
    ui.foco = null; render(); return;
  }
  if (ev.target.id === "ajudaIr"){ if (ev.target.value) irParaAjuda(ev.target.value); ev.target.value = ""; return; }
  // trocar a disciplina recomeça o conteúdo: o escolhido pode não ser dela

  // filtros da aba Aprendizados: disciplina manda no conteúdo, e vice-versa
  if (ev.target.id === "eDisciplina"){
    ui.eDisciplina = ev.target.value;
    const atual = ui.eAssunto ? assuntos().find(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto) : null;
    if (!ui.eDisciplina || (atual && atual.disciplina !== ui.eDisciplina)) ui.eAssunto = "";
    ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null;
    render(); return;
  }
  if (ev.target.id === "eAssunto"){
    ui.eAssunto = ev.target.value;
    const atual = ui.eAssunto ? assuntos().find(a => chaveAssunto(a.disciplina, a.assunto) === ui.eAssunto) : null;
    if (atual) ui.eDisciplina = atual.disciplina;
    ui.compondo = false; ui.rascunhoAnot = ""; ui.editandoErro = null;
    render(); return;
  }
  const mapa = { fPeriodo:"fPeriodo", fOrdem:"fOrdem", fTipo:"fTipo",
                 cronoDestino:"cronoDestino" };
  if (mapa[ev.target.id]){ ui[mapa[ev.target.id]] = ev.target.value; ui.foco = null; render(); }
});
/* O FOCO FICA NA JANELA. Com uma tela sobreposta (ou a pergunta curta) aberta, o
   Tab dava a volta e ia parar nos botões da página de trás, escondida pelo véu. */
document.addEventListener("keydown", ev => {
  if (ev.key !== "Tab") return;
  const caixa = !$("#dialogo").hidden ? $("#dialogo .modal") : !$("#overlay").hidden ? $("#modalCaixa") : null;
  if (!caixa) return;
  const foc = [...caixa.querySelectorAll('button,[href],input:not([type=hidden]),select,textarea,summary,[tabindex]:not([tabindex="-1"])')]
    .filter(el => !el.disabled && !el.closest("[hidden]") && el.getClientRects().length);
  if (!foc.length) return;
  const primeiro = foc[0], ultimo = foc[foc.length - 1];
  if (!caixa.contains(document.activeElement)){ ev.preventDefault(); primeiro.focus(); return; }
  if (ev.shiftKey && document.activeElement === primeiro){ ev.preventDefault(); ultimo.focus(); }
  else if (!ev.shiftKey && document.activeElement === ultimo){ ev.preventDefault(); primeiro.focus(); }
});

/* ARRASTAR PARA REORDENAR AS ANOTAÇÕES DE UM CARD.
   Regras que valem a pena saber antes de mexer:
   - só reordena DENTRO do mesmo card (article.apr). Cards diferentes são dias
     ou conteúdos diferentes, e mover entre eles seria mudar o dado, não a ordem;
   - o item se move no DOM durante o arrasto e só é GRAVADO no fim (dragend).
     Nada de render() no meio: redesenhar cancela o arrasto do navegador;
   - a gravação lê a ordem que ficou no DOM e numera de 0 a n-1, o card inteiro.
     Assim não existe card meio arrumado meio automático.
   - o id do item viaja numa variável, não no dataTransfer: o dataTransfer não
     dá para ler durante o dragover em vários navegadores, e é justo aí que
     precisamos saber quem está sendo arrastado.                              */
/* O MESMO ARRASTAR SERVE A DUAS LISTAS: as anotações de um card e o mural
   "Falta estudar" da aba Hoje. Cada uma diz qual é o item, a alça, a lista em
   que ele pode andar e como gravar a ordem. */
const ARRASTAVEIS = [
  { item: "data-anotacao", alca: "mover-anotacao", lista: el => el.closest("article.apr"),
    gravar: lista => gravarOrdemDoCard(lista), aviso: "Ordem das anotações salva." },
  { item: "data-afazer", alca: "mover-afazer", lista: el => el.closest(".mural-lista"),
    gravar: lista => gravarOrdemMural(lista), aviso: "Prioridade salva." }
];
let arrasto = null;                               // { el, tipo } enquanto algo está sendo arrastado

/** de que lista arrastável este elemento faz parte (pelo item ou pela alça) */
function tipoArrastavel(el, pela){
  if (!el || !el.closest) return null;
  for (const t of ARRASTAVEIS){
    const achado = pela === "alca" ? el.closest('[data-acao="' + t.alca + '"]') : el.closest("[" + t.item + "]");
    if (achado) return { t, achado };
  }
  return null;
}

/** grava a ordem que ficou na tela, para o card inteiro */
function gravarOrdemDoCard(card){
  if (!card) return;
  const ids = [...card.querySelectorAll("[data-anotacao]")].map(el => el.dataset.anotacao);
  let mudou = false;
  ids.forEach((id, i) => {
    const e = acharErro(id);
    if (e && e.ordem !== i){ e.ordem = i; mudou = true; }
  });
  if (mudou) persistir();
  return mudou;
}

/** move o item uma posição para cima (-1) ou para baixo (+1), pelo teclado */
function moverItem(t, id, passo){
  const item = document.querySelector("[" + t.item + '="' + CSS.escape(id) + '"]');
  const lista = item && t.lista(item);
  if (!item || !lista) return false;
  const irmaos = [...lista.querySelectorAll("[" + t.item + "]")];
  const i = irmaos.indexOf(item), j = i + passo;
  if (j < 0 || j >= irmaos.length) return false;
  if (passo < 0) lista.insertBefore(item, irmaos[j]);
  else           lista.insertBefore(item, irmaos[j].nextSibling);
  t.gravar(lista);
  const alca = item.querySelector('[data-acao="' + t.alca + '"]');
  if (alca) alca.focus();                        // o foco acompanha quem se moveu
  return true;
}

/* A alça só liga o "draggable" quando o ponteiro desce nela: com o item sempre
   arrastável, selecionar o texto (da anotação) virava arrasto. */
document.addEventListener("mousedown", ev => {
  const a = tipoArrastavel(ev.target, "alca");
  const item = a && a.achado.closest("[" + a.t.item + "]");
  if (item) item.setAttribute("draggable", "true");
});
document.addEventListener("dragstart", ev => {
  const a = tipoArrastavel(ev.target, "item");
  if (!a || a.achado.getAttribute("draggable") !== "true") return;
  arrasto = { el: a.achado, t: a.t };
  a.achado.classList.add("arrastando");
  if (ev.dataTransfer){ ev.dataTransfer.effectAllowed = "move";
    try { ev.dataTransfer.setData("text/plain", a.achado.getAttribute(a.t.item)); } catch(e){} }
});
document.addEventListener("dragover", ev => {
  if (!arrasto) return;
  const alvo = ev.target.closest && ev.target.closest("[" + arrasto.t.item + "]");
  const lista = arrasto.t.lista(arrasto.el);
  if (!alvo || alvo === arrasto.el || !lista || arrasto.t.lista(alvo) !== lista) return;
  ev.preventDefault();                           // sem isto o navegador recusa o drop
  const r = alvo.getBoundingClientRect();
  const depois = (ev.clientY - r.top) > r.height / 2;
  lista.insertBefore(arrasto.el, depois ? alvo.nextSibling : alvo);
});
document.addEventListener("drop", ev => { if (arrasto) ev.preventDefault(); });
document.addEventListener("dragend", () => {
  if (!arrasto) return;
  const { el, t } = arrasto;
  el.classList.remove("arrastando");
  el.removeAttribute("draggable");
  if (t.gravar(t.lista(el))) toast(t.aviso);
  arrasto = null;
});

/* O corpo do item de hoje é um link (role="link", tabindex="0"): quem navega
   pelo teclado precisa do Enter e do espaço, que num <div> não vêm de graça. */
document.addEventListener("keydown", ev => {

});

/* O TOOLTIP DO GRÁFICO. Vive num <div> sobre o SVG, não num <title> do SVG: o
   nativo demora a aparecer e não dá para pintar os quadradinhos da legenda.
   O alvo do hover é a FAIXA inteira do dia, bem mais larga que a barra — com
   3px de barra ninguém acerta o ponteiro. */
document.addEventListener("mouseover", ev => {
  const alvo = ev.target.closest && ev.target.closest(".grafico-q [data-dia]");
  if (!alvo) return;
  const caixa = alvo.closest(".grafico-q"); if (!caixa) return;
  const bolha = caixa.querySelector(".dica-grafico"); if (!bolha) return;
  const q = Number(alvo.dataset.q) || 0, a = Number(alvo.dataset.a) || 0;
  const taxa = q ? Math.round((a / q) * 100) : null;
  bolha.innerHTML = '<b>' + esc(D.brFull(alvo.dataset.dia)) + '</b><br>' +
    (q ? '<i style="background:var(--s1)"></i>Acertos: <b>' + a + '</b><br>' +
         '<i style="background:var(--s2)"></i>Erros: <b>' + (q - a) + '</b><br>' +
         'Total: <b>' + q + '</b>' + (taxa === null ? "" : ' · ' + taxa + '%')
       : 'Nenhuma questão neste dia');
  bolha.hidden = false;
});
document.addEventListener("mousemove", ev => {
  const alvo = ev.target.closest && ev.target.closest(".grafico-q [data-dia]");
  if (!alvo) return;
  const caixa = alvo.closest(".grafico-q");
  const bolha = caixa && caixa.querySelector(".dica-grafico");
  if (!bolha || bolha.hidden) return;
  const r = caixa.getBoundingClientRect();
  bolha.style.left = Math.max(60, Math.min(r.width - 60, ev.clientX - r.left)) + "px";
  bolha.style.top  = Math.max(34, ev.clientY - r.top - 10) + "px";
});
document.addEventListener("mouseout", ev => {
  const alvo = ev.target.closest && ev.target.closest(".grafico-q [data-dia]");
  if (!alvo) return;
  const caixa = alvo.closest(".grafico-q");
  const bolha = caixa && caixa.querySelector(".dica-grafico");
  if (bolha) bolha.hidden = true;
});

/* A alça responde às setas: é o caminho de quem usa teclado. No celular não há
   setas nem arrastar do HTML — lá são os botões ↑ ↓ de setasDeToque. */
document.addEventListener("keydown", ev => {
  if (ev.key !== "ArrowUp" && ev.key !== "ArrowDown") return;
  const a = tipoArrastavel(ev.target, "alca");
  if (!a) return;
  ev.preventDefault();
  moverItem(a.t, a.achado.dataset.id, ev.key === "ArrowUp" ? -1 : 1);
});

/* A VIRADA DO DIA. Deixar a plataforma aberta a noite toda (ou o celular só
   dormindo com a aba aberta) mantinha a tela no dia anterior: "hoje", a
   contagem regressiva e o dia do Painel só eram recalculados num render, e
   nenhum acontecia sozinho. Agora um relógio confere de minuto em minuto — e
   também quando a aba volta a ficar visível, que é o caso do celular.       */
let diaCorrente = D.hoje();
function verificarVirada(){
  const agora = D.hoje();
  if (agora === diaCorrente) return;
  const seguiaHoje = ui.diaSel === diaCorrente;       // estava no "hoje", não num dia escolhido
  const mesAnterior = diaCorrente.slice(0,7);
  diaCorrente = agora;
  if (seguiaHoje) ui.diaSel = agora;
  ui.cronoDestino = "";                            // o cronômetro recomeça do zero no dia novo
  if (ui.mesCal === mesAnterior) ui.mesCal = agora.slice(0,7);
  if (garantirAgenda()) persistir();            // o dia virou: ninguém fica sem agendamento
  render();
  toast("Virou o dia: a tela agora mostra " + D.brFull(agora) + ".");
  if (precisaPerguntarPosProva() && $("#overlay").hidden) modalPosProva();
}
setInterval(() => { if (!document.hidden) verificarVirada(); }, 60000);   // escondida, confere ao voltar (abaixo)

window.addEventListener("focus", verificarVirada);

        "Conclua cada um quando terminar.");
}
if (inicio.mantidas) persistir();  // a marca das mantidas antigas (marcarMantidasAntigas) fica gravada
arranqueFeito = true;             // daqui em diante, gravar é mexer de verdade (ver dataDoLocal)
iniciarArquivo();                 // religa o .json escolhido antes, se houver
iniciarNuvem();                   // e a conta da nuvem, se houver sessão salva
// voltou a ter conexão: sobe o que ficou pendente
/* A CONEXÃO VOLTOU. Se o app abriu sem internet, a conferência com a conta (baixar o
   que for mais novo, subir o que ficou aqui) nunca aconteceu — ela é refeita agora,
   em vez de esperar a próxima alteração ou um recarregar. Se só havia gravação
   pendente, basta subir. */
window.addEventListener("online", () => {
  if (!lerSessao() || !nuvemLigada()) return;
  if (nuvem.estado === "offline" || nuvem.estado === "iniciando") iniciarNuvem();
  else if (nuvem.pendente) subirParaNuvem();
});
/* PWA (26/09): o service worker (sw.js) guarda o app no aparelho para ele abrir sem
   internet. Só no endereço publicado (https) ou no localhost — aberto como arquivo
   (file://) o navegador não aceita, e o app segue como sempre. */
if ("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost"))
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
/* Pede ao navegador que trate estes dados como permanentes: sem isso ele pode
   descartá-los sozinho quando o disco aperta. Não protege de uma limpeza feita
   à mão, mas tira o risco de sumiço silencioso. */
if (navigator.storage && navigator.storage.persist){
  navigator.storage.persisted().then(ja => { if (!ja) navigator.storage.persist(); }).catch(() => {});
}
if (inicio.desintegrados && inicio.desintegrados.length){
  inicio.desintegrados.forEach(id => {
    const r = acharRegistro(id); if (r) gerarRevisoes(r, { base: D.hoje() });
  });
  persistir(); render();
  toast(plural(inicio.desintegrados.length, "sessão saiu", "sessões saíram") + " do antigo plano por disciplina — " +
        "reintegre escolhendo o conteúdo no formulário de registro.");
}
if (inicio.migrados){
  persistir();
  toast(plural(inicio.migrados, "observação do protótipo virou anotação", "observações do protótipo viraram anotações") + ".");
}
})();
</script>
