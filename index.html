<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Estudos — reta final</title>
<style>
/* ============================================================
   PALETA — cores tranquilas para foco (bege quente + verde-sálvia).
   As cores de gráfico (--s1..--s6, --seq1..4, status) vêm de uma
   paleta validada para daltonismo e contraste nas duas superfícies.
   ============================================================ */
:root{
  color-scheme:light;
  /* superfícies secundárias: mesma família areia do papel, com mais corpo —
     #eceae2 dava só 1,07:1 contra o fundo e era lido como "apagado". */
  --bg:#f2f1ec; --surface:#fbfaf7; --surface-2:#e9e5d9; --surface-3:#ded9c9;
  /* campos das telas de criação/edição: papel em que se escreve, com aro visível.
     Antes o campo era do tom do fundo (1,08:1) com aro de 1,33:1 — parecia travado. */
  --campo-fundo:#fdfcfa; --campo-borda:#9e9a8b;
  /* superfície do chrome ativo: o mesmo verde claro do resto da identidade */
  --chrome:var(--accent-soft); --chrome-borda:var(--accent);
  --border:#dedbd2; --text:#333a3c; --text-2:#5c6568; --muted:#7d8589;
  --accent:#5f8a7d; --accent-ink:#3f6c5f; --accent-soft:#e3ece8; --accent-forte:#53786d;
  --star:#b8912f; --danger:#b0706a;
  /* séries categóricas (ordem fixa, nunca cíclica) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  /* rampa do calendário (quanto se estudou no dia), clara -> forte.
     Verde da identidade e clara o bastante para o número do dia continuar
     legível por cima: o azul escuro que havia aqui dava 1,75:1. */
  --seq0:var(--surface); --seq1:#e1eae7; --seq2:#cbdcd7; --seq3:#b1cdc5; --seq4:#93bdb1;
  --cal-fundo:#eeebe1;                  /* painel discreto atrás do calendário */
  /* status (reservados, nunca usados como série) */
  --bom:#0ca30c; --alerta:#fab219; --serio:#ec835a; --critico:#d03b3b;
  /* fundos suaves dos status — o mesmo tom, só que respirável atrás de texto */
  --bom-soft:#e3f3e3; --alerta-soft:#fdf2da; --critico-soft:#fbe9e8; --star-soft:#f6efdc;
  --bom-ink:#0a7a0a; --alerta-ink:#8a6410; --critico-ink:#9c2f2f;
  --foco:rgba(95,138,125,.30);            /* anel de foco */
  --brilho:rgba(95,138,125,.30);          /* sombra dos elementos preenchidos */
  --brilho-critico:rgba(208,59,59,.30);
  --grade:#e1e0d9; --eixo:#c3c2b7;
  --radius:11px;
  --shadow:0 1px 2px rgba(60,60,50,.05), 0 4px 16px rgba(60,60,50,.04);
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --bg:#1c2123; --surface:#242a2c; --surface-2:#333b3d; --surface-3:#414a4c;
  --campo-fundo:#2a3133; --campo-borda:#616b6d;
  --chrome:var(--accent-soft); --chrome-borda:var(--accent);
  --border:#394143; --text:#dde2e0; --text-2:#b6bfbe; --muted:#8d9899;
  --accent:#7fae9f; --accent-ink:#9cc4b7; --accent-soft:#2b3a36; --accent-forte:#7fae9f;
  --star:#cfae5c; --danger:#c68983;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --seq0:var(--surface); --seq1:#24332e; --seq2:#2f463f; --seq3:#3a5950; --seq4:#466d61;
  --cal-fundo:#1e2426;
  --bom-soft:#1e3324; --alerta-soft:#3a3320; --critico-soft:#3a2626; --star-soft:#352f1f;
  --bom-ink:#7fd67f; --alerta-ink:#e3bd6a; --critico-ink:#e79b9b;
  --foco:rgba(127,174,159,.34);
  --brilho:rgba(0,0,0,.28); --brilho-critico:rgba(0,0,0,.3);
  --grade:#2f3739; --eixo:#454e50;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.15);
}
/* ---------------------------------------------------------------------------
   ROLLBACK DOS TONS (teste de 18/09/2026 — "A+B")
   A mudança: superfícies secundárias com mais corpo (surface-2/3), o texto
   que fica em cima delas em --text-2 no lugar do cinza-frio --muted, os
   campos das telas de criação/edição com fundo claro e aro visível
   (--campo-fundo / --campo-borda) e o chrome ativo — barra de filtros e
   cabeçalho do card de anotação — no verde claro da identidade (--chrome).
   Tudo isso passava ideia de desabilitado.
   PARA VOLTAR AO ANTERIOR: basta escrever  data-tons="classico"  na tag <html>
   (linha 2). Nada mais muda — este bloco devolve os valores antigos.
   PARA MANTER: apague este bloco inteiro quando decidir.
   --------------------------------------------------------------------------- */
html[data-tons="classico"]{ --surface-2:#eceae2; --surface-3:#e3e0d6;
                           --campo-fundo:var(--bg); --campo-borda:var(--border);
                           --chrome:var(--surface-2); --chrome-borda:var(--border) }
html[data-tons="classico"] .apr-cab .badge{ background:var(--surface-2) }
html[data-tons="classico"] .apr-item.em-edicao{ background:var(--surface-2) }
html[data-tons="classico"] .filtros .marca-filtro{ background:var(--accent-soft) }
html[data-tons="classico"]{ --seq0:#eceae2; --cal-fundo:transparent }
html[data-tons="classico"][data-tema="escuro"]{ --seq0:#2c3335 }
html[data-tons="classico"] .cal{ border-color:transparent;padding:0;width:302px }
html[data-tons="classico"][data-tema="escuro"]{ --surface-2:#2c3335; --surface-3:#363e40 }
html[data-tons="classico"] .aba .pin,
html[data-tons="classico"] .chip-cont .pin,
html[data-tons="classico"] .apr-origem span,
html[data-tons="classico"] .linha-info > span,
html[data-tons="classico"] .linha-info .meta,
html[data-tons="classico"] .filtros .campo > span,
html[data-tons="classico"] tr.sep-dia .meta{ color:var(--muted) }

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{letter-spacing:-.2px;margin:0}
a{color:var(--accent-ink)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 90px}

/* ---------- topo ---------- */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:20px}
.top .esq{display:flex;align-items:center;gap:11px;min-width:0}
.top .dir{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.marca{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;
  background:var(--accent-forte);color:#fff;box-shadow:0 2px 8px var(--brilho)}
html[data-tema="escuro"] .marca{color:#1c2123;box-shadow:none}
.brand h1{font-size:25px;font-weight:650;letter-spacing:-.5px;line-height:1.1;white-space:nowrap}
.brand h1 span{font-weight:400;color:var(--muted);letter-spacing:-.2px}
.chip-data{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;transition:.15s}
/* onde os dados estão sendo gravados */
.chip-arq{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;transition:.15s;
  max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-arq:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip-arq.ligado{background:var(--bom-soft);border-color:rgba(12,163,12,.35);color:var(--bom-ink);font-weight:550}
.chip-arq.atencao{background:var(--alerta-soft);border-color:rgba(250,178,25,.45);color:var(--alerta-ink);font-weight:550}
.chip-arq.falha{background:var(--critico-soft);border-color:rgba(208,59,59,.35);color:var(--critico-ink);font-weight:550}
.chip-arq[hidden]{display:none}
.chip-data b{color:var(--text);font-weight:550;font-variant-numeric:tabular-nums}
.chip-data:hover{border-color:var(--accent);color:var(--accent-ink)}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:.15s;font-size:15px}
.icon-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
.regressiva{display:inline-flex;align-items:baseline;gap:9px;padding:9px 22px;border-radius:14px;
  background:var(--accent-forte);border:1px solid var(--accent-forte);color:#fff;
  box-shadow:0 2px 12px var(--brilho);white-space:nowrap}
.regressiva b{font-size:27px;font-weight:650;line-height:1;letter-spacing:-.5px;font-variant-numeric:tabular-nums;color:inherit}
.regressiva span{font-size:13px;opacity:.92}
.regressiva .fogo{font-size:16px;line-height:1;letter-spacing:-1px;opacity:1}
.regressiva .fogo:first-child{margin-right:1px}
.regressiva .fogo:last-child{margin-left:1px}
.regressiva.urgente{background:var(--critico);border-color:var(--critico);color:#fff;
  box-shadow:0 2px 12px var(--brilho-critico)}
.regressiva.neutra{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);
  box-shadow:none;font-size:13.5px;padding:11px 18px}
.regressiva.neutra b{font-size:14px;font-weight:650}
html[data-tema="escuro"] .regressiva.neutra{color:var(--accent-ink)}
html[data-tema="escuro"] .regressiva{color:#1b2224}
html[data-tema="escuro"] .regressiva.urgente{color:#fff}

/* ---------- abas ---------- */
nav.abas{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:20px}
.aba{display:inline-flex;align-items:center;gap:7px;padding:10px 19px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:14.5px;transition:.15s}
.aba:hover{color:var(--text);border-color:var(--accent)}
.aba[aria-selected="true"]{background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;font-weight:550;
  box-shadow:0 1px 7px var(--brilho)}
html[data-tema="escuro"] .aba[aria-selected="true"]{color:#1b2224}
.aba .pin{min-width:18px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:11px}
.aba[aria-selected="true"] .pin{background:rgba(255,255,255,.24);color:#fff}
html[data-tema="escuro"] .aba[aria-selected="true"] .pin{background:rgba(0,0,0,.18);color:#1b2224}
.aba .pin.alerta{background:var(--critico);color:#fff}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;box-shadow:var(--shadow);margin-bottom:16px}
/* o cronômetro é a ação principal do dia: ganha moldura verde */
.card-crono{border-color:var(--accent);box-shadow:0 1px 3px var(--brilho),var(--shadow)}
.card-crono > h2::before{background:var(--accent-forte)}
.card > h2{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.card > h2::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.card > h2 .dica{font-size:12px;font-weight:400;color:var(--muted)}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{margin-left:auto}

/* ---------- formulário ---------- */
.campos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2)}
.campo input[type="checkbox"],.campo input[type="radio"]{
  width:auto;padding:0;margin:0;border:none;background:none;accent-color:var(--accent);flex:none}
.campo input,.campo select,.campo textarea{
  border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:8px;padding:8px 10px;
  outline:none;transition:.15s;width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--accent);background:var(--campo-fundo);
  box-shadow:0 0 0 3px var(--foco)}
.btn:focus-visible,.aba:focus-visible,.icon-btn:focus-visible,.act:focus-visible,.btn-add:focus-visible,
.chip-data:focus-visible,.check:focus-visible,.opcao:has(input:focus-visible){
  outline:2px solid var(--accent);outline-offset:2px}
.campo textarea{resize:vertical;min-height:62px;line-height:1.55}
.campo textarea.texto-grande{min-height:170px}
.campo textarea.texto-medio{min-height:126px}
/* data não precisa da largura toda da coluna */
.campo input[type="date"]{max-width:175px}
.campo.largo{grid-column:1/-1}
.ajuda-campo{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.35}
/* Bloco que cresce e encolhe conforme a resposta. O truque do grid (0fr → 1fr)
   anima a altura sem precisar saber quanto o conteúdo mede; o `visibility` no
   fim da transição tira os campos fechados do caminho do teclado. */
.painel-questao{display:grid;grid-template-rows:0fr;opacity:0;margin:0;padding-left:0;
  border-left:0 solid var(--accent);
  transition:grid-template-rows .22s ease,opacity .18s ease,padding-left .22s ease,
             border-left-width .22s ease,margin-top .22s ease}
.painel-questao > .interno{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s linear .22s}
.painel-questao.aberto{grid-template-rows:1fr;opacity:1;margin-top:4px;padding-left:12px;border-left-width:3px}
.painel-questao.aberto > .interno{visibility:visible;transition-delay:0s}
.painel-questao .campos{gap:12px}
/* a setinha do "Sim" gira quando o bloco está aberto */
.opcao .seta{display:inline-block;font-size:11px;color:inherit;transition:transform .22s ease;opacity:.75}
.opcao:has(input:checked) .seta{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){
  .painel-questao,.painel-questao > .interno,.opcao .seta{transition:none}
}
/* campo que barrou uma ação: some sozinho quando a pessoa escolhe */
.campo-errado{border-color:var(--critico) !important;box-shadow:0 0 0 3px var(--brilho-critico)}
/* --- etiquetas de assunto no registro --- */
/* --- caixas de marcar (campo "Situação") --- */
/* --- sugestões (substitui o <datalist> nativo, que o navegador pintava sozinho) --- */
.sug-lista{position:absolute;z-index:30;margin:0;padding:4px;list-style:none;background:var(--surface);
  border:1px solid var(--accent);border-radius:9px;box-shadow:0 10px 28px rgba(50,50,45,.16);
  max-height:230px;overflow-y:auto;min-width:160px}
.sug-lista li{padding:7px 10px;border-radius:6px;font-size:13.5px;color:var(--text);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.sug-lista li:hover,.sug-lista li.ativo{background:var(--accent-soft);color:var(--accent-ink)}
.sug-lista li b{font-weight:650;color:var(--accent-ink)}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcao{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text);line-height:1.3;
  border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:9px;padding:9px 13px;
  cursor:pointer;transition:.15s}
.opcao:hover{border-color:var(--accent)}
.opcao:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
select.sel-grupo{width:auto;min-width:230px;max-width:340px}
.grupo-editor{margin-top:11px;padding:12px 13px;border:1px solid var(--accent);border-radius:11px;
  background:var(--accent-soft)}
.grupo-editor .rot-grupo{font-size:12px;font-weight:600;color:var(--accent-ink);display:block}
.grupo-editor .tag.fixo{background:transparent;border-style:dashed;padding-right:11px;opacity:.85}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;border-radius:999px;
  background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-ink);font-size:13px}
.tag .txt{outline:none;border-radius:4px;padding:0 2px;min-width:14px;cursor:text}
.tag .txt:hover{background:rgba(0,0,0,.05)}
.tag .txt:focus{background:var(--surface);box-shadow:0 0 0 2px var(--foco)}
.tag button{width:17px;height:17px;display:grid;place-items:center;border-radius:50%;font-size:10px;
  color:var(--accent-ink);background:rgba(0,0,0,.06);line-height:1}
.tag button:hover{background:var(--critico);color:#fff}
.btn{padding:8px 16px;border-radius:9px;background:var(--accent-forte);color:#fff;font-size:13.5px;font-weight:550;
  border:1px solid var(--accent-forte);transition:.15s;box-shadow:0 1px 4px var(--brilho)}
.btn:hover{filter:brightness(1.07);box-shadow:0 2px 9px var(--brilho)}
html[data-tema="escuro"] .btn{color:#1b2224}
.btn.ghost{background:var(--campo-fundo);color:var(--text-2);border-color:var(--campo-borda);box-shadow:none}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.mini{padding:5px 11px;font-size:12.5px}
.erro-form{color:var(--critico);font-size:12.5px}
.sel-dificuldade{font-variant-numeric:tabular-nums}

/* ---------- listas / tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:550;color:var(--muted);font-size:12px;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--grade);vertical-align:top}
tr:last-child td{border-bottom:none}
/* o hover não pode repetir o cinza da faixa de data e do painel de filtros:
   aqui ele usa o verde suave, que também diz "dá para clicar" */
tbody tr:not(.sep-dia):hover{background:var(--accent-soft)}
tbody tr.linha-clicavel{cursor:pointer}
/* coluna Tipo: alinhada ao cabeçalho, com folga na margem — "estudo/revisão"
   é longo e antes ficava espremido na borda direita da tabela */
.col-tipo{text-align:left;white-space:nowrap;padding-right:14px}
.tab-rolagem{overflow-x:auto}
tr.sep-dia td{background:var(--surface-2);font-size:12px;color:var(--text-2);font-weight:550;
  padding:6px 9px;border-bottom:1px solid var(--border);box-shadow:inset 3px 0 0 var(--accent)}
tr.sep-dia .meta{font-weight:400;color:var(--text-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes-linha{display:flex;gap:2px;justify-content:flex-end}
.acerto{display:flex;align-items:center;gap:9px}
.acerto-barra{flex:1;min-width:70px;height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.acerto-barra i{display:block;height:100%;border-radius:999px}
.acerto b{font-size:13px;font-weight:600;min-width:38px;text-align:right}
.act{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:6px;transition:.15s}
.act:hover{background:var(--surface-3);color:var(--text)}
.act.danger:hover{color:var(--critico)}
/* "+ ver todos": fecha a lista de assuntos como um rodapé, largura cheia */
.ver-mais{display:block;width:100%;margin-top:10px;padding:9px;font-size:13px;font-weight:600;
  color:var(--accent-forte);border:1px dashed var(--border);background:var(--surface-2)}
.ver-mais:hover{background:var(--surface-3);border-color:var(--accent);color:var(--accent-forte)}

.item{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);margin-bottom:8px;border-left:3px solid var(--border);
  box-shadow:0 1px 2px rgba(60,60,50,.05)}
.item:last-child{margin-bottom:0}
/* --- próximos dias: um bloco por dia --- */
.dia-bloco + .dia-bloco{margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.dia-rotulo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  font-size:11.5px;font-weight:650;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.5px}
.dia-rotulo span{font-weight:400;font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.item.atrasada{border-left-color:var(--critico);background:var(--critico-soft);border-color:rgba(208,59,59,.28)}
.item.hoje{border-left-color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.item.feita{opacity:.6;border-left-color:var(--bom)}
.item.atrasada .titulo{color:var(--critico-ink)}
/* o que pede ação sobe da lista; o que já passou fica rente */
.item.hoje{box-shadow:0 1px 7px var(--brilho)}
.item.atrasada{box-shadow:0 1px 7px var(--brilho-critico)}
.item.feita{box-shadow:none}
.item .corpo{flex:1;min-width:0}
.item .titulo{font-weight:550;font-size:14px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
/* O ✓ é DESENHADO (duas bordas giradas), não é a letra: o glifo do tipo mudava
   de tamanho e de altura conforme a fonte disponível e saía torto dentro da
   caixinha. Aqui ele é sempre o mesmo traço, centrado no pixel.             */
.check{flex:none;width:19px;height:19px;margin-top:2px;border-radius:6px;border:1.5px solid var(--campo-borda);
  background:var(--campo-fundo);position:relative;font-size:0;color:transparent;transition:.15s}
.check::after{content:"";position:absolute;left:50%;top:50%;width:4.5px;height:8.5px;
  border:solid transparent;border-width:0 2px 2px 0;border-radius:1px;
  transform:translate(-50%,-58%) rotate(45deg);transition:.12s}
.check:hover{border-color:var(--accent)}
.check:hover::after{border-color:var(--accent)}          /* prévia do que o clique faz */
.check[aria-checked="true"]{background:var(--bom);border-color:var(--bom)}
.check[aria-checked="true"]::after,
.check[aria-checked="true"]:hover::after{border-color:#fff}
.badge{font-size:11px;font-weight:550;padding:2px 8px;border-radius:999px;background:var(--surface-2);
  color:var(--text-2);white-space:nowrap}
.badge.b-bom{background:var(--bom-soft);color:var(--bom-ink)}
.badge.b-critico{background:var(--critico-soft);color:var(--critico-ink)}
.badge.b-alerta{background:var(--alerta-soft);color:var(--alerta-ink)}
.badge.b-estrela{background:var(--star-soft);color:var(--star)}
/* estudo/revisão: nem o âmbar da revisão pura, nem o neutro do estudo */
.badge.b-misto{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
.ponto{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- estatísticas ---------- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
.tiles.t3 .val{font-size:21px}
.tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 15px 13px 17px}
.tile .rot{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:25px;font-weight:600;margin-top:3px;line-height:1.15}
.tile .pe{font-size:12px;color:var(--muted);margin-top:2px}
/* tom = o que o número está dizendo; a faixa à esquerda dá o recado de longe */
.tile[class*="t-"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.tile.t-accent::before{background:var(--accent)}
.tile.t-bom::before{background:var(--bom)}
.tile.t-alerta::before{background:var(--alerta)}
.tile.t-critico::before{background:var(--critico)}
.tile.t-accent .val{color:var(--accent-ink)}
.tile.t-bom .val{color:var(--bom-ink)}
.tile.t-alerta .val{color:var(--alerta-ink)}
.tile.t-critico .val{color:var(--critico-ink)}
.tile.t-critico{background:var(--critico-soft);border-color:rgba(208,59,59,.30)}
.tile.t-critico .pe{color:var(--critico-ink);opacity:.85}
.barra{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.barra > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.barra > i.cheia{background:var(--bom)}
/* --- calendário do mês + detalhe do dia selecionado --- */
.heat-grid{display:grid;grid-template-columns:auto minmax(230px,1fr);gap:20px;align-items:start}
/* painel discreto atrás do calendário: sem ele, o mês flutuava solto no mesmo
   tom do card. Os dias passam a ter cor própria (--seq0), então os vãos da
   grade é que mostram o painel — a rampa de estudo continua comparando célula
   com célula, sem perder o passo mais claro. */
.cal{width:328px;max-width:100%;background:var(--cal-fundo);border:1px solid var(--border);
  border-radius:12px;padding:12px 13px}
.cal-cab{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-cab b{font-size:15px;font-weight:650;letter-spacing:-.2px;margin-right:auto;text-transform:capitalize}
.cal-nav{width:27px;height:27px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:grid;place-items:center;font-size:15px;line-height:1;transition:.15s}
.cal-nav:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.cal-semana,.cal-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-semana span{text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;padding-bottom:5px}
.cal-dia{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--seq0);
  border:2px solid transparent;transition:.12s}
.cal-dia:hover{box-shadow:0 0 0 2px var(--foco)}
/* dia de outro mês: recua para o painel e fica secundário, mas legível —
   a opacidade .4 de antes dava 1,5:1, quase invisível */
.cal-dia.fora{background:transparent;color:var(--muted)}
.cal-dia.fora .pt{opacity:.55}                 /* o pontinho é que recua, não o número */
html[data-tema="escuro"] .cal-dia.fora{opacity:.78}
.cal-dia.hoje{border-color:var(--accent);font-weight:650}
.cal-dia.prova{border-color:var(--critico);color:var(--critico-ink);font-weight:650}
.cal-dia.sel{background:var(--accent-forte);color:#fff;font-weight:650;border-color:var(--accent-forte)}
html[data-tema="escuro"] .cal-dia.sel{color:#1b2224}
.cal-dia .pt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%}
.cal-dia.sel .pt{background:#fff !important}
.pt-legenda{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
@media (max-width:820px){.heat-grid{grid-template-columns:1fr}}
.dia-info{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:13px 15px;box-shadow:0 1px 2px rgba(60,60,50,.05)}
.dia-info.vazia{border-left-color:var(--border);background:var(--surface-2)}
.dia-rot{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);display:block}
.dia-info.vazia .dia-rot{color:var(--muted)}
.dia-cab{display:flex;align-items:flex-start;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--grade)}
.dia-cab > div{margin-right:auto;line-height:1.25}
.dia-cab b{font-size:16px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.dia-numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.dia-numeros div{line-height:1.15}
.dia-numeros b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.dia-numeros b.t-bom{color:var(--bom-ink)} .dia-numeros b.t-alerta{color:var(--alerta-ink)}
.dia-numeros b.t-critico{color:var(--critico-ink)}
.dia-numeros span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dia-meta{display:flex;align-items:center;gap:9px}
.dia-meta .barra{flex:1;margin:0}
.dia-meta span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dia-lista{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;
  max-height:210px;overflow-y:auto}
.dia-lista li{font-size:13px;line-height:1.35;border-left:3px solid var(--accent);padding:4px 0 4px 9px}
.dia-lista li.rev{border-left-color:var(--alerta)}
.dia-lista li b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-lista li > span{color:var(--muted);font-size:12px;display:block;margin-top:1px}
.dia-tempo{font-size:12.5px;color:var(--text-2);font-weight:600}
.dia-vazio{font-size:13px;color:var(--muted);margin:12px 0 0}
.heat-cel{cursor:pointer}
figure{margin:0}
figcaption{font-size:12.5px;color:var(--muted);margin-bottom:10px}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px;align-items:center}
.legenda span{display:inline-flex;align-items:center;gap:5px}

/* ---------- diversos ---------- */
.vazio{text-align:center;padding:34px 18px;color:var(--muted);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--radius)}
.vazio strong{display:block;color:var(--text);font-weight:550;margin-bottom:4px;font-size:14.5px}
.aviso{background:#f7ece4;border:1px solid #e3c9b4;color:#8a5a37;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px}
html[data-tema="escuro"] .aviso{background:#3a2e26;border-color:#5a4632;color:#e0bd96}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,14px);background:var(--text);color:var(--bg);
  padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:60;max-width:90vw}
.toast.show{opacity:.96;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:rgba(30,32,30,.42);display:grid;place-items:center;padding:18px;z-index:50}
.overlay[hidden]{display:none}   /* a classe vence o [hidden] do navegador: precisa ser explícito */
/* A caixa é uma coluna: cabeçalho fixo, miolo que rola, rodapé de ações fixo.
   Quem rola é só o miolo — a barra de rolagem termina no fio acima dos botões,
   em vez de correr ao lado deles. */
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal > header{flex:none}
.modal > .conteudo{flex:1 1 auto;min-height:0;overflow:auto}
/* rodapé de ações, depois de sair de dentro da área que rola */
.modal.com-rodape > .acoes-form{flex:none;margin:0;padding:12px 16px 14px;background:var(--surface);
  border-top:1px solid var(--grade);border-radius:0 0 13px 13px}
/* formulários de registro e de revisão: tela sobreposta, larga */
.modal.grande{max-width:880px}
.modal.grande > .conteudo{padding:18px 20px 16px}
.modal.grande.com-rodape > .acoes-form{padding:12px 20px 16px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);
  background:var(--surface);z-index:2}
.modal header h3{font-size:15px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:9px}
.modal header h3::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.modal .conteudo{padding:16px}
/* --- faixas de edição: mesma paleta do editor de card de revisão --- */
.faixa-edicao{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.faixa-edicao b{font-weight:600}
.faixa-edicao .spacer{margin-left:auto}
/* --- histórico: linha destacada enquanto o registro está em edição --- */
tbody tr.editando-linha{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent-ink)}
.act.excluir{color:var(--critico)}
.act.excluir:hover{background:rgba(208,59,59,.12);color:var(--critico)}
/* --- cronômetro de estudo --- */
.crono{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:11px;padding:13px 15px}
.crono-tempo{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-ink);line-height:1.1}
.crono-info{display:flex;flex-direction:column;line-height:1.35;margin-right:auto}
.crono-info b{font-weight:600;font-size:14px}
.crono-info span{font-size:12px;color:var(--muted)}
.faixas{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline;margin-top:3px}
.crono .faixa,.faixa-edicao .faixa{padding:1px 8px;font-size:12px}
.faixa.agora{background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;font-weight:550}
html[data-tema="escuro"] .faixa.agora{color:#1b2224}
.pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--critico);margin-right:7px;
  animation:pisca 1.6s ease-in-out infinite;vertical-align:middle}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
.crono-chip{display:inline-flex;align-items:center;gap:8px;padding:5px 11px;border-radius:999px;
  background:var(--accent-forte);border:1px solid var(--accent-forte);color:#fff;font-size:12.5px;max-width:250px}
.crono-chip .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crono-chip b{font-variant-numeric:tabular-nums;font-size:14px}
.crono-chip .encerrar{color:#fff;opacity:.85;font-size:12px;padding:2px 7px;border-radius:6px;background:rgba(255,255,255,.18)}
.crono-chip .encerrar:hover{opacity:1;background:rgba(255,255,255,.3)}
.divisor{border:none;border-top:1px solid var(--border);margin:14px 0}
/* --- seletor de conteúdos (aba Aprendizados) --- */
.conteudos{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip-cont{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);transition:.15s;text-align:left;line-height:1.25}
.chip-cont:hover{border-color:var(--accent)}
.chip-cont[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip-cont b{font-weight:550;font-size:13.5px;color:var(--text);display:block}
.chip-cont small{font-size:11px;color:var(--muted);display:block}
.chip-cont[aria-pressed="true"] b{color:var(--accent-ink)}
.chip-cont .pin{min-width:18px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:11px}
.chip-cont.novo{border-style:dashed;color:var(--muted);font-size:13px}
/* --- botão + e composição inline --- */
.btn-add{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;border-radius:10px;
  border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  font-size:14px;font-weight:600;letter-spacing:-.1px;transition:.15s;margin-bottom:12px;text-align:left}
.btn-add .pista{font-weight:400;font-size:12.5px;color:var(--muted)}
.btn-add:hover{border-style:solid;border-color:var(--accent-forte);background:var(--accent-forte);color:#fff;
  box-shadow:0 2px 10px var(--brilho)}
.btn-add:hover .pista{color:rgba(255,255,255,.85)}
.btn-add:hover .mais{background:#fff;color:var(--accent-forte)}
.btn-add:hover .badge{background:rgba(255,255,255,.22);color:#fff}
html[data-tema="escuro"] .btn-add:hover{color:#1b2224}
html[data-tema="escuro"] .btn-add:hover .pista{color:rgba(0,0,0,.6)}
html[data-tema="escuro"] .btn-add:hover .mais{background:#1b2224;color:var(--accent)}
.btn-add .mais{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;
  background:var(--accent-forte);color:#fff;font-size:17px;line-height:1;flex:none;transition:.15s}
html[data-tema="escuro"] .btn-add .mais{color:#1b2224}
.compositor{border:1px solid var(--accent);border-radius:10px;background:var(--surface);padding:12px 13px;margin-bottom:10px}
.compositor textarea{width:100%;border:none;background:none;outline:none;resize:none;min-height:56px;line-height:1.6}
.compositor textarea::placeholder{color:var(--muted)}
.compositor .rodape{display:flex;align-items:center;gap:9px;margin-top:8px}
.edicao{border:1px solid var(--accent);border-radius:10px;background:var(--surface);padding:13px;margin-bottom:9px}
/* --- Revisões: cada conteúdo é um bloco fechado, não uma faixa separada por um fio --- */
.grupo-rev{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);
  background:var(--surface-2);padding:12px 13px;margin-bottom:16px}
.grupo-rev:last-of-type{margin-bottom:4px}
.grupo-rev.tem-atraso{border-left-color:var(--critico)}
/* conteúdo ainda aberto: a barra lembra que ali a agenda é para voltar a estudar */
.grupo-rev.aberto{border-left-style:dashed}
.act.destaque{color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent)}
.grupo-rev .cab{gap:9px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.grupo-rev .cab strong{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.grupo-rev .item{margin-bottom:7px}

/* --- atividade da revisão em destaque (bloco quadrado, largura toda) --- */
.item.rev-linha{flex-direction:column;align-items:stretch;gap:0}
.rev-topo{display:flex;gap:11px;align-items:flex-start;width:100%}
.ativ{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;width:100%;margin-top:10px;
  padding:9px 13px;border-radius:0;background:var(--accent-soft);border:1px solid var(--accent);
  border-left-width:4px;line-height:1.35;box-sizing:border-box}
.ativ .nome{font-size:14px;font-weight:650;color:var(--accent-ink)}
.ativ .det{font-size:13px;color:var(--text-2)}
.item.hoje .ativ{background:var(--surface)}
.item.feita .ativ{background:var(--surface-2);border-color:var(--border);border-left-color:var(--bom)}
.item.feita .ativ .nome{color:var(--text-2)}
.aprendizado{font-size:14.5px;line-height:1.55}
.detalhe{margin-top:5px;font-size:13.5px;color:var(--text-2)}
.detalhe b{font-weight:550}
/* texto formatado da anotação: a quebra de linha vira bloco, não some */
.aprendizado p,.detalhe p{margin:0 0 7px}
.aprendizado p:last-child,.detalhe p:last-child{margin-bottom:0}
.aprendizado ul,.detalhe ul{margin:5px 0;padding-left:20px}
.aprendizado li,.detalhe li{margin:2px 0}
.aprendizado strong,.detalhe strong{font-weight:650}
.detalhe p:first-child{display:inline}          /* "O que me confundiu:" na mesma linha */
/* --- Pontos importantes: um card por conteúdo, anotações empilhadas dentro --- */
.apr{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(60,60,50,.05)}
.apr.tem-vespera{border-left-color:var(--star)}
.apr-cab{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--chrome);
  border-bottom:1px solid var(--chrome-borda)}
.apr-cab .badge{background:var(--campo-fundo)}     /* etiqueta neutra não some no verde */
.apr-origem{display:flex;flex-direction:column;line-height:1.2;margin-right:auto;min-width:0}
.apr-origem b{font-size:14.5px;font-weight:650;letter-spacing:-.2px;color:var(--text);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apr-origem span{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.apr-item{border-left:3px solid var(--border);padding:11px 13px}
.apr-item + .apr-item{border-top:1px solid var(--grade)}
.apr-item.marcado{background:var(--star-soft)}
.apr-item.em-edicao{padding:11px 13px;background:var(--accent-soft)}
.apr-item.em-edicao .edicao{margin-bottom:0}
.apr-topo{display:flex;align-items:flex-start;gap:8px}
.apr-texto{flex:1;min-width:0}
.apr-texto .detalhe{margin-top:9px;padding-top:8px;border-top:1px dashed var(--grade)}
.apr-pe{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
/* com "juntar tudo", cada anotação carrega a própria data, miúda, à esquerda da estrela */
.apr-data{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  padding:4px 0;align-self:flex-start}
/* revisão sendo cronometrada agora: pulsa de leve, como o chip do cronômetro */
.item.em-andamento{border-left-color:var(--accent-forte);box-shadow:0 0 0 2px var(--brilho)}
.item.em-andamento .titulo::before{content:"⏱ ";font-size:12px}
.act.estrela{font-size:15px;line-height:1;color:var(--muted);padding:3px 8px}
.act.estrela.on{color:var(--star)}
.act.estrela:hover{color:var(--star);background:var(--star-soft)}
/* informações da sessão, dentro da tela de edição */
.info-extra{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:14px}
.info-extra .rot-info{font-size:11px;font-weight:650;color:var(--accent-ink);text-transform:uppercase;
  letter-spacing:.5px;display:block;margin-bottom:8px}
.linha-info{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:3px 0;flex-wrap:wrap}
.linha-info > span{min-width:150px;font-size:12px;color:var(--text-2)}
.linha-info > div{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;flex:1;min-width:180px}
.linha-info .meta{font-size:12px;color:var(--text-2)}
.faixa{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface);
  border:1px solid var(--accent);color:var(--accent-ink);font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* barra de formatação do campo de texto */
.fmt{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.fmt .act{min-width:30px;text-align:center;border:1px solid var(--campo-borda);background:var(--campo-fundo);
  color:var(--text-2);font-size:12.5px;line-height:1.4}
.fmt .act:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
.fmt .dica-fmt{font-size:11px;color:var(--muted);margin-left:auto}
.fmt .sep-fmt{width:1px;height:18px;background:var(--border);margin:0 3px}
.fmt .act.cor{display:inline-flex;align-items:center;gap:5px;padding:3px 7px}
.fmt .amostra{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.fmt .contador{margin-left:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmt .contador.perto{color:var(--alerta-ink);font-weight:600}
.fmt .contador.cheio{color:var(--critico);font-weight:600}
/* cores da anotação: o texto guarda só o marcador, quem pinta é isto aqui —
   por isso a cor acompanha o tema em vez de ficar cravada no dado */
.mk{border-radius:3px}
.mk-grifo{background:var(--star-soft);box-shadow:0 0 0 2px var(--star-soft)}
.mk-atencao{color:var(--critico-ink);font-weight:600}
.mk-regra{color:var(--bom-ink);font-weight:600}
.mk-ref{color:var(--s1);font-weight:600}
/* chrome ativo (filtros, cabeçalho do card de anotação) usa o verde claro da
   identidade; o cinza-areia ficou só para o que é inerte de verdade */
.filtros{display:flex;flex-direction:column;gap:11px;margin-bottom:14px;
  background:var(--chrome);border:1px solid var(--chrome-borda);border-radius:10px;padding:12px 13px}
.filtros-campos{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));align-items:end}
.filtros .campo{min-width:0}
.filtros .campo > span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.45px;color:var(--text-2)}
.filtros .busca{grid-column:1/-1}
.filtros-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--border);padding-top:10px}
.filtros-acoes .spacer{margin-left:auto}
.marca-filtro{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.45px;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:999px;padding:2px 9px}
/* dentro do painel verde, a etiqueta inverte para continuar saltando */
.filtros .marca-filtro{background:var(--campo-fundo)}
.campo-busca{position:relative}
.campo-busca input{padding-left:29px}
.campo-busca .lupa{position:absolute;left:10px;bottom:8px;font-size:15px;color:var(--muted);
  line-height:1;pointer-events:none}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
.hl-tema{font-size:12.5px;color:var(--muted)}
details.ajuda{margin-top:10px;font-size:13px;color:var(--text-2)}
details.ajuda summary{cursor:pointer;color:var(--accent-ink);font-size:12.5px}
details.ajuda p{margin:8px 0 0}
@media (max-width:780px){
  header.top{grid-template-columns:1fr;justify-items:center;text-align:center}
  .top .dir{justify-content:center}
}
@media (max-width:620px){
  .wrap{padding:16px 13px 70px}
  .tile .val{font-size:21px}
}
</style>

<body>
<div class="wrap">
  <header class="top">
    <div class="esq brand">
      <span class="marca" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H5.5A1.5 1.5 0 0 1 4 15V5.5Z"/>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5h5A1.5 1.5 0 0 0 20 15V5.5Z"/>
