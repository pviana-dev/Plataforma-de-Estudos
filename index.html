  document.documentElement.dataset.tema = db.tema;
  // a barra do sistema (Android, Safari, app instalado) na cor do fundo do tema
  const corBarra = document.querySelector('meta[name="theme-color"]');
  if (corBarra) corBarra.content = db.tema === "escuro" ? "#1c2123" : "#f2f1ec";
  const dias = diasParaProva();
  const reg = $("#regressiva");
  const prox = proximaProva();
  const dia = prox || diasDeProva().slice(-1)[0] || null;
  /* No vestibular a contagem é do PRÓXIMO dia, pelo nome dele; passado um, ela
     salta para o seguinte. Com um dia só (ou no concurso), diz "a prova". */
  const nomeProx = objetivo() === "vestibular" ? nomeDoDia(dia) : "a prova";
  reg.className = "regressiva" + (dias === null ? " neutra" : dias <= 7 ? " urgente" : "");
  /* Os fogos (🔥) saíram da contagem (pedido do Pedro, 25/09): o espaço deles virou
     número maior. A urgência continua na cor — a caixa fica vermelha na última semana. */
  /* SEM DATA DE PROVA (estudo contínuo, ou concurso/vestibular com a data a definir), a
     contagem SOME — não há o que contar (pedido do Pedro, 25/09; antes dizia
     "Estudo contínuo · sem data de prova"). */
  reg.hidden = dias === null;
  reg.innerHTML = dias === null ? ''
                : dias > 0 ? '<b>'+dias+'</b><span>'+(dias===1?"dia":"dias")+' para '+esc(nomeProx)+'</span>'
                : dias === 0 ? '<b>hoje</b><span>é '+esc(nomeProx)+'</span>'
                : '<b>'+(-dias)+'</b><span>'+(dias===-1?"dia":"dias")+' desde '+esc(nomeProx)+'</span>';
  const chip = $("#chipData");
  const semanaHoje = new Date(D.hoje() + "T12:00").toLocaleDateString("pt-BR", { weekday: "long" });
  chip.classList.toggle("so-hoje", !dia);          // sem data de prova: o card mostra só hoje
  chip.innerHTML = (!dia ? ''
                 : objetivo() === "vestibular" ? '<span>' + esc(nomeDoDia(dia)) + '</span><b>' + D.brFull(dia.data) + '</b>'
                 : '<span>Prova</span><b>' + D.brFull(dia.data) + '</b>') +
    '<span class="hoje-rot">Hoje</span><span class="hoje-data" title="' + esc(semanaHoje) + '">' + D.brFull(D.hoje()) + '</span>';
  chip.title = semProva() ? "Hoje · a data da prova se marca em Ajustes (⚙)"
                           : "A data da prova pode ser alterada em Ajustes (⚙)";

  if (!db.cronometro) $("#cronoChip").innerHTML = "";
  const det = juntarTarefas(revisoesDetalhadas(), tarefasDetalhadas());   // a tarefa também conta no pino
  const pendentesHoje = det.filter(x => x.status === "hoje").length;
  const atrasadas = det.filter(x => x.status === "atrasada").length;
  $("#abas").innerHTML = ABAS.map(a => {
    let pino = "";
    if (a.id === "revisoes" || a.id === "hoje"){
      if (atrasadas) pino = '<span class="pin alerta">'+atrasadas+'</span>';
      else if (pendentesHoje) pino = '<span class="pin">'+pendentesHoje+'</span>';
    }
    return '<button class="aba" role="tab" data-aba="'+esc(a.id)+'" aria-selected="'+(ui.aba===a.id)+'">'+a.nome+pino+'</button>';
  }).join("");

  pintarChipNuvem();
  pintarChipArquivo();
  pintarPerfil();
  view.innerHTML = ({ hoje: telaHoje, registros: telaRegistros, questoes: telaQuestoes,
                      revisoes: telaRevisoes, erros: telaErros, painel: telaPainel,
                      conteudos: telaConteudos })[ui.aba]();
  listasDosFiltros(view);
  posRender();
}
/* OS FILTROS ABREM A LISTA DO APP (pedido do Pedro, 04/10). A caixa de escolha
   do navegador abria, no celular, a lista do sistema — de fundo preto, por cima
   de tudo. Agora todo filtro é como o de Disciplinas da aba Questões: a caixa
   abre uma lista logo abaixo dela, com as cores do app. O <select> continua lá,
   escondido, e é ele que guarda o valor: escolher na lista troca o valor dele e
   avisa ("change"), e o resto do app segue igual. Só os FILTROS mudam — os
   campos dos formulários e a lista do cronômetro continuam como estão. */
const SELETOR_FILTROS = "select[data-filtro-dc], #fPeriodo, #fTipo, #fOrdem, #eDisciplina, #eAssunto";
function listasDosFiltros(raiz){
  raiz.querySelectorAll(SELETOR_FILTROS).forEach(sel => {
    if (sel.hidden) return;
    const atual = sel.options[sel.selectedIndex] || sel.options[0];
    const caixa = document.createElement("div");
    caixa.className = "multi-disc lista-unica";
    caixa.innerHTML =
      '<button class="multi-caixa" type="button" data-lista="' + esc(sel.id) + '" aria-haspopup="listbox" aria-expanded="false"' +
        (sel.getAttribute("aria-labelledby") ? ' aria-labelledby="' + esc(sel.getAttribute("aria-labelledby")) + '"' : '') + '>' +
        '<span>' + esc(atual ? atual.textContent : "") + '</span><span aria-hidden="true">▾</span></button>' +
      '<div class="multi-lista" role="listbox">' +
        [...sel.options].map(o => '<button class="multi-op op-unica" type="button" role="option" data-valor="' + esc(o.value) + '" ' +
          'aria-selected="' + (o === atual) + '">' + esc(o.textContent) + '</button>').join("") +
      '</div>';
    sel.hidden = true;
    sel.after(caixa);
  });
}
/** abre (ou fecha) uma lista de filtro; abrir uma fecha as outras */
function alternarListaFiltro(caixa, abrir){
  document.querySelectorAll(".lista-unica.aberto").forEach(c => {
    if (c === caixa && abrir) return;
    c.classList.remove("aberto");
    c.querySelector(".multi-caixa").setAttribute("aria-expanded", "false");
  });
  if (!caixa || !abrir) return;
  caixa.classList.add("aberto");
  caixa.querySelector(".multi-caixa").setAttribute("aria-expanded", "true");
  const escolhida = caixa.querySelector('[aria-selected="true"]');
  // lista comprida: rola só ela até a escolhida (a página fica parada)
  if (escolhida) caixa.querySelector(".multi-lista").scrollTop = Math.max(0, escolhida.offsetTop - 40);
}

function posRender(){
  /* Chegou de um salto do card de hoje: rola até o item e o acende por um
     instante. É de uso único — some assim que cumpre o papel. */
  if (ui.focoRevisao){
    const alvo = document.getElementById("rev-" + ui.focoRevisao);
    ui.focoRevisao = "";
    if (alvo){
      try { alvo.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e){}
      alvo.classList.add("realce");
      setTimeout(() => alvo.classList.remove("realce"), 2200);
    }
  }
  // barra de abas que rola (celular): a aba aberta fica à vista
  const barra = document.getElementById("abas");
  if (barra && barra.scrollWidth > barra.clientWidth){
    const aberta = barra.querySelector('[aria-selected="true"]');
    if (aberta) barra.scrollLeft = aberta.offsetLeft - (barra.clientWidth - aberta.offsetWidth) / 2;
  }
  // veio do cronômetro: rola até a linha da sessão e a acende (uso único, como o de cima)
  if (ui.focoSessao){
    const linha = document.querySelector('tbody tr[data-id="' + CSS.escape(ui.focoSessao) + '"]');
    ui.focoSessao = "";
    if (linha){
      try { linha.scrollIntoView({ behavior: "smooth", block: "center" }); } catch(e){}
      linha.classList.add("realce");
      setTimeout(() => linha.classList.remove("realce"), 2400);
    }
  }
  if (ui.aba === "erros" && ui.eBusca) realcarBusca(view);
  // devolve o foco ao campo que estava sendo digitado (a tela é redesenhada a cada tecla)
  if (ui.foco){
    const el = document.getElementById(ui.foco);
    if (el){ el.focus(); if (el.setSelectionRange && el.type !== "date" && el.type !== "number"){
      const n = el.value.length; try{ el.setSelectionRange(n,n); }catch(e){} } }
  }
  ligarFormularios();
  const fk = $("#formCrono"); if (fk) fk.addEventListener("submit", iniciarCrono);
  atualizarCrono();
  const tn = $("#txtNovo");
  if (tn) crescerCaixa(tn);            // reabriu com rascunho: já nasce do tamanho dele
  if (tn) tn.addEventListener("keydown", ev => {
    if (ev.key === "Enter" && (ev.metaKey || ev.ctrlKey)){ ev.preventDefault(); salvarNovoAprendizado(); }
    if (ev.key === "Escape"){ ui.compondo = false; ui.rascunhoAnot = ""; ui.foco = null; render(); }
  });
  sincronizarTelaForm();
}

/* Liga os formulários — vale para os que ficam na página e para os que abrem na
   tela sobreposta. É idempotente (marca o que já ligou), porque a página é
   redesenhada com o modal aberto. */
function ligarFormularios(){
  const ligar = (sel, evento, fn) => {
    const el = $(sel);
    if (el && !el.dataset.ligado){ el.dataset.ligado = "1"; el.addEventListener(evento, fn); }
    return el;
  };
  ligar("#formRegistro", "submit", enviarRegistro);
  ligar("#formEdicaoErro", "submit", enviarEdicaoErro);
  ligar("#formRevisao", "submit", enviarRevisao);
  ligar("#formTarefa", "submit", enviarTarefa);
  ligar("#formLancamento", "submit", enviarLancamento);
  montarSugestoes();
  ligarSeletoresDisciplina();
  ligar("#campoAssunto", "keydown", ev => {
    if (ev.key === "Enter" && !ev.sugConsumida){ ev.preventDefault(); adicionarAssuntoForm(); }
  });
  // Enter no nome do conteúdo novo cria e adiciona (não envia o formulário)
  ligar("#novoConteudoNome", "keydown", ev => {
    if (ev.key === "Enter"){ ev.preventDefault(); adicionarAssuntoForm(); }
  });
  // tipo e revisão mudam a cara do formulário inteiro: remonta a tela sobreposta
  ["tipoEstudo", "tipoRevisao", "tipoMisto", "revisaoAlvo"].forEach(id =>
    ligar("#" + id, "change", () => { guardarRascunhoRegistro(); redesenharTelaForm(); }));
}
/* Remontar o formulário apagaria o que já foi digitado; então o que estiver nos
   campos é guardado antes e devolvido no próximo desenho. */
function guardarRascunhoRegistro(){
  const f = $("#formRegistro"); if (!f) return;
  const val = n => { const el = f.querySelector('[name="'+n+'"]'); return el ? el.value : ""; };
  const tipoSel = f.querySelector('[name="tipo"]:checked');
  const revSel = f.querySelector("#revisaoAlvo");
  const rev = revSel ? acharRevisao(revSel.value) : null;
  const ctx = rev ? contextoRevisao(rev) : null;
  const tipo = tipoSel ? tipoSel.value : "estudo";
  const edRasc = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  ui.rascunho = {
    tipo, revisaoId: rev ? rev.id : "",
    // as caixas de "Estudar junto" marcadas: no card duplicado, a caixa é a única
    // coisa que distingue "cumpre os dois" de "cumpre só um"
    juntas: [...f.querySelectorAll('input[name="juntar"]:checked')].map(i => i.value),
    data: val("data") || D.hoje(),
    disciplina: ehTipoRevisao(tipo) && ctx ? ctx.disciplina : disciplinaDoForm(f),
    // conteúdo pertence a uma disciplina: trocando a disciplina, a lista recomeça
    // (o que a sessão editada já tinha fica, mesmo sem ficha: é de um conteúdo excluído, e a sessão fala dele)
    assuntos: ehTipoRevisao(tipo) ? (ctx ? ctx.assuntos.slice() : [])
            : lerAssuntosForm(f).filter(a => !!acharConteudo(disciplinaDoForm(f), a) ||
                (edRasc && edRasc.disciplina === disciplinaDoForm(f) &&
                 assuntosDe(edRasc).some(x => x.toLowerCase() === a.toLowerCase()))),
    minutos: val("minutos"), questoes: val("questoes"), acertos: val("acertos"),
    // vazia continua vazia: redesenhar o formulário não escolhe a dificuldade por você
    dificuldade: val("dificuldade") || null, anotacoes: val("anotacoes"),
    // o "sem revisão" também atravessa o redesenho (senão voltava ao que veio preenchido)
    ...(f.querySelector('[name="semRevisao"]') ? { plano: f.querySelector('[name="semRevisao"]').checked ? "sem" : "individual" } : {})
  };
}

/** Lançamento de questões: sempre preso a uma sessão já registrada — é dela que
    saem a disciplina e o conteúdo a que as questões pertencem. */
function formLancamento(l){
  /* ESCOLHE-SE O CONTEÚDO, NÃO A SESSÃO (revisão de UX, 26/09). A lista eram as 60
     sessões mais recentes ("26/09 · Português · Crase"…); agora é um conteúdo por
     linha, agrupado por disciplina, e a bateria se liga à sessão MAIS RECENTE dele
     — o que a pessoa escolheria de todo jeito. Editando uma bateria já ligada a
     uma sessão mais antiga, essa sessão continua na lista, escolhida. */
  const alvo = l ? l.registroId : "";
  const recente = new Map();                                     // chave do conteúdo → sessão mais nova dele
  db.registros.slice().sort((a,b) => b.data.localeCompare(a.data) || (b.criadoEm||0) - (a.criadoEm||0))
    .forEach(r => assuntosDe(r).forEach(a => {
      const k = chaveAssunto(r.disciplina, a);
      if (!recente.has(k)) recente.set(k, { r, a });
    }));
  const itens = [...recente.values()];
  const ligada = alvo ? acharRegistro(alvo) : null;
  const jaNaLista = ligada && itens.some(x => x.r.id === alvo);
  const porDisc = new Map();
  itens.forEach(x => { if (!porDisc.has(x.r.disciplina)) porDisc.set(x.r.disciplina, []); porDisc.get(x.r.disciplina).push(x); });
  const cmp = (a,b) => a.localeCompare(b, "pt-BR");
  const opcoes = [...porDisc.keys()].sort(cmp).map(d => '<optgroup label="' + esc(d) + '">' +
      porDisc.get(d).sort((a,b) => cmp(a.a, b.a)).map(x =>
        '<option value="'+esc(x.r.id)+'"'+(x.r.id === alvo && (!ligada || assuntosDe(ligada).includes(x.a)) ? " selected" : "")+'>' +
        esc(x.a) + '</option>').join("") + '</optgroup>').join("") +
    (ligada && !jaNaLista ? '<option value="'+esc(ligada.id)+'" selected>' + esc(rotuloAssuntos(ligada)) +
       ' (sessão de ' + D.br(ligada.data) + ')</option>' : '');
  return '<form id="formLancamento"'+(l ? ' data-id="'+esc(l.id)+'"' : '')+'>' +
    '<div class="campos">' +
      '<div class="campo largo"><span id="rotSessaoLanc">Conteúdo *</span><select name="registroId" aria-labelledby="rotSessaoLanc" required>' +
        (alvo ? "" : '<option value="">Escolha o conteúdo…</option>') + opcoes +
      '</select></div>' +
      campo("Data das questões *", '<input type="date" name="data" value="'+(l ? l.data : D.hoje())+'" max="'+D.hoje()+'" required>') +
      campo("Questões feitas *", '<input type="number" name="questoes" min="1" max="999" value="'+(l ? l.questoes : "")+'" placeholder="ex.: 20" required>') +
      campo("Acertos", '<input type="number" name="acertos" min="0" max="999" value="'+(l && l.acertos != null ? l.acertos : "")+'" placeholder="ex.: 14">') +
    '</div>' +
    '<div class="linha acoes-form"><button class="btn" type="submit">'+(l ? "Salvar" : "Lançar questões")+'</button>' +
    '<button class="btn ghost" type="button" data-acao="cancelar-lancamento">Cancelar</button>' +
    (l ? '<button class="act excluir excluir-tela" type="button" data-acao="excluir-lancamento" data-id="'+esc(l.id)+'">Excluir</button>' : '') +
    '<span class="erro-form" id="erroLancamento"></span></div></form>';
}
function enviarLancamento(ev){
  ev.preventDefault();
  const f = ev.target, d = Object.fromEntries(new FormData(f).entries());
  const aviso = document.getElementById("erroLancamento");
  const num = v => v === "" || v === undefined ? 0 : Math.max(0, Number(v) || 0);
  const reg = acharRegistro(d.registroId);
  if (!reg){ aviso.textContent = "Escolha o conteúdo destas questões."; return; }
  if (!d.data){ aviso.textContent = "Informe a data em que você fez as questões."; return; }
  if (ehFuturo(d.data)){ aviso.textContent = "Data futura não recebe questões — lance no dia em que fizer."; return; }
  if (num(d.questoes) < 1){ aviso.textContent = "Informe quantas questões você fez."; return; }
  if (num(d.acertos) > num(d.questoes)){ aviso.textContent = "Acertos não podem passar do total de questões."; return; }
  const atual = f.dataset.id ? acharLancamento(f.dataset.id) : null;
  salvarLancamento({ id: atual ? atual.id : uid(), registroId: reg.id, data: d.data,
                     questoes: num(d.questoes), acertos: num(d.acertos),
                     criadoEm: atual ? atual.criadoEm : Date.now() });
  ui.editandoLancamento = null;
  render();
  toast(num(d.questoes) + " questões lançadas em “" + rotuloAssuntos(reg) + "”.");
}

/* ---------- tela sobreposta dos formulários ----------
   Registrar/editar uma sessão e criar/editar uma revisão abrem numa tela por
   cima da que já está aberta — nada de card que cresce e encolhe. O conteúdo só
   é montado quando MUDA o que está sendo editado: redesenhar a cada render
   apagaria o que já foi digitado.                                            */
let telaForm = null;                    // "reg:<id>" | "reg:novo" | "rev:<id>" | "rev:nova" | null
function alvoTelaForm(){
  if (ui.editandoRegistro) return "reg:" + ui.editandoRegistro;
  if (ui.formAberto)       return "reg:novo";
  if (ui.editandoRevisao)  return "rev:" + ui.editandoRevisao;
  if (ui.editandoTarefa)   return "tar:" + ui.editandoTarefa;
  if (ui.editandoLancamento) return "lan:" + ui.editandoLancamento;
  if (ui.editandoErro)     return "anot:" + ui.editandoErro;
  return null;
}
function sincronizarTelaForm(){
  const alvo = alvoTelaForm();
  if (alvo === telaForm) return;                       // já está na tela: não redesenha
  if (!alvo){ if (telaForm){ telaForm = null; esconderModal(); } return; }
  telaForm = alvo;
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  if (alvo.slice(0,3) === "reg"){
    abrirModal(ed ? "Editar sessão" : "Registrar sessão",
      formRegistroHtml(), ligarFormularios, true);
  } else if (alvo.slice(0,3) === "rev"){
    const rev = ui.editandoRevisao === "nova" ? null : acharRevisao(ui.editandoRevisao);
    if (!rev && ui.editandoRevisao !== "nova"){ telaForm = null; ui.editandoRevisao = null; esconderModal(); return; }
    abrirModal(rev ? termosDoItem(rev).titulo : "Nova revisão", formRevisao(rev), ligarFormularios, true);
  } else if (alvo.slice(0,3) === "tar"){
    const t = ui.editandoTarefa === "nova" ? null : acharTarefa(ui.editandoTarefa);
    if (!t && ui.editandoTarefa !== "nova"){ telaForm = null; ui.editandoTarefa = null; esconderModal(); return; }
    abrirModal(t ? "Editar tarefa" : "Nova tarefa", formTarefa(t), ligarFormularios, true);
  } else if (alvo.slice(0,4) === "anot"){
    const err = acharErro(ui.editandoErro);
    if (!err){ telaForm = null; ui.editandoErro = null; esconderModal(); return; }
    abrirModal("Editar anotação", formEdicaoErro(err),
               () => { ligarFormularios(); crescerCaixa($("#eEnsinamento")); }, true);
  } else {
    const lan = ui.editandoLancamento === "novo" ? null : acharLancamento(ui.editandoLancamento);
    if (!lan && ui.editandoLancamento !== "novo"){ telaForm = null; ui.editandoLancamento = null; esconderModal(); return; }
    abrirModal(lan ? "Editar lançamento de questões" : "Lançar questões",
               formLancamento(lan), ligarFormularios, true);
  }
}
/** força remontar a tela sobreposta (quando o conteúdo dela mudou de verdade) */
function redesenharTelaForm(){ telaForm = null; render(); }

/* ---------- componentes reutilizados ---------- */
/** Dificuldade percebida: quanto maior, mais revisões o assunto recebe.
    OBRIGATÓRIA e sem padrão numa sessão nova (valor vazio): é dela que saem a
    retomada e a escada, então quem decide é você — nada de "médio" por inércia. */
function seletorDificuldade(valor){
  const v = valor ? tresNiveis(valor) : 0;
  return '<select name="dificuldade" class="sel-dificuldade" required>' +
    (v ? '' : '<option value="" selected disabled>Escolha a dificuldade…</option>') +
    [3,2,1].map(n => '<option value="'+n+'"'+(v === n ? " selected" : "")+'>' +
      esc(CONFIG.DIFICULDADES[n].nome) + '</option>').join("") + '</select>';
}
function badgeDificuldade(valor){
  const d = CONFIG.DIFICULDADES[tresNiveis(valor)];
  return '<span class="badge '+d.classe+'" title="'+esc(d.nome)+'">'+esc(d.curto)+'</span>';
}
const catDe = id => CONFIG.CATEGORIAS_ERRO.find(c => c.id === id) || null;   // "" = sem classificação

/* ---------- sugestões de preenchimento (autocomplete próprio) ----------
   O <datalist> nativo é desenhado pelo navegador e, dependendo do tema do
   sistema, ficava ilegível (texto claro sobre fundo branco). Aqui a lista é
   nossa: usa os mesmos tokens de cor do resto da interface.                */
const FONTES_SUG = {
  disciplinas: () => disciplinas(),
  assuntos: () => [...new Set(assuntos().map(a => a.assunto))]
};
let sug = null;                      // { inp, ul, itens, idx }

function fecharSugestoes(){
  if (!sug) return;
  sug.ul.remove();
  sug.inp.removeAttribute("aria-expanded");
  sug = null;
}
function realceSug(texto, termo){
  const t = esc(texto);
  if (!termo) return t;
  const at = t.toLowerCase().indexOf(termo);
  return at < 0 ? t : t.slice(0,at) + "<b>" + t.slice(at, at+termo.length) + "</b>" + t.slice(at+termo.length);
}
function abrirSugestoes(inp){
  const fonte = FONTES_SUG[inp.dataset.sug];
  if (!fonte) return;
  const termo = inp.value.trim().toLowerCase();
  const itens = fonte().filter(x => !termo || x.toLowerCase().includes(termo)).slice(0, 8);
  const mesmoCampo = sug && sug.inp === inp;
  fecharSugestoes();
  if (!itens.length) return;
  if (itens.length === 1 && itens[0].toLowerCase() === termo) return;   // já digitado por inteiro
  const pai = inp.parentElement;
  if (getComputedStyle(pai).position === "static") pai.style.position = "relative";
  const ul = document.createElement("ul");
  ul.className = "sug-lista";
  ul.setAttribute("role", "listbox");
  ul.innerHTML = itens.map(x => '<li role="option">' + realceSug(x, termo) + '</li>').join("");
  [...ul.children].forEach((li, i) => {
    li.addEventListener("mousedown", ev => { ev.preventDefault(); escolherSugestao(itens[i]); });
  });
  pai.appendChild(ul);
  ul.style.left = inp.offsetLeft + "px";
  ul.style.top  = (inp.offsetTop + inp.offsetHeight + 4) + "px";
  ul.style.minWidth = inp.offsetWidth + "px";
  inp.setAttribute("aria-expanded", "true");
  sug = { inp, ul, itens, idx: -1 };
  if (mesmoCampo) { /* mantém fechado o ciclo de foco */ }
}
function escolherSugestao(valor){
  if (!sug) return;
  const inp = sug.inp;
  inp.value = valor;
  fecharSugestoes();
  inp.focus();
}
function navegarSugestoes(ev){
  if (!sug || sug.inp !== ev.target) return false;
  const n = sug.itens.length;
  const marcar = i => {
    [...sug.ul.children].forEach(li => li.classList.remove("ativo"));
    if (i >= 0){ sug.ul.children[i].classList.add("ativo"); sug.ul.children[i].scrollIntoView({ block: "nearest" }); }
    sug.idx = i;
  };
  if (ev.key === "ArrowDown"){ ev.preventDefault(); marcar((sug.idx + 1) % n); return true; }
  if (ev.key === "ArrowUp"){ ev.preventDefault(); marcar((sug.idx - 1 + n) % n); return true; }
  if (ev.key === "Escape"){ ev.preventDefault(); ev.stopPropagation(); fecharSugestoes(); return true; }
  if (ev.key === "Enter" && sug.idx >= 0){ ev.preventDefault(); escolherSugestao(sug.itens[sug.idx]); return true; }
  if (ev.key === "Tab" && sug.idx >= 0){ escolherSugestao(sug.itens[sug.idx]); return true; }
  return false;
}
/** liga o autocomplete a todos os campos com data-sug, a cada redesenho */
function montarSugestoes(){
  document.querySelectorAll("input[data-sug]").forEach(inp => {
    if (inp.dataset.sugPronto) return;
    inp.dataset.sugPronto = "1";
    inp.setAttribute("autocomplete", "off");
    inp.setAttribute("role", "combobox");
    inp.addEventListener("input", () => abrirSugestoes(inp));
    inp.addEventListener("focus", () => abrirSugestoes(inp));
    inp.addEventListener("keydown", ev => { if (navegarSugestoes(ev)) ev.sugConsumida = true; });
    inp.addEventListener("blur", () => setTimeout(() => { if (sug && sug.inp === inp) fecharSugestoes(); }, 120));
  });
}

/* ---------- TELA: HOJE ---------- */
function telaHoje(){
  const tar = tarefasDetalhadas();
  const det = juntarTarefas(revisoesDetalhadas(), tar);
  const atrasadas = det.filter(x => x.status === "atrasada");
  const hoje      = det.filter(x => x.status === "hoje");
  // o corte das "só as próximas" é por conteúdo: tarefa não tem, entra inteira
  const proximas  = juntarTarefas(agendaVisivel(revisoesDetalhadas()), tar)
                      .filter(x => x.status === "futura" && D.dif(D.hoje(), x.rev.data) <= 7);
  const min = minutosDoDia(D.hoje());
  const meta = db.metaDiariaMin || 1;
  const perc = Math.min(100, Math.round((min/meta)*100));
  const streak = sequenciaDias();

  let h = '<div class="tiles" style="margin-bottom:16px">' +
    tile("Estudo de hoje", hhmm(min), "meta: "+hhmm(meta)+" · "+perc+"%",
         '<div class="barra"><i class="'+(perc>=100?"cheia":"")+'" style="width:'+perc+'%"></i></div>',
         perc >= 100 ? "bom" : "accent") +
    tile("Sequência", streak + (streak===1?" dia":" dias"), streak ? "dias seguidos estudando" : "estude hoje para começar",
         "", streak ? "accent" : "") +
    tile("Atrasados", String(atrasadas.length), atrasadas.length ? "⚠ prioridade máxima" : "✓ nada atrasado",
         "", atrasadas.length ? "critico" : "bom") +
    tile("Na agenda hoje", String(hoje.length), hoje.length ? "para fazer hoje" : "✓ dia livre",
         "", hoje.length ? "accent" : "bom") +
  '</div>';

  // o cronômetro é a ação mais usada do dia: vem logo depois dos números
  // a explicação (para onde o tempo vai, o que acontece ao encerrar) mora na Ajuda, seção Cronômetro
  h += '<div class="card card-crono"><h2>⏱ Cronômetro de estudo</h2>' + blocoCronometro() + '</div>';

  // o que o ✓ faz está na Ajuda (seção Continuar e revisar), não embaixo do título
  h += '<div class="card"><h2>Agenda de hoje e atrasados</h2>';
  if (!atrasadas.length && !hoje.length){
    h += '<div class="vazio"><strong>Nada pendente para hoje</strong>Aproveite para registrar um estudo novo ou reler suas anotações.</div>';
  } else {
    h += atrasadas.map(x => itemRevisao(x, "Atrasada desde " + D.extenso(x.rev.data), { remarcavel: true })).join("");
    h += hoje.map(x => itemRevisao(x, "Para hoje", { remarcavel: true })).join("");
  }
  h += '</div>';

  h += blocoRegistrosDeHoje();
  h += '<div class="grid g2">';
  h += '<div class="card"><h2>Próximos 7 dias' +
       (proximas.length > CONFIG.PROXIMAS_VISIVEIS
         ? '<span class="dica">'+proximas.length+' no total</span>' : '') + '</h2>' +
       (proximas.length ? proximosPorDia(proximas)
                        : '<div class="vazio">Nada agendado para a próxima semana.</div>') +
       (proximas.length > CONFIG.PROXIMAS_VISIVEIS
         ? '<button class="act ver-mais" data-acao="toggle-proximas">' +
           (ui.verTodasProximas ? "− mostrar menos" : "+ ver todas as " + proximas.length) + '</button>'
         : '') + '</div>';

  h += cardFaltaEstudar();
  h += '</div>';
  return h;
}
/* FALTA ESTUDAR — o mural da aba Hoje. É AUTOMÁTICO (pedido do Pedro, 24/09;
   antes era uma lista montada à mão, com botão de adicionar e ✕): todo
   conteúdo do cadastro que ainda não tem sessão está aqui, e a primeira sessão
   dele o tira daqui sozinho (ver aEstudar). Não há como pôr nem tirar à mão —
   o mural é o espelho do cadastro. O que se escolhe é a ORDEM: arrastar pela
   alça ⠿ (ou ↑ ↓ no teclado) grava `prioridade` na ficha; conteúdo novo, sem
   prioridade, entra no fim, na ordem em que foi cadastrado. O campo `mural`
   das fichas antigas ficou sem uso. */
function filaAEstudar(){
  return conteudosCad().filter(aEstudar).slice().sort((a,b) =>
    ((a.prioridade ?? Infinity) - (b.prioridade ?? Infinity)) || ((a.criadoEm || 0) - (b.criadoEm || 0)) ||
    a.disciplina.localeCompare(b.disciplina, "pt-BR") || a.nome.localeCompare(b.nome, "pt-BR"));
}
/* ↑ ↓ PARA QUEM TOCA. Arrastar (HTML) e as setas do teclado não existem no
   celular: estes dois botões fazem o mesmo movimento, um passo por toque. Só
   aparecem em tela de toque (CSS: pointer:coarse); no computador, a alça. */
const setasDeToque = (tipo, id) =>
  '<span class="setas-toque">' +
    '<button class="act" type="button" data-acao="mover-toque" data-tipo="' + tipo + '" data-id="' + esc(id) + '" ' +
      'data-passo="-1" aria-label="Subir">↑</button>' +
    '<button class="act" type="button" data-acao="mover-toque" data-tipo="' + tipo + '" data-id="' + esc(id) + '" ' +
      'data-passo="1" aria-label="Descer">↓</button></span>';
const fichaPorChave = k => conteudosCad().find(c => chaveDaFicha(c) === k) || null;
function cardFaltaEstudar(){
  const fila = filaAEstudar();
  const vis = ui.verTodoMural ? fila : fila.slice(0, CONFIG.MURAL_VISIVEIS);
  return '<div class="card"><h2>Falta estudar' +
      // como reordenar (arrastar, ↑ ↓) está na Ajuda, seção Comece por aqui
      (fila.length ? '<span class="dica">' + plural(fila.length, "conteúdo", "conteúdos") + '</span>' : '') + '</h2>' +
    (fila.length
      ? '<div class="mural-lista">' + vis.map(c =>
          '<div class="mural-item" data-afazer="' + esc(chaveDaFicha(c)) + '">' +
            '<button class="act arrasta" data-acao="mover-afazer" data-id="' + esc(chaveDaFicha(c)) + '" ' +
              'title="Arraste para mudar a prioridade — ou use as setas ↑ ↓" aria-label="Mover ' + esc(c.nome) + ' na fila">⠿</button>' +
            setasDeToque("afazer", chaveDaFicha(c)) +
            '<span class="mural-nome"><b>' + esc(c.nome) + '</b><span class="badge">' + esc(c.disciplina) + '</span></span>' +
            '<span class="spacer"></span>' +
            '<button class="act atalho" data-acao="estudar-afazer" data-chave="' + esc(chaveDaFicha(c)) + '" ' +
              'title="Abrir uma sessão deste conteúdo">▶ estudar</button>' +
          '</div>').join("") + '</div>' +
        (fila.length > CONFIG.MURAL_VISIVEIS
          ? '<button class="act ver-mais" data-acao="toggle-mural">' +
            (ui.verTodoMural ? "− mostrar menos" : "+ ver todos os " + fila.length) + '</button>' : '')
      : (db.conteudos || []).length
        ? '<div class="vazio"><strong>Nada falta estudar</strong>Todo conteúdo cadastrado já tem sessão.</div>'
        /* cadastro vazio (a primeira abertura): não é "está tudo em dia" — é o começo */
        : '<div class="vazio"><strong>Nenhum conteúdo cadastrado ainda</strong>' +
          '<div style="margin-top:10px"><button class="act atalho" data-aba="conteudos">Cadastrar na aba Disciplinas</button></div></div>') +
    '</div>';
}
/** grava a prioridade na ordem da tela; quem está escondido atrás do "+" vem depois */
function gravarOrdemMural(lista){
  if (!lista) return false;
  const naTela = [...lista.querySelectorAll("[data-afazer]")].map(el => el.dataset.afazer);
  const resto = filaAEstudar().map(chaveDaFicha).filter(k => !naTela.includes(k));
  let mudou = false;
  naTela.concat(resto).forEach((k, i) => {
    const c = fichaPorChave(k);
    if (c && c.prioridade !== i){ c.prioridade = i; mudou = true; }
  });
  if (mudou) persistir();
  return mudou;
}

/* O que já foi registrado hoje, só para conferência — a edição continua sendo
   na aba Sessões, que é onde as horas de fato moram. */
function blocoRegistrosDeHoje(){
  const hoje = D.hoje();
  const doDia = db.registros.filter(r => r.data === hoje)
    .sort((a,b) => (b.criadoEm||0) - (a.criadoEm||0));
  if (!doDia.length) return "";
  const total = doDia.reduce((t,r) => t + (r.minutos||0), 0);
  return '<div class="card"><h2>Registrado hoje ' +
    '<span class="dica">'+doDia.length+(doDia.length===1?" sessão":" sessões")+' · '+hhmm(total)+'</span></h2>' +
    '<div class="tab-rolagem"><table class="tab-cartao tab-hoje"><thead><tr><th>Conteúdo</th><th>Disciplina</th>' +
    '<th>Tipo</th><th class="num">Tempo</th></tr></thead><tbody>' +
    doDia.map(r => '<tr><td class="c-nome">'+esc(rotuloAssuntos(r))+'</td><td class="c-info">'+esc(r.disciplina)+'</td>' +
      '<td class="c-etq">'+badgeTipoSessao(r)+'</td>' +
      '<td class="num c-fim">'+(r.minutos ? hhmm(r.minutos) : "—")+'</td></tr>').join("") +
    '</tbody></table></div></div>';
}

/* ---------- cronômetro de estudo ----------
   Fica na aba Hoje, mas enquanto roda aparece um chip no cabeçalho (visível
   em todas as abas). O tempo é contado a partir do instante de início gravado
   no armazenamento, então sobrevive a recarregar ou fechar a página.        */
/** Para onde vai o tempo: sessão nova, uma sessão já registrada ou uma revisão. */
function alvoCrono(tipo, id){
  if (tipo === "registro"){
    const reg = acharRegistro(id);
    return reg ? { tipo, id, item: reg, disciplina: reg.disciplina, rotulo: rotuloAssuntos(reg),
                   detalhe: "sessão de " + D.br(reg.data) + " · " + hhmm(reg.minutos || 0) + " até agora" } : null;
  }
  if (tipo === "revisao"){
    const rev = acharRevisao(id), ctx = rev ? contextoRevisao(rev) : null;
    return rev && ctx ? { tipo, id, item: rev, disciplina: ctx.disciplina, rotulo: ctx.rotulo,
                          detalhe: "revisão de " + D.br(rev.data) + (rev.feita ? " · concluída" : " · pendente") +
                                   (rev.minutos ? " · " + hhmm(rev.minutos) + " até agora" : "") } : null;
  }
  return null;
}
/* As medições que o alvo já tem, em etiquetas — para o cronômetro mostrar tudo
   o que já foi cronometrado ali, e não só o total. `agora` acrescenta a medição
   em andamento. */
function faixasDoAlvo(alvo, agora){
  const lista = alvo && alvo.item ? intervalosDe(alvo.item) : [];
  let h = lista.map(f => '<span class="faixa">'+esc(f.rotulo)+'</span>').join("");
  if (agora) h += '<span class="faixa agora">'+esc(agora)+'–agora</span>';
  return h;
}
/** opções do seletor de destino */
function opcoesDestino(){
  const hoje = D.hoje();
  // sessão de revisão é uma sessão como outra qualquer: o cronômetro mira nelas
  const regs = db.registros.filter(r => r.data === hoje)         // o tempo é de hoje: só sessão de hoje recebe
    .sort((a,b) => (b.fim || "").localeCompare(a.fim || ""))
    .map(r => ['registro:'+r.id, (ehRevisaoSessao(r) ? "↻ " : "") + r.disciplina + " · " +
               rotuloAssuntos(r) + " · " + hhmm(r.minutos || 0)]);
  let h = '<option value=""'+(ui.cronoDestino ? "" : " selected")+'>Escolha para onde vai o tempo…</option>' +
          '<option value="novo"'+(ui.cronoDestino === "novo" ? " selected" : "")+'>Nova sessão</option>';
  if (regs.length) h += '<optgroup label="Somar a uma sessão de hoje">' +
    regs.map(([v,t]) => '<option value="'+esc(v)+'"'+(ui.cronoDestino===v?" selected":"")+'>'+esc(t)+'</option>').join("") + '</optgroup>';
  /* ESTUDAR UM CONTEÚDO JÁ ESCOLHIDO (revisão de UX, 26/09): o que a agenda pede
     hoje e o que está no Falta estudar. Antes só dava "Nova sessão" e o conteúdo
     era escolhido no fim; agora o cronômetro já nasce sabendo o que é. */
  const jaTemSessao = k => db.registros.some(r => r.data === hoje && assuntosDe(r).some(a => chaveAssunto(r.disciplina, a) === k));
  const vistos = new Set(), conts = [];
  const somar = (disc, nome) => { const k = chaveAssunto(disc, nome);
    if (!disc || !nome || vistos.has(k) || jaTemSessao(k)) return; vistos.add(k); conts.push([k, disc, nome]); };
  revisoesDetalhadas().filter(x => !x.rev.feita && (x.status === "hoje" || x.status === "atrasada"))
    .forEach(x => (x.ctx.assuntos || []).forEach(a => somar(x.ctx.disciplina, a)));
  filaAEstudar().forEach(c => somar(c.disciplina, c.nome));
  if (conts.length) h += '<optgroup label="Estudar hoje">' +
    conts.map(([k, d, n]) => '<option value="conteudo:'+esc(k)+'"'+(ui.cronoDestino==="conteudo:"+k?" selected":"")+'>' +
      esc(n + " · " + d) + '</option>').join("") + '</optgroup>';
  return h;
}

/* IR ATÉ A SESSÃO. Só existe quando o tempo vai para uma sessão já registrada
   (escolhida no seletor ou já rodando nela) — "Nova sessão" ainda não tem para
   onde levar. Leva à aba Sessões, rola até a linha e a acende. */
function botaoIrParaSessao(alvo){
  if (!alvo || alvo.tipo !== "registro") return "";
  return '<button class="act atalho" type="button" data-acao="ir-para-sessao" data-id="' + esc(alvo.id) + '" ' +
    'style="align-self:flex-start;margin-top:4px" title="Mostrar esta sessão na aba Sessões">ver na aba Sessões →</button>';
}
function blocoCronometro(){
  const c = db.cronometro;
  if (c){
    const alvo = c.destinoTipo ? alvoCrono(c.destinoTipo, c.destinoId) : null;
    return '<div class="crono">' +
      '<span class="crono-tempo num" id="cronoTempo">'+fmtCrono(Math.floor((Date.now()-c.inicio)/1000))+'</span>' +
      '<span class="crono-info"><b><span class="pulso"></span>'+esc(alvo ? alvo.rotulo : (c.assunto || "Nova sessão"))+'</b>' +
      '<span>'+esc(alvo ? alvo.disciplina + " · " + alvo.detalhe : c.assunto ? c.disciplina + " · sessão nova ao encerrar" : "disciplina e assunto ao encerrar")+'</span>' +
      (alvo ? '<span class="faixas">'+faixasDoAlvo(alvo, horaDe(c.inicio))+'</span>'
            : '<span>começou às '+horaDe(c.inicio)+'</span>') +
      botaoIrParaSessao(alvo) + '</span>' +
      '<button class="btn" data-acao="crono-encerrar">'+(alvo ? "Encerrar e somar" : "Encerrar e registrar")+'</button>' +
      '<button class="btn ghost" data-acao="crono-cancelar">Descartar</button></div>';
  }
  const opcoes = opcoesDestino();
  let destino = ui.cronoDestino || "";
  if (destino && destino !== "novo" && opcoes.indexOf('value="' + destino + '"') < 0) destino = ui.cronoDestino = "";
  const alvo = (destino && destino !== "novo" && !destino.startsWith("conteudo:"))
    ? alvoCrono(destino.split(":")[0], destino.split(":")[1]) : null;
  const contEscolhido = destino.startsWith("conteudo:") ? fichaPorChave(destino.slice(9)) : null;
  return '<form id="formCrono"><div class="campos" style="grid-template-columns:1fr auto">' +
    '<div class="campo"><span>O tempo vai para *</span>' +
      '<select id="cronoDestino" name="destino">' + opcoes + '</select></div>' +
    // o botão fica sempre clicável: sem destino ele EXPLICA o que falta, em vez
    // de não fazer nada — botão morto parece defeito
    '<div class="campo"><span>&nbsp;</span><button class="btn" type="submit"' +
      (destino ? "" : ' title="Escolha para onde o tempo vai antes de iniciar"') +
      '>▶ Iniciar</button></div>' +
    (alvo
      ? '<div class="campo largo"><div class="faixa-edicao" style="margin:0;flex-direction:column;align-items:flex-start">' +
          '<span>⏱ vai somar em <b>' + esc(alvo.rotulo) + '</b> · ' + esc(alvo.disciplina) + ' · ' + esc(alvo.detalhe) + '</span>' +
          (faixasDoAlvo(alvo) ? '<span class="faixas">já cronometrado: ' + faixasDoAlvo(alvo) + '</span>' : '') +
          botaoIrParaSessao(alvo) +
        '</div></div>'
      : contEscolhido
        ? '<div class="campo largo"><div class="faixa-edicao" style="margin:0">' +
            '<span>⏱ vai para <b>' + esc(contEscolhido.nome) + '</b> · ' + esc(contEscolhido.disciplina) + '</span></div></div>'
        : '') +
    '</div><span class="erro-form" id="erroCrono"></span></form>';
}

function iniciarCrono(ev){
  ev.preventDefault();
  const d = Object.fromEntries(new FormData(ev.target).entries());
  const destino = (d.destino || "").trim();
  if (!destino){          // trava: o cronômetro não começa sem saber onde o tempo entra
    const temSessao = db.registros.some(r => r.data === D.hoje());
    document.getElementById("erroCrono").textContent = temSessao
      ? "Escolha para onde o tempo vai: uma sessão de hoje ou uma sessão nova."
      : "Escolha para onde o tempo vai — como ainda não há sessão hoje, use “Nova sessão”.";
    const sel = document.getElementById("cronoDestino");
    if (sel){ sel.classList.add("campo-errado"); sel.focus();
              sel.addEventListener("change", () => sel.classList.remove("campo-errado"), { once: true }); }
    toast("Escolha uma sessão antes de iniciar o cronômetro.");
    return;
  }
  if (destino.startsWith("conteudo:")){ comecarCronoNoConteudo(destino.slice(9)); return; }
  const [tipo, id] = destino.split(":");
  if (destino !== "novo" && !alvoCrono(tipo, id)){
    document.getElementById("erroCrono").textContent = "Esse destino não existe mais — escolha outro."; return;
  }
  db.cronometro = { inicio: Date.now(),
                    disciplina: "", assunto: "",
                    destinoTipo: destino === "novo" ? null : tipo,
                    destinoId: destino === "novo" ? null : id };
  persistir(true); render();
  toast("Cronômetro iniciado às " + horaDe(db.cronometro.inicio) + ".");
}

/** liga o cronômetro já sabendo o conteúdo (chave disciplina|conteúdo). Havendo
    sessão dele hoje, o tempo soma nela; senão, ao encerrar abre o registro com
    disciplina e conteúdo preenchidos (o finalizarCrono já lê c.disciplina/assunto). */
function comecarCronoNoConteudo(chave){
  const c = fichaPorChave(chave);
  const disc = c ? c.disciplina : discDaChave(chave);
  const nome = c ? c.nome : (conteudosDisponiveis().find(a => chaveAssunto(a.disciplina, a.assunto) === chave) || {}).assunto || "";
  if (!disc || !nome){ toast("Esse conteúdo não existe mais — escolha outro."); return; }
  const hoje = D.hoje();
  const reg = db.registros.find(r => r.data === hoje && r.disciplina === disc &&
                                     assuntosDe(r).some(a => chaveAssunto(disc, a) === chave));
  db.cronometro = { inicio: Date.now(), disciplina: disc, assunto: nome,
                    destinoTipo: reg ? "registro" : null, destinoId: reg ? reg.id : null };
  ui.cronoDestino = reg ? "registro:" + reg.id : "";
  persistir(true); render();
  toast("Cronômetro iniciado em “" + nome + "” às " + horaDe(db.cronometro.inicio) + ".");
}

/* O CRONÔMETRO PASSOU DA MEIA-NOITE: você escolhe para onde vão as horas.
   - "tudo no dia em que começou" — o padrão de antes (ver abaixo);
   - "dividir" — até a meia-noite fica na sessão que iniciou o cronômetro, e o
     resto vai para uma sessão NOVA do dia seguinte, criada sozinha, igual à
     original (disciplina, conteúdos, tipo, dificuldade), com as horas dela.
   O momento em que você parou fica guardado (`parado`): fechar a pergunta sem
   responder não perde nada, e parar de novo pergunta de novo, com a mesma hora. */
function encerrarCrono(){
  const c = db.cronometro; if (!c) return;
  const fim = c.parado || Date.now();
  if (D.iso(new Date(fim)) !== D.iso(new Date(c.inicio))){
    c.parado = fim; persistir(true);
    const chip = document.getElementById("cronoChip"); if (chip) chip.innerHTML = "";   // redesenha como "parado"
    const fatias = fatiasPorDia(c.inicio, fim);
    const opcao = (dividir, rotulo, detalhe) =>
      '<button class="btn' + (dividir ? '' : ' ghost') + '" type="button" data-acao="crono-virada" ' +
      'data-dividir="' + (dividir ? 1 : 0) + '" style="display:block;width:100%;text-align:left;margin-top:8px">' +
      '<b>' + rotulo + '</b><br><span style="font-size:12.5px;font-weight:400">' + detalhe + '</span></button>';
    abrirModal("O cronômetro passou da meia-noite",
      '<p class="sub">Começou ' + esc(D.semana(fatias[0].data)) + ', ' + D.br(fatias[0].data) + ' às ' +
        esc(horaDe(c.inicio)) + ' e parou ' + esc(D.semana(D.iso(new Date(fim)))) + ', ' + D.br(D.iso(new Date(fim))) +
        ' às ' + esc(horaDe(fim)) + ' — <b>' + hhmm(fatias.reduce((t,x) => t + x.minutos, 0)) + '</b>. Para onde vão as horas?</p>' +
      opcao(false, "Tudo na sessão de " + D.br(fatias[0].data),
            "o dia em que você começou a estudar") +
      opcao(true, "Dividir por dia",
            fatias.map(x => hhmm(x.minutos) + " em " + D.br(x.data)).join(" · ") +
            " — a sessão do dia seguinte é criada igual à que iniciou o cronômetro"));
    return;
  }
  finalizarCrono(false);
}
/** os pedaços de uma medição, um por dia do calendário (cada um com pelo menos 1 min) */
function fatiasPorDia(inicio, fim){
  const fatias = [];
  let ini = inicio;
  while (true){
    const dia = D.iso(new Date(ini));
    const meiaNoite = new Date(D.soma(dia, 1) + "T00:00").getTime();
    const ate = Math.min(fim, meiaNoite);
    fatias.push({ data: dia, inicio: horaDe(ini), fim: ate === meiaNoite ? "24:00" : horaDe(ate),
                  minutos: Math.max(1, Math.round((ate - ini)/60000)) });
    if (ate >= fim) break;
    ini = ate;
  }
  return fatias;
}
/* A sessão do dia seguinte, igual à que iniciou o cronômetro: mesmo conteúdo,
   tipo, dificuldade e plano; só o tempo (e o dia) são dela. Questões não são
   copiadas — ficaram com a original. Ela é salva pelo caminho de sempre:
   agenda, lembrete vencido e escada reagem como a uma sessão registrada. */
function criarContinuacoes(orig, fatias){
  fatias.forEach(fx => {
    const nova = { id: uid(), data: fx.data, disciplina: orig.disciplina,
                   assuntos: assuntosDe(orig).slice(), assunto: assuntosDe(orig)[0] || "",
                   minutos: fx.minutos, questoes: 0, acertos: 0, dificuldade: dificuldadeDe(orig),
                   tipo: orig.tipo || "estudo", plano: planoDe(orig),
                   anotacoes: "Continuação da sessão de " + D.br(orig.data) + " — o cronômetro passou da meia-noite.",
                   inicio: fx.inicio, fim: fx.fim,
                   blocos: [{ data: fx.data, inicio: fx.inicio, fim: fx.fim, minutos: fx.minutos }],
                   criadoEm: Date.now() };
    salvarRegistro(nova);
    resolverLembrete(nova);
    contatoComConteudos(conteudosDoAlvo(nova), nova.data);
  });
  garantirAgenda();
}
function finalizarCrono(dividir){
  const c = db.cronometro; if (!c) return;
  const fim = c.parado || Date.now();
  const fatias = dividir ? fatiasPorDia(c.inicio, fim) : null;
  const minutos = dividir ? fatias[0].minutos : Math.max(1, Math.round((fim - c.inicio)/60000));
  /* O TEMPO PERTENCE AO DIA EM QUE A SESSÃO COMEÇOU. Estudar das 23h30 à 0h30 é
     uma hora da noite de quarta — não uma hora da quinta, que é o que dava antes,
     quando o bloco nascia com a data do relógio na hora de PARAR. Quem varou a
     madrugada estudando não começou um dia novo de estudo à meia-noite.
     `viradas` guarda quantos dias o cronômetro atravessou, só para a etiqueta
     não mentir dizendo "23:30–00:30" como se fosse o mesmo dia. */
  const diaInicio = D.iso(new Date(c.inicio)), diaFim = D.iso(new Date(fim));
  const bloco = dividir ? { data: diaInicio, inicio: fatias[0].inicio, fim: fatias[0].fim, minutos }
                        : { data: diaInicio, inicio: horaDe(c.inicio), fim: horaDe(fim), minutos };
  if (!dividir && diaFim !== diaInicio) bloco.viradas = D.dif(diaInicio, diaFim);
  const resto = dividir ? fatias.slice(1) : [];
  const alvo = c.destinoTipo ? alvoCrono(c.destinoTipo, c.destinoId) : null;
  db.cronometro = null;

  // --- soma numa sessão de estudo já registrada
  if (alvo && alvo.tipo === "registro"){
    const reg = acharRegistro(alvo.id);
    reg.minutos = (reg.minutos || 0) + minutos;
    reg.blocos = (reg.blocos || []).concat([bloco]);
    if (!reg.inicio) reg.inicio = bloco.inicio;
    reg.fim = bloco.fim;
    if (resto.length) criarContinuacoes(reg, resto);
    persistir(true); render();
    toast(hhmm(minutos) + " somados a “" + alvo.rotulo + "” — agora " + hhmm(reg.minutos) + "." +
          (resto.length ? " O resto foi para uma sessão nova de " + resto.map(x => D.br(x.data)).join(", ") + "." : ""));
    return;
  }
  // --- nova sessão: abre o registro pré-preenchido
  ui.prefill = {
    data: bloco.data, disciplina: c.disciplina, assuntos: c.assunto ? [c.assunto] : [],
    minutos, questoes: "", acertos: "", dificuldade: null,
    inicio: bloco.inicio, fim: bloco.fim,
    anotacoes: "Sessão cronometrada: " + bloco.inicio + " → " + bloco.fim +
               (bloco.viradas ? " do dia seguinte" : "") + " (" + hhmm(minutos) + ").",
    // dividido: ao salvar esta, nasce a do dia seguinte, igual a ela
    divisao: resto.length ? resto : null
  };
  persistir(true);
  // a tela sobreposta abre por cima da aba em que você está (antes pulava para Sessões)
  ui.editandoRegistro = null; ui.foco = null; ui.formAberto = true;
  redesenharTelaForm();
  toast(hhmm(minutos) + " cronometrados — complete o registro para agendar as revisões.");
}

/* tom: "accent" | "bom" | "alerta" | "critico" — cor com função, não enfeite:
   diz num relance se o número é conquista, aviso ou urgência. */
function tile(rot, val, pe, extra, tom){
  return '<div class="tile'+(tom ? " t-"+tom : "")+'"><div class="rot">'+esc(rot)+'</div>' +
         '<div class="val num">'+esc(val)+'</div>' +
         (pe ? '<div class="pe">'+esc(pe)+'</div>' : '') + (extra || '') + '</div>';
}
/** tom da taxa de acerto, nos mesmos cortes que o agendamento usa */
const tomTaxa = t => t === null ? "" : t >= CONFIG.TAXA_ATENCAO ? "bom" : t >= CONFIG.TAXA_CRITICA ? "alerta" : "critico";
/* A lista dos próximos dias era um bloco corrido de cards iguais, um colado no
   outro. Agrupar por dia dá o ponto de corte: cada dia tem rótulo, contagem e
   uma linha separando do dia seguinte. */
function proximosPorDia(lista){
  const dias = new Map();
  const ordenada = lista.slice().sort((a,b) => a.rev.data.localeCompare(b.rev.data));
  (ui.verTodasProximas ? ordenada : ordenada.slice(0, CONFIG.PROXIMAS_VISIVEIS))   // amostra curta
       .forEach(x => { if (!dias.has(x.rev.data)) dias.set(x.rev.data, []); dias.get(x.rev.data).push(x); });
  const hoje = D.hoje();
  return [...dias.entries()].map(([data, itens]) => {
    const faltam = D.dif(hoje, data);
    const noDia = ordenada.filter(x => x.rev.data === data).length;   // o dia inteiro, não só a amostra
    return '<div class="dia-bloco">' +
      '<div class="dia-rotulo">' + esc(D.semana(data)) + ' · ' + D.br(data) +
        '<span>' + (faltam === 1 ? "amanhã" : "em " + faltam + " dias") +
        ' · ' + plural(noDia, "item", "itens") + '</span></div>' +
      itens.map(x => itemRevisao(x, "", { leitura: true })).join("") + '</div>';   // só informa: marcar é na Agenda
  }).join("");
}

/** como a revisão entrou no dia de hoje: fazendo, feita ou ainda por fazer */
/* AS DUAS SUB-ABAS DA AGENDA. O corte não é "feita ou não": é o DIA. Uma
   revisão concluída hoje continua ao lado das dos próximos dias — o dia ainda
   está acontecendo e tirá-la dali faria a lista mudar debaixo da mão de quem
   acabou de marcá-la. Só a partir de amanhã (D+1) ela passa para "Concluídos".
   Por isso o que manda é o dia em que foi feita, não o dia em que foi marcada. */
function diaConcluida(rev){ return rev.feita ? (rev.feitaEm || rev.data) : ""; }
function jaPassou(x){
  const d = diaConcluida(x.rev);
  return !!d && d < D.hoje();
}
function fatiaAgenda(det, fase){
  return det.filter(x => fase === "concluidos" ? jaPassou(x) : !jaPassou(x));
}

function rotuloDeHoje(x, dia){
  if (emAndamento(x.rev)) return "Em andamento agora";
  if (x.rev.feita){
    return "Concluída hoje" + (x.rev.data !== dia ? " · estava marcada para " + D.br(x.rev.data) : "");
  }
  return x.status === "atrasada" ? "Atrasada desde " + D.extenso(x.rev.data) : "Para hoje";
}
/* ANCORAGEM DE ROLAGEM. Minimizar ou expandir um card redesenha a tela, e o
   navegador perde a referência: a página "pulava" e o cabeçalho clicado saía de
   baixo do mouse. Aqui a posição dele na tela é guardada antes e, depois de
   redesenhar, a página rola só o necessário para ele voltar ao mesmo lugar —
   quem se acomoda é o resto da página. */
function manterNoLugar(el, seletor, mudar){
  const antes = el && el.getBoundingClientRect ? el.getBoundingClientRect().top : null;
  mudar();
  if (antes === null) return;
  const depois = document.querySelector(seletor);
  if (!depois) return;
  const delta = depois.getBoundingClientRect().top - antes;
  if (delta) try { window.scrollBy(0, delta); } catch(e){}
}
/** a revisão está sendo cumprida agora: o cronômetro aponta para a sessão dela */
function emAndamento(rev){
  const c = db.cronometro;
  return !!(c && rev && rev.sessaoId && c.destinoTipo === "registro" && c.destinoId === rev.sessaoId);
}
/* REMARCAR DE ONDE SE ESTÁ OLHANDO (pedido do Pedro, 03/10). O card de hoje (e o
   atrasado, na aba Hoje) ganha o "remarcar" que antes só o card de Atrasados tinha:
   o mesmo caminho (remarcarRevisao), que empurra as revisões seguintes do conteúdo.
   Não aparece no que já foi feito, no que está sendo cronometrado nem no bloqueado
   até a prova. */
function botaoRemarcar(x, o){
  if (!o.remarcavel || x.status === "feita" || x.rev.feita || x.rev.data > D.hoje()) return "";
  if (x.tarefa) return '<button class="btn mini" data-acao="remarcar-tarefa" data-id="'+esc(x.rev.id)+'">remarcar</button>';
  if (emAndamento(x.rev) || bloqueadaPelaProva(x.rev)) return "";
  return '<button class="btn mini" data-acao="remarcar-revisao" data-id="'+esc(x.rev.id)+'">remarcar</button>';
}
/* A LINHA DA TAREFA. O ✓ só marca (não abre sessão nenhuma). O "editar" aparece
   onde a lista é de mexer — a Agenda —, não no resumo da aba Hoje. */
function itemTarefa(x, quando, opcoes){
  const o = opcoes || {}, t = x.tarefa;
  const feita = x.status === "feita";
  return '<div class="item rev-linha tarefa '+x.status+'"' + (o.editavel ? ' id="tar-'+esc(t.id)+'"' : '') + '>' +
    '<div class="rev-topo">' +
      (o.leitura ? '' :
      '<button class="check" role="checkbox" aria-checked="'+feita+'" data-acao="tarefa-check" data-id="'+esc(t.id)+'" ' +
      'title="'+(feita ? "Desmarcar esta tarefa" : "Marcar como feita")+'" ' +
      'aria-label="'+esc((feita ? "Desmarcar " : "Marcar como feita: ") + t.titulo)+'">✓</button>') +
      '<div class="corpo"><div class="titulo">' + (t.hora ? '<span class="hora">'+esc(t.hora)+'</span>' : '') + esc(t.titulo) + '</div>' +
      '<div class="meta"><span class="badge b-tarefa">tarefa</span>' + (quando ? ' ' + esc(quando) : '') +
        (feita && t.feitaEm && t.feitaEm !== t.data ? ' · feita em ' + D.br(t.feitaEm) : '') + '</div></div>' +
      (o.editavel || o.saltavel ? '<button class="act" data-acao="editar-tarefa" data-id="'+esc(t.id)+'">editar</button>' : '') +
      botaoRemarcar(x, o) +
    '</div>' +
    (t.nota ? '<div class="ativ"><span class="det">'+esc(t.nota)+'</span></div>' : '') + '</div>';
}
function itemRevisao(x, quando, opcoes){
  if (x.tarefa) return itemTarefa(x, quando, opcoes);
  const o = opcoes || {};
  const nome = nomeRevisao(x.rev);
  const feita = x.status === "feita";
  /* O corpo do item vira o atalho para o cronograma quando quem monta a lista
     pede — é o card de hoje, que é um resumo: o original mora mais abaixo. */
  const salto = o.saltavel
    ? ' data-acao="ir-para-card" data-id="'+esc(x.rev.id)+'" role="link" tabindex="0"' +
      ' title="Ver este item no cronograma abaixo"'
    : '';
  /* Editar de onde se está olhando. Os mesmos botões do card por assunto: o
     card (título e sessões ligadas), a revisão em si e a sessão que a cumpriu —
     senão, mexer num item da lista por dia obrigava a trocar de visão antes. */
  // leitura: a lista só informa (Próximos 7 dias da aba Hoje) — sem a caixa de marcar
  const bloq = bloqueadaPelaProva(x.rev);
  const acoes = o.editavel && !bloq
    ? (x.rev.sessaoId ? '<button class="act" data-acao="abrir-sessao" data-id="'+esc(x.rev.sessaoId)+'" ' +
        'title="As horas ficam na sessão — clique para editá-las">ver sessão</button>' : '') +
      '<button class="act" data-acao="editar-revisao" data-id="'+esc(x.rev.id)+'">editar</button>'
    : '';
  return '<div class="item rev-linha '+x.status+(emAndamento(x.rev) ? " em-andamento" : "")+(bloq ? " bloqueada" : "")+'"' +
    (o.editavel ? ' id="rev-'+esc(x.rev.id)+'"' : '') + (bloq ? ' aria-disabled="true"' : '') + '>' +
    '<div class="rev-topo">' +
      (o.leitura ? '' :
      '<button class="check" role="checkbox" aria-checked="'+feita+'" data-acao="'+(feita ? "reabrir" : "concluir")+'" data-id="'+esc(x.rev.id)+'" ' +
      (bloq ? 'disabled ' : '') +
      'title="'+(feita ? "Desmarcar este item" : "Marcar como feito")+'" ' +
      // o nome do item vai junto: o leitor de tela dizia só "caixa de seleção, não marcada"
      'aria-label="'+esc((feita ? "Desmarcar " : "Marcar como feito: ") + x.ctx.rotulo)+'">✓</button>') +
      '<div class="corpo'+(o.saltavel ? " saltavel" : "")+'"'+salto+'><div class="titulo">'+esc(x.ctx.rotulo)+'</div>' +
      '<div class="meta">'+esc(x.ctx.sub)+(quando ? ' · '+esc(quando) : '')+' · '+esc(nome.toLowerCase())+
        (feita && juntoCom(x.rev) ? ' · ' + esc(juntoCom(x.rev)) : '') +
        (bloq ? ' · <span class="selo-bloq">bloqueada até ' + D.br(bloq) + '</span>' : '') +
        (o.saltavel ? ' <span class="leva-a">ver no cronograma ↓</span>' : '')+'</div></div>' +
      acoes + botaoRemarcar(x, o) +
    '</div>' + descricaoAtividade(x.rev) + '</div>';
}

function telaRegistros(){

}

/* O que a sessão guarda além dos campos editáveis: as medições do cronômetro
   (cada intervalo, não o vão entre o primeiro e o último), quando ela foi
   criada e como está o plano de revisões. Fica aqui, dentro da própria sessão,
   em vez de poluir a lista do histórico.                                    */
function infoDaSessao(reg){
  const faixas = intervalosDe(reg);
  const revs = db.revisoes.filter(x => x.registroId === reg.id);
  const feitas = revs.filter(x => x.feita).length;
  const prox = revs.filter(x => !x.feita).map(x => x.data).sort()[0];
  const linha = (rot, valor) => '<div class="linha-info"><span>'+esc(rot)+'</span><div>'+valor+'</div></div>';
  let h = '<div class="info-extra"><span class="rot-info">Esta sessão</span>';
  if (faixas.length){
    h += linha(faixas.length === 1 ? "Cronômetro" : "Cronômetro · " + faixas.length + " medições",
      faixas.map(f => '<span class="faixa">'+esc(f.rotulo)+'</span>').join("") +
      (reg.minutos ? '<span class="meta">'+hhmm(reg.minutos)+' no total</span>' : ""));
  } else if (reg.minutos){
    h += linha("Tempo", hhmm(reg.minutos) + ' <span class="meta">informado à mão</span>');
  }
  const revLig = revisaoDaSessao(reg);
  if (ehRevisaoSessao(reg)) h += linha("Cumpre a revisão",
    revLig ? esc(contextoRevisao(revLig) ? contextoRevisao(revLig).rotulo : "") +
             ' <span class="meta">de ' + D.brFull(revLig.data) + '</span>'
           : '<span class="meta">a revisão foi excluída — a sessão continua valendo</span>');
  const juntas = juntasDaSessao(reg);
  if (juntas.length){
    // rótulo repetido = dois cards do mesmo conteúdo; aí a data diz qual é qual
    const quantos = {};
    revisoesDaSessao(reg).forEach(r => { const k = (contextoRevisao(r) || {}).rotulo || "";
                                        quantos[k] = (quantos[k] || 0) + 1; });
    h += linha("Cumpriu também",
      juntas.map(r => { const rot = (contextoRevisao(r) || {}).rotulo || "";
                        return esc(rot) + (quantos[rot] > 1 ? ' <span class="meta">de ' + D.br(r.data) + '</span>' : ""); })
        .join(", ") +
      ' <span class="meta">· o tempo conta uma vez só</span>');
  }
  if (reg.criadoEm) h += linha("Registrada em",
    D.brFull(D.iso(new Date(reg.criadoEm))) + ' <span class="meta">às ' + horaDe(reg.criadoEm) + '</span>');
  h += linha("Na agenda", revs.length
    ? feitas + " de " + revs.length + " feitas" +
      (prox ? ' <span class="meta">· próxima em ' + D.brFull(prox) + '</span>'
            : ' <span class="meta">· nada pendente</span>')
    : '<span class="meta">' + (ROTULO_PLANO[planoDe(reg)] || "nenhuma agendada") + '</span>');
  return h + '</div>';
}

/* AS CAIXAS DAS QUESTÕES, iguais em todo lugar: registrar, editar a sessão e
   editar pela aba Questões. Sem questões, a caixa vem VAZIA (com o exemplo
   apagado), não com um "0" que precisava ser apagado antes de digitar. O
   acerto zero só aparece quando há questões — aí ele é um dado. */
function camposQuestoes(questoes, acertos){
  const q = Number(questoes) > 0 ? Number(questoes) : "";
  const a = q !== "" && acertos !== null && acertos !== undefined && acertos !== "" ? Number(acertos) || 0 : "";
  return campo("Questões feitas (opcional)", '<input type="number" name="questoes" min="0" value="'+q+'" placeholder="ex.: 20">') +
         campo("Acertos", '<input type="number" name="acertos" min="0" value="'+a+'" placeholder="ex.: 14">');
}
/** O formulário do registro vive na tela sobreposta (modal), não dentro do card. */
function formRegistroHtml(){
  const ed = ui.editandoRegistro ? acharRegistro(ui.editandoRegistro) : null;
  const pre = !ed && ui.prefill ? ui.prefill : null;
  let base = ed || pre || { data: D.hoje(), disciplina:"", assuntos:[], minutos:"", questoes:"", acertos:"",
                            dificuldade: null, anotacoes:"" };      // a dificuldade é você quem escolhe
  // veio da agenda para uma sessão que já existia: ela passa a cumprir aquele item
  if (ed && ui.ligarRevisao){
    const daAgenda = acharRevisao(ui.ligarRevisao);
    base = Object.assign({}, base, { revisaoId: ui.ligarRevisao });
    // a descrição do item só entra se a sessão ainda não tiver a dela
    if (daAgenda && (daAgenda.nota || "").trim() && !(base.anotacoes || "").trim())
      base = Object.assign({}, base, { anotacoes: daAgenda.nota.trim() });
  }
  if (base.revisaoId && !base.assuntos.length){
    const ctxPre = contextoRevisao(acharRevisao(base.revisaoId) || {});
    if (ctxPre) base = Object.assign({}, base, { disciplina: ctxPre.disciplina, assuntos: ctxPre.assuntos.slice() });
  }
  // rascunho = o que estava na tela antes de trocar o tipo/revisão
  let v = ui.rascunho ? Object.assign({}, base, ui.rascunho) : base;
  ui.rascunho = null;
  // conteúdo já concluído chega aqui como estudo (cronômetro, mural, rascunho…): abre como revisão
  if (!ehTipoRevisao(v.tipo) && sessaoDeConcluido(v, ed)){
    const ligada = v.revisaoId ? acharRevisao(v.revisaoId) : null;
    const rev = ligada && !ehRetomada(ligada) ? ligada : revisaoParaContinuar(v);
    const ctxRev = rev ? contextoRevisao(rev) : null;
    v = Object.assign({}, v, { tipo: "revisao", revisaoId: rev ? rev.id : "" },
                      ctxRev ? { disciplina: ctxRev.disciplina, assuntos: ctxRev.assuntos.slice() } : {});
  }

  let h = "";
  const eRevisao = ehTipoRevisao(v.tipo);
  const planoAtual = planoDe(v);
  if (ed){
    // &nbsp; antes do "·": a linha quebra depois dele, nunca começando com o ponto
    h += '<div class="faixa-edicao">✎ Editando <b>'+esc(rotuloAssuntos(ed))+'</b>&nbsp;· '+esc(ed.disciplina)+'&nbsp;· '+D.brFull(ed.data)+'</div>' +
         infoDaSessao(ed);
  } else {
    // só o aviso de estado fica (agendamento desligado); o funcionamento normal está na Ajuda
    h += agendaAutomatica() ? ''
      : '<p class="sub">O agendamento automático está desligado: as datas da agenda são as que você marca ' +
        '(aba Agenda, <b>+ Adicionar revisão</b>).</p>';
    /* só o cronômetro traz horário: o preenchimento que vem da agenda, do
       "▶ estudar" ou do "▶ continuar" não é sessão cronometrada (24/09 mostrava
       "0min ( → )" para eles). */
    if (pre && pre.inicio) h += '<div class="faixa-edicao">⏱ Sessão cronometrada: <b>'+hhmm(pre.minutos)+'</b> ('+esc(pre.inicio)+' → '+esc(pre.fim)+
      '). Complete a dificuldade para salvar.<span class="spacer"></span>' +
      '<button class="btn mini ghost" type="button" data-acao="descartar-prefill">Descartar</button></div>';
  }
  h += (eRevisao ? '' : planoAtual === "sem"
        ? '<p class="sub" style="color:var(--accent-ink)">Esta sessão está <b>sem cronograma</b>: não gera revisões nem retomadas — serve para o conteúdo que você estuda todo dia. Desmarque a caixa para voltar a agendar.</p>'
        : '') +
    '<form id="formRegistro" novalidate>' +
    (v.inicio ? '<input type="hidden" name="inicio" value="'+esc(v.inicio)+'"><input type="hidden" name="fim" value="'+esc(v.fim||"")+'">' : '') +
    '<div class="campos">' +
      campoTipoSessao(v, ed) +
      campo("Data do estudo", '<input type="date" name="data" value="'+v.data+'" max="'+D.hoje()+'" required>') +
      (eRevisao
        ? campo("Disciplina", '<input value="'+esc(v.disciplina||"")+'" disabled>' +
                '<input type="hidden" name="disciplina" value="'+esc(v.disciplina||"")+'">')
        : campo("Disciplina *", seletorDisciplina(v.disciplina))) +
      camposAssuntos(assuntosDe(v), eRevisao ? "Conteúdos revisados" : undefined,
                     eRevisao ? "" : undefined, eRevisao, v.disciplina || "", true) +
      campoEstudarJunto(v, ed) +
      // sem tempo, a caixa vem vazia com o exemplo apagado — igual às questões
      campo("Tempo (min)", '<input type="number" name="minutos" min="0" max="1440" value="'+(Number(v.minutos) > 0 ? Number(v.minutos) : "")+'" placeholder="ex.: 60">') +
      camposQuestoes(v.questoes, v.acertos) +
      (() => {
        // sessão nova de conteúdo já estudado: a dificuldade vem da última sessão dele
        const herdada = !ed && !v.dificuldade ? dificuldadeHerdada(v.disciplina, assuntosDe(v)) : null;
        return campo("Dificuldade do assunto *",
          seletorDificuldade(ed || v.dificuldade ? dificuldadeDe(v) : herdada) +
          '<span class="ajuda-campo" id="dicaDificuldade">' + (herdada ? textoHerdada(v.disciplina, assuntosDe(v)) : "") + '</span>');
      })() +
      (eRevisao ? "" : campoIntegracao(v)) +
      campo("Descrição", '<textarea name="anotacoes" placeholder="O que ficou confuso, o que revisar…">'+esc(v.anotacoes||"")+'</textarea>', true) +
    '</div><div class="linha acoes-form">' +
      '<button class="btn" type="submit">'+(ed ? 'Salvar<span class="so-largo"> alterações</span>' : "Registrar")+'</button>' +
      '<button class="btn ghost" type="button" data-acao="'+(ed ? "cancelar-edicao" : "toggle-form-registro")+'">Cancelar</button>' +
      // continuar o conteúdo também cabe aqui: é onde você está quando relê a sessão
      (ed && ed.data !== D.hoje()
        ? '<button class="btn ghost" type="button" data-acao="continuar-sessao" data-id="'+esc(ed.id)+'" ' +
          'title="Abrir uma sessão de hoje com este mesmo conteúdo">▶ Continuar<span class="so-largo"> hoje</span></button>' : '') +
      (ed ? '<button class="act excluir excluir-tela" type="button" data-acao="excluir-registro" data-id="'+esc(ed.id)+'">Excluir</button>' : '') +
      '<span class="erro-form" id="erroForm"></span></div></form>';

  return h;
}

/* O FILTRO DE DISCIPLINA E CONTEÚDO, igual em todas as abas (pedido do Pedro,
   25/09 — o modelo é o da aba Anotações). Duas caixas em cascata: escolhida a
   disciplina, o Conteúdo só mostra os dela; escolhido um conteúdo sem
   disciplina, a disciplina acompanha. Cada aba diz de onde vêm as opções
   (`itens`: [{disciplina, nome}]) e guarda a escolha no seu par de campos de
   `ui` — ver FILTROS_DC. O valor do conteúdo é a chaveAssunto (disciplina|nome).
   Devolve o HTML e a escolha JÁ VALIDADA: um nome que não está mais nas opções
   vale como "todos", em vez de deixar a lista vazia sem explicação. */
const FILTROS_DC = {
  f: { disc: "fDisciplina", cont: "fAssunto" },     // Sessões
  a: { disc: "aDisciplina", cont: "aAssunto" },     // Agenda
  c: { disc: "cDisciplina", cont: "cAssunto" },     // Disciplinas
  p: { disc: "pDisciplina", cont: "pAssunto" },     // Progresso
  q: { disc: null,          cont: "qAssunto" }      // Questões (as disciplinas são os botões, várias de uma vez)
};
function filtroDiscCont(pre, o){
  const campos = FILTROS_DC[pre];
  const discs = o.discs || [];
  const disc = campos.disc && discs.indexOf(ui[campos.disc]) >= 0 ? ui[campos.disc] : "";
  const noEscopo = o.discsEscopo || (disc ? [disc] : null);         // Questões: as disciplinas marcadas
  const mapa = new Map();
  (o.itens || []).forEach(x => {
    if (!x || !x.disciplina || !x.nome) return;
    if (noEscopo && noEscopo.indexOf(x.disciplina) < 0) return;
    const k = chaveAssunto(x.disciplina, x.nome);
    if (!mapa.has(k)) mapa.set(k, x);
  });
  const opcoes = [...mapa.entries()]
    .sort((a,b) => a[1].nome.localeCompare(b[1].nome, "pt-BR", { sensitivity: "base" }));
  const cont = mapa.has(ui[campos.cont]) ? ui[campos.cont] : "";
  const umaSo = !!disc || (noEscopo && noEscopo.length === 1);
  const html =
    (campos.disc
      ? campo("Disciplina", '<select id="' + campos.disc + '" data-filtro-dc="' + pre + '" data-parte="disc">' +
          '<option value="">Todas as disciplinas</option>' +
          discs.map(d => '<option value="' + esc(d) + '"' + (d === disc ? " selected" : "") + '>' + esc(d) + '</option>').join("") +
          '</select>')
      : '') +
    campo("Conteúdo", '<select id="' + campos.cont + '" data-filtro-dc="' + pre + '" data-parte="cont">' +
      '<option value="">Todos os conteúdos</option>' +
      opcoes.map(([k, x]) => '<option value="' + esc(k) + '"' + (k === cont ? " selected" : "") + '>' +
        esc(x.nome + (umaSo ? "" : " · " + x.disciplina)) + '</option>').join("") +
      '</select>');
  return { html, disc, cont, n: opcoes.length };
}
/** a disciplina (com o nome como está escrito) de uma chave de conteúdo */
function discDaChave(k){
  const d = (k || "").split("|")[0];
  return disciplinas().find(x => x.toLowerCase() === d) || "";
}
function telaHistorico(){
  const total = db.registros.length;
  let h = '<div class="card"><h2>Todas as sessões <span class="dica">'+(total===1?"1 sessão cadastrada":total+" sessões cadastradas")+'</span></h2>';
  const fdc = filtroDiscCont("f", { discs: disciplinas(),
    itens: db.registros.flatMap(r => assuntosDe(r).map(a => ({ disciplina: r.disciplina, nome: a }))) });
  // a ordem não é filtro: não esconde sessão nenhuma, então não conta nem é "limpada"
  const filtrando = !!(fdc.disc || fdc.cont || ui.fPeriodo !== "todos" || ui.fBusca || ui.fTipo !== "todos");
  /* No celular os cinco filtros, um embaixo do outro, tomavam quase uma tela
     antes da lista. Lá eles ficam atrás do botão "Filtros" (que diz quantos
     estão valendo); no computador o botão nem aparece e os campos ficam à vista. */
  const nFiltros = [fdc.disc, fdc.cont, ui.fPeriodo !== "todos", ui.fTipo !== "todos", ui.fBusca]
    .filter(Boolean).length;
  h += '<div class="filtros recolhivel'+(ui.filtrosRegAbertos ? " aberto" : "")+'">' +
    '<button class="btn mini ghost so-celular botao-filtros" type="button" data-acao="toggle-filtros-reg" ' +
      'aria-expanded="'+(!!ui.filtrosRegAbertos)+'">' + (ui.filtrosRegAbertos ? "▴ " : "▾ ") + 'Filtros' +
      (nFiltros ? ' <span class="badge">' + nFiltros + (nFiltros === 1 ? " ativo" : " ativos") + '</span>' : '') +
    '</button>' +
    '<div class="filtros-campos">' + fdc.html +
    campo("Período", '<select id="fPeriodo">' +
      [["todos","Tudo"],["7","Últimos 7 dias"],["30","Últimos 30 dias"],["futuro","A partir de hoje"]]
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fPeriodo===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    campo("Tipo", '<select id="fTipo">' +
      ([["todos","Todos os tipos"],["estudo","Só estudo"],["revisao","Só revisão"]]
        .concat(db.registros.some(r => r.tipo === "misto")      // rótulo antigo: só se ainda houver
          ? [["misto","Só estudo/revisão"],["revisoes","Revisão e estudo/revisão"]] : []))
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fTipo===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    campo("Ordenar por", '<select id="fOrdem">' +
      [["data-desc","Data (mais recente)"],["data-asc","Data (mais antiga)"],
       ["dificuldade-desc","Mais difícil"],["tempo-desc","Mais tempo"]]
        .map(([k,n]) => '<option value="'+k+'"'+(ui.fOrdem===k?" selected":"")+'>'+n+'</option>').join("") + '</select>') +
    '<div class="campo busca campo-busca"><span id="rotBusca">Buscar</span><span class="lupa" aria-hidden="true">⌕</span>' +
      '<input id="fBusca" type="search" aria-labelledby="rotBusca" value="'+esc(ui.fBusca)+'" placeholder="assunto ou descrição"></div>' +
    '</div>' +
    (filtrando ? '<div class="filtros-acoes"><span class="marca-filtro">filtro ativo</span>' +
      '<span class="spacer"></span><button class="btn mini ghost" data-acao="limpar-filtros-reg">limpar filtros</button></div>' : '') +
  '</div>';

  const linhas = registrosFiltrados();
  if (!linhas.length){
    return h + '<div class="vazio"><strong>Nenhum registro encontrado</strong>' +
      (total ? 'Nenhuma sessão bate com os filtros acima.' : 'Use o botão “Registrar sessão” para lançar a primeira.') +
      '</div></div>';
  }

  // --- resumo do que está sendo listado
  const idsList = new Set(linhas.map(r => r.id));
  const revsList = db.revisoes.filter(r => idsList.has(r.registroId));
  const pend = revsList.filter(r => !r.feita).length;
  const atras = revsList.filter(r => statusRevisao(r) === "atrasada").length;
  const dias = new Set(linhas.map(r => r.data)).size;
  /* OS NÚMEROS DAQUI NÃO CONTAM HORAS. "Tempo na semana" e "Tempo total" saíram:
     um relógio somando tudo o que você já estudou cobra em vez de informar, e
     quem abre esta aba quer ver o que estudou, não quanto ainda falta. O tempo
     de cada sessão continua na linha dela — ali é dado, não placar.
     No lugar entraram dois números de PROGRESSO: o quanto você cobriu e o
     quanto já fechou, que é o que a plataforma inteira persegue. */
  const fichas = [...new Map(linhas.flatMap(r =>
      conteudosDoAlvo(r).map(c => [c.disciplina + "|" + c.nome.toLowerCase(), c]))).values()];
  const discsList = new Set(linhas.map(r => r.disciplina).filter(Boolean)).size;
  const fechados = fichas.filter(c => c.fase === "concluido").length;
  const abertos = fichas.length - fechados;
  h += '<div class="tiles" style="margin-bottom:14px">' +
    tile("Sessões listadas", String(linhas.length),
         dias + (dias===1?" dia":" dias") + " diferentes") +
    tile("Conteúdos estudados", String(fichas.length),
         discsList + (discsList === 1 ? " disciplina" : " disciplinas")) +
    // vermelho é para atraso: o total pendente é neutro (a aba Agenda já acende o atraso)
    tile("Pendentes na agenda", String(pend), atras ? atras + " em atraso" : "nenhum atrasado") +
    tile("Conteúdos concluídos", String(fechados),
         fichas.length ? (abertos ? abertos + " ainda em andamento" : "todos fechados")
                       : "nada no cadastro ainda",
         fichas.length ? '<div class="barra"><i class="'+(fechados === fichas.length && fechados ? "cheia" : "")+
                         '" style="width:'+Math.round((fechados/fichas.length)*100)+'%"></i></div>' : "",
         fechados && fechados === fichas.length ? "bom" : "accent") + '</div>';

  h += '<div class="tab-rolagem"><table class="tab-sessoes"><thead><tr>' +
    '<th class="col-curta col-nowrap">Data</th><th class="col-curta">Disciplina</th>' +
    '<th class="num col-curta col-nowrap">Tempo</th>' +
    '<th class="col-larga">Conteúdos</th>' +
    '<th class="col-curta col-nowrap">Dificuldade</th>' +
    '<th class="col-tipo col-curta col-nowrap">Tipo</th>' +
    '<th class="col-acao"></th></tr></thead><tbody>';
  const emEdicao = ui.editandoRegistro;
  let ultimoDia = "";
  h += linhas.map(r => {
    const plano = planoDe(r);
    /* A coluna de revisões saiu: ela contava "feitas/total" DA SESSÃO, e o plano
       deixou de ser da sessão — é do conteúdo, e duas sessões do mesmo conteúdo
       dividem o mesmo card. Quem responde isso é a aba Agenda.
       O que sobrou é o sinal de CONFIGURAÇÃO que ninguém adivinha de fora:
       esta sessão não gera plano. Ele vai junto do nome do conteúdo, e só
       aparece quando é o caso.                                             */
    const marcaPlano = ehRevisaoSessao(r) ? ''
      : plano === "sem"    ? ' <span class="badge" title="Esta sessão não gera revisões nem retomadas">sem cronograma</span>'
      : '';
      /* "manual" saiu daqui: plano feito à mão é o caso mais comum depois de
         mexer numa data, e a etiqueta aparecia em quase toda linha sem mudar
         nada do que se faz na lista. Quem precisa do dado continua achando na
         ficha da sessão, no bloco "Esta sessão".                           */
    // separador de dia, para a lista ficar legível quando há muitas sessões
    let sep = "";
    if (r.data !== ultimoDia && (ui.fOrdem === "data-desc" || ui.fOrdem === "data-asc")){
      ultimoDia = r.data;
      sep = '<tr class="sep-dia"><td colspan="7">'+esc(D.semana(r.data))+' · '+D.brFull(r.data) +
            ' <span class="meta">'+hhmm(minutosDoDia(r.data))+' no dia</span></td></tr>';
    }
    return sep + '<tr class="linha-clicavel'+(emEdicao === r.id ? " editando-linha" : "")+'"' +
      ' data-acao="editar-registro" data-id="'+esc(r.id)+'" title="Clique para abrir esta sessão">' +
      '<td class="num col-curta col-nowrap s-data">'+D.br(r.data)+'</td><td class="col-curta s-disc">'+esc(r.disciplina)+'</td>' +
      /* Tempo vem antes do conteúdo: assim a Dificuldade encosta na coluna larga
         e sobra folga para o rótulo dela caber numa linha só. */
      '<td class="num col-curta col-nowrap s-tempo">'+(r.minutos ? hhmm(r.minutos) : "—") +
        (intervalosDe(r).length > 1
          ? '<div style="font-size:11px;color:var(--muted)">'+intervalosDe(r).length+' medições</div>' : '') +
        '</td>' +
      '<td class="col-larga s-cont">'+esc(rotuloAssuntos(r)) + marcaPlano +
        (r.anotacoes ? '<div class="pe" style="font-size:12px;color:var(--text-2)">' +
          esc(r.anotacoes.slice(0,160))+(r.anotacoes.length>160?"…":"")+'</div>' : '') + '</td>' +
      '<td class="col-curta col-nowrap s-dif">'+badgeDificuldade(dificuldadeDe(r))+'</td>' +
      '<td class="col-tipo col-curta col-nowrap s-tipo">'+badgeTipoSessao(r)+'</td>' +
      /* Continuar o conteúdo dali: abre uma sessão de hoje com a mesma
         disciplina e os mesmos conteúdos. É o impulso que nasce olhando a
         sessão de terça — antes ele custava escolher tudo de novo. */
      // sessão de hoje não precisa de "continuar": continuar nela é somar horas ali
      '<td class="col-acao s-acao">' + (r.data < D.hoje()
        ? '<button class="act" data-acao="continuar-sessao" data-id="'+esc(r.id)+'" ' +
          'title="Abrir uma sessão de hoje com este mesmo conteúdo">▶ continuar</button>'
        : '') + '</td></tr>';
  }).join("");
  return h + '</tbody></table></div></div>';
}
/** Seletor de disciplina: só as cadastradas + "criar nova" no topo da lista. */
function seletorDisciplina(valor){
  const lista = disciplinas();
  const criando = !valor && !lista.length;
  const opcoes = (!valor && lista.length ? '<option value="" selected>Selecione a disciplina…</option>' : '') +
    '<option value="__nova"'+(criando ? " selected" : "")+'>＋ Criar nova disciplina</option>' +
    (lista.length ? '<optgroup label="Minhas disciplinas">' +
      lista.map(d => '<option'+(d === valor ? " selected" : "")+'>'+esc(d)+'</option>').join("") + '</optgroup>' : '');
  return '<select name="disciplina" class="sel-disciplina">' + opcoes + '</select>' +
         '<input name="novaDisciplina" class="nova-disciplina" placeholder="Nome da nova disciplina"' +
         (criando ? '' : ' hidden') + ' style="margin-top:6px">';
}
/** liga o comportamento "criar nova" (mostra o campo de texto sem redesenhar a tela) */
function ligarSeletoresDisciplina(){
  document.querySelectorAll("select.sel-disciplina").forEach(sel => {
    if (sel.dataset.pronto) return;
    sel.dataset.pronto = "1";
    const inp = sel.parentElement.querySelector(".nova-disciplina");
    if (!inp) return;
    // nova disciplina sendo digitada: o conteúdo destrava assim que ela tem nome
    if (sel.closest("#formRegistro")) inp.addEventListener("input", () => travarConteudos(sel.closest("form")));
    sel.addEventListener("change", () => {
      const criar = sel.value === "__nova";
      inp.hidden = !criar;
      if (criar) inp.focus(); else inp.value = "";
      if (criar && sel.closest("#formRegistro")) travarConteudos(sel.closest("form"));
      /* Trocou a disciplina: a lista de conteúdos é outra. Redesenha o
         formulário (guardando o que já estava digitado) para o campo de
         conteúdo passar a mostrar só o que é daquela disciplina. */
      if (!criar && sel.closest("#formRegistro")){ guardarRascunhoRegistro(); redesenharTelaForm(); }
      /* No formulário de revisão (tela sobreposta) basta trocar as opções do
         seletor de conteúdo — sem redesenhar, as datas já marcadas ficam. */
      const campo = sel.closest("#formRevisao") && document.getElementById("campoAssunto");
      if (!criar && campo) campo.innerHTML = opcoesDeConteudo(sel.value, lerAssuntosForm(sel.closest("form")));
    });
  });
}
