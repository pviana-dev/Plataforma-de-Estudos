.fmt .amostra{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
.fmt .contador{margin-left:10px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.fmt .contador.perto{color:var(--alerta-ink);font-weight:600}
.fmt .contador.cheio{color:var(--critico);font-weight:600}
/* cores da anotação: o texto guarda só o marcador, quem pinta é isto aqui —
   por isso a cor acompanha o tema em vez de ficar cravada no dado */
.mk{border-radius:3px}
.mk-grifo{background:var(--star-soft);box-shadow:0 0 0 2px var(--star-soft)}
.mk-atencao{color:var(--critico-ink);font-weight:600}
.mk-regra{color:var(--bom-ink);font-weight:600}
.mk-ref{color:var(--s1);font-weight:600}
/* chrome ativo (filtros, cabeçalho do card de anotação) usa o verde claro da
   identidade; o cinza-areia ficou só para o que é inerte de verdade */
.filtros{display:flex;flex-direction:column;gap:11px;margin-bottom:14px;
  background:var(--chrome);border:1px solid var(--chrome-borda);border-radius:10px;padding:12px 13px}
.filtros.filtros-dentro{margin:2px 0 0}
/* caixa de VÁRIAS disciplinas (aba Questões): parece a caixa de escolha, e abre
   uma lista de caixinhas de marcar por cima do que vem embaixo */
.multi-disc{position:relative}
.multi-caixa{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;
  border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:8px;padding:8px 10px;color:var(--text)}
.multi-caixa span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.multi-disc.aberto .multi-caixa{border-color:var(--accent);box-shadow:0 0 0 3px var(--foco)}
.multi-lista{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:30;background:var(--surface);
  border:1px solid var(--border);border-radius:10px;box-shadow:0 10px 28px rgba(0,0,0,.14);padding:5px;
  max-height:280px;overflow-y:auto}
.multi-disc.aberto .multi-lista{display:block}
.multi-op{display:flex;align-items:center;gap:9px;width:100%;padding:8px 9px;border-radius:7px;text-align:left;
  color:var(--text);font-size:13.5px}
.multi-op:hover{background:var(--accent-soft)}
.multi-op .caixinha{flex:none;width:16px;height:16px;border-radius:4px;border:1.5px solid var(--campo-borda);
  background:var(--campo-fundo);display:grid;place-items:center;font-size:11px;line-height:1;color:#fff}
.multi-op[aria-pressed="true"] .caixinha{background:var(--accent-forte);border-color:var(--accent-forte)}
.multi-op[aria-pressed="true"] .caixinha::after{content:"✓"}
/* a mesma caixa, de escolha ÚNICA (todos os filtros — listasDosFiltros): a escolhida fica
   marcada na cor da identidade, com o ✓ à direita */
.op-unica{justify-content:space-between}
.op-unica[aria-selected="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.op-unica[aria-selected="true"]::after{content:"✓";font-size:12px}
.lista-unica.aberto{z-index:31}
@media (pointer:coarse){ .multi-caixa,.multi-op{font-size:16px} }      /* dentro de um card de filtros (Agenda, Progresso, Questões) */
.filtros-campos{display:grid;gap:11px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));align-items:end}
/* disciplina de nome longo ("Legislação Específica do TRF da 5ª Região") virava uma torre de
   6 linhas na coluna estreita da lista de sessões; com largura mínima fica em 2–3 */
@media (min-width:621px){ .tab-sessoes td.s-disc{min-width:150px} }
.filtros .campo{min-width:0}
.filtros .campo > span{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.45px;color:var(--text-2)}
.filtros .busca{grid-column:1/-1}
.filtros-acoes{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  border-top:1px solid var(--border);padding-top:10px}
.filtros-acoes .spacer{margin-left:auto}
.marca-filtro{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.45px;
  color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent);
  border-radius:999px;padding:2px 9px}
/* dentro do painel verde, a etiqueta inverte para continuar saltando */
.filtros .marca-filtro{background:var(--campo-fundo)}
.campo-busca{position:relative}
.campo-busca input{padding-left:29px}
.campo-busca .lupa{position:absolute;left:10px;bottom:8px;font-size:15px;color:var(--muted);
  line-height:1;pointer-events:none}
mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}
/* a pesquisa das Anotações, logo abaixo do título da lista */
.busca-anot{margin:2px 0 14px}
.busca-anot input{width:100%}
.hl-tema{font-size:12.5px;color:var(--muted)}
/* filtros da Agenda: Situação, Organizar e Assunto, um abaixo do outro */
.filtros-agenda .linha + .linha{margin-top:8px}
/* o quadro de Disciplina/Conteúdo tem respiro dos dois lados: acima, da linha
   Organizar; abaixo, da linha Revisões (que só existe em "A fazer") */
.filtros-agenda .filtros-dentro{margin:10px 0 0}
.filtros-agenda .filtros-dentro + .linha{margin-top:12px}
.filtros-agenda .hl-tema{min-width:72px}
.filtros-agenda select{border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:8px;
  padding:9px 12px;font-size:14px;flex:1;min-width:0;max-width:520px}
/* Mostrar: só as próximas / todas — escolha secundária, botões menores que os de Situação e Organizar */
.filtros-agenda .aba-mini{padding:5px 12px;font-size:12.5px}
/* personalizar as revisões até a prova: um atalho logo abaixo de "Revisões" */
.filtros-agenda .linha-rev-prova{margin-top:8px}
.filtros-agenda .linha-rev-prova .act{font-size:12.5px}
.filtros-agenda select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--foco);outline:none}
/* dias de prova do vestibular (ajustes) e a ligação opcional na aba Disciplinas */
.dia-prova{gap:6px;margin-bottom:6px;flex-wrap:nowrap}
.dia-prova input[type="text"]{flex:1;min-width:0}
.dia-prova input[type="date"]{flex:0 0 auto}
select.sel-dia{border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:6px;
  font-size:12px;padding:3px 6px;max-width:170px;color:var(--text-2)}
.dia-cont{margin-top:4px}
select.sel-dia:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--foco);outline:none}
details.ajuda{margin-top:10px;font-size:13px;color:var(--text-2)}
details.ajuda summary{cursor:pointer;color:var(--accent-ink);font-size:12.5px}
details.ajuda p{margin:8px 0 0}
/* nova disciplina: um cabeçalho com o "+" no bloco verde da marca */
.nova-disc-cab{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:14px;border-radius:var(--radius);
  background:var(--filtro-fundo);border:1px solid var(--filtro-borda)}
.nova-disc-cab .marca{font-size:20px;font-weight:600;line-height:1}
.form-nova-disc input[name="nome"]{font-size:15px;padding:10px 12px}
/* o tutorial da Ajuda: seções em cartão que abrem e fecham, um índice em cima */
.aj-layout{display:grid;grid-template-columns:210px 1fr;gap:18px;align-items:start}
.aj-sumario{position:sticky;top:0;display:flex;flex-direction:column;gap:2px;padding:10px 8px;
  border:1px solid var(--filtro-borda);border-radius:var(--radius);background:var(--aj-sumario-fundo, var(--filtro-fundo))}
/* o sumário tem um verde mais claro que o das barras de filtro (aprovado pelo Pedro em
   24/09), só no tema claro; sem esta linha ele usaria --filtro-fundo */
:root:not([data-tema="escuro"]) .aj-sumario{--aj-sumario-fundo:#f6f9f7}
.aj-sumario-tit{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.45px;color:var(--text-2);
  padding:2px 8px 6px}
.aj-sumario a{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:13px;
  color:var(--text-2);text-decoration:none;border-left:3px solid transparent;transition:.15s}
.aj-sumario a:hover{background:var(--accent-soft);color:var(--accent-ink)}
.aj-sumario a[aria-current="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600;
  border-left-color:var(--accent-forte)}
.aj-sumario .aj-num{width:20px;height:20px;font-size:11px}
.aj-ir{display:none}
@media (max-width:700px){
  .aj-layout{grid-template-columns:1fr}
  .aj-sumario{display:none}
  .aj-ir{display:block;width:100%;margin:4px 0 8px;padding:8px 10px;border-radius:8px;
    border:1px solid var(--campo-borda);background:var(--campo-fundo)}
}
details.tutorial{border:1px solid var(--filtro-borda);border-radius:var(--radius);background:var(--surface);margin-top:8px;
  overflow:hidden}
/* o título da seção tem o mesmo fundo verde-claro do sumário; o número, um verde mais escuro */
details.tutorial summary{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
  font-weight:600;font-size:14px;color:var(--text);list-style:none;background:var(--filtro-fundo)}
details.tutorial summary::-webkit-details-marker{display:none}
details.tutorial summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .2s}
details.tutorial[open] summary::after{transform:rotate(180deg)}
details.tutorial summary:hover{color:var(--accent-ink)}
details.tutorial[open] summary{border-bottom:1px solid var(--filtro-borda)}
.aj-num{flex:none;width:24px;height:24px;border-radius:7px;display:grid;place-items:center;font-size:12.5px;
  background:var(--accent-forte);color:#fff;font-weight:650}
html[data-tema="escuro"] .aj-num{color:#1b2224}
.aj-corpo{padding:10px 16px 14px;font-size:13.5px;color:var(--text-2);line-height:1.6}
.aj-corpo p{margin:6px 0}
.aj-corpo b{color:var(--text)}
.aj-corpo .aj-aba{color:var(--accent-ink)}
.aj-passos,.aj-lista{margin:6px 0 0;padding-left:20px}
.aj-passos li,.aj-lista li{margin:0;padding:7px 0}
/* separadores: um fio entre cada subtópico da seção (passos, itens, abas, campos)… */
.aj-passos li + li,.aj-lista li + li,.aj-abas .aj-item + .aj-item{border-top:1px solid var(--border)}
/* …e um tracejado entre os blocos de texto da seção */
.aj-corpo > * + *{border-top:1px dashed var(--border);margin-top:8px;padding-top:8px}
.aj-abas{margin:0}
.aj-abas .aj-item{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:8px 0}
.aj-abas dt{font-weight:600;color:var(--text)}
.aj-abas dd{margin:0}
@media (max-width:620px){ .aj-abas .aj-item{grid-template-columns:1fr;gap:2px} }
.aj-fluxo{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 10px}
.aj-fluxo span{display:flex;flex-direction:column;padding:7px 11px;border-radius:9px;
  background:var(--accent-soft);border:1px solid var(--filtro-borda)}
.aj-fluxo small{font-size:11.5px;color:var(--text-2)}
.aj-fluxo i{font-style:normal;color:var(--muted)}
/* até 1060px (tablet incluído) o cabeçalho empilha: em três colunas, a contagem
   regressiva ia por cima do nome "Plataforma de Estudos" — que cresceu em 25/09
   e passou a pedir mais largura (a 980px já encostava na contagem) */
@media (max-width:1060px){
  header.top{grid-template-columns:1fr;justify-items:center;text-align:center;position:relative}
  /* a fileira de baixo ocupa a largura toda: as datas na ponta esquerda, os botões
     (ajustes, ajuda, tema) na direita e o meio vazio (pedido do Pedro, 25/09) */
  .top .dir{justify-self:stretch;justify-content:flex-end}
  .top .dir .chip-data{margin-right:auto}
  /* O PERFIL NO CANTO SUPERIOR DIREITO, na altura do nome (pedido do Pedro, 25/09 —
     primeiro foi o esquerdo): sai da fileira de botões e fica solto no canto, com
     destaque; o nome se afasta o bastante para os dois não se encostarem, e o menu
     abre alinhado pela direita, dentro da tela. */
  .top .dir .perfil{position:absolute;right:0;top:0}
  .top .esq{padding-right:54px}
}
@media (max-width:620px){
  .wrap{padding:16px 13px 70px}
  .tile .val{font-size:21px}

  /* SESSÕES EM CARTÕES. A tabela de 7 colunas rolava para o lado e o conteúdo
     ficava numa coluna estreita. Aqui cada sessão vira um bloco: o conteúdo (e a
     descrição) em cima, com a linha inteira; embaixo, data · disciplina · tempo,
     as etiquetas e o ▶ continuar. As faixas de dia continuam separando. */
  .tab-sessoes,.tab-sessoes tbody{display:block;width:100%}
  .tab-sessoes thead{display:none}
  .tab-sessoes tr.sep-dia,.tab-sessoes tr.sep-dia td{display:block}
  .tab-sessoes tr.linha-clicavel{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;
    padding:10px 9px;border-bottom:1px solid var(--grade)}
  .tab-sessoes tr.linha-clicavel td{display:block;padding:0;border:0;width:auto;min-width:0}
  .tab-sessoes td.s-cont{order:-1;flex:1 1 100%;font-weight:550}
  .tab-sessoes td.s-cont .pe{font-weight:400;margin-top:2px}
  .tab-sessoes td.s-data,.tab-sessoes td.s-disc,.tab-sessoes td.s-tempo{font-size:12.5px;color:var(--text-2);
    white-space:nowrap}
  .tab-sessoes td.s-disc::before,.tab-sessoes td.s-tempo::before{content:"· ";color:var(--muted)}
  .tab-sessoes td.s-tempo div{display:inline;margin-left:4px}
  .tab-sessoes td.s-acao{margin-left:auto}

  /* FILTROS DA ABA SESSÕES atrás do botão (ver telaHistorico) */
  .filtros.recolhivel:not(.aberto) .filtros-campos{display:none}
  .filtros.recolhivel .botao-filtros{align-self:flex-start}

  /* AS OUTRAS TABELAS EM CARTÕES (Registrado hoje; Desempenho da aba Questões):
     o nome em cima, com a linha inteira; os números embaixo, cada um com o seu
     rótulo (o cabeçalho da coluna some); a barra de acerto, inteira, por último. */
  .tab-cartao,.tab-cartao tbody{display:block;width:100%}
  .tab-cartao thead{display:none}
  .tab-cartao tr{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:10px 4px;
    border-bottom:1px solid var(--grade)}
  .tab-cartao tr:last-child{border-bottom:0}
  .tab-cartao td{display:block;padding:0;border:0;min-width:0 !important}
  .tab-cartao td.c-nome{flex:1 1 100%;font-weight:550}
  .tab-cartao td.c-nome .meta{font-weight:400}
  .tab-cartao td.c-info{font-size:12.5px;color:var(--text-2)}
  .tab-cartao td.c-info[data-rot]::after{content:" " attr(data-rot)}
  .tab-cartao td.c-fim{margin-left:auto;font-weight:550}
  .tab-cartao td.c-barra{flex:1 1 100%}

  /* ABAS NUMA LINHA SÓ, NO ALTO (celular). Soltas, elas quebravam em três linhas.
     Aqui ficam numa faixa que rola para o lado (esmaecida na ponta para dizer que
     há mais) e fica PRESA no topo ao rolar a página — sempre à mão. A aba aberta
     é trazida para a vista (ver posRender). Até 25/09 a faixa ficava no pé da
     tela, como num app; o Pedro preferiu no alto. */
  nav.abas{position:sticky;top:0;z-index:40;flex-wrap:nowrap;overflow-x:auto;gap:5px;
    margin:0 -13px 14px;padding:8px 13px;padding-right:30px;background:var(--bg);
    border-bottom:1px solid var(--border);
    scrollbar-width:none;-webkit-overflow-scrolling:touch;
    -webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent);
            mask-image:linear-gradient(90deg,#000 calc(100% - 30px),transparent)}   /* "tem mais para o lado" */
  nav.abas::-webkit-scrollbar{display:none}
  nav.abas .aba{flex:none;padding:8px 13px;font-size:13.5px}
  /* filtros da Agenda: rótulo colado nos botões, para "Situação: A fazer · Concluídos" caber numa linha */
  .filtros-agenda .hl-tema{min-width:0}
  .filtros-agenda .linha{gap:6px}
  .filtros-agenda .aba:not(.aba-mini){padding:8px 13px;font-size:13.5px}
  .filtros-agenda .aba-mini{padding:5px 10px;font-size:12px}
  header.top{gap:9px;margin-bottom:14px}
  .regressiva{padding:3px 27px}
  .regressiva b{font-size:28px}
  .brand h1{font-size:24px}
  .marca{width:40px;height:40px;border-radius:12px}
  /* ANOTAÇÃO NO CELULAR: os botões (↑ ↓, data, estrela, editar) numa faixa em
     cima e o texto embaixo, na largura toda — sem a coluna dos botões roubando
     espaço do texto ao lado (pedido do Pedro, 26/09). */
  .apr-topo{flex-wrap:wrap;justify-content:flex-end;gap:6px 8px}
  .apr-topo .setas-toque{margin-right:auto}
  .apr-topo .apr-texto{order:1;flex:1 1 100%}
  /* "Questões dia a dia": o título na linha dele e o resumo logo abaixo */
  .card > h2.titulo-quebra{flex-wrap:wrap;row-gap:2px}
  .card > h2.titulo-quebra .dica{flex:1 1 100%;padding-left:11px}
  /* Período (7 · 30 · 90 dias) numa linha só */
  .filtro-periodo{flex-wrap:nowrap;gap:5px}
  .filtro-periodo .aba{padding:6px 11px;font-size:13px}
}
/* TELA DE TOQUE: campo com letra menor que 16px faz o iPhone dar zoom na página
   inteira ao tocar nele (e ela fica ampliada depois). Com 16px, não há zoom. */
@media (pointer:coarse){
  input:not([type="checkbox"]):not([type="radio"]),select,textarea{font-size:16px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="esq brand">
      <span class="marca" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="23" height="23" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4H10a3 3 0 0 1 3 3v12a2.5 2.5 0 0 0-2.5-2.5H5.5A1.5 1.5 0 0 1 4 15V5.5Z"/>
          <path d="M20 5.5A1.5 1.5 0 0 0 18.5 4H14a3 3 0 0 0-3 3v12a2.5 2.5 0 0 1 2.5-2.5h5A1.5 1.5 0 0 0 20 15V5.5Z"/>
        </svg>
      </span>
      <h1>Plataforma <span>de Estudos</span></h1>
    </div>
    <!-- no meio: a contagem da prova e, embaixo dela, o cronômetro quando está rodando -->
    <div class="centro" id="centroTopo">
      <div id="regressiva"></div>
      <div id="cronoChip"></div>
    </div>
    <div class="dir">
      <button class="chip-data" id="chipData" data-acao="info-datas"></button>

<script>
(() => {
"use strict";

/* ==========================================================================
   1. CONFIGURAÇÃO — ajuste aqui os parâmetros do agendamento
   ========================================================================== */
const CONFIG = {
  META_DIARIA_MIN: 180,            // meta padrão de estudo por dia (minutos)

  // Quantas revisões o assunto PEDE conforme a dificuldade (1 = fácil, 3 = difícil).
  // Sistema Leitner: o que custa mais volta mais vezes e mais cedo.
  REVISOES_POR_DIFICULDADE: { 1: 2, 2: 3, 3: 5 },
  TAXA_CRITICA: 60,                // % de acerto abaixo disso pede pelo menos 4 revisões
  TAXA_ATENCAO: 75,                // abaixo disso garante ao menos 3
  /* A ESCADA da repetição espaçada: dias após o fechamento do conteúdo em que
     cada revisão cai, em intervalos crescentes. O que se respeita de verdade é
     a DISTÂNCIA de um degrau ao seguinte: revisão atrasada ou marcada a mais
     empurra as próximas, cada uma mantendo a sua distância. A prova não corta
     a escada — as revisões seguem depois dela, e parar é escolha sua. */
  INTERVALOS_LIVRES: [1, 3, 7, 16, 35, 70, 140, 240, 365],
  /* A dificuldade estica ou encurta a escada inteira: o que está fácil pode
     esperar mais; o difícil volta mais cedo. */
  FATOR_DIFICULDADE: { 1: 1.5, 2: 1, 3: 0.7 },
  HORIZONTE_LIVRE: 180,                 // dias à frente quando não há teto escolhido (com ou sem prova)
  MAX_REVISOES: 9,                      // nenhum assunto passa disso (o tamanho da escada)
  /* Quanto a dificuldade deixa o assunto ir fundo na escada: um assunto
     tranquilo não precisa das 9 revisões só porque há um ano de janela. */
  FOLGA_POR_DIFICULDADE: 4,

  /* VOLTAS ao conteúdo ainda em andamento. Não é revisão: é continuar de onde
     parou, então o intervalo NÃO cresce — crescer é para material já fechado.
     O padrão sai de duas coisas: a DIFICULDADE (difícil volta antes) e o TEMPO
     DE ESTUDO PREVISTO — os dias até a prova (ou até o "revisar até"): com a
     prova perto não dá para deixar o conteúdo esfriar; sem prazo, o fácil pode
     esperar mais. Os números são por dificuldade: 1 = fácil, 2 = médio, 3 = difícil.
     Nos ajustes você troca qualquer um deles (db.diasRetomada). */
  VOLTA_DIAS: {
    perto: { 3: 1, 2: 1, 1: 2 },        // até VOLTA_PERTO dias até a prova: nada esfria
    medio: { 3: 1, 2: 2, 1: 3 },        // até VOLTA_MEDIO dias
    longe: { 3: 1, 2: 2, 1: 4 }         // mais que isso, ou sem prazo: o ritmo de sempre
  },
  VOLTA_PERTO: 30,
  VOLTA_MEDIO: 90,
  VOLTA_MAX_ESCOLHA: 30,                // nos ajustes: de 1 a 30 dias
  RETORNO_POR_DIA: 3,                   // depois da prova: primeiras revisões por dia, no máximo
  MINUTOS_POR_ITEM: 30,                 // religando: a meta diária ÷ isto = itens por dia (espalharCardsAoReligar)
  AVISO_ABERTO_DIAS: 14,                // depois disso, o card sugere fechar o conteúdo
  ASSUNTOS_VISIVEIS: 4,                 // blocos abertos na visão por assunto antes do "+"
  AGENDA_VISIVEL: 12,                   // itens abertos na visão por dia antes do "+"
  /* Por padrão a agenda mostra só o que vem logo: as 2 próximas revisões e a
     próxima retomada de cada conteúdo — cumprida uma, a seguinte aparece. A
     escada inteira continua lá; "Todas as agendadas" mostra tudo. */
  REVISOES_VISIVEIS: 2,
  RETOMADAS_VISIVEIS: 1,
  MAX_ANOTACAO: 2000,                   // caracteres por caixa de anotação (~2 KB por anotação)

  /* Cores da anotação. São MARCADORES no texto (4 bytes por trecho), nunca HTML
     salvo: quem pinta é o CSS, então a cor acompanha o tema claro/escuro e não
     há nada para sanitizar. Paleta fechada, sem seletor de fonte. Os botões
     dizem só a COR — o que cada uma quer dizer é a pessoa quem decide. Os ids
     (atencao, regra, ref) ficaram os antigos: só aparecem no CSS, e trocá-los
     não mudaria nada do que está salvo, que guarda o marcador. */
  CORES_TEXTO: [
    { id:"grifo",   marca:"==", rotulo:"grifar",  cor:"var(--star)",    dica:"Grifado — ==texto==" },
    { id:"atencao", marca:"!!", rotulo:"vermelho", cor:"var(--critico)", dica:"Vermelho — !!texto!!" },
    { id:"regra",   marca:"++", rotulo:"verde",    cor:"var(--bom)",     dica:"Verde — ++texto++" },
    { id:"ref",     marca:"@@", rotulo:"azul",     cor:"var(--s1)",      dica:"Azul — @@texto@@" }
  ],
  PROXIMAS_VISIVEIS: 3,                 // revisões abertas em "Próximos 7 dias" antes do "+"

  // Classificação do erro — OPCIONAL: só é preenchida se você abrir "editar".
  CATEGORIAS_ERRO: [
    { id: "conteudo",     nome: "Faltou conteúdo",   cor: "var(--s1)" },
    { id: "interpretacao",nome: "Interpretação",     cor: "var(--s2)" },
    { id: "bobo",         nome: "Desatenção",        cor: "var(--s4)" },
    { id: "chute",        nome: "Chute",             cor: "var(--s3)" },
    { id: "acertei",      nome: "Acertei e aprendi", cor: "var(--s6)" }
  ],
  /* Atividades de revisão. O padrão é vazio ("A definir"): o card só mostra a
     atividade depois que você escolher uma. A descrição é dica (tooltip), não texto do card. */
  ATIVIDADES_REVISAO: [
    { id:"questoes",  nome:"Resolver questões",       desc:"Fazer questões novas do assunto (recordação ativa)." },
    { id:"erros",     nome:"Refazer os erros",         desc:"Refazer as questões erradas e conferir os pontos anotados." },
    { id:"flashcards",nome:"Flashcards",               desc:"Perguntas rápidas de memória, sem consultar o material." },
    { id:"simulado",  nome:"Mini-simulado",            desc:"Bloco de questões cronometrado, no ritmo da prova." },
    { id:"mapa",      nome:"Mapa mental / esquema",    desc:"Reconstruir o esquema do assunto de cabeça." },
    { id:"lei",       nome:"Leitura da lei seca",      desc:"Ler os dispositivos cobrados no assunto." },
    { id:"aula",      nome:"Rever aula ou trecho",     desc:"Rever só o ponto que ficou confuso." },
    { id:"resumo",    nome:"Reler resumo e anotações", desc:"Leitura ativa do resumo, marcando o que não lembrava." }
  ],
  ATIVIDADE_PADRAO: "",            // "A definir"

  /* Três níveis, e só. Cinco davam diferenças que ninguém consegue julgar na
     hora de registrar ("pouca" × "média"?) e produziam planos quase iguais. */
  DIFICULDADES: {
    1: { nome: "Fácil",   curto: "Fácil",   classe: "b-bom" },
    2: { nome: "Médio",   curto: "Médio",   classe: "" },
    3: { nome: "Difícil", curto: "Difícil", classe: "b-critico" }
  },
  /* o mural "Falta estudar" da aba Hoje abre com estes; o resto atrás do "+" */
  MURAL_VISIVEIS: 8
};

/* ==========================================================================
   2. UTILIDADES DE DATA (tudo em texto "AAAA-MM-DD", sem fuso horário)
   ========================================================================== */
const D = {
  iso(d){ const p = n => String(n).padStart(2,"0");
          return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate()); },
  hoje(){ return D.iso(new Date()); },
  parse(s){ const [a,m,d] = s.split("-").map(Number); return new Date(a, m-1, d); },
  soma(s, n){ const d = D.parse(s); d.setDate(d.getDate()+n); return D.iso(d); },
  dif(a, b){ return Math.round((D.parse(b) - D.parse(a)) / 86400000); },
  br(s){ const [a,m,d] = s.split("-"); return d+"/"+m; },
  brFull(s){ const [a,m,d] = s.split("-"); return d+"/"+m+"/"+a; },
  semana(s){ return ["dom","seg","ter","qua","qui","sex","sáb"][D.parse(s).getDay()]; },
  extenso(s){ return D.semana(s)+", "+D.br(s); },
  mes(s){ return ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"][Number(s.split("-")[1])-1]; }
};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const pct = (parte, total) => total > 0 ? Math.round((parte/total)*100) : null;   // sem divisão por zero
const horaDe = ts => { const d = new Date(ts); return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0"); };
const fmtCrono = seg => { const h = Math.floor(seg/3600), m = Math.floor(seg%3600/60), x = seg%60;
  const p = n => String(n).padStart(2,"0");
  return (h ? h+":" : "") + p(m) + ":" + p(x); };
const hhmm = min => { const h = Math.floor(min/60), m = min%60; return h ? (m ? h+"h"+String(m).padStart(2,"0") : h+"h") : m+"min"; };
/** Datas futuras não podem receber tempo de estudo (nem contar como concluídas). */
const ehFuturo = data => !!data && data > D.hoje();
const chaveAssunto = (disc, ass) => (disc||"").trim().toLowerCase()+"|"+(ass||"").trim().toLowerCase();
/* Uma sessão de estudo pode cobrir VÁRIOS assuntos (r.assuntos); r.assunto é
   mantido em sincronia com o primeiro só para ler backups antigos.          */
const assuntosDe = r => Array.isArray(r.assuntos) && r.assuntos.length ? r.assuntos : (r.assunto ? [r.assunto] : []);
const rotuloAssuntos = r => assuntosDe(r).join(" · ") || "(sem assunto)";
const temAssunto = (r, k) => assuntosDe(r).some(a => chaveAssunto(r.disciplina, a) === k);
/* A chave ORDENA os conteúdos antes de juntar. Sem isso, [LAI, Licitações] e
   [Licitações, LAI] — os mesmos dois conteúdos, adicionados em ordem diferente —
   eram tratados como coisas distintas, e cada sessão abria a própria fila. */
const chaveConteudos = (disc, lista) => chaveAssunto(disc,
  (lista || []).map(a => (a||"").trim()).sort((x,y) => x.localeCompare(y, "pt-BR")).join(" | "));
const chaveSessao = r => chaveConteudos(r.disciplina, assuntosDe(r));
/* tipo: "estudo" (padrão), "revisao" ou "misto" (estudo/revisão — revisei e
   também vi conteúdo novo). Revisão e misto cumprem uma revisão agendada — são
   elas que guardam o tempo e as questões, e não geram plano nenhum. */
const normalizarRegistros = lista => (lista||[]).map(r => {
  const a = assuntosDe(r);
  return Object.assign({}, r, { assuntos: a, assunto: a[0] || "", dificuldade: dificuldadeDe(r),
                                tipo: TIPOS_SESSAO[r.tipo] ? r.tipo : "estudo" });
});
/* Tipos de sessão. "misto" é uma sessão de revisão em que também entrou conteúdo
   novo: para a lógica (plano, vínculo com a revisão, horas) ele é igual a
   "revisao" — só o rótulo muda. Por isso todo teste de comportamento passa por
   ehRevisaoSessao/ehTipoRevisao, e nunca por (tipo === "revisao").          */
const TIPOS_SESSAO = {
  estudo:  { rotulo: "Estudo",           curto: "estudo",          badge: "b-estudo" },
  revisao: { rotulo: "Revisão",          curto: "revisão",         badge: "b-alerta" },
  misto:   { rotulo: "Estudo/Revisão",   curto: "estudo/revisão",  badge: "b-misto" }
};
const ehTipoRevisao = t => t === "revisao" || t === "misto";
const ehRevisaoSessao = reg => !!reg && ehTipoRevisao(reg.tipo);
const tipoDaSessao = reg => TIPOS_SESSAO[(reg && reg.tipo) || "estudo"] || TIPOS_SESSAO.estudo;
const badgeTipoSessao = reg => { const t = tipoDaSessao(reg);
  return '<span class="badge'+(t.badge ? " "+t.badge : "")+'">'+t.curto+'</span>'; };
/* Dificuldade tem TRÊS níveis: 1 = fácil, 2 = médio, 3 = difícil.
   O dado antigo vinha em cinco (e, mais antigo ainda, como "domínio", onde
   1 = inseguro … 5 = dominado). A conversão acontece UMA VEZ, na carga
   (migrarDificuldades) — traduzir a cada leitura corromperia o valor, porque
   um "2" já convertido seria reinterpretado como a escala velha.          */
const NIVEL_PADRAO = 2;                        // médio
function deCincoParaTres(n){
  const v = Number(n) || 0;
  if (v <= 0) return NIVEL_PADRAO;
  if (v <= 2) return 1;
  if (v === 3) return 2;
  return 3;
}
const tresNiveis = n => Math.min(3, Math.max(1, Number(n) || NIVEL_PADRAO));
function dificuldadeDe(x){
  if (x && x.dificuldade) return tresNiveis(x.dificuldade);
  if (x && x.dominio)     return deCincoParaTres(6 - Number(x.dominio));
  return NIVEL_PADRAO;
}
/** converte a escala de cinco níveis para três, uma única vez */
function migrarDificuldades(d){
  if (d.dificuldadesMigradas) return 0;
  let n = 0;
  const converter = x => {
    if (!x) return;
    if (x.dificuldade){ const novo = deCincoParaTres(x.dificuldade);
                        if (novo !== x.dificuldade){ x.dificuldade = novo; n++; } }
    else if (x.dominio){ x.dificuldade = deCincoParaTres(6 - Number(x.dominio)); n++; }
  };
  (d.registros || []).forEach(converter);
  (d.revisoes  || []).forEach(converter);
  d.dificuldadesMigradas = true;
  return n;
}
/* As revisões que o "Manter" fez virar suas ANTES da marca `doAutomatico`
   (ver desligarAgendaAutomatica) não guardaram de onde vieram. Pedido do
   Pedro (06/10): reconhecer pelas pistas, uma vez só. A que você criou ou
   editou passou por salvarRevisaoManual, que sempre grava `rotulo` (mesmo
   vazio); a automática nunca tem `rotulo` e sempre tem sessão dona. Ficam de
   fora as escolhidas até a prova (planoProva) e as de conteúdo com as
   automáticas desligadas — essas viraram suas por outra escolha. */
function marcarMantidasAntigas(x){
  if (x.mantidasMarcadas) return 0;
  const semAuto = new Set((x.conteudos || []).filter(c => c && c.semAutomaticas)
    .map(c => chaveAssunto(c.disciplina, c.nome)));
  let n = 0;
  (x.revisoes || []).forEach(r => {
    if (r.feita || !r.manual || r.doAutomatico || r.planoProva || "rotulo" in r || !r.registroId) return;
    const reg = (x.registros || []).find(s => s.id === r.registroId);
    if (!reg) return;
    const assuntos = Array.isArray(r.assuntos) && r.assuntos.length ? r.assuntos : assuntosDe(reg);
    if (assuntos.some(a => semAuto.has(chaveAssunto(r.disciplina || reg.disciplina, a)))) return;
    r.doAutomatico = true; n++;
  });
  x.mantidasMarcadas = true;
  return n;
}
const normalizarRevisoes = lista => (lista||[]).map(r =>
  Object.assign({}, r, { dificuldade: r.dificuldade || (r.dominio ? 6 - Number(r.dominio) : null) }));
/* TAREFAS (pedido do Pedro, 02/10): lembretes da agenda que NÃO são estudo de um
   conteúdo — "pagar a inscrição", "simulado no sábado", "aula ao vivo às 19h".
   Só lembram: o ✓ marca e pronto, sem sessão, sem tempo, sem tocar no cronograma
   nem no Progresso. Vencida e não marcada, fica atrasada até ser marcada.
   { id, titulo, data, hora ("" ou "HH:MM"), nota, feita, feitaEm, criadoEm }   */
const normalizarTarefas = lista => (lista||[])
  .filter(t => t && typeof t === "object" && t.id && /^\d{4}-\d{2}-\d{2}$/.test(t.data || ""))
  .map(t => ({ id: t.id, titulo: String(t.titulo || "").trim() || "Tarefa", data: t.data,
               hora: /^\d{2}:\d{2}$/.test(t.hora || "") ? t.hora : "", nota: String(t.nota || ""),
               feita: !!t.feita, feitaEm: t.feita ? (t.feitaEm || t.data) : "",
               criadoEm: Number(t.criadoEm) || 0 }));

/* ==========================================================================
   3. CAMADA DE DADOS (localStorage isolado em funções)
   ========================================================================== */
const CHAVE = "plataforma-estudos:v1";
const CHAVE_PROTOTIPO = "revisor-conteudos:v1";   // protótipo anterior (abas + observações)

let temStorage = true;
try { localStorage.setItem("__t","1"); localStorage.removeItem("__t"); } catch(e){ temStorage = false; }

function estadoInicial(){
  return { versao: 1, tema: "claro",
           objetivo: "",                        // "livre" · "concurso" · "vestibular"; "" = ainda não perguntei
           dataProva: "",                       // a prova do concurso ("" = data a definir)
           vestibular: { dias: [],              // { id, nome, data } — quantos dias a prova tiver
                         disciplinas: {} },     // disciplina → id do dia de prova (opcional)
           revisarAte: "",                      // teto escolhido: agendar revisões até este dia
           posProva: "",                        // "" = ainda não perguntei · "continuo" · "encerrei"
           metaDiariaMin: CONFIG.META_DIARIA_MIN,
           disciplinas: [],                     // cadastro próprio; registros só apontam para elas
           conteudos: [],                       // cadastro dos conteúdos: { id, nome, disciplina, fase, concluidoEm }
           lancamentos: [],                     // questões lançadas à parte, ligadas a um registro:
                                                // { id, registroId, data, questoes, acertos, criadoEm }
           tarefas: [],                         // lembretes soltos da agenda, sem conteúdo (ver TAREFAS)
           registros: [], revisoes: [], erros: [], cronometro: null };   // { inicio: timestamp, disciplina, assunto } enquanto roda
}

/* O OBJETIVO NASCEU DEPOIS DOS DADOS. Base sem ele é deduzida pela data: com
   prova marcada, era um concurso; sem, era o "estudo contínuo" — que é o Sem
   objetivo. Roda em toda porta de entrada (navegador, backup, nuvem, arquivo),
   senão o dado importado cairia no padrão e mudaria de modo sozinho. */
function migrarObjetivo(d){
  if (d.objetivo) return false;
  d.objetivo = d.dataProva ? "concurso" : "livre";
  return true;
}
/** Traz as observações do protótipo antigo para os Aprendizados. */
function migrarPrototipo(base){
  if (!temStorage) return 0;
  let bruto = null;
  try { bruto = localStorage.getItem(CHAVE_PROTOTIPO); } catch(e){ return 0; }
  if (!bruto) return 0;
  try {
    const velho = JSON.parse(bruto);
    if (!velho || !Array.isArray(velho.tabs)) return 0;
    let n = 0;
    velho.tabs.forEach(tab => {
      (tab.notes||[]).forEach(nota => {
        base.erros.push({
          id: uid(), disciplina: tab.name || "Importado", assunto: "Observações do protótipo",
          fonte: "", oQueErrei: "", ensinamento: nota.text || "", categoria: "conteudo",
          refeita: false, importante: !!nota.important, criadoEm: nota.createdAt || Date.now()
        });
        n++;
      });
    });
    return n;
  } catch(e){ return 0; }
}

/* Antes, "integrar" jogava a sessão num plano único da DISCIPLINA inteira, sem
   perguntar nada — por isso apareciam cards com o nome da matéria em vez de se
   juntarem ao conteúdo que já estava sendo revisado. Agora cada integração é um
   GRUPO com nome próprio, escolhido na hora de integrar. O que estava integrado
   por disciplina volta ao plano individual: as revisões pendentes daquele plano
   saem e as já feitas ficam no histórico. Devolve os ids que precisam replanejar. */
function migrarIntegracoes(base){
  const antigos = (base.registros || []).filter(r => r.plano === "disciplina");
  if (!antigos.length) return [];
  antigos.forEach(r => { r.plano = "individual"; delete r.grupoId; });
  base.revisoes = (base.revisoes || []).filter(r => !r.integrada || r.grupoId || r.feita || r.manual);
  return antigos.map(r => r.id);
}

/* DESFAZER OS GRUPOS DE REVISÃO. A integração foi criada para um problema que
   não existe mais: duas sessões do mesmo conteúdo abriam duas filas. Hoje quem
   resolve isso é a própria agenda — a escada por conteúdo, voltaEmAberto e
   resolverLembrete —, sem ninguém precisar marcar caixa nenhuma.

   Desfazer, e não só parar de oferecer: card do grupo volta para a sessão mais
   recente que ele cobria (a de contexto mais novo), e a sessão volta ao plano
   AUTOMÁTICO — nunca a "manual", que era a armadilha do sairDoGrupo antigo:
   sessão manual não recebe volta nunca mais, e desfazer a integração não pode
   deixar ninguém sem agendamento.

   O HISTÓRICO ATRAVESSA INTEIRO: revisão feita continua feita, com o tempo e as
   questões; revisão à mão continua à mão. O que é recalculado é só a pendente
   automática, porque quem replaneja (gerarRevisoes) sempre a refaz — e ela
   renasce com a data contada de hoje. Devolve os ids que precisam replanejar.

   Isto fica para sempre: backup antigo ainda traz grupos.                    */
function migrarGrupos(base){
  const revs = base.revisoes || [], regs = base.registros || [];
  const integradas = regs.filter(r => r.plano === "grupo");
  if (!(base.grupos || []).length && !integradas.length && !revs.some(r => r.grupoId)) return [];
  // o card do grupo procura dono: a sessão mais recente que estava dentro dele
  const donoDe = new Map();
  (base.grupos || []).forEach(g => {
    const dentro = regs.filter(r => r.grupoId === g.id)
                       .sort((a,b) => String(a.data).localeCompare(String(b.data)));
    if (dentro.length) donoDe.set(g.id, dentro[dentro.length - 1].id);
  });
  revs.forEach(r => {
    if (!r.grupoId) return;
    if (!r.registroId) r.registroId = donoDe.get(r.grupoId) || null;
    delete r.grupoId; delete r.integrada;
  });
  /* Card que não achou dono nenhum (grupo sem sessão) só continua se souber
     falar por si — pelo histórico ou por disciplina + conteúdos. */
  base.revisoes = revs.filter(r => r.registroId || r.feita || r.manual ||
                                   (r.disciplina && (r.assuntos || []).length));
  integradas.forEach(r => { r.plano = "individual"; delete r.grupoId; });
  base.grupos = [];
  return integradas.map(r => r.id);
}

/* MIGRAÇÃO PARA AS FASES. O que já existia passa a "em andamento" — foi a
   escolha feita: na prática, quase todo conteúdo que está no sistema ainda
   está sendo estudado. Como conteúdo aberto tem UMA volta de cada vez, as
   revisões automáticas ainda pendentes são reduzidas à mais próxima; as já
   FEITAS e as criadas À MÃO continuam intocadas.
   Devolve quantos conteúdos foram abertos, para a plataforma avisar uma vez. */
/* MIGRAÇÃO DOS CONTEÚDOS. O que era texto livre dentro de cada sessão vira
   ficha no cadastro, uma por (disciplina + nome). A fase vem de quem já estava
   lá: o conteúdo só nasce fechado se TODAS as sessões que falam dele estavam
   fechadas. Anotações e revisões avulsas também entram, para o seletor
   conhecer tudo o que já existe.                                            */
function migrarConteudos(d){
  if (!Array.isArray(d.conteudos)) d.conteudos = [];
  if (d.conteudosMigrados) return 0;
  const achar = (disc, nome) => d.conteudos.find(c => c.disciplina === disc &&
                                                      c.nome.toLowerCase() === nome.toLowerCase());
  const por = new Map();                     // disciplina|nome -> fases vistas
  const anota = (disc, nome, fase) => {
    if (!disc || !nome) return;
    const k = disc + "|" + nome.toLowerCase();
    const atual = por.get(k) || { disciplina: disc, nome, fases: [] };
    if (fase) atual.fases.push(fase);
    por.set(k, atual);
  };
  (d.registros || []).forEach(r => {
    const lista = Array.isArray(r.assuntos) && r.assuntos.length ? r.assuntos : (r.assunto ? [r.assunto] : []);
    lista.forEach(a => anota(r.disciplina, a, r.fase === "concluido" ? "concluido" : "andamento"));
  });
  (d.revisoes || []).forEach(r => (r.assuntos || []).forEach(a => anota(r.disciplina, a, null)));
  (d.erros || []).forEach(e => anota(e.disciplina, e.assunto, null));
  let criados = 0;
  por.forEach(v => {
    if (achar(v.disciplina, v.nome)) return;
    const fechado = v.fases.length > 0 && v.fases.every(f => f === "concluido");
    d.conteudos.push({ id: "c" + (Date.now().toString(36)) + criados.toString(36),
                       nome: v.nome, disciplina: v.disciplina,
                       fase: fechado ? "concluido" : "andamento",
                       concluidoEm: fechado ? (d.registros || []).map(r => r.concluidoEm).filter(Boolean).sort().pop() || null : null,
                       criadoEm: Date.now() });
    criados++;
  });
  // toda disciplina em uso também entra no cadastro próprio
  if (!Array.isArray(d.disciplinas)) d.disciplinas = [];
  [].concat(d.registros || [], d.erros || [], d.revisoes || []).forEach(x => {
    if (x.disciplina && !d.disciplinas.some(n => n.toLowerCase() === x.disciplina.toLowerCase()))
      d.disciplinas.push(x.disciplina);
  });
  d.conteudosMigrados = true;
  return criados;
}
function migrarFases(d){
  if (d.fasesMigradas) return 0;
  // só mexe em quem ainda não tem fase: quem já vem marcado é respeitado
  const abertos = new Set();
  [].concat(d.registros || [], d.grupos || []).forEach(alvo => {
    if (!alvo.fase){ alvo.fase = "andamento"; abertos.add(alvo.id); }
  });
  const pendentesDe = new Map();
  (d.revisoes || []).forEach(r => {
    const dono = r.grupoId || r.registroId;
    if (r.feita || r.manual || !dono || !abertos.has(dono)) return;
    const atual = pendentesDe.get(dono);
    if (!atual || r.data < atual.data) pendentesDe.set(dono, r);
  });
  d.revisoes = (d.revisoes || []).filter(r => {
    const dono = r.grupoId || r.registroId;
    if (r.feita || r.manual || !dono || !abertos.has(dono)) return true;
    return pendentesDe.get(dono) === r;          // do conteúdo aberto sobra só a volta mais próxima
  });
  d.revisoes.forEach(r => {
    const dono = r.grupoId || r.registroId;
    if (!r.feita && !r.manual && dono && abertos.has(dono)) r.retomada = true;
  });
  d.fasesMigradas = true;
  return abertos.size;
}
/* O PLANO "MANUAL" SAIU. Ele vinha da versão antiga: a sessão ficava sem
   agendamento automático nenhum, e o formulário atual não tinha mais como sair
   dele — um conteúdo concluído numa dessas sessões ficava sem revisão alguma.
   Hoje a revisão marcada à mão convive com a escada (e anda junto com ela),
   então o plano manual não tem mais o que proteger. As revisões manuais que já
   existem ficam intactas. */
function migrarPlanoManual(d){
  if (d.planosManuaisMigrados) return 0;
  let n = 0;
  (d.registros || []).forEach(r => { if (r.plano === "manual"){ r.plano = "individual"; n++; } });
  d.planosManuaisMigrados = true;
  return n;
}
/* PREPARAR UM DADO QUE CHEGA — do navegador, de um backup importado, do
   arquivo .json ou da nuvem. Todas as portas passam pelas MESMAS migrações, na
   mesma ordem. Antes a importação pulava metade delas: um backup antigo entrava
   sem fichas de conteúdo (e sem agenda) até o próximo F5, e aí a conversão da
   escala de dificuldade rodava sobre números já cortados — Difícil virava Médio. */
/* IDS SÓ COM LETRAS, NÚMEROS, "_" E "-" (checagem de segurança, 27/09). Os ids vão
   para atributos do HTML; um backup montado de propósito com aspas num id
   ("x\" onmouseover=…") rodaria código ao ser restaurado. O app nunca cria id
   assim (uid()), então dado de verdade passa intacto; o que tiver outro caractere
   vira "_" — a MESMA troca em todo lugar, para as ligações (registroId, diaProva,
   o mapa de dias do vestibular…) continuarem apontando para o item certo.
   Função declarada e sem nada de fora: roda na carga, antes do resto existir. */
function limparIds(d){
  const seguro = v => typeof v === "string" ? v.replace(/[^A-Za-z0-9_-]/g, "_") : v;
  const ehId = k => k === "id" || k === "diaProva" || /Id$/.test(k);
  const andar = o => {
    if (Array.isArray(o)){ o.forEach(andar); return; }
    if (!o || typeof o !== "object") return;
    Object.keys(o).forEach(k => {
      if (ehId(k)) o[k] = seguro(o[k]);
      else if (/Ids$/.test(k) && Array.isArray(o[k])) o[k] = o[k].map(seguro);   // listas de ids (juntasIds)
      else andar(o[k]);
    });
  };
  andar(d);
  const mapa = d && d.vestibular && d.vestibular.disciplinas;      // disciplina → id do dia
  if (mapa && typeof mapa === "object") Object.keys(mapa).forEach(k => { mapa[k] = seguro(mapa[k]); });
}
function prepararDados(d){
  limparIds(d);
  /* A escala da dificuldade é convertida no dado CRU: normalizarRegistros
     já limita o valor a 1..3, e converter depois disso leria um "3" novo
     (difícil) como o "3" velho (médio), rebaixando tudo. */
  migrarDificuldades(d);
  const x = Object.assign(estadoInicial(), d, {
    registros: normalizarRegistros(Array.isArray(d.registros) ? d.registros : []),
    revisoes:  normalizarRevisoes(Array.isArray(d.revisoes) ? d.revisoes : []),
    erros:     Array.isArray(d.erros)     ? d.erros     : [],
    disciplinas: Array.isArray(d.disciplinas) ? d.disciplinas : [],
    grupos:    Array.isArray(d.grupos)    ? d.grupos    : [],
    lancamentos: Array.isArray(d.lancamentos) ? d.lancamentos : [],
    tarefas:   normalizarTarefas(Array.isArray(d.tarefas) ? d.tarefas : [])
  });
  x.dificuldadesMigradas = true;
  const objetivoDeduzido = migrarObjetivo(x);
  const abertos = migrarFases(x);
  migrarPlanoManual(x);
  x.registros.forEach(ajustarBlocosAoTempo);   // tempo baixado antes de 26/09 deixava o dia com o tempo antigo
  const fichas = migrarConteudos(x);
  const mantidas = marcarMantidasAntigas(x);
  const soltos = migrarIntegracoes(x).concat(migrarGrupos(x));
  return { db: x, abertos, fichas, objetivoDeduzido, soltos, mantidas };
}
/* DADO DANIFICADO NÃO É APAGADO. Se o que está salvo não se lê, o app começa
   vazio — mas antes o texto original é copiado para uma chave à parte. Sem isso,
   a primeira gravação (que acontece logo na abertura) escrevia por cima dele e
   o que ainda dava para recuperar à mão se perdia de vez. */
const CHAVE_DANIFICADO = "plataforma-estudos:v1:danificado";
function carregar(){
  const base = estadoInicial();
  if (!temStorage) return { db: base, migrados: 0 };
  let bruto = null;
  try { bruto = localStorage.getItem(CHAVE); } catch(e){}
  if (bruto){
    try {
      const r = prepararDados(JSON.parse(bruto));
      return { db: r.db, migrados: 0, desintegrados: r.soltos, abertos: r.abertos, fichas: r.fichas,
               objetivoDeduzido: r.objetivoDeduzido, mantidas: r.mantidas, atualizadoEm: Number(r.db.atualizadoEm || 0) };
    } catch(e){
      try { localStorage.setItem(CHAVE_DANIFICADO, bruto); } catch(x){}
      return { db: base, migrados: 0, desintegrados: [], danificado: true };
    }
  }
  const migrados = migrarPrototipo(base);
  return { db: base, migrados, desintegrados: [] };
}

const inicio = carregar();
let db = inicio.db;

let tSalvar = null;
/* QUANDO O DADO DAQUI FOI MEXIDO DE VERDADE. A própria abertura grava (migração,
   agenda garantida, primeira vez) e isso mudaria db.atualizadoEm — com o
   navegador limpo, o "vazio" pareceria mais novo que o arquivo e a nuvem, e iria
   por cima deles. Até o arranque terminar vale a data de quando o dado foi lido. */
let arranqueFeito = false, mexeuDesdeAbertura = false;
/* Ligado só durante replanejarAoReligar: as datas contam do último estudo, e o
   que já passou conta como feito (ver pularPassadas). */
let contarDoUltimoEstudo = false;
const dataDoLocal = () => mexeuDesdeAbertura ? Number(db.atualizadoEm || 0) : Number(inicio.atualizadoEm || 0);
/** persistir(true) grava na hora — usado onde perder o instante importa (cronômetro). */
function persistir(agora){
  if (arranqueFeito) mexeuDesdeAbertura = true;
  if (!temStorage) return;
  clearTimeout(tSalvar);
  db.atualizadoEm = Date.now();
  const gravar = () => {
    try { localStorage.setItem(CHAVE, JSON.stringify(db)); }
    catch(e){ toast("Não foi possível salvar no navegador."); }
  };
  if (agora) gravar(); else tSalvar = setTimeout(gravar, 120);
  agendarGravacao(agora);          // e também no arquivo .json, quando ligado
  agendarSincronia(agora);         // e na nuvem, quando há conta conectada
}

/* API de dados — o resto do código nunca fala com o localStorage direto. */
const getRegistros = () => db.registros;
const getRevisoes  = () => db.revisoes;
const getErros     = () => db.erros;
const acharRegistro = id => db.registros.find(r => r.id === id);
const acharRevisao  = id => db.revisoes.find(r => r.id === id);
const acharErro     = id => db.erros.find(e => e.id === id);
const getTarefas   = () => Array.isArray(db.tarefas) ? db.tarefas : (db.tarefas = []);
const acharTarefa  = id => getTarefas().find(t => t.id === id);

/* O QUE DECIDE O PLANO de uma sessão. Só isto: o dia, os conteúdos, a
   dificuldade (que manda na cadência), o modo do plano e o tipo. Tempo,
   questões, acertos e descrição NÃO entram — mexer neles não move revisão
   nenhuma. A taxa de acerto saiu do cronograma faz tempo; é a dificuldade
   que manda. */
const planoRelevante = r => !r ? "" : JSON.stringify([
  r.data,
  assuntosDe(r).map(a => (a||"").trim().toLowerCase()).sort(),
  dificuldadeDe(r), planoDe(r), r.tipo || "estudo"
]);

/* Salvar NÃO replaneja quando nada que decide o plano mudou. Antes replanejava
   sempre: corrigir uma vírgula na descrição apagava as revisões automáticas da
   sessão e as refazia — ids novos e, quando a escada da tela não era idêntica
   à que o cálculo produz hoje, DATAS novas. Quem editou uma sessão antiga para
   arrumar o texto via o cronograma dela mudar sozinho. */
function salvarRegistro(reg){
  const i = db.registros.findIndex(r => r.id === reg.id);
  const antes = i >= 0 ? db.registros[i] : null;
  /* Replaneja quando algo que DECIDE o plano mudou — ou quando não há plano
     automático nenhum para preservar. A segunda metade importa: sessão que
     ficou sem fila (conteúdo fechado antes de existir escada, dado importado,
     item apagado à mão) volta a ter uma ao ser salva, que era o efeito bom do
     replanejamento de sempre. O que ela não faz é refazer uma fila que já
     existe só porque você corrigiu a descrição. */
  const semPlano = !db.revisoes.some(r => r.registroId === reg.id && !r.feita && !r.manual);
  const mudouPlano = planoRelevante(antes) !== planoRelevante(reg);
  /* A dificuldade de um conteúdo é a da sessão MAIS RECENTE dele — estudo ou
     revisão. Se esta sessão muda essa dificuldade (nova, ou editada), a escada
     é refeita com os passos novos: revisar e achar difícil encurta o que vem. */
  const difAntes = new Map(conteudosDoAlvo(reg).filter(c => c.fase === "concluido")
                             .map(c => [c, dificuldadeDaFicha(c)]));
  if (i >= 0) db.registros[i] = reg; else db.registros.push(reg);
  difAntes.forEach((dif, c) => { if (dificuldadeDaFicha(c) !== dif) reespacarEscada(c); });
  if (mudouPlano || semPlano) gerarRevisoes(reg);
  persistir();
  return mudouPlano || semPlano;
}
function excluirRegistro(id){
  const reg = acharRegistro(id);
  if (reg) desligarSessaoRevisao(reg);           // a revisão volta a pendente, sem sessão
  db.registros = db.registros.filter(r => r.id !== id);
  db.lancamentos = (db.lancamentos || []).filter(l => l.registroId !== id);
  /* A AGENDA É DO CONTEÚDO, NÃO DA SESSÃO. A escada de um conteúdo concluído
     (e a volta de um aberto) fica pendurada na sessão mais recente dele — mas
     excluir essa sessão não pode levar junto a escada inteira, com as revisões
     JÁ FEITAS, quando outras sessões do mesmo conteúdo continuam registradas:
     antes, recarregar a página recomeçava a escada do zero, sem histórico.
     O item passa para outra sessão que fale dos mesmos conteúdos; só sai o que
     não tem mais sessão nenhuma para chamá-lo. */
  if (reg){
    const outras = db.registros.slice().sort((a,b) => String(b.data).localeCompare(String(a.data)) ||
                                                      (b.criadoEm||0) - (a.criadoEm||0));
    db.revisoes = db.revisoes.filter(r => {
      if (r.registroId !== id) return true;
      const lista = (r.assuntos && r.assuntos.length) ? r.assuntos.slice() : assuntosDe(reg);
      const cobre = x => x.disciplina === reg.disciplina && !ehRevisaoSessao(x) &&
                         lista.every(a => temAssunto(x, chaveAssunto(reg.disciplina, a)));
      const nova = outras.find(x => cobre(x) && planoDe(x) !== "sem") || outras.find(cobre);
      if (!nova) return false;
      r.registroId = nova.id;
      if (!(r.assuntos && r.assuntos.length)) r.assuntos = lista;   // o card continua falando do mesmo
      return true;
    });
    garantirAgenda();
  }
  persistir();
}
/* Anotar não mexe em cronograma: as revisões seguem intocadas. */
/* ---------- lançamentos de questões ----------
   Bateria de questões feita fora da sessão (e fora de uma revisão), ligada ao
   registro do conteúdo. Tem data própria: conta no dia em que foi feita.      */
const acharLancamento = id => (db.lancamentos || []).find(l => l.id === id) || null;
const lancamentosDoRegistro = id => (db.lancamentos || []).filter(l => l.registroId === id);
function salvarLancamento(l){
  const i = db.lancamentos.findIndex(x => x.id === l.id);
  if (i >= 0) db.lancamentos[i] = l; else db.lancamentos.push(l);
  persistir();
}
function excluirLancamento(id){
  db.lancamentos = db.lancamentos.filter(l => l.id !== id);
  persistir();
}

function salvarErro(err){
  const i = db.erros.findIndex(e => e.id === err.id);
  if (i >= 0) db.erros[i] = err; else db.erros.push(err);
  persistir();
}
function excluirErro(id){
  db.erros = db.erros.filter(x => x.id !== id);
  persistir();
}

/* ==========================================================================
   4. AGENDAMENTO DE REVISÕES (repetição espaçada comprimida até a prova)
   --------------------------------------------------------------------------
   Metodologias aplicadas:
   · Curva do esquecimento (Ebbinghaus) → primeira revisão cedo.
   · Repetição espaçada → intervalos crescentes dentro do tempo que resta.
   · Sistema Leitner → domínio baixo / taxa ruim = mais revisões,
     começando antes. Sem dificuldade = menos revisões, mais espaçadas.
   · Trava dura: nenhuma revisão cai na data da prova ou depois.
   ========================================================================== */
/* O OBJETIVO DE ESTUDO. Três modos, escolhidos no "?" do topo:
   "livre"      → estudo contínuo: sem contagem e sem prazo;
   "concurso"   → uma prova, em db.dataProva (vazia = "data a definir");
   "vestibular" → um ou mais dias de prova (ENEM, vestibulares), cada um com
                  nome e data, em db.vestibular.dias.
   A configuração de cada modo fica guardada à parte: trocar de modo muda só
   db.objetivo, e voltar ao modo anterior encontra tudo como estava.         */
const OBJETIVOS = [
  { id:"livre",      nome:"Estudo contínuo",   desc:"Revisões em intervalos crescentes, sem data de prova." },
  { id:"concurso",   nome:"Concurso",          desc:"Uma prova: o cronograma se ajusta até a véspera." },
  { id:"vestibular", nome:"Vestibular / ENEM", desc:"Um ou mais dias de prova, cada um com nome e data." }
];
const objetivo = () => OBJETIVOS.some(o => o.id === db.objetivo) ? db.objetivo : "livre";
const nomeObjetivo = () => OBJETIVOS.find(o => o.id === objetivo()).nome;
/** a configuração do vestibular, sempre com a forma certa */
function vestibular(){
  if (!db.vestibular || typeof db.vestibular !== "object") db.vestibular = {};
  const v = db.vestibular;
  if (!Array.isArray(v.dias)) v.dias = [];
  if (!v.disciplinas || typeof v.disciplinas !== "object") v.disciplinas = {};
  return v;
}
/** os dias de prova do modo em uso, em ordem de data: [{ id, nome, data }] */
function diasDeProva(){
  if (objetivo() === "concurso")
    return db.dataProva ? [{ id:"concurso", nome:"a prova", data: db.dataProva }] : [];
  if (objetivo() === "vestibular")
    return vestibular().dias.filter(d => d && d.data).slice().sort((a,b) => a.data.localeCompare(b.data));
  return [];
}
/** o último dia de prova ("" quando não há) — é ele que encerra o ciclo */
const ultimaProva = () => { const l = diasDeProva(); return l.length ? l[l.length-1].data : ""; };
/** o próximo dia de prova, contando hoje; null quando todos já passaram */
const proximaProva = () => diasDeProva().find(d => d.data >= D.hoje()) || null;
/** este dia é dia de prova? (nada é agendado nele) */
const diaDeProva = data => diasDeProva().some(d => d.data === data);
/** a data, empurrada para o dia seguinte enquanto cair num dia de prova */
function foraDaProva(data){
  let d = data;
  while (diaDeProva(d)) d = D.soma(d, 1);
  return d;
}
/** como chamar um dia de prova nos textos: o nome dado a ele, ou "a prova" */
const nomeDoDia = d => (d && d.nome || "").trim() || "a prova";

/* Sem data de prova a plataforma vira "estudo contínuo": nada de contagem
   regressiva e nada de comprimir o cronograma — as revisões usam os intervalos
   clássicos e o horizonte anda junto com hoje. Vale para "estudo contínuo" e para
   concurso ou vestibular com a data ainda a definir. */
const semProva = () => !ultimaProva();
/** a prova ainda está à frente? (depois dela o cronograma muda de regra) */
const provaFutura = () => !!ultimaProva() && ultimaProva() > D.hoje();
/** O agendamento AUTOMÁTICO está de pé? Para em dois casos, os dois escolhidos
    por você: "encerrei" depois da prova, ou a chave "Criar os agendamentos
    automaticamente" desligada nos ajustes — quem tem a própria rotina marca as
    datas à mão, e o sistema não cria, não empurra e não refaz nada. Passada a
    prova, a pergunta "e depois?" não segura nada (decisão do Pedro, 23/09). */
const agendaAutomatica = () => db.agendaAutomatica !== false;
const agendamentoAtivo = () => db.posProva !== "encerrei" && agendaAutomatica();
/* O QUE O AUTOMÁTICO CRIA (pedido do Pedro, 07/10): as revisões (escada do
   concluído), os cards de continuar (em andamento) ou os dois. `automaticoTipos`
   ausente = os dois. O tipo que fica de fora se comporta como o automático
   desligado: não nasce, não anda, não é refeito — só o que você marcar. */
const TIPOS_AUTO = ["revisoes", "continuar"];
const tiposDaEscolha = t => t === "revisoes" || t === "continuar" ? [t] : TIPOS_AUTO.slice();
const tiposAutomaticos = () => tiposDaEscolha(db.automaticoTipos);
const tipoDoItem = r => ehRetomada(r) ? "continuar" : "revisoes";
const fraseTiposAuto = () => ({ revisoes: "só as revisões", continuar: "só os cards de continuar" })[db.automaticoTipos]
                             || "as revisões e os cards de continuar";
const autoRevisoes = () => agendamentoAtivo() && tiposAutomaticos().includes("revisoes");
const autoContinuar = () => agendamentoAtivo() && tiposAutomaticos().includes("continuar");
/* A MESMA CHAVE, NUM CONTEÚDO SÓ (pedido do Pedro, 03/10). Conteúdo concluído pode
   ter as revisões automáticas desligadas na janela "✎ editar": a escada dele não
   nasce, não é empurrada e não é refeita — fica só o que você marcar. É a exceção
   escolhida à garantia de revisão. Vale só para concluído (o em andamento sempre
   tem o card de continuar) e reabrir o conteúdo religa (marcarConteudos). */
const escadaAtiva = f => autoRevisoes() && !(f && f.semAutomaticas);
/* RELIGAR A PARTIR DE UM DIA (pedido do Pedro, 05/10). Ao religar as automáticas
   de um conteúdo, a pessoa diz a partir de quando a escada volta: nenhuma revisão
   automática dele nasce antes desse dia. A escada volta do degrau em que parou.
   Passado o dia, a regra não segura mais nada. */
const inicioDasAutomaticas = f => f && typeof f.automaticasDesde === "string" && f.automaticasDesde > D.hoje() ? f.automaticasDesde : "";
/* ATÉ QUANDO O SISTEMA AGENDA: o teto que você escolheu ("revisar até") ou,
   sem ele, o horizonte livre, que anda junto com hoje. A PROVA NÃO É TETO: as
   revisões seguem depois dela — só o dia da prova é pulado (foraDaProva).
   O "revisar até" não tem limite (decisão do Pedro, 23/09: saiu o teto de um
   ano). A escada termina sozinha no último degrau, então nada cresce sem fim. */
function ultimoDiaRevisao(){
  return db.revisarAte || D.soma(D.hoje(), CONFIG.HORIZONTE_LIVRE);
}
/** dias até a próxima prova; negativo = desde a última; null = sem prova */
function diasParaProva(){
  if (semProva()) return null;
  const prox = proximaProva();
  return D.dif(D.hoje(), prox ? prox.data : ultimaProva());
}

/* CONTEÚDO LIGADO A UM DIA DE PROVA (vestibular com mais de um dia). É uma
   ajuda, nunca uma obrigação: o que não tem ligação segue até a véspera do
   último dia, como sempre. O conteúdo ligado recebe revisões e retomadas até a
   véspera do SEU dia; depois dele fica em silêncio até o último dia de prova —
   a prova dele já passou, e a agenda abre espaço para o que ainda vem.
   A ligação é da disciplina (vale para todos os conteúdos dela, inclusive os
   criados depois), e o conteúdo pode ter a sua própria, que manda:
     ficha.diaProva  ausente/"" = segue a disciplina · "-" = nenhum dia · id do dia
   Só vale no modo vestibular com dois dias ou mais: com um dia só, a janela de
   silêncio seria vazia. Fora disso as ligações ficam guardadas, sem efeito. */
const ligacoesAtivas = () => objetivo() === "vestibular" && diasDeProva().length > 1;
const acharDiaProva = id => vestibular().dias.find(d => d.id === id && d.data) || null;
/* A ESTRELA DAS ANOTAÇÕES diz "Importante" em todos os modos (decisão do
   Pedro, 23/09): "véspera" só fazia sentido com prova marcada, e um rótulo que
   muda com o modo confunde. O dado continua sendo e.importante. */
const ESTRELA = () => ({ filtro:"★ só as importantes", tile:"★ Importantes", titulo:"Anotações importantes",
  tirar:"Marcada como importante — clique para tirar", marcar:"Marcar como importante",
  campo:"Importante", opcao:"★ Importante" });
/** o dia de prova da disciplina (null = nenhum) */
const diaDaDisciplina = disc => acharDiaProva(vestibular().disciplinas[disc] || "");
/** o dia de prova a que a ficha pertence, já resolvida a herança */
function diaDoConteudo(ficha){
  if (!ficha || !ligacoesAtivas()) return null;
  if (ficha.diaProva === "-") return null;
  if (ficha.diaProva) return acharDiaProva(ficha.diaProva);
  return diaDaDisciplina(ficha.disciplina);
}
/** a ficha está em silêncio NESTE dia? (do dia dela até o último dia de prova) */
function conteudoEmSilencio(ficha, data){
  const dia = diaDoConteudo(ficha);
  if (!dia) return false;
  const quando = data || D.hoje();
  return quando >= dia.data && quando <= ultimaProva();
}
/** as fichas de que um item da agenda fala */
function fichasDaRevisao(rev){
  const ctx = contextoRevisao(rev);
  if (!ctx) return [];
  return (ctx.assuntos || []).map(a => acharConteudo(ctx.disciplina, a)).filter(Boolean);
}
/* Um item só silencia quando TODOS os conteúdos dele estão em silêncio: se um
   ainda tem prova pela frente, o item continua valendo por ele. Feitos nunca
   somem — são história. O item marcado depois do último dia também aparece:
   ele já é do "depois". */
function itemEmSilencio(rev){
  if (!rev || rev.feita || !ligacoesAtivas()) return false;
  if (rev.data > ultimaProva()) return false;
  const fichas = fichasDaRevisao(rev);
  return fichas.length > 0 && fichas.every(f => conteudoEmSilencio(f));
}
/* ATÉ QUANDO UMA SESSÃO AGENDA. Antes era a véspera do dia de prova do
   conteúdo; agora a prova não corta mais o plano, então vale o limite geral
   para todos. A ligação com o dia de prova continua servindo ao SILÊNCIO:
   enquanto os dias de prova correm, o que já foi cobrado não aparece. */
function limiteDe(alvo){
  return ultimoDiaRevisao();
}
/** todos os conteúdos da sessão estão em silêncio hoje (vestibular, entre o dia
    deles e o último)? Nada é refeito nela até lá — nem criado, nem apagado. */
const sessaoEmSilencio = reg => ligacoesAtivas() && provaFutura() &&
  conteudosDoAlvo(reg).length > 0 && conteudosDoAlvo(reg).every(f => conteudoEmSilencio(f));

/** Estatísticas consolidadas de um assunto (registros + revisões feitas + aprendizados). */
function estatAssunto(disciplina, assunto){
  const k = chaveAssunto(disciplina, assunto);
  let questoes = 0, acertos = 0, minutos = 0;
  db.registros.forEach(r => {
    if (!temAssunto(r, k)) return;
    const n = assuntosDe(r).length || 1;   // a sessão cobriu N assuntos: divide o crédito
    questoes += (r.questoes || 0)/n; acertos += (r.acertos || 0)/n; minutos += (r.minutos || 0)/n;
    lancamentosDoRegistro(r.id).forEach(l => {          // questões lançadas depois, à parte
      questoes += (l.questoes || 0)/n; acertos += (l.acertos || 0)/n;
    });
    db.revisoes.forEach(rev => {
      if (rev.registroId !== r.id) return;
      if (rev.feita){ questoes += (rev.questoes || 0)/n; acertos += (rev.acertos || 0)/n; }
      minutos += (rev.minutos || 0)/n;            // tempo conta mesmo se a revisão ainda não foi concluída
    });
  });
  // revisões avulsas (sem sessão) que citam este assunto
  db.revisoes.forEach(rev => {
    if (rev.registroId || !rev.disciplina) return;
    const lista = rev.assuntos || [];
    if (!lista.some(a => chaveAssunto(rev.disciplina, a) === k)) return;
    const n = lista.length || 1;
    if (rev.feita){ questoes += (rev.questoes || 0)/n; acertos += (rev.acertos || 0)/n; }
    minutos += (rev.minutos || 0)/n;
  });
  // a taxa sai dos valores exatos (antes de arredondar), senão o rateio distorce a porcentagem
  const taxaExata = pct(acertos, questoes);
  questoes = Math.round(questoes); acertos = Math.round(acertos); minutos = Math.round(minutos);
  const errosAssunto = db.erros.filter(e => chaveAssunto(e.disciplina, e.assunto) === k);
  return {
    questoes, acertos, minutos, taxa: taxaExata,
    erros: errosAssunto.length,
    errosBobos: errosAssunto.filter(e => e.categoria === "bobo").length,
    refeitas: errosAssunto.filter(e => e.refeita).length
  };
}

/* OS DEGRAUS DA ESCADA, em dias contados do fechamento (o degrau 0 é o próprio
   dia em que você fechou). A dificuldade decide duas coisas: o tamanho da
   escada (um assunto tranquilo não precisa de 9 revisões) e o passo (o fácil
   espera mais, o difícil volta mais cedo — Sistema Leitner).
   Médio: 1, 3, 7, 16, 35, 70, 140 · Fácil: 2, 5, 11, 24, 53, 105 ·
   Difícil: 1, 2, 5, 11, 25, 49, 98, 168, 256.                              */
function degrausDa(dificuldade){
  const fator = CONFIG.FATOR_DIFICULDADE[dificuldade] ?? 1;
  const n = Math.min(CONFIG.MAX_REVISOES,
                     (CONFIG.REVISOES_POR_DIFICULDADE[dificuldade] ?? 3) + CONFIG.FOLGA_POR_DIFICULDADE);
  const lista = [0];
  CONFIG.INTERVALOS_LIVRES.slice(0, n).forEach(d =>
    lista.push(Math.max(lista[lista.length - 1] + 1, Math.round(d * fator))));
  return lista;
}
/* O CRONOGRAMA ESCOLHIDO (pedido do Pedro, 06/10). Ao concluir, a pessoa vê a
   escada inteira e escolhe quantas revisões e quantos dias cada uma espera depois
   da anterior. Guardado na ficha só quando difere da sugestão:
   ficha.escada = [1, 2, 4, 9, …]  → dias depois da anterior (a 1ª, depois da conclusão).
   Com ele, a dificuldade não estica nem encurta mais a escada desse conteúdo; o
   resto vale igual (atraso e revisão extra empurram, mantendo as distâncias). */
const MAX_ESCOLHA = 20;
const escadaValida = l => Array.isArray(l) && l.length >= 1 && l.length <= MAX_ESCOLHA &&
                          l.every(n => Number.isInteger(n) && n >= 1 && n <= 999);
const passosDe = degraus => degraus.slice(1).map((d, i) => d - degraus[i]);
/** os passos que a dificuldade sugere para o conteúdo */
const passosSugeridos = ficha => passosDe(degrausDa(dificuldadeDaFicha(ficha)));
/** os degraus que valem para o conteúdo: os escolhidos ou os da dificuldade */
function degrausDaFicha(ficha){
  if (!ficha || !escadaValida(ficha.escada)) return degrausDa(dificuldadeDaFicha(ficha));
  const lista = [0];
  ficha.escada.forEach(p => lista.push(lista[lista.length - 1] + p));
  return lista;
}
/** guarda os passos escolhidos; iguais à sugestão, a ficha volta a seguir a dificuldade */
function definirEscada(ficha, passos){
  if (!ficha || !escadaValida(passos)) return;
  const sug = passosSugeridos(ficha);
  if (passos.length === sug.length && passos.every((p, i) => p === sug[i])) delete ficha.escada;
  else ficha.escada = passos.slice();
}
/** o degrau mais perto de uma distância (em dias) do fechamento; no empate, o de cima */
function degrauMaisPerto(degraus, dias){
  let k = 0;
  degraus.forEach((d, i) => { if (Math.abs(d - dias) <= Math.abs(degraus[k] - dias)) k = i; });
  return k;
}

/* ---------- vínculo entre a revisão (agenda) e a sessão (o que aconteceu) ----------
   Uma revisão vale por uma sessão só; a sessão guarda tempo, questões e tudo
   mais. A revisão fica com a data planejada e, quando remarcada, lembra de onde
   veio para a tela avisar que houve atraso.                                   */
const sessaoDaRevisao = rev => rev && rev.sessaoId ? acharRegistro(rev.sessaoId) : null;
const revisaoDaSessao = reg => reg && reg.revisaoId ? acharRevisao(reg.revisaoId) : null;
/** minutos e questões de uma revisão vêm da sessão que a cumpriu */
function numerosDaRevisao(rev){
  const s = sessaoDaRevisao(rev);
  return s ? { minutos: s.minutos || 0, questoes: s.questoes || 0, acertos: s.acertos || 0 }
           : { minutos: 0, questoes: 0, acertos: 0 };
}
/** liga a sessão à revisão e marca a caixa; nada de replanejar nada */
function ligarSessaoRevisao(reg, rev){
  if (!reg || !rev) return;
  desligarSessaoRevisao(reg);                       // a sessão só aponta para uma revisão
  const antiga = sessaoDaRevisao(rev);
  if (antiga && antiga.id !== reg.id) desligarSessaoRevisao(antiga);
  reg.revisaoId = rev.id;
  rev.sessaoId = reg.id;
  rev.feita = true;
  rev.feitaEm = reg.data;
}
/** desfaz o vínculo; a sessão e as horas dela continuam intactas */
function desligarSessaoRevisao(reg){
  soltarJuntas(reg);
  const rev = revisaoDaSessao(reg);
  delete reg.revisaoId;
  if (!rev) return;
  delete rev.sessaoId;
  rev.feita = false; rev.feitaEm = null;
}
/* SESSÃO COM VÁRIOS CONTEÚDOS (pedido do Pedro, 28/09). Estudar A e B juntos
   cumpre o item vencido de CADA um: o principal fica em reg.revisaoId e os
   outros em reg.juntasIds. Cada item continua apontando para uma sessão só
   (sessaoId), e o tempo continua morando nela — conta uma vez só. Antes a
   sessão cumpria só o item de A, e o de B ficava em aberto na agenda. */
const juntasDaSessao = reg =>
  (reg && Array.isArray(reg.juntasIds) ? reg.juntasIds : []).map(acharRevisao).filter(Boolean);
/** todos os itens que a sessão cumpre: o principal e os que foram junto */
function revisoesDaSessao(reg){
  const p = revisaoDaSessao(reg);
  return (p ? [p] : []).concat(juntasDaSessao(reg));
}
/* A JUNÇÃO É SÓ DESTA SESSÃO (pedido do Pedro, 02/10). Estudar A e B juntos
   cumpre os dois cards hoje, mas o próximo agendamento volta a ser um card de
   A e outro de B — não um "A · B". O grupo de um conteúdo é o card da sessão
   que o trouxe (o principal é 0, os juntos 1, 2…; card que já era "X · Y"
   continua junto); conteúdo posto à mão fica com o principal. Sessão sem
   cards juntos: tudo no grupo 0, como sempre. */
function grupoNaSessao(reg, assunto){
  const juntas = juntasDaSessao(reg);
  if (!juntas.length) return 0;
  const a = String(assunto).toLowerCase();
  const i = juntas.findIndex(r => ((contextoRevisao(r) || {}).assuntos || []).some(x => x.toLowerCase() === a));
  const doPrincipal = (((revisaoDaSessao(reg) && contextoRevisao(revisaoDaSessao(reg))) || {}).assuntos || [])
    .some(x => x.toLowerCase() === a);
  return doPrincipal || i < 0 ? 0 : i + 1;
}
/* CARD SEPARADO À MÃO (pedido do Pedro, 04/10). Cards juntados antes da
   correção de 02/10 ("A · B") se refaziam juntos: a sessão dona punha os dois
   no mesmo grupo. O botão "Separar" da janela do card grava em reg.separados
   (nomes em minúsculas) os conteúdos que, nessa sessão, ficam cada um no seu
   card — um grupo próprio para cada, que juntarIrmas e separarPorCard
   respeitam. O grupoNaSessao continua dizendo só quem foi o card principal. */
function grupoDoCard(reg, assunto){
  const i = (reg && Array.isArray(reg.separados) ? reg.separados : []).indexOf(String(assunto).toLowerCase());
  return i < 0 ? grupoNaSessao(reg, assunto) : 1000 + i;
}
/** separa os conteúdos pelos cards de onde vieram (ver grupoNaSessao e grupoDoCard) */
function separarPorCard(reg, conteudos){
  const grupos = new Map();
  conteudos.forEach(c => { const g = grupoDoCard(reg, c);
                           if (!grupos.has(g)) grupos.set(g, []); grupos.get(g).push(c); });
  return [...grupos.keys()].sort((x, y) => x - y).map(g => grupos.get(g));
}
/** solta os itens que foram junto (o principal fica); a sessão e as horas continuam */
function soltarJuntas(reg){
  if (!reg) return;
  juntasDaSessao(reg).forEach(rev => {
    if (rev.sessaoId !== reg.id) return;
    delete rev.sessaoId; rev.feita = false; rev.feitaEm = null;
  });
  delete reg.juntasIds;
}
/** um item está saindo: a sessão que o cumpria perde só o vínculo com ele */
function esquecerRevisaoNaSessao(reg, revId){
  if (!reg) return;
  if (reg.revisaoId === revId) delete reg.revisaoId;
  if (Array.isArray(reg.juntasIds)){
    reg.juntasIds = reg.juntasIds.filter(id => id !== revId);
    if (!reg.juntasIds.length) delete reg.juntasIds;
  }
}
/** Com o item principal ligado, cumpre também o item vencido de cada OUTRO
    conteúdo da sessão (o mais antigo, um por conteúdo — a mesma regra do
    resolverLembrete). `escolhidos` são os cards que você marcou em "Estudar
    junto": esses entram mesmo sendo do MESMO conteúdo do principal (o card
    duplicado), que a regra automática deixaria de fora — a escada de um
    conteúdo continua sendo cumprida um degrau por sessão, não de uma vez.
    Devolve quantos entraram agora e não estavam antes. */
function cumprirJuntas(reg, antes, escolhidos){
  const jaEstavam = new Set(antes || reg.juntasIds || []);
  const pedidos = new Set(escolhidos || []);
  soltarJuntas(reg);
  const principal = revisaoDaSessao(reg);
  if (!principal) return 0;
  const coberto = new Set(((contextoRevisao(principal) || {}).assuntos || []).map(a => a.toLowerCase()));
  const novas = [];
  db.revisoes.filter(r => !r.feita && !r.sessaoId && r.data <= reg.data && !bloqueadaPelaProva(r))
    .sort(porData).forEach(r => {
      const ctx = contextoRevisao(r);
      if (!ctx || ctx.disciplina !== reg.disciplina || !(ctx.assuntos || []).length) return;
      if (!ctx.assuntos.every(a => temAssunto(reg, chaveAssunto(ctx.disciplina, a)))) return;
      // esse conteúdo já foi cumprido — só entra se você marcou este card
      if (!pedidos.has(r.id) && ctx.assuntos.every(a => coberto.has(a.toLowerCase()))) return;
      ctx.assuntos.forEach(a => coberto.add(a.toLowerCase()));
      r.sessaoId = reg.id; r.feita = true; r.feitaEm = reg.data;
      novas.push(r.id);
    });
  if (novas.length) reg.juntasIds = novas;
  return novas.filter(id => !jaEstavam.has(id)).length;
}
/* TIRAR DE "ESTUDAR JUNTO" SÓ DESFAZ HOJE (pedido do Pedro, 02/10). Na sessão
   de hoje, desmarcar a caixa desfaz o check do card (cumprirJuntas já não o
   inclui). Em sessão de ontem para trás, o que já foi cumprido fica cumprido:
   só o nome do conteúdo sai da sessão. `antes` = id → feitaEm dos cards que a
   sessão cumpria antes de salvar. */
function manterJuntasDoPassado(reg, antes){
  if (!reg || !antes || !antes.size || !(reg.data < D.hoje()) || !revisaoDaSessao(reg)) return;
  const juntas = Array.isArray(reg.juntasIds) ? reg.juntasIds.slice() : [];
  antes.forEach((feitaEm, id) => {
    const r = acharRevisao(id);
    if (!r || juntas.includes(id) || r.id === reg.revisaoId) return;
    if (r.sessaoId && r.sessaoId !== reg.id) return;       // outra sessão já o cumpre
    r.sessaoId = reg.id; r.feita = true; r.feitaEm = feitaEm || reg.data;
    juntas.push(id);
  });
  if (juntas.length) reg.juntasIds = juntas;
}
/** o card fala de mais de um conteúdo e ainda está por fazer: dá para separar */
const podeSeparar = rev => !!rev && !rev.feita && ((contextoRevisao(rev) || {}).assuntos || []).length > 1;
/** Separa o card em um por conteúdo — e, com ele, os outros cards pendentes
    com os mesmos conteúdos (a escada "A · B" inteira). Cada pedaço fica com
    a data, o degrau, o passo e o tipo do original. A sessão dona guarda a
    separação (reg.separados), para os próximos não nascerem juntos de novo.
    Devolve quantos cards foram separados. */
function separarCard(rev){
  if (!podeSeparar(rev)) return 0;
  const k = chaveCard(rev);
  let n = 0;
  db.revisoes.filter(r => !r.feita && chaveCard(r) === k).forEach(r => {
    const lista = contextoRevisao(r).assuntos.slice();
    const reg = r.registroId ? acharRegistro(r.registroId) : null;
    if (reg){
      const sep = new Set(reg.separados || []);
      lista.forEach(a => sep.add(a.toLowerCase()));
      reg.separados = [...sep];
    }
    r.assuntos = [lista[0]];
    lista.slice(1).forEach(a => db.revisoes.push(Object.assign({}, r, { id: uid(), assuntos: [a] })));
    n++;
  });
  return n;
}
/** "junto com B": o item foi cumprido por uma sessão que cumpriu outros também */
function juntoCom(rev){
  const s = sessaoDaRevisao(rev);
  if (!s) return "";
  const meu = (contextoRevisao(rev) || {}).rotulo || "";
  const outros = [];
  revisoesDaSessao(s).filter(r => r.id !== rev.id).forEach(r => {
    const rot = (contextoRevisao(r) || {}).rotulo;
    if (!rot) return;
    // card duplicado: o rótulo sozinho se repetiria ("junto com A" no card A) — a data distingue
    const txt = rot === meu ? rot + " de " + D.br(r.data) : rot;
    if (!outros.includes(txt)) outros.push(txt);
  });
  return outros.length ? "junto com " + outros.join(", ") : "";
}
/** a data que o "remarcar" já traz: a atrasada vem para hoje; a de hoje, para amanhã */
const sugestaoRemarcar = data => data < D.hoje() ? D.hoje() : D.soma(D.hoje(), 1);
/** remarca uma revisão (atrasada ou de hoje), guardando a data em que ela estava marcada */
function remarcarRevisao(rev, data){
  if (!rev || !data) return;
  if (!rev.dataOriginal) rev.dataOriginal = rev.data;
  remanejarItem(rev, data);
  persistir();
}
/* REMANEJAR UM ITEM (remarcar, ou editar a data). Dia cheio, a revisão vai para
   o dia seguinte — e as revisões do mesmo conteúdo que vinham DEPOIS dela andam
   junto, cada uma mantendo a distância que tinha da anterior. "Depois" é pela
   data de ANTES: a que estava atrás continua atrás, mesmo que a remanejada
   passe por cima dela (sem isto a ordem invertia). Nada anda para trás: puxar
   uma revisão para mais cedo não adianta as seguintes. As distâncias são lidas
   (fixarPassos) antes de mexer na data. A retomada não tem seguintes: é uma de
   cada vez, e a próxima nasce quando esta for cumprida. */
function remanejarItem(rev, nova){
  const antiga = rev.data;
  const fichas = ehRetomada(rev) || rev.feita ? []
               : fichasDaRevisao(rev).filter(f => f.fase === "concluido" && !f.semAutomaticas);
  fichas.forEach(f => fixarPassos(f));
  rev.data = nova;
  if (!autoRevisoes() || nova <= antiga) return;
  fichas.forEach(f => {
    let ant = nova;
    itensDaFicha(f).filter(r => !r.feita && r.id !== rev.id && !r.planoProva && r.data >= antiga).sort(porData).forEach(r => {
      const passo = Number.isInteger(r.passo) ? r.passo : 1;
      const alvo = foraDaProva(D.soma(ant, passo));
      if (alvo > r.data) r.data = alvo;
      ant = r.data;
    });
  });
}

/* A INTEGRAÇÃO FOI APOSENTADA. Ela existia para um problema que a agenda passou
   a resolver sozinha: duas sessões do mesmo conteúdo abriam duas filas. Hoje
   a escada por conteúdo, voltaEmAberto e resolverLembrete cuidam disso sem ninguém
   marcar caixa nenhuma. O que sobrou dela é a migração migrarGrupos(), que
   desfaz grupos de backups antigos. */
