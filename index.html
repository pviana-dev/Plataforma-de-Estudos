<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plataforma de Estudos</title>
<!-- o ícone da aba é a mesma marca do cabeçalho: o livro aberto, branco no bloco verde.
     EM ARQUIVOS, NÃO EMBUTIDO (26/09, com o PWA): embutido (data URI) o Safari não mostrava o ícone.
     SVG nítido em qualquer tamanho; PNG para as versões que não usam SVG; o do iPhone/iPad ao
     "Adicionar à Tela de Início" tem o fundo inteiro (o próprio iPhone arredonda os cantos). -->
<link rel="icon" type="image/svg+xml" href="icones/icone.svg">
<link rel="icon" type="image/png" sizes="64x64" href="icones/icone-64.png">
<link rel="apple-touch-icon" href="icones/apple-touch-icon.png">
<!-- PWA: instalar como app (nome "Estudos" embaixo do ícone), janela própria e abrir sem internet (sw.js) -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f2f1ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudos">
<style>
/* ============================================================
   PALETA — cores tranquilas para foco (bege quente + verde-sálvia).
   As cores de gráfico (--s1..--s6, --seq1..4, status) vêm de uma
   paleta validada para daltonismo e contraste nas duas superfícies.
   ============================================================ */
:root{
  color-scheme:light;
  /* superfícies secundárias: mesma família areia do papel, com mais corpo —
     #eceae2 dava só 1,07:1 contra o fundo e era lido como "apagado". */
  --bg:#f2f1ec; --surface:#fbfaf7; --surface-2:#e9e5d9; --surface-3:#ded9c9;
  /* campos das telas de criação/edição: papel em que se escreve, com aro visível.
     Antes o campo era do tom do fundo (1,08:1) com aro de 1,33:1 — parecia travado. */
  --campo-fundo:#fdfcfa; --campo-borda:#9e9a8b;
  /* superfície do chrome ativo: o mesmo verde claro do resto da identidade */
  --chrome:var(--accent-soft); --chrome-borda:var(--accent);
  --border:#dedbd2; --text:#333a3c; --text-2:#4f585b; --muted:#5f676a;   /* muted: 5,5:1 no fundo e 4,7:1 nos cards verdes (era #7d8589, 3,0–3,6:1) */
  --accent:#5f8a7d; --accent-ink:#3f6c5f; --accent-soft:#e3ece8; --filtro-fundo:#eef3f0; --filtro-borda:#d3e1da; --accent-forte:#53786d;
  --star:#b8912f; --danger:#b0706a;
  /* séries categóricas (ordem fixa, nunca cíclica) */
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300;
  /* rampa do calendário (quanto se estudou no dia), clara -> forte.
     Verde da identidade e clara o bastante para o número do dia continuar
     legível por cima: o azul escuro que havia aqui dava 1,75:1. */
  --seq0:var(--surface); --seq1:#e1eae7; --seq2:#cbdcd7; --seq3:#b1cdc5; --seq4:#93bdb1;
  --cal-fundo:#eeebe1;                  /* painel discreto atrás do calendário */
  /* status (reservados, nunca usados como série) */
  --bom:#0ca30c; --alerta:#fab219; --serio:#ec835a; --critico:#d03b3b;
  /* fundos suaves dos status — o mesmo tom, só que respirável atrás de texto */
  --bom-soft:#e3f3e3; --alerta-soft:#fdf2da; --critico-soft:#fbe9e8; --star-soft:#f6efdc;
  --bom-ink:#0a7a0a; --alerta-ink:#8a6410; --critico-ink:#9c2f2f; --star-ink:#846315;
  --foco:rgba(95,138,125,.30);            /* anel de foco */
  --brilho:rgba(95,138,125,.30);          /* sombra dos elementos preenchidos */
  --brilho-critico:rgba(208,59,59,.30);
  --grade:#e1e0d9; --eixo:#c3c2b7;
  --radius:11px;
  --shadow:0 1px 2px rgba(60,60,50,.05), 0 4px 16px rgba(60,60,50,.04);
}
html[data-tema="escuro"]{
  color-scheme:dark;
  --bg:#1c2123; --surface:#242a2c; --surface-2:#333b3d; --surface-3:#414a4c;
  --campo-fundo:#2a3133; --campo-borda:#616b6d;
  --chrome:var(--accent-soft); --chrome-borda:var(--accent);
  --border:#394143; --text:#dde2e0; --text-2:#b6bfbe; --muted:#9ba5a6;
  --accent:#7fae9f; --accent-ink:#9cc4b7; --accent-soft:#2b3a36; --filtro-fundo:#2a3533; --filtro-borda:#3d4b47; --accent-forte:#7fae9f;
  --star:#cfae5c; --danger:#c68983;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300;
  --seq0:var(--surface); --seq1:#24332e; --seq2:#2f463f; --seq3:#3a5950; --seq4:#466d61;
  --cal-fundo:#1e2426;
  --bom-soft:#1e3324; --alerta-soft:#3a3320; --critico-soft:#3a2626; --star-soft:#352f1f;
  --bom-ink:#7fd67f; --alerta-ink:#e3bd6a; --critico-ink:#e79b9b; --star-ink:#cfae5c;
  --foco:rgba(127,174,159,.34);
  --brilho:rgba(0,0,0,.28); --brilho-critico:rgba(0,0,0,.3);
  --grade:#2f3739; --eixo:#454e50;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 4px 16px rgba(0,0,0,.15);
}
/* ---------------------------------------------------------------------------
   ROLLBACK DOS TONS (teste de 18/09/2026 — "A+B")
   A mudança: superfícies secundárias com mais corpo (surface-2/3), o texto
   que fica em cima delas em --text-2 no lugar do cinza-frio --muted, os
   campos das telas de criação/edição com fundo claro e aro visível
   (--campo-fundo / --campo-borda) e o chrome ativo — barra de filtros e
   cabeçalho do card de anotação — no verde claro da identidade (--chrome).
   Tudo isso passava ideia de desabilitado.
   PARA VOLTAR AO ANTERIOR: basta escrever  data-tons="classico"  na tag <html>
   (linha 2). Nada mais muda — este bloco devolve os valores antigos.
   PARA MANTER: apague este bloco inteiro quando decidir.
   --------------------------------------------------------------------------- */
html[data-tons="classico"]{ --surface-2:#eceae2; --surface-3:#e3e0d6;
                           --campo-fundo:var(--bg); --campo-borda:var(--border);
                           --chrome:var(--surface-2); --chrome-borda:var(--border) }
html[data-tons="classico"] .apr-cab .badge{ background:var(--surface-2) }
html[data-tons="classico"] .apr-item.em-edicao{ background:var(--surface-2) }
html[data-tons="classico"] .filtros .marca-filtro{ background:var(--accent-soft) }
html[data-tons="classico"]{ --seq0:#eceae2; --cal-fundo:transparent }
html[data-tons="classico"][data-tema="escuro"]{ --seq0:#2c3335 }
html[data-tons="classico"] .cal{ border-color:transparent;padding:0;width:302px }
html[data-tons="classico"][data-tema="escuro"]{ --surface-2:#2c3335; --surface-3:#363e40 }
html[data-tons="classico"] .aba .pin,
html[data-tons="classico"] .chip-cont .pin,
html[data-tons="classico"] .apr-origem span,
html[data-tons="classico"] .linha-info > span,
html[data-tons="classico"] .linha-info .meta,
html[data-tons="classico"] .filtros .campo > span,
html[data-tons="classico"] tr.sep-dia .meta{ color:var(--muted) }

*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--text);
  font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
h1,h2,h3{letter-spacing:-.2px;margin:0}
a{color:var(--accent-ink)}
.wrap{max-width:1040px;margin:0 auto;padding:22px 18px 90px}

/* ---------- topo ---------- */
header.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin-bottom:20px}
.top .esq{display:flex;align-items:center;gap:11px;min-width:0}
.top .dir{display:flex;align-items:center;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.marca{flex:none;width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  background:var(--accent-forte);color:#fff;box-shadow:0 2px 8px var(--brilho)}
html[data-tema="escuro"] .marca{color:#1c2123;box-shadow:none}
/* a engrenagem dos ajustes tem a mesma cara do livro da marca: bloco cheio na cor da identidade */
.icon-btn.btn-ajustes{border-radius:11px;background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;
  box-shadow:0 2px 8px var(--brilho)}
/* Hover: como o botão já é cheio (igual ao livro), o efeito precisa ser outro que
   "encher" — ele escurece (--accent-ink), sobe um pouco e ganha o brilho forte dos
   botões "+ Adicionar". Sem esta regra valia o hover genérico do .icon-btn (fundo
   claro), e o ícone branco sumia. */
.icon-btn.btn-ajustes{transition:background .15s,box-shadow .15s,transform .15s}
.icon-btn.btn-ajustes:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;
  transform:translateY(-2px);box-shadow:0 6px 16px var(--brilho)}
html[data-tema="escuro"] .icon-btn.btn-ajustes:hover{color:#1b2224;box-shadow:0 6px 16px var(--brilho)}
/* O mesmo hover nos outros botões de ícone do cabeçalho (?, exportar, importar,
   tema): verde fechado, ícone claro, sobe um pouco e brilha. Parados, continuam
   discretos — só a engrenagem é cheia, como o livro. */
.top .dir .icon-btn{transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .15s}
.top .dir .icon-btn:hover{background:var(--accent-ink);border-color:var(--accent-ink);color:#fff;
  transform:translateY(-2px);box-shadow:0 6px 16px var(--brilho)}
html[data-tema="escuro"] .top .dir .icon-btn:hover{color:#1b2224}
.brand h1{font-size:29px;font-weight:650;letter-spacing:-.6px;line-height:1.1;white-space:nowrap}
.brand h1 span{font-weight:400;color:var(--muted);letter-spacing:-.2px}
.chip-data{display:inline-flex;align-items:center;gap:7px;padding:6px 12px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12.5px;transition:.15s}
/* onde os dados estão sendo gravados */
.chip-arq{display:inline-flex;align-items:center;gap:6px;padding:6px 11px;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:12px;transition:.15s;
  max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-arq:hover{border-color:var(--accent);color:var(--accent-ink)}
.chip-arq.ligado{background:var(--bom-soft);border-color:rgba(12,163,12,.35);color:var(--bom-ink);font-weight:550}
.chip-arq.atencao{background:var(--alerta-soft);border-color:rgba(250,178,25,.45);color:var(--alerta-ink);font-weight:550}
.chip-arq.falha{background:var(--critico-soft);border-color:rgba(208,59,59,.35);color:var(--critico-ink);font-weight:550}
.chip-arq[hidden]{display:none}
.chip-data b{color:var(--text);font-weight:550;font-variant-numeric:tabular-nums}
/* ajustes: dias da retomada por dificuldade, três campos curtos lado a lado */
.dias-volta{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-2)}
.dias-volta input{width:64px}
/* A prova e HOJE no mesmo botão, em duas linhas com as datas alinhadas: hoje é a
   referência de "atrasado" e "amanhã" da agenda inteira. O rótulo "Hoje" é igual
   ao "Prova"; só a data de hoje leva a cor da identidade. Um fio separa as duas. */
.chip-data{display:inline-grid;grid-template-columns:auto auto;column-gap:8px;row-gap:3px;
  align-items:baseline;text-align:left;padding:5px 12px;line-height:1.25}
.chip-data .so{grid-column:1 / -1}
.chip-data .hoje-rot,.chip-data .hoje-data{padding-top:3px;border-top:1px dashed var(--border)}
.chip-data.so-hoje .hoje-rot,.chip-data.so-hoje .hoje-data{padding-top:0;border-top:0}   /* só hoje: sem o fio */
#regressiva[hidden]{display:none}
.chip-data .hoje-data{color:var(--accent-ink);font-weight:600;font-variant-numeric:tabular-nums}
.chip-data:hover{border-color:var(--accent);color:var(--accent-ink)}
/* O PERFIL: círculo com a inicial (verde da marca) e o menu que abre dele */
.perfil{position:relative;flex:none}
.avatar{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none;
  background:var(--accent-forte);color:#fff;font-weight:650;font-size:19px;letter-spacing:0;border:2px solid var(--surface);
  box-shadow:0 0 0 1px var(--accent-forte),0 2px 8px var(--brilho);transition:transform .15s,box-shadow .15s}
button.avatar:hover{transform:translateY(-2px);box-shadow:0 0 0 1px var(--accent-ink),0 6px 16px var(--brilho)}
button.avatar[aria-expanded="true"]{box-shadow:0 0 0 3px var(--foco)}
html[data-tema="escuro"] .avatar{color:#1b2224}
.avatar-grande{width:44px;height:44px;font-size:19px}
.avatar-ponto{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;
  border:2px solid var(--surface);background:var(--alerta)}
.avatar-ponto.falha{background:var(--critico)}
.menu-perfil{position:absolute;right:0;top:calc(100% + 8px);z-index:45;width:300px;max-width:calc(100vw - 24px);
  background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 34px rgba(0,0,0,.16);
  padding:8px;text-align:left}
.menu-perfil[hidden]{display:none}
.menu-cab{display:flex;align-items:center;gap:11px;padding:8px 8px 10px}
.menu-quem{display:flex;flex-direction:column;min-width:0;line-height:1.3}
.menu-quem b{font-weight:600;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-quem span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-sep{height:1px;background:var(--border);margin:6px 2px}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;padding:9px 10px;border-radius:8px;
  color:var(--text);font-size:14px;text-align:left;white-space:nowrap}
.menu-item .menu-ic{flex:none;color:var(--accent-ink)}
.menu-item:hover,.menu-item:focus-visible{background:var(--accent-soft);outline:none}
.menu-sair,.menu-sair .menu-ic{color:var(--critico-ink)}
.menu-perfil .menu-estado[hidden]{display:none}
.menu-aviso{margin-left:auto;font-style:normal;font-size:11.5px;color:var(--muted);white-space:nowrap}
.menu-aviso.atencao{color:var(--alerta-ink)}
.menu-aviso.falha{color:var(--critico-ink)}
/* "carregando…": uma rodinha discreta, na cor da marca */
.carregando{display:flex;align-items:center;gap:10px}
.girando{width:16px;height:16px;border-radius:50%;border:2px solid var(--accent-soft);border-top-color:var(--accent-forte);
  animation:gira .8s linear infinite;flex:none}
@keyframes gira{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.girando{animation-duration:2.4s}}
.icon-btn{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;
  border:1px solid var(--border);background:var(--surface);color:var(--muted);transition:.15s;font-size:15px}
.icon-btn:hover{color:var(--text);border-color:var(--accent);background:var(--accent-soft)}
/* A CONTAGEM DA PROVA. Sem os fogos (25/09), o espaço deles virou letra maior — no
   limite de o card NÃO crescer: medido no navegador, o mesmo tamanho de antes
   (226×42 na web, 218×38 no celular). Quem limita é a altura; a largura que
   sobra fica de respiro dos lados. */
.regressiva{display:inline-flex;align-items:baseline;gap:8px;padding:3px 29px;border-radius:13px;
  background:var(--accent-forte);border:1px solid var(--accent-forte);color:#fff;
  box-shadow:0 2px 12px var(--brilho);white-space:nowrap}
.regressiva b{font-size:32px;font-weight:650;line-height:1;letter-spacing:-.6px;font-variant-numeric:tabular-nums;color:inherit}
.regressiva span{font-size:15px;opacity:.92}
.regressiva.urgente{background:var(--critico);border-color:var(--critico);color:#fff;
  box-shadow:0 2px 12px var(--brilho-critico)}
.regressiva.neutra{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);
  box-shadow:none;font-size:13.5px;padding:11px 18px}
.regressiva.neutra b{font-size:14px;font-weight:650}
html[data-tema="escuro"] .regressiva.neutra{color:var(--accent-ink)}
html[data-tema="escuro"] .regressiva{color:#1b2224}
html[data-tema="escuro"] .regressiva.urgente{color:#fff}

/* ---------- abas ---------- */
nav.abas{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:12px;margin-bottom:20px}
.aba{display:inline-flex;align-items:center;gap:7px;padding:10px 19px;border-radius:999px;
  border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:14.5px;transition:.15s}
.aba:hover{color:var(--text);border-color:var(--accent)}
/* AS BARRAS DE FILTRO (rótulo + botões de aba: Progresso, Questões, Agenda e
   Disciplinas) ganham um fundo próprio, um verde-acinzentado entre a superfície
   e o accent-soft: o bastante para a barra se separar dos cards de conteúdo,
   sem competir com o botão escolhido, que continua sendo o verde cheio. */
.barra-filtro,.card.barra-filtro{background:var(--filtro-fundo);border-color:var(--filtro-borda)}
.barra-filtro .hl-tema{color:var(--text-2)}     /* o cinza claro some no fundo tingido */
.barra-filtro:not(.card){padding:9px 12px;border:1px solid var(--filtro-borda);border-radius:var(--radius)}
.aba[aria-selected="true"],.aba[aria-pressed="true"]{background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;font-weight:550;
  box-shadow:0 1px 7px var(--brilho)}
html[data-tema="escuro"] .aba[aria-selected="true"],
html[data-tema="escuro"] .aba[aria-pressed="true"]{color:#1b2224}
.aba .pin{min-width:18px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:11px}
.aba[aria-selected="true"] .pin{background:rgba(0,0,0,.22);color:#fff}          /* o número branco sobre o verde: 3,1 → 5:1 */
html[data-tema="escuro"] .aba[aria-selected="true"] .pin{background:rgba(255,255,255,.32);color:#1b2224}
.aba .pin.alerta{background:var(--critico);color:#fff}

/* ---------- blocos ---------- */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
  padding:16px 17px;box-shadow:var(--shadow);margin-bottom:16px}
/* o cronômetro é a ação principal do dia: ganha moldura verde */
.card-crono{border-color:var(--accent);box-shadow:0 1px 3px var(--brilho),var(--shadow)}
.card-crono > h2::before{background:var(--accent-forte)}
.card > h2{font-size:15px;font-weight:600;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.card > h2::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.card > h2 .dica{font-size:12px;font-weight:400;color:var(--muted)}
/* a Agenda de hoje, na aba Agenda: é por ela que se começa o dia, então se
   destaca do resto — moldura verde mais grossa e o título numa faixa própria */
.card-hoje{border:2px solid var(--accent);box-shadow:0 2px 14px var(--brilho),var(--shadow);
  padding-top:0;overflow:hidden}
.card-hoje > h2{font-size:18px;background:var(--accent-soft);margin:0 -17px 12px;padding:12px 17px;
  border-bottom:1px solid var(--accent);flex-wrap:wrap;row-gap:2px}
.card-hoje > h2::before{width:4px;height:18px;background:var(--accent-forte)}
.card-hoje > h2 .dica{color:var(--accent-ink);font-weight:500}
.sub{font-size:12.5px;color:var(--muted);margin:0 0 12px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr));align-items:start}
.linha{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spacer{margin-left:auto}

/* ---------- formulário ---------- */
.campos{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.campo{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--text-2);min-width:0}
.campo input[type="checkbox"],.campo input[type="radio"]{
  width:auto;padding:0;margin:0;border:none;background:none;accent-color:var(--accent);flex:none}
.campo input,.campo select,.campo textarea{
  border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:8px;padding:8px 10px;
  outline:none;transition:.15s;width:100%;min-width:0;max-width:100%}
.campo input:focus,.campo select:focus,.campo textarea:focus{border-color:var(--accent);background:var(--campo-fundo);
  box-shadow:0 0 0 3px var(--foco)}
.btn:focus-visible,.aba:focus-visible,.icon-btn:focus-visible,.act:focus-visible,.btn-add:focus-visible,
.chip-data:focus-visible,.check:focus-visible,.opcao:has(input:focus-visible){
  outline:2px solid var(--accent);outline-offset:2px}
.campo textarea{resize:vertical;min-height:62px;line-height:1.55}
.campo textarea.texto-grande{min-height:170px}
.campo textarea.texto-medio{min-height:126px}
/* data e número não precisam da largura toda da coluna */
.campo input[type="date"]{max-width:175px}
.campo input[type="number"]{max-width:130px}
.campo .dias-volta input{width:72px;max-width:72px}
.campo.largo{grid-column:1/-1}
/* uma coluna: cada campo embaixo do outro, nada lado a lado (tela de ajustes) */
.campos.uma-coluna,.uma-coluna .campos{grid-template-columns:1fr}
.uma-coluna .opcoes{flex-direction:column;align-items:flex-start}
.uma-coluna .opcoes.lado-a-lado{flex-direction:row;flex-wrap:wrap}   /* o objetivo: três opções curtas, lado a lado */
/* nos ajustes, o nome de cada campo aparece mais: maior, mais forte e na cor do texto */
#formAjustes .campo > span:first-child{font-size:14px;font-weight:600;color:var(--text);letter-spacing:-.1px}
/* a opção do agendamento automático: um pouco maior, numa linha só (no celular estreito ela pode quebrar) */
/* Numa linha só (item 40), mas menor: com 14px ela media 540px numa área de 558 — e a barra de rolagem
   vertical do navegador bastava para aparecer a barra lateral (pedido do Pedro, 26/09). Se ainda assim
   não couber, quebra a linha em vez de rolar para o lado. */
#formAjustes .opcao:has([name="automatico"]){font-size:13px;padding:9px 13px;gap:9px;white-space:nowrap;max-width:100%}
#formAjustes .opcao:has([name="automatico"]) input{width:16px;height:16px}
@media (max-width:640px){ #formAjustes .opcao:has([name="automatico"]){white-space:normal} }
.uma-coluna .dias-volta{display:inline-flex;align-self:flex-start}
.uma-coluna .dias-volta span:first-child{min-width:64px}
.uma-coluna .dia-prova{flex-direction:column;align-items:stretch}   /* nome e data do dia de prova, um embaixo do outro */
.uma-coluna .dia-prova .excluir{align-self:flex-start}
.ajuda-campo{font-size:11.5px;color:var(--text-2);margin-top:2px;line-height:1.35}
/* conteúdo travado até haver disciplina (Registrar sessão) */
#campoAssunto:disabled{opacity:.55;cursor:not-allowed}
/* revisões até a prova: a lista de datas escolhidas */
.intro-rev-prova{margin:0 0 12px;line-height:1.5}
#formRevProva .campos + .intro-rev-prova{margin-top:14px}
.painel-rev-prova{gap:10px}
.painel-rev-prova .campo{max-width:260px}
.lista-datas-prova{display:flex;flex-direction:column;gap:6px}
.data-prova-rev{gap:10px;align-items:center;flex-wrap:nowrap}
.data-prova-rev .num{min-width:2.2em;font-weight:600;color:var(--text-2)}
.data-prova-rev input{max-width:190px}
.data-prova-rev .dia-semana{font-size:13px;color:var(--text-2)}
.meta.ate-prova{color:var(--accent-ink)}
/* a janela do conteúdo (✎ editar na aba Disciplinas) */
.situacao-conteudo{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 0 12px}
.situacao-conteudo .dica{font-size:12.5px;color:var(--muted)}
#dialogo .nota-conteudo{margin:12px 0 0}
#dialogo .linha-rev-prova{margin-top:10px}
#dialogo .meta.ate-prova{font-size:12.5px;margin-top:4px}
#dialogo .dialogo-mais{margin-bottom:22px}       /* o atalho não cola no Salvar/Cancelar */
/* a data da pergunta curta (remarcar): caixa compacta e com folga até Remarcar/Cancelar */
#dialogo .campo input[type="date"]{max-width:160px;padding:6px 10px;height:38px;line-height:1.2}
#dialogo .campos + .acoes-form{margin-top:16px}
.meta.sem-auto{color:var(--muted);font-style:italic}
/* o cronograma das revisões automáticas (janela de concluir e ✎ editar do conteúdo) */
.modal-pequeno:has(.bloco-escada){max-width:540px}
.form-concluir .opcoes{margin:4px 0 10px}
.modo-escada{display:flex;flex-wrap:wrap;gap:6px 14px}
.bloco-escada{border:1px solid var(--border);border-radius:10px;padding:10px 12px;margin:0 0 10px}
.cab-escada{margin:0 0 8px;line-height:1.4}
.cab-escada .dica{font-size:12.5px;color:var(--muted)}
.qtd-escada{gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 8px}
.qtd-escada label{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--text-2)}
.lista-escada{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.linha-escada{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text-2)}
.linha-escada .num{min-width:2.2em;font-weight:600}
.bloco-escada input[type="number"]{width:64px;flex:none;padding:5px 8px;font-size:14px}
.linha-escada .unid{white-space:nowrap}
.linha-escada .data-escada{margin-left:auto;white-space:nowrap;color:var(--text);font-variant-numeric:tabular-nums}
.linha-escada .data-escada.feita{color:var(--bom-ink)}
.linha-escada .data-escada.longe{color:var(--muted)}
.nota-escada{display:block;font-size:12px;color:var(--muted);margin:0 0 6px;line-height:1.45}
.cronograma-conteudo{margin-top:12px}
.cronograma-conteudo .rot-escada{display:block;font-size:13px;font-weight:600;margin:0 0 6px}
@media (max-width:480px){
  .linha-escada{flex-wrap:wrap}
  .linha-escada .data-escada{margin-left:0;flex-basis:100%;padding-left:calc(2.2em + 8px)}
}
.ajuda-campo:empty{display:none}
/* Bloco que cresce e encolhe conforme a resposta. O truque do grid (0fr → 1fr)
   anima a altura sem precisar saber quanto o conteúdo mede; o `visibility` no
   fim da transição tira os campos fechados do caminho do teclado. */
.painel-questao{display:grid;grid-template-rows:0fr;opacity:0;margin:0;padding-left:0;
  border-left:0 solid var(--accent);
  transition:grid-template-rows .22s ease,opacity .18s ease,padding-left .22s ease,
             border-left-width .22s ease,margin-top .22s ease}
.painel-questao > .interno{overflow:hidden;min-height:0;visibility:hidden;transition:visibility 0s linear .22s}
.painel-questao.aberto{grid-template-rows:1fr;opacity:1;margin-top:4px;padding-left:12px;border-left-width:3px}
.painel-questao.aberto > .interno{visibility:visible;transition-delay:0s}
.painel-questao .campos{gap:12px}
/* a setinha do "Sim" gira quando o bloco está aberto */
.opcao .seta{display:inline-block;font-size:14px;line-height:1;color:inherit;transition:transform .22s ease;opacity:.85}
.opcao:has(input:checked) .seta{transform:rotate(180deg)}
@media (prefers-reduced-motion: reduce){
  .painel-questao,.painel-questao > .interno,.opcao .seta{transition:none}
}
/* campo que barrou uma ação: some sozinho quando a pessoa escolhe */
.campo-errado{border-color:var(--critico) !important;box-shadow:0 0 0 3px var(--brilho-critico)}
/* --- etiquetas de assunto no registro --- */
/* --- caixas de marcar (campo "Situação") --- */
/* --- sugestões (substitui o <datalist> nativo, que o navegador pintava sozinho) --- */
.sug-lista{position:absolute;z-index:30;margin:0;padding:4px;list-style:none;background:var(--surface);
  border:1px solid var(--accent);border-radius:9px;box-shadow:0 10px 28px rgba(50,50,45,.16);
  max-height:230px;overflow-y:auto;min-width:160px}
.sug-lista li{padding:7px 10px;border-radius:6px;font-size:13.5px;color:var(--text);cursor:pointer;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:400}
.sug-lista li:hover,.sug-lista li.ativo{background:var(--accent-soft);color:var(--accent-ink)}
.sug-lista li b{font-weight:650;color:var(--accent-ink)}
.opcoes{display:flex;flex-wrap:wrap;gap:8px}
.opcao{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--text);line-height:1.3;
  border:1px solid var(--campo-borda);background:var(--campo-fundo);border-radius:9px;padding:9px 13px;
  cursor:pointer;transition:.15s}
/* hover visível também na opção já marcada (antes só a borda mudava, e ela já era
   verde): anel suave, sobe um pouco; marcada, o fundo escurece um tom */
.opcao:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);transform:translateY(-1px)}
.opcao:has(input:checked){background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.opcao:has(input:checked):hover{background:var(--filtro-borda);box-shadow:0 2px 8px var(--brilho)}
@media (prefers-reduced-motion: reduce){ .opcao:hover{transform:none} }
/* etiqueta só de leitura (o conteúdo vem da revisão, não se escolhe aqui).
   A regra vivia dentro do editor de grupo, que saiu com a integração. */
.tag.fixo{background:transparent;border-style:dashed;padding-right:11px;opacity:.85}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags:empty{display:none}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 6px 4px 11px;border-radius:999px;
  background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-ink);font-size:13px}
.tag .txt{border-radius:4px;padding:0 2px;min-width:14px}
/* o ✕ remove (vermelho no hover); o ✎ renomeia — não pode parecer destrutivo */
.tag button.ren:hover{background:var(--accent);color:#fff}
.tag button{width:17px;height:17px;display:grid;place-items:center;border-radius:50%;font-size:10px;
  color:var(--accent-ink);background:rgba(0,0,0,.06);line-height:1}
.tag button:hover{background:var(--critico);color:#fff}
.btn{padding:8px 16px;border-radius:9px;background:var(--accent-forte);color:#fff;font-size:13.5px;font-weight:550;
  border:1px solid var(--accent-forte);transition:.15s;box-shadow:0 1px 4px var(--brilho)}
.btn:hover{filter:brightness(1.07);box-shadow:0 2px 9px var(--brilho)}
/* texto escuro só no botão CHEIO (fundo verde claro no tema escuro). O ghost
   tem fundo de campo, escuro: com esta regra valendo para ele — e ela ganhava
   do .btn.ghost por especificidade — o texto sumia até passar o mouse. */
html[data-tema="escuro"] .btn:not(.ghost){color:#1b2224}
.btn.ghost{background:var(--campo-fundo);color:var(--text-2);border-color:var(--campo-borda);box-shadow:none}
.btn.ghost:hover{color:var(--text);border-color:var(--accent)}
.btn.mini{padding:5px 11px;font-size:12.5px}
.erro-form{color:var(--critico);font-size:12.5px}
.sel-dificuldade{font-variant-numeric:tabular-nums}

/* ---------- listas / tabela ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:550;color:var(--muted);font-size:12px;padding:7px 9px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px;border-bottom:1px solid var(--grade);vertical-align:top}
tr:last-child td{border-bottom:none}
/* o hover não pode repetir o cinza da faixa de data e do painel de filtros:
   aqui ele usa o verde suave, que também diz "dá para clicar" */
tbody tr:not(.sep-dia):hover{background:var(--accent-soft)}
tbody tr.linha-clicavel{cursor:pointer}
/* coluna Tipo: alinhada ao cabeçalho, com folga na margem — "estudo/revisão"
   é longo e antes ficava espremido na borda direita da tabela */
/* Distribuição da tabela de Sessões: as colunas de dado curto ficam do
   tamanho do conteúdo delas (width:1% + nowrap é o truque) e a de CONTEÚDOS
   absorve o que sobra. Sem isso, a tabela espalhava o espaço igualmente e
   sobrava um vão enorme antes da última coluna. */
.col-tipo{text-align:left}
.col-acao{text-align:left;white-space:nowrap;width:1%;padding-left:4px}
/* Colunas curtas encolhem até o conteúdo delas; as que PODEM quebrar linha
   quebram, para sobrar mais largura para a coluna de conteúdos — que é onde
   mora a descrição e onde a legibilidade importa. */
.tab-sessoes .col-curta{width:1%}
.tab-sessoes .col-nowrap{white-space:nowrap}
.tab-sessoes .col-larga{width:100%;min-width:26ch}
.tab-sessoes .col-curta .badge{white-space:normal}     /* etiqueta em duas linhas, se precisar */
/* os sinais de plano acompanham o nome do conteúdo, não uma coluna própria */
.tab-sessoes .col-larga .badge{margin-left:6px;vertical-align:middle}

.tab-sessoes .col-larga .pe{white-space:normal;line-height:1.45}
.tab-rolagem{overflow-x:auto}
tr.sep-dia td{background:var(--surface-2);font-size:12px;color:var(--text-2);font-weight:550;
  padding:6px 9px;border-bottom:1px solid var(--border);box-shadow:inset 3px 0 0 var(--accent)}
tr.sep-dia .meta{font-weight:400;color:var(--text-2)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.acoes-linha{display:flex;gap:2px;justify-content:flex-end}
.acerto{display:flex;align-items:center;gap:9px}
.acerto-barra{flex:1;min-width:70px;height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden}
.acerto-barra i{display:block;height:100%;border-radius:999px}
.acerto b{font-size:13px;font-weight:600;min-width:38px;text-align:right}
.act{font-size:12px;color:var(--muted);padding:3px 8px;border-radius:6px;transition:.15s}
.act:hover{background:var(--surface-3);color:var(--text)}
/* atalhos que preenchem um campo (+1 mês, +3 meses…): têm fundo próprio para se
   verem como botões, e enchem de verde no hover */
.act.atalho{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--filtro-borda);
  font-weight:550;padding:5px 10px;border-radius:8px}
.act.atalho:hover{background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;box-shadow:0 2px 8px var(--brilho)}
html[data-tema="escuro"] .act.atalho:hover{color:#1b2224}
.act.danger:hover{color:var(--critico)}
/* "+ ver todos": fecha a lista de assuntos como um rodapé, largura cheia */
.ver-mais{display:block;width:100%;margin-top:10px;padding:9px;font-size:13px;font-weight:600;
  color:var(--accent-ink);border:1px dashed var(--border);background:var(--surface-2)}   /* accent-ink: 3,9 → 5,5:1 */
.ver-mais:hover{background:var(--surface-3);border-color:var(--accent);color:var(--accent-ink)}

.item{display:flex;gap:11px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);
  border-radius:10px;background:var(--surface);margin-bottom:8px;border-left:3px solid var(--border);
  box-shadow:0 1px 2px rgba(60,60,50,.05)}
.item:last-child{margin-bottom:0}
/* --- próximos dias: um bloco por dia --- */
.dia-bloco + .dia-bloco{margin-top:15px;padding-top:13px;border-top:1px solid var(--border)}
.dia-rotulo{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px;
  font-size:11.5px;font-weight:650;color:var(--accent-ink);text-transform:uppercase;letter-spacing:.5px}
.dia-rotulo span{font-weight:400;font-size:11.5px;color:var(--muted);text-transform:none;letter-spacing:0}
.item.atrasada{border-left-color:var(--critico);background:var(--critico-soft);border-color:rgba(208,59,59,.28)}
.item.hoje{border-left-color:var(--accent);background:var(--accent-soft);border-color:var(--accent)}
.item.feita{opacity:.6;border-left-color:var(--bom)}
.item.atrasada .titulo{color:var(--critico-ink)}
/* o que pede ação sobe da lista; o que já passou fica rente */
.item.hoje{box-shadow:0 1px 7px var(--brilho)}
.item.atrasada{box-shadow:0 1px 7px var(--brilho-critico)}
.item.feita{box-shadow:none}
.item .corpo{flex:1;min-width:0}
.item .titulo{font-weight:550;font-size:14px}
.item .meta{font-size:12px;color:var(--muted);margin-top:2px}
/* O ✓ é DESENHADO (duas bordas giradas), não é a letra: o glifo do tipo mudava
   de tamanho e de altura conforme a fonte disponível e saía torto dentro da
   caixinha. Aqui ele é sempre o mesmo traço, centrado no pixel.             */
.check{flex:none;width:19px;height:19px;margin-top:2px;border-radius:6px;border:1.5px solid var(--campo-borda);
  background:var(--campo-fundo);position:relative;font-size:0;color:transparent;transition:.15s}
.check::after{content:"";position:absolute;left:50%;top:50%;width:4.5px;height:8.5px;
  border:solid transparent;border-width:0 2px 2px 0;border-radius:1px;
  transform:translate(-50%,-58%) rotate(45deg);transition:.12s}
.check:hover{border-color:var(--accent)}
.check:hover::after{border-color:var(--accent)}          /* prévia do que o clique faz */
.check[aria-checked="true"]{background:var(--bom);border-color:var(--bom)}
.check[aria-checked="true"]::after,
.check[aria-checked="true"]:hover::after{border-color:#fff}
.badge{font-size:11px;font-weight:550;padding:2px 8px;border-radius:999px;background:var(--surface-2);
  color:var(--text-2);white-space:nowrap}
.badge.b-bom{background:var(--bom-soft);color:var(--bom-ink)}
.badge.b-critico{background:var(--critico-soft);color:var(--critico-ink)}
.badge.b-alerta{background:var(--alerta-soft);color:var(--alerta-ink)}
.badge.b-estrela{background:var(--star-soft);color:var(--star)}
/* estudo/revisão: nem o âmbar da revisão pura, nem o neutro do estudo */
/* "estudo" tinha o cinza neutro, o mesmo do "Médio" da dificuldade, e as duas
   etiquetas lado a lado na lista de sessões pareciam a mesma coisa. Ganha o
   verde-claro da identidade, sem a borda do b-misto ("em andamento"). */
.badge.b-estudo{background:var(--accent-soft);color:var(--accent-ink)}
.badge.b-misto{background:var(--accent-soft);color:var(--accent-ink);border:1px solid var(--accent)}
.ponto{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

/* ---------- estatísticas ---------- */
.tiles{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.tiles.t3{grid-template-columns:repeat(3,1fr)}
/* no celular os números ficam dois por linha: o último, se sobrar sozinho, ocupa a linha
   inteira em vez de deixar um buraco (Progresso tem 5) */
@media (max-width:620px){ .tiles:not(.t3) > .tile:last-child:nth-child(odd){grid-column:1/-1} }
.tiles.t3 .val{font-size:21px}
.tile{position:relative;overflow:hidden;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:13px 15px 13px 17px}
.tile .rot{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.tile .val{font-size:25px;font-weight:600;margin-top:3px;line-height:1.15}
.tile .pe{font-size:12px;color:var(--muted);margin-top:2px}
/* tom = o que o número está dizendo; a faixa à esquerda dá o recado de longe */
.tile[class*="t-"]::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px}
.tile.t-accent::before{background:var(--accent)}
.tile.t-bom::before{background:var(--bom)}
.tile.t-alerta::before{background:var(--alerta)}
.tile.t-critico::before{background:var(--critico)}
.tile.t-accent .val{color:var(--accent-ink)}
.tile.t-bom .val{color:var(--bom-ink)}
.tile.t-alerta .val{color:var(--alerta-ink)}
.tile.t-critico .val{color:var(--critico-ink)}
/* A véspera tem cor própria no app inteiro (★): o bloco dela acompanha. O
   NÚMERO usa --star-ink, não --star: o dourado da estrela dá 2,82:1 sobre o
   papel claro, abaixo do piso de 3:1 — é a mesma razão de existirem os
   --bom-ink / --alerta-ink / --critico-ink. A barrinha de cima pode usar o tom
   cheio: ali é forma, não texto. */
.tile.t-star::before{background:var(--star)}
.tile.t-star .val{color:var(--star-ink)}
.tile.t-critico{background:var(--critico-soft);border-color:rgba(208,59,59,.30)}
.tile.t-critico .pe{color:var(--critico-ink);opacity:.85}
.barra{height:9px;border-radius:999px;background:var(--surface-3);overflow:hidden;margin-top:9px}
.barra > i{display:block;height:100%;border-radius:999px;background:var(--accent);transition:width .4s}
.barra > i.cheia{background:var(--bom)}
/* --- calendário do mês + detalhe do dia selecionado --- */
.heat-grid{display:grid;grid-template-columns:auto minmax(230px,1fr);gap:20px;align-items:start}
/* painel discreto atrás do calendário: sem ele, o mês flutuava solto no mesmo
   tom do card. Os dias passam a ter cor própria (--seq0), então os vãos da
   grade é que mostram o painel — a rampa de estudo continua comparando célula
   com célula, sem perder o passo mais claro. */
.cal{width:328px;max-width:100%;background:var(--cal-fundo);border:1px solid var(--border);
  border-radius:12px;padding:12px 13px}
.cal-cab{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.cal-cab b{font-size:15px;font-weight:650;letter-spacing:-.2px;margin-right:auto;text-transform:capitalize}
.cal-nav{width:27px;height:27px;border-radius:8px;border:1px solid var(--border);background:var(--surface);
  color:var(--text-2);display:grid;place-items:center;font-size:15px;line-height:1;transition:.15s}
.cal-nav:hover{border-color:var(--accent);color:var(--accent-ink);background:var(--accent-soft)}
.cal-semana,.cal-dias{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-semana span{text-align:center;font-size:10.5px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.3px;padding-bottom:5px}
.cal-dia{position:relative;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--text);background:var(--seq0);
  border:2px solid transparent;transition:.12s}
.cal-dia:hover{box-shadow:0 0 0 2px var(--foco)}
/* dia de outro mês: recua para o painel e fica secundário, mas legível —
   a opacidade .4 de antes dava 1,5:1, quase invisível */
.cal-dia.fora{background:transparent;color:var(--muted)}
.cal-dia.fora .pt{opacity:.55}                 /* o pontinho é que recua, não o número */
html[data-tema="escuro"] .cal-dia.fora{opacity:.78}
.cal-dia.hoje{border-color:var(--accent);font-weight:650}
.cal-dia.prova{border-color:var(--critico);color:var(--critico-ink);font-weight:650}
.cal-dia.sel{background:var(--accent-forte);color:#fff;font-weight:650;border-color:var(--accent-forte)}
html[data-tema="escuro"] .cal-dia.sel{color:#1b2224}
.cal-dia .pt{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);
  width:5px;height:5px;border-radius:50%}
.cal-dia.sel .pt{background:#fff !important}
.cal-dia .pt.pt-tarefa{background:var(--star)}
.cal-dia.dois-pts .pt{left:calc(50% - 4px)}
.cal-dia.dois-pts .pt.pt-tarefa{left:calc(50% + 4px)}
/* TAREFA: o lembrete solto da agenda. A borda e o selo na cor da estrela a separam
   das revisões; atrasada e feita seguem as cores de sempre. */
.item.tarefa:not(.atrasada):not(.feita){border-left-color:var(--star)}
.badge.b-tarefa{background:var(--star-soft);color:var(--star-ink)}
.item.tarefa .hora{font-variant-numeric:tabular-nums;font-weight:650;color:var(--star-ink);margin-right:7px}
.linha-add{display:flex;column-gap:10px;flex-wrap:wrap}   /* a linha de baixo já tem a margem do botão */
.linha-add .btn-add{flex:1 1 220px;width:auto}
/* ABA DISCIPLINAS (04/10). Cada disciplina: título e resumo à esquerda, ações à
   direita, e uma barra fina do quanto já foi concluído. Cada conteúdo: nome com
   o selo da situação; dificuldade e ações juntas, à direita (no celular, numa
   linha só embaixo, separada por um fio). O conteúdo juntado tem a borda na cor
   da identidade e diz de quem é feito. */
.tiles-disc{margin-bottom:16px}
.disc-bloco{margin-bottom:12px}
.grupo-rev.disc-bloco .cab{align-items:flex-start;margin-bottom:9px;padding-bottom:0;border-bottom:0}
.disc-tit{display:flex;flex-direction:column;gap:3px;min-width:0}
.disc-resumo{font-size:12px;color:var(--muted)}
.disc-acoes{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.disc-barra{height:5px;margin:0 0 12px}
.item-conteudo{align-items:center}
.cont-nome{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cont-acoes{display:flex;align-items:center;gap:2px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.cont-acoes .sel-dif-cont{margin-right:4px}
.item-conteudo.juntado{border-left-color:var(--accent)}
.meta.juntou{color:var(--accent-ink)}
.opcoes-juntar .opcao small{color:var(--muted);font-weight:400;margin-left:3px}
@media (max-width:620px){
  .item-conteudo{flex-wrap:wrap;row-gap:9px}
  .item-conteudo .corpo{flex:1 1 100%}
  .cont-acoes{flex:1 1 100%;justify-content:flex-start;padding-top:9px;border-top:1px solid var(--border)}
  .cont-acoes .sel-dif-cont{flex:1 1 96px;width:auto;max-width:150px;min-width:0}
  .grupo-rev.disc-bloco .cab{flex-direction:column;gap:6px}
  .disc-bloco .cab .spacer{display:none}
  .disc-acoes{justify-content:flex-start}
}
.pt-legenda{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:3px;vertical-align:middle}
@media (max-width:820px){.heat-grid{grid-template-columns:1fr}}
.dia-info{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius);padding:13px 15px;box-shadow:0 1px 2px rgba(60,60,50,.05)}
.dia-info.vazia{border-left-color:var(--border);background:var(--surface-2)}
.dia-rot{font-size:11px;font-weight:650;text-transform:uppercase;letter-spacing:.5px;color:var(--accent-ink);display:block}
.dia-info.vazia .dia-rot{color:var(--muted)}
.dia-cab{display:flex;align-items:flex-start;gap:8px;padding-bottom:10px;border-bottom:1px solid var(--grade)}
.dia-cab > div{margin-right:auto;line-height:1.25}
.dia-cab b{font-size:16px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.dia-numeros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 10px}
.dia-numeros div{line-height:1.15}
.dia-numeros b{display:block;font-size:20px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.dia-numeros b.t-bom{color:var(--bom-ink)} .dia-numeros b.t-alerta{color:var(--alerta-ink)}
.dia-numeros b.t-critico{color:var(--critico-ink)}
.dia-numeros span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.dia-meta{display:flex;align-items:center;gap:9px}
.dia-meta .barra{flex:1;margin:0}
.dia-meta span{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dia-lista{list-style:none;margin:7px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;
  max-height:210px;overflow-y:auto}
.dia-lista li{font-size:13px;line-height:1.35;border-left:3px solid var(--accent);padding:4px 0 4px 9px}
.dia-lista li.rev{border-left-color:var(--alerta)}
.dia-lista li b{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dia-lista li > span{color:var(--muted);font-size:12px;display:block;margin-top:1px}
.dia-tempo{font-size:12.5px;color:var(--text-2);font-weight:600}
.dia-vazio{font-size:13px;color:var(--muted);margin:12px 0 0}
.heat-cel{cursor:pointer}
figure{margin:0}
figcaption{font-size:12.5px;color:var(--muted);margin-bottom:10px}
svg{display:block;max-width:100%;height:auto;overflow:visible}
.legenda{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--text-2);margin-top:10px;align-items:center}
.legenda span{display:inline-flex;align-items:center;gap:5px}

/* ---------- diversos ---------- */
.vazio{text-align:center;padding:34px 18px;color:var(--muted);font-size:13.5px;border:1px dashed var(--border);border-radius:var(--radius)}
.vazio strong{display:block;color:var(--text);font-weight:550;margin-bottom:4px;font-size:14.5px}
.aviso{background:#f7ece4;border:1px solid #e3c9b4;color:#8a5a37;border-radius:10px;padding:10px 13px;font-size:13px;margin-bottom:14px}
html[data-tema="escuro"] .aviso{background:#3a2e26;border-color:#5a4632;color:#e0bd96}
/* O AVISO USA A LARGURA DA TELA (celular, 24/09). Era left:50% com
   translate(-50%): a caixa só podia crescer até a borda direita, isto é, METADE
   da tela — no celular o texto virava uma coluna estreita de seis, sete linhas.
   Agora ele fica entre as duas margens e se centra pela própria largura. */
.toast{position:fixed;left:16px;right:16px;bottom:24px;margin:0 auto;width:fit-content;max-width:560px;
  transform:translateY(14px);background:var(--text);color:var(--bg);
  padding:9px 16px;border-radius:9px;font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:60}
.toast.show{opacity:.96;transform:translateY(0)}
/* aviso com botão (R4, 27/09): o botão é o mesmo atalho do app (.act.atalho); só o aviso
   VISÍVEL recebe toque — escondido, ele não pode virar uma área invisível clicável */
.toast.com-acao{display:flex;align-items:center;gap:12px}
.toast.com-acao.show{pointer-events:auto}
.toast .toast-acao{flex:none;font-weight:600}
.overlay{position:fixed;inset:0;background:rgba(30,32,30,.42);display:grid;place-items:center;padding:18px;z-index:50;
  grid-template-columns:minmax(0,1fr)}
/* A coluna da grade não cresce com o conteúdo, e os campos podem encolher
   (min-width:0): um <select> de opções compridas (a sessão, a disciplina) nunca
   empurra a caixa para além da tela. Precaução para o celular (24/09). */
.overlay[hidden]{display:none}   /* a classe vence o [hidden] do navegador: precisa ser explícito */
/* e para todo o resto: o painel "Personalizar" das revisões até a prova aparecia com "Automáticas"
   marcado, porque o display de .campo vencia o hidden (achado na revisão de UX, 26/09) */
[hidden]{display:none!important}
/* A caixa é uma coluna: cabeçalho fixo, miolo que rola, rodapé de ações fixo.
   Quem rola é só o miolo — a barra de rolagem termina no fio acima dos botões,
   em vez de correr ao lado deles. */
.modal{background:var(--surface);border:1px solid var(--border);border-radius:14px;max-width:560px;width:100%;min-width:0;
  max-height:88vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.18)}
.modal > header{flex:none}
.modal > .conteudo{flex:1 1 auto;min-height:0;overflow:auto}
/* rodapé de ações, depois de sair de dentro da área que rola */
.modal.com-rodape > .acoes-form{flex:none;margin:0;padding:12px 16px 14px;background:var(--surface);
  border-top:1px solid var(--grade);border-radius:0 0 13px 13px}
/* formulários de registro e de revisão: tela sobreposta, larga */
.modal.grande{max-width:880px}
/* A TELA DE ACESSO (login). Cobre o app inteiro — o app nem é desenhado por
   baixo (render sai cedo; ver portaoFechado). Um cartão só, no alto, com a marca. */
.acesso{position:fixed;inset:0;z-index:70;background:var(--bg);overflow-y:auto;display:flex;
  justify-content:center;align-items:flex-start;padding:6vh 16px 32px}
.acesso[hidden]{display:none}
body.sem-acesso .wrap{display:none}
.acesso-caixa{width:100%;max-width:400px}
.acesso-marca{display:flex;align-items:center;justify-content:center;gap:11px;margin-bottom:16px}
.acesso-marca h1{font-size:23px;font-weight:650;letter-spacing:-.5px}
.acesso-marca h1 span{font-weight:400;color:var(--muted)}
.acesso .card{padding:20px 20px 16px}
.acesso .card > h2{font-size:17px;margin-bottom:6px}
.acesso .campos{grid-template-columns:1fr;gap:10px;margin-top:10px}
.acesso .campo input{font-size:15px;padding:10px 12px}
.acesso .btn-largo{width:100%;justify-content:center;margin-top:4px;padding:11px}
.acesso .mostrar{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--text-2);margin-top:-2px;cursor:pointer}
.acesso .mostrar input{accent-color:var(--accent)}
.acesso .erro-form{display:block;margin-top:-2px}
.acesso .erro-form:empty{display:none}   /* sem erro, não reserva espaço */
.acesso .aviso-ok{display:block;margin-top:-2px;font-size:12.5px;color:var(--bom-ink)}
.acesso-links{display:flex;flex-direction:column;align-items:center;gap:7px;margin-top:14px}
.acesso-links:empty{display:none}
.acesso-links button{color:var(--accent-ink);font-size:13.5px;text-decoration:underline;text-underline-offset:3px}
.acesso-links button:hover{color:var(--text)}
.acesso .regra{font-size:12px;color:var(--muted);margin-top:4px}
/* o convite para quem ainda não tem conta, no cartão de Entrar */
.acesso-novo{margin-top:16px;padding-top:14px;border-top:1px solid var(--grade);text-align:center}
/* no Entrar: "mostrar a senha" e "Esqueci minha senha" na mesma linha, logo abaixo da senha */
.acesso-linha{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:-2px}
.acesso-linha .mostrar{margin-top:0}
.acesso-linha button,.acesso-novo .link-apr{color:var(--accent-ink);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.acesso-linha button:hover,.acesso-novo .link-apr:hover{color:var(--text)}
.acesso-novo .link-apr{display:inline-block;margin-top:10px}
.acesso-novo p{margin:0 0 9px;font-size:12.5px;color:var(--muted)}
.acesso .acesso-novo .btn-largo{margin-top:0}
/* A APRESENTAÇÃO (pedido do Pedro, 04/11): o que aparece toda vez que se abre
   o app sem estar na conta. Uma prévia PARCIAL do sistema (a tela Hoje desenhada com
   dados de exemplo, que se apaga embaixo) e os botões de cadastrar e de entrar. */
.acesso.apresentando{padding-top:5vh}
.vis{width:100%;max-width:980px}
.vis-topo{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:34px;align-items:center}
.vis-texto h2{font-size:31px;line-height:1.2;font-weight:680;letter-spacing:-.7px;margin:4px 0 12px}
.vis-texto h2 em{font-style:normal;color:var(--accent-ink)}
.vis-texto > p{font-size:15px;color:var(--text-2);margin:0 0 20px;max-width:440px}
.vis-acoes{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.vis-acoes .btn{padding:11px 20px}
.vis-nota{font-size:12.5px;color:var(--muted);margin-top:12px}
/* a janela de mentira com a tela Hoje */
.vis-previa{position:relative;border:1px solid var(--border);border-radius:14px;background:var(--bg);
  box-shadow:0 18px 50px rgba(60,60,50,.13),var(--shadow);overflow:hidden;height:430px;user-select:none;pointer-events:none}
.vis-previa::after{content:"";position:absolute;left:0;right:0;bottom:0;height:150px;
  background:linear-gradient(to bottom,transparent,var(--bg) 88%)}
.vis-barra{display:flex;align-items:center;gap:6px;padding:9px 12px;background:var(--surface-2);border-bottom:1px solid var(--border)}
.vis-barra i{width:9px;height:9px;border-radius:50%;background:var(--surface-3)}
.vis-barra span{margin-left:10px;font-size:11px;color:var(--muted);background:var(--surface);border-radius:6px;padding:1px 10px}
.vis-tela{padding:12px 13px;font-size:11.5px;line-height:1.45}
.vis-abas{display:flex;gap:4px;margin-bottom:11px;overflow:hidden}
.vis-abas b{flex:none;font-weight:400;font-size:12px;padding:3px 9px;border-radius:7px;color:var(--text-2);background:var(--surface)}
.vis-abas b.on{background:var(--accent-forte);color:#fff}
html[data-tema="escuro"] .vis-abas b.on{color:#1b2224}
.vis-grade{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:9px}
.vis-c{background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 10px}
.vis-c h4{margin:0 0 6px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:6px}
.vis-c h4::before{content:"";width:3px;height:11px;border-radius:2px;background:var(--accent)}
.vis-crono{border-color:var(--accent);background:var(--accent-soft);display:flex;align-items:center;gap:10px;grid-column:1/-1}
.vis-crono strong{font-size:24px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.vis-crono small{display:block;color:var(--muted);font-size:10px}
.vis-crono .pulso{width:7px;height:7px}
.vis-item{display:flex;align-items:center;gap:7px;padding:5px 0;border-top:1px solid var(--grade)}
.vis-item:first-of-type{border-top:0}
.vis-item .ck{flex:none;width:12px;height:12px;border-radius:4px;border:1.5px solid var(--campo-borda)}
.vis-item .ck.ok{background:var(--accent-forte);border-color:var(--accent-forte)}
.vis-item span{font-weight:550;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vis-item em{flex:none;font-style:normal;font-size:9px;font-weight:550;padding:0 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2)}
.vis-item em.rev{background:var(--star-soft);color:var(--star-ink)}
.vis-item em.atr{background:var(--critico-soft);color:var(--critico-ink)}
.vis-meta{height:7px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin:4px 0 3px}
.vis-meta i{display:block;height:100%;width:64%;background:var(--accent-forte);border-radius:4px}
.vis-num{display:flex;justify-content:space-between;color:var(--muted);font-size:10px}
.vis-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:4px}
.vis-cal i{aspect-ratio:1;border-radius:3px;background:var(--seq1)}
.vis-cal i.n2{background:var(--seq2)} .vis-cal i.n3{background:var(--seq3)} .vis-cal i.n4{background:var(--seq4)}
.vis-cal i.n0{background:var(--surface-2)}
.vis-barras div{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10px;color:var(--text-2)}
.vis-barras span{width:72px;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vis-barras i{height:7px;border-radius:3px}
/* o que dá para fazer, em seis quadros */
.vis-recursos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:40px}
.vis-recursos .card{margin:0;padding:15px 16px}
.vis-recursos h3{font-size:15px;font-weight:600;margin:0 0 4px;display:flex;align-items:center;gap:9px}
.vis-recursos h3 i{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  font-style:normal;font-size:14px;background:var(--accent-soft);color:var(--accent-ink)}
.vis-recursos p{margin:0;font-size:13px;color:var(--text-2);line-height:1.5}
.vis-passos{margin-top:28px;text-align:center}
.vis-passos h3{font-size:17px;margin-bottom:12px}
.vis-passos ol{list-style:none;padding:0;margin:0 auto 20px;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;max-width:760px}
.vis-passos li{flex:1 1 160px;font-size:13px;color:var(--text-2);background:var(--surface);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;text-align:left}
.vis-passos li b{display:block;color:var(--accent-ink);font-weight:600}
.vis-passos .vis-acoes{justify-content:center}
@media (max-width:820px){
  .vis-topo{grid-template-columns:minmax(0,1fr);gap:24px}
  .vis-texto{text-align:center;order:-1}
  .vis-texto > p{margin-left:auto;margin-right:auto}
  .vis-acoes{justify-content:center}
  .vis-texto h2{font-size:26px}
  .vis-previa{height:360px}
  .vis-recursos{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:520px){
  .vis-recursos{grid-template-columns:minmax(0,1fr)}
  .vis-grade{grid-template-columns:minmax(0,1fr)}
  .vis-acoes .btn{flex:1 1 100%;justify-content:center}
}
.overlay-topo{z-index:60}                 /* a pergunta curta fica por cima da tela sobreposta */
.modal-pequeno{max-width:440px}
/* revisão bloqueada até a prova (as personalizadas mandam até lá): apagada e sem ação */
.item.bloqueada{opacity:.5;filter:grayscale(.6)}
.item.bloqueada .check{cursor:not-allowed}
.selo-bloq{font-weight:600;white-space:nowrap}
/* a dificuldade na linha do conteúdo (aba Disciplinas): pequena, como os botões ao lado */
.sel-dif-cont{font-size:12px;padding:3px 22px 3px 8px;border-radius:6px;width:124px;flex:none;align-self:center}
@media (pointer:coarse){ .sel-dif-cont{font-size:16px;padding:5px 22px 5px 8px;width:146px} }
.escolhas{display:flex;flex-direction:column;gap:8px}
.escolhas .btn{width:100%;justify-content:center}
.mais-datas{margin-top:8px}
.mais-datas summary{cursor:pointer;font-size:13px;color:var(--accent-ink);font-weight:600;padding:4px 0}
.mais-datas-corpo{display:flex;flex-direction:column;align-items:flex-start;gap:8px;margin-top:6px}
.mais-datas .cadeia{gap:6px;flex-wrap:nowrap;align-items:center;font-size:13px;color:var(--text-2)}
.mais-datas .cadeia input{width:58px;flex:none}
.btn.perigo{background:var(--critico);border-color:var(--critico);color:#fff}   /* o botão de uma confirmação destrutiva */
html[data-tema="escuro"] .btn.perigo{color:#fff}
.modal-pequeno .conteudo{padding:16px}
.modal-pequeno input{font-size:15px;padding:10px 12px}
.modal.grande > .conteudo{padding:18px 20px 16px}
.modal.grande.com-rodape > .acoes-form{padding:12px 20px 16px}
.modal header{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);
  background:var(--surface);z-index:2}
.modal header h3{font-size:15px;font-weight:600;margin-right:auto;display:flex;align-items:center;gap:9px}
.modal header h3::before{content:"";flex:none;width:3px;height:15px;border-radius:2px;background:var(--accent)}
.modal .conteudo{padding:16px}
/* --- faixas de edição: mesma paleta do editor de card de revisão --- */
.faixa-edicao{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--accent);color:var(--accent-ink);border-radius:9px;padding:8px 12px;font-size:13px;margin-bottom:14px}
.faixa-edicao b{font-weight:600}
.faixa-edicao .spacer{margin-left:auto}
/* --- histórico: linha destacada enquanto o registro está em edição --- */
tbody tr.editando-linha{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent-ink)}
.act.excluir{color:#b3312f}                 /* um vermelho mais fechado que --critico: 4,1 → 5,3:1 no fundo rosado */
.act.excluir:hover{background:rgba(208,59,59,.12);color:var(--critico)}
/* EXCLUIR NAS TELAS DE EDIÇÃO (sessão, item da agenda, anotação, lançamento):
   sempre no canto inferior direito do rodapé, com cara de botão e em vermelho —
   antes era um link miúdo que caía para a linha de baixo no celular (26/09). */
.acoes-form .excluir-tela{margin-left:auto;padding:8px 15px;border-radius:9px;font-size:13.5px;font-weight:600;
  color:#b3312f;background:rgba(208,59,59,.09);border:1px solid rgba(208,59,59,.5)}
.acoes-form .excluir-tela:hover{background:var(--critico);border-color:var(--critico);color:#fff}
/* a mensagem de erro do formulário sobe para cima dos botões, sem empurrá-los */
.acoes-form:has(.excluir-tela) .erro-form{order:-1;flex:1 1 100%}
.acoes-form:has(.excluir-tela) .erro-form:empty{display:none}
@media (max-width:620px){
  .acoes-form .so-largo{display:none}      /* rótulo curto no celular, para o Excluir caber na linha */
  .acoes-form:has(.excluir-tela){flex-wrap:nowrap;gap:6px}
  .acoes-form:has(.excluir-tela):has(.erro-form:not(:empty)){flex-wrap:wrap}
  .acoes-form:has(.excluir-tela) .btn,.acoes-form .excluir-tela{padding:7px 10px;font-size:12.5px;white-space:nowrap}
}
/* --- cronômetro de estudo --- */
.crono{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--accent-soft);
  border:1px solid var(--accent);border-radius:11px;padding:13px 15px}
.crono-tempo{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--accent-ink);line-height:1.1}
.crono-info{display:flex;flex-direction:column;line-height:1.35;margin-right:auto}
.crono-info b{font-weight:600;font-size:14px}
.crono-info span{font-size:12px;color:var(--muted)}
.faixas{display:flex;gap:5px;flex-wrap:wrap;align-items:baseline;margin-top:3px}
.crono .faixa,.faixa-edicao .faixa{padding:1px 8px;font-size:12px}
.faixa.agora{background:var(--accent-forte);border-color:var(--accent-forte);color:#fff;font-weight:550}
html[data-tema="escuro"] .faixa.agora{color:#1b2224}
.pulso{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--critico);margin-right:7px;
  animation:pisca 1.6s ease-in-out infinite;vertical-align:middle}
@keyframes pisca{0%,100%{opacity:1}50%{opacity:.25}}
/* aba escondida: as animações sem fim param (ver marcarAbaOculta) */
html.aba-oculta .pulso,html.aba-oculta .girando{animation-play-state:paused}
/* O MEIO DO CABEÇALHO: a contagem da prova e, embaixo dela, o cronômetro rodando.
   Na versão web (cabeçalho em três colunas), quando o cronômetro aparece, a
   contagem sobe um pouco e o conjunto não empurra as abas para baixo. */
.centro{display:flex;flex-direction:column;align-items:center;gap:6px}
#cronoChip:empty{display:none}
@media (min-width:1061px){
  .centro.com-crono{margin:-15px 0 -14px;gap:4px}
  .centro .crono-chip .encerrar{padding:1px 7px}
}
/* o cronômetro rodando, no cabeçalho: um pouco menor (pedido do Pedro, 25/09) — web e celular */
.crono-chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;
  background:var(--accent-forte);border:1px solid var(--accent-forte);color:#fff;font-size:11.5px;max-width:230px}
.crono-chip .nome{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.crono-chip b{font-variant-numeric:tabular-nums;font-size:12.5px}
.crono-chip .encerrar{color:#fff;opacity:.85;font-size:11px;padding:1px 7px;border-radius:6px;background:rgba(255,255,255,.18)}
.crono-chip .encerrar:hover{opacity:1;background:rgba(255,255,255,.3)}
/* No escuro o verde da marca é claro: texto branco dava 2,5:1 (e "encerrar" 2,1:1).
   Texto escuro, como a contagem da prova logo acima. */
html[data-tema="escuro"] .crono-chip{color:#1b2224}
html[data-tema="escuro"] .crono-chip .encerrar{color:#1b2224;opacity:1;background:rgba(0,0,0,.12)}
html[data-tema="escuro"] .crono-chip .encerrar:hover{background:rgba(0,0,0,.22)}
/* e o vermelho do "excluir" sobre o fundo escuro (2,85:1 → ~6:1) */
html[data-tema="escuro"] .act.excluir,
html[data-tema="escuro"] .acoes-form .excluir-tela{color:#f19a92}
html[data-tema="escuro"] .acoes-form .excluir-tela{border-color:rgba(241,154,146,.55);background:rgba(241,154,146,.1)}
html[data-tema="escuro"] .acoes-form .excluir-tela:hover{color:#fff}
.divisor{border:none;border-top:1px solid var(--border);margin:14px 0}
/* --- seletor de conteúdos (aba Aprendizados) --- */
.conteudos{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.chip-cont{display:inline-flex;align-items:center;gap:8px;padding:7px 13px;border-radius:10px;
  border:1px solid var(--border);background:var(--surface);transition:.15s;text-align:left;line-height:1.25}
.chip-cont:hover{border-color:var(--accent)}
.chip-cont[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.chip-cont b{font-weight:550;font-size:13.5px;color:var(--text);display:block}
.chip-cont small{font-size:11px;color:var(--muted);display:block}
.chip-cont[aria-pressed="true"] b{color:var(--accent-ink)}
.chip-cont .pin{min-width:18px;padding:1px 6px;border-radius:999px;background:var(--surface-2);color:var(--text-2);font-size:11px}
.chip-cont.novo{border-style:dashed;color:var(--muted);font-size:13px}
/* --- botão + e composição inline --- */
.btn-add{display:flex;align-items:center;gap:11px;width:100%;padding:13px 15px;border-radius:10px;
  border:1.5px dashed var(--accent);background:var(--accent-soft);color:var(--accent-ink);
  font-size:14px;font-weight:600;letter-spacing:-.1px;transition:.15s;margin-bottom:12px;text-align:left}
.btn-add .pista{font-weight:400;font-size:12.5px;color:var(--muted)}
.btn-add:hover{border-style:solid;border-color:var(--accent-forte);background:var(--accent-forte);color:#fff;
  box-shadow:0 2px 10px var(--brilho)}
.btn-add:hover .pista{color:rgba(255,255,255,.85)}
.btn-add:hover .mais{background:#fff;color:var(--accent-forte)}
.btn-add:hover .badge{background:rgba(255,255,255,.22);color:#fff}
html[data-tema="escuro"] .btn-add:hover{color:#1b2224}
html[data-tema="escuro"] .btn-add:hover .pista{color:rgba(0,0,0,.6)}
html[data-tema="escuro"] .btn-add:hover .mais{background:#1b2224;color:var(--accent)}
/* a versão menor, para ação que vive dentro de algo maior (o + conteúdo da aba Disciplinas) */
.btn-add.menor{display:inline-flex;width:auto;max-width:100%;padding:7px 12px;gap:8px;font-size:13px;border-radius:8px}
.btn-add.menor .pista{font-size:12px}
.btn-add:disabled{opacity:.6;cursor:not-allowed}
.btn-add:disabled:hover{border-style:dashed;border-color:var(--accent);background:var(--accent-soft);
  color:var(--accent-ink);box-shadow:none}
.btn-add:disabled:hover .pista{color:var(--muted)}
.btn-add .mais{display:grid;place-items:center;width:25px;height:25px;border-radius:8px;
  background:var(--accent-forte);color:#fff;font-size:17px;line-height:1;flex:none;transition:.15s}
html[data-tema="escuro"] .btn-add .mais{color:#1b2224}
.compositor{border:1px solid var(--accent);border-radius:10px;background:var(--surface);padding:10px 12px;margin-bottom:10px}
/* a caixa nasce PEQUENA — umas duas linhas — e CRESCE com o texto (ver
   crescerCaixa) até o teto; daí em diante rola. Crescer é o que resolve o
   Enter: com altura fixa o texto rolava dentro dela e parecia que a quebra
   não tinha pegado. */
.compositor textarea{width:100%;border:none;background:none;outline:none;resize:none;
  min-height:3.4em;max-height:52vh;overflow-y:auto;line-height:1.6}
/* a mesma regra na edição da anotação */
.campo textarea.cresce{min-height:4.2em;max-height:52vh;resize:none;overflow-y:auto}
.compositor textarea::placeholder{color:var(--muted)}
/* o rodapé é apoio, não conteúdo: linha miúda, colada na caixa */
.compositor .rodape{display:flex;align-items:center;gap:8px;margin-top:5px;flex-wrap:wrap}
.compositor .rodape .ajuda-composer{flex:1 1 200px;font-size:11px;line-height:1.3;
  color:var(--muted);max-width:100%}
.edicao{border:1px solid var(--accent);border-radius:10px;background:var(--surface);padding:13px;margin-bottom:9px}
/* --- Agenda, visão por assunto: cada conteúdo é um bloco fechado, não uma faixa separada por um fio --- */
.grupo-rev{border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);
  background:var(--surface-2);padding:12px 13px;margin-bottom:16px}
.grupo-rev:last-of-type{margin-bottom:4px}
.grupo-rev.tem-atraso{border-left-color:var(--critico)}
/* conteúdo ainda aberto: a barra lembra que ali a agenda é para voltar a estudar */
.grupo-rev.aberto{border-left-style:dashed}
.act.destaque{color:var(--accent-ink);background:var(--accent-soft);border:1px solid var(--accent)}
.grupo-rev .cab{gap:9px;margin-bottom:11px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.grupo-rev .cab strong{font-size:14.5px;font-weight:600;letter-spacing:-.2px}
.grupo-rev .item{margin-bottom:7px}
.grupo-rev .minimizar,.apr .minimizar{display:inline-flex;align-items:center;gap:7px;background:none;border:0;color:inherit;
  padding:3px 6px;margin-left:-6px;border-radius:6px;cursor:pointer;font:inherit;text-align:left}
.grupo-rev .minimizar:hover,.apr .minimizar:hover{background:var(--surface)}
.grupo-rev .minimizar .seta,.apr .minimizar .seta{flex:none;width:7px;height:7px;margin:0 3px 3px 2px;border-right:2px solid var(--accent-ink);
  border-bottom:2px solid var(--accent-ink);transform:rotate(45deg);transition:transform .15s}
.grupo-rev.minimizado .minimizar .seta,.apr.minimizado .minimizar .seta{transform:rotate(-45deg);margin:0 4px 0 1px}
/* bloco de anotações: o botão ocupa o lugar do nome; minimizado, some a borda de baixo do cabeçalho */
.apr .minimizar{margin-right:auto;min-width:0}
.apr.minimizado .apr-cab{border-bottom:none}
.grupo-rev.minimizado .cab{margin-bottom:0;padding-bottom:0;border-bottom:none}

/* --- o item do card de hoje leva ao original no cronograma --- */
.corpo.saltavel{cursor:pointer;border-radius:5px;margin:-3px -6px;padding:3px 6px;
  transition:background .12s ease}
.corpo.saltavel:hover,.corpo.saltavel:focus-visible{background:var(--accent-soft);outline:none}
.leva-a{color:var(--accent-ink);font-weight:600;white-space:nowrap}
.corpo.saltavel .leva-a{opacity:0;transition:opacity .12s ease}
.corpo.saltavel:hover .leva-a,.corpo.saltavel:focus-visible .leva-a{opacity:1}
@media (hover:none){.corpo.saltavel .leva-a{opacity:1}}   /* no toque não há hover: a pista fica à vista */
/* e, ao chegar, o item pisca para dizer "é este aqui" */
@keyframes acende{0%,100%{box-shadow:0 0 0 0 transparent}
  15%,70%{box-shadow:0 0 0 3px var(--accent)}}
.item.rev-linha.realce{animation:acende 2s ease-out}
@media (prefers-reduced-motion:reduce){.item.rev-linha.realce{animation:none;box-shadow:0 0 0 3px var(--accent)}}
/* a linha da sessão, na chegada vinda do cronômetro: o fundo acende e apaga */
@keyframes acendeLinha{0%,100%{background:transparent}15%,70%{background:var(--accent-soft)}}
tbody tr.realce td{animation:acendeLinha 2.2s ease-out}
@media (prefers-reduced-motion:reduce){tbody tr.realce td{animation:none;background:var(--accent-soft)}}

/* --- gráfico das questões dia a dia --- */
.grafico-q{position:relative;margin:2px 0 4px}
.grafico-q svg{display:block;overflow:visible}
.grafico-q .alvo-dia{cursor:default}
.grafico-q .alvo-dia:hover{fill:var(--surface-2);fill-opacity:.5}
.dica-grafico{position:absolute;z-index:5;pointer-events:none;transform:translate(-50%,-100%);
  background:var(--text);color:var(--surface);border-radius:7px;padding:6px 9px;font-size:11.5px;
  line-height:1.45;white-space:nowrap;box-shadow:var(--shadow)}
.dica-grafico b{font-weight:650}
.dica-grafico i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;
  vertical-align:baseline}
.legenda-q{gap:14px;font-size:12px;color:var(--text-2);margin-top:2px;flex-wrap:wrap}
.legenda-q i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.legenda-q span{display:inline-flex;align-items:center}

/* --- atividade da revisão em destaque (bloco quadrado, largura toda) --- */
.item.rev-linha{flex-direction:column;align-items:stretch;gap:0}
.rev-topo{display:flex;gap:11px;align-items:flex-start;width:100%}
.ativ{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;width:100%;margin-top:10px;
  padding:9px 13px;border-radius:0;background:var(--accent-soft);border:1px solid var(--accent);
  border-left-width:4px;line-height:1.35;box-sizing:border-box}
.ativ .nome{font-size:14px;font-weight:650;color:var(--accent-ink)}
.ativ .det{font-size:13px;color:var(--text-2)}
.item.hoje .ativ{background:var(--surface)}
.item.feita .ativ{background:var(--surface-2);border-color:var(--border);border-left-color:var(--bom)}
.item.feita .ativ .nome{color:var(--text-2)}
.aprendizado{font-size:14.5px;line-height:1.55}
.detalhe{margin-top:5px;font-size:13.5px;color:var(--text-2)}
.detalhe b{font-weight:550}
/* texto formatado da anotação: a quebra de linha vira bloco, não some */
.aprendizado p,.detalhe p{margin:0 0 7px}
.aprendizado p:last-child,.detalhe p:last-child{margin-bottom:0}
.aprendizado ul,.detalhe ul{margin:5px 0;padding-left:20px}
.aprendizado li,.detalhe li{margin:2px 0}
.aprendizado li > ul,.detalhe li > ul{margin:2px 0;padding-left:18px}
.aprendizado ul ul,.detalhe ul ul{list-style:circle}
.aprendizado ul ul ul,.detalhe ul ul ul{list-style:square}
.aprendizado strong,.detalhe strong{font-weight:650}
.detalhe p:first-child{display:inline}          /* "O que me confundiu:" na mesma linha */
/* --- Anotações: um card por conteúdo, anotações empilhadas dentro --- */
.apr{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--accent);
  border-radius:var(--radius);margin-bottom:12px;overflow:hidden;box-shadow:0 1px 2px rgba(60,60,50,.05)}
.apr.tem-vespera{border-left-color:var(--star)}
.apr-cab{display:flex;align-items:center;gap:8px;padding:9px 13px;background:var(--chrome);
  border-bottom:1px solid var(--chrome-borda)}
.apr-cab .badge{background:var(--campo-fundo)}     /* etiqueta neutra não some no verde */
.apr-origem{display:flex;flex-direction:column;line-height:1.2;min-width:0}
.apr-origem b{font-size:14.5px;font-weight:650;letter-spacing:-.2px;color:var(--text);
  overflow-wrap:anywhere}          /* quebra a linha em vez de cortar com "…" (no celular sumia o fim do nome) */
.apr-origem span{font-size:11px;color:var(--text-2);text-transform:uppercase;letter-spacing:.5px;margin-top:2px}
.apr-item{border-left:3px solid var(--border);padding:11px 13px}
.apr-item + .apr-item{border-top:1px solid var(--grade)}
.apr-item.marcado{background:var(--star-soft)}
.apr-item.em-edicao{padding:11px 13px;background:var(--accent-soft)}
.apr-item.em-edicao .edicao{margin-bottom:0}
.apr-topo{display:flex;align-items:flex-start;gap:8px}
/* a alça de reordenar: discreta até o card receber o ponteiro */
.apr-item .arrasta{cursor:grab;padding:0 5px;line-height:1.5;color:var(--muted);
  opacity:0;transition:opacity .12s ease}
.apr:hover .arrasta,.apr-item .arrasta:focus-visible{opacity:1}
.apr-item .arrasta:active{cursor:grabbing}
.apr-item[draggable="true"]{cursor:grabbing}
.apr-item.arrastando{opacity:.45;background:var(--accent-soft)}
@media (hover:none){.apr-item .arrasta{opacity:1}}   /* no toque não há hover */
/* ↑ ↓ de reordenar: só em tela de toque, no lugar da alça de arrastar */
.setas-toque{display:none;flex:none;gap:2px}
@media (pointer:coarse){ .so-teclado{display:none} }   /* dica de atalho de teclado: some no toque */
.so-celular{display:none}                  /* botões que só existem no celular (ver @media 620px) */
@media (max-width:620px){ .so-celular{display:inline-flex} }
.setas-toque .act{font-size:16px;line-height:1;padding:6px 9px;border:1px solid var(--border);background:var(--surface)}
@media (pointer:coarse){
  .setas-toque{display:inline-flex}
  .apr-item .arrasta,.mural-item .arrasta{display:none}
}
/* ÁREA DE TOQUE (revisão de UX, 26/09). Medido a 390px: o ✓ tinha 19×19, o ✕ da
   etiqueta 17×17, a estrela 31×21, "editar"/"renomear" ~25 de altura. O desenho
   fica igual; o que cresce é a área que recebe o dedo — uma camada invisível em
   volta (::before), perto dos 44px recomendados. Só em tela de toque. */
@media (pointer:coarse){
  .check::before{content:"";position:absolute;inset:-13px}
  .act,.ren,.cal-nav,.tag [data-acao="remover-assunto"]{position:relative}
  .act::before,.ren::before,.cal-nav::before,.tag [data-acao="remover-assunto"]::before{content:"";position:absolute;inset:-9px -3px}
  .cal-nav::before,.tag [data-acao="remover-assunto"]::before,.ren::before{inset:-11px}
  .icon-btn{width:42px;height:42px}
  .centro .crono-chip .encerrar,.crono-chip .encerrar{padding:6px 11px;font-size:12px}
  .setas-toque .act{min-width:40px;min-height:38px}
}
/* mural "Falta estudar" (aba Hoje): uma linha por conteúdo, alça sempre visível */
.mural-lista{display:flex;flex-direction:column}
.mural-item{display:flex;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--border)}
.mural-item:last-child{border-bottom:none}
.mural-item .arrasta{cursor:grab;padding:0 5px;line-height:1.5;color:var(--muted)}
.mural-item .arrasta:active{cursor:grabbing}
.mural-item.arrastando{opacity:.45;background:var(--accent-soft)}
.mural-nome{display:flex;flex-direction:column;align-items:flex-start;gap:4px;min-width:0}   /* etiqueta sempre embaixo do nome */
.mural-item [data-acao="estudar-afazer"]{white-space:nowrap;flex:none}                        /* "▶ estudar" numa linha só */
.mural-nome b{font-weight:550;color:var(--text)}
.apr-texto{flex:1;min-width:0}
.apr-texto .detalhe{margin-top:9px;padding-top:8px;border-top:1px dashed var(--grade)}
.apr-pe{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:9px}
/* com "juntar tudo", cada anotação carrega a própria data, miúda, à esquerda da estrela */
.apr-data{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;
  padding:4px 0;align-self:flex-start}
/* revisão sendo cronometrada agora: pulsa de leve, como o chip do cronômetro */
.item.em-andamento{border-left-color:var(--accent-forte);box-shadow:0 0 0 2px var(--brilho)}
.item.em-andamento .titulo::before{content:"⏱ ";font-size:12px}
.act.ordem-taxa{font-size:14px;line-height:1;color:var(--muted);padding:3px 8px}
.act.estrela{font-size:15px;line-height:1;color:var(--muted);padding:3px 8px}
.act.estrela.on{color:var(--star)}
.act.estrela:hover{color:var(--star);background:var(--star-soft)}
/* informações da sessão, dentro da tela de edição */
.info-extra{background:var(--surface-2);border:1px solid var(--border);border-radius:10px;
  padding:11px 13px;margin-bottom:14px}
.info-extra .rot-info{font-size:11px;font-weight:650;color:var(--accent-ink);text-transform:uppercase;
  letter-spacing:.5px;display:block;margin-bottom:8px}
.linha-info{display:flex;gap:10px;align-items:baseline;font-size:13px;padding:3px 0;flex-wrap:wrap}
.linha-info > span{min-width:150px;font-size:12px;color:var(--text-2)}
.linha-info > div{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;flex:1;min-width:180px}
.linha-info .meta{font-size:12px;color:var(--text-2)}
.faixa{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--surface);
  border:1px solid var(--accent);color:var(--accent-ink);font-size:12.5px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
/* barra de formatação do campo de texto */
.fmt{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.fmt .act{min-width:30px;text-align:center;border:1px solid var(--campo-borda);background:var(--campo-fundo);
  color:var(--text-2);font-size:12.5px;line-height:1.4}
.fmt .act:hover{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}
/* o I do itálico com serifa, como nos editores de texto — sem serifa, inclinado,
   ele parecia uma barra "/" e ninguém sabia o que o botão fazia */
.fmt .fmt-i{font-family:Georgia,"Times New Roman",serif;font-style:italic;font-weight:600;font-size:14px;line-height:1}
.fmt .dica-fmt{font-size:11px;color:var(--muted);margin-left:auto}
.fmt .sep-fmt{width:1px;height:18px;background:var(--border);margin:0 3px}
.fmt .act.cor{display:inline-flex;align-items:center;gap:5px;padding:3px 7px}
