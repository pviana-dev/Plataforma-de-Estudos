}
async function separarConteudoPerguntando(disc, nome){
  const ficha = fichaDoNome(disc, nome);
  if (!ficha || !(ficha.juntados || []).length) return;
  const nomes = ficha.juntados.map(j => j.nome);
  const lista = nomes.slice(0, -1).join(", ") + " e " + nomes[nomes.length - 1];
  const ok = await confirmar({ titulo: "Separar", botao: "Separar",
    texto: "Separar “" + ficha.nome + "” de volta em " + lista + "?\n\n" +
           (ficha.fase === "concluido"
             ? "Como ele está concluído, todos voltam concluídos."
             : "Cada um volta como estava antes de juntar.") +
           " O que foi feito como “" + ficha.nome + "” continua com esse nome." });
  if (!ok) return;
  separarConteudo(ficha);
  persistir(); render();
  toast("Separado: " + lista + " voltaram, cada um com o próprio card.");
}
async function editarConteudo(disc, antigo){
  const ficha = acharConteudo(disc, antigo);
  if (!ficha) return;
  const res = await pedirValor({ titulo: "Editar conteúdo", rotulo: "Nome do conteúdo",
    texto: fraseAlcance(disc, antigo), valor: antigo, maxlength: 120, botao: "Salvar",
    extra: { rotulo: "Excluir", ao: () => excluirConteudoPerguntando(disc, antigo) },
    depois: htmlJanelaConteudo(ficha),
    aoAbrir: (f, fechar) => {
      const chave = f.querySelector('[name="autoConteudo"]'), painel = f.querySelector("#painelAutoConteudo");
      // o painel aparece quando a chave muda: ao desligar (manter/desabilitar) ou ao religar (a partir de quando)
      const crono = f.querySelector("#cronogramaConteudo");
      if (chave && painel){ const antes = chave.checked; chave.addEventListener("change", () => {
        painel.classList.toggle("aberto", chave.checked !== antes);
        if (crono) crono.hidden = !chave.checked;   // desligando, não há cronograma a escolher
      }); }
      if (crono){
        const bloco = crono.querySelector(".bloco-escada");
        const previa = () => {
          const passos = lerPassos(bloco);
          pintarDatas(bloco, passos ? previaDoCronograma([ficha], ([c]) => { definirEscada(c, passos); reespacarEscada(c); })[0] : []);
        };
        ligarEditoresEscada(crono, () => passosSugeridos(ficha), previa);
        previa();
      }
      const ate = f.querySelector('[data-dialogo="ate-prova"]');
      if (ate) ate.onclick = ev => { ev.stopPropagation(); fechar(); modalRevisoesProva(ficha); };
    },
    ler: f => {
      const chave = f.querySelector('[name="autoConteudo"]');
      const escolha = f.querySelector('[name="jaNaAgendaConteudo"]:checked');
      const desde = f.querySelector('[name="religarDesde"]');
      const bloco = f.querySelector("#cronogramaConteudo .bloco-escada");
      return { auto: chave ? chave.checked : null, apagar: !!escolha && escolha.value === "desabilitar",
               desde: desde ? desde.value : "", passos: bloco ? lerPassos(bloco) : null };
    },
    validar: v => {
      if (!v) return "Escreva o nome.";
      if (acharConteudo(disc, v) && v.toLowerCase() !== antigo.toLowerCase()) return "Já existe um conteúdo com esse nome nesta disciplina.";
      const bloco = document.querySelector("#formDialogo #cronogramaConteudo:not([hidden]) .bloco-escada");
      return bloco && !lerPassos(bloco) ? "Cada revisão precisa de 1 a 999 dias, e a quantidade vai de 1 a " + MAX_ESCOLHA + "." : "";
    } });
  if (!res) return;
  const avisos = [];
  if (res.extra.auto === false && !ficha.semAutomaticas){
    desligarAutomaticasDoConteudo(ficha, res.extra.apagar);
    avisos.push("revisões automáticas desligadas" + (res.extra.apagar ? " — as pendentes foram desabilitadas" : " — as pendentes passaram a ser suas"));
  } else if (res.extra.auto === true && ficha.semAutomaticas){
    religarAutomaticasDoConteudo(ficha, res.extra.desde);
    avisos.push("revisões automáticas religadas" + (inicioDasAutomaticas(ficha) ? " a partir de " + D.br(ficha.automaticasDesde) : ""));
  }
  const atuais = passosDe(degrausDaFicha(ficha)), novos = res.extra.passos;
  if (res.extra.auto && !ficha.semAutomaticas && novos && JSON.stringify(novos) !== JSON.stringify(atuais)){
    definirEscada(ficha, novos);
    reespacarEscada(ficha);
    juntarIrmas();
    avisos.push("cronograma das revisões: " + plural(novos.length, "revisão", "revisões") +
                (escadaValida(ficha.escada) ? "" : " (a sugestão pela dificuldade)"));
  }
  if (res.valor !== antigo){
    renomearConteudo(disc, antigo, res.valor);
    avisos.unshift("renomeado em todo o sistema");
  }
  if (!avisos.length) return;
  persistir(); render();
  const frase = avisos.join("; ");
  toast(frase.charAt(0).toUpperCase() + frase.slice(1) + ".");
}

/* O LEMBRETE SE RESOLVE SOZINHO. A agenda não é uma lista de tarefas a marcar:
   ela aponta quando voltar a um conteúdo. Registrada uma sessão daquele
   conteúdo, o lembrete vencido dali se dá por cumprido e o próximo nasce a
   partir deste dia — sem você registrar a mesma coisa duas vezes.
   Só entra o que já venceu: estudar hoje não consome uma revisão marcada para
   daqui a três semanas, que ainda tem função.                               */
function resolverLembrete(reg, escolhidos){
  if (!reg || ehRevisaoSessao(reg) || planoDe(reg) === "sem") return null;
  /* O item é cumprido quando a sessão cobre TODOS os conteúdos dele — conta o
     conteúdo, não a sessão dona. Vale também para a revisão marcada à mão:
     ela faz parte da mesma fila e anda junto com a escada. */
  const candidatos = db.revisoes.filter(r => {
    if (r.feita || r.sessaoId) return false;
    if (r.data > reg.data) return false;                     // ainda não venceu
    const ctx = contextoRevisao(r);
    if (!ctx || ctx.disciplina !== reg.disciplina || !(ctx.assuntos || []).length) return false;
    return ctx.assuntos.every(a => temAssunto(reg, chaveAssunto(ctx.disciplina, a)));
  }).sort((a,b) => a.data.localeCompare(b.data));
  if (!candidatos.length) return null;
  const alvo = candidatos[0];            // uma sessão fecha um lembrete: o mais antigo
  ligarSessaoRevisao(reg, alvo);
  cumprirJuntas(reg, null, escolhidos);  // e o dos outros conteúdos da sessão
  gerarRevisoes(reg, { base: reg.data });                    // e o próximo nasce daqui
  return alvo;
}
/* GARANTIA DE CONTINUIDADE. Conteúdo aberto sem nenhum item na agenda some do
   radar: nada chama de volta e o estudo simplesmente para. Isso acontece por
   caminhos que ninguém percebe — a última volta foi excluída à mão, um backup
   antigo veio com tudo feito, a fila esvaziou num replanejamento. Esta função
   varre os conteúdos abertos e devolve a volta que falta, com a mesma cadência
   de sempre (diasDaVolta: dificuldade e tempo até a prova, ou o que você escolheu), contada de hoje.
   Não mexe em quem pediu para não ser lembrado: sessão marcada "sem revisão"
   ou com plano manual é escolha sua, e continua valendo.                     */
/* UM CONTEÚDO ABERTO, UMA VOLTA SÓ. Esta é a invariante da agenda de conteúdo
   em andamento: se um assunto já tem quem o chame de volta, ninguém marca uma
   segunda — feita a primeira, a seguinte nasce dali.

   Antes a conta era por SESSÃO, e duas sessões que falavam do mesmo assunto
   com listas diferentes ([LAI] e [LAI, Licitações]) eram "coisas distintas":
   cada uma abria a própria volta e o conteúdo era chamado duas vezes.
   Agora a conta é por CONTEÚDO — e a volta que nasce leva só os assuntos que
   ainda estavam descobertos. */
function conteudosSemVolta(reg, ignorarId){
  /* Conta como coberto QUALQUER item pendente que fale do conteúdo — volta,
     revisão da escada ou revisão marcada à mão. O que não pode acontecer é o
     assunto ficar fora do radar; havendo o que fazer com ele, não se marca mais
     nada. (É também o que evita uma volta nascer ao lado de uma revisão que
     você mesmo agendou.) */
  const cobertos = new Set();
  db.revisoes.forEach(r => {
    if (r.feita || r.id === ignorarId) return;
    const ctx = contextoRevisao(r); if (!ctx) return;
    (ctx.assuntos || []).forEach(a => cobertos.add(chaveAssunto(ctx.disciplina, a)));
  });
  return conteudosDoAlvo(reg)
    .filter(c => c.fase !== "concluido")            // conteúdo fechado tem escada, não volta
    .map(c => c.nome)
    .filter(n => !cobertos.has(chaveAssunto(reg.disciplina, n)));
}

/** a sessão pode receber volta? (as guardas que valem nos dois caminhos) */
function agendaVolta(reg){
  if (ehRevisaoSessao(reg)) return false;           // sessão de revisão não agenda
  const plano = planoDe(reg);
  if (plano === "sem" || plano === "manual") return false;   // você pediu para não lembrar
  return temCadastro(reg);                          // conteúdo excluído do cadastro não agenda
}

/** marca a volta daquela sessão, cobrindo só os conteúdos passados */
function marcarVolta(reg, conteudos, base){
  /* conteúdo que veio junto (Estudar junto) volta no ritmo dele, não no do card principal */
  /* e o juntado, numa sessão de antes da junção, no ritmo do conteúdo juntado */
  const daFicha = acharConteudo(reg.disciplina, conteudos[0]);
  const ficha = daFicha && (grupoNaSessao(reg, conteudos[0]) || !depoisDaJuncao(daFicha, reg)) ? daFicha : null;
  const nivel = ficha ? dificuldadeDaFicha(ficha) : dificuldadeDe(reg);
  const quando = foraDaProva(pularPassadas(base || (contarDoUltimoEstudo ? reg.data : D.hoje()), diasDaVolta(nivel)));
  if (quando > limiteDe(reg)) return null;          // o teto que você definiu manda
  /* Sem `disciplina`: ela vem da sessão dona (a volta sempre tem uma). Gravá-la
     aqui faria disciplinas() — que varre db.revisoes — manter viva a disciplina
     de uma sessão apagada. Só revisão AVULSA, sem sessão, carrega disciplina. */
  const nova = { id: uid(), registroId: reg.id, data: quando, ordem: 1, retomada: true,
                 assuntos: conteudos.slice(),
                 feita: false, feitaEm: null, minutos: null, questoes: null, acertos: null,
                 dificuldade: null, atividade: "", nota: "", manual: false };
  db.revisoes.push(nova);
  return nova;
}

function garantirRetomadas(){
  if (!autoContinuar()) return 0;
  let criadas = 0;
  /* Da mais RECENTE para a mais antiga: a sessão nova tem o contexto mais
     fresco, então é ela que fica com a volta dos conteúdos que ainda estão
     descobertos. O que sobrar cabe às antigas — e o que já estiver coberto
     não gera nada, que é o ponto. */
  db.registros.slice()
    .sort((a,b) => String(b.data).localeCompare(String(a.data)) || (b.criadoEm||0) - (a.criadoEm||0))
    .forEach(reg => {
      if (!agendaVolta(reg)) return;
      const faltando = conteudosSemVolta(reg);
      if (!faltando.length) return;                 // já há quem chame estes de volta
      separarPorCard(reg, faltando).forEach(lista => { if (marcarVolta(reg, lista)) criadas++; });
    });
  return criadas;
}
/** as sessões que falam destes conteúdos — é o alcance de fechar um deles */
function sessoesDoConteudo(disc, nomes){
  const alvo = new Set();
  (nomes || []).forEach(n => {
    alvo.add((n || "").toLowerCase());
    // o conteúdo juntado responde também pelas sessões dos que entraram nele
    const f = fichaDoNome(disc, n);
    if (f) nomesDaFicha(f).forEach(x => alvo.add(x.toLowerCase()));
  });
  return db.registros.filter(r => r.disciplina === disc &&
                                  assuntosDe(r).some(a => alvo.has(a.toLowerCase())));
}
/** fecha (ou reabre) um conteúdo: todas as sessões com aquele rótulo acompanham */
function concluirConteudo(disc, nome){ return marcarConteudos([acharConteudo(disc, nome)], "concluido"); }
function reabrirConteudo(disc, nome){ return marcarConteudos([acharConteudo(disc, nome)], "andamento"); }
/* EXCLUIR UM CONTEÚDO DO CADASTRO. O que some é a ficha e o que ele tem na
   AGENDA — revisões e voltas. O que NÃO some é o estudo: as sessões continuam
   registradas, inalteradas, com as horas, as questões e o nome do conteúdo
   escrito nelas. Apagar o cadastro é dizer "não quero mais ser cobrado disto",
   não "isto nunca aconteceu" — por isso a meta, a sequência e o total de horas
   não mudam de valor nenhum.

   Só saem da agenda os itens que falam SÓ deste conteúdo. Um card que cobre
   LAI e Licitações continua valendo por Licitações depois que LAI sai; matá-lo
   levaria junto o plano de um conteúdo que ninguém mandou apagar. */
function itensSoDesteConteudo(disc, nome){
  const alvo = (nome || "").toLowerCase();
  return db.revisoes.filter(rev => {
    const ctx = contextoRevisao(rev);
    if (!ctx || ctx.disciplina !== disc) return false;
    const nomes = (ctx.assuntos || []).map(a => (a || "").toLowerCase());
    return nomes.includes(alvo) && nomes.every(a => a === alvo);
  });
}
function excluirConteudo(disc, nome){
  const ficha = acharConteudo(disc, nome);
  const saindo = itensSoDesteConteudo(disc, nome);
  const ids = new Set(saindo.map(r => r.id));
  /* A sessão que cumpriu uma dessas revisões continua lá; o que ela perde é o
     vínculo, que apontaria para um item que não existe mais. */
  saindo.forEach(rev => esquecerRevisaoNaSessao(sessaoDaRevisao(rev), rev.id));
  db.revisoes = db.revisoes.filter(r => !ids.has(r.id));
  /* O card que fala também de outro conteúdo fica — mas sem o nome do que saiu:
     "LAI · Licitações" passa a ser "Licitações". O que já foi feito é história
     e continua como foi. */
  const alvo = (nome || "").toLowerCase();
  db.revisoes.forEach(r => {
    if (r.feita) return;
    const ctx = contextoRevisao(r);
    if (!ctx || ctx.disciplina !== disc) return;
    if (!ctx.assuntos.some(a => (a || "").toLowerCase() === alvo)) return;
    r.assuntos = ctx.assuntos.filter(a => (a || "").toLowerCase() !== alvo);
  });
  if (ficha) db.conteudos = conteudosCad().filter(c => c !== ficha);
  return { itens: saindo.length, sessoes: sessoesDoConteudo(disc, [nome]).length };
}

/* JUNTAR CONTEÚDOS (pedido do Pedro, 04/10; ver acharConteudo). Diferente do
   "Estudar junto" da sessão, que vale só para aquele dia, aqui a junção fica:
   daqui para a frente é um conteúdo só. Regras que ele escolheu:
   - fase: basta um em andamento para o juntado ficar em andamento;
   - ritmo: a dificuldade mais alta entre eles;
   - agenda: o que já foi feito fica como está; os cards PENDENTES deles dão
     lugar a um card só, na data do mais próximo, e o ritmo segue dali.
   Devolve a ficha nova. */
function juntarConteudos(fichas, nome){
  fichas = [...new Set((fichas || []).filter(Boolean))];
  if (fichas.length < 2 || !nome) return null;
  const disc = fichas[0].disciplina;
  const chaves = new Set(fichas.map(chaveDaFicha));
  const difs = fichas.filter(f => sessoesDaFicha(f).length || f.dificuldade).map(dificuldadeDaFicha);
  const fala = r => { const ctx = contextoRevisao(r);
                      return !!ctx && ctx.disciplina === disc && ctx.assuntos.some(a => chaves.has(chaveAssunto(disc, a))); };
  const pendentes = db.revisoes.filter(r => !r.feita && fala(r)).sort(porData);
  const proxima = pendentes.length ? pendentes[0].data : "";
  const daEscada = pendentes.find(r => !ehRetomada(r) && Number.isInteger(r.degrau));
  // os pendentes saem; card que fala também de outro conteúdo fica, só sem estes
  const saem = new Set();
  pendentes.forEach(r => {
    const resto = contextoRevisao(r).assuntos.filter(a => !chaves.has(chaveAssunto(disc, a)));
    if (resto.length) r.assuntos = resto; else saem.add(r.id);
  });
  db.revisoes = db.revisoes.filter(r => !saem.has(r.id));

  const aberto = fichas.some(f => f.fase !== "concluido");
  const agora = Date.now();
  const nova = { id: uid(), nome, disciplina: disc, fase: aberto ? "andamento" : "concluido",
                 concluidoEm: aberto ? null : (fichas.map(f => f.concluidoEm || "").sort().pop() || D.hoje()),
                 criadoEm: agora, juntadoEm: agora,
                 juntados: fichas.map(f => JSON.parse(JSON.stringify(f))) };
  if (difs.length) nova.dificuldade = Math.max.apply(null, difs);
  const dias = new Set(fichas.map(f => f.diaProva || ""));
  if (dias.size === 1 && fichas[0].diaProva) nova.diaProva = fichas[0].diaProva;
  if (fichas.every(f => f.semAutomaticas)) nova.semAutomaticas = true;
  const desde = fichas.map(inicioDasAutomaticas).sort().pop();
  if (desde && !nova.semAutomaticas) nova.automaticasDesde = desde;
  db.conteudos = conteudosCad().filter(c => !fichas.includes(c)).concat([nova]);

  // o card único, na data do mais próximo (sem sessão nenhuma, é "a estudar": nada a marcar)
  if (proxima && agendamentoAtivo()){
    const base = { id: uid(), assuntos: [nome], data: proxima, feita: false, feitaEm: null, minutos: null,
                   questoes: null, acertos: null, dificuldade: null, atividade: "", nota: "", manual: false };
    if (aberto){
      const dono = autoContinuar() && sessoesDaFicha(nova).find(agendaVolta);
      if (dono) db.revisoes.push(Object.assign(base, { registroId: dono.id, ordem: 1, retomada: true }));
    } else if (escadaAtiva(nova)){
      const dono = donoDaEscada(nova);
      const degraus = degrausDaFicha(nova);
      const k = Math.max(1, Math.min(daEscada ? daEscada.degrau : 1, degraus.length - 1));
      if (dono) db.revisoes.push(Object.assign(base, { registroId: dono.id, ordem: k, degrau: k,
                                                       passo: degraus[k] - degraus[k - 1] }));
    }
  }
  garantirAgenda();
  juntarIrmas();
  return nova;
}
/* SEPARAR O QUE FOI JUNTADO. O que foi feito como conteúdo juntado continua
   com o nome dele (as sessões não mudam). As fichas voltam como estavam antes
   da junção — a não ser que o juntado esteja concluído: aí todas voltam
   concluídas. Os cards pendentes viram um por conteúdo, na mesma data (o card
   de continuar vai para quem voltou aberto; o da escada, para quem voltou
   concluído; o que faltar, a garantia da agenda marca). Devolve as fichas. */
function separarConteudo(ficha){
  if (!ficha || !(ficha.juntados || []).length) return [];
  const chave = chaveDaFicha(ficha);
  const fechado = ficha.fase === "concluido";
  const voltam = ficha.juntados.map(j => {
    const c = JSON.parse(JSON.stringify(j));
    if (fechado && c.fase !== "concluido"){ c.fase = "concluido"; c.concluidoEm = ficha.concluidoEm || D.hoje(); }
    return c;
  });
  const pendentes = db.revisoes.filter(r => !r.feita && falaDe(r, chave));
  db.conteudos = conteudosCad().filter(c => c !== ficha).concat(voltam);
  const saem = new Set(), novos = [];
  pendentes.forEach(r => {
    const ctx = contextoRevisao(r);
    voltam.forEach(c => {
      if (ehRetomada(r) !== (c.fase !== "concluido")) return;
      novos.push(Object.assign({}, r, { id: uid(), assuntos: [c.nome] }));
    });
    // a sessão dona não junta os pedaços de novo (ver grupoDoCard)
    const dono = r.registroId ? acharRegistro(r.registroId) : null;
    if (dono) dono.separados = [...new Set((dono.separados || []).concat(voltam.map(c => c.nome.toLowerCase())))];
    const resto = ctx.assuntos.filter(a => chaveAssunto(ctx.disciplina, a) !== chave);
    if (resto.length) r.assuntos = resto; else saem.add(r.id);
  });
  db.revisoes = db.revisoes.filter(r => !saem.has(r.id)).concat(novos);
  garantirAgenda();
  juntarIrmas();
  return voltam;
}

/* "A ESTUDAR" é o conteúdo cadastrado que ainda não tem nenhuma sessão — o
   edital lançado de uma vez. Não é uma fase nova: sai da contagem de sessões,
   e some sozinho na primeira sessão. */
const aEstudar = c => !!c && c.fase !== "concluido" && !sessoesDoConteudo(c.disciplina, [c.nome]).length;
/** os conteúdos que "concluir disciplina" fecha: os abertos que já foram estudados */
const concluiveisDaDisciplina = disc =>
  conteudosDaDisciplina(disc).filter(c => c.fase !== "concluido" && !aEstudar(c));
/** fecha (ou reabre) a disciplina inteira, ficha por ficha. Fechar PULA o que
   está a estudar: concluir o que nunca foi estudado não diz nada — e o que foi
   estudado ganha a escada de revisões, como no ✓ de cada conteúdo. */
function concluirDisciplina(disc){ return marcarConteudos(concluiveisDaDisciplina(disc), "concluido"); }
function reabrirDisciplina(disc){ return marcarConteudos(conteudosDaDisciplina(disc), "andamento"); }
/** a sessão a que uma revisão pertence */
function donoDaRevisao(rev){
  if (!rev) return null;
  return acharRegistro(rev.registroId);
}

/* Mudou o horizonte (prova, teto ou religar): todo mundo é replanejado. As
   revisões FEITAS e as criadas À MÃO nunca são tocadas — inclusive as que
   estejam além do teto, que é o que evita o conflito entre o teto e o que você
   marcou de propósito. O que sai são as automáticas que não cabem mais.      */
function replanejarTudo(){
  /* A sessão em silêncio não é tocada — o que ela tem na agenda fica guardado
     até o último dia de prova. */
  db.revisoes = db.revisoes.filter(r => {
    if (r.feita || r.manual) return true;
    const dono = r.registroId ? acharRegistro(r.registroId) : null;
    if (dono && sessaoEmSilencio(dono)) return true;
    return r.data <= ultimoDiaRevisao() && !diaDeProva(r.data);
  });
  /* Da sessão mais antiga para a mais nova: a volta de um conteúdo fica com a
     última sessão dele (ver voltaEmAberto). Contando de hoje a ordem não pesava;
     contando do último estudo (replanejarAoReligar), pesa. */
  db.registros.slice().sort((a,b) => String(a.data).localeCompare(String(b.data)) || (a.criadoEm||0) - (b.criadoEm||0))
    .forEach(r => gerarRevisoes(r, { base: D.hoje(), manterAtrasadas: true }));
  garantirAgenda();
}
/* RELIGAR CONTA DO ÚLTIMO ESTUDO (pedido do Pedro, 07/10). Religado o automático,
   contar tudo de hoje punha a agenda inteira nos mesmos dias: todo card de
   continuar a N dias de hoje, toda revisão vencida hoje. Agora cada conteúdo
   conta do próprio último estudo (ou da conclusão / última revisão feita), e o
   que já passou conta como FEITO, sem marcar nada: o cronograma segue dali e
   só nasce a próxima data que ainda está por vir. Decisão dele: nem pilha de
   atrasados, nem espalhar à força. */
function replanejarAoReligar(){
  contarDoUltimoEstudo = true;
  try { replanejarTudo(); } finally { contarDoUltimoEstudo = false; }
  espalharCardsAoReligar();
}
/* O LIMITE POR DIA AO RELIGAR (pedido do Pedro, 07/10). Mesmo contando do último
   estudo, os cards de continuar caem perto (difícil volta a cada 1 dia, médio a
   cada 2): religar com muitos conteúdos abertos enchia hoje e amanhã. Cabe por
   dia a meta diária ÷ CONFIG.MINUTOS_POR_ITEM itens, contando tudo o que está no
   dia; o que passa disso vai para o dia seguinte com vaga. Só os cards de
   continuar automáticos andam — as revisões já se espalham pela escada e o que
   você marcou fica onde está. Os mais difíceis ficam primeiro. */
function espalharCardsAoReligar(){
  const hoje = D.hoje(), fim = ultimoDiaRevisao();
  const cabe = Math.max(1, Math.round((db.metaDiariaMin || CONFIG.META_DIARIA_MIN) / CONFIG.MINUTOS_POR_ITEM));
  const anda = r => ehRetomada(r) && !r.manual;
  const peso = r => Math.max(0, ...fichasDaRevisao(r).map(dificuldadeDaFicha));
  const porDia = new Map();
  const por = (d, r) => { if (!porDia.has(d)) porDia.set(d, []); porDia.get(d).push(r); };
  db.revisoes.forEach(r => { if (!r.feita && r.data >= hoje) por(r.data, r); });
  const ultimo = () => [...porDia.keys()].sort().pop() || hoje;
  for (let dia = hoje; dia <= ultimo(); dia = D.soma(dia, 1)){
    const lista = porDia.get(dia) || [];
    if (lista.length <= cabe) continue;
    const fixos = lista.filter(r => !anda(r)), moveis = lista.filter(anda).sort((a,b) => peso(b) - peso(a));
    const sobra = moveis.slice(Math.max(0, cabe - fixos.length));
    const prox = foraDaProva(D.soma(dia, 1));
    if (!sobra.length || prox > fim) continue;
    sobra.forEach(r => { r.data = prox; por(prox, r); });
    porDia.set(dia, lista.filter(r => !sobra.includes(r)));
  }
}
/** `dia` + `passo`; religando, o que cai antes de hoje conta como feito e anda mais um passo */
function pularPassadas(dia, passo){
  let q = D.soma(dia, passo);
  if (contarDoUltimoEstudo && passo > 0) while (q < D.hoje()) q = D.soma(q, passo);
  return q;
}

/* ABA DISCIPLINAS. O cadastro num lugar só: ver o que existe, renomear (em todo
   o sistema), fechar e reabrir — por conteúdo ou pela disciplina inteira.
   Concluir a disciplina conclui todos os conteúdos abertos dela de uma vez. */
function telaConteudos(){
  const todas = disciplinas();
  /* O filtro é só uma lente: os números do resumo continuam falando do filtrado,
     e a lista de disciplinas do filtro é sempre a completa — senão, escolher uma
     apagaria o caminho de volta para as outras. */
  const cdc = filtroDiscCont("c", { discs: todas, itens: conteudosCad() });
  const filtro = cdc.disc;
  const discs = filtro ? [filtro] : todas;
  // com um conteúdo escolhido, a disciplina mostra só ele
  const daDisc = d => conteudosDaDisciplina(d).filter(c => !cdc.cont || chaveDaFicha(c) === cdc.cont);
  const fichas = discs.reduce((n, d) => n + daDisc(d).length, 0);
  const emAndamento = discs.reduce((n, d) =>
    n + daDisc(d).filter(c => c.fase !== "concluido" && !aEstudar(c)).length, 0);
  const nAEstudar = discs.reduce((n, d) => n + daDisc(d).filter(aEstudar).length, 0);

  const nConcl = discs.reduce((n, d) => n + daDisc(d).filter(c => c.fase === "concluido").length, 0);

  /* LAYOUT (04/10, junto com o Juntar). No padrão das outras abas: os botões
     de criar ficam acima do card, lado a lado (como na Agenda); o card abre
     com título e contagem (como em Sessões), o filtro e os números em quadros.
     Cada disciplina tem a barra do quanto já foi concluído; cada conteúdo, um
     selo com a situação — antes ela era só uma palavra no meio da linha. */
  /* + NOVO CONTEÚDO obedece ao filtro: cria na disciplina escolhida nele. Em
     "Todas", a janela pede a disciplina (travado, o botão não respondia ao
     toque e a explicação morava num title que o celular não mostra). */
  const alvoNovo = filtro || (todas.length === 1 ? todas[0] : "");
  let h = '<div class="linha-add">' +
    '<button class="btn-add" data-acao="nova-disciplina"><span class="mais">+</span> Nova disciplina</button>' +
    (todas.length
      ? '<button class="btn-add" data-acao="novo-conteudo"' + (alvoNovo ? ' data-disc="'+esc(alvoNovo)+'"' : '') + '>' +
        '<span class="mais">+</span> Novo conteúdo</button>' : '') +
    '</div>';

  h += '<div class="card tela-disciplinas"><h2>Disciplinas <span class="dica">' +
    (discs.length ? discs.length + (discs.length === 1 ? " disciplina" : " disciplinas") + ' · ' +
                    fichas + (fichas === 1 ? " conteúdo" : " conteúdos") : "nenhuma ainda") + '</span></h2>';

  if (ligacoesAtivas())
    h += '<p class="sub">Vestibular com ' + diasDeProva().length + ' dias de prova: se quiser, ligue a disciplina ' +
      '(ou um conteúdo) ao dia em que ela cai. O conteúdo ligado é cobrado até a véspera do dia dele e fica em ' +
      'silêncio até o último dia de prova; depois volta normalmente. <b>É opcional</b> — sem ligação, vale até ' +
      'o último dia, como sempre.</p>';

  // o filtro de disciplina e conteúdo, igual ao das outras abas (filtroDiscCont)
  if (todas.length)
    h += '<div class="filtros"><div class="filtros-campos">' + cdc.html + '</div>' +
      (filtro || cdc.cont
        ? '<div class="filtros-acoes"><span class="marca-filtro">filtro ativo</span><span class="spacer"></span>' +
          '<button class="btn mini ghost" data-acao="limpar-filtro-conteudos">limpar filtros</button></div>' : '') +
      '</div>';

  if (fichas)
    h += '<div class="tiles tiles-disc">' +
      tile("Em andamento", String(emAndamento), emAndamento ? "a agenda chama para continuar" : "nada aberto agora") +
      tile("A estudar", String(nAEstudar), nAEstudar ? "ainda sem sessão" : "tudo já começado") +
      tile("Concluídos", String(nConcl), "de " + fichas + (fichas === 1 ? " conteúdo" : " conteúdos"),
           '<div class="barra"><i class="'+(nConcl === fichas ? "cheia" : "")+'" style="width:'+Math.round(nConcl / fichas * 100)+'%"></i></div>',
           nConcl === fichas ? "bom" : "accent") +
      '</div>';

  h += discs.length
    ? discs.map(d => {
        // o cabeçalho (contagens e concluir/reabrir a disciplina) fala da disciplina INTEIRA;
        // a lista embaixo obedece ao filtro de conteúdo
        const itens = conteudosDaDisciplina(d), lista = daDisc(d);
        const abertos = itens.filter(c => c.fase !== "concluido").length;
        const nov = itens.filter(aEstudar).length;
        const andando = abertos - nov;
        const fechados = itens.length - abertos;
        const resumo = [itens.length + (itens.length === 1 ? " conteúdo" : " conteúdos")];
        if (andando) resumo.push(andando + " em andamento");
        if (nov) resumo.push(nov + " a estudar");
        if (fechados) resumo.push(fechados + (fechados === 1 ? " concluído" : " concluídos"));
        return '<div class="grupo-rev disc-bloco'+(abertos ? " aberto" : "")+'">' +
          '<div class="linha cab"><div class="disc-tit"><strong>'+esc(d)+'</strong>' +
            '<span class="disc-resumo">' + esc(resumo.join(" · ")) + '</span></div>' +
          '<span class="spacer"></span><div class="disc-acoes">' +
          (ligacoesAtivas() ? seletorDiaDisciplina(d) : '') +
          (itens.length >= 2
            ? '<button class="act atalho" data-acao="juntar-conteudos" data-disc="'+esc(d)+'" ' +
              'title="Dois ou mais conteúdos viram um só, daqui para a frente">⊕ juntar</button>' : '') +
          '<button class="act atalho" data-acao="renomear-disciplina" data-disc="'+esc(d)+'" ' +
            'title="Renomear em todo o sistema — nas sessões, na agenda e nas anotações">✎ editar</button>' +
          /* o "a estudar" não conta: sem nada estudado em aberto, sobra reabrir o
             que foi fechado — ou nenhum dos dois, numa disciplina só de edital */
          (andando
            ? '<button class="act atalho" data-acao="concluir-disciplina" data-disc="'+esc(d)+'"' +
              (nov ? ' title="' + (nov === 1 ? 'O conteúdo a estudar fica' : 'Os '+nov+' conteúdos a estudar ficam') + ' de fora"' : '') + '>✓ concluir disciplina</button>'
            : itens.length > abertos
              ? '<button class="act atalho" data-acao="reabrir-disciplina" data-disc="'+esc(d)+'">reabrir disciplina</button>'
              : '') +
          '</div></div>' +
          (itens.length ? '<div class="barra disc-barra" title="' + fechados + ' de ' + itens.length + ' concluídos">' +
            '<i class="'+(fechados === itens.length ? "cheia" : "")+'" style="width:'+Math.round(fechados / itens.length * 100)+'%"></i></div>' : '') +
          (lista.length
            ? lista.map(c => linhaConteudo(d, c)).join("")
            : '<div class="vazio" style="padding:14px">Nenhum conteúdo cadastrado nesta disciplina.</div>') +
          '</div>';
      }).join("")
    : '<div class="vazio"><strong>Nenhuma disciplina ainda</strong>' +
      'Use o <b>+ Nova disciplina</b> acima — ou registre uma sessão na aba <b>Sessões</b>, que cria a disciplina junto.</div>';

  return h + '</div>';
}
/** um conteúdo na aba Disciplinas: nome e situação; embaixo (ou à direita) dificuldade e ações */
function linhaConteudo(d, c){
  const nSess = sessoesDoConteudo(d, [c.nome]).length;
  const fechado = c.fase === "concluido";
  const selo = fechado ? '<span class="badge b-bom">concluído</span>'
             : nSess ? '<span class="badge b-misto">em andamento</span>'
             : '<span class="badge">a estudar</span>';
  const juntos = (c.juntados || []).map(j => j.nome);
  return '<div class="item item-conteudo'+(juntos.length ? " juntado" : "")+'">' +
    '<div class="corpo">' +
      '<div class="cont-nome"><span class="titulo">'+esc(c.nome)+'</span>' + selo + '</div>' +
      '<div class="meta">'+nSess+(nSess === 1 ? " sessão" : " sessões") +
        (fechado && c.concluidoEm ? ' · concluído em ' + D.br(c.concluidoEm) : '') + '</div>' +
      (juntos.length
        ? '<div class="meta juntou">⊕ juntou ' + esc(juntos.slice(0, -1).join(", ") + " e " + juntos[juntos.length - 1]) +
          (c.juntadoEm ? ' em ' + D.br(D.iso(new Date(c.juntadoEm))) : '') + '</div>' : '') +
      (ligacoesAtivas() ? '<div class="meta dia-cont">Dia de prova: ' + seletorDiaConteudo(c) + '</div>' : '') +
      metaAteProva(c) +
      (fechado && c.semAutomaticas && autoRevisoes()
        ? '<div class="meta sem-auto">revisões automáticas desligadas — só as que você marcar</div>' : '') +
      (fechado && !c.semAutomaticas && inicioDasAutomaticas(c) && autoRevisoes()
        ? '<div class="meta sem-auto">revisões automáticas voltam em ' + D.br(c.automaticasDesde) + '</div>' : '') +
    '</div>' +
    '<div class="cont-acoes">' +
      seletorDificuldadeConteudo(c, nSess) +
      '<button class="act" data-acao="renomear-conteudo" data-disc="'+esc(d)+'" data-cont="'+esc(c.nome)+'">✎ editar</button>' +
      (juntos.length
        ? '<button class="act" data-acao="separar-conteudo" data-disc="'+esc(d)+'" data-cont="'+esc(c.nome)+'" ' +
          'title="Volta a ' + esc(juntos.join(", ")) + '">⇆ separar</button>' : '') +
      '<button class="act" data-acao="'+(fechado ? "reabrir-conteudo" : "concluir-conteudo")+'" ' +
        'data-disc="'+esc(d)+'" data-conts="'+esc(c.nome)+'">' + (fechado ? "reabrir" : "✓ concluir") + '</button>' +
    '</div></div>';
}

/** a dificuldade do conteúdo, editável na linha (vale para o sistema todo — ver definirDificuldadeDoConteudo) */
function seletorDificuldadeConteudo(c, nSess){
  const atual = nSess ? dificuldadeDaFicha(c) : (c.dificuldade ? tresNiveis(c.dificuldade) : 0);
  return '<select class="sel-dif-cont" data-disc="'+esc(c.disciplina)+'" data-cont="'+esc(c.nome)+'" ' +

/* ---------- revisões até a prova, escolhidas por conteúdo ---------- */
/** a linha que diz, no conteúdo, que as revisões até a prova são da pessoa */
function metaAteProva(c){
  const prova = pausaAteProva(c);
  if (!prova) return '';
  const n = pendentesAteProva(c, prova).length;
  return '<div class="meta ate-prova">' + (n ? n + (n === 1 ? " revisão escolhida" : " revisões escolhidas") : "nenhuma revisão escolhida") +
    ' até ' + D.br(prova) + ' — automático pausado até lá</div>';
}

/** os dias em que dá para marcar revisão até a prova: de hoje à véspera, fora dos dias de prova */
function diasAteProva(prova){
  const lista = [];
  for (let d = D.hoje(); d < prova; d = D.soma(d, 1)) if (!diaDeProva(d)) lista.push(d);
  return lista;
}
/** n datas espalhadas por igual até a véspera — a última cai na véspera */
function sugerirDatasAteProva(n, prova){
  const dias = diasAteProva(prova);
  if (!dias.length) return [];
  n = Math.max(1, Math.min(n, dias.length));
  const out = [];
  for (let i = 1; i <= n; i++){
    let j = Math.round(i * (dias.length - 1) / n);
    if (n === dias.length) j = i - 1;
    while (out.includes(dias[j]) && j < dias.length - 1) j++;
    out.push(dias[j]);
  }
  return [...new Set(out)].sort();
}
/* A JANELA "REVISÕES ATÉ A PROVA". Dois modos: Automáticas (a escada de
   sempre) ou Personalizar — quantas revisões e o dia de cada uma; a plataforma
   só sugere datas espaçadas por igual até a véspera. */
function modalRevisoesProva(ficha, escolherConteudo){
  const prova = dataProvaDaFicha(ficha);
  if (!prova){ toast("Sem prova marcada à frente — as revisões seguem automáticas."); return; }
  const dias = diasAteProva(prova);
  if (!dias.length){ toast("A prova é amanhã: não sobra dia para escolher revisões."); return; }
  const maximo = Math.min(dias.length, 30);
  const escolhendo = !!pausaAteProva(ficha);
  const atuais = pendentesAteProva(ficha, prova).map(r => r.data).filter(d => d >= D.hoje() && d < prova && !diaDeProva(d));
  const iniciais = atuais.length ? [...new Set(atuais)].slice(0, maximo) : sugerirDatasAteProva(Math.min(3, maximo), prova);
  const linhaData = (d, i) => '<div class="linha data-prova-rev"><span class="num">' + (i + 1) + 'ª</span>' +
    '<input type="date" name="dataRev" value="' + esc(d) + '" min="' + D.hoje() + '" max="' + dias[dias.length - 1] + '" ' +
    'aria-label="Data da ' + (i + 1) + 'ª revisão"><span class="dia-semana">' + esc(D.semana(d)) + '</span></div>';
  abrirModal("Revisões até a prova",
    '<form id="formRevProva">' +
    (escolherConteudo
      ? '<div class="campos">' + campo("Conteúdo (só os concluídos)",
          '<select name="conteudoProva">' + conteudosCad().filter(podeEscolherAteProva)
            .sort((a,b) => (a.disciplina + " " + a.nome).localeCompare(b.disciplina + " " + b.nome, "pt-BR"))
            .map(c => '<option value="' + esc(chaveDaFicha(c)) + '"' + (c === ficha ? " selected" : "") + '>' +
                      esc(c.nome) + ' — ' + esc(c.disciplina) + (pausaAteProva(c) ? ' (personalizado)' : '') + '</option>').join("") +
          '</select>', true) + '</div>'
      : '') +
    '<p class="intro-rev-prova"><b>' + esc(ficha.nome) + '</b> · ' + esc(ficha.disciplina) +
      '<br>Prova em ' + D.br(prova) + ' — faltam ' + D.dif(D.hoje(), prova) + ' dias.</p>' +
    '<div class="campos">' +
    '<div class="campo largo"><span>Como revisar até a prova</span><div class="opcoes">' +
      '<label class="opcao"><input type="radio" name="modo" value="auto"' + (escolhendo ? "" : " checked") + '>' +
        '<span>Automáticas — a plataforma marca</span></label>' +
      '<label class="opcao"><input type="radio" name="modo" value="eu"' + (escolhendo ? " checked" : "") + '>' +
        '<span>Personalizar</span></label>' +
    '</div></div>' +
    '<div class="campo largo painel-rev-prova" id="painelRevProva"' + (escolhendo ? "" : " hidden") + '>' +
      campo("Quantas revisões até a prova",
            '<input type="number" name="quantas" min="1" max="' + maximo + '" value="' + iniciais.length + '" inputmode="numeric">',
            false) +
      '<div class="lista-datas-prova" id="datasRevProva">' + iniciais.map(linhaData).join("") + '</div>' +

    '</div></div>' +
    '<div class="linha acoes-form"><button class="btn" type="submit">Salvar</button>' +
    '<button class="btn ghost" type="button" data-acao="fechar-modal">Cancelar</button>' +
    '<span class="erro-form" id="erroRevProva"></span></div></form>',
    () => {
      const f = $("#formRevProva"), painel = $("#painelRevProva"), lista = $("#datasRevProva");
      const quantas = f.querySelector('[name="quantas"]');
      const trocaConteudo = f.querySelector('[name="conteudoProva"]');
      if (trocaConteudo) trocaConteudo.addEventListener("change", () => {
        const outra = conteudosCad().find(c => chaveDaFicha(c) === trocaConteudo.value);
        if (outra) modalRevisoesProva(outra, true);
      });
      const modo = () => (f.querySelector('[name="modo"]:checked') || {}).value;
      const semana = () => lista.querySelectorAll(".data-prova-rev").forEach(l => {
        const v = l.querySelector("input").value;
        l.querySelector(".dia-semana").textContent = v ? D.semana(v) : "";
      });
      f.querySelectorAll('[name="modo"]').forEach(r => r.addEventListener("change", () => {
        painel.hidden = modo() !== "eu";
      }));
      quantas.addEventListener("input", () => {
        const n = parseInt(quantas.value, 10);
        if (!(n >= 1 && n <= maximo)) return;
        lista.innerHTML = sugerirDatasAteProva(n, prova).map(linhaData).join("");
      });
      lista.addEventListener("input", semana);
      f.addEventListener("submit", ev => {
        ev.preventDefault();
        const erro = $("#erroRevProva");
        if (modo() !== "eu"){
          definirRevisoesProva(ficha, null);
          persistir(); fecharModal(); render();
          toast(escolhendo ? "“" + ficha.nome + "” voltou às revisões automáticas." : "As revisões continuam automáticas.");
          return;
        }
        const n = parseInt(quantas.value, 10);
        if (!(n >= 1 && n <= maximo)){ erro.textContent = "Escolha de 1 a " + maximo + " revisões."; return; }
        const datas = [...lista.querySelectorAll('[name="dataRev"]')].map(i => i.value);
        if (datas.some(d => !d)){ erro.textContent = "Preencha a data de cada revisão."; return; }
        if (datas.some(d => d < D.hoje() || d >= prova)){ erro.textContent = "As datas vão de hoje até a véspera da prova."; return; }
        if (datas.some(diaDeProva)){ erro.textContent = "Uma das datas cai num dia de prova."; return; }
        if (new Set(datas).size !== datas.length){ erro.textContent = "Há duas revisões no mesmo dia."; return; }
        definirRevisoesProva(ficha, datas);
        persistir(); fecharModal(); render();
        toast(datas.length + (datas.length === 1 ? " revisão marcada" : " revisões marcadas") + " até " + D.br(prova) +
              " para “" + ficha.nome + "”. Depois da prova, o automático volta.");
      });
    });
}

/* Mudou uma ligação. Desde que a prova deixou de cortar o plano (limiteDe é o
   mesmo para todos), a ligação não muda DATA nenhuma: ela só decide o SILÊNCIO,
   que é lido na hora de mostrar a agenda. Por isso nada é replanejado — antes
   havia aqui uma comparação de limites que nunca dava diferença. */
function mudarLigacao(disc, nome, valor){
  if (nome){
    const ficha = acharConteudo(disc, nome); if (!ficha) return;
    if (valor) ficha.diaProva = valor; else delete ficha.diaProva;
  } else {
    if (valor) vestibular().disciplinas[disc] = valor; else delete vestibular().disciplinas[disc];
  }
  garantirAgenda();
}

/* A LISTA COLADA. Edital vem de todo jeito: um por linha, numerado ("1. Crase",
   "2) Regência", "1.1 Lei 8.112"), com marcador ("-", "•", "a)"), ou numerado
   numa linha só ("1. Crase 2. Regência"). A marca do começo sai; o número que é
   parte do nome fica ("Lei 8.112/1990", "3 Poderes" — sem pontuação depois do
   número, ele não é marca). */
function separarLista(txt){
  // "1.", "1)", "1 -", "1.1.", "1.1 ", "a)", "-", "•" — com ou sem espaço antes do nome
  const marca = /^\s*(?:\(?\d{1,3}(?:\.\d{1,3})*\s*[.)\-–:]\s*(?=\D)|\d{1,3}(?:\.\d{1,3})+\s+|[a-zA-Z]\)\s*|[-–•*·▪]\s+)/;
  const item = "\\(?\\d{1,3}[.)]\\s*(?=[^\\d\\s.])";   // "1. X", "2)X" — "8.112" não é item
  const numerado = new RegExp("(?:^|\\s)" + item, "g");
  /* Linha com vários itens numerados vira vários. Se ela não começa por um
     número ("Crase 2. Regência 3. Sintaxe"), só divide quando a numeração é
     seguida (2, 3, 4…) — "Windows 10. Excel" não é lista. */
  const partir = linha => {
    const nums = (linha.match(numerado) || []).map(m => parseInt(m.replace(/\D/g, ""), 10));
    const seguida = nums.every((n, i) => !i || n === nums[i - 1] + 1);
    const divide = new RegExp("^\\s*" + item).test(linha) ? nums.length > 1
                                                       : nums[0] === 2 && seguida;   // "X 2. Y 3. Z"
    return divide ? linha.split(new RegExp("\\s+(?=" + item + ")")) : [linha];
  };
  return String(txt || "").split(/\r?\n/).flatMap(partir)
    .map(n => n.replace(marca, "").trim().replace(/\s+/g, " ")).filter(Boolean);
}

   colar o edital. A ficha nasce sem sessão, então nada entra na agenda: quem

      if (!disc){ $("#erroNovosConteudos").textContent = "Escolha a disciplina."; $("#novosDisc").focus(); return; }
      const vistos = new Set();

          const k = n.toLowerCase();

          vistos.add(k); return true;

      if (!nomes.length){ $("#erroNovosConteudos").textContent = "Escreva pelo menos um conteúdo."; return; }
      const novos = nomes.filter(n => !acharConteudo(disc, n));
      novos.forEach(n => registrarConteudo(disc, n));
      const pulados = nomes.length - novos.length;
      if (!novos.length){ $("#erroNovosConteudos").textContent =
        nomes.length === 1 ? "Esse conteúdo já existe em " + disc + "." : "Todos já existem em " + disc + "."; return; }
      persistir(); fecharModal(); render();
      toast(novos.length + (novos.length === 1 ? " conteúdo criado" : " conteúdos criados") + " em " + disc +
            (pulados ? " · " + pulados + " já existia(m)" : "") + ".");
    }));
}

/* Lê e valida. Data nova precisa ser futura; a que já estava gravada pode ter
   passado (entre dois dias de prova, o primeiro já foi) e não trava o salvar. */
function lerObjetivo(raiz){
  const hoje = D.hoje();
  const escolhido = (raiz.querySelector('[name="objetivo"]:checked') || {}).value || "livre";
  const saida = { objetivo: escolhido, dataProva: db.dataProva || "", dias: vestibular().dias, erro: "" };
  const nova = (data, antiga) => data && data !== antiga;
  if (escolhido === "concurso"){
    const d = (raiz.querySelector('[name="dataProva"]') || {}).value || "";
    if (nova(d, db.dataProva) && d <= hoje) saida.erro = "A data da prova precisa ser depois de hoje.";
    saida.dataProva = d;
  }
  if (escolhido === "vestibular"){
    const dias = [];
    raiz.querySelectorAll(".dia-prova").forEach((linha, i) => {
      const nome = linha.querySelector('[name="diaNome"]').value.trim();
      const data = linha.querySelector('[name="diaData"]').value;
      if (!nome && !data) return;                              // linha em branco: ignorada
      const antigo = vestibular().dias.find(x => x.id === linha.dataset.id);
      const rotulo = nome || (i + 1) + "º dia";
      if (!data){ saida.erro = saida.erro || "Informe a data de “" + rotulo + "”."; return; }
      if (nova(data, antigo && antigo.data) && data <= hoje)
        saida.erro = saida.erro || "“" + rotulo + "” precisa ser depois de hoje.";
      dias.push({ id: linha.dataset.id || uid(), nome: nome, data: data });
    });
    dias.sort((a,b) => a.data.localeCompare(b.data));
    dias.forEach((d, i) => { if (!d.nome) d.nome = (i + 1) + "º dia"; });
    const repetida = dias.find((d, i) => i && d.data === dias[i-1].data);
    if (repetida) saida.erro = saida.erro || "Dois dias de prova na mesma data (" + D.brFull(repetida.data) + ").";
    saida.dias = dias;
  }
  return saida;
}
/* Grava o objetivo. Devolve se o horizonte mudou (quem chama replaneja).
   A pergunta do pós-prova é zerada quando o modo muda ou quando entra um
   último dia novo à frente: é um ciclo novo, e um "encerrei" ou "continuo"
   antigo deixaria a agenda parada ou a pergunta muda para sempre. */
function aplicarObjetivo(novo){
  const antes = { objetivo: objetivo(), ultima: ultimaProva(), dias: JSON.stringify(diasDeProva()) };
  db.objetivo = novo.objetivo;
  if (novo.objetivo === "concurso") db.dataProva = novo.dataProva;
  if (novo.objetivo === "vestibular"){ vestibular().dias = novo.dias; limparLigacoes(); }
  const mudouModo = antes.objetivo !== objetivo();
  if (mudouModo || (ultimaProva() !== antes.ultima && ultimaProva() > D.hoje())) db.posProva = "";
  return mudouModo || JSON.stringify(diasDeProva()) !== antes.dias;
}
/** ligações a um dia que deixou de existir são desfeitas: o conteúdo volta a valer até o último dia */
function limparLigacoes(){
  const v = vestibular(), ids = new Set(v.dias.map(d => d.id));
  Object.keys(v.disciplinas).forEach(k => { if (!ids.has(v.disciplinas[k])) delete v.disciplinas[k]; });
  conteudosCad().forEach(c => { if (c.diaProva && c.diaProva !== "-" && !ids.has(c.diaProva)) delete c.diaProva; });
}
/** frase curta do que ficou valendo, para o aviso depois de salvar */
function fraseObjetivo(){
  if (objetivo() === "livre") return "Estudo contínuo — revisões em intervalos crescentes.";
  const dias = diasDeProva();
  if (!dias.length) return nomeObjetivo() + " com data a definir — a agenda segue sem prazo por enquanto.";
  if (objetivo() === "concurso") return "Prova em " + D.brFull(dias[0].data) + " — cronograma refeito.";
  return dias.length + (dias.length === 1 ? " dia de prova" : " dias de prova") +
         ", o último em " + D.brFull(dias[dias.length-1].data) + " — cronograma refeito.";
}

function baixarDanificado(){
  let txt = "";
  try { txt = localStorage.getItem(CHAVE_DANIFICADO) || ""; } catch(e){}
  if (!txt){ toast("Não há cópia danificada guardada."); return; }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([txt], { type: "application/json" }));
  a.download = "estudos-danificado-" + D.hoje() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

/* DESLIGAR O AUTOMÁTICO. O que o sistema tinha marcado e ainda está pendente
   vira seu (manual: o replanejamento não reescreve) ou sai, conforme você
   escolher. O que já foi feito é história e fica.
   A que vira sua pelo "Manter" leva a marca `doAutomatico` (defeito achado pelo
   Pedro em 06/10: sem ela, desligar → ligar → desligar com "Apagar" não apagava
   nada, porque tudo já parecia marcado à mão). Com a marca, religar devolve a
   revisão ao automático (religarAgendaAutomatica) e o "Apagar" a alcança.
   Editar a revisão (salvarRevisaoManual) tira a marca: aí ela é sua de verdade.
   `modo`: "manter", "apagar" (só as automáticas pendentes) ou "tudo" (pedido do
   Pedro, 06/10: toda revisão pendente sai, automática ou sua — começar do zero).
   "revisoes" e "continuar" (pedido do Pedro, 07/10) apagam só um dos dois tipos
   de automática; o outro fica, como no "Manter".
   `tipo` (opcional): só mexe nos itens daquele tipo — é o que acontece quando
   um dos dois sai do automático e o outro continua (ver tiposAutomaticos). */
function desligarAgendaAutomatica(modo, tipo){
  const doTipo = r => !tipo || tipoDoItem(r) === tipo;
  const automatica = r => !r.feita && doTipo(r) && (!r.manual || r.doAutomatico);
  const sai = modo === "tudo" ? r => !r.feita
            : modo === "apagar" ? automatica
            : modo === "revisoes" ? r => automatica(r) && !ehRetomada(r)
            : modo === "continuar" ? r => automatica(r) && ehRetomada(r)
            : () => false;
  db.revisoes = db.revisoes.filter(r => !sai(r));
  db.revisoes.forEach(r => { if (!r.feita && !r.manual && doTipo(r)){ r.manual = true; r.doAutomatico = true; } });
}
/* `tipos`: os que voltam ao automático (padrão: os dois) */
function religarAgendaAutomatica(tipos){
  const voltam = tipos || TIPOS_AUTO;
  db.revisoes.forEach(r => {
    if (!r.doAutomatico || !voltam.includes(tipoDoItem(r))) return;
    if (!r.feita) r.manual = false;
    delete r.doAutomatico;
  });
}
/* O MESMO, NUM CONTEÚDO SÓ (ver escadaAtiva). As revisões pendentes dele que eram
   automáticas viram suas ou saem; as escolhidas até a prova viram revisões comuns
   suas (o modo "até a prova" acaba: não há automático para voltar depois). Item
   que fala também de outro conteúdo só perde este — a parte dele, se fica, vira
   um item próprio e manual, sem mexer no plano do outro. */
function desligarAutomaticasDoConteudo(ficha, apagar){
  if (!ficha) return;
  const chave = chaveDaFicha(ficha);
  const novos = [];
  db.revisoes = db.revisoes.filter(r => {
    if (r.feita || ehRetomada(r) || !falaDe(r, chave)) return true;
    const ctx = contextoRevisao(r);
    const meus = ctx.assuntos.filter(a => chaveAssunto(ctx.disciplina, a) === chave);
    const resto = ctx.assuntos.filter(a => chaveAssunto(ctx.disciplina, a) !== chave);
    const fica = r.manual || !apagar;
    if (!resto.length){
      if (!fica) return false;
      r.manual = true; delete r.planoProva;
      return true;
    }
    r.assuntos = resto;
    if (fica) novos.push(Object.assign({}, r, { id: uid(), assuntos: meus, manual: true }));
    return true;
  });
  novos.forEach(n => { delete n.planoProva; db.revisoes.push(n); });
  delete ficha.revisoesProva;
  delete ficha.automaticasDesde;
  ficha.semAutomaticas = true;
}
/* `desde`: a partir de quando a escada volta (vazio ou passado = hoje) */
function religarAutomaticasDoConteudo(ficha, desde){
  if (!ficha) return;
  delete ficha.semAutomaticas;
  if (desde && desde > D.hoje()) ficha.automaticasDesde = desde;
  else delete ficha.automaticasDesde;
  continuarEscada(ficha);
  juntarIrmas();
}

/** abre a seção da ajuda, leva até ela e marca no sumário */
function irParaAjuda(id){
  const sec = document.getElementById(id); if (!sec) return;
  sec.open = true;
  if (sec.scrollIntoView) sec.scrollIntoView({ behavior: "smooth", block: "start" });
  document.querySelectorAll(".aj-sumario a").forEach(a =>
    a.dataset.alvo === id ? a.setAttribute("aria-current", "true") : a.removeAttribute("aria-current"));
}
/* As caixas da retomada mostram, apagado, o número que está VALENDO. Ele muda
   com o tempo de estudo previsto e o "revisar até" — então a tela recalcula na
   hora em que um deles muda, antes de salvar. */
function atualizarDiasPadraoAjustes(){
  const f = document.getElementById("formAjustes"); if (!f) return;
  const val = n => (f.querySelector('[name="'+n+'"]') || {}).value || "";
  const fim = fimDoEstudoPrevisto(val("estudoAte"), val("revisarAte"));
  [1,2,3].forEach(n => { const el = document.getElementById("padraoVolta"+n); if (el) el.textContent = textoPadraoVolta(diasDaVoltaPadrao(n, fim)); });
}
function ligarAjustes(){
      ligarCamposObjetivo();
      ["estudoAte","revisarAte"].forEach(n => {
        const el = document.querySelector('#formAjustes [name="'+n+'"]');
        if (el){ el.addEventListener("input", atualizarDiasPadraoAjustes); el.addEventListener("change", atualizarDiasPadraoAjustes); }
      });
      const auto = document.querySelector('#formAjustes [name="automatico"]'), painel = $("#painelAutomatico");
      if (auto && painel) auto.addEventListener("change", () => painel.classList.toggle("aberto", !auto.checked));
      /* O que criar: aparece com a chave ligada. Tirar um tipo que estava valendo
         abre a pergunta sobre o que dele já está na agenda. */
      const atualizarTipos = () => {
        const tipos = $("#painelTipos"), sai = $("#painelTipoSai");
        if (!auto || !tipos) return;
        tipos.classList.toggle("aberto", auto.checked);
        const marcado = document.querySelector('#formAjustes [name="tiposAuto"]:checked');
        const novos = tiposDaEscolha(marcado && marcado.value);
        const tirado = agendaAutomatica() && auto.checked ? tiposAutomaticos().find(t => !novos.includes(t)) : null;
        sai.classList.toggle("aberto", !!tirado);
        if (!tirado) return;
        const rev = tirado === "revisoes";
        $("#rotuloTipoSai").textContent = rev ? "As revisões automáticas que já estão na agenda"
                                              : "Os cards de continuar automáticos que já estão na agenda";
        $("#tipoSaiManter").textContent = rev ? "Manter — passam a ser suas" : "Manter — passam a ser seus";
        $("#tipoSaiApagar").textContent = rev ? "Apagar as pendentes" : "Apagar os pendentes";
      };
      if (auto) auto.addEventListener("change", atualizarTipos);
      document.querySelectorAll('#formAjustes [name="tiposAuto"]').forEach(el => el.addEventListener("change", atualizarTipos));
      atualizarTipos();
      $("#formAjustes").addEventListener("submit", async ev => {   // async: a confirmação do "apagar todas"
        ev.preventDefault();
        const d = Object.fromEntries(new FormData(ev.target).entries());
        const novo = lerObjetivo(ev.target);
        if (novo.erro){ $("#erroAjustes").textContent = novo.erro; return; }
        /* apagar TODAS não tem volta (as marcadas à mão também saem): pergunta antes,
           com a conta do que vai sair. Feitas ficam — são história. */
        if (agendaAutomatica() && !d.automatico && d.jaNaAgenda === "tudo"){
          const n = db.revisoes.filter(r => !r.feita).length;
          if (n && !(await confirmar({ titulo: "Apagar todas as revisões agendadas?", botao: "Apagar todas", perigo: true,
                texto: plural(n, "revisão pendente vai", "revisões pendentes vão") + " sair da agenda, inclusive as que você " +
                       "marcou à mão. As já feitas continuam no histórico." }))) return;
        }
        const tetoAntes = db.revisarAte;
        /* Só o que decide DATAS replaneja. Antes todo "Salvar" refazia a agenda
           inteira contando de hoje — mudar a meta diária remarcava os cards de
           continuar e sumia com os atrasados. */
        const datasAntes = JSON.stringify([db.revisarAte || "", db.estudoAte || "", db.diasRetomada || {},
                                           agendaAutomatica(), db.posProva || "", tiposAutomaticos()]);
        const mudouObjetivo = aplicarObjetivo(novo);
        db.revisarAte = d.revisarAte || "";                   // sem teto de um ano (saiu em 23/09)
        if (db.revisarAte && db.revisarAte <= D.hoje()) db.revisarAte = "";
        if (d.religar) db.posProva = "continuo";
        db.metaDiariaMin = Math.max(15, Number(d.meta) || CONFIG.META_DIARIA_MIN);
        // até quando você pretende estudar: qualquer data à frente
        const ate = d.estudoAte || "";
        db.estudoAte = ate > D.hoje() ? ate : "";
        db.diasRetomada = {};
        [1,2,3].forEach(n => {
          const v = Math.round(Number(d["volta" + n]) || 0);
          if (v >= 1) db.diasRetomada[n] = Math.min(CONFIG.VOLTA_MAX_ESCOLHA, v);
        });
        const automaticoAntes = agendaAutomatica(), automatico = !!d.automatico;
        const tiposAntes = automaticoAntes ? tiposAutomaticos() : [];
        if (automaticoAntes && !automatico) desligarAgendaAutomatica(d.jaNaAgenda || "manter");
        let religou = !!d.religar || (!automaticoAntes && automatico);
        if (automatico){
          // o tipo que sai fica (vira seu) ou é apagado; o que entra volta ao automático
          const novos = tiposDaEscolha(d.tiposAuto);
          if (novos.some(t => !tiposAntes.includes(t))) religou = true;
          tiposAntes.filter(t => !novos.includes(t)).forEach(t => desligarAgendaAutomatica(d.tipoSai === "apagar" ? t : "manter", t));
          religarAgendaAutomatica(novos.filter(t => !tiposAntes.includes(t)));
          if (novos.length === 1) db.automaticoTipos = novos[0]; else delete db.automaticoTipos;
        }
        db.agendaAutomatica = automatico;
        const mudouDatas = mudouObjetivo || datasAntes !== JSON.stringify([db.revisarAte || "", db.estudoAte || "",
                             db.diasRetomada || {}, agendaAutomatica(), db.posProva || "", tiposAutomaticos()]);
        if (mudouDatas) (religou ? replanejarAoReligar : replanejarTudo)();   // religando, conta do último estudo
        persistir(); fecharModal(); render();
        toast(automaticoAntes && !automatico ? "Agendamento automático desligado — a agenda é a sua rotina."
             : !automaticoAntes && automatico ? "Agendamento automático ligado (" + fraseTiposAuto() + ") — cronograma refeito."
             : automatico && tiposAntes.join() !== tiposAutomaticos().join() ? "O agendamento automático agora cria " + fraseTiposAuto() + "."
             : d.religar ? "Agendamento religado — cronograma refeito."
             : db.revisarAte && db.revisarAte !== tetoAntes ? "Revisões agendadas até " + D.brFull(db.revisarAte) + "."
             : mudouObjetivo ? fraseObjetivo()
             : mudouDatas ? "Ajustes salvos — cronograma recalculado."
             : "Ajustes salvos — a agenda continua a mesma.");
      });
}

function atualizarCrono(){
  const c = db.cronometro;
  const chip = document.getElementById("cronoChip");
  const centro = document.getElementById("centroTopo");
  if (centro) centro.classList.toggle("com-crono", !!c);     // a contagem abre espaço para o cronômetro
  if (!c){ if (chip && chip.innerHTML) chip.innerHTML = ""; return; }
  // parado depois da meia-noite, esperando a escolha: o tempo não anda mais
  const t = fmtCrono(Math.floor(((c.parado || Date.now()) - c.inicio)/1000));
  if (chip){
    if (!chip.firstChild){
      const alvo = c.destinoTipo ? alvoCrono(c.destinoTipo, c.destinoId) : null;
      const nome = alvo ? alvo.rotulo : (c.assunto || c.disciplina || "nova sessão");
      chip.innerHTML = '<span class="crono-chip" title="Cronômetro de estudo em andamento">⏱ <b id="cronoChipTempo">'+t+'</b> ' +
        '<span class="nome" title="'+esc(nome)+'">'+esc(nome)+'</span>' +
        '<button class="encerrar" data-acao="crono-encerrar">' + (c.parado ? "escolher o dia" : "encerrar") + '</button></span>';
    }
    const b = document.getElementById("cronoChipTempo"); if (b) b.textContent = t;
  }
  const el = document.getElementById("cronoTempo"); if (el) el.textContent = t;
}

/* ECONOMIA DE ENERGIA (Safari, 05/10: "esta página foi recarregada porque estava
   usando muita energia"). Com a aba escondida, nada anda: o relógio não é
   redesenhado e as animações sem fim (bolinha do cronômetro, rodinha) param. O
   tempo não se perde — ele é contado da hora de início — e ao voltar para a aba
   tudo se atualiza na hora. */
setInterval(() => { if (!document.hidden) atualizarCrono(); }, 1000);
function marcarAbaOculta(){
  document.documentElement.classList.toggle("aba-oculta", document.hidden);
  if (!document.hidden) atualizarCrono();
}
document.addEventListener("visibilitychange", marcarAbaOculta);

const NUVEM = {

const CHAVE_SESSAO = "plataforma-estudos:sessao";
const nuvem = { estado: "desligada", email: "", uid: "", ultimo: null, erro: "", pendente: false };
//              desligada | deslogado | entrando | pronta | sincronizando | offline | erro

const nuvemLigada = () => !!(NUVEM.url && NUVEM.chave);
/* "Conta e sincronização" aparece JÁ na abertura. Antes o item ficava escondido

function gravarSessao(s){

/** chamada crua à API do Supabase — sem SDK, para o arquivo seguir sem dependências */
async function chamarNuvem(caminho, opcoes, comToken){
  const s = lerSessao();
  const cab = Object.assign({ "apikey": NUVEM.chave, "Content-Type": "application/json" },
                            (opcoes && opcoes.headers) || {});
  if (comToken && s) cab["Authorization"] = "Bearer " + s.access_token;
  const r = await fetch(NUVEM.url + caminho, Object.assign({}, opcoes, { headers: cab }));
  if (r.status === 401 && comToken && s && s.refresh_token){
    if (await renovarSessao()) return chamarNuvem(caminho, opcoes, comToken);   // uma segunda chance
  }
  if (!r.ok){
    let msg = r.status + " " + r.statusText, codigo = "";
    try { const e = JSON.parse(await r.text()); msg = e.msg || e.message || e.error_description || msg; codigo = e.error_code || ""; } catch(x){}
    const erro = new Error(msg); erro.status = r.status;     // quem chama distingue "recusado" de "sem conexão"
    erro.codigo = codigo;                                     // o código do Supabase (ex.: "otp_disabled")
    throw erro;
  }
  /* Resposta sem corpo é normal: gravar devolve "201 Created" VAZIO (return=minimal),
     não 204. Ler o vazio como JSON falhava — no Safari com "The string did not
     match the expected pattern." — e a gravação, que tinha dado certo, aparecia
     como "sem conexão". Lê o texto primeiro; vazio vale null. */
  const texto = r.status === 204 ? "" : await r.text();
  return texto.trim() ? JSON.parse(texto) : null;
}
async function renovarSessao(){
  const s = lerSessao(); if (!s || !s.refresh_token) return false;
  try {
    const d = await chamarNuvem("/auth/v1/token?grant_type=refresh_token",
      { method: "POST", body: JSON.stringify({ refresh_token: s.refresh_token }) }, false);
    // o resto da sessão (se a conta já tem senha, por exemplo) atravessa a renovação
    gravarSessao(Object.assign({}, s, { access_token: d.access_token, refresh_token: d.refresh_token,
                   email: (d.user && d.user.email) || s.email, uid: (d.user && d.user.id) || s.uid }));
    return true;
  } catch(e){
    /* SEM CONEXÃO NÃO DESLOGA. Antes qualquer falha apagava a sessão — e, com o
       login obrigatório, estudar sem internet trancaria a pessoa fora do app.
       Só sai quando o Supabase RECUSA a renovação (sessão vencida ou revogada). */
    if (e && e.status >= 400 && e.status < 500){ gravarSessao(null); setTimeout(render, 0); }
    return false;
  }
}
/* ---------- ENTRAR NA CONTA: senha, primeiro acesso e redefinição ----------

   metadados, que já criou a senha (`senha_criada`): é assim que o app sabe se

const sessaoDe = (d, extra) => Object.assign({ access_token: d.access_token, refresh_token: d.refresh_token,
  email: d.user.email, uid: d.user.id, senha: tem(d, "senha_criada"),
  nome: (d.user.user_metadata && d.user.user_metadata.full_name) || "" }, extra || {});

async function entrarComSenha(email, senha){

    { method: "POST", body: JSON.stringify({ email, password: senha }) }, false);

}
/** manda o código de 6 dígitos (criar = pode criar a conta, no primeiro acesso) */
async function pedirCodigo(email, criar){

/** manda o código para redefinir a senha (modelo "Reset Password" do Supabase) */

/** confere o código; tipo "email" (primeiro acesso) ou "recovery" (redefinir). Devolve a resposta crua. */
async function conferirCodigo(email, codigo, tipo){

    { method: "POST", body: JSON.stringify({ email, token: codigo, type: tipo }) }, false);

/** grava a senha da conta logada e marca que ela existe (e o nome, se veio junto) */
async function gravarSenhaNova(senha, nome){

  if (nome) data.full_name = nome;
  await chamarNuvem("/auth/v1/user",
    { method: "PUT", body: JSON.stringify({ password: senha, data }) }, true);

}
/** sessão antiga: pergunta ao Supabase se a conta já tem senha e qual o nome dela */
async function conferirSeTemSenha(){
  const s = lerSessao(); if (!s || (s.senha !== undefined && s.nome !== undefined)) return;
  try {
    const u = await chamarNuvem("/auth/v1/user", { method: "GET" }, true);
    const agora = lerSessao(), meta = (u && u.user_metadata) || {};
    if (agora){ agora.senha = !!meta.senha_criada; agora.nome = meta.full_name || ""; gravarSessao(agora); }
  } catch(e){ /* sem conexão: confere na próxima vez; enquanto isso, não tranca ninguém */ }
}
/** encerra a sessão no Supabase também (se der; sem conexão, basta a local) */
async function encerrarSessaoRemota(token){

async function baixarDaNuvem(){

let tNuvem = null;

/** no arranque: recupera a sessão e decide quem está mais novo, nuvem ou navegador */
async function iniciarNuvem(){
  if (!nuvemLigada()){ nuvem.estado = "desligada"; pintarChipNuvem(); return; }
  const s = lerSessao();
  if (!s){ nuvem.estado = "deslogado"; pintarChipNuvem(); return; }
  if (s.senha === undefined || s.nome === undefined){   // sessão antiga: a conta já tem senha? qual o nome?
    await conferirSeTemSenha();
    if (portaoFechado()){ render(); return; }    // não tem: a tela pede, e a sincronia vem depois
  }
  if (s.senha === false) return;                 // ainda criando a senha (tela de acesso aberta)
  nuvem.email = s.email; nuvem.uid = s.uid;
  try {
    const linha = await baixarDaNuvem();
    /* OUTRA CONTA NESTE NAVEGADOR. O dado daqui sabe de que conta ele é
       (db.contaNuvem). Sem isso, sair da conta A e entrar com B no mesmo
       navegador subia os dados de A para a conta de B (ou os usava por cima dos
       de B, se parecessem mais novos). Agora: pergunta, e troca pelos dados de B
       — os de A continuam na nuvem, na conta de A. Não aceitou: não entra. */
    if (db.contaNuvem && db.contaNuvem !== s.uid){
      const deQuem = db.contaNuvemEmail || "outra conta";
      const temDados = !!(linha && pareceBackup(linha.conteudo));
      if (!(await confirmar({ titulo: "Outra conta neste aparelho", botao: "Entrar e trocar os dados",
                   texto: "Os dados deste navegador são da conta " + deQuem + ".\n\n" +
                   "Entrar como " + s.email + " troca-os pelos dados dessa conta" +
                   (temDados ? "" : " (que ainda não tem nada: a plataforma começa vazia)") + ". " +
                   "Os de " + deQuem + " continuam guardados na nuvem, na conta dela.\n\n" +
                   "Quer uma cópia do que está aqui? Cancele e use Baixar cópia dos dados (no círculo do perfil) antes." }))){
        gravarSessao(null);
        nuvem.estado = "deslogado"; nuvem.email = ""; nuvem.uid = "";
        pintarChipNuvem(); render();
        toast("Entrada cancelada — os dados deste navegador ficaram como estavam.");
        return;
      }
      aplicarDados(temDados ? linha.conteudo : estadoInicial());
      marcarDonoDaNuvem(s);
      persistir(true); render();
      toast(temDados ? "Dados da conta " + s.email + " carregados." : "Conta " + s.email + " começando do zero.");
      nuvem.estado = "pronta"; nuvem.ultimo = Date.now(); pintarChipNuvem();
      return;
    }
    if (linha && pareceBackup(linha.conteudo)){
      const daNuvem = new Date(linha.atualizado_em).getTime();
      const daqui   = dataDoLocal();             // a gravação da própria abertura não conta
      if (daNuvem > daqui + 2000){                 // a nuvem tem algo mais recente
        aplicarDados(linha.conteudo);
        persistir(true); render();
        toast("Dados carregados da nuvem.");
      } else if (daqui > daNuvem){
        await subirParaNuvem();
      }
    } else {
      await subirParaNuvem();                      // primeira vez: sobe o que existe aqui
    }
    marcarDonoDaNuvem(s);                          // daqui em diante, este dado é desta conta
    nuvem.estado = "pronta"; nuvem.ultimo = Date.now();
  } catch(e){ nuvem.estado = "offline"; nuvem.erro = e.message || String(e); }
  pintarChipNuvem();
}
/** grava no próprio dado de que conta ele é (ver "OUTRA CONTA NESTE NAVEGADOR") */
function marcarDonoDaNuvem(s){
  if (db.contaNuvem === s.uid && db.contaNuvemEmail === s.email) return;
  db.contaNuvem = s.uid; db.contaNuvemEmail = s.email;

async function sairDaNuvem(){

/* ==========================================================================
   ARQUIVO LOCAL (.json fora do navegador)
   --------------------------------------------------------------------------
   localStorage some quando se limpa os dados do navegador. Com a File System
   Access API (Chrome/Edge) a plataforma escreve num .json de verdade no disco:
   toda alteração é gravada lá, e limpar o navegador não apaga o arquivo.
   O navegador NÃO deixa uma página abrir um caminho fixo sozinha — é preciso
   escolher o arquivo uma vez (e reautorizar a cada sessão, com um clique).
   Firefox e Safari não têm a API: lá continua valendo o backup manual (↓ / ↑).
   ========================================================================== */
const suportaArquivo = () => typeof window.showSaveFilePicker === "function";
const arq = { handle: null, estado: "desligado", nome: "", ultimo: null, erro: "" };
//            estado: desligado | pronto | permissao | erro | indisponivel

/* o handle do arquivo não cabe no localStorage (não é JSON); vai no IndexedDB */
function bancoHandles(){
  return new Promise((ok, falha) => {
    const req = indexedDB.open("plataforma-estudos", 1);
    req.onupgradeneeded = () => req.result.createObjectStore("arq");
    req.onsuccess = () => ok(req.result);
    req.onerror   = () => falha(req.error);
  });
}
function guardarHandle(h){
  return bancoHandles().then(bd => new Promise((ok, falha) => {
    const t = bd.transaction("arq", "readwrite");
    t.objectStore("arq").put(h, "handle");
    t.oncomplete = () => ok(); t.onerror = () => falha(t.error);
  })).catch(() => {});
}
function lerHandleGuardado(){
  return bancoHandles().then(bd => new Promise((ok) => {
    const r = bd.transaction("arq", "readonly").objectStore("arq").get("handle");
    r.onsuccess = () => ok(r.result || null); r.onerror = () => ok(null);
  })).catch(() => null);
}

let tArquivo = null;
/** grava o estado inteiro no arquivo; chamada a cada alteração (com folga) */
async function gravarArquivo(){
  if (arq.estado !== "pronto" || !arq.handle) return;
  try {
    const fluxo = await arq.handle.createWritable();
    await fluxo.write(JSON.stringify(db, null, 2));
    await fluxo.close();
    arq.ultimo = Date.now(); arq.erro = "";
    pintarChipArquivo();
  } catch(e){
    arq.estado = "erro"; arq.erro = e.message || String(e);
    pintarChipArquivo();
  }
}
function agendarGravacao(agora){
  if (arq.estado !== "pronto") return;
  clearTimeout(tArquivo);
  if (agora) gravarArquivo(); else tArquivo = setTimeout(gravarArquivo, 500);
}
async function lerDoArquivo(){
  const f = await arq.handle.getFile();
  const txt = await f.text();
  if (!txt.trim()) return null;                 // arquivo novo, ainda vazio
  return JSON.parse(txt);
}
/** confere a permissão do handle guardado e, se puder, carrega o arquivo */
async function iniciarArquivo(){
  if (!suportaArquivo()){ arq.estado = "indisponivel"; pintarChipArquivo(); return; }
  const h = await lerHandleGuardado();
  if (!h){ arq.estado = "desligado"; pintarChipArquivo(); return; }
  arq.handle = h; arq.nome = h.name || "estudos.json";
  try {
    const p = await h.queryPermission({ mode: "readwrite" });
    if (p !== "granted"){ arq.estado = "permissao"; pintarChipArquivo(); return; }
    arq.estado = "pronto";
    const d = await lerDoArquivo();
    /* QUEM ESTÁ MAIS NOVO GANHA, como na nuvem. Antes o arquivo substituía o
       navegador sempre: se uma gravação no arquivo tivesse falhado, o que foi
       feito depois (só no navegador) sumia na abertura seguinte. A comparação é
       com o dado COMO ESTAVA ao abrir (dataDoLocal) — a própria abertura grava
       e mexeria na data. Navegador vazio (dados limpos) vale 0: o arquivo
       entra, que é para isso que ele existe. */
    if (pareceBackup(d)){
      if (Number(d.atualizadoEm || 0) >= dataDoLocal()){ aplicarDados(d); persistir(true); render(); }
      else { await gravarArquivo(); toast("O navegador tinha alterações mais novas que o arquivo — o arquivo foi atualizado."); }
    }
    pintarChipArquivo();
  } catch(e){ arq.estado = "erro"; arq.erro = e.message || String(e); pintarChipArquivo(); }
}
/** pede a permissão de volta (precisa vir de um clique) */
async function reconectarArquivo(){
  if (!arq.handle) return escolherArquivo(false);
  try {
    const p = await arq.handle.requestPermission({ mode: "readwrite" });
    if (p !== "granted"){ toast("Permissão negada — o arquivo não será atualizado."); return; }
    arq.estado = "pronto";
    const d = await lerDoArquivo();
    if (pareceBackup(d) && await confirmar({ titulo: "Carregar o arquivo", botao: "Carregar", perigo: true,
          texto: "Carregar os dados do arquivo “" + arq.nome + "”? Isso substitui o que está aberto agora." }))
      aplicarDados(d);
    persistir(true); await gravarArquivo(); render();
    toast("Arquivo reconectado.");
  } catch(e){ arq.estado = "erro"; arq.erro = e.message || String(e); render(); }
}
/** escolhe (ou cria) o arquivo que passa a guardar os dados */
async function escolherArquivo(criar){
  if (!suportaArquivo()){
    avisar("Arquivo no computador", "Este navegador não permite que a página escreva num arquivo. Use o Chrome ou o Edge, " +
          "ou use Baixar cópia dos dados (no círculo do perfil)."); return;
  }
  const tipos = [{ description: "JSON", accept: { "application/json": [".json"] } }];
  try {
    const h = criar ? await window.showSaveFilePicker({ suggestedName: "estudos.json", types: tipos })
                    : (await window.showOpenFilePicker({ types: tipos, multiple: false }))[0];
    const p = await h.requestPermission({ mode: "readwrite" });
    if (p !== "granted"){ toast("Permissão negada."); return; }
    arq.handle = h; arq.nome = h.name; arq.estado = "pronto"; arq.erro = "";
    await guardarHandle(h);
    let d = null;
    try { d = await lerDoArquivo(); } catch(e){ d = null; }
    if (pareceBackup(d)){
      const daqui = db.registros.length, dele = d.registros.length;
      const usarArquivo = await confirmar({ titulo: "O arquivo já tem dados",
        texto: "O arquivo “" + h.name + "” já tem " + plural(dele, "sessão", "sessões") + ". " +
               "Aqui estão abertas " + plural(daqui, "sessão", "sessões") + ".",
        botao: "Usar os dados do arquivo", cancelar: "Manter os daqui" });
      if (usarArquivo) aplicarDados(d);
    }
    persistir(true);
    await gravarArquivo();
    render();
    toast("Agora os dados são gravados em “" + h.name + "”.");
  } catch(e){
    if (e && e.name === "AbortError") return;            // o usuário fechou o seletor
    arq.estado = "erro"; arq.erro = e.message || String(e); render();
    avisar("Arquivo no computador", "Não foi possível usar o arquivo: " + arq.erro);
  }
}
async function desconectarArquivo(){
  if (!(await confirmar({ titulo: "Parar de gravar no arquivo", botao: "Parar",
        texto: "Os dados continuam no navegador e o arquivo fica como está." }))) return;
  arq.handle = null; arq.estado = "desligado"; arq.nome = ""; arq.ultimo = null;
  guardarHandle(null);
  fecharModal(); render(); toast("Arquivo desconectado.");
}

/** chip da conta: em uma linha, se os dados estão indo para a nuvem */
/* A LINHA DA CONTA NO MENU DO PERFIL: "Conta e sincronização", com o mesmo

   o mouse) e, só quando há algo a dizer, numa palavra miúda à direita — "sem

/* os ícones do menu do perfil: traço fino, na cor da marca — os mesmos dos itens fixos do HTML */

const ICONE_ARQUIVO = '<svg class="menu-ic" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/></svg>';
function pintarChipNuvem(){
  const c = document.getElementById("chipNuvem"); if (!c) return;
  const mapa = {
    //              [aviso à direita, classe do aviso, título, esconder]
    desligada:     ["", "", "", true],
    deslogado:     ["entrar", "atencao", "Você não está na conta", false],

    iniciando:     ["carregando…", "", "Carregando a sua conta…", false],

   · Primeiro acesso: e-mail → código de 6 dígitos → crie sua senha.

   window.__semLogin: só as suítes de teste antigas ligam, para abrir o app
   direto; o app de verdade nunca. */
const SENHA_MINIMA = 8;
const exigeLogin = () => nuvemLigada() && !window.__semLogin;

   window.__semApresentacao: só as suítes de teste antigas, para ir direto ao Entrar */

/** os erros do Supabase, em português de gente */
function traduzirErroAcesso(e){
  const m = (e && e.message) || String(e || "");
  if (e instanceof TypeError || /failed to fetch|load failed|networkerror|network request/i.test(m))
    return "Sem conexão com a internet. Confira e tente de novo.";
  if (/invalid login credentials/i.test(m)) return "E-mail ou senha incorretos.";
  /* CADASTRO FECHADO no Supabase e o e-mail ainda não tem conta. Vem ANTES da
     regra do código: a mensagem ("Signups not allowed for otp") tem "otp" e
     virava "Código inválido". Quem já tem conta não passa por aqui. */
  if (/^(otp|signup)_disabled$/.test((e && e.codigo) || "") || /signups? not allowed/i.test(m))
    return "Este e-mail ainda não tem acesso ao app. Caso deseje ter acesso, entre em contato com o administrador.";
  if (/email not confirmed/i.test(m)) return "Este e-mail ainda não foi confirmado — use “Primeiro acesso”.";
  if (/expired|invalid.*token|token.*invalid|otp/i.test(m)) return "Código inválido ou vencido. Peça outro.";
  let x = m.match(/at least (\d+) characters/i);
  if (x) return "A senha precisa ter pelo menos " + x[1] + " caracteres.";
  if (/different from the old password/i.test(m)) return "A nova senha precisa ser diferente da anterior.";
  if (/reauthenticat/i.test(m)) return "Por segurança, saia da conta e entre de novo antes de trocar a senha.";
  if (/weak|pwned|leaked/i.test(m)) return "Essa senha é fraca ou já apareceu em vazamentos. Escolha outra.";
  x = m.match(/after (\d+) seconds?/i);
  if (x) return "Espere " + x[1] + " segundos para pedir outro código.";
  if (/rate limit/i.test(m)) return "Muitas tentativas. Espere alguns minutos e tente de novo.";
  if (/user not found/i.test(m)) return "Este e-mail não tem conta. Fale com quem administra a plataforma.";
  if (/error sending/i.test(m)) return "Não foi possível enviar o e-mail agora. Tente de novo em instantes.";
  return m;
}
